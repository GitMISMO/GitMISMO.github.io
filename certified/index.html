<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current CMSPs and AMSPs | MISMO</title>
<!--
  Current CMSPs and AMSPs (resources.mismo.org/certified/), for the certification pages on mismo.org.
  Lists everyone who holds an active Certified MISMO Standards Professional (CMSP) or Associate MISMO
  Standards Professional (AMSP) designation: name and company only. The list is certified/individuals.json
  beside this page, written by the Individual certifications job in cms-data each time it changes, so
  it is never edited by hand.
  Embed:  <iframe src="https://resources.mismo.org/certified/?program=CMSP" ...>  (or AMSP; no program
  shows both). The page tells its parent its height (postMessage {mismoCertifiedHeight}).
-->
<style>
:root{--navy:#0d314c;--sky:#74bfeb;--ink:#0d314c;--ink-2:#46627a;--rule:#dde8f1;--chip:#eef5fb;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tab{font:700 14px Arial,Helvetica,sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink-2);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
h2{font-size:20px;margin:6px 0 2px}
.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 12px}
input{width:100%;max-width:360px;font:15px Arial,Helvetica,sans-serif;padding:9px 12px;border:1px solid #c9d9e6;border-radius:8px;margin:0 0 14px;color:var(--ink)}
input:focus{outline:2px solid var(--sky);outline-offset:0}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
li{border:1px solid var(--rule);border-left:3px solid var(--sky);border-radius:8px;padding:9px 12px;background:#fff}
li b{display:block;font-size:15px}
li span{display:block;font-size:13px;color:var(--ink-2)}
.none{color:var(--ink-2);font-size:14px;padding:10px 0}
.foot{color:var(--ink-2);font-size:12px;margin-top:14px}
</style>
</head><body>
<main>
  <div class="tabs" id="tabs"></div>
  <h2 id="title">Current MISMO Standards Professionals</h2>
  <p class="sub" id="sub">Loading&hellip;</p>
  <input id="q" type="search" placeholder="Search by name or company" aria-label="Search by name or company">
  <ul id="list"></ul>
  <div class="foot" id="foot"></div>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = { CMSP: 'Certified MISMO Standards Professional (CMSP)', AMSP: 'Associate MISMO Standards Professional (AMSP)' };
  var want = (new URLSearchParams(location.search).get('program') || '').toUpperCase();
  var DATA = null, PROG = want === 'AMSP' ? 'AMSP' : 'CMSP';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tell() { try { window.parent.postMessage({ mismoCertifiedHeight: document.documentElement.scrollHeight }, '*'); } catch (e) {} }
  function render() {
    var p = (DATA.programs || {})[PROG] || { people: [] };
    var q = $('q').value.trim().toLowerCase();
    var rows = (p.people || []).filter(function (x) { return !q || (x.name + ' ' + (x.company || '')).toLowerCase().indexOf(q) >= 0; });
    $('title').textContent = (p.title || ('Current ' + PROG + 's'));
    $('sub').textContent = (p.count || 0) + ' ' + NAMES[PROG] + (p.count === 1 ? ' holder' : ' holders') + ', listed by last name.';
    $('list').innerHTML = rows.length ? rows.map(function (x) { return '<li><b>' + esc(x.name) + '</b>' + (x.company ? '<span>' + esc(x.company) + '</span>' : '') + '</li>'; }).join('') : '<div class="none">No one matches that search.</div>';
    var t = $('tabs'); t.innerHTML = '';
    if (!want) ['CMSP', 'AMSP'].forEach(function (k) { var b = document.createElement('button'); b.type = 'button'; b.className = 'tab' + (k === PROG ? ' on' : ''); b.textContent = 'Current ' + k + 's'; b.onclick = function () { PROG = k; render(); }; t.appendChild(b); });
    tell();
  }
  $('q').addEventListener('input', render);
  window.addEventListener('resize', tell);
  fetch('individuals.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    DATA = d;
    if (d.updated) $('foot').textContent = 'Updated ' + new Date(d.updated + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + '. Certifications are valid for two years and renewed every two years.';
    render();
  }).catch(function () { $('sub').textContent = 'The list could not be loaded just now. Please try again shortly.'; tell(); });
})();
</script>
</body></html>
