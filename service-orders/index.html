<title>Contractor HQ has moved</title>
<!-- Service Orders and Agreements was renamed Contractor HQ on 22 November 2026 and moved from
     /service-orders/ to /contractor-hq/. This page only forwards old links (emails already sent,
     bookmarks, the Expenses app on a phone) to the same page at the new address, keeping anything
     after the ? or #. It is inert while a repository named service-orders exists, because a project
     site wins its path over a folder in this site; it starts working when that repository is renamed. -->
<script>
(function () {
  var rest = location.pathname.replace(/^\/service-orders\/?/, '');
  location.replace('/contractor-hq/' + rest + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/contractor-hq/"></noscript>

  .card{background:#fff;border:1px solid #dbe4ec;border-radius:8px;padding:28px 32px;max-width:420px;text-align:center}

</div>
