<title>Set a New Password — MISMO Resources</title>
<script>(function(){ try { if (localStorage.getItem('resources:hub:theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
  :root{--paper:#F1F6FA;--surface:#FFFFFF;--ink:#0f314c;--ink-2:#456179;--ink-3:#546F88;--line:#D5E2ED;--sky:#50a4db;--btn:#0f314c;--btn-ink:#fff;
    --ok-bg:#E1F2EC;--ok:#0F7B5C;--err-bg:#FBE9E7;--err:#B3372C;--font:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  :root[data-theme="dark"]{--paper:#0B1826;--surface:#112336;--ink:#EEF3F8;--ink-2:#B9C8D6;--ink-3:#8C9FB1;--line:#243E5A;--btn:#50A4DB;--btn-ink:#0F314C;
    --ok-bg:#1F3328;--ok:#72C08E;--err-bg:#3D2220;--err:#F08579}
  *{box-sizing:border-box} html,body{margin:0}
  body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  header{background:#0f314c;padding:12px 22px;display:flex;align-items:center;gap:18px}
  .plate{background:#fff;border-radius:5px;padding:8px 12px;line-height:0} .plate svg{height:22px;width:auto}
  header span{color:#50a4db;font-weight:700;font-size:15px}
  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 26px 22px;box-shadow:0 18px 40px -26px rgba(15,49,76,.55)}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em} .for{margin:0 0 18px;color:var(--ink-2);font-size:13px}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
  input{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-bottom:14px}
  input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(80,164,219,.25)}
  .rs-checks{list-style:none;margin:-4px 0 16px;padding:0;font-size:12.5px}
  .rs-checks li{display:flex;gap:8px;align-items:flex-start;color:var(--ink-3)}
  .rs-checks li::before{content:"";flex:0 0 auto;width:12px;height:12px;margin-top:3px;border-radius:50%;border:2px solid var(--line)}
  .rs-checks li.ok{color:var(--ink)} .rs-checks li.ok::before{background:var(--sky);border-color:var(--sky)}
  button{width:100%;font:inherit;font-size:14px;font-weight:700;padding:11px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer}
  button:disabled{opacity:.6;cursor:default} button.quiet{background:none;color:var(--ink);border:1px solid var(--line);margin-top:10px;font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
  .msg{display:none;border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 14px} .msg.on{display:block}
  .msg.err{background:var(--err-bg);color:var(--err)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .note{margin:14px 0 0;font-size:12px;color:var(--ink-3)}
</style>
<script src="/assets/session.js"></script>
</head>

<header><span class="plate"><svg role="img" aria-label="MISMO" viewBox="0 0 708 108"><use href="#mismo-logo"/></svg></span><span>MISMO Resources</span></header>
<main>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="for" id="for"></p>
    <div class="msg" id="msg" role="alert"></div>
    <div id="form">
      <label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password">
      <label for="p2">New password again</label><input id="p2" type="password" autocomplete="new-password">
      <ul class="rs-checks" id="checks" aria-live="polite"></ul>
      <button type="button" id="go">Set password and sign in</button>
    </div>
    <button type="button" class="quiet" id="again" hidden>Send me a new link</button>
    <p class="note">Setting a password signs you out of MISMO Resources everywhere else.</p>
  </div>
</main>
<script>
(function () {
  /* The link's secret is after the # and never reaches any server; it is taken from the
     address bar at once, so it isn't left in the browser's history. */
  var RELAY = 'https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws/hub';
  var q = new URLSearchParams(location.hash.slice(1)), email = (q.get('e') || '').toLowerCase(), token = q.get('t') || '';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var RS = window.ResourcesSession, $ = function (id) { return document.getElementById(id); };
  var who = { email: email, name: '' };
  function say(text, good) { var m = $('msg'); m.textContent = text; m.className = 'msg on ' + (good ? 'ok' : 'err'); }
  function paint() { if (RS && RS.pwChecks) $('checks').innerHTML = RS.checksHTML(RS.pwChecks($('p1').value, who, $('p2').value)); }
  if (!email || !token) { $('form').hidden = true; say('This link is incomplete. Open the link from your email again, or ask for a new one from the sign-in screen.'); return; }
  $('for').textContent = 'For ' + email;
  if (RS && RS.passwordEyes) RS.passwordEyes(document);   /* the show-password eye, as on the sign-in screen */
  $('p1').addEventListener('input', paint); $('p2').addEventListener('input', paint); paint();
  $('p2').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
  $('go').addEventListener('click', function () {
    if (RS && RS.pwChecks && !RS.pwChecks($('p1').value, who, $('p2').value).every(function (c) { return c.ok; })) return say('The new password doesn\u2019t meet the checks yet.');
    var b = $('go'); b.disabled = true; b.textContent = 'Setting\u2026';
    fetch(RELAY + '/auth/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store', body: JSON.stringify({ email: email, token: token, password: $('p1').value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (x.r.ok && x.j.token) {
          if (RS && RS.adopt) RS.adopt(x.j);
          $('form').hidden = true; say('Your password is set and you\u2019re signed in. Taking you to MISMO Resources\u2026', true);
          setTimeout(function () { location.href = '/'; }, 1800); return;
        }
        if (x.j.error === 'BAD_LINK') { $('form').hidden = true; $('again').hidden = false; return say('This link has expired or has already been used.'); }
        if (x.j.problems) return say(x.j.problems.join(' '));
        if (x.r.status === 503 || x.r.status === 404) return say('Setting your own password isn\u2019t switched on yet. Ask a MISMO administrator.');
        say(x.j.message || ('That didn\u2019t work (' + x.r.status + '). Try again.'));
      }, function () { say('Could not reach the sign-in service. Check your connection and try again.'); })
      .then(function () { var b = $('go'); if (!b.hidden) { b.disabled = false; b.textContent = 'Set password and sign in'; } });
  });
  $('again').addEventListener('click', function () {
    var b = $('again'); b.disabled = true;
    fetch(RELAY + '/auth/forgot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store', body: JSON.stringify({ email: email }) })
      .then(function () { b.hidden = true; say('If there\u2019s an account for ' + email + ', a new link is on its way. It works once, for one hour.', true); },
            function () { b.disabled = false; say('Could not reach the sign-in service. Try again.'); });
  });
  setTimeout(function () { $('p1').focus(); }, 50);
})();
</script>
