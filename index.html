<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MISMO Resources</title>
<script>
  /* The theme before any CSS paints, so a dark-mode visitor never sees a flash of light. */
  (function(){ try { if (localStorage.getItem('resources:home:theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --navy:#0f314c; --navy-deep:#06202f; --navy-mid:#14486e; --sky:#50a4db; --sky-soft:#94c8e9;
    --paper:#F1F6FA; --surface:#FFFFFF; --sunk:#E9F1F8;
    --ink:#0f314c; --ink-2:#456179; --ink-3:#546F88;
    --line:#E5EEF5; --line-2:#D5E2ED; --line-3:#ADC4D6;
    --accent:#14486E; --accent-soft:#dcedf8;
    --btn:#0f314c; --btn-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(15,49,76,.06), 0 10px 26px -18px rgba(15,49,76,.45);
    --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --hq-h:64px; --rail-w:240px;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --paper:#0B1826; --surface:#112336; --sunk:#172D44;
    --ink:#EEF3F8; --ink-2:#B9C8D6; --ink-3:#8C9FB1;
    --line:#1A3048; --line-2:#243E5A; --line-3:#3A5A7C;
    --accent:#50A4DB; --accent-soft:#173A57;
    --btn:#50A4DB; --btn-ink:#0F314C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  html{scroll-padding-top:calc(var(--hq-h) + 16px)}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding-top:calc(var(--hq-h) + env(safe-area-inset-top,0px));padding-left:var(--rail-w)}
  svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* the masthead */
  .hqtop{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--hq-h) + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 22px 0;background:var(--navy);color:#fff;display:flex;align-items:center;box-shadow:0 1px 0 rgba(80,164,219,.28)}
  .logoplate{background:#fff;border-radius:5px;padding:9px 13px;display:flex;align-items:center;line-height:0;flex:0 0 auto;box-shadow:0 1px 0 rgba(80,164,219,.35)}
  .logoplate svg{height:24px;width:auto;display:block}
  .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;margin-inline:20px;border-radius:1px;background:var(--sky)}
  .hqname{font-size:15.5px;font-weight:700;color:var(--sky);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px;flex:0 0 auto}
  .eyebrow-m{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}

  /* the tools, down the left */
  .rail{position:fixed;left:0;bottom:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));width:var(--rail-w);z-index:20;background:var(--navy);color:#fff;
    display:flex;flex-direction:column;overflow:hidden auto;box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14)}
  .rail-top{display:flex;align-items:center;padding:11px 10px 9px;border-bottom:1px solid rgba(80,164,219,.2)}
  .rail-lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
  .railfind{position:relative;padding:11px 12px 3px}
  .railfind svg{position:absolute;left:21px;top:20px;width:14px;height:14px;stroke:rgba(255,255,255,.5);pointer-events:none}
  .railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 10px 6px 30px}
  .railfind input::placeholder{color:rgba(255,255,255,.5)}
  .railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
  .rail nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px}
  .rail nav a,.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);
    padding:8px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
  .rail nav a:hover,.theme-btn:hover{color:#fff;background:rgba(255,255,255,.09)}
  .rail nav a[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid);box-shadow:inset 3px 0 0 var(--sky)}
  .rail nav a:focus-visible,.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
  .rail nav .tdot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:0 0 auto;margin-inline:4px}
  .rail nav a span.t{overflow:hidden;text-overflow:ellipsis}
  .rail nav svg,.theme-btn svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
  .rail nav .count{margin-left:auto;font-style:normal;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);border-radius:999px;padding:0 7px;line-height:18px}
  .railgrp{border-top:1px solid rgba(80,164,219,.16);margin-top:4px;padding-top:7px}
  .railgrp > span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.52);font-weight:700;padding:4px 20px 0}
  .rail .foot{margin-top:auto;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2)}

  /* the page */
  main{max-width:1180px;padding:22px 24px 48px;display:flex;flex-direction:column;gap:22px;min-width:0}
  .mast{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
  .mast > div{min-width:0}
  .eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .mast h1{font-size:clamp(22px,3vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:2px 0 0}
  .mast .sub{color:var(--ink-2);font-size:14px;max-width:78ch}
  .stats{display:flex;gap:18px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .stats b{display:block;font-size:20px;color:var(--ink);line-height:1.1}

  .tool{display:flex;flex-direction:column;gap:8px;min-width:0}
  .th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .th .tdot{width:12px;height:12px;border-radius:3px;background:var(--c);flex:0 0 auto}
  .th h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .th .path{font-size:12px;color:var(--ink-3)}
  .expall{font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .card .home+.home{border-top:1px solid var(--line)}
  .toolsbar{display:flex;align-items:center;gap:12px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:-8px}
  .toolsbar .expall{margin-left:auto;letter-spacing:0;text-transform:none;font-size:12.5px}
  .thb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;text-align:left;background:none;border:0;padding:4px 0;font:inherit;color:inherit;cursor:pointer}
  .thb:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:3px}
  .thb .chev{width:18px;height:18px;color:var(--ink-3);transition:transform .15s;flex:0 0 auto;margin-left:-3px}
  .thb[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .thb:hover h2{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  .thb.nob{cursor:default}
  .thb .chev.sp{display:inline-block;width:18px;height:18px}
  .thb .path{font-size:12px;color:var(--ink-3)}
  .thb .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .tdesc{margin:0;color:var(--ink-2);font-size:13px;max-width:80ch}

  .card{background:var(--surface);border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
  .home{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;text-decoration:none;color:inherit;
    box-shadow:inset 3px 0 0 var(--c)}
  .home .ic{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--ink)}
  .home .ic svg{width:18px;height:18px}
  .home .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .home .s{font-size:12.5px;color:var(--ink-2)}
  .home .arr{color:var(--ink-3);font-size:15px}
  a.home:hover{background:var(--paper)}
  .home:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
  .grp{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--sunk);padding:7px 16px;border-top:1px solid var(--line)}
  .pg{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  a.pg:hover{background:var(--paper)}
  a.pg:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
  .pg .b{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-align:center;padding:3px 0;border-radius:3px;background:var(--sunk);color:var(--ink-2);border:1px solid var(--line-2)}
  .pg .n{font-weight:600;font-size:13.5px}
  .pg .s{font-size:12px;color:var(--ink-3)}
  .pg .arr{color:var(--ink-3);font-size:14px}
  .pg.planned{opacity:.7}
  .pg.planned .arr{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .empty{padding:18px 16px;color:var(--ink-3);font-style:italic}
  footer{font-size:12px;color:var(--ink-3);padding-top:6px}

  @media (max-width:760px){
    :root{--hq-h:55px;--rail-w:58px}
    .hqtop{padding-inline:12px}.logoplate{padding:7px 10px}.logoplate svg{height:18px}
    .mastrule{height:30px;margin-inline:10px}.hqname{font-size:13px}.eyebrow-m{display:none}
    .rail-lbl,.railfind,.rail nav a span.t,.rail nav .count,.railgrp > span,.theme-btn span{display:none}
    .rail-top{justify-content:center;padding-inline:0;min-height:12px}
    .rail nav{padding-inline:6px;align-items:center}
    .rail nav a,.theme-btn{justify-content:center;padding:10px 0;width:42px}
    .rail .foot{display:flex;justify-content:center}
    main{padding:16px 16px 28px}
    .home{grid-template-columns:auto minmax(0,1fr)}.home .arr{display:none}
    .pg{grid-template-columns:44px minmax(0,1fr)}.pg .arr{display:none}
  }
</style>
</head>

<script>
/* ===================================================================
   THE ONLY THING TO EDIT WHEN A TOOL IS ADDED, MOVED OR RETIRED.

   base     folder under resources.mismo.org. The path IS the repository name, so
            changing one means renaming the repo too.
   c        the tool's colour: the same one it has in the admin panel.
   entries  the tool's main pages, always shown (a tool's own home page is href '/').
   groups   its other pages, under headings, shown when the tool is expanded. A page in
            ANOTHER folder (its own repository) gives url, the full path from the site
            root, instead of href. planned:true lists a page that is not live yet.
   The list sorts itself by name, and the sidebar and counts follow from it.
   =================================================================== */
var BASE='';
var APPS=[
  {key:'glossary',name:'Business Glossary',base:'/glossary',c:'#0F9D77',
   desc:'Every MISMO business term, its definition and where it is used.',
   entries:[{name:'Business Glossary',sub:'The public glossary: search and browse every term',href:'/'},
            {name:'Business Glossary Console',sub:'Draft, stage and publish changes to the glossary',href:'/console/',console:true}]},
  {key:'hub',name:'Initiative Hub',base:'/initiative-hub',c:'#2A4DFF',
   desc:'Workgroup dashboards, the meeting calendar, and initiatives still under consideration.',
   entries:[{name:'Initiative Hub',sub:'Every initiative, by domain, plus the meeting calendar',href:'/'}],
   groups:[
    {label:'Active initiatives',pages:[
      {badge:'MCD',name:'Mortgage Compliance Dataset',sub:'Workgroup dashboard',href:'/mcd-dashboard.html'},
      {badge:'LBDS',name:'Loan Boarding Data Segment',sub:'Workgroup dashboard',href:'/lbds-dashboard.html'},
      {badge:'CCS',name:'Common Confidence Score',sub:'Workgroup dashboard',href:'/ccs-dashboard.html'},
      {badge:'TPA',name:'Tri-Party eNote Bailee Agreement',sub:'Workgroup dashboard',href:'/tpa-dashboard.html'},
      {badge:'TOD',name:'Title Order Dataset Specification',sub:'Workgroup dashboard',href:'/title-order-dashboard.html'},
      {badge:'AVM',name:'AVM Testing Guidance and Best Practices',sub:'Workgroup dashboard',href:'/avm-testing-dashboard.html'}]},
    {label:'Potential initiatives',pages:[
      {badge:'AI',name:'Consumer Facing AI Disclosure Language',sub:'Artificial Intelligence, in progress',href:'/potential.html?id=consumer-facing-ai-disclosure-language'},
      {badge:'NEW',name:'Log a potential initiative',sub:'Upload and review',href:'/potential-edit.html'}]},
    {label:'Schedule',pages:[{badge:'CAL',name:'Meeting calendar',sub:'Every workgroup, filterable',href:'/calendar.html'}]}]},
  {key:'service-orders',name:'Service Orders and Agreements',base:'/service-orders',c:'#E11D48',
   desc:'FY 2027 service orders and MSA extensions: what each contracting company has been sent, what they have accepted, and the hours logged against each order.',
   entries:[{name:'Service Orders and Agreements',sub:'Review and accept orders, and log hours',href:'/'}]},
  {key:'sponsorship',name:'Sponsorship',base:'/sponsorship',c:'#0EA5E9',
   desc:'Summit sponsorship: the prospectus sent to prospective sponsors, and the portal where staff track prospects, commitments and payments.',
   entries:[{name:'Sponsorship Portal',sub:'Pipeline, prospects, inventory and payments',href:'/'}],
   groups:[{label:'For prospective sponsors',pages:[{badge:'PRO',name:'2027 Summit Sponsorship Prospectus',sub:'Tiers, benefits and who attends. Public.',url:'/sponsorship-prospectus/',planned:true}]}]},
  {key:'summit-hq',name:'Summit HQ',base:'/summit-hq',c:'#B45309',
   desc:'Plan a summit: rooms, schedule, workgroup placement and conflicts.',
   entries:[{name:'Summit HQ',sub:'Plan rooms, sessions and workgroup placement',href:'/'}]},
  {key:'website-migration',name:'Website Migration HQ',base:'/website-migration',c:'#475569',
   desc:'The tracker for moving mismo.org from Sitefinity to Higher Logic: tasks, pages, key dates, decisions and word rules.',
   entries:[{name:'Website Migration HQ',sub:'Tasks, pages, key dates, decisions and word rules',href:'/'}]}
];
APPS.sort(function(a,b){ return a.name.localeCompare(b.name,'en'); });
var HOME='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pages(a){return (a.groups||[]).reduce(function(n,g){return n+g.pages.length;},0)+a.entries.length;}
var q='';
/* Tools start collapsed: each shows what it is and its way in; the pages behind it open on
   request, and the page remembers which ones this reader opened. */
var STORE='resources:home:open', open=new Set();
try{ open=new Set(JSON.parse(localStorage.getItem(STORE)||'[]')); }catch(e){}
function remember(){ try{ localStorage.setItem(STORE,JSON.stringify(Array.from(open))); }catch(e){} }
var CHEV='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function hit(){ for(var i=0;i<arguments.length;i++) if(String(arguments[i]||'').toLowerCase().indexOf(q)>=0) return true; return !q; }
var CHV='<svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
function entryHTML(a,e){ return '<a class="home" href="'+BASE+a.base+e.href+'"><span class="ic">'+HOME+'</span><span><span class="n">'+esc(e.name)+'</span><span class="s">'+esc(e.sub)+'</span></span><span class="arr">→</span></a>'; }
function groupsHTML(a,gs){ return gs.map(function(g){return '<div class="grp">'+esc(g.label)+'</div>'+g.pages.map(function(p){
    var inner='<span class="b">'+esc(p.badge)+'</span><span><span class="n">'+esc(p.name)+'</span><br><span class="s">'+esc(p.sub)+'</span></span>';
    return p.planned?'<div class="pg planned">'+inner+'<span class="arr">Coming</span></div>'
      :'<a class="pg" href="'+BASE+(p.url||a.base+p.href)+'">'+inner+'<span class="arr">→</span></a>';}).join('');}).join(''); }
function render(){
  var html='';
  APPS.forEach(function(a){
    var toolHit=hit(a.name,a.desc);
    var es=a.entries.filter(function(e){return toolHit||hit(e.name,e.sub);});
    var gs=(a.groups||[]).map(function(g){return {label:g.label,pages:g.pages.filter(function(p){return toolHit||hit(p.name,p.sub,p.badge,g.label);})};}).filter(function(g){return g.pages.length;});
    if(q&&!toolHit&&!es.length&&!gs.length) return;
    if(!es.length) es=a.entries;
    var n=pages(a), more=(a.groups||[]).length>0, isOpen=more&&(!!q||open.has(a.key));
    var head='<span class="tdot" style="width:12px;height:12px;border-radius:3px;background:var(--c)"></span><h2 style="margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em">'+esc(a.name)+'</h2><span class="path">'+esc(a.base)+'/</span>';
    html+='<section class="tool" id="'+a.key+'" style="--c:'+a.c+'">'+
      (more?'<button class="thb" type="button" data-tog="'+a.key+'" aria-expanded="'+isOpen+'" aria-controls="more-'+a.key+'">'+CHV+head+'<span class="cnt">'+(n-a.entries.length)+' more page'+(n-a.entries.length===1?'':'s')+'</span></button>'
        :'<div class="thb nob"><span class="chev sp"></span>'+head+'</div>')+
      '<p class="tdesc">'+esc(a.desc)+'</p><div class="card">'+es.map(function(e){return entryHTML(a,e);}).join('')+
      (more?'<div id="more-'+a.key+'"'+(isOpen?'':' hidden')+'>'+groupsHTML(a,gs)+'</div>':'')+'</div></section>';
  });
  var el=document.getElementById('tools');
  el.innerHTML=html||'<div class="card"><div class="empty">Nothing matches that search.</div></div>';
  el.style.cssText='display:flex;flex-direction:column;gap:18px';
  var all=APPS.filter(function(a){return (a.groups||[]).length;}).every(function(a){return open.has(a.key);});
  var ex=document.getElementById('expAll'); ex.textContent=all?'Collapse all':'Expand all'; ex.dataset.all=all?'1':'';
}
document.getElementById('expAll').onclick=function(){ if(this.dataset.all) open.clear(); else APPS.forEach(function(a){ if((a.groups||[]).length) open.add(a.key);}); remember(); render(); spy(); };
/* A tool picked in the sidebar opens as well as scrolling into view. */
document.getElementById('railnav').addEventListener('click',function(e){ var l=e.target.closest('a'); if(!l) return; var k=l.getAttribute('href').slice(1);
  if(APPS.some(function(a){return a.key===k&&(a.groups||[]).length;})&&!open.has(k)){ open.add(k); remember(); render(); } });
var nav=document.getElementById('railnav');
APPS.forEach(function(a){ nav.insertAdjacentHTML('beforeend','<a href="#'+a.key+'" title="'+esc(a.name)+'" style="--c:'+a.c+'"><span class="tdot"></span><span class="t">'+esc(a.name)+'</span><b class="count">'+pages(a)+'</b></a>'); });
var total=APPS.reduce(function(n,a){return n+pages(a);},0);
document.getElementById('nAll').textContent=APPS.length;
document.getElementById('sTools').textContent=APPS.length; document.getElementById('sPages').textContent=total;
document.getElementById('tools').addEventListener('click',function(e){
  var t=e.target.closest('[data-tog]'); if(!t) return;
  var k=t.dataset.tog; if(open.has(k)) open.delete(k); else open.add(k); remember(); render();
  var back=document.querySelector('[data-tog="'+k+'"]'); if(back) back.focus();
});
document.getElementById('q').addEventListener('input',function(e){ q=e.target.value.trim().toLowerCase(); render(); });
/* which tool is on screen */
function spy(){
  var cur='top'; APPS.forEach(function(a){ var el=document.getElementById(a.key); if(el&&el.getBoundingClientRect().top<140) cur=a.key; });
  if(window.scrollY>0&&window.innerHeight+window.scrollY>=document.body.scrollHeight-4) cur=APPS[APPS.length-1].key;
  nav.querySelectorAll('a').forEach(function(x){ if(x.getAttribute('href')==='#'+cur) x.setAttribute('aria-current','true'); else x.removeAttribute('aria-current'); });
}
window.addEventListener('scroll',spy,{passive:true});
var themeBtn=document.getElementById('theme');
function themeLabel(){ themeBtn.querySelector('span').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'Light Mode':'Dark Mode'; }
themeBtn.onclick=function(){ var r=document.documentElement, d=r.getAttribute('data-theme')==='dark';
  if(d) r.removeAttribute('data-theme'); else r.setAttribute('data-theme','dark');
  try{ localStorage.setItem('resources:home:theme', d?'light':'dark'); }catch(e){}
  themeLabel(); };
themeLabel();
render(); spy();
</script>
<script src="/assets/session.js"></script>
</body>
</html>
