<title>Submit an Idea — MISMO</title>
<!-- Submit an Idea (Perry, 16 Oct 2026; restyled 18 Oct as design W1): the public form MISMO's website links to, in the website's
     own look: its header (menu, search, Log in) and its Get Involved hero. No sign-in. It sends to the relay's
     /hub-requests/ideas/submit (relay request 10), which keeps each idea in the private Work Requests repository for the
     Ideas Inbox and emails the sender a receipt and the administrators an alert. Fonts and colours matched from the
     website (Figtree is the nearest match); swap in the site's own when Jonna has them. -->
<style>html,body{margin:0;padding:0;background:#fff} html{scroll-padding-top:20px}</style>
</head>
<body>
<!-- Submit an Idea, standalone (until it moves onto mismo.org). The form itself is _src/idea.js and _src/idea.css, built
     by _build/build.py into the same files mismo.org loads through embed.js; this page mounts them with its own copy of
     the website header and footer. -->
<div id="mm-submit-idea"></div>
<script src="embed.js"></script>
<script>MISMO_SUBMIT_IDEA.mount(document.getElementById('mm-submit-idea'), {embedded: false});</script>
</body>
