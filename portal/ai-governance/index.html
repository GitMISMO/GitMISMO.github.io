<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI Governance Certification Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy masthead, a hero that shows where the company is in the journey, four big steps,
   then the work area. Squared shapes throughout; navy-biased neutrals; IBM Plex. */
:root{
  --navy:#0d314c; --navy-deep:#06202f; --navy-mid:#14486e; --sky:#74bfeb; --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
  --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
  --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5;
  --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --good:#0f7b5c; --good-wash:#e3f4ee; --bad:#b3372c; --bad-wash:#fbeceb; --warn:#a2701a; --warn-wash:#fbf2e0;
  --lv-f:#2477b8; --lv-m:#8a5a00; --lv-v:#0f7b5c; --lv-f-w:#e6f0f9; --lv-m-w:#fbf1dc; --lv-v-w:#e3f4ee;
  --accent:#14486e; --accent-ink:#ffffff; --focus:#2477b8;
  --hero-a:#0d314c; --hero-b:#14486e;
  --shadow:0 1px 2px rgba(13,49,76,.06),0 6px 20px rgba(13,49,76,.06);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4; --sky-wash:#123a52;
  --good:#4fc79b; --good-wash:#0f3a30; --bad:#f08579; --bad-wash:#3e1d1b; --warn:#e0a83c; --warn-wash:#3a2c10;
  --lv-f:#6fb0ef; --lv-m:#e0a83c; --lv-v:#4fc79b; --lv-f-w:#123a52; --lv-m-w:#3a2c10; --lv-v-w:#0f3a30;
  --accent:#74bfeb; --accent-ink:#06202f; --focus:#74bfeb;
  --hero-a:#06202f; --hero-b:#0d314c; color-scheme:dark; } }
:root[data-theme="dark"]{
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4; --sky-wash:#123a52;
  --good:#4fc79b; --good-wash:#0f3a30; --bad:#f08579; --bad-wash:#3e1d1b; --warn:#e0a83c; --warn-wash:#3a2c10;
  --lv-f:#6fb0ef; --lv-m:#e0a83c; --lv-v:#4fc79b; --lv-f-w:#123a52; --lv-m-w:#3a2c10; --lv-v-w:#0f3a30;
  --accent:#74bfeb; --accent-ink:#06202f; --focus:#74bfeb;
  --hero-a:#06202f; --hero-b:#0d314c; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3,h4{letter-spacing:-.012em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.mast .wrap{display:flex;align-items:center;gap:14px;min-height:58px;padding-block:8px}
.logoplate{background:#fff;border-radius:5px;padding:8px 12px;display:flex;align-items:center;line-height:0;position:relative}
.logoplate .wordmark{height:22px;width:auto}
.mast .vr{width:1px;height:26px;background:rgba(116,191,235,.4)}
.mast .pname{color:var(--sky-soft);font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.mast .eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:11px;color:rgba(255,255,255,.62);white-space:nowrap}
.theme-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:5px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.theme-btn:hover{background:rgba(255,255,255,.18)}
@media (max-width:560px){.mast .eyebrow{display:none}.mast .vr{display:none}}

/* draft band + view switch */
.band{background:var(--surface);border-bottom:1px solid var(--border)}
.band .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px}
.draftnote{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;min-width:0}
.draftnote b{color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;border:1px solid var(--warn);padding:1px 6px;border-radius:3px}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:5px;overflow:hidden;margin-left:auto}
.seg button{background:transparent;border:0;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}}

/* hero */
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(116,191,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(116,191,235,.07) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:26px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero .kicker{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--sky);font-weight:600}
.hero h1{font-size:clamp(24px,3.2vw,34px);font-weight:700;margin-top:6px;line-height:1.15}
.hero h1 span{color:var(--sky)}
.hero p.sub{color:var(--sky-soft);margin:8px 0 0;max-width:62ch}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:rgba(255,255,255,.78)}
.hero .meta b{color:#fff;font-weight:600}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .pct{font-family:var(--mono);font-size:28px;font-weight:600}
.ring .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky-soft)}
.journey{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin-top:20px;grid-column:1/-1}
.jstop{position:relative;padding-top:18px;font-size:12px;color:rgba(255,255,255,.62);min-width:0}
.jstop::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:rgba(255,255,255,.18)}
.jstop .dot{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:var(--hero-b);border:2px solid rgba(255,255,255,.35)}
.jstop.done{color:var(--sky-soft)}.jstop.done::before{background:var(--sky)}.jstop.done .dot{background:var(--sky);border-color:var(--sky)}
.jstop.now{color:#fff;font-weight:600}.jstop.now .dot{background:#fff;border-color:var(--sky);box-shadow:0 0 0 4px rgba(116,191,235,.35)}
.jstop .who{display:block;font-weight:400;font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.ring{display:none}.journey{grid-template-columns:repeat(7,minmax(74px,1fr));overflow-x:auto;padding-bottom:4px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:-1px;padding-block:18px 0}
.stepbtn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.stepbtn:hover{border-color:var(--border-strong)}
.stepbtn[aria-current="step"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.stepbtn .n{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;background:var(--surface-3);color:var(--ink-2)}
.stepbtn[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.stepbtn.ok .n{background:var(--good);color:#fff}
.stepbtn .t{font-weight:600;font-size:14px;line-height:1.25}
.stepbtn .s{font-size:12px;color:var(--ink-3);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepbtn>span:last-child{min-width:0}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.stepbtn .s{display:none}}

main{padding-block:22px 60px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 0;flex-wrap:wrap}
.ph h2{font-size:20px;font-weight:700}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:72ch}
.ph .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pb{padding:18px 20px 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.fgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
@media (max-width:760px){.grid2,.grid3,.fgrid{grid-template-columns:1fr}}
.sectlabel{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 10px;display:flex;align-items:center;gap:10px}
.sectlabel::after{content:"";flex:1;height:1px;background:var(--rule)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:13.5px;font-weight:600}
.fld label .req{color:var(--bad);margin-left:2px}
.fld .help{font-size:12.5px;color:var(--ink-3);margin-top:-2px}
.in{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:9px 11px;min-width:0}
.in:hover{border-color:var(--border-strong)}
.in:focus{background:var(--surface);border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
textarea.in{min-height:92px;resize:vertical;line-height:1.5}
.from{font-size:11px;font-weight:500;color:var(--good);background:var(--good-wash);padding:1px 6px;border-radius:3px;margin-left:6px;letter-spacing:.02em}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.F{color:var(--lv-f);background:var(--lv-f-w);border-color:transparent}
.tag.M{color:var(--lv-m);background:var(--lv-m-w);border-color:transparent}
.tag.V{color:var(--lv-v);background:var(--lv-v-w);border-color:transparent}
.tag.trig{text-transform:none;letter-spacing:0;font-weight:500;background:var(--sky-wash);color:var(--navy-mid);border-color:transparent}
:root[data-theme="dark"] .tag.trig{color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.trig{color:var(--sky)}}
.code{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:500}
.foot-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.attest{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.attest input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--good)}

/* documents */
.drop{display:block;position:relative;border:2px dashed var(--border-strong);border-radius:8px;padding:30px 20px;text-align:center;background:var(--surface-2);cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--sky-wash)}
.drop .big{font-size:19px;font-weight:700}
.drop p{margin:6px auto 0;color:var(--ink-2);max-width:60ch;font-size:14px}
.drop .icon{width:46px;height:46px;margin:0 auto 10px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.areas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
@media (max-width:820px){.areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.area{border:1px solid var(--border);border-radius:6px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.area:hover{border-color:var(--border-strong)}
.area[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.area .c{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-weight:600}
.area .nm{font-size:13px;font-weight:600;line-height:1.25;margin-top:2px;min-height:2.5em}
.area .ct{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.area .bar{flex:1;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.area .bar i{display:block;height:100%;background:var(--good)}
.area.empty .ct{color:var(--warn)}
.tblwrap{overflow-x:auto;margin-top:16px;border:1px solid var(--border);border-radius:6px}
table.docs{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
table.docs th{background:var(--surface-3);text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
table.docs td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.docs tr:last-child td{border-bottom:0}
table.docs .fname{font-weight:500;word-break:break-word}
table.docs .fsz{color:var(--ink-3);font-size:12px}
.ftype{display:inline-flex;width:34px;height:20px;align-items:center;justify-content:center;font-size:10px;font-weight:700;border-radius:3px;color:#fff;margin-right:8px;font-family:var(--mono);vertical-align:middle}
.sorted{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}
.sorted.guess{color:var(--warn)}
td select.in{padding:5px 8px;font-size:13px}
.iconbtn{background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 7px;cursor:pointer;color:var(--ink-3)}
.iconbtn:hover{border-color:var(--border);color:var(--bad)}
.callout{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--border);border-left:4px solid var(--accent);background:var(--surface-2);border-radius:6px;padding:14px 16px;margin-top:16px}
.callout.next{border-left-color:var(--warn)}
.callout h4{font-size:15px}
.callout p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.callout .grow{flex:1;min-width:0}

/* use cases */
.ucgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.ucgrid{grid-template-columns:1fr}}
.uclist{display:flex;flex-direction:column;gap:8px;position:sticky;top:76px}
@media (max-width:900px){.uclist{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.uclist .uccard{min-width:220px}}
.uccard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.uccard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.uccard .uid{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.uccard .unm{font-weight:600;margin-top:2px;line-height:1.3}
.uccard .ubar{height:5px;background:var(--surface-3);border-radius:3px;margin-top:10px;overflow:hidden}
.uccard .ubar i{display:block;height:100%;background:var(--accent)}
.uccard .ust{font-size:12px;color:var(--ink-3);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.addbtn{border:1px dashed var(--border-strong);background:transparent;border-radius:6px;padding:11px;cursor:pointer;color:var(--accent);font-weight:600}
.addbtn:hover{border-color:var(--accent);background:var(--surface)}
.subtabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 20px;margin-top:14px;overflow-x:auto}
.subtabs button{background:none;border:0;padding:10px 4px;margin-right:22px;font-weight:600;font-size:14px;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sky)}
.subtabs .cnt{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--surface-3);padding:1px 6px;border-radius:3px}
.subtabs .cnt.done{background:var(--good-wash);color:var(--good)}

.trigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.trigs{grid-template-columns:1fr}}
.trig{border:1px solid var(--border);border-radius:6px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.trig.y{border-color:var(--accent);background:var(--sky-wash)}
.trig.n{background:var(--surface-2)}
.trig .top{display:flex;gap:10px;align-items:flex-start}
.trig .tid{font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--ink-2);padding:2px 6px;border-radius:3px;flex:none;margin-top:2px}
.trig .tq{font-weight:600;line-height:1.35}
.trig .tm{font-size:13px;color:var(--ink-2)}
.yn{display:flex;gap:8px;margin-top:auto;align-items:center;flex-wrap:wrap}
.yn button{min-width:72px;padding:7px 14px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:600}
.yn button[aria-pressed="true"].yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yn button[aria-pressed="true"].no{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.yn .adds{font-size:12px;color:var(--ink-3);margin-left:auto}
.trigsum{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:14px;font-size:14px}
.trigsum .big{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent)}

.qlayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.qlayout{grid-template-columns:1fr}}
.anav{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px}
@media (max-width:900px){.anav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.anav button{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;padding:7px 9px;cursor:pointer;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.anav button:hover{background:var(--surface-2)}
.anav button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);font-weight:600;border-color:var(--border)}
.anav .c{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3);width:22px}
.anav .k{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.anav .k.done{color:var(--good);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .seg{margin-left:0}
.q{border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:9px;scroll-margin-top:84px}
.q+.q{margin-top:12px}
.q.answered{border-left:4px solid var(--good)}
.q.drafted{border-left:4px solid var(--warn)}
.q .qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .qt{font-size:16px;font-weight:600;line-height:1.35}
.q .why{font-size:13px;color:var(--ink-2)}
.q .upl{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px}
.q .upl b{color:var(--ink-2);font-weight:600;white-space:nowrap}
.q .state{margin-left:auto;font-size:12px;font-weight:600}
.q .state.ok{color:var(--good)}.q .state.dr{color:var(--warn)}.q .state.todo{color:var(--ink-3)}
.draftbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-wash);color:var(--ink);border-radius:5px;padding:8px 12px;font-size:13px}
.draftbar b{color:var(--warn)}
.draftbar .btn{margin-left:auto}
.evid{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-2);border-radius:4px;padding:3px 4px 3px 8px;font-size:12.5px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:0 4px;font-size:15px;line-height:1}
.chip button:hover{color:var(--bad)}
.evid select{max-width:280px;padding:5px 8px;font-size:12.5px}

/* review */
.revgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.rcard{border:1px solid var(--border);border-radius:6px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.rcard .rh{display:flex;gap:14px;align-items:center}
.mini{width:58px;height:58px;flex:none;position:relative}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .mk{flex:none;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.checks .mk.ok{background:var(--good);color:#fff}.checks .mk.no{background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.done-screen{text-align:center;padding:36px 20px}
.done-screen .ok{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px;text-align:left}
@media (max-width:760px){.timeline{grid-template-columns:1fr 1fr}}
.timeline div{border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--surface-2)}
.timeline b{display:block;font-size:13.5px}
.timeline span{font-size:12.5px;color:var(--ink-2)}

/* assessor */
.asum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:760px){.asum{grid-template-columns:1fr 1fr}}
.tile{border:1px solid var(--border);border-radius:6px;padding:12px 14px;background:var(--surface)}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:600}
.tile .l{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.matur{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:16px}
.matur div{flex:1;padding:12px 14px;background:var(--surface);border-right:1px solid var(--border);min-width:0}
.matur div:last-child{border-right:0}
.matur div.got{background:var(--good-wash)}
.matur div.cap{background:var(--bad-wash)}
.matur b{display:block;font-size:14px}
.matur span{font-size:12.5px;color:var(--ink-2)}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{border:1px solid var(--border-strong);background:var(--surface);border-radius:5px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600}
.rate button[aria-pressed="true"].S{background:var(--good);border-color:var(--good);color:#fff}
.rate button[aria-pressed="true"].N{background:var(--bad);border-color:var(--bad);color:#fff}
.rate button[aria-pressed="true"].M{background:var(--warn);border-color:var(--warn);color:#fff}
.answerbox{background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.answerbox.empty{color:var(--ink-3);font-style:italic}
.verify{font-size:13px;color:var(--ink-2);border-left:3px solid var(--sky);padding-left:10px}
.verify .flag{color:var(--warn);font-weight:600;font-size:11.5px;display:block;margin-top:3px}
.ai{border:1px dashed var(--border-strong);border-radius:5px;padding:9px 12px;font-size:13px;background:var(--surface)}
.ai b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:5px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:calc(100vw - 32px)}
.muted{color:var(--ink-3)}
/* sign-in walkthrough */
.gate{padding-block:26px 60px}
.gate .lead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.gate .lead h2{font-size:22px}
.gate .lead p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}
.gsteps{display:flex;gap:0;margin-left:auto;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.gsteps span{padding:7px 12px;font-size:12.5px;color:var(--ink-3);border-right:1px solid var(--border);white-space:nowrap}
.gsteps span:last-child{border-right:0}
.gsteps span.on{background:var(--navy);color:#fff;font-weight:600}
.gsteps span.done{color:var(--good);font-weight:600}
.gcols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
@media (max-width:860px){.gcols{grid-template-columns:1fr}.gsteps{margin-left:0}}
.inbox{border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.inbox .ihead{padding:12px 16px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px}
.inbox .ihead b{color:var(--ink-3);font-weight:500}
.inbox .ihead .subj{grid-column:1/-1;font-size:16px;font-weight:600;color:var(--ink);margin-top:4px}
.inbox .tag{margin-left:6px}
.mail{background:#eef3f7;padding:20px}
.mail .card{max-width:560px;margin:0 auto;background:#fff;color:#0d314c;border-radius:4px;overflow:hidden;font-size:14.5px;line-height:1.55}
.mail .mh{background:#0d314c;padding:14px 20px;display:flex;align-items:center;gap:12px}
.mail .mh .logoplate{padding:6px 10px}.mail .mh .logoplate .wordmark{height:16px}
.mail .mh span{color:#a9d8f3;font-size:13px;font-weight:500}
.mail .mb{padding:20px 22px}
.mail .ctx{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6c899f;font-weight:600;margin-bottom:10px}
.mail p{margin:0 0 12px}
.mail .rows{border:1px solid #e6eef4;border-radius:4px;margin:14px 0}
.mail .rows div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;padding:8px 12px;font-size:13.5px}
.mail .rows div+div{border-top:1px solid #e6eef4}
.mail .rows b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6c899f;font-weight:700;padding-top:2px}
.mail .mbtn{display:inline-block;background:#0d314c;color:#fff;border:0;border-radius:4px;padding:11px 22px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:inherit}
.mail .mbtn:hover{background:#14486e}
.mail .code{color:#0d314c;font-family:var(--mono);font-size:30px;letter-spacing:.18em;font-weight:600;background:#e4f2fb;border-radius:4px;padding:12px 16px;text-align:center;margin:8px 0 14px}
.mail .note{background:#f2f7fb;border-left:3px solid #74bfeb;padding:10px 12px;font-size:13px;color:#456179;margin-top:14px}
.mail .mf{padding:12px 22px;border-top:1px solid #e6eef4;font-size:12px;color:#7794aa}
.how{display:flex;flex-direction:column;gap:12px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
.how ol b{color:var(--ink)}
.signbox{display:flex;flex-direction:column;gap:14px}
.signbox h3{font-size:20px}
.signbox .who{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.signbox .who .mono{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.codein{font-family:var(--mono);font-size:28px;letter-spacing:.3em;text-align:center;padding:12px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.remember input{width:18px;height:18px;margin-top:2px;accent-color:var(--good)}
.err{color:var(--bad);font-size:13.5px;font-weight:500}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tblwrap,.q,.panel,.trig{position:relative}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

var DATA = {"areas":[{"code":"UD","name":"Use-Case Documentation"},{"code":"OA","name":"Ownership and Accountability"},{"code":"RA","name":"Risk Assessment"},{"code":"DG","name":"Data Governance"},{"code":"TE","name":"Testing"},{"code":"HO","name":"Human Oversight"},{"code":"TP","name":"Third-Party Oversight"},{"code":"MO","name":"Monitoring"},{"code":"CM","name":"Change Management"},{"code":"ER","name":"Governance Recordkeeping and Evidence Retention"}],"product":[{"k":"a01","sec":"Applicant","label":"Legal Organization Name","type":"Text","opts":null,"req":true,"help":"The legal applicant name."},{"k":"a02n","sec":"Primary Contact","label":"Name","type":"Text","opts":null,"req":true,"help":null},{"k":"a02t","sec":"Primary Contact","label":"Title","type":"Text","opts":null,"req":false,"help":null},{"k":"a02e","sec":"Primary Contact","label":"Email","type":"Text","opts":null,"req":true,"help":null},{"k":"a02p","sec":"Primary Contact","label":"Phone","type":"Text","opts":null,"req":false,"help":null},{"k":"a03n","sec":"Technical Contact","label":"Name","type":"Text","opts":null,"req":false,"help":null},{"k":"a03t","sec":"Technical Contact","label":"Title","type":"Text","opts":null,"req":false,"help":null},{"k":"a03e","sec":"Technical Contact","label":"Email","type":"Text","opts":null,"req":false,"help":null},{"k":"a04n","sec":"Executive Sponsor","label":"Name","type":"Text","opts":null,"req":false,"help":null},{"k":"a04t","sec":"Executive Sponsor","label":"Title","type":"Text","opts":null,"req":false,"help":null},{"k":"a04e","sec":"Executive Sponsor","label":"Email","type":"Text","opts":null,"req":false,"help":null},{"k":"b01","sec":"Product Scope","label":"Product Name","type":"Text","opts":null,"req":true,"help":"The product you are submitting for certification."},{"k":"b02","sec":"Product Scope","label":"Version or Release Range","type":"Text","opts":null,"req":true,"help":"Use the same version wording in every piece of evidence."},{"k":"b03","sec":"Product Scope","label":"What the Product Does","type":"Long text","opts":null,"req":true,"help":"Which modules or components are inside the certification boundary?"},{"k":"b04","sec":"Product Scope","label":"Deployment Model","type":"Select","opts":"Vendor-hosted SaaS | Customer-hosted | Hybrid | On-premises / Installed | Other","req":true,"help":null},{"k":"b05","sec":"Product Scope","label":"Number of AI Use Cases","type":"Number","opts":"1 to 40","req":true,"help":"One profile is created for each."},{"k":"b06","sec":"Product Scope","label":"Production / General Availability Date","type":"Date","opts":null,"req":true,"help":null}],"usecase":[{"k":"uc-name","label":"Use Case Name","type":"Text","opts":null,"req":true,"help":"A short business-facing name, such as Borrower FAQ Assistant."},{"k":"uc-cap","label":"AI Capability or Feature","type":"Text","opts":null,"req":true,"help":"The AI-enabled feature behind it, such as a generative chatbot."},{"k":"uc-purpose","label":"Business Purpose","type":"Long text","opts":null,"req":true,"help":"What is this use of AI meant to accomplish?"},{"k":"uc-status","label":"Production Status","type":"Select","opts":"Production - In Scope | In Development - Future Version | Retired / Disabled","req":true,"help":null},{"k":"uc-date","label":"Production / GA Date","type":"Date","opts":null,"req":true,"help":null},{"k":"uc-users","label":"Intended Users","type":"Text","opts":null,"req":true,"help":"Borrowers, servicing staff, underwriters, and so on."},{"k":"uc-inputs","label":"Key Inputs","type":"Long text","opts":null,"req":true,"help":"The main data or information it consumes."},{"k":"uc-outputs","label":"Key Outputs","type":"Long text","opts":null,"req":true,"help":"The main thing it produces."},{"k":"uc-influence","label":"How the Output Is Used","type":"Long text","opts":null,"req":true,"help":"Does it inform, recommend, or carry out a decision or action?"},{"k":"uc-tech","label":"Technology Type","type":"Select","opts":"Internally Developed ML/AI | Third-Party Model | Generative AI / LLM | External AI API / Service | Rules + ML/AI | Multiple / Hybrid | Other","req":true,"help":null},{"k":"uc-resp","label":"Responsibility Model","type":"Select","opts":"Vendor-Controlled | Customer-Controlled | Shared","req":true,"help":null},{"k":"uc-owner","label":"Accountable Owner","type":"Text","opts":null,"req":true,"help":"The named person accountable for this use case."},{"k":"uc-limits","label":"Known Limitations and Key Risk Notes","type":"Long text","opts":null,"req":true,"help":"What should the assessor understand up front?"}],"triggers":[{"id":"T01","name":"Customer / Consumer Facing","q":"Will a customer or consumer directly see or interact with the AI output?","means":"For example a borrower-facing chatbot or an AI-written message sent to a customer. Staff-only use is not direct customer exposure."},{"id":"T02","name":"Consequential Influence","q":"Does the AI materially influence a financial, customer, compliance, safety or operational outcome?","means":"Include recommendations people act on, even when a person makes the final call."},{"id":"T03","name":"Automated Action / Workflow","q":"Does the AI carry out an action, or play a material part in an automated workflow?","means":"For example automatically routing, assigning, approving or updating a record without a person in between."},{"id":"T04","name":"Sensitive / Protected Data","q":"Does this use case use, produce or process sensitive, protected or regulated data?","means":"For example borrower financial information, credit data, or other protected personal information."},{"id":"T05","name":"Generative AI","q":"Does this use case generate or transform content using generative AI?","means":"Large language model answers, summaries, rewritten text, generated documents or images."},{"id":"T06","name":"Customer Action Material to Safe Use","q":"Does safe or effective use depend on something the customer has to do?","means":"Customer configuration, customer-supplied data, review, monitoring, escalation or any other required customer action."},{"id":"T07","name":"Human Review Is a Material Control","q":"Is human review, approval, override or intervention relied on as a material control?","means":"Answer Yes when that human step is a key part of keeping the risk in check — whether your staff or the customer's."},{"id":"T08","name":"Material Third Party","q":"Does this use case materially rely on an external model, provider, data source, API, service or subprocessor?","means":"Material means a failure or change there could meaningfully affect your outputs, data protection, compliance or continuity."},{"id":"T09","name":"Material AI Incident / Failure","q":"Has a material AI-related incident or failure occurred that needs assessment, remediation or closure?","means":"Include incidents you have already handled, so the assessor can review the response and the closure records."},{"id":"T10","name":"Material Change Requiring Revalidation","q":"Has a material change occurred that requires post-change validation or risk reassessment under your change process?","means":"Use your own documented change rules. This asks whether such a change happened, not just whether a process exists."}],"questions":[{"id":"UD-1.1","a":"UD","lv":"F","t":[],"q":"Describe this use case: what it does, who uses it, what goes in, what comes out, and who owns it.","req":"The vendor captures current use-case information for the assessment, including the certified product/version, use-case purpose, users, key inputs/outputs, how the AI output is used, and accountable owner.","up":"Completed use-case information covering product/version, purpose, users, inputs/outputs, decision influence, and owner; existing use-case documentation may be provided as supporting evidence.","ver":"The assessor verifies the completed use-case information includes the certified product/version, purpose, users, key inputs/outputs, decision influence, and accountable owner and is consistent with the other evidence provided.","vchk":"Reads as verbatim"},{"id":"UD-1.2","a":"UD","lv":"F","t":[],"q":"What is this AI meant to be used for — and what is it not meant to be used for?","req":"The vendor documents the intended use, unsupported or prohibited uses, and known limitations for the use case.","up":"Use-case documentation or user/implementation guidance listing intended use, unsupported/prohibited uses, and known limitations.","ver":"The assessor verifies the use-case documentation or user/implementation guidance clearly states the intended use, unsupported or prohibited uses, and known material limitations.","vchk":"Reads as verbatim"},{"id":"UD-1.C1","a":"UD","lv":"F","t":["T01"],"q":"What do customers or consumers see that tells them AI is involved, and what it can and cannot do?","req":"The vendor provides required customer or consumer notices, limitations, or AI-use disclosures when the applicable condition is present.","up":"Applicable customer/consumer notice, disclosure, limitation statement, or implementation guidance.","ver":"The assessor verifies, when the condition applies, that the customer/consumer notice, disclosure, limitation statement, or implementation guidance clearly communicates the applicable AI use, material limitations, and required cautions.","vchk":"Reads as verbatim"},{"id":"UD-2.1","a":"UD","lv":"M","t":[],"q":"Where does the approved, version-controlled documentation for this use case live, and what does it say about dependencies, deployment and who is responsible for what?","req":"The vendor maintains approved, version-controlled use-case documentation that identifies key dependencies, deployment context, and vendor/customer/shared responsibilities.","up":"Approved, version-controlled use-case document showing dependencies, deployment context, and responsibility boundaries.","ver":"The assessor verifies the approved, version-controlled use-case documentation identifies the owner, effective date/version, key dependencies, deployment context, and vendor/customer/shared responsibility boundaries.","vchk":"Reads as verbatim"},{"id":"UD-2.2","a":"UD","lv":"M","t":[],"q":"How often is that documentation reviewed and updated, and who does it?","req":"The vendor documents and follows a process for reviewing and updating use-case documentation on a defined schedule and after material changes.","up":"Documented review/update procedure or standard; plus at least one completed scheduled or change-triggered review/update record.","ver":"The assessor verifies the documented review/update procedure defines who performs the review, the review frequency, material-change triggers, and update controls, and that the completed review/update record shows the process was followed.","vchk":"Reads as verbatim"},{"id":"UD-2.C1","a":"UD","lv":"M","t":["T06"],"q":"What guidance do you give customers for the things they have to do to use this safely and effectively?","req":"The vendor provides customer enablement guidance that supports safe, compliant, and effective use when material controls or responsibilities depend on customer action.","up":"Current customer implementation/use guidance, configuration/data requirements, limitations, review/monitoring expectations, and relevant training/support/change notices.","ver":"The assessor verifies, when the condition applies, that the customer implementation/use guidance addresses the applicable configuration or data requirements, limitations, review or monitoring responsibilities, escalation expectations, and relevant training/support.","vchk":"Reads as verbatim"},{"id":"UD-3.1","a":"UD","lv":"V","t":[],"q":"How can an assessor find the testing, monitoring, change, incident and approval records that belong to this use case and this product version?","req":"The vendor maintains current use-case information and assessment evidence that allow the assessor to identify the testing, monitoring, change, incident, and approval evidence associated with the use case and certified product version.","up":"Applicable testing, monitoring, change, incident, and approval evidence associated with the use case and requirement(s).","ver":"The assessor verifies the testing, monitoring, change, incident, and approval records can be associated with the applicable use case, certified product version, and requirement(s).","vchk":"Reads as verbatim"},{"id":"UD-3.2","a":"UD","lv":"V","t":[],"q":"How do you check that your use-case documentation is still complete and accurate, and what do you do about gaps you find?","req":"The vendor periodically reviews use-case documentation for completeness and accuracy and documents any corrections or accepted gaps.","up":"Completed documentation-quality review and evidence that identified corrections were completed or formally accepted.","ver":"The assessor verifies the completed documentation-quality review identifies any gaps or corrections and shows they were completed or formally accepted.","vchk":"Reads as verbatim"},{"id":"OA-1.0","a":"OA","lv":"F","t":[],"q":"What AI governance policy or standard applies to this product, who owns it, and how often is it reviewed?","req":"The vendor maintains a current AI governance policy, standard, or equivalent framework that applies to the certified product and has an accountable owner and review cadence.","up":"Current AI governance policy/standard/framework; named owner; approval/authority record; review date or cadence.","ver":"The assessor verifies the AI governance policy, standard, or equivalent framework is current, applies to the certified product, identifies an accountable owner, and defines the review cadence.","vchk":"Reads as verbatim"},{"id":"OA-1.1","a":"OA","lv":"F","t":[],"q":"Who is the named person accountable for this use case, and what authority do they have?","req":"The vendor assigns a current accountable business or product owner with authority for the use case.","up":"Ownership record naming the accountable business/product owner and role/authority.","ver":"The assessor verifies the ownership record or RACI identifies an accountable business or product owner with authority for the use case.","vchk":"Reads as verbatim"},{"id":"OA-1.2","a":"OA","lv":"F","t":[],"q":"When something goes wrong with the AI, who is told and in what order — and where does your responsibility end and the customer’s begin?","req":"The vendor documents a basic escalation path and vendor/customer/shared responsibility boundaries.","up":"Escalation path and vendor/customer/shared responsibility matrix or equivalent documentation.","ver":"The assessor verifies the documented escalation path identifies escalation triggers, responsible contacts or functions, handoffs, and vendor/customer/shared responsibility boundaries.","vchk":"Reads as verbatim"},{"id":"OA-2.1","a":"OA","lv":"M","t":[],"q":"Which roles do what across your AI work — build, review, approve, monitor, escalate — and who holds authority for approvals, exceptions and risk acceptance?","req":"The vendor formalizes stakeholders, RACI, approval authority, and decision rights for the use case.","up":"Approved RACI/governance record showing stakeholders, approval authority, and decision rights.","ver":"The assessor verifies the approved RACI or governance record defines responsible, accountable, consulted, and informed parties and the authority for approvals, exceptions, risk acceptance, and material changes.","vchk":"Reads as verbatim"},{"id":"OA-2.2","a":"OA","lv":"M","t":[],"q":"What has to happen before an exception or an accepted risk is allowed, and who can sign it off?","req":"The vendor ensures required reviews, approvals, and escalations are performed by the assigned roles and are recorded.","up":"Representative approval, review, exception, and/or escalation records.","ver":"The assessor verifies completed approval, review, exception, or escalation records show the documented governance process was followed by the assigned roles.","vchk":"Reads as verbatim"},{"id":"OA-3.1","a":"OA","lv":"V","t":[],"q":"How does governance oversight of this use case actually happen — who meets, how often, and what gets decided?","req":"The vendor subjects material use-case decisions to qualified review or challenge appropriate to risk and complexity.","up":"Qualified review/challenge record showing questions/findings and disposition.","ver":"The assessor verifies the qualified review or challenge record addresses material assumptions, evidence, or conclusions and documents resolution or acceptance.","vchk":"Reads as verbatim"},{"id":"OA-3.2","a":"OA","lv":"V","t":[],"q":"Show a decision or action this oversight produced and how it was followed through.","req":"The vendor provides periodic AI governance reporting to management and records resulting decisions, actions, and closure.","up":"Periodic management report/dashboard plus meeting/decision records and action closure evidence.","ver":"The assessor verifies the management reporting and decision/action records address relevant performance, risk, incidents, exceptions, or material changes and show resulting actions or closure.","vchk":"Reads as verbatim"},{"id":"RA-1.1","a":"RA","lv":"F","t":[],"q":"What risk level did you give this use case before considering any controls, and why?","req":"The vendor documents an initial risk level before considering controls (inherent risk) and supporting rationale for the use case.","up":"Completed risk-characterization record showing the initial risk level (inherent risk) and use-case-specific rationale.","ver":"The assessor verifies the completed risk-characterization record documents the initial risk level before considering controls (inherent risk) and a use-case-specific rationale consistent with the use case characteristics.","vchk":"Reads as verbatim"},{"id":"RA-1.2","a":"RA","lv":"F","t":[],"q":"What could go wrong with this use case, and who would be affected?","req":"The vendor identifies material risk pathways, affected parties, the mortgage/business process influenced, key dependencies, and known limitations.","up":"Risk/impact summary identifying key risk pathways, affected parties, mortgage/business process, dependencies, and limitations.","ver":"The assessor verifies the impact or risk assessment identifies material risk pathways, affected parties, the mortgage/business process influenced, key dependencies, and known limitations.","vchk":"Reads as verbatim"},{"id":"RA-1.3","a":"RA","lv":"F","t":[],"q":"Which laws, regulations and contractual obligations apply to this product’s use of AI — or on what basis have you determined that none materially apply?","req":"The vendor identifies applicable legal, regulatory, compliance, contractual, and policy obligations, or documents a supported determination that no material obligation applies.","up":"Legal/regulatory/compliance/contractual/policy applicability review or documented determination that no material obligation applies.","ver":"The assessor verifies the legal/regulatory/compliance applicability review identifies material obligations and constraints or documents a supported determination that no material obligation applies.","vchk":"Reads as verbatim"},{"id":"RA-2.1","a":"RA","lv":"M","t":[],"q":"What is your documented process for assessing AI risk, and how was it applied here?","req":"The vendor performs a formal risk assessment that evaluates the initial risk level before considering controls (inherent risk), mapped controls, residual risk, applicable requirements, and risk acceptance.","up":"Approved formal risk assessment showing the initial risk level (inherent risk), mapped controls, residual risk, actions/conditions, and acceptance/approval.","ver":"The assessor verifies the approved formal risk assessment documents the initial risk level before considering controls (inherent risk), mapped controls, residual risk, applicable requirements, actions or conditions, and approval or acceptance.","vchk":"Reads as verbatim"},{"id":"RA-2.2","a":"RA","lv":"M","t":[],"q":"What controls reduce the risks you identified, and what risk is left over?","req":"The vendor documents and follows a risk review and acceptance process with a defined review cadence, decision authority, escalation path, and completed records showing the process was followed.","up":"Documented risk review/acceptance procedure or standard; plus representative completed review/approval/escalation records.","ver":"The assessor verifies the documented risk review/acceptance process defines the review cadence, decision authority, escalation path, and acceptance expectations, and that completed review records show the process was followed.","vchk":"Reads as verbatim"},{"id":"RA-2.3","a":"RA","lv":"M","t":[],"q":"When is this risk assessment redone — on a schedule, or triggered by something?","req":"The vendor documents how material legal, regulatory, compliance, contractual, or policy obligations identified for the use case are addressed by controls, owners, evidence, and approval/acceptance decisions.","up":"the legal/regulatory/compliance applicability review and, where material obligations are identified, the requirement-to-control/owner/evidence mapping and approval or acceptance record. If no material obligation is identified, the uploaded applicability review should document that conclusion.","ver":"The assessor verifies the applicability review and requirement/control mapping show how identified material obligations are addressed by controls, owners, supporting evidence, and approval or acceptance decisions.","vchk":"Reads as verbatim"},{"id":"RA-2.C1","a":"RA","lv":"M","t":["T02","T03","T04"],"q":"What extra governance did you apply because of the characteristics you flagged in the trigger questions?","req":"The vendor applies additional governance review, approval, escalation, or acceptance when the applicable higher-impact use-case condition is present.","up":"Evidence of the additional review, approval, escalation, documentation, or acceptance required for the triggered characteristic(s).","ver":"The assessor verifies, when the condition applies, that the approval, escalation, or risk-acceptance records show the required additional governance action was performed and followed through.","vchk":"Reads as verbatim"},{"id":"RA-3.1","a":"RA","lv":"V","t":[],"q":"Show a completed risk review and the actions that came out of it.","req":"The vendor subjects risk assumptions, initial risk-level assignment, control conclusions, and residual-risk decisions to qualified challenge appropriate to the use case.","up":"Qualified risk review/challenge record and documented resolution/acceptance of questions or findings.","ver":"The assessor verifies the qualified challenge record addresses material risk assumptions, initial risk-level assignment, control conclusions, and residual-risk decisions and documents resolution or acceptance.","vchk":"Reads as verbatim"},{"id":"RA-3.2","a":"RA","lv":"V","t":[],"q":"How do you confirm the controls you relied on are actually working?","req":"The vendor refreshes the risk assessment on a defined schedule and after material changes, incidents, monitoring findings, or other material risk triggers.","up":"Most recent scheduled risk review and any relevant event-driven refresh records.","ver":"The assessor verifies the periodic or event-driven risk review records show the risk assessment was refreshed as required and that material actions or decisions were documented.","vchk":"Reads as verbatim"},{"id":"DG-1.1","a":"DG","lv":"F","t":[],"q":"What data does this use case use, where does it come from, and what is it allowed to be used for?","req":"The vendor identifies material data sources, categories, sensitivity, permitted use/access, primary security/privacy considerations, and material limitations.","up":"Current data inventory/data flow identifying material sources, data categories, sensitivity, permitted use/access, security/privacy handling, and limitations.","ver":"The assessor verifies the evidence provided, including Current data inventory/data flow identifying material sources, data categories, sensitivity, permitted use/access, security/privacy handling, and limitations, is current and sufficient to demonstrate that the vendor identifies material data sources, categories, sensitivity, permitted use/access, primary security/privacy considerations, and material limitations.","vchk":"Confirm against workbook"},{"id":"DG-1.2","a":"DG","lv":"F","t":[],"q":"Who can access this data and the model, and how is that access controlled?","req":"The vendor documents data ownership and known quality, coverage, or representativeness constraints.","up":"Data owner/steward record and documentation of known quality, coverage, bias, or representativeness limitations.","ver":"The assessor verifies the evidence provided, including Data owner/steward record and documentation of known quality, coverage, bias, or representativeness limitations, is current and sufficient to demonstrate that the vendor documents data ownership and known quality, coverage, or representativeness constraints.","vchk":"Confirm against workbook"},{"id":"DG-2.1","a":"DG","lv":"M","t":[],"q":"What does your data governance standard set out — permitted use, access and security, retention, lineage, quality checks — and who is responsible for each?","req":"The vendor formally defines permitted use, access/security, retention, lineage, quality checks, and responsibilities.","up":"Approved data governance procedure/standard covering permitted use, access/security, retention, lineage, quality checks, and responsibilities.","ver":"The assessor verifies the evidence provided, including Approved data governance procedure/standard covering permitted use, access/security, retention, lineage, quality checks, and responsibilities, is current and sufficient to demonstrate that the vendor formally defines permitted use, access/security, retention, lineage, quality checks, and responsibilities.","vchk":"Confirm against workbook"},{"id":"DG-2.2","a":"DG","lv":"M","t":[],"q":"How long is this data kept, and how is it disposed of?","req":"The vendor retains representative completed records showing that the defined data controls were followed.","up":"Representative access approvals, quality checks, lineage/transformation records, retention/deletion records, and issue follow-up as applicable.","ver":"The assessor verifies the evidence provided, including Representative access approvals, quality checks, lineage/transformation records, retention/deletion records, and issue follow-up as applicable, is current and sufficient to demonstrate that the vendor retains representative completed records showing that the defined data controls were followed.","vchk":"Confirm against workbook"},{"id":"DG-2.C1","a":"DG","lv":"M","t":["T04"],"q":"What extra protections are in place because this use case handles sensitive, protected or regulated data?","req":"The vendor implements additional privacy, permitted-use, or data-protection controls when sensitive or protected data is present.","up":"Use-case-specific privacy/data-protection requirements plus representative evidence of access restrictions, minimization, handling, or retention controls.","ver":"The assessor verifies, when the condition applies, that the evidence provided, including Use-case-specific privacy/data-protection requirements plus representative evidence of access restrictions, minimization, handling, or retention controls, is current and sufficient to demonstrate that the vendor implements additional privacy, permitted-use, or data-protection controls when sensitive or protected data is present.","vchk":"Confirm against workbook"},{"id":"DG-3.1","a":"DG","lv":"V","t":[],"q":"Show evidence that data quality is monitored and that issues get fixed.","req":"The vendor monitors data quality and data-control performance, investigates relevant drift, representativeness, coverage, privacy, or similar issues identified for the use case, and documents remediation or acceptance of material findings.","up":"Recent data-quality/control monitoring outputs plus records of investigation, remediation, or formal acceptance of material issues.","ver":"The assessor verifies the evidence provided, including Recent data-quality/control monitoring outputs plus records of investigation, remediation, or formal acceptance of material issues, is current and sufficient to demonstrate that the vendor monitors data quality and data-control performance, investigates relevant drift, representativeness, coverage, privacy, or similar issues identified for the use case, and documents remediation or acceptance of material findings.","vchk":"Confirm against workbook"},{"id":"DG-3.2","a":"DG","lv":"V","t":[],"q":"How do you trace data from source through to AI output?","req":"The vendor periodically evaluates whether data controls remain effective and whether material data issues or trends require control changes, remediation, or a supported no-change decision.","up":"Completed periodic data-control effectiveness review and resulting improvement or approved no-change decision.","ver":"The assessor verifies the evidence provided, including Completed periodic data-control effectiveness review and resulting improvement or approved no-change decision, is current and sufficient to demonstrate that the vendor periodically evaluates whether data controls remain effective and whether material data issues or trends require control changes, remediation, or a supported no-change decision.","vchk":"Confirm against workbook"},{"id":"TE-1.1","a":"TE","lv":"F","t":[],"q":"What testing has been done on this use case, by whom, and what was it meant to cover?","req":"The vendor performs basic testing for the assessed production version and documents the responsible role and intended testing scope.","up":"Basic test results or test summary for the assessed production version; documentation of testing scope/objectives and responsible role.","ver":"The assessor verifies the basic test evidence shows testing was performed for the assessed production version and identifies the responsible role and intended testing scope.","vchk":"Reads as verbatim"},{"id":"TE-1.2","a":"TE","lv":"F","t":[],"q":"What were the results, and what happened to anything that failed?","req":"The vendor documents known material defects or limitations identified through testing or use and records the applicable disposition, escalation, mitigation, or formal acceptance.","up":"Defect/limitation log or equivalent record showing material issues, disposition/escalation, mitigation, or formal acceptance.","ver":"The assessor verifies the defect, limitation, or issue record identifies material findings and documents the applicable disposition, escalation, mitigation, or formal acceptance.","vchk":"Reads as verbatim"},{"id":"TE-2.1","a":"TE","lv":"M","t":[],"q":"What does your written test plan cover — scenarios, methods, test data, acceptance criteria, and who runs it?","req":"The vendor maintains a written test plan that defines risk-relevant coverage, scenarios, methods, data or test conditions, and responsible roles.","up":"Approved written test plan covering risk-relevant scenarios, methods/conditions, data, and responsible roles.","ver":"The assessor verifies the written test plan defines risk-relevant coverage, scenarios, methods, test data or conditions, and responsible roles.","vchk":"Reads as verbatim"},{"id":"TE-2.2","a":"TE","lv":"M","t":[],"q":"How are test failures tracked, fixed and retested?","req":"The vendor maintains documented test cases that define expected results, acceptance criteria, and exception or defect handling.","up":"Documented test cases/equivalent artifacts with expected results, acceptance criteria, and defect/exception handling.","ver":"The assessor verifies the documented test cases define expected results, acceptance criteria, and exception or defect handling.","vchk":"Reads as verbatim"},{"id":"TE-2.C1","a":"TE","lv":"M","t":["T01","T02","T03","T04","T05"],"q":"How does your test plan cover each characteristic you flagged in the trigger questions?","req":"The vendor includes additional test coverage for the applicable use-case condition(s) identified during use-case intake.","up":"Test-plan/test-case coverage addressing each characteristic that triggered this requirement.","ver":"The assessor verifies, when the condition applies, that the test plan and test cases include additional coverage appropriate to the applicable use-case characteristics.","vchk":"Reads as verbatim"},{"id":"TE-3.1","a":"TE","lv":"V","t":[],"q":"How often is this retested, and when was it last done?","req":"The vendor performs testing on a defined schedule or at required lifecycle points and retains recent or representative results.","up":"Recent/representative completed test results showing the defined test cadence or lifecycle trigger was followed.","ver":"The assessor verifies the test execution results show testing was performed on the defined schedule or required lifecycle points and that recent or representative results were retained.","vchk":"Reads as verbatim"},{"id":"TE-3.2","a":"TE","lv":"V","t":[],"q":"Show recent completed test results for this use case.","req":"The vendor documents testing results, material exceptions or defects, and resulting decisions and completes required follow-through, including revalidation when required.","up":"Test result/exception records, defect dispositions, decisions, and revalidation evidence where triggered.","ver":"The assessor verifies the test results, defect/exception records, and closure or revalidation records show material findings were evaluated and required follow-through was completed.","vchk":"Reads as verbatim"},{"id":"TE-3.3","a":"TE","lv":"V","t":[],"q":"How do you decide whether test results are good enough, and what happens when they are not?","req":"The vendor subjects test design, coverage, results, and conclusions to qualified challenge appropriate to risk and complexity.","up":"Qualified review/challenge of test design, coverage, thresholds, results, and conclusions.","ver":"The assessor verifies the validation or challenge record demonstrates qualified review of test design, coverage, results, and conclusions appropriate to the use case.","vchk":"Reads as verbatim"},{"id":"TE-3.C1","a":"TE","lv":"V","t":["T01","T02","T03","T04","T05"],"q":"What specialized testing have you completed for each characteristic that needed extra coverage, and what did it find?","req":"The vendor performs specialized testing for each applicable use-case condition that triggered additional testing at Managed maturity.","up":"Completed specialized testing results for each characteristic that activated TE-2.C1, with documented findings/limitations.","ver":"The assessor verifies, when the condition applies, that specialized test results demonstrate the additional testing identified for the use case was performed and material findings were evaluated and addressed.","vchk":"Reads as verbatim"},{"id":"HO-1.1","a":"HO","lv":"F","t":[],"q":"Where does a person sit in this workflow, and what can they do?","req":"The vendor documents the oversight and intervention model for the use case, or documents the rationale for no routine human review.","up":"Documented oversight/intervention model or documented rationale for no routine human review.","ver":"The assessor verifies the evidence provided, including Documented oversight/intervention model or documented rationale for no routine human review, is current and sufficient to demonstrate that the vendor documents the oversight and intervention model for the use case, or documents the rationale for no routine human review.","vchk":"Confirm against workbook"},{"id":"HO-1.2","a":"HO","lv":"F","t":[],"q":"How does someone know when to step in?","req":"The vendor defines a basic escalation and intervention path appropriate to the use case.","up":"Basic escalation/intervention procedure showing triggers, responsible parties, authority, and response actions.","ver":"The assessor verifies the evidence provided, including Basic escalation/intervention procedure showing triggers, responsible parties, authority, and response actions, is current and sufficient to demonstrate that the vendor defines a basic escalation and intervention path appropriate to the use case.","vchk":"Confirm against workbook"},{"id":"HO-1.C1","a":"HO","lv":"F","t":["T02"],"q":"How can an authorized person intervene or override the AI when it influences a consequential outcome?","req":"The vendor defines escalation and authorized intervention or override capability for use cases with consequential influence.","up":"Consequential-use intervention/override procedure showing triggers, authority, and response path.","ver":"The assessor verifies, when the condition applies, that the evidence provided, including Consequential-use intervention/override procedure showing triggers, authority, and response path, is current and sufficient to demonstrate that the vendor defines escalation and authorized intervention or override capability for use cases with consequential influence.","vchk":"Confirm against workbook"},{"id":"HO-1.C2","a":"HO","lv":"F","t":["T03"],"q":"How can an automated action or workflow be stopped, recovered or brought to a safe state?","req":"The vendor provides appropriate fallback, recovery, interruption, shutdown, or safe-state capability for automated actions or materially disruptive automated workflows.","up":"Fallback/recovery/interruption/shutdown/safe-state procedure appropriate to the deployment model.","ver":"The assessor verifies, when the condition applies, that the evidence provided, including Fallback/recovery/interruption/shutdown/safe-state procedure appropriate to the deployment model, is current and sufficient to demonstrate that the vendor provides appropriate fallback, recovery, interruption, shutdown, or safe-state capability for a function ftype(n){ var e = (n.split(".").pop() || "").toLowerCase(); var c = { pdf:"#b3372c", doc:"#2477b8", docx:"#2477b8", xls:"#0f7b5c", xlsx:"#0f7b5c", csv:"#0f7b5c", ppt:"#c25a1d", pptx:"#c25a1d", png:"#6b5bb5", jpg:"#6b5bb5", jpeg:"#6b5bb5", zip:"#55687a" }[e] || "#55687a"; return '<span class="ftype" style="background:' + c + '">' + esc(e.slice(0, 4).toUpperCase() || "FILE") + "</span>"; }
function ringSvg(p, size, stroke, track, color){ var r = (size - stroke) / 2, c = 2 * Math.PI * r; return '<svg viewBox="0 0 ' + size + " " + size + '" aria-hidden="true"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + track + '" stroke-width="' + stroke + '"/><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + (c * p).toFixed(1) + " " + c.toFixed(1) + '"/></svg>'; }

function qsFor(uc){ return QS.filter(function(q){ return !q.t.length || q.t.some(function(t){ return uc.trig[t] === "y"; }); }); }
function ansOf(uc, id){ return uc.ans[id] || null; }
function qState(uc, q){ var a = ansOf(uc, q.id); if (!a || !filled(a.text)) return a && a.drafted ? "todo" : "todo"; return a.drafted ? "drafted" : "done"; }
function ucStats(uc){
  var prof = UF.filter(function(f){ return f.req; }), pDone = prof.filter(function(f){ return filled(uc.f[f.k]); }).length;
  var tDone = TRIG.filter(function(t){ return uc.trig[t.id]; }).length;
  var qs = qsFor(uc), qDone = 0, qDraft = 0;
  qs.forEach(function(q){ var s = qState(uc, q); if (s === "done") qDone++; else if (s === "drafted") qDraft++; });
  var total = prof.length + TRIG.length + qs.length, done = pDone + tDone + qDone;
  return { pDone: pDone, pTot: prof.length, tDone: tDone, tTot: TRIG.length, qDone: qDone, qDraft: qDraft, qTot: qs.length, pct: total ? done / total : 0 };
}
function prodStats(){ var req = PF.filter(function(f){ return f.req; }); var d = req.filter(function(f){ return filled(S.product[f.k]); }).length; return { done: d + (S.attest ? 1 : 0), tot: req.length + 1 }; }
function overall(){
  var p = prodStats(), docsOk = S.docs.length ? 1 : 0, d = p.done + docsOk, t = p.tot + 1;
  S.ucs.forEach(function(u){ var s = ucStats(u); d += s.pDone + s.tDone + s.qDone; t += s.pTot + s.tTot + s.qTot; });
  return t ? d / t : 0;
}

      '<p><button type="button" class="mbtn" data-g="1">Open My Portal</button></p><div class="note">This link is yours. When you open it we email you a sign-in code, so it only works for you. To add teammates, open the portal and choose Add a Teammate; each person signs in with their own code.</div>', "Invitation email") +
      '<div class="panel how"><div class="pb"><div class="sectlabel">What Happens</div><ol><li><b>Application paid.</b> The CMS opens the portal and this email goes out (only once MISMO approves it).</li><li><b>They click Open My Portal.</b> The portal knows which company it is, but asks for a code first.</li><li><b>A six-digit code is emailed</b> to the address on file. Good for 10 minutes.</li><li><b>Signed in.</b> On their own device they stay signed in for 30 days; otherwise they sign in again with a new code.</li><li><b>Teammates</b> are added from the portal and get their own codes. MISMO can open any company\'s portal from the CMS.</li></ol></div></div></div>';
  } else if (G.s === 1){
    h += '<div class="gcols"><div class="panel"><div class="pb signbox"><h3>Sign in to your certification portal</h3><div class="who"><span class="mono">' + esc(first.charAt(0)) + '</span><div><b>' + esc(pr.a01) + '</b><br><span class="muted" style="font-size:13px">' + esc(pr.b01) + " · AI Governance Certification</span></div></div>" +
      "<p style=\"margin:0\">We'll email a six-digit sign-in code to <b>" + esc(maskEmail(pr.a02e)) + '</b>.</p><div><button class="btn" type="button" data-g="2">Email Me a Code</button></div><p class="muted" style="margin:0;font-size:13px">Not you, or need a different address? Email certifications@mismo.org.</p></div></div>' +
      '<div class="panel how"><div class="pb"><div class="sectlabel">Why a Code</div><ol><li>No password for the company to create or forget.</li><li>A forwarded or leaked link is useless without the inbox.</li><li>Only addresses MISMO has on file for this application, plus teammates they add, can get a code.</li></ol></div></div></div>';
  } else if (G.s === 2){
    h += '<div class="gcols">' + mailFrame("Your MISMO sign-in code",
      '<div class="ctx">Sign-In Code · AI Governance Certification</div><p>Hello ' + esc(first) + ",</p><p>Here is your code to sign in to the " + esc(pr.b01) + ' certification portal:</p><div class="code">' + G.code.slice(0, 3) + " " + G.code.slice(3) + '</div><p>It works once and expires in 10 minutes.</p><div class="note">If you didn\'t ask for this code, you can ignore this email. Nobody can sign in without it.</div>', "Sign-in code email") +
      '<div class="panel"><div class="pb signbox"><h3>Enter your code</h3><p class="muted" style="margin:0">We sent it to ' + esc(maskEmail(pr.a02e)) + '.</p><label class="sr" for="codein">Six-digit code</label><input class="in codein" id="codein" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000">' +
      (G.err ? '<div class="err" role="alert">' + esc(G.err) + "</div>" : "") +
      '<label class="remember"><input type="checkbox" id="remember" checked> Keep me signed in on this device for 30 days</label><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="button" data-g="3">Sign In</button><button class="btn ghost" type="button" data-g="fill">Fill It In for Me</button></div><p class="muted" style="margin:0;font-size:13px">Didn\'t get it? <button type="button" class="linkbtn" data-g="1">Send a new code</button></p></div></div></div>';
  }
  g.innerHTML = h;
}
function showGate(on){
  $("gate").hidden = !on; $("hero").hidden = on; $("steps").parentNode.hidden = on; $("main").hidden = on;
  if (on) paintGate();
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-g]"); if (!b) return;
  var v = b.getAttribute("data-g");
  if (v === "fill"){ var i = $("codein"); if (i){ i.value = G.code.slice(0, 3) + " " + G.code.slice(3); i.focus(); } return; }
  if (v === "3"){ var c = (($("codein") || {}).value || "").replace(/\D/g, ""); if (c !== G.code){ G.err = c ? "That code doesn't match. Check the email and try again." : "Enter the six-digit code from the email."; paintGate(); return; } G.err = ""; setSigned(true); showGate(false); S.view = "company"; paintView(); render(); window.scrollTo(0, 0); toast("Signed in as " + S.product.a02n); return; }
  G.s = +v; G.err = ""; paintGate(); window.scrollTo({ top: 0, behavior: "smooth" });
});

/* theme */
(function theme(){
  var btn = $("theme-btn");
  function cur(){ var t = document.documentElement.getAttribute("data-theme"); if (t) return t; return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  function paint(){ btn.textContent = cur() === "dark" ? "Light" : "Dark"; }
  btn.addEventListener("click", function(){ document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark"); paint(); try { localStorage.setItem("mismo.portal.theme", cur()); } catch (e) {} });
  try { var saved = localStorage.getItem("mismo.portal.theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); } catch (e) {}
  paint();
})();
var bandWrap = document.querySelector(".band .wrap"); var rb = document.createElement("button"); rb.type = "button"; rb.id = "reset"; rb.className = "btn ghost sm"; rb.textContent = "Restore the Sample"; bandWrap.appendChild(rb);
var sb = document.createElement("button"); sb.type = "button"; sb.id = "seesign"; sb.className = "btn ghost sm"; sb.textContent = "See Sign-In"; bandWrap.appendChild(sb);
sb.addEventListener("click", function(){ setSigned(false); G.s = 0; G.err = ""; showGate(true); window.scrollTo(0, 0); });
paintView(); render(); showGate(!signedIn());
})();
</script>
