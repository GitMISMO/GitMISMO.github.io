nsmitted to the eVault System, the eVault System validates the Tamper-Evident Seal applied to such eNote/Electronic Record by recalculating the Tamper-Evident Seal and comparing the resulting value to the Tamper-Evident Seal applied to the eNote/Electronic Record, and, if such eNote/Electronic Record was registered on the MERS® eRegistry, by recalculating the Tamper-Evident Seal and comparing the resulting value to the value stored for such eNote/Electronic Record on the MERS® eRegistry.", "4. The eVault System will not accept delivery of an eNote for which there is a failure of the Tamper- Evident Seal re-computation or validation against the value stored for the corresponding eNote Record on the MERS® eRegistry.", "5. Any reproduction of an eNote or Electronic Record by the eVault System includes the contents, fonts, stylings, margins, and all other physical features required to comply under applicable state and federal laws, including an indication that it is a reproduction of an eNote or Electronic Record that was electronically signed.", "6. The eVault System safeguards the integrity of the eVault System and eNotes and Electronic Records stored within the eVault System through a firewall and other network perimeter security controls.", "7. The eVault System's encryption algorithms are compliant with NIST and FIPS 140-2 guidance.", "8. The eVault System utilizes X.509 digital certificates for device/server-based TLS/SSL session authentication which support a minimum of SHA 256 signing hash.", "9. The eVault System utilizes a minimum of 2048-bit RSA key and 128-bit AES key for the TLS session.", "10. The eVault System ensures that data is encrypted both while in transit and at rest.", "11. Any primary or backup data storage facilities (defined as any physical site offering equipment, servers, or any other computer storage device) used are permanently housed within the United States of America."], "items": [{"number": 900, "text": "Exclusions or limitations to any
