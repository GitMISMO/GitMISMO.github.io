, {"number": 10, "text": "List any other providers that the eClosing System is integrated with and describe the functions supported through such integrations, (e.g., document generation, eNotarization, eVault, eRecording)", "type": "long_text", "response_lines": 3}, {"number": 11, "text": "List the types and frequency of any reviews, tests, and internal or external audits utilized to evaluate the effectiveness of the eClosing System Provider’s Information Security Program", "type": "long_text", "response_lines": 3}]}, {"heading": "Requested Documentation", "intro": ["Tick everything you are attaching. If you do not have something, leave it unticked and say so when you submit. On a renewal you do not need to resend anything MISMO already has — only what is new or changed."], "items": [], "tables": [{"kind": "checkbox_grid", "options": ["Application of a Tamper-Evident Seal to Electronic Records", "Prevention of unauthorized access or alterations to Electronic Records", "Steps taken if an Electronic Record is subject to unauthorized access or alterations", "Storage and Reproduction of Electronic Records", "Information security programs, including, but not limited to, disaster recovery, business continuity, redundancy, data back-up, and archival/retrieval capabilities, and the results of, any reviews or tests of such programs"]}]}, {"heading": "From the Demonstration", "intro": ["MISMO runs a demonstration of the product as part of certification. These come out of it, so there is nothing to fill in here yet — it is listed so you know what to expect.", "• eClosing System Audit Trails", "• Copies of all electronically signed Electronic Records and eNotes", "• Copies of signer consents to the use of Electronic Signatures. 4 __________________________________________________________________________________________ eClosing System"], "items": []}, {"heading": "Attestations", "intro": ["I hereby attest that I am authorized by my organization to make the following attestation deral laws, including an indication that it is a reproduction of an Electronic Record that was electronically signed.", "9. Provider has a comprehensive information security program in place to ensure consumer data, privacy, and information security laws and regulations are satisfied. Such programs include, but are not limited to, sufficient and documented plans for disaster recovery, business continuity, redundancy, data back-up, archival/retrieval capabilities, and annual tests of these components."], "items": [{"number": 900, "text": "Exclusions or limitations to any of the attestations above", "type": "long_text", "response_lines": 5, "guidance": ["Leave blank if there are none."]}], "tables": [{"kind": "field_block", "fields": ["Name", "Title", "Date"]}]}]}}, {"type": "docs", "title": "Your Documents", "intro": "The documents the questionnaire asks for. Demo artifacts come after your demonstration.", "areas": [{"code": "req0", "name": "Application of a Tamper-Evident Seal to Electronic Records", "help": "Asked for in the questionnaire."}, {"code": "req1", "name": "Prevention of unauthorized access or alterations to Electronic Records", "help": "Asked for in the questionnaire."}, {"code": "req2", "name": "Steps taken if an Electronic Record is subject to unauthorized access or alterations", "help": "Asked for in the questionnaire."}, {"code": "req3", "name": "Storage and Reproduction of Electronic Records", "help": "Asked for in the questionnaire."}, {"code": "req4", "name": "Information security programs, including, but not limited to, disaster recovery, business continuity, redundancy, data back-up, and archival/retrieval capabilities, and the results of, any reviews or tests of such programs", "help": "Asked for in the questionnaire."}, {"code": "demo", "name": "Demo Artifacts", "help": "Screenshots, exports and recordings from your demonstration. Add them after the demo.", "optional": true}, {"code": "other", "name": "Anything Else", "help": "Anything your answers refer to.", "optional": true}]}, {"type": "booking", "id": "demo", "title": "Book Your Demonstration", "offset": 12, "length": "90 minutes", "from": "Your Assessor", "intro": "Pick one of the times your assessor has offered. You will show the system working against the MISMO eClosing requirements.", "confirm": "Your assessor and certifications@mismo.org are told, and a calendar invitation follows from the assessor.", "prep": ["Have a test environment ready with sample loans and documents (no real borrower data).", "Your assessor tells you beforehand what to show; plan to walk through each MISMO requirement in turn.", "Capture the screenshots and exports the script names; add them under Demo Artifacts afterwards."]}, {"type": "review", "title": "Review and Submit"}]}</script>
