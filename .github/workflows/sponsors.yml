name: Summit Sponsor Feed (Summit pages)

# Reads the Sponsorship Portal records and updates sponsors/winter-2027.json, spring-2027.json and fall-2027.json.
# The Summit home, Sponsors and Agenda pages read that file, so a sponsor approved
# in the Portal shows up on the website within a couple of minutes once the Portal sends the
# sponsor-data-changed signal (repository_dispatch). Without that signal's key (CN-022), the schedule
# below checks every 10 minutes through the working day on weekdays (Jonna, Nov 25, 2026), and the build
# writes only when something changed, so a sponsor approved in the Portal shows within about 10 minutes.
# Needs a token that can read GitMISMO/sponsorship-data: SPONSOR_DATA_TOKEN if set,
# otherwise MMS_DATA_TOKEN.
# It also writes sponsors/prospectus-app.json (which pages the MyMISMO phone prospectus shows),
# copied from the Portal's Publish on MyMISMO switches (CN-072).

on:
  schedule:
    - cron: '*/10 11-23 * * 1-5'  # weekdays, every 10 minutes about 7 AM to 7 PM ET
    - cron: '17 11 * * 0,6'      # weekends, once in the morning
  workflow_dispatch:
  repository_dispatch:
    types: [sponsor-data-changed]   # sent by the Sponsorship Portal when it saves sponsor data or a logo
  push:
    paths:
      - 'sponsors/logos/**'
      - 'sponsors/build-sponsors.mjs'

permissions:
  contents: write

concurrency:
  group: sponsor-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read the Portal and build the 2027 sponsor files
        run: node sponsors/build-sponsors.mjs
        env:
          SPONSOR_DATA_TOKEN: ${{ secrets.SPONSOR_DATA_TOKEN || secrets.MMS_DATA_TOKEN }}
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain sponsors/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add sponsors/*-2027.json sponsors/logos
            if [ -f sponsors/prospectus-app.json ]; then git add sponsors/prospectus-app.json; fi
            git commit -m "Summit sponsors: update from the Sponsorship Portal"
            git pull --rebase
            git push
          else
            echo "No change."
          fi
