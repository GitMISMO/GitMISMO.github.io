# MMS automatic checks: run on every change to the MMS (mms/, im-review/, awg-review/) and by hand.
# 1) every script parses, 2) no keys, tokens or passwords in the published files, 3) the page safety list is there,
# 4) the MMS opens in a real browser on made-up records (a stand-in sign-in and save relay) with no errors.
name: MMS Checks
on:
  push:
    paths: ['mms/**', 'im-review/**', 'awg-review/**', '.github/workflows/mms-checks.yml', '.github/mms-checks/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    # Playwright's own image has the browser and everything it needs, so no system packages are downloaded each run
    # (Nov 11: a run failed when GitHub's runner couldn't reach the Ubuntu package servers)
    container: mcr.microsoft.com/playwright:v1.48.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get Playwright (the browser is already in the container)
        run: |
          npm init -y >/dev/null
          for i in 1 2 3; do npm install --no-save playwright@1.48.2 && break; sleep 10; done
      - name: Run the checks
        run: node .github/mms-checks/check.mjs
