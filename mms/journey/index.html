<!doctype html>
<html lang="en" data-rs-gate>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work Request Journey</title>
<link rel="icon" type="image/png" sizes="48x48" href="https://resources.mismo.org/assets/favicon-48x48.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy bar with the controls; the stage (a browser window holding the real MMS, an email, or another system)
   fills the rest; the pointer and its speech bubble float over the stage; a thin chapter strip runs along the bottom. */
:root{
  --navy:#0d314c; --navy-mid:#14486e; --sky:#74bfeb; --sky-soft:#a9d8f3;
  --ground:#e9f1f8; --surface:#ffffff; --surface-2:#f6fafd; --border:#d5e2ed; --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --hit:#d95926; --bubble:#0d314c; --bubble-ink:#ffffff; --bubble-2:#a9d8f3;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ground:#061722; --surface:#0d2837; --surface-2:#123143; --border:#1f4a63; --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4; --hit:#f08a5d; color-scheme:dark } }
:root[data-theme="dark"]{ --ground:#061722; --surface:#0d2837; --surface-2:#123143; --border:#1f4a63; --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4; --hit:#f08a5d; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px)}
button,select{font-family:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
/* top bar */
.bar{background:#0d314c;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.plate{background:#fff;border-radius:5px;padding:7px 11px;display:flex;align-items:center;line-height:0}
.plate svg{height:18px;width:auto}
.bar .nm{color:#a9d8f3;font-weight:500;white-space:nowrap}
.bar .rule{width:1px;align-self:stretch;margin-block:4px;background:rgba(116,191,235,.4)}
.bar select{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:5px 8px;font-size:12.5px;max-width:280px}
.bar select option{color:#0d314c}
.bar .sp{flex:1}
.bb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:5px;padding:6px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bb:hover{background:rgba(255,255,255,.18)}
.bb.pri{background:#74bfeb;color:#06202f;border-color:#74bfeb;font-weight:600}
.bb[aria-pressed="true"]{border-color:#f08a5d;color:#f9c3a8}
.bb:disabled{opacity:.4;cursor:default}
.bb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.count{font-family:var(--mono);font-size:12px;color:#a9d8f3;white-space:nowrap}
@media (max-width:760px){ .bar .nm,.bar .rule{display:none} .bar select{max-width:170px} }
@media (max-width:560px){ .chrome .who{display:none} }
/* stage */
.stagewrap{position:relative;min-height:0;display:grid;place-items:center;padding:12px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));overflow:hidden}
.win{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 30px rgba(6,32,47,.18);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
.chrome{display:flex;align-items:center;gap:10px;background:#dfe8f0;color:#456179;padding:7px 12px;font-size:12px;border-bottom:1px solid #c9d7e3}
.chrome .dots{display:flex;gap:5px}.chrome .dots i{width:10px;height:10px;border-radius:50%;background:#c3d1dd}
.chrome .url{flex:1;min-width:0;background:#fff;border:1px solid #c9d7e3;border-radius:5px;padding:3px 10px;font-family:var(--mono);font-size:11.5px;color:#456179;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .who{white-space:nowrap;font-weight:600;color:#0d314c}
.viewport{position:relative;overflow:hidden;background:#fff}
.scaled{position:absolute;left:0;top:0;transform-origin:0 0}
.scaled iframe{border:0;display:block;background:#fff}
.shot{display:block;width:100%;height:auto}
#alt{position:absolute;inset:0;overflow:auto;background:#fff}
#alt .shot{display:block;width:100%;height:auto;border-bottom:1px solid var(--border)}
[hidden]{display:none!important}
/* pointer and bubble (outside the scaled box, so text stays crisp) */
.ptr{position:absolute;left:0;top:0;width:26px;height:26px;pointer-events:none;z-index:6;transition:transform .9s cubic-bezier(.45,.05,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ptr svg{width:26px;height:26px}
.ring{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--hit);opacity:0;pointer-events:none;z-index:5}
.ring.go{animation:ring .7s ease-out}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.hl{position:absolute;border:2px solid var(--hit);border-radius:6px;box-shadow:0 0 0 4000px rgba(6,32,47,.18);pointer-events:none;z-index:4;transition:all .6s ease;opacity:0}
.hl.on{opacity:1}
.bub{position:absolute;z-index:7;max-width:min(380px,calc(100% - 24px));background:var(--bubble);color:var(--bubble-ink);border-radius:10px;padding:11px 14px 10px;box-shadow:0 8px 24px rgba(6,32,47,.3);font-size:14px;line-height:1.45;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:auto}
.bub.on{opacity:1;transform:none}
.bub .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--bubble-2);margin-bottom:4px;font-weight:600;letter-spacing:.02em}
.bub .who i{width:18px;height:18px;border-radius:50%;background:#74bfeb;color:#06202f;display:grid;place-items:center;font:700 8.5px/1 var(--mono);font-style:normal}
.bub .tx b{color:#fff}
.bub .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--bubble-2)}
.bub .ft .sp{flex:1}
.bub .nx{background:#74bfeb;color:#06202f;border:0;border-radius:4px;padding:4px 10px;font-weight:600;font-size:12px;cursor:pointer}
.bub::after{content:"";position:absolute;width:12px;height:12px;background:var(--bubble);transform:rotate(45deg)}
.bub.tl::after{left:16px;top:-5px}.bub.tr::after{right:16px;top:-5px}.bub.bl::after{left:16px;bottom:-5px}.bub.br::after{right:16px;bottom:-5px}.bub.c::after{display:none}
.card{position:absolute;inset:0;display:grid;place-items:center;z-index:3;background:linear-gradient(180deg,#0d314c,#14486e);color:#fff;text-align:center;padding:24px}
.card h2{font-size:clamp(20px,3vw,30px);margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.card p{margin:0 auto;max-width:60ch;color:#a9d8f3;font-size:clamp(13px,1.6vw,16px)}
.card .eb{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#74bfeb;margin-bottom:12px}
/* email */
.mailapp{position:absolute;inset:0;display:grid;grid-template-columns:240px minmax(0,1fr);background:#f3f2f1;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;color:#242424}
.mailapp .list{border-right:1px solid #e1dfdd;background:#fff;overflow:hidden}
.mailapp .list h4{margin:0;padding:12px 14px;font-size:13px;border-bottom:1px solid #edebe9}
.mailapp .it{padding:10px 14px;border-bottom:1px solid #f3f2f1;font-size:12.5px}
.mailapp .it.on{background:#deecf9;border-left:3px solid #0f6cbd;padding-left:11px}
.mailapp .it b{display:block;font-size:13px}
.mailapp .it span{color:#605e5c;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mailapp .it em{float:right;font-style:normal;color:#605e5c;font-size:11px;margin-left:6px}
.mailapp .read{overflow:auto;background:#fff;margin:10px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mailapp .hdr{padding:16px 20px 10px;border-bottom:1px solid #edebe9}
.mailapp .hdr h3{margin:0 0 10px;font-size:18px;font-weight:600}
.mailapp .from{display:flex;gap:10px;align-items:center;font-size:13px}
.mailapp .av{width:34px;height:34px;border-radius:50%;background:#0d314c;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.mailapp .to{color:#605e5c;font-size:12px}
.mailapp .body{padding:16px 20px;font-size:14px}
.mailapp .body pre{white-space:pre-wrap;font-family:inherit;margin:0}
@media (max-width:760px){ .mailapp{grid-template-columns:1fr} .mailapp .list{display:none} }
/* chapter strip */
.strip{display:flex;gap:3px;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-x:auto;background:var(--surface);border-top:1px solid var(--border)}
.ch{flex:1 0 auto;min-width:88px;border:0;background:transparent;padding:4px 2px 2px;cursor:pointer;text-align:left;color:var(--ink-3);font-size:11.5px}
.ch .bar2{height:5px;border-radius:2px;background:var(--border);margin-bottom:4px;overflow:hidden}
.ch .bar2 i{display:block;height:100%;width:0;background:var(--sky);transition:width .3s}
.ch.on{color:var(--ink);font-weight:600}
.ch.on .bar2 i{background:var(--hit)}
.toastnote{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#0d314c;color:#fff;font-size:12.5px;padding:7px 12px;border-radius:5px;z-index:8;opacity:0;transition:opacity .2s;pointer-events:none}
.toastnote.on{opacity:.95}
@media (prefers-reduced-motion: reduce){ .ptr,.hl,.bub,.ch .bar2 i{transition:none} .ring.go{animation:none} }
</style>
<script src="/assets/session.js"></script>
</head>

26 -13 -563 -13 -612 0 -20 6 -44 19 -54 30 -17 19 -31 20 -222 20 l-203 0 0 -49 c0 -81 34 -172 86 -230 78 -87 31 -81 672 -81 l568 0 46 29 c79 50 122 121 139 231 21 140 -19 248 -111 299 -79 44 -134 50 -555 62 -220 5 -410 14 -422 19 -29 12 -30 43 -3 70 19 19 33 20 288 20 277 0 331 -6 355 -41 13 -18 24 -19 218 -17 l204 3 3 44 c4 60 -31 168 -70 215 -17 21 -52 52 -77 67 l-45 29 -550 0 c-440 -1 -557 -3 -581 -14z"></path></g></symbol></defs></svg>
<header class="bar">
  <span class="plate"><svg role="img" aria-label="MISMO" viewBox="0 0 708 108"><use href="#mismo-logo"/></svg></span>
  <span class="rule"></span><span class="nm">Work Request Journey</span>
  <label for="stepsel" class="count" style="position:absolute;left:-9999px">Step</label>

  <span class="count" id="count"></span>
  <span class="sp"></span>
  <button class="bb" id="prev" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
  <button class="bb" id="play" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span>Play</span></button>

<main class="stagewrap" id="stagewrap">
  <div class="win" id="win">
    <div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url" id="url">resources.mismo.org/mms/</span><span class="who" id="viewer"></span></div>
    <div class="viewport" id="vp">
      <div class="scaled" id="scaled"><iframe id="mms" title="The MMS with practice data" tabindex="-1"></iframe></div>
      <div id="alt" hidden></div>
    </div>

    <div class="bub" id="bub" role="status" aria-live="polite"><div class="who" id="bwho"></div><div class="tx" id="btx"></div><div class="ft"><span id="bct"></span><span class="sp"></span><button class="nx" id="bnext" type="button">Next</button></div></div>

<script>
/* ============================================================================
   The Work Request Journey: the practice world
   ----------------------------------------------------------------------------
   Made-up data the tour hands to the real MMS (tour mode). The story starts
   from W0 below; each step's after(w) changes it (a stage move, a file, an
   email), so the MMS shows each step exactly as it would be that day.
   Names of MISMO people are their real roles; members and companies are made up.
   ============================================================================ */
const TOUR_PEOPLE={
  jonna:{name:'Jonna Critchley',email:'jonna@tour.mismo.org'},
  meghan:{name:'Meghan Tidgewell',email:'mtidgewell@mismo.org'},
  perry:{name:'Perry Williams',email:'pwilliams@mba.org'},
  vanessa:{name:'Vanessa Rios',email:'vrios@mismo.org'},
  erin:{name:'Erin Bittenbender',email:'ebittenbender@mismo.org'},
  mark:{name:'Mark Kleingers',email:'mkleingers@mismo.org'},
  amy:{name:'Amy Moses',email:'amoses@mba.org'}};
const TOUR_CONFIG={
  people:{
    facilitators:[{name:'Erin Bittenbender',email:'ebittenbender@mismo.org'},{name:'Kathryn Williams',email:'kwilliams@mismo.org'},{name:'Kellie Stoll',email:'kstoll@mismo.org'},{name:'Leeann Walker',email:'lwalker@mismo.org'},{name:'Meghan Tidgewell',email:'mtidgewell@mismo.org'}],
    roles:{staff:[{name:'Perry Williams',email:'pwilliams@mba.org'},{name:'Jonna Critchley',email:'jonna@tour.mismo.org'},{name:'Vanessa Rios',email:'vrios@mismo.org'}],
      media:[{name:'Amy Moses',email:'amoses@mba.org'},{name:'Perry Williams',email:'pwilliams@mba.org'}],
      imawg:[{name:'Erin Bittenbender',email:'ebittenbender@mismo.org'}],imreview:[{name:'Erin Bittenbender',email:'ebittenbender@mismo.org'}],
      director:[{name:'Jonna Critchley',email:'jonna@tour.mismo.org'}],vps:[{name:'Jonna Critchley',email:'jonna@tour.mismo.org'}],gov:[],
      website:[{name:'Vanessa Rios',email:'vrios@mismo.org'}],pm:[{name:'Perry Williams',email:'pwilliams@mba.org'}],architect:[{name:'Mark Kleingers',email:'mkleingers@mismo.org'}]}},
  notify:{holdUntil:'',from:'workrequests@mismo.org',docFlowUrl:'https://flow.tour/sharepoint'}};  /* the files flow is pretend: only the recorder answers it */
const TOUR_TASKFORCE='Escrow Servicing Task Force';
function tourW0(){
  const T=(id,o)=>Object.assign({id,uid:id,wr:id,state:'active',stage:'work',sub:'',workgroup:'',groupType:'DWG',facilitator:'',workType:'Initiative',reqType:'New',size:'M',dates:{},links:{},history:[],source:'mms',createdAt:'2026-12-01T15:00:00Z'},o);
  const tickets={
    /* the release the Reference Model changes publish with */
    WR2027_01:T('WR2027_01',{name:'v3.6.5 Minor Reference Model Release',workgroup:'Information Management',facilitator:'Erin Bittenbender',stage:'work',workType:'Maintenance',rmRelease:'v3.6.5',dates:{workStart:'2027-01-04',targetIM:'2027-10-11'},history:[{at:'2027-01-04T14:00:00Z',by:'Perry Williams',text:'Work started. Target to Submit to IM Oct 11, 2027'}]}),
    /* other live work, so the lists look the way they do on a normal day */
    WR2027_02:T('WR2027_02',{name:'Loan Modification Specification',workgroup:'Servicing Task Force',facilitator:'Kellie Stoll',stage:'work',dates:{workStart:'2027-01-04',targetIM:'2027-05-14'},rmRelease:'v3.6.5'}),
    WR2027_03:T('WR2027_03',{name:'Property Inspection Dataset',workgroup:'Valuation Task Force',facilitator:'Kathryn Williams',stage:'work',dates:{workStart:'2027-01-04',targetIM:'2027-03-31'},rmRelease:'v3.6.5'}),
    WR2027_04:T('WR2027_04',{name:'eNote Vault Transfer Guide',workgroup:'eMortgage Area of Focus',facilitator:'Leeann Walker',stage:'work',dates:{workStart:'2027-01-04',targetIM:'2027-06-30'}}),
    WR2027_05:T('WR2027_05',{name:'Closing Disclosure Mapping Update',workgroup:'Closing Task Force',facilitator:'Kellie Stoll',stage:'aireview',dates:{workStart:'2026-12-07',targetIM:'2027-01-29'}})};
  return {today:'2027-01-12',mem:{tickets,config:JSON.parse(JSON.stringify(TOUR_CONFIG)),ssfiles:{},arch:{},media:{},outbox:{},'reviews-2027':{}}};
}
/* the helpers each step's after(w) uses */
const TW={
  t:(w,id)=>w.mem.tickets[id],
  add(w,t){ w.mem.tickets[t.id]=Object.assign({uid:t.id,wr:t.id,state:'active',sub:'',dates:{},links:{},history:[],source:'mms'},t); },
  hist(w,id,by,text,extra){ const t=w.mem.tickets[id]; t.history=t.history||[]; t.history.push(Object.assign({at:w.today+'T15:00:00Z',by,text},extra||{})); },
  move(w,id,to,by,text,o){ const t=w.mem.tickets[id]; const from=t.stage; t.stage=to; t.sub=(o&&o.sub)||''; t.stageSince=w.today; if(to==='published'){ t.state='published'; t.dates.published=w.today; } TW.hist(w,id,by,text,{from,to}); if(o&&o.patch) Object.assign(t,o.patch); if(o&&o.dates) Object.assign(t.dates,o.dates); },
  file(w,id,n,by,sz){ const t=w.mem.tickets[id]; const D=w.mem.ssfiles[id]=w.mem.ssfiles[id]||{wr:t.wr,files:[],links:[]}; D.files=D.files.filter(f=>f.n!==n).concat([{n,p:t.wr+'/'+n,u:w.today,b:by,sz:sz||''}]); },
  mail(w,to,subject,body,ticket,kind){ const id=w.today.slice(0,7)+'_'+Object.keys(w.mem.outbox).length; w.mem.outbox[id]={id,to,cc:[],subject,body,ticket:ticket||'',kind:kind||'stage',at:w.today+'T15:05:00Z',status:'Sent',sentAt:w.today+'T15:06:00Z'}; },
  day:(w,d)=>{ w.today=d; }
};

<script>
/* ============================================================================

   ----------------------------------------------------------------------------
   Runs the real MMS (tour mode, practice data) in the stage, moves a pointer to

   ============================================================================ */
(function(){
const $=id=>document.getElementById(id);
const VW=1280, VH=760;                      /* the size the MMS is shown at, scaled to fit */
const STEPS=TOUR_STEPS, CH=TOUR_CHAPTERS;
const CAST={meghan:['MT','Meghan · Facilitator'],perry:['PW','Perry · Program Manager'],jonna:['JC','Jonna · License Designator'],vanessa:['VR','Vanessa · Website Admin'],erin:['EB','Erin · IM'],mark:['MK','Mark · Architect'],amy:['AM','Amy · Quotes'],staff:['ST','MISMO Staff'],im:['IM','IM Reviewers'],awg:['AW','AWG Reviewers'],gc:['GC','Governance Committee'],tf:['TF','Task Force'],exec:['EX','Executive Team'],mms:['⚙','The MMS, on its own'],media:['MM','MISMO Media']};
let si=0, bi=0, k=1, playing=false, talk=false, busy=false, token=0, curSys='mms', mmsWin=null, booting=null;
const frame=$('mms');
/* ---------- what the MMS holds: day one plus every recorded change (states.json, from record.js) ---------- */
const ST=TOUR_STATES, memCache=[];
function memAt(k){ k=Math.max(0,Math.min(k,ST.length-1)); if(memCache[k]) return memCache[k];
  const m=k?JSON.parse(JSON.stringify(memAt(k-1))):{}; Object.entries(ST[k].d).forEach(([c,docs])=>{ m[c]=m[c]||{}; Object.entries(docs).forEach(([id,d])=>{ if(d===null) delete m[c][id]; else m[c][id]=d; }); });
  return memCache[k]=m; }
/* before step i: what the MMS held that morning; mid m: part way through (the recorder's R.snap()); after: once the step's people have done their part */
function stateIx(i,phase){ let k=0; ST.forEach((e,x)=>{ if(e.s<i) k=x; else if(e.s===i&&(phase==='after'||(typeof phase==='number'&&e.m&&e.m<=phase))) k=x; }); return k; }
function worldAt(i,phase){ phase=phase===true?'after':phase; const k=stateIx(i,phase); return {today:(phase&&ST[k].s===i&&ST[k].today)||STEPS[i].date,mem:memAt(k)}; }

/* ---------- the real MMS in the stage ---------- */
function bootMms(){ return new Promise(res=>{ const w0=worldAt(0); clockAt(w0.today); window.__tourSeed={mem:w0.mem,me:TOUR_PEOPLE[STEPS[0].as||'jonna']};
  frame.style.width=VW+'px'; frame.style.height=VH+'px';
  frame.onload=()=>{ const t0=Date.now(); const wait=()=>{ try{ const T=frame.contentWindow.__mmsTour; if(T&&T.ready()){ mmsWin=frame.contentWindow; res(true); return; } }catch(e){} if(Date.now()-t0>20000){ note('The MMS didn’t open in the tour. Reload the page.'); res(false); return; } setTimeout(wait,120); }; wait(); };
  frame.src='/mms/?tour=1'; }); }
const T=()=>mmsWin&&mmsWin.__mmsTour, D=()=>frame.contentDocument;
/* ---------- fit the stage ---------- */
function fit(){ const wrap=$('stagewrap'), chrome=document.querySelector('.chrome'); const aw=wrap.clientWidth-24, ah=wrap.clientHeight-22-chrome.offsetHeight;
  k=Math.max(.2,Math.min(aw/VW,ah/VH,1.25)); $('win').style.width=Math.round(VW*k)+'px'; $('vp').style.height=Math.round(VH*k)+'px'; $('scaled').style.transform='scale('+k+')'; }
window.addEventListener('resize',()=>{ fit(); place(); });
/* ---------- finding what to point at (by its words, so it survives restyling) ---------- */
function vis(e){ const r=e.getBoundingClientRect(); const cs=(e.ownerDocument.defaultView).getComputedStyle(e); return r.width>0&&r.height>0&&cs.visibility!=='hidden'&&cs.display!=='none'; }
function find(sel,doc){ doc=doc||docNow(sel); if(!sel||!doc) return null; if(sel.nodeType) return sel; sel=sel.replace(/^body:/,'');
  let scope=doc, m;
  if((m=/^(.*?)\s+in\s+(.+)$/.exec(sel))&&!/^css:/.test(sel)){ scope=find(m[2],doc)||doc; sel=m[1]; }
  if(/^css:/.test(sel)) return [...scope.querySelectorAll(sel.slice(4))].find(vis)||null;
  const want=sel.replace(/^text:/,'').trim().toLowerCase(); const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
  const pool=[...scope.querySelectorAll('button,a,[role=tab],label,th,h1,h2,h3,h4,h5,summary,.chip,.stg,.tag,input,select,textarea,td,dt,dd,li,span,p,div,b')].filter(vis);
  return pool.find(e=>norm(e.textContent)===want&&/^(BUTTON|A|LABEL|SUMMARY|TH|H\d)$/.test(e.tagName))||pool.find(e=>norm(e.textContent)===want)||pool.filter(e=>norm(e.textContent).includes(want)).sort((a,b)=>a.textContent.length-b.textContent.length)[0]||null; }
/* where to look: the MMS, or the email or picture on the stage ("body:" looks inside the email's own page) */
function docNow(sel){ if(curSys==='mms') return D(); if(/^body:/.test(sel||'')){ const f=$('alt').querySelector('iframe'); return f?f.contentDocument:null; } return $('alt'); }
/* the element's box in the stage window's coordinates */
function boxOf(el){ const r=el.getBoundingClientRect(), vp=$('vp').getBoundingClientRect(), win=$('win').getBoundingClientRect();
  if(el.ownerDocument===document) return {x:r.left-win.left,y:r.top-win.top,w:r.width,h:r.height};
  const fr=(curSys==='mms'?frame:$('alt').querySelector('iframe')); const fb=fr.getBoundingClientRect(); const s=curSys==='mms'?k:1;
  return {x:fb.left-win.left+r.left*s,y:fb.top-win.top+r.top*s,w:r.width*s,h:r.height*s}; }
/* ---------- pointer, highlight, bubble ---------- */
let last=null;
function place(){ if(!last) return; showAt(last.box,last.beat,true); }
function showAt(box,beat,again){ const win=$('win'), W=win.clientWidth, H=win.clientHeight;
  const hl=$('hl'), ptr=$('ptr'), bub=$('bub');
  if(box){ const px=box.x+Math.min(box.w*.55,box.w-6), py=box.y+box.h*.6; ptr.style.transform='translate('+px+'px,'+py+'px)'; ptr.style.opacity=1;
    if(beat.hl!==false){ hl.style.left=(box.x-5)+'px'; hl.style.top=(box.y-4)+'px'; hl.style.width=(box.w+10)+'px'; hl.style.height=(box.h+8)+'px'; hl.classList.add('on'); } else hl.classList.remove('on');
    /* the bubble: below and right of the pointer, flipped to stay in the window */
    const bw=Math.min(380,W-24); bub.style.maxWidth=bw+'px'; bub.style.left='0px'; bub.style.top='0px'; const bh=bub.offsetHeight, bwid=bub.offsetWidth;
    let x=px+14, y=py+24, cls='tl'; if(x+bwid>W-12){ x=px-bwid+14; cls='tr'; } if(x<12) x=12; if(y+bh>H-12){ y=py-bh-30; cls=cls==='tl'?'bl':'br'; } if(y<44) y=44;
    bub.style.left=x+'px'; bub.style.top=y+'px'; bub.className='bub on '+cls;
  } else { hl.classList.remove('on'); ptr.style.opacity=beat&&beat.keepPtr?1:0; const bw=Math.min(460,W-24); bub.style.maxWidth=bw+'px'; bub.style.left=((W-Math.min(bub.offsetWidth,bw))/2)+'px'; bub.style.top=Math.max(54,H-bub.offsetHeight-22)+'px'; bub.className='bub on c'; }
  last={box,beat}; }
function bubble(beat){ const p=CAST[beat.who||STEPS[si].who||'mms']||CAST.mms;
  $('bwho').innerHTML='<i>'+p[0]+'</i>'+p[1]; $('btx').innerHTML=beat.say||''; const n=STEPS[si].beats.length; $('bct').textContent=(bi+1)+' of '+n;
  $('bnext').textContent=(bi===n-1&&si===STEPS.length-1)?'Done':'Next'; }
function clickFx(box){ const r=$('ring'); r.style.left=(box.x+Math.min(box.w*.55,box.w-6))+'px'; r.style.top=(box.y+box.h*.6)+'px'; r.classList.remove('go'); void r.offsetWidth; r.classList.add('go'); }
function note(t){ const n=$('tn'); n.textContent=t; n.classList.add('on'); clearTimeout(note._t); note._t=setTimeout(()=>n.classList.remove('on'),3200); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------- the systems the stage can show ---------- */
function setUrl(u,who){ $('url').textContent=u; $('viewer').textContent=who?'Signed in as '+who:''; }
function showMms(){ curSys='mms'; $('scaled').hidden=false; $('alt').hidden=true; $('alt').innerHTML=''; }
function showAlt(html,url,who){ curSys='alt'; $('scaled').hidden=true; const a=$('alt'); a.hidden=false; a.innerHTML=html; a.scrollTop=0; setUrl(url,who); }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* names for the addresses in the practice people list */
function nameOf(e){ e=String(e||'').toLowerCase(); const P=TOUR_CONFIG.people; const all=[...P.facilitators,...Object.values(P.roles).flat()]; const p=all.find(x=>String(x.email).toLowerCase()===e); return p?p.name+' <'+e+'>':e; }
/* an email the MMS sent in this step, from the recorded outbox, in the reader's inbox */
function mailOf(m,mem){ const box=Object.values(mem.outbox||{}); const want=m.find instanceof RegExp?m.find:new RegExp(String(m.find).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const reader=TOUR_PEOPLE[m.to]||null, mine=x=>!reader||(x.to||[]).concat(x.cc||[]).map(e=>String(e).toLowerCase()).includes(reader.email.toLowerCase());
  const L=box.filter(mine).sort((a,b)=>String(b.at).localeCompare(String(a.at))); const pick=L.find(x=>want.test(x.subject))||box.find(x=>want.test(x.subject));
  if(!pick){ console.warn('Tour: no email',m.find); return null; } return {doc:pick,list:L.slice(0,7),reader}; }
function mailView(M){ if(!M) return; const d=M.doc;
  const items=(M.list.includes(d)?M.list:[d].concat(M.list.slice(0,6))).map(x=>'<div class="it'+(x===d?' on':'')+'"><b>MISMO Work Requests</b><span>'+esc(x.subject)+'</span><em>'+esc(String(x.at||'').slice(5,10).replace('-','/'))+'</em></div>').join('');
  const html='<div class="mailapp"><div class="list"><h4>Inbox</h4>'+items+'</div><div class="read"><div class="hdr"><h3 id="mail-subject">'+esc(d.subject)+'</h3><div class="from"><span class="av">WR</span><div><b id="mail-from">MISMO Work Requests &lt;workrequests@mismo.org&gt;</b><div class="to" id="mail-to">To: '+esc((d.to||[]).map(nameOf).join('; '))+((d.cc||[]).length?'<br>Cc: '+esc(d.cc.map(nameOf).join('; ')):'')+'</div></div></div></div>'+
    (d.html?'<iframe class="mailbody" title="The email" style="width:100%;border:0;height:560px;display:block"></iframe>':'<div class="body"><pre>'+esc(d.body||'')+'</pre></div>')+'</div></div>';
  showAlt(html,'outlook.office.com/mail',M.reader?M.reader.name:'');
  if(d.html){ const f=$('alt').querySelector('.mailbody'); f.srcdoc=d.html; f.onload=()=>{ try{ f.style.height=Math.min(1400,f.contentDocument.documentElement.scrollHeight+12)+'px'; }catch(e){} }; } }
function cardView(c){ showAlt('<div class="card"><div><div class="eb">'+esc(c.eyebrow||'')+'</div><h2>'+esc(c.title||'')+'</h2><p>'+(c.text||'')+'</p></div></div>','resources.mismo.org/mms/journey/',''); }

/* ---------- a step, and its beats ---------- */
/* what a beat puts on the screen: an email, another system, a title card, or the MMS (the default),
   loaded with the day's data (or, from the beat marked after:true on, the data once the step is done) */
async function setScreen(b,quickly){ const st=STEPS[si]; let after=false; STEPS[si].beats.slice(0,bi+1).forEach(x=>{ if(x.after) after='after'; else if(x.mid) after=x.mid; else if(x.before) after=false; });
  const w=worldAt(si,after), me=TOUR_PEOPLE[b.as||st.as||'jonna'];
  if(b.card){ cardView(b.card); return; }
  if(b.mail){ mailView(mailOf(b.mail,worldAt(si,'after').mem)); return; }
  if(b.shot){ shotView(b.shot); return; }

  else { if(b.close) T().close(); if(b.view) T().go(b.view); if(b.open) T().open(b.open,b.tab||'over'); else if(b.tab) T().tab(b.tab); }

  if(b.act){ T().act(b.act[0],b.act[1]); await sleep(quickly?120:300); }

  if(b.scroll){ const el=find(b.scroll); if(el) el.scrollIntoView({block:'center'}); await sleep(120); } }
let loaded='';
async function enter(i){ ++token; si=i; bi=0; hush(); $('bub').className='bub'; $('hl').classList.remove('on'); loaded=''; paintNav(); await beat(0); }
async function beat(j,quickly){ const my=token; const st=STEPS[si], b=st.beats[j]; bi=j; if(!b) return;

      if(img.naturalWidth){ const s=img.clientWidth/img.naturalWidth, r=img.getBoundingClientRect(), wr=$('win').getBoundingClientRect(); box={x:r.left-wr.left+b.spot[0]*s,y:r.top-wr.top+b.spot[1]*s,w:b.spot[2]*s,h:b.spot[3]*s}; }

const strip=s=>String(s||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
/* clicks while a screen is still loading wait their turn (two quick Backs go back two beats) */
let queue=[]; const drain=()=>{ const f=queue.shift(); if(f) setTimeout(f,0); };
async function next(){ if(busy){ if(queue.length<6) queue.push(next); return; } busy=true; try{ const st=STEPS[si]; if(bi<st.beats.length-1){ token++; await beat(bi+1); } else if(si<STEPS.length-1) await enter(si+1); else stopPlay(); } finally{ busy=false; paintNav(); drain(); } }
/* back: rebuild the screen up to the beat before (each beat's screen depends on the ones before it) */
async function prev(){ if(busy){ if(queue.length<6) queue.push(prev); return; } busy=true; try{ let i=si, j=bi-1; if(j<0){ if(si===0) return; i=si-1; j=STEPS[i].beats.length-1; }
    ++token; si=i; hush(); loaded=''; for(let x=0;x<j;x++){ bi=x; await setScreen(STEPS[si].beats[x],true); } await beat(j); } finally{ busy=false; paintNav(); drain(); } }
/* ---------- controls ---------- */
function paintNav(){ $('count').textContent='Step '+(si+1)+' of '+STEPS.length; $('stepsel').value=String(si); $('prev').disabled=si===0&&bi===0;
  const ci=CH.findIndex(c=>c[0]===STEPS[si].ch); document.querySelectorAll('.ch').forEach((c,i)=>{ c.classList.toggle('on',i===ci); const inCh=STEPS.map((s,x)=>[s,x]).filter(([s])=>s.ch===CH[i][0]); const done=inCh.filter(([,x])=>x<si||(x===si)).length; c.querySelector('i').style.width=(inCh.length?Math.round(done/inCh.length*100):0)+'%'; });
  try{ history.replaceState(null,'','#step-'+(si+1)); }catch(e){} }
function stopPlay(){ playing=false; $('play').setAttribute('aria-pressed','false'); $('play').querySelector('span').textContent='Play'; }
$('next').onclick=()=>{ stopPlay(); next(); }; $('bnext').onclick=()=>{ next(); }; $('prev').onclick=()=>{ stopPlay(); prev(); };
$('play').onclick=()=>{ if(playing){ stopPlay(); hush(); return; } playing=true; $('play').setAttribute('aria-pressed','true'); $('play').querySelector('span').textContent='Pause'; token++; beat(bi); };
$('stepsel').onchange=e=>{ stopPlay(); queue=[]; enter(+e.target.value); };
document.addEventListener('keydown',e=>{ if(e.target.closest('select,input,textarea')) return; if(e.key==='ArrowRight'){ stopPlay(); next(); } if(e.key==='ArrowLeft'){ stopPlay(); prev(); } if(e.key===' '&&!e.target.closest('button')){ e.preventDefault(); $('play').click(); } });
/* ---------- the narrator: a British English voice from the browser ---------- */
const SY=window.speechSynthesis||null; let voices=[], voice=null, sayId=0;
const PREF=[/Sonia.*Natural|Libby.*Natural|Maisie.*Natural|Bella.*Natural|Hollie.*Natural|Olivia.*Natural|Abbi.*Natural/i,/Serena.*(Premium|Enhanced)|Kate.*(Premium|Enhanced)|Stephanie.*(Premium|Enhanced)|Martha.*(Premium|Enhanced)/i,/Google UK English Female/i,/Serena|Kate|Stephanie|Martha|Hazel|Susan|Libby|Sonia|Maisie/i];
function pickVoice(){ voices=(SY?SY.getVoices():[]).filter(v=>/^en[-_]GB/i.test(v.lang)); let saved=''; try{ saved=localStorage.getItem('mismo.journey.voice')||''; }catch(e){}
  voice=voices.find(v=>v.name===saved)||null; if(!voice) for(const re of PREF){ voice=voices.find(v=>re.test(v.name)); if(voice) break; } if(!voice) voice=voices[0]||null;
  $('voice').innerHTML=voices.map(v=>'<option'+(voice&&v.name===voice.name?' selected':'')+'>'+esc(v.name)+'</option>').join(''); $('voice').hidden=!(talk&&voices.length>1); }
if(SY){ pickVoice(); SY.onvoiceschanged=pickVoice; }
$('voice').onchange=e=>{ voice=voices.find(v=>v.name===e.target.value)||voice; try{ localStorage.setItem('mismo.journey.voice',voice.name); }catch(x){} };
function speak(text,after){ if(!SY) return after&&after(); SY.cancel(); const id=++sayId; const parts=String(text).replace(/\bMISMO\b/g,'Mismo').replace(/\bMMS\b/g,'M M S').replace(/\bAWG\b/g,'A W G').replace(/\bIM\b/g,'I M').match(/[^.!?:]+[.!?:]+|[^.!?:]+$/g)||[]; let i=0;
  const go=()=>{ if(id!==sayId) return; if(i>=parts.length){ after&&after(); return; } const u=new SpeechSynthesisUtterance(parts[i++].trim()); if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang='en-GB'; u.rate=.97; u.onend=go; u.onerror=e=>{ if(e.error!=='interrupted'&&e.error!=='canceled') go(); }; SY.speak(u); };
  go(); }
function hush(){ sayId++; if(SY) SY.cancel(); }
$('listen').onclick=()=>{ if(!SY){ note('This browser has no voice.'); return; } talk=!talk; $('listen').setAttribute('aria-pressed',String(talk)); $('listen').querySelector('span').textContent=talk?'Listening':'Listen'; pickVoice();
  if(talk){ const b=STEPS[si].beats[bi]; speak(strip(b&&b.say),()=>{ if(playing) next(); }); } else hush(); };
/* ---------- start ---------- */
$('stepsel').innerHTML=STEPS.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(s.title)+'</option>').join('');
$('strip').innerHTML=CH.map(([kk,n],i)=>'<button class="ch" type="button" data-ch="'+kk+'"><div class="bar2"><i></i></div>'+(i+1)+'. '+esc(n)+'</button>').join('');
$('strip').addEventListener('click',e=>{ const b=e.target.closest('[data-ch]'); if(!b) return; stopPlay(); const i=STEPS.findIndex(s=>s.ch===b.dataset.ch); if(i>=0) enter(i); });
window.__tourPlayer={enter,next,find,steps:STEPS,world:worldAt,state:()=>({si,bi})};
/* the page opens behind the resources.mismo.org sign-in: once it's showing, measure again and point again */
try{ new MutationObserver(()=>{ if(!document.documentElement.hasAttribute('data-rs-gate')&&mmsWin){ fit(); if(!busy){ token++; beat(bi,true); } } }).observe(document.documentElement,{attributes:true,attributeFilter:['data-rs-gate']}); }catch(e){}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ fit(); place(); } });
(async()=>{ fit(); if(window.innerWidth<700) note('The journey reads best on a computer or a tablet.'); booting=bootMms(); const ok=await booting; if(!ok) return; fit(); const m=/^#step-(\d+)$/.exec(location.hash||''); await enter(m&&STEPS[+m[1]-1]?+m[1]-1:0); })();
})();

</script>
<script>try{ if(window.ResourcesSession&&ResourcesSession.requireAccess) ResourcesSession.requireAccess('mms',{toolName:'the Work Request Journey'}); else document.documentElement.removeAttribute('data-rs-gate'); }catch(e){ document.documentElement.removeAttribute('data-rs-gate'); }</script>
</body>
