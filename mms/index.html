<!doctype html>
<html lang="en" data-rs-gate>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMS · MISMO Manufacturing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root{
  --navy:#0d314c;--sky:#74bfeb;--navy-deep:#06202f;--navy-mid:#14486e;--sky-soft:#a9d8f3;--sky-wash:#e4f2fb;
  --ground:#f1f6fa;--surface:#ffffff;--surface-2:#f6fafd;--surface-3:#e9f1f8;--sunk:#f6fafd;
  --border:#d5e2ed;--border-strong:#adc4d6;--rule:#e5eef5;--line:#e5eef5;
  --ink:#0d314c;--ink-2:#456179;--ink-3:#7794aa;
  --good:#0f7b5c;--bad:#b3372c;--warn:#a2701a;
  --good-bg:#e3f4ed;--bad-bg:#fbe9e7;--warn-bg:#fbf1dc;--info-bg:#e4f2fb;--hold-bg:#efe9f7;--hold:#6b4fa0;
  --accent:#2477b8;--accent-soft:#e4f2fb;
  --c1:#2477b8;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;
  --display:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ui:var(--display);--mono:var(--display);
  --hq-h:64px;--rail-w:240px;--rail-mini:62px;
  --shadow:0 1px 2px rgba(13,49,76,.06),0 4px 14px rgba(13,49,76,.06);
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#0a2130;
  --border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;
  --ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;
  --good:#4fc79b;--bad:#f08579;--warn:#e0a83c;
  --good-bg:#0f3a30;--bad-bg:#432423;--warn-bg:#3d3017;--info-bg:#123a55;--hold-bg:#2c2545;--hold:#b9a3e8;
  --accent:#3987e5;--accent-soft:#173c52;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#0a2130;
  --border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;
  --ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;
  --good:#4fc79b;--bad:#f08579;--warn:#e0a83c;
  --good-bg:#0f3a30;--bad-bg:#432423;--warn-bg:#3d3017;--info-bg:#123a55;--hold-bg:#2c2545;--hold:#b9a3e8;
  --accent:#3987e5;--accent-soft:#173c52;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{letter-spacing:-.012em;margin:0;color:var(--ink)}
a{color:var(--accent)}
button{font-family:inherit}
[hidden]{display:none!important}

/* ── masthead + rail (Summit HQ pattern) ── */
.hqtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:97;height:var(--hq-h);
  background:var(--navy);color:#fff;display:flex;align-items:center;gap:0;
  padding:0 22px;box-shadow:0 1px 0 rgba(80,164,219,.28);
  margin-left:calc(0px - var(--rail-w));width:calc(100% + var(--rail-w));
  transition:margin-left .2s cubic-bezier(.4,0,.2,1), width .2s cubic-bezier(.4,0,.2,1)}
body.railmini .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
.hqtop .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;margin-inline:20px;border-radius:1px;background:var(--sky)}
.hqtop .hqname .short{display:none}
@media(max-width:700px){.hqtop .hqname .short{display:inline}}
.hqtop .hqname{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.005em;color:var(--sky);white-space:nowrap}
.hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px}
.hqtop .eyebrow-m{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
@media(max-width:700px){.hqtop .hqname .long{display:none}.hqtop .eyebrow-m{display:none}.figs{grid-template-columns:1fr 1fr}.fig .v{font-size:24px}.hqtop .mastrule{margin-inline:12px}.hqtop{padding:0 12px}}
@media(max-width:900px){.hqtop .eyebrow-m{display:none}}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;align-items:center;line-height:0;flex:0 0 auto;position:relative}
.logoplate .wordmark{height:24px;width:auto;display:block}
.santa{position:absolute;display:none;pointer-events:none;left:-9px;top:-12px;width:31px;height:31px}
html[data-season="december"] .santa{display:block}
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}
.whochip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#101b33;border:1px solid #e1e4ec;border-radius:4px;height:40px;padding:0 12px 0 7px;font-size:13px;font-weight:600;white-space:nowrap}
.whochip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(160deg,#a8d4ef 0%,#94c8e9 45%,#6fb2dc 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.02em}
.whochip .fn{color:#2c74a6}
.whochip .cv{color:#4b5670;font-size:10px}

.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;
  background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden auto;overscroll-behavior:contain;
  box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14);transition:width .2s cubic-bezier(.4,0,.2,1)}
body{padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.hq.rail,body,.hqtop{transition:none}}
body.railmini{padding-left:var(--rail-mini)}
body.railmini .hq.rail{width:var(--rail-mini)}
body.railmini .rail-top{justify-content:center;padding:10px 0 9px}
body.railmini .rail-lbl{display:none}
body.railmini .railhide{margin:0}
body.railmini .railhide svg{transform:scaleX(-1)}
body.railmini .railfind{padding:9px 0 2px;display:flex;justify-content:center}
body.railmini .railfind .fi,body.railmini .railfind input,body.railmini .railq-x,body.railmini .railhits{display:none}
body.railmini .railfind-b{display:flex}
body.railmini .hq nav{padding:6px 0 4px;align-items:center;gap:4px}
body.railmini .hq nav button{width:42px;padding:10px 0;justify-content:center;border-radius:9px;box-shadow:none}
body.railmini .hq nav button span,body.railmini .hq nav .navgrp,body.railmini .hq nav button b{display:none}
body.railmini .hq nav button svg{width:19px;height:19px}
body.railmini .hq nav button[aria-current]{background:var(--sky);color:var(--navy-deep)}
body.railmini .hq nav button[aria-current] svg{stroke:var(--navy-deep);opacity:1}
body.railmini .railsum{display:none}
body.railmini .hq .mast-right{gap:3px;padding:8px 0 11px;align-items:center}
body.railmini .hq .mast-right .theme-btn{width:42px;padding:9px 0;font-size:0;justify-content:center;border-radius:9px}
body.railmini .hq .mast-right .theme-btn span{display:none}
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);align-items:center;justify-content:center;padding:0}
.railfind-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;border-bottom:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.rail-lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}
.railfind .fi{position:absolute;left:21px;top:20px;width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 26px 6px 30px}
.railfind input::placeholder{color:rgba(255,255,255,.5)}
.railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
.railfind input::-webkit-search-cancel-button{display:none}
.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0;cursor:pointer}
.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;max-height:min(52vh,420px)}
.railhits .rh-g{font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);cursor:pointer}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.railhits .rh i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}
.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav .navgrp{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.45);padding:12px 10px 4px}
.hq nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav button b{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);border-radius:4px;padding:1px 6px;min-width:22px;text-align:center}
.hq nav button b.warn{background:var(--sky);color:var(--navy-deep)}
.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid);box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.railsum{padding:6px 12px 10px;flex:0 0 auto;border-top:1px solid rgba(80,164,219,.16);margin-top:4px;padding-top:11px}
.railsum label{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.52);font-weight:700;margin-bottom:4px}
.hq .hq-pick{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);color:#fff;border-radius:5px;padding:6px 9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;width:100%}
.hq .hq-pick option{background:var(--surface);color:var(--ink);font-weight:500}
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .ti-moon{display:none}:root:not([data-theme="light"]) .theme-btn .ti-sun{display:block}}
.theme-btn:hover{color:#fff;background:rgba(255,255,255,.09)}
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block}
}

/* ── page ── */
main{padding:26px 30px 80px;max-width:none}
@media(max-width:700px){main{padding:18px 16px 80px}}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:24px;font-weight:700}
.pagehead .sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.banner{background:var(--warn-bg);color:var(--ink);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:var(--r);padding:9px 14px;margin-bottom:16px;font-size:13px}
.banner.info{background:var(--info-bg);border-left-color:var(--accent)}

/* hero */
.hero{background:linear-gradient(135deg,#0d314c 0%,#14486e 100%);color:#fff;border-radius:10px;padding:22px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(116,191,235,.28),rgba(116,191,235,0) 70%)}
.hero .date{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:700}
.hero h2{color:#fff;font-size:27px;font-weight:700;margin:6px 0 6px}
.hero p{margin:0;color:rgba(255,255,255,.85);font-size:14.5px;position:relative;z-index:1}
.hero p b{color:var(--sky)}

/* figure boxes */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.fig{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 15px;text-align:left;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);position:relative;transition:transform .12s, border-color .12s}
.fig:hover{transform:translateY(-1px);border-color:var(--border-strong)}
.fig .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);white-space:nowrap}
.fig .v{font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.fig .s{font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig.alert .v{color:var(--bad)}
.fig.warnf .v{color:var(--warn)}
.fig:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--fc,var(--accent))}

/* cards & sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:22px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.card h3 .sp{margin-left:auto}
.cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
@media(max-width:1100px){.cols2{grid-template-columns:1fr}}

/* pipeline (stage strip) */
.pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.pipe .st{min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 10px 9px;cursor:pointer;text-align:left;color:var(--ink);position:relative}
.pipe .st:hover{border-color:var(--border-strong);background:var(--accent-soft)}
.pipe .st .n{font-size:24px;font-weight:700;line-height:1}
.pipe .st .l{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-top:5px;line-height:1.25}
.pipe .st .o{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.pipe .st .bar{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 6px 6px;background:var(--sc,var(--accent))}
.pipe .st.zero{opacity:.55}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:max-content;line-height:1.3}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.btn.pri:hover{filter:brightness(1.12)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* chips (rectangles, never pills) */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:3px;padding:2px 7px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;line-height:1.4}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--accent)}
.chip.hold{background:var(--hold-bg);color:var(--hold)}
.chip .dot{width:7px;height:7px;border-radius:2px;background:currentColor}
.size{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;border-radius:3px;font-size:10.5px;font-weight:700;background:var(--navy);color:#fff;padding:0 5px}
:root[data-theme="dark"] .size{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .size{background:var(--sky);color:var(--navy-deep)}}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select{max-width:240px}
.filters select,.filters input{font:inherit;font-size:13px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:6px 9px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--ink-2);padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

.facrow{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;padding:6px 0;border:0;background:none;width:100%;cursor:pointer;color:var(--ink);text-align:left;font:inherit}
.facrow .fn{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facrow .fb{display:flex;gap:2px;height:14px}
.facrow .fb i{border-radius:2px}
.facrow b{text-align:right}
.tbar{display:block;height:8px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent)}
.psec.rec{border-color:var(--good);border-left:4px solid var(--good)}
/* current leadership */
.lead-sub{font-size:12.5px;color:var(--ink-2);margin:-4px 0 12px}
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lead{display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--border-strong);border-radius:6px;padding:10px 12px}
.lead.chair{border-left-color:var(--navy)}
.lead.vice{border-left-color:var(--sky)}
:root[data-theme="dark"] .lead.chair{border-left-color:#fff}
.lav{grid-row:1/3;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(160deg,#a8d4ef 0%,#94c8e9 45%,#6fb2dc 100%)}
.lead.chair .lav{background:linear-gradient(160deg,#14486e,#0d314c)}
.lt{min-width:0;display:flex;flex-direction:column}
.lt b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpos{justify-self:start;font-size:11px;font-weight:700;border-radius:3px;padding:2px 7px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.lead.chair .lpos{background:var(--navy);color:#fff}
.lead.vice .lpos{background:var(--sky-wash);color:var(--navy)}
:root[data-theme="dark"] .lead.chair .lpos{background:var(--sky);color:var(--navy-deep)}
:root[data-theme="dark"] .lead.vice .lpos{background:var(--surface-3);color:var(--sky)}
.lterm{grid-column:2;font-size:11px;color:var(--ink-3);margin-top:-2px}
.lead .lpos+.lterm{grid-column:2}
.lead-empty{font-size:13px;color:var(--ink-3);padding:10px 12px;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:6px}
.lead-foot{font-size:11.5px;color:var(--ink-3);margin-top:10px}
/* split into deliverables */
.split-box{width:min(820px,100%)}
.split-box header .eyebrow{margin-bottom:2px}
.dv{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2);border-left:4px solid var(--accent)}
.dv.held{border-left-color:var(--c4);background:color-mix(in srgb,var(--c4) 7%,var(--surface-2))}
.dv-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dv-id{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-3);white-space:nowrap}
.dv-name{flex:1;min-width:0;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 10px}
.dv-name:focus{outline:2px solid var(--sky);outline-offset:-1px}
.dv-x{border:0;background:none;color:var(--ink-3);font-size:20px;width:28px;height:28px;border-radius:4px;cursor:pointer}
.dv-x:hover{background:var(--surface-3);color:var(--bad)}
.dv-kinds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dv-k{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:5px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.dv-k svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dv-k:hover{border-color:var(--accent);color:var(--ink)}
.dv-k.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .dv-k.on{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
.dv-hold{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.dv-hold.locked{cursor:default}
.sw{position:relative;width:34px;height:20px;flex:0 0 34px}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:10px;background:var(--border-strong);transition:background .15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on i{background:var(--c4)}
.sw.on i:after{transform:translateX(14px)}
.dv-add{width:100%;border:1px dashed var(--border-strong);background:none;color:var(--accent);font:inherit;font-weight:600;font-size:13px;border-radius:8px;padding:10px;cursor:pointer;margin-bottom:12px}
.dv-add:hover{background:var(--accent-soft)}
.dv-rm{border:1px solid var(--c4);border-radius:8px;padding:12px 14px;background:color-mix(in srgb,var(--c4) 8%,var(--surface))}
.dv-rm-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13.5px}
.dv-rm-h svg{width:18px;height:18px;fill:none;stroke:var(--c4);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dv-rms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.dv-r{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:9px 11px;cursor:pointer;color:var(--ink);font:inherit}
.dv-r span{font-size:12.5px;color:var(--ink-2)}
.dv-r.on{border-color:var(--c4);box-shadow:0 0 0 2px var(--c4)}
.dv-sum{margin-right:auto;align-self:center;font-size:12.5px;color:var(--ink-3)}
/* requests + architecture help */
.askb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:18px}
.askb>div{flex:1;min-width:240px}
.archb{background:var(--info-bg);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin:-6px 0 18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.arboard{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:12px;overflow-x:auto;align-items:start}
@media(max-width:1100px){.arboard{grid-template-columns:repeat(4,280px)}}
.arcol{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column}
.arcol header{padding:10px 12px 8px;border-bottom:1px solid var(--border);position:relative}
.arcol header:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:8px 8px 0 0;background:var(--ac,var(--accent))}
.arcol.c-pm{--ac:var(--c4)} .arcol.c-q{--ac:var(--c1)} .arcol.c-ip{--ac:var(--c3)} .arcol.c-done{--ac:var(--good)}
.arcol header h4{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.arcol header h4 b{margin-left:auto;font-size:11px;background:var(--surface-3);border-radius:3px;padding:1px 6px;color:var(--ink-2)}
.arcol header .o{font-size:11px;color:var(--ink-3)}
.arcol .cards,.arcgrid{padding:8px;display:flex;flex-direction:column;gap:8px}
.arcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding:0}
.arc{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;box-shadow:0 1px 1px rgba(13,49,76,.04)}
.arc-top{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.arc-due{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-2)}
.arc-due.late{color:var(--bad)}
.arc-t{font-size:14px;font-weight:700;margin:6px 0 2px}
.arc-w{font-size:12px;color:var(--accent);cursor:pointer;margin-bottom:6px}
.arc-d{font-size:12.5px;color:var(--ink-2);white-space:pre-line;max-height:7.5em;overflow:hidden}
.arc-meta{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.arc-res{font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--rule)}
.arc-acts{display:flex;gap:6px;margin-top:8px}
/* comment period timeline */
.cp h3{flex-wrap:wrap}
.cp-key{display:flex;gap:14px;font-size:12px;font-weight:500;color:var(--ink-2)}
.cp-key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cp-key i{display:inline-block;width:16px;height:8px;border-radius:2px}
.cp-key i.open{background:var(--c6)} .cp-key i.closed{background:var(--border-strong)} .cp-key i.now{width:2px;height:12px;background:var(--bad)}
.cp-axis,.cp-row{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:center}
.cp-scale{position:relative;height:22px;border-bottom:1px solid var(--border)}
.cp-scale span{position:absolute;bottom:4px;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.cp-scale .cp-today{color:var(--bad)}
.cp-grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3);padding:14px 0 4px}
.cp-row{padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.cp-row:hover{background:var(--accent-soft)}
.cp-name{min-width:0;display:flex;flex-direction:column}
.cp-name b{font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cp-name span{font-size:11.5px;color:var(--ink-3)}
.cp-track{position:relative;height:26px}
.cp-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.cp-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);z-index:2}
.cp-bar{position:absolute;top:6px;height:14px;border-radius:3px}
.cp-bar.open{background:var(--c6)}
.cp-bar.closed{background:var(--border-strong)}
.cp-lab{position:absolute;top:5px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;z-index:3}
.cp-lab b{color:var(--ink)}
@media(max-width:800px){.cp-axis,.cp-row{grid-template-columns:1fr}.cp-axis>div:first-child{display:none}}
.arc-id{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.arc-w0{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.arcol.c-hold{--ac:var(--hold)}
.arboard{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.archb .eyebrow{margin-bottom:2px}

/* ===================== Flow layer ===================== */
:root{--lt-board:318px;--lt-mine:250px;--lt-rev:206px;--lt-media:210px;--lt-arch:318px}
main{padding-bottom:28px}
.pagehead.slim{margin-bottom:14px}
.pagehead.slim h1{font-size:23px}
.pagehead .acts{align-items:center}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c4) 60%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}
main.enter>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.04s} main.enter>*:nth-child(3){animation-delay:.08s} main.enter>*:nth-child(4){animation-delay:.12s} main.enter>*:nth-child(5){animation-delay:.16s}
main.enter .tk2{animation:rise .3s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(min(var(--i,0),14) * 22ms + 80ms)}
@media (prefers-reduced-motion:reduce){main.enter>*,main.enter .tk2,.okmark{animation:none!important}}

/* avatars */
.av{--av:#7794aa;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--av) 62%,#fff),var(--av));box-shadow:0 0 0 2px var(--surface)}
.av.sm{width:22px;height:22px;font-size:9px}
.av.xs{width:18px;height:18px;font-size:8px;box-shadow:none}

/* heat: how long at this stage */
.heat{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 5px;white-space:nowrap;line-height:1.5}
.heat svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.heat.h0{color:var(--good);background:var(--good-bg)}
.heat.h1{color:var(--warn);background:var(--warn-bg)}
.heat.h2{color:var(--bad);background:var(--bad-bg)}

/* the new card */
.tk2{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 11px 9px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink);box-shadow:0 1px 2px rgba(13,49,76,.05);transition:transform .14s,box-shadow .14s,border-color .14s;outline:none}
.tk2:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:7px 0 0 7px;background:var(--sc,var(--accent))}
.tk2:hover,.tk2:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow),0 6px 18px rgba(13,49,76,.10);border-color:var(--border-strong)}
.tk2:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.tk2.late{border-color:color-mix(in srgb,var(--bad) 45%,var(--border))}
.tk2.hold{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 8px,var(--hold-bg) 8px,var(--hold-bg) 10px)}
.tk2.hold:before{background:var(--hold)}
.tk2.focus{box-shadow:0 0 0 2px var(--c4)}
.tk2.dragging{opacity:.45;transform:rotate(1.5deg)}
.t2-top{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.t2-top .wr{white-space:nowrap}
.t2-st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap;padding:2px 0;margin-right:2px}
.t2-st i{width:7px;height:7px;border-radius:2px;background:var(--sc);flex:0 0 auto}
.t2-r{margin-left:auto;display:inline-flex;gap:4px;align-items:center}
.t2-r .size{height:18px;min-width:22px;font-size:10px}
.t2-nm{font-weight:600;font-size:13.5px;line-height:1.3;margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t2-tags{display:flex;flex-wrap:wrap;gap:4px;margin:-1px 0 7px}
.t2-ft{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);min-width:0}
.t2-who{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.t2-who b{color:var(--ink);font-weight:600}
.t2-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}

/* lanes: fit the width, scroll inside */
.lanes{--lh:max(360px,calc(100vh - var(--lt,300px)));display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;align-items:stretch;margin-bottom:18px}
/* lanes never get so narrow that a card's button wraps: below that they scroll sideways */
.lanes{grid-template-columns:repeat(var(--n),minmax(216px,1fr));overflow-x:auto;scrollbar-width:thin}
.lane .tk2 .btn{white-space:nowrap}
.lane{display:flex;flex-direction:column;min-height:0;max-height:var(--lh);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.lane>header{padding:10px 12px 9px;border-top:3px solid var(--lc,var(--accent));background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
.lh{display:flex;align-items:center;gap:8px}
.lh h4{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{margin-left:auto;font-size:12px;min-width:24px;height:22px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:color-mix(in srgb,var(--lc) 16%,transparent);color:var(--ink)}
.lane .o{font-size:11.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-b{position:relative;flex:1;min-height:90px;overflow-y:auto;overflow-x:hidden;padding:10px 10px 4px;scrollbar-width:thin;overscroll-behavior:contain}
.lane-e{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px;color:var(--ink-3);font-size:12.5px;text-align:center}
.lane-e svg{width:26px;height:26px;fill:none;stroke:var(--good);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;padding:5px;border-radius:50%;background:var(--good-bg)}
.lane-tabs{display:none}
.lsub{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:11px;color:var(--ink-2)}
.lsub span:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--lc);margin-right:5px;vertical-align:middle}
@media(max-width:900px){
  .lane-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .lane-tabs button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:5px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;border-top:3px solid var(--lc)}
  .lane-tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);border-top-color:var(--lc)}
  .lane-tabs b{margin-left:3px}
  .lanes{grid-template-columns:1fr;--lh:max(360px,calc(100vh - 220px))}
  .lane{display:none}.lane.on{display:flex}
}

/* toolbar: search + facilitator faces + more */
.ftbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tsearch{position:relative;flex:0 1 270px;min-width:180px}
.tsearch svg{position:absolute;left:9px;top:50%;width:15px;height:15px;transform:translateY(-50%);fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.tsearch input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.tsearch input:focus{outline:2px solid var(--sky);outline-offset:0;border-color:var(--sky)}
.tsearch.sm{flex:1 1 auto;min-width:0}
.facpick{display:flex;flex-wrap:wrap;gap:6px}
.facpick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:5px;padding:4px 9px 4px 5px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s}
.facpick .fp-all{padding-left:9px}
.facpick button b{font-size:11px;color:var(--ink-3);font-weight:700}
.facpick button:hover{border-color:var(--border-strong)}
.facpick button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.facpick button[aria-pressed="true"] b{color:var(--sky-soft)}
.moref{position:relative}
.moref summary{list-style:none;cursor:pointer;gap:5px}
.moref summary::-webkit-details-marker{display:none}
.moref summary svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.moref summary.on{border-color:var(--accent);color:var(--accent)}
.morep{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:280px;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow),0 10px 30px rgba(13,49,76,.18);padding:12px;display:grid;gap:10px}
.morep label{display:grid;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.morep select{width:100%}
.seg button b{font-size:11px;opacity:.7;margin-left:2px}
.seg.sm button{padding:4px 9px;font-size:12px}

/* figures that filter */
.lensfigs{margin-bottom:16px}
.fig.on{border-color:var(--fc);box-shadow:0 0 0 2px color-mix(in srgb,var(--fc) 40%,transparent),var(--shadow)}
.fig.static{cursor:default}.fig.static:hover{transform:none}
.fig-f{position:absolute;right:10px;top:10px;font-size:10.5px;font-weight:600;color:var(--ink-3);opacity:0;transition:opacity .12s}
.fig:hover .fig-f,.fig.on .fig-f{opacity:1}
.fig.on .fig-f{color:var(--fc)}

/* Pipeline Board */
.river{display:flex;gap:3px;margin:0 0 14px;height:46px}
.rv{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 8px;border:0;border-radius:5px;background:color-mix(in srgb,var(--sc) 16%,var(--surface));color:var(--ink);cursor:pointer;overflow:hidden;transition:flex .35s cubic-bezier(.2,.7,.2,1),background .15s;border-bottom:3px solid var(--sc)}
.rv b{font-size:15px;line-height:1.1}
.rv span{font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rv.z{background:var(--surface-2);border-bottom-color:var(--border)}
.rv.z b{color:var(--ink-3);font-size:12px}.rv.z span{display:none}
.rv:hover{background:color-mix(in srgb,var(--sc) 28%,var(--surface))}
.rv.on{background:var(--sc);color:#fff}.rv.on span{color:#fff}
.lst{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.lsc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.lsc i{width:7px;height:7px;border-radius:2px;background:var(--sc)}
.lsc b{color:var(--ink)}
.lsc.z{opacity:.6}
.lsc.on{background:var(--sc);border-color:var(--sc);color:#fff}.lsc.on b{color:#fff}.lsc.on i{background:#fff}
.dz{display:none}
.board2.dragging .dz{display:flex;flex-direction:column;gap:6px;position:absolute;inset:6px;z-index:5}
.dzi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed color-mix(in srgb,var(--sc) 60%,transparent);border-radius:8px;background:color-mix(in srgb,var(--sc) 10%,var(--surface));color:var(--ink-2);font-size:11.5px;transition:background .12s,transform .12s}
.dzi b{font-size:14px;color:var(--ink)}
.dzi.over{background:color-mix(in srgb,var(--sc) 30%,var(--surface));transform:scale(1.02)}
.dzi.cur{opacity:.35}
.board2.dragging .lane-b{overflow:hidden}
/* by facilitator matrix */
.mx{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.mx-h,.mx-r{display:grid;grid-template-columns:200px repeat(var(--n),minmax(0,1fr))}
.mx-h span{padding:9px 10px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);border-bottom:1px solid var(--border);background:var(--surface-2);border-top:3px solid var(--lc,transparent)}
.mx-b{max-height:max(360px,calc(100vh - 360px));overflow:auto}
.mx-r{border-bottom:1px solid var(--rule)}
.mx-r:last-child{border-bottom:0}
.mx-p{display:flex;gap:9px;align-items:center;text-align:left;border:0;background:var(--surface-2);padding:10px;cursor:pointer;color:var(--ink);border-right:1px solid var(--rule)}
.mx-p>span:not(.av){display:flex;flex-direction:column;min-width:0;flex:1}
.mx-p b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-p em{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.mx-bar{display:flex;gap:1px;height:5px;margin-top:4px;border-radius:2px;overflow:hidden}
.mx-p:hover{background:var(--accent-soft)}
.mx-c{padding:7px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--rule);min-width:0}
.mx-c:last-child{border-right:0}
.mc{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-left:3px solid var(--sc);background:var(--surface);border-radius:4px;padding:4px 6px;font-size:12px;color:var(--ink);cursor:pointer;text-align:left;min-width:0}
.mc>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .heat{font-size:9.5px;padding:0 4px}.mc .heat svg{display:none}
.mc:hover{border-color:var(--border-strong);background:var(--accent-soft)}
.mc.hold{border-left-color:var(--hold)}
.mc-more{border:0;background:none;color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;text-align:left;padding:2px 4px}
.mc-0{color:var(--border-strong);text-align:center;padding:4px}
@media(max-width:900px){.mx-h{display:none}.mx-r{grid-template-columns:1fr}.mx-c{border-right:0}.mx-c:empty,.mx-c:has(.mc-0){display:none}.river{height:auto;flex-wrap:wrap}.rv{flex:1 1 70px!important;height:42px}.rv.z{display:none}}

/* My Queue */
.focus{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:22px;align-items:stretch;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-mid) 100%);color:#fff;border-radius:12px;padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.focus:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(116,191,235,.22),transparent 70%);pointer-events:none}
.fx-l{min-width:0}
.fx-k{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--sky)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--c4);animation:pulse 1.8s infinite}
.fx-wr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;color:var(--sky-soft)}
.focus .chip{background:rgba(255,255,255,.12);color:#fff}
.focus .chip.bad{background:#f08579;color:#3b0f0b}
.focus h2{font-size:22px;line-height:1.25;margin:8px 0 6px;color:#fff;cursor:pointer}
.focus h2:hover{text-decoration:underline;text-decoration-color:var(--sky);text-underline-offset:4px}
.fx-next{font-size:15px;color:#fff;opacity:.95}
.fx-due{font-size:13px;color:var(--sky-soft);margin-top:4px;font-weight:600}
.fx-due.bad{color:#f6a59c}
.fx-step{display:flex;align-items:center;gap:3px;margin:14px 0 2px;flex-wrap:wrap}
.fx-step i{width:22px;height:6px;border-radius:2px;background:rgba(255,255,255,.18)}
.fx-step i.d{background:var(--sky)}
.fx-step i.c{background:#fff;box-shadow:0 0 0 2px var(--sc)}
.fx-step span{font-size:12px;color:var(--sky-soft);margin-left:8px}
.fx-step b{color:#fff}
.fx-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.focus .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#fff;padding:8px 14px;font-size:13px}
.focus .btn:hover{background:rgba(255,255,255,.16)}
.focus .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
.focus .btn.ghost{border-color:transparent}
.fx-r{display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;z-index:1}
.ring{--p:0;display:flex;align-items:center;gap:14px}
.ring b{display:flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;font-size:28px;background:radial-gradient(closest-side,var(--navy) 79%,transparent 80% 100%),conic-gradient(var(--c4) calc(var(--p)*1%),rgba(255,255,255,.15) 0);flex:0 0 auto}
.ring span{font-size:13px;color:var(--sky-soft);font-weight:600;max-width:140px}
.fx-then{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px}
.fx-th{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--sky);padding:2px 4px 6px}
.fx-row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:6px 4px;border-radius:5px;cursor:pointer;font-size:12.5px;min-width:0}
.fx-row:hover{background:rgba(255,255,255,.08)}
.fx-row i{width:4px;height:22px;border-radius:2px;flex:0 0 auto}
.fx-row>span:not(.heat){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-row b{color:var(--sky-soft)}
.fx-mini{display:grid;gap:4px;padding:0 4px 4px;font-size:13px;color:var(--sky-soft)}
.fx-mini b{color:#fff;font-size:16px;margin-right:4px}
.focus.clear{grid-template-columns:1fr;background:linear-gradient(120deg,var(--navy) 0%,#0f5a4a 140%)}
.focus.clear .fx-l{display:flex;align-items:center;gap:18px}
.focus.clear p{margin:4px 0 0;color:var(--sky-soft);font-size:14px;max-width:720px}
.focus.clear h2{cursor:default;margin:0}.focus.clear h2:hover{text-decoration:none}
.okmark{width:56px;height:56px;border-radius:50%;background:#4fc79b;display:flex;align-items:center;justify-content:center;flex:0 0 auto;animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
.okmark svg{width:30px;height:30px;fill:none;stroke:#06202f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:20px}
.tm{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 10px;align-items:center;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);box-shadow:0 1px 2px rgba(13,49,76,.05);transition:transform .14s,box-shadow .14s}
.tm:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tm .av{grid-row:1/3}
.tm-n{display:flex;flex-direction:column;min-width:0}
.tm-n b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-n em{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.tm-q{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--ink-3);font-weight:600;line-height:1.1}
.tm-q b{font-size:20px;color:var(--ink-3)}
.tm-q.on b{color:var(--warn)}
.tm-s{grid-column:2;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tm-s .bad{color:var(--bad)}
@media(max-width:900px){.focus{grid-template-columns:1fr;padding:18px}.focus h2{font-size:19px}}

/* Governance */
.split2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.pane{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);overflow:hidden;max-height:max(380px,calc(100vh - 318px));min-height:0}
.pane>header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.pane>header h3{font-size:14.5px}
.pane>header>:last-child:not(:first-child){margin-left:auto}
.pane-b{flex:1;overflow:auto;padding:10px 12px;min-height:0;overscroll-behavior:contain}
.dk-g{margin-bottom:12px}
.dk-gh{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-2);padding:2px 2px 7px}
.dk-gh i{width:8px;height:8px;border-radius:2px;background:var(--sc)}
.dk-gh b{color:var(--ink)}
.dk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-left:4px solid var(--sc);border-radius:7px;margin-bottom:7px;cursor:pointer;background:var(--surface);transition:transform .14s,box-shadow .14s}
.dk:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.dk-m{min-width:0}
.dk-wr{font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-nm{font-weight:600;font-size:13.5px;line-height:1.3}
.dk-s{font-size:12px;color:var(--ink-2)}
.dk-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tl{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.tl:before{content:"";position:absolute;left:84px;top:4px;bottom:4px;width:2px;background:var(--rule)}
.tl li{display:grid;grid-template-columns:72px 1fr;gap:24px;padding:7px 4px;position:relative;cursor:pointer;border-radius:5px;font-size:13px}
.tl li:hover{background:var(--accent-soft)}
.tl li:before{content:"";position:absolute;left:76px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--surface)}
.tl li.no:before{background:var(--bad)}
.tl-d{font-size:12px;color:var(--ink-3);font-weight:600;text-align:right}
.tl-s{font-size:12px;color:var(--ink-2);margin-top:2px}
@media(max-width:1000px){.split2{grid-template-columns:1fr}}

/* Comment Periods */
.cp-wrap.has-side{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.cp-wrap .card{margin-bottom:0}
.cp-scroll{max-height:max(320px,calc(100vh - 420px));overflow:auto;overscroll-behavior:contain}
.cp-side{max-height:max(380px,calc(100vh - 318px))}
.cp-name{flex-direction:row;align-items:center;gap:8px}
.cp-name>span{display:flex;flex-direction:column;min-width:0}
.cp-name b{color:var(--ink)}
.cp-bar{overflow:hidden;transition:filter .15s}
.cp-bar.open{background:color-mix(in srgb,var(--c6) 35%,var(--surface))}
.cp-fill{position:absolute;left:0;top:0;bottom:0;background:var(--c6)}
.cp-bar.soon .cp-fill{background:var(--c4)} .cp-key i.soon{background:var(--c4)}
.cp-bar.closed .cp-fill{background:var(--border-strong)}
.cp-row:hover .cp-bar{filter:brightness(1.08) saturate(1.2)}
@media(max-width:1000px){.cp-wrap.has-side{grid-template-columns:1fr}}

/* All Work */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.tscroll{max-height:max(360px,calc(100vh - 360px));overflow:auto;overscroll-behavior:contain}
.tbl.t2 th{position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;white-space:nowrap}
.tbl.t2 th .so{margin-left:4px;opacity:.45}
.tbl.t2 th:hover .so{opacity:1}
.tbl.t2 td{vertical-align:middle}
.tbl.t2 .mini-track{margin-top:5px;max-width:200px}
.tbl.t2 tr:hover td{background:var(--accent-soft)}
.wrc{font-weight:600;color:var(--ink-2)}
.wrc i{display:inline-block;width:4px;height:16px;border-radius:2px;vertical-align:middle;margin-right:8px}
.facc{display:inline-flex;align-items:center;gap:6px}
.sm1{font-size:12px}
td.bad{color:var(--bad);font-weight:600}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:9px 12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-2);background:var(--surface-2)}
.pager span{margin-right:auto}
.btn:disabled{opacity:.45;cursor:default}

/* MISMO Media */
.mcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px 10px 14px;margin-bottom:8px}
.mcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:7px 0 0 7px;background:var(--sc)}
.mc-top{display:flex;align-items:center;gap:8px;font-size:12.5px}
.mc-top .muted{margin-left:auto;font-size:11.5px}
.mc-ic{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--sc) 15%,transparent)}
.mc-ic svg{width:15px;height:15px;fill:none;stroke:var(--sc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mc-wr{font-weight:600;font-size:13px;margin:6px 0 3px;cursor:pointer;color:var(--accent)}
.mc-tx{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc-ln{font-size:12px}
.mc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Architecture Help in lanes */
.lane .arc{margin-bottom:8px}
.lane .arc-d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lane.l-done .arc-d,.lane.l-done .arc-meta{display:none}
.lane.l-done .arc{opacity:.92}

/* Notifications: two-pane mailbox */
.mailbox{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:14px;height:max(420px,calc(100vh - 210px))}
.mlist,.mread{background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mlist header{display:flex;flex-direction:column;gap:8px;padding:10px;border-bottom:1px solid var(--border)}
.ml-b{flex:1;overflow:auto;overscroll-behavior:contain}
.mi{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:12.5px}
.mi:hover{background:var(--surface-2)}
.mi.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mi-dot{width:8px;height:8px;border-radius:50%;background:var(--c4);margin-top:5px;flex:0 0 auto}
.mi.sent .mi-dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.mi-m{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
.mi-t{display:flex;gap:8px}.mi-t b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi-t em{font-style:normal;color:var(--ink-3);font-size:11.5px}
.mi-s{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-p{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.sent .mi-s{font-weight:500}
.mr-h{padding:16px 20px;border-bottom:1px solid var(--border)}
.mr-s{font-size:17px;font-weight:700;margin-bottom:6px}
.mr-to{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.mr-to span{display:inline-block;min-width:54px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.mr-b{flex:1;overflow:auto;padding:16px 20px;white-space:pre-line;font-size:13.5px;line-height:1.6}
.mr-a{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface-2)}
@media(max-width:900px){.mailbox{grid-template-columns:1fr;height:auto}.mlist{max-height:46vh}.mread{min-height:360px}}

/* Resource Center: interactive process map */
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.fl-ph{flex:1 1 160px;border:1px solid var(--border);border-top:3px solid var(--lc);border-radius:8px;padding:8px;background:var(--surface-2)}
.fl-pn{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.fl-st{display:flex;flex-direction:column;gap:4px}
.fl-s{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:5px;padding:5px 8px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s}
.fl-s:hover{transform:translateX(2px);border-color:var(--sc)}
.fl-n{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--ink);flex:0 0 auto}
.fl-s.on{background:var(--sc);border-color:var(--sc);color:#fff}.fl-s.on .fl-n{background:#fff;color:var(--navy)}
.fl-a{align-self:center;color:var(--ink-3);font-size:18px}
.fl-d{border:1px solid var(--border);border-left:4px solid var(--sc);border-radius:8px;padding:14px 16px;background:var(--surface);animation:rise .25s both}
.fl-dk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.fl-d h3{font-size:17px;margin:2px 0 4px}
.fl-d p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
.fl-dm{display:flex;gap:22px;align-items:center;flex-wrap:wrap;font-size:13px}
.fl-dm span{display:flex;flex-direction:column}
.fl-dm b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fl-dm .btn{margin-left:auto}
.govl{display:flex;flex-wrap:wrap;gap:8px}
.govl a{border:1px solid var(--border);border-radius:5px;padding:7px 11px;font-size:13px;font-weight:600;text-decoration:none;background:var(--surface-2)}
.govl a:hover{border-color:var(--accent)}
@media(max-width:900px){.fl-a{display:none}}

/* Overview: attention tabs */
.att-tabs{margin:-2px 0 10px}
.att-b{max-height:340px;overflow:auto;overscroll-behavior:contain}
.tsearch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:600 11px var(--display);color:var(--ink-3);border:1px solid var(--border);border-radius:3px;padding:0 5px;background:var(--surface-2);pointer-events:none}
.tsearch input:focus+kbd{display:none}

.tl{position:relative;height:118px;margin:6px 8px 0}

.tl-m b.r1{top:16px}

@media (max-width:900px){.wh{padding:20px 18px 0;margin:0 -14px}.wh h2{font-size:23px}.wh-tabs{margin:0 -14px 14px;padding:6px 14px 0}.wh-tabs button{padding:9px 12px}.wh-tabs button span{display:none}.wh-tabs button[aria-selected="true"] span{display:inline}.wh-sep{display:none}.wh-leads{grid-template-columns:1fr}.wh-date{min-width:0;flex:1 1 220px}}

/* My Queue for someone who facilitates nothing: one lane, cards side by side */
.lane.wide{max-height:none}

p,.sub,.lede{text-wrap:pretty}

/* hero: where the live work is, by phase */
.hp-ph{display:block;width:100%;margin-top:16px;cursor:pointer;position:relative;z-index:1;background:none;border:0;padding:0;font:inherit;text-align:left;color:inherit}
.hp-phk,.hp-phb,.hp-phl{display:flex}.hp-phk{display:block}

.att4 button span{white-space:normal;line-height:1.2;overflow:visible}
@media(max-width:600px){.att4{grid-template-columns:1fr 1fr}}

.pane.gov-log{min-height:376px}
/* Help: Good to Know reads in dark mode; role tabs and topics show their whole name */
:root{--tips-bg:var(--sky-wash);--tips-k:var(--navy-mid)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tips-bg:var(--surface-2);--tips-k:var(--sky)}}
:root[data-theme="dark"]{--tips-bg:var(--surface-2);--tips-k:var(--sky)}
.hx-tips{background:var(--tips-bg)}.hx-tips b{color:var(--tips-k)}
@media(min-width:601px){.hx-roles{display:flex;flex-wrap:wrap}.hx-roles button{flex:0 0 auto;overflow:visible;text-overflow:clip}}

/* panel stage strip: whole words, a clear gap between labels */
.track .tst{padding-right:6px;hyphens:none;overflow-wrap:normal;word-break:normal}
/* panel tab counts and the Split toggle: square, no pills */
.wh-tabs b{border-radius:4px}

.sw.on i:after{display:block;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;background:none;border-radius:0;transform:rotate(45deg)}

.rc2-cols .rc2-tx b,.rc2-cols .rc2-tx span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* cards: titles and the next-step note get two lines before they cut off */
.plate-r .pl{white-space:normal}.plate-r .pl i{white-space:nowrap}

.dg-sw{width:18px;height:18px}

.dg-sw span:before{display:none}

.dg-sw input:checked+span:before{display:block;width:5px;height:9px;left:5px;top:1px;background:none;border:solid #fff;border-width:0 2px 2px 0;border-radius:0;box-shadow:none;transform:rotate(45deg)}

.rd-list{display:flex;flex-direction:column}

<script>
/* ============================================================================
   MISMO Manufacturing System (MMS)
   One ticket per Work Request, carried from Approved to Published.
   Data: window.claude.use('db') — the Claude version's store, or the
   resources.mismo.org relay door (project key "mms"), same calls either way.
   Collections: tickets/<id>, config/<process|people|notify>, outbox/<id>, media/<id>
   ============================================================================ */
(function(){
"use strict";
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||null));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- dates (local calendar days, stored as YYYY-MM-DD) ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const toD=s=>{ if(!s) return null; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const addDays=(s,n)=>{ const d=toD(s)||new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const daysBetween=(a,b)=>{ const x=toD(a), y=toD(b); if(!x||!y) return null; return Math.round((y-x)/864e5); };
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{ const d=toD(s); if(!d) return ''; return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); };
const fmtS=s=>{ const d=toD(s); if(!d) return ''; const y=d.getFullYear()!==new Date().getFullYear(); return MON[d.getMonth()]+' '+d.getDate()+(y?', '+d.getFullYear():''); };
function parseDate(v){
  v=String(v||'').trim(); if(!v) return '';
  const real=(y,mo,d)=>{ const x=new Date(+y,+mo-1,+d); return x.getFullYear()===+y&&x.getMonth()===+mo-1&&x.getDate()===+d?y+'-'+pad(mo)+'-'+pad(d):null; };
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return real(m[1],m[2],m[3]);
  m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2}|\d{4}))?$/);
  if(m){ let y=m[3]?+m[3]:new Date().getFullYear(); if(y<100) y+=2000; return real(y,m[1],m[2]); }
  if(/^[\d\/\-. ]+$/.test(v)) return null; /* all digits that didn't read as a date above, e.g. 1/2/3 */
  const d=new Date(v); if(!isNaN(d)){ const dm=v.match(/[A-Za-z]{3,}\.?\s+(\d{1,2})\b/); if(dm&&+dm[1]!==d.getDate()) return null; return ymd(d); }
  return null;
}
/* the local calendar day of a stored timestamp (history is kept in UTC) */
const atDay=iso=>{ if(!iso) return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso; const d=new Date(iso); return isNaN(d)?String(iso).slice(0,10):ymd(d); };
const ago=s=>{ const n=daysBetween(s,today()); if(n==null) return ''; if(n<=0) return 'today'; if(n===1) return '1 day'; return n+' days'; };

/* ---------- people & roles ---------- */
const ROLE_LABEL={facilitator:'Facilitator',staff:'MISMO Staff',media:'MISMO Media',imawg:'IM and AWG Chairs',director:'Director',vps:'Designation Approver',gov:'Governance',website:'Website Admin',pm:'Program Manager',architect:'Architect',workgroup:'Workgroup',bet:'BET'};
const DEFAULT_PEOPLE={
  facilitators:[
    {name:'Erin Bittenbender',email:'ebittenbender@mismo.org'},
    {name:'Kathryn Williams',email:'kwilliams@mismo.org'},
    {name:'Kellie Stoll',email:'kstoll@mismo.org'},
    {name:'Leeann Walker',email:'lwalker@mismo.org'},
    {name:'Meghan Tidgewell',email:'mtidgewell@mismo.org'}],
  roles:{
    staff:[{name:'Perry Williams',email:'workrequests@mismo.org'},{name:'Jonna Critchley',email:'jcritchley@mba.org'},{name:'Vanessa Rios',email:'vrios@mismo.org'}],
    media:[{name:'Amy Moses',email:'amoses@mba.org'},{name:'Perry Williams',email:'pwilliams@mba.org'}],
    imawg:[{name:'Erin Bittenbender',email:'ebittenbender@mismo.org'}],
    director:[{name:'Jonna Critchley',email:'jcritchley@mba.org'}],
    vps:[{name:'Jonna Critchley',email:'jcritchley@mba.org'}],
    gov:[],
    website:[{name:'Vanessa Rios',email:'vrios@mismo.org'}],
    pm:[{name:'Perry Williams',email:'pwilliams@mba.org'}],
    architect:[{name:'Mark Kleingers',email:'mkleingers@mismo.org'}]
  },
  gc:'GC'
};

/* ---------- the process: stages are settings, not code ---------- */
const STAGE_KEYS=['approved','cfp','kickoff','work','aireview','im','awg','designation','gc-comment','comment','post','gc-publish','release'];
function baseStages(gov){ return [
  {key:'approved',name:'Approved – Set Up',owner:'staff',color:'#7794aa',on:true,desc:'Approved by the executive team. Set the start date, T-shirt size and target, and decide on a Call for Participation.'},
  {key:'cfp',name:'Call for Participation',owner:'media',color:'#eb6834',on:true,desc:'MISMO Media drafts and publishes the Call for Participation.'},
  {key:'kickoff',name:'Kickoff Approval',owner:'gov',color:'#e87ba4',on:true,desc:gov+' approves kicking off a new Development Workgroup once enough participants have signed up.'},
  {key:'work',name:'In Work',owner:'facilitator',color:'#2477b8',on:true,desc:'The workgroup builds the work product, aiming at the Target to Submit to IM date.'},
  {key:'aireview',name:'AI Review',owner:'facilitator',color:'#1baf7a',on:true,desc:'Editor and readiness review in one: Claude checks the submission and lists anything to fix before IM.'},
  {key:'im',name:'IM Review',owner:'imawg',color:'#14486e',on:true,desc:'Information Management reviews the submission.'},
  {key:'awg',name:'AWG Review',owner:'imawg',color:'#2f6688',on:true,desc:'Architecture Workgroup reviews the submission.'},
  {key:'designation',name:'License Designation',owner:'director',color:'#eda100',on:true,desc:'The MMS recommends the comment type, classification and license from past designations; the Designation Approver approves.'},
  {key:'gc-comment',name:'Governance Approval to Comment',owner:'gov',color:'#d55181',on:true,desc:gov+' approves the work product to go out for public comment.'},
  {key:'comment',name:'Comment Period',owner:'website',color:'#008300',on:true,desc:'Posted to the website standards page and announced. Moves on by itself when the period ends.'},
  {key:'post',name:'Post-Comment',owner:'facilitator',color:'#456179',on:true,desc:'The facilitator reports what came back from the comment period.'},
  {key:'gc-publish',name:'Governance Approval to Publish',owner:'gov',color:'#b3372c',on:true,desc:gov+' approves publishing as a Candidate Recommendation (standard) or Final (collateral).'},
  {key:'release',name:'Release',owner:'website',color:'#0f7b5c',on:true,desc:'MISMO Media announces it and the website pages go live.'}
];}
function presetCurrent(){ return {label:"Today's Process",gov:'GC',commentDays:[30,60,90],stages:baseStages('GC')}; }
function presetNext(){
  const s=baseStages('RSGC');
  s.find(x=>x.key==='approved').desc='Approved by BET (RSGC approval delegated to BET). Set the start date, T-shirt size and Target to Submit to IM, and decide on a Call for Participation.';
  s.find(x=>x.key==='kickoff').on=false;
  s.find(x=>x.key==='comment').desc='30 days. Posts to the website standards page and MISMO Media is asked for a LinkedIn post. Moves on by itself when it ends.';
  return {label:'New Process',gov:'RSGC',commentDays:[30],stages:s};
}
const DEFAULT_PROCESS={active:'current',switchOn:'',presets:{current:presetCurrent(),next:presetNext()}};
const DEFAULT_NOTIFY={holdUntil:'2026-11-20',flowUrl:'',from:'workrequests@mismo.org',onEnter:{
  approved:['staff'],cfp:['media','facilitator'],kickoff:['staff'],work:['facilitator'],aireview:['facilitator'],im:['imawg','facilitator'],awg:['imawg','facilitator'],
  designation:['director'],'gc-comment':['staff'],comment:['website','media','facilitator'],post:['facilitator'],'gc-publish':['staff'],release:['media','website','facilitator']},
  reminders:{targetDays:7,commentEndingDays:3,staleDays:45}};
const SIZE_DAYS={S:60,M:90,L:150,XL:210};
const SIZES=[['S','Small'],['M','Medium'],['L','Large'],['XL','X-Large']];

/* ---------- app state ---------- */
const S={ready:false,tickets:{},process:clone(DEFAULT_PROCESS),people:clone(DEFAULT_PEOPLE),notify:clone(DEFAULT_NOTIFY),
  outbox:{},media:{},arch:{},me:{name:'',email:''},canWrite:true,isStaff:false,viewAs:'',view:'home',panel:null,
  filters:{fac:'',wg:'',size:'',type:'',q:'',state:'live',sort:'stage',dir:1,stage:''},sample:null,mode:'claude',loaded:{}};
window.__mms=S;

/* ---------- store: claude db, or memory when no store is reachable ---------- */
const Store={db:null,mem:null,subs:{},
  async init(){
    let db=null;
    try{ if(window.claude && window.claude.use){ db=window.__hqRelay?await window.claude.use('db'):await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]); if(window.__hqRelay) S.mode='relay'; } }catch(e){ db=null; }
    if(db){ this.db=db; return true; }
    this.mem={}; S.mode='memory'; return false;
  },
  sub(coll,cb){
    if(this.db){
      return this.db.collection(coll).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); cb(o, snap.metadata||{}); },
        e=>{ saveState(false,(e&&e.message)||'Could not load '+coll); });
    }
    (this.subs[coll]=this.subs[coll]||[]).push(cb); setTimeout(()=>cb(clone(this.mem[coll]||{}),{}),0); return ()=>{};
  },
  async set(coll,id,data){
    if(this.db){ return this.db.collection(coll).doc(id).set(clone(data)); }
    (this.mem[coll]=this.mem[coll]||{})[id]=clone(data); (this.subs[coll]||[]).forEach(cb=>cb(clone(this.mem[coll]),{}));
  },
  async del(coll,id){
    if(this.db){ return this.db.collection(coll).doc(id).delete(); }
    if(this.mem[coll]) delete this.mem[coll][id]; (this.subs[coll]||[]).forEach(cb=>cb(clone(this.mem[coll]),{}));
  }
};
let pendingSaves=0;
function saveState(ok,msg){ const el=$('#savestate'); if(!el) return; if(ok===false){ el.textContent='Not saved: '+msg; el.className='savestate err'; return; } el.className='savestate'; el.textContent=pendingSaves?'Saving…':(S.mode==='memory'?'Not connected: changes stay on this screen':''); }
async function write(coll,id,data){
  pendingSaves++; saveState();
  try{ await Store.set(coll,id,data); pendingSaves--; saveState(); return true; }
  catch(e){ pendingSaves--; saveState(false,(e&&e.message)||'try again'); toast('That change did not save. '+((e&&e.message)||'')); return false; }
}
async function remove(coll,id){ try{ await Store.del(coll,id); }catch(e){ toast('Could not delete: '+((e&&e.message)||'')); } }

/* ---------- process helpers ---------- */
function proc(){ const p=S.process||DEFAULT_PROCESS; return (p.presets&&p.presets[p.active])||presetCurrent(); }
function stages(){ return (proc().stages||[]).filter(s=>s.on!==false); }
function allStages(){ return proc().stages||[]; }
function stageDef(k){ return allStages().find(s=>s.key===k) || (k==='published'?{key:'published',name:'Published',owner:'',color:'#0f7b5c'}:{key:k,name:k,owner:'staff',color:'#7794aa'}); }
/* people see "Governance" on every label; the committee's own name (GC or RSGC) is in Settings and the Governance page subtitle */
function govName(){ return 'Governance'; }
function govBody(){ return proc().gov||S.people.gc||'GC'; }
function stageIndex(k){ return stages().findIndex(s=>s.key===k); }
function nextStage(t,from){
  const list=stages(); let i=list.findIndex(s=>s.key===(from||t.stage));
  for(let j=i+1;j<list.length;j++){
    const k=list[j].key;
    if(k==='cfp' && !(t.cfp&&t.cfp.needed)) continue;
    if(k==='kickoff' && !((t.cfp&&t.cfp.needed) && /dwg/i.test(t.groupType||''))) continue;
    return k;
  }
  return 'published';
}
function peopleFor(role,t){
  if(role==='facilitator') return t&&t.facilitator?[personByName(t.facilitator)||{name:t.facilitator,email:''}]:[];
  return (S.people.roles&&S.people.roles[role])||[];
}
function sameName(a,b){ a=String(a||'').trim().toLowerCase(); b=String(b||'').trim().toLowerCase(); if(!a||!b) return false; if(a===b) return true; if(a.indexOf(' ')<0) return b.split(' ')[0]===a; if(b.indexOf(' ')<0) return a.split(' ')[0]===b; return false; }
function personByName(n){ const all=[...(S.people.facilitators||[]),...Object.values(S.people.roles||{}).flat()]; return all.find(p=>p.name.toLowerCase()===String(n||'').toLowerCase())||all.find(p=>sameName(p.name,n)); }
function emailOf(n){ const p=personByName(n); return p?p.email:''; }

/* whose move is it — the heart of every queue */
function whoseMove(t){
  if(t.request) return {role:'staff',label:'MISMO Staff',text:(t.request.by||'The facilitator')+' asked to '+({hold:'put this on hold',resume:'resume this',close:'close this',cancel:'cancel this'}[t.request.kind]||t.request.kind)};
  if(t.split){ const n=(t.deliverables||[]).length; return {role:'',label:'Split',text:'Split into '+n+' deliverable'+(n===1?'':'s')+'; each one moves on its own'}; }
  if(t.rides&&t.state==='active'){ const b=S.tickets[t.rides]; return {role:'',label:'Moves With '+(b?b.wr:t.rides),text:'Held for the '+(b?b.wr+' '+b.name:'Reference Model')+' release and moves with it'}; }
  if(t.state==='hold') return {role:'staff',label:'On Hold',hold:true,text:'On hold'+(t.holdReason?': '+t.holdReason:'')};
  if(t.state!=='active') return {role:'',label:'Done',text:''};
  const g=govName(), sub=t.sub||'';
  switch(t.stage){
    case 'approved': return {role:'staff',label:'MISMO Staff',text:'Set the start date, size and target'};
    case 'cfp': return sub==='published'?{role:'staff',label:'MISMO Staff',text:'Confirm the Call for Participation is out'}:{role:'media',label:'MISMO Media',text:'Draft and publish the Call for Participation'};
    case 'kickoff': return {role:'gov',label:g,text:g+' decision to kick off the workgroup'};
    case 'work': return {role:'facilitator',label:'Facilitator',text:'Build the work product; submit for AI Review when ready'};
    case 'aireview':
      if(sub==='updates') return {role:'facilitator',label:'Facilitator',text:'Make the updates AI Review found, then resubmit'};
      if(sub==='reviewed') return {role:'facilitator',label:'Facilitator',text:'Read the AI Review and send to IM, or make updates'};
      return {role:'facilitator',label:'Facilitator',text:'Run the AI Review on the submission'};
    case 'im': case 'awg': {
      const nm=t.stage==='im'?'IM':'AWG';
      if(sub==='updates') return {role:'facilitator',label:'Facilitator',text:'Make the '+nm+' updates, then resubmit'};
      if(sub==='prep') return {role:'facilitator',label:'Facilitator',text:'Submit to '+nm+' through MISMO Connect'};
      const pq=typeof portalItemFor==='function'?portalItemFor(t,t.stage):null; if(pq) return {role:'imawg',label:nm+' Review',text:pq.status==='carried'?'Carried to the next AWG call':(t.stage==='awg'?'On the AWG agenda':'With the IM reviewers'+(pq.rows&&pq.done?': '+pq.done+' of '+pq.rows+' rows decided':''))};
      return {role:'imawg',label:'IM and AWG',text:sub==='in-review'?nm+' is reviewing':t.stage==='im'?'Run the IM Pre-Review and send it to IM Review':'Waiting for '+nm+' Review'};
    }
    case 'designation':
      if(sub==='vps'){ const ap=peopleFor('vps').map(p=>String(p.name).split(' ')[0]).join(', ')||'Designation Approval'; return {role:'vps',label:ap,text:t.designation&&t.designation.auto?'Approve the recommended designation':'Approve the Director’s designation'}; }
      if(sub==='director'||sub==='discuss') return {role:'director',label:'Director',text:sub==='discuss'?'Talk it over and update the designation':'Recommend the designation'};
      return {role:'vps',label:peopleFor('vps').map(p=>String(p.name).split(' ')[0]).join(', ')||'Designation Approver',text:'Approve the recommended designation'};
    case 'gc-comment': return {role:'gov',label:g,text:g+' approval to go to comment'};
    case 'comment': return sub==='setup'?{role:'website',label:'Website Admin',text:'Post to the standards page and set the dates'}:{role:'',label:'Comment Period',text:'Open for comment until '+fmtS(t.dates&&t.dates.commentEnd)};
    case 'post': return {role:'facilitator',label:'Facilitator',text:'Report what came back from comment'};
    case 'gc-publish': return {role:'gov',label:g,text:g+' approval to publish as '+(isStandard(t)?'Candidate Recommendation':'Final')};
    case 'release': return {role:'website',label:'Website Admin',text:'Publish the pages and announcement'};
  }
  const sd=stageDef(t.stage); return {role:sd.owner||'staff',label:sd.owner==='gov'?govName():(ROLE_LABEL[sd.owner]||'MISMO Staff'),text:sd.desc||('Finish '+sd.name)};
}
const isStandard=t=>/standard/i.test(t.classification||'');
function movers(t){ const w=whoseMove(t); return w.role?peopleFor(w.role,t):[]; }
function isMine(t,who){
  who=who||viewer(); if(!who||!who.name) return false;
  const w=whoseMove(t); if(!w.role) return false;
  return movers(t).some(p=>sameName(p.name,who.name)||(who.email&&p.email&&p.email.toLowerCase()===who.email.toLowerCase()));
}
/* "Waiting on you" means something is due now: a hand-off someone is waiting
   for (coming out of comment, send for approval, make IM's updates...), or
   building work whose Target to Submit to IM is this week or already past. */
function dueNow(t){ const d=t.dates||{}, soon=addDays(today(),7);
  if(t.state==='hold') return !!(t.holdUntil&&t.holdUntil<=soon);
  if(t.stage==='work') return !!(d.targetIM&&d.targetIM<=soon);
  return true; }
function waitingOn(t,who){ return isMine(t,who)&&dueNow(t); }
function myFacTickets(who){ who=who||viewer(); return liveTickets().filter(t=>sameName(t.facilitator,who.name)); }
function viewer(){ if(S.viewAs){ return personByName(S.viewAs)||{name:S.viewAs}; } const p=personByName(S.me.name); return p&&!S.me.email?Object.assign({},S.me,{name:p.name}):S.me; }

const liveTickets=()=>allTickets().filter(t=>(t.state==='active'||t.state==='hold')&&!t.split);
const ridersOf=id=>allTickets().filter(x=>x.rides===id&&x.state!=='canceled'&&x.state!=='closed');
function pastTarget(t){ const d=t.dates||{}; return t.state==='active' && !t.split && !t.rides && d.targetIM && d.targetIM<today() && ['approved','cfp','kickoff','work','aireview'].includes(t.stage); }
