function imEnsureQ(){ if(S.cfgDocs&&S.cfgDocs.imauto) S.imauto=S.cfgDocs.imauto; if(imSubs.q) return; imSubs.q=1; try{ Store.sub('imqueue',o=>{ S.imq=o||{}; if(S.ready){ imCount(); if(S.view==='imreview') renderAll(); } }); Store.sub('imlearn-'+new Date().getFullYear(),o=>{ S.iml=Object.assign({},S.iml,o||{}); }); Store.sub('imlearn-'+(new Date().getFullYear()-1),o=>{ S.iml=Object.assign({},o||{},S.iml); }); }catch(e){} }
function imColl(tid){ return ('imr-'+String(tid)).replace(/[^A-Za-z0-9_.-]/g,'_').slice(0,40); }
function imEnsureR(tid){ const c=imColl(tid); if(imSubs[c]) return; imSubs[c]=1; try{ Store.sub(c,o=>{ Object.values(o||{}).forEach(d=>{ if(d&&d.rep) S.imr[d.rep]=d; }); if(S.view==='imreview') renderAll(); }); }catch(e){} }
function imIsReviewer(){ return S.isStaff||isRole('imreview',S.me); }
function imCount(){ const n=Object.values(S.imPortalQ||S.imq||{}).filter(q=>q&&!q.hist&&(q.status==='awaiting'||q.status==='carried')).length; const b=$('#nav-imreview'); if(b){ b.textContent=n||''; b.hidden=!n; } const btn=$('#nav button[data-hq="imreview"]'); if(btn) btn.hidden=!(S.isStaff||isRole('imreview',S.me)||isRole('facilitator',S.me)||(S.people&&(S.people.facilitators||[]).some(p=>sameName(p.name,S.me.name)))); }

/* ---------- 1. the draft: a decision for every row ---------- */
function imKind(row){ return [row.draft.dec,row.draft.rule||'clean',String(row.tt||'').toLowerCase()].join('|'); }
function imDraftRows(P,findings,ai){
  const AI={}; ((ai&&ai.rows)||[]).forEach(x=>{ AI[String(x.item)]=x; });
  const st=imRuleStats();
  return P.rows.map((r,i)=>{ const it=String(r.item||('row '+r._row)); const F=findings.filter(f=>String(f.item||'')===it||String(f.item||'')===String(r.item||''));
    let dec='Approved as Submitted', rule='', why=[], sug='', look=false;
    const bump=(d,ru,txt)=>{ if((IM_RANK[d]||0)>(IM_RANK[dec]||0)){ dec=d; rule=ru; } if(txt) why.push(txt); };
    F.forEach(f=>{ const ru=f.rule||'';
      // learned: a check IM usually lets through (approved as submitted most of the time) only adds a note
      const ls=st[ru]; if(ls&&ls.n>=10&&ls.keep/ls.n>=0.6&&!IM_RULE.deny.includes(ru)){ why.push('(IM usually approves these as submitted) '+f.issue); return; }
      if(IM_RULE.deny.includes(ru)) bump('Denied',ru,f.issue+' '+f.suggestion);
      else if(IM_RULE.ret.includes(ru)||(ru==='need'&&f.sev==='fix')) bump('Returned',ru,f.issue+' '+f.suggestion);
      else if(IM_RULE.mod.includes(ru)){ const s=st[ru]; if(s&&s.n>=5&&s.keep/s.n>=0.6){ why.push('(Not usually changed by IM) '+f.issue); return; } bump('Approved with Modification',ru,f.issue+' '+f.suggestion); if(ru==='template'&&!sug) sug=f.suggestion.replace(/^Start with:\s*/,''); }
      else if(IM_RULE.look.includes(ru)||f.sev==='question'){ look=true; why.push(f.issue+' '+f.suggestion); } });
    const a=AI[it]||AI[String(r.item||'')];
    if(a){ const l=String(a.likely||'').toLowerCase(); const d=/denied/.test(l)?'Denied':/returned/.test(l)?'Returned':/modif/.test(l)?'Approved with Modification':''; if(d) bump(d,rule||'ai',''); if(a.note) why.push(a.note); if(a.suggestedDefinition&&!/^\s*$/.test(a.suggestedDefinition)) sug=a.suggestedDefinition; if(a.suggestedName) sug=(sug?sug+' — ':'')+'Name: '+a.suggestedName; if(d&&!F.length) look=true; }
    const row={i,item:it,ct:r.ct||'',tt:r.tt||'',name:r.en||r.dp||r.at||r.cn||r.ac||'',pc:r.pc||'',cn:r.cn||'',dp:r.dp||'',en:r.en||'',xp:r.xp||'',def:r.def||'',old:r.old||'',
      ...Object.fromEntries([['body',r.body],['at',r.at],['alias',r.alias],['cg',r.cg],['rel',r.vp],['rf',r.rf],['rt',r.rt],['sc',r.sc]].filter(x=>x[1]).map(x=>[x[0],String(x[1]).slice(0,600)])),
      draft:{dec,com:[...new Set(why)].map(s=>rvTrim(s,260)).join(' ').slice(0,700),sug:rvTrim(sug,500),rule:rule||(dec==='Approved as Submitted'?'':'ai'),look}};
    const k=imKind(row); if(S.imauto&&S.imauto[k]&&!look) row.auto=true;
    return row; });
}
async function imCreateDraft(t,rep,P,findings,ai){
  if(!P||!P.rows||!P.rows.length) return;
  const rows=imDraftRows(P,findings,ai);
  const doc={rep:rep.id,ticket:t.id,wr:t.wr,name:t.name,at:rep.at,by:rep.by,rm:rep.rm||'',file:(rep.files||[])[0]||'',status:'draft',rows};
  S.imr[rep.id]=doc; await write(imColl(t.id),rep.id,doc);
  rep.imDraft=true; rep.imCounts=imTally(rows);
}
function imTally(rows){ const c={}; rows.forEach(r=>{ const d=(r.final&&r.final.dec)||r.draft.dec; c[d]=(c[d]||0)+1; }); return c; }

/* ---------- 2. learning ---------- */
function imRuleStats(){ const st={}; ((S.imBt&&S.imBt.draft&&S.imBt.draft.byRule)||[]).forEach(r=>{ st[r.rule]={n:r.n||0,keep:r.keep||0,agree:r.agree||0}; }); Object.values(S.iml||{}).forEach(x=>{ if(!x||!x.rule) return; const s=st[x.rule]=st[x.rule]||{n:0,keep:0,agree:0}; s.n++; if(x.final==='Approved as Submitted') s.keep++; if(x.agreed) s.agree++; }); return st; }
function imKindStats(){ const st={}; Object.values(S.iml||{}).forEach(x=>{ if(!x||!x.kind) return; const s=st[x.kind]=st[x.kind]||{n:0,agree:0}; s.n++; if(x.agreed) s.agree++; }); return st; }
function imLessons(n){ return Object.values(S.iml||{}).filter(x=>x&&!x.agreed).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,n||12)
  .map(x=>'['+x.tt+' '+rvTrim(x.name,40)+'] draft said '+x.draft+(x.draftCom?' ('+rvTrim(x.draftCom,80)+')':'')+'; IM decided '+x.final+(x.finalCom?': '+rvTrim(x.finalCom,120):'')); }

/* ---------- 3. the desk ---------- */
S.imOpen=S.imOpen||''; S.imFilter=S.imFilter||'look';
function imState(doc){ const R=doc.rows||[]; const done=R.filter(r=>r.final).length; return {n:R.length,done,look:R.filter(r=>!r.final&&(r.draft.look||r.draft.dec!=='Approved as Submitted')&&!r.auto).length}; }
VIEWS.imreview=function(){ imEnsureQ(); imCount();
  if(!imIsReviewer()) return '<div class="pagehead"><div><h1>IM Review</h1><div class="sub">For IM reviewers. Ask MISMO staff to add you under People and Roles › IM Reviewer.</div></div></div>';
  if(S.imOpen){ const q=S.imq[S.imOpen]; if(q) imEnsureR(q.ticket); const doc=S.imr[S.imOpen]; if(doc) return imDeskHtml(doc); return '<div class="pagehead"><div><h1>IM Review</h1></div></div><div class="card"><div class="lead-empty">Opening the review…</div></div>'; }
  const L=Object.values(S.imq||{}).sort((a,b)=>String(b.sentAt||b.at).localeCompare(String(a.sentAt||a.at)));

function pnlBar(){ const P=$('#panel'); if(!P) return; let bar=$('#pnlbar',P);
  if(!pnlDirty()){ if(bar) bar.remove(); return; }
  const where=[...S._dirty].map(k=>PNL_SEC[k]||k).join(' and ');
  if(bar&&$('.pnlbar-t',bar)){ $('.pnlbar-t',bar).innerHTML='<b>Unsaved changes</b> in '+esc(where); return; }
  if(!bar){ bar=document.createElement('div'); bar.id='pnlbar'; bar.className='pnlbar'; bar.setAttribute('role','status'); P.appendChild(bar); }
  bar.innerHTML='<span class="pnlbar-t"><b>Unsaved changes</b> in '+esc(where)+'</span><button type="button" class="btn sm" data-pb="discard">Discard</button><button type="button" class="btn sm pri" data-pb="save">Save Changes</button>';
  $('[data-pb=discard]',bar).onclick=()=>pnlDiscard();

async function pnlSave(){ const t0=S.tickets[S._dirtyFor||S.panel]; if(!t0) return true;
  const P=$('#panel'), t=clone(t0), before=clone(t0); let bad=false; const changed=[];
  const setK=(k,v,isDate)=>{ const parts=k.split('.'); let o=t; for(let j=0;j<parts.length-1;j++){ o[parts[j]]=o[parts[j]]||{}; o=o[parts[j]]; } const last=parts[parts.length-1];
    if((o[last]||'')!==v){ if(isDate&&k==='dates.targetIM'&&o[last]) t.targetChanges=(t.targetChanges||0)+1; o[last]=v; changed.push(k); } };

    $$('[data-k]',sec).forEach(i=>setK(i.dataset.k,i.value.trim(),false));

function pnlAsk(){ return new Promise(res=>{ const root=$('#modal-root');
  root.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="box"><header><h3>Save your changes?</h3></header><div class="bd"><p style="margin:0">You changed '+esc([...S._dirty].map(k=>PNL_SEC[k]||k).join(' and '))+' on this work request and have not saved yet.</p></div><footer><button class="btn" data-m="keep" type="button">Keep Editing</button><button class="btn danger" data-m="discard" type="button">Discard</button><button class="btn pri" data-m="save" type="button">Save</button></footer></div></div>';
  const done=v=>{ root.innerHTML=''; res(v); }; $$('[data-m]',root).forEach(b=>b.onclick=()=>done(b.dataset.m)); setTimeout(()=>{ const s=$('[data-m=save]',root); if(s) s.focus(); },30); }); }

  const eg=$('#expgo',m); if(eg) eg.onclick=async()=>{ const data=JSON.stringify({exportedAt:new Date().toISOString(),tickets:S.tickets,leaders:S.leaderSnap,process:S.process,people:S.people,notify:S.notify,media:S.media,arch:S.arch},null,1); const name='MMS Backup '+today()+'.json';
    let dl=null; try{ dl=window.claude&&await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:name,data:new Blob([data],{type:'application/json'})}); }catch(e){} return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; a.click(); };
}
function plainCode(x){ return String(x||'').replace(/^\s*\d+[a-z]?\.\s*/i,'').trim(); }
function legacyNote(t){ const ph=plainCode(t.legacy&&t.legacy.phase); return 'Brought over from the old Smartsheet MMS'+(ph?' (was at '+ph+')':''); }
/* records brought over from Smartsheet: no events dated after today, plain words, one name for the AI Review */
function tidyImported(o){ const now=new Date().toISOString(); Object.values(o||{}).forEach(t=>{ if(t&&t.workgroup&&/\bCOP\b/.test(t.workgroup)) t.workgroup=t.workgroup.replace(/\bCOP\b/g,'CoP'); if(!t||!Array.isArray(t.history)) return;
  t.history=t.history.filter(h=>!(h&&h.by==='Smartsheet'&&h.at&&h.at>now)).map(h=>{ if(!h) return h;
    if(h.text==='Submitted for editor / readiness review') return Object.assign({},h,{text:'Submitted for AI Review'});
    if(/^Brought over from the Smartsheet MMS/.test(h.text||'')) return Object.assign({},h,{text:legacyNote(t)});
    return h; }); }); return o; }
function seedHistory(t){
  const d=t.dates||{}; const ev=[['submitted','Work request submitted'],['bet','Approved by the executive team'],['cfpPublished','Call for Participation published'],['kickoffGc','Kickoff approved'],['workStart','Work started'],['aiSubmitted','Submitted for AI Review'],['imSubmitted','Submitted to IM'],['imDecision','IM decision'],['awgSubmitted','Submitted to AWG'],['awgDecision','AWG decision'],['designation','License designation'],['gcComment','Approved to go to comment'],['commentStart','Comment period opened'],['commentEnd','Comment period ended'],['postGc','Approved to publish'],['published','Published'],['closed','Closed'],['canceled','Canceled']];
  const td=today(); const h=ev.filter(([k])=>d[k]&&d[k]<=td).map(([k,txt])=>({at:d[k]+'T12:00:00.000Z',by:'Smartsheet',text:txt+(k==='targetIM'?'':'')}));
  h.sort((a,b)=>a.at.localeCompare(b.at)); h.push({at:new Date().toISOString(),by:S.me.name||'MMS',text:legacyNote(t)});
  return h;
}
async function importData(txt,over,msg){
  let arr, whole=null; try{ arr=JSON.parse(txt); if(!Array.isArray(arr)){ whole=arr; arr=arr.tickets?Object.values(arr.tickets):[]; } }catch(e){ msg.textContent='That isn’t a readable export.'; return; }
  if(whole){ for(const a of Object.values(whole.arch||{})){ if(a&&a.id&&(over||!S.arch[a.id])){ S.arch[a.id]=a; await write('arch',a.id,a); } } if(whole.leaders&&whole.leaders.list){ S.leaderSnap=whole.leaders; await write('config','leaders',whole.leaders); } if(whole.process&&whole.process.presets){ S.process=whole.process; await write('config','process',whole.process); } if(whole.people&&whole.people.roles){ S.people=whole.people; await write('config','people',whole.people); } if(whole.notify){ S.notify=whole.notify; await write('config','notify',whole.notify); } for(const m of Object.values(whole.media||{})){ if(m&&m.id){ S.media[m.id]=m; await write('media',m.id,m); } } }
  if(!arr.length){ msg.textContent='Nothing to import.'; return; }
  let n=0, skip=0; S.importing=true; msg.innerHTML='<span class="spin"></span> Importing…';
  const queue=arr.slice(); const work=async()=>{ while(queue.length){ const t=queue.shift(); if(!t||!t.id) continue; if(S.tickets[t.id]&&!over){ skip++; continue; }
    t.history=(t.history&&t.history.length)?t.history:seedHistory(t); t.stageSince=t.stageSince||stageEntered(Object.assign({},t,{stageSince:''}))||today(); t.sub=t.sub||''; t.dates=t.dates||{};
    S.tickets[t.id]=t; await write('tickets',t.id,t); n++; if(n%10===0) msg.innerHTML='<span class="spin"></span> '+n+' of '+arr.length+'…'; } };
  await Promise.all([work(),work(),work()]); S.importing=false;
  msg.textContent='Imported '+n+(skip?', skipped '+skip+' already here':'')+'.'; renderAll();
}

  const sa=$('#sentall',m); if(sa) sa.onclick=async()=>{ for(const x of Object.values(S.outbox).filter(o=>o.status==='Queued')){ const y=Object.assign({},x,{status:'Sent',sentAt:new Date().toISOString()}); S.outbox[y.id]=y; await write('outbox',y.id,y); } renderAll(); };
  const nt=$('#newtk',m); if(nt) nt.onclick=newTicket;
  const ag=$('#agenda',m); if(ag) ag.onclick=async()=>{ const L=liveTickets().filter(t=>t.state==='active'&&GOV_STAGES.includes(t.stage)); const txt=govBody()+' agenda items, '+fmt(today())+'\n\n'+L.map(t=>'• '+t.wr+' '+t.name+' ('+t.workgroup+'): '+stageDef(t.stage).name+(t.classification?' · '+t.classification:'')).join('\n'); try{ await navigator.clipboard.writeText(txt); toast('Agenda copied'); }catch(e){ modal({title:'Agenda',body:'<textarea rows="10" style="width:100%">'+esc(txt)+'</textarea>',ok:'Done'}); } };
  $$('[data-state]',m).forEach(b=>b.onclick=()=>{ S.filters.state=b.dataset.state; renderAll(); });
  $$('th[data-sort]',m).forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; if(S.filters.sort===k) S.filters.dir*=-1; else { S.filters.sort=k; S.filters.dir=1; } renderAll(); });
  const fq=$('#fq',m); if(fq){ fq.oninput=()=>{ S.filters.q=fq.value; clearTimeout(fq._t); fq._t=setTimeout(()=>{ renderAll(); const n=$('#fq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); }; }
  [['#ffac','fac'],['#fwg','wg'],['#fsize','size'],['#ftype','type']].forEach(([id,k])=>{ const s=$(id,m); if(s) s.onchange=()=>{ S.filters[k]=s.value; renderAll(); }; });
  const fc=$('#fclear',m); if(fc) fc.onclick=()=>{ Object.assign(S.filters,{q:'',fac:'',wg:'',size:'',type:''}); renderAll(); };
  const bd=$('#board',m);
  if(bd && S.canWrite && S.isStaff){
    let dragId=null;
    $$('[data-drag]',bd).forEach(c=>{ c.addEventListener('dragstart',e=>{ dragId=c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragId); }catch(x){} }); c.addEventListener('dragend',()=>{ c.classList.remove('dragging'); $$('.bcol',bd).forEach(x=>x.classList.remove('drop')); }); });
    $$('.bcol',bd).forEach(col=>{ col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drop'); }); col.addEventListener('dragleave',e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop',async e=>{ e.preventDefault(); col.classList.remove('drop'); const t=S.tickets[dragId]; const to=col.dataset.col; if(!t||t.stage===to) return; await move(t,to,{text:'Moved on the board from '+stageDef(t.stage).name+' to '+stageDef(to).name}); }); });
  }
  if(S.view==='settings') wireSettings(m);
  if(S.view==='home') homeLive(m);
  wireArch(m);
  $$('[data-mform]',m).forEach(b=>b.onclick=async()=>{ const x=S.media[b.dataset.mform]; if(x){ try{ await navigator.clipboard.writeText(x.kind+' for '+x.wr+' '+x.name+'\n\n'+x.text); toast('Request copied: paste it into the MISMO Media form'); }catch(e){} } window.open('https://resources.mismo.org/forms/request/','_blank','noopener'); });
}

/* ---------- rail: collapse, remember, search (Summit HQ pattern) ---------- */
(function(){
  const KEY='hq.rail.off';
  function set(off,remember){ document.body.classList.toggle('railmini',!!off); const h=$('#rail-hide'); if(h){ h.setAttribute('aria-expanded',off?'false':'true'); h.setAttribute('aria-label',off?'Open the menu':'Narrow the menu'); h.title=(off?'Open the menu':'Narrow the menu')+' (backslash)'; } if(off) close(); if(remember!==false){ try{ localStorage.setItem(KEY,off?'1':'0'); }catch(e){} } }
  function toggle(){ set(!document.body.classList.contains('railmini')); }
  function start(){
    let off=null; try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off=window.matchMedia('(max-width:900px)').matches; set(off,false);
    $('#rail-hide').addEventListener('click',toggle); $('#rail-scrim').addEventListener('click',()=>set(true));
    $('#rail-qb').addEventListener('click',()=>{ set(false); setTimeout(()=>$('#rail-q').focus(),230); });
    $$('.hq nav button[data-hq]').forEach(b=>b.addEventListener('click',()=>{ if(['imreview','awgreview'].includes(b.dataset.hq)) return; /* they open their own tab and leave the MMS on the Overview */ go(b.dataset.hq); if(window.matchMedia('(max-width:900px)').matches) set(true); }));
    wireFind();
  }
  document.addEventListener('keydown',e=>{ const t=e.target; const typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(e.key==='\\'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); set(false); setTimeout(()=>{ const q=$('#rail-q'); q.focus(); q.select(); },230); }
    if(e.key==='Escape'&&S.panel&&!$('#modal-root').innerHTML) closePanel(); });
  let picked=-1, rows=[];
  const norm=x=>String(x||'').replace(/\s+/g,' ').trim().toLowerCase();
  function gather(q){ const t=norm(q); if(t.length<2) return []; const out=[];
    const score=n=>{ n=norm(n); return n===t?3:n.indexOf(t)===0?2:n.indexOf(t)>=0?1:0; };
    try{ allTickets().forEach(x=>{ const s=Math.max(score(x.name),score(x.wr),score(x.product)); if(!s) return; out.push({group:x.state==='active'||x.state==='hold'?'Live Work':'Earlier Work',name:x.wr+' '+x.name,where:[stageDef(x.stage).name,x.facilitator,x.workgroup].filter(Boolean).join(' · '),s,go:()=>openPanel(x.id)}); }); }catch(e){}
    try{ [...new Set(allTickets().map(x=>x.workgroup).filter(Boolean))].forEach(w=>{ const s=score(w); if(s) out.push({group:'Workgroups',name:w,where:liveTickets().filter(x=>x.workgroup===w).length+' live',s,go:()=>{ S.filters.wg=w; go('board'); }}); }); }catch(e){}
    try{ (S.people.facilitators||[]).forEach(p=>{ const s=score(p.name); if(s) out.push({group:'Facilitators',name:p.name,where:liveTickets().filter(x=>x.facilitator===p.name).length+' live',s,go:()=>{ S.filters.fac=p.name; go('board'); }}); }); }catch(e){}
    const ORDER=['Live Work','Workgroups','Facilitators','Earlier Work']; const best={}; out.forEach(h=>best[h.group]=Math.max(best[h.group]||0,h.s));
    out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))||(b.s-a.s)||a.name.localeCompare(b.name)); return out; }
  function draw(list){ const box=$('#rail-hits'); box.textContent=''; rows=[]; picked=-1;
    if(!list.length){ const n=document.createElement('div'); n.className='rh-none'; n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return; }
    let g=null; list.slice(0,24).forEach(h=>{ if(h.group!==g){ g=h.group; const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh'; const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm); if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); }); rows.push(b); box.appendChild(b); }); box.hidden=false; }
  function close(){ const b=$('#rail-hits'); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on',i===picked)); if(rows[picked]) rows[picked].scrollIntoView({block:'nearest'}); }
  function wireFind(){ const q=$('#rail-q'), x=$('#rail-qx'); let tmr=null;
    const run=()=>{ const v=q.value; x.hidden=!v; if(norm(v).length<2){ close(); return; } draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); }); q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{ if(e.key==='Escape'){ close(); q.blur(); return; } if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); } else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); } else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); } });
    x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.railfind')) close(); }); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
(function theme(){
  const btn=$('#theme-btn');
  const cur=()=>document.documentElement.getAttribute('data-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const paint=()=>{ const dark=cur()==='dark'; $('#theme-lab').textContent=dark?'Light Mode':'Dark Mode'; btn.title='Switch to '+(dark?'light':'dark')+' mode'; };
  btn.addEventListener('click',()=>{ document.documentElement.setAttribute('data-theme',cur()==='dark'?'light':'dark'); paint(); try{ localStorage.setItem('mismo.portal.theme',cur()); }catch(e){} });

/* ---------- start ---------- */
async function boot(){
  $('#toast-undo').onclick=doUndo; $('#scrim').onclick=closePanel;
  const h=(location.hash||'').slice(1); if(VIEWS[h]) S.view=h;
  const ok=await Store.init();
  try{ const u=window.claude&&await window.claude.use('user'); if(u){ const m=await u.me(); S.me={name:(m&&(m.name||m.displayName))||'',email:(m&&m.email)||''}; try{ const c=await u.can('data.write'); S.canWrite=c!==false; }catch(e){} try{ S.isOwnerish=await u.canEdit(); }catch(e){} } }catch(e){}
  try{ const rs=window.ResourcesSession&&window.ResourcesSession.current(); if(rs){ S.me.name=S.me.name||rs.name||''; S.me.email=S.me.email||rs.email||''; S.relayRole=window.ResourcesSession.role&&window.ResourcesSession.role('mms'); if(S.relayRole==='view') S.canWrite=false; } }catch(e){}
  if(!ok && window.__mmsSeed){ const sd=window.__mmsSeed; Store.mem={tickets:sd.tickets||{},config:{},outbox:sd.outbox||{},media:sd.media||{},arch:sd.arch||{}}; if(sd.me) S.me=sd.me; }
  try{ S.sample=window.claude&&await window.claude.use('sample'); }catch(e){ S.sample=null; }
  const done=()=>{ if(S.loaded.tickets&&S.loaded.config&&!S.ready){ S.ready=true; computeRole(); setupViewAs(); if(!location.hash&&!S.isStaff&&(S.people.facilitators||[]).some(f=>sameName(f.name,S.me.name))) S.view='mine'; go(S.view); runAutomations(); setInterval(runAutomations,5*60000); hubSync(); setInterval(hubSync,5*60000); electionsSync(); } else if(S.ready){ computeRole(); renderAll(); } };
  const timer=setTimeout(()=>{ if(!S.ready){ S.loaded.tickets=S.loaded.config=true; done(); toast('The MMS records are taking a while to load; what shows may be out of date.'); } },12000);
  Store.sub('tickets',o=>{ S.tickets=tidyImported(o); S.loaded.tickets=true; clearTimeout(timer); done(); });
  Store.sub('config',o=>{ if(o.process&&o.process.presets){ S.process=o.process; Object.values(o.process.presets).forEach(pr=>(pr.stages||[]).forEach(s=>{ if(/^(gc-comment|gc-publish)$/.test(s.key)&&/^\S+ Approval to (Comment|Publish)$/.test(s.name||'')) s.name=s.name.replace(/^\S+ /,'Governance '); })); } if(o.people&&o.people.roles) S.people=o.people; if(o.notify) S.notify=Object.assign(clone(DEFAULT_NOTIFY),o.notify); if(o.leaders&&o.leaders.list&&(!S.leaderSnap||(o.leaders.at||'')>=(S.leaderSnap.at||''))) S.leaderSnap=o.leaders; if(o.digest) S.digestCfg=o.digest; if(o.digestLog) S.digestLog=o.digestLog; if(o.feed) S.feedState=o.feed; S.cfgDocs=o; S.loaded.config=true; done(); });
  Store.sub('cstatus',o=>{ S.cstat=o||{}; if(S.ready&&(S.view==='comment'||S.panel)) renderAll(); });
  Store.sub('outbox',o=>{ S.outbox=o; if(S.ready) counts(); if(S.ready&&S.view==='outbox') renderAll(); });
  Store.sub('arch',o=>{ S.arch=o; if(S.ready){ counts(); if(['arch','mine','home'].includes(S.view)) renderAll(); } });
  Store.sub('media',o=>{ S.media=o; if(S.ready) counts(); if(S.ready&&S.view==='media') renderAll(); });
  renderWho();
}
function computeRole(){
  const nm=(S.me.name||'').toLowerCase(), em=(S.me.email||'').toLowerCase();
  const inList=l=>(l||[]).some(p=>sameName(p.name,nm)||(em&&(p.email||'').toLowerCase()===em));
  S.isStaff=!!(S.isOwnerish||S.relayRole==='admin'||inList(S.people.roles&&S.people.roles.staff)||S.mode==='memory');
}
function setupViewAs(){
  const w=$('#viewas-wrap'); if(!S.isStaff){ w.hidden=true; return; } w.hidden=false;
  const ppl=[...new Map([...(S.people.facilitators||[]),...Object.values(S.people.roles||{}).flat()].map(p=>[p.name,p])).values()].sort((a,b)=>a.name.localeCompare(b.name));
  const s=$('#viewas'); s.innerHTML='<option value="">Myself'+(S.me.name?' ('+esc(S.me.name.split(' ')[0])+')':'')+'</option>'+ppl.filter(p=>p.name!==S.me.name).map(p=>'<option>'+esc(p.name)+'</option>').join('');
  s.onchange=()=>{ S.viewAs=s.value; renderAll(); };
}
function renderWho(){
  const w=$('#who-chip'); if(window.ResourcesSession||!S.me.name){ w.innerHTML=''; return; }
  const full=(personByName(S.me.name)||{}).name||S.me.name;
  const ini=full.split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();
  w.innerHTML='<span class="whochip" title="'+esc(full)+'"><span class="av">'+esc(ini)+'</span><span class="fn">'+esc(full.split(' ')[0])+'</span><span class="cv">\u25be</span></span>';
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
