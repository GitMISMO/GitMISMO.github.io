/* ---------------- Comment Periods ---------------- */
VIEWS.comment=function(){
  const td=today(), lk=(S.lens||{}).cp||'';
  const open=allTickets().filter(t=>t.stage==='comment'&&t.state==='active'&&t.sub!=='setup'&&t.dates&&t.dates.commentStart&&t.dates.commentEnd).sort((a,b)=>a.dates.commentEnd.localeCompare(b.dates.commentEnd));
  const closed=allTickets().filter(t=>!open.includes(t)&&t.dates&&t.dates.commentStart&&t.dates.commentEnd&&t.dates.commentEnd<td&&daysBetween(t.dates.commentEnd,td)<=45).sort((a,b)=>b.dates.commentEnd.localeCompare(a.dates.commentEnd));
  const setup=liveTickets().filter(t=>t.stage==='comment'&&t.sub==='setup');
  const soon=open.filter(t=>daysBetween(td,t.dates.commentEnd)<=7), next=open[0];
  const figs=lens('cp',[{key:'open',k:'Open Now',v:open.length,s:next?'Next closes '+fmtS(next.dates.commentEnd):'None open',c:'var(--c6)'},{key:'soon',k:'Closing in 7 Days',v:soon.length,s:'Facilitators asked the day after',c:'var(--c4)',cls:soon.length?'warnf':''},{key:'setup',k:'Not Posted Yet',v:setup.length,s:'Approved for comment',c:'var(--warn)'},{key:'closed',k:'Closed, Last 45 Days',v:closed.length,s:'Now in Post-Comment or later',c:'var(--ink-3)'}]);
  const head='<div class="pagehead slim"><div><h1>Comment Periods</h1><div class="sub">What’s open for comment, what just closed, and what’s approved but not posted yet. Click a figure to narrow the view.</div></div></div>'+figs;
  const sdp=pageOf('cp-side',setup,fitN(480,190,2));
  const side=setup.length?'<section class="pane cp-side"><header><h3>Approved, Not Posted Yet</h3><span class="chip warn">'+setup.length+'</span></header><div class="pane-b">'+sdp.items.map((t,i)=>card2(t,{next:true,act:true,i})).join('')+'</div>'+sdp.bar+'</section>':'';
  if(lk==='setup') return head+(side||'<div class="empty">Everything approved for comment is posted.</div>');
  let rows=lk==='open'?open:lk==='soon'?soon:lk==='closed'?closed:[...open,...closed];
  if(!rows.length) return head+'<div class="cp-wrap'+(side?' has-side':'')+'"><div class="empty">No comment periods match.</div>'+side+'</div>';
  const lo=addDays([td,...rows.map(t=>t.dates.commentStart)].sort()[0],-3), hi=addDays([addDays(td,14),...rows.map(t=>t.dates.commentEnd)].sort().slice(-1)[0],3);
  const span=Math.max(1,daysBetween(lo,hi)), X=d=>Math.max(0,Math.min(100,daysBetween(lo,d)/span*100));
  const ticks=[]; { const d=toD(lo); d.setDate(1); d.setMonth(d.getMonth()+1); while(ymd(d)<=hi){ ticks.push(ymd(d)); d.setMonth(d.getMonth()+1); } }
  const axis='<div class="cp-axis"><div></div><div class="cp-scale">'+ticks.filter(m=>Math.abs(X(m)-X(td))>5).map(m=>'<span style="left:'+X(m)+'%">'+MON[toD(m).getMonth()]+'</span>').join('')+'<span class="cp-today" style="left:'+X(td)+'%">Today</span></div></div>';
  const row=t=>{ const d=t.dates, isOpen=open.includes(t), l=X(d.commentStart), w=Math.max(1.2,X(d.commentEnd)-l), n=daysBetween(td,d.commentEnd), right=l+w<78, pct=isOpen?Math.max(0,Math.min(100,daysBetween(d.commentStart,td)/Math.max(1,daysBetween(d.commentStart,d.commentEnd))*100)):100;
    return '<div class="cp-row" data-open="'+esc(t.id)+'"><div class="cp-name">'+av(t.facilitator,'xs')+'<span><b>'+esc(cpName(t))+'</b><span>'+esc(t.wr)+' · '+esc(t.facilitator||'')+'</span></span></div><div class="cp-track">'+ticks.map(m=>'<i class="cp-grid" style="left:'+X(m)+'%"></i>').join('')+'<i class="cp-now" style="left:'+X(td)+'%"></i><div class="cp-bar '+(isOpen?'open':'closed')+(isOpen&&n<=7?' soon':'')+'" style="left:'+l+'%;width:'+w+'%"><span class="cp-fill" style="width:'+pct+'%"></span></div><span class="cp-lab '+(right?'r':'l')+'" style="'+(right?'left:calc('+(l+w)+'% + 8px)':'right:calc('+(100-l)+'% + 8px)')+'">'+(isOpen?'<b>'+(n<=0?'Closes today':n+' day'+(n===1?'':'s')+' left')+'</b> · ':'')+esc(fmtS(d.commentStart))+' to '+esc(fmtS(d.commentEnd))+'</span></div></div>'; };
  const cpp=pageOf('cp-rows:'+lk,rows,fitN(500,50,5)), vis=cpp.items;
  const o2=vis.filter(t=>open.includes(t)), c2=vis.filter(t=>!open.includes(t));
  return head+'<div class="cp-wrap'+(side?' has-side':'')+'"><div class="card cp"><h3>Comment Period Timeline<span class="sp cp-key"><span><i class="open"></i>Open now</span><span><i class="closed"></i>Closed in the last 45 days</span><span><i class="now"></i>Today</span></span></h3>'+axis+'<div class="cp-scroll">'+
    (o2.length?'<div class="cp-grp">Open Now</div>'+o2.map(row).join(''):'')+(c2.length?'<div class="cp-grp">Recently Closed</div>'+c2.map(row).join(''):'')+'</div>'+cpp.bar+'</div>'+side+'</div>';
};

    const step=now=>{ const p=Math.min(1,(now-t0)/dur); el.textContent=Math.round(end*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); }; el.textContent='0'; requestAnimationFrame(step); });
}

const MT_KEY=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function mtHash8(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return ('0000000'+h.toString(36)).slice(-8); }
function mtSafe(s){ return String(s).toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/-{3,}/g,'--').replace(/^-+|-+$/g,'')||'x'; }
function mtFile(s){ s=mtSafe(s); return s.length<=40?s:s.slice(0,31).replace(/-+$/,'')+'-'+mtHash8(s); }
async function gunzipB64(b64){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); }

async function loadDigestSources(force){

  try{
    const base=await rGet('meeting-trackers','baseline'); const B=base&&base.data&&base.data.doc&&base.data.doc.z?await gunzipB64(base.data.doc.z):null;

    const sd=await rGet('meeting-trackers','sched'); Object.entries(((sd&&sd.data.docs['sched/all'])||{}).items||{}).forEach(([k,v])=>{ sched[k]=v.removed?{removed:true}:Object.assign({},sched[k]||{},v); });
    const gd=await rGet('meeting-trackers','groups'); Object.entries(((gd&&gd.data.docs['groups/all'])||{}).items||{}).forEach(([k,v])=>{ groups[k]=Object.assign({},groups[k]||{},v); });

    const G={}; Object.entries(sched).forEach(([k,v])=>{ const g=groups[k]||{}; G[k]={name:g.name||v.sheetName||k,fac:v.fac||g.facilitator||'',rule:v.rule,en:v.en,removed:!!v.removed,hold:!!g.hold,archived:!!g.archived}; });
    out.mt={groups:G,logged};
  }catch(e){ out.note.push('Meeting Trackers could not be read just now.'); }
  try{
    const V=['actualize','falcon','phoenix','trex','trudigital','vianteye'], y=new Date().getFullYear(), fys=['fy'+(y+1),'fy'+y];
    const known=(S.digestCfg&&S.digestCfg.hoursVendor)||{};
    await Promise.all((S.people.facilitators||[]).map(async p=>{ const slug=String(p.name).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      const order=known[p.name]?[known[p.name]].concat(V.filter(v=>v!==known[p.name])):V;
      for(const v of order){ for(const fy of fys){ const f=await rFile('so-'+v,'hours/'+slug+'-'+fy+'.json'); if(f&&f.weeks){ out.hours[p.name]=f; known[p.name]=v; return; } } } }));

  digestSrc=out; digestSrcAt=Date.now(); return out;
}

async function publishFeed(force){

  const doc=webFeed(), s0=JSON.stringify(doc.commentPeriods)+JSON.stringify(doc.recent), sig=mtHash8(s0)+s0.length; const st=S.feedState||{};

let mtLite=null, mtLiteAt=0, mtLoading=false;
async function loadMtLite(){
  if(S.mode!=='relay'||mtLoading) return;
  if(Date.now()-mtLiteAt<(mtLite&&Object.keys(mtLite).length?15*60000:60000)) return;
  mtLoading=true;
  try{
    const groups={}, sched={};
    const base=await rGet('meeting-trackers','baseline'); const B=base&&base.data&&base.data.doc&&base.data.doc.z?await gunzipB64(base.data.doc.z):null;
    if(B){ const gks=B.groups.map(x=>MT_KEY(x[0])); B.groups.forEach((x,i)=>{ groups[gks[i]]={name:x[0],archived:!!x[2],facilitator:x[3]||''}; }); Object.assign(sched,B.sched||{}); }
    const sd=await rGet('meeting-trackers','sched'); Object.entries(((sd&&sd.data.docs['sched/all'])||{}).items||{}).forEach(([k,v])=>{ sched[k]=v.removed?{removed:true}:Object.assign({},sched[k]||{},v); });
    const gd=await rGet('meeting-trackers','groups'); Object.entries(((gd&&gd.data.docs['groups/all'])||{}).items||{}).forEach(([k,v])=>{ groups[k]=Object.assign({},groups[k]||{},v); });
    const G={}; Object.entries(sched).forEach(([k,v])=>{ const g=groups[k]||{}; G[k]={key:k,name:g.name||v.sheetName||k,rule:v.rule,st:v.st||v.start||'',en:v.en||'',time:v.time||'',zoom:v.zoom||'',off:!!(v.removed||g.hold||g.archived||/inactive|paused|hold/i.test(v.status||''))}; });
    mtLite=G; // empty means sign-in wasn't ready yet: the check above tries again after a minute
  }catch(e){ mtLite=mtLite||{}; }
  mtLiteAt=Date.now(); mtLoading=false; if(Object.keys(mtLite||{}).length&&S.panel&&!String(S.panel).startsWith('arch:')) renderPanel();
}
function etYmd(off){ const n=new Date(Date.now()+(off||0)*864e5); return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(n); }
function meetsOnRule(rule,ymd){ if(!rule) return false; const d=new Date(ymd+'T12:00:00Z'); if(rule.dow!==d.getUTCDay()) return false; if(rule.weeks==='*') return true; return (rule.weeks||[]).includes(Math.floor((d.getUTCDate()-1)/7)+1); }
// Meeting Trackers and the MMS don't always spell a workgroup the same way
// ("VA Docs to Data DWG" vs "VA Documents to Data DWG"), so match on the words.
const MT_STOP=new Set(['the','and','of','to','for','a','an','in','on','cop','dwg','workgroup','community','practice','development','task','force','group','wg']);
function mtWords(s){ return String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/&/g,' and ').split(/[^a-z0-9]+/).filter(w=>w&&!MT_STOP.has(w)).map(w=>w.slice(0,3)); }
function mtGroupFor(t){
  if(!mtLite||!t.workgroup) return null;
  const L=Object.values(mtLite).filter(x=>x.rule&&!x.off); const mk=MT_KEY(t.workgroup), k=gnorm(t.workgroup);
  const exact=L.find(x=>x.key===mk||gnorm(x.name)===k||gnorm(x.key)===k); if(exact) return exact;
  const A=new Set(mtWords(t.workgroup)); if(!A.size) return null;
  let best=null, bs=0;
  L.forEach(x=>{ const B=new Set(mtWords(x.name)); if(!B.size) return; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); let sc=n/(A.size+B.size-n); if(sc>bs){ bs=sc; best=x; } });
  return bs>=.75?best:null;
}
function nextMeeting(t){
  const g=mtGroupFor(t); if(!g) return null;
  const nowMin=(()=>{ const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()); const v=k=>+(p.find(x=>x.type===k)||{}).value||0; return v('hour')*60+v('minute'); })();
  const endMin=(m=>m?(+m[1])*60+(+m[2]):17*60)(String(g.en||'').match(/^(\d{1,2}):(\d{2})/));
  for(let i=0;i<75;i++){ const d=etYmd(i); if(i===0&&nowMin>=endMin) continue; if(meetsOnRule(g.rule,d)) return {date:d,name:/^[a-z0-9]+$/.test(g.name)?t.workgroup:g.name,st:g.st,en:g.en,time:g.time,zoom:g.zoom}; }
  return null;
}

function wrTimeline(t){
  const d=t.dates||{}, td=today();
  const ev=[

    ['imSubmitted','Submitted to IM','ring'],['commentStart','Comment Opens','dia'],['commentEnd','Comment Ends','dia2'],['published','Published','fin']
  ].filter(([k])=>d[k]).map(([k,l,c])=>({k,l,c,d:d[k]}));
  const tgt=d.targetIM&&!d.imSubmitted?d.targetIM:null;
  if(!ev.length&&!tgt) return '';
  const all=[...ev.map(e=>e.d),tgt,td].filter(Boolean).sort();
  const lo=addDays(all[0],-30), hi=addDays(all[all.length-1],45), span=Math.max(1,daysBetween(lo,hi));
  const X=x=>Math.max(0,Math.min(100,daysBetween(lo,x)/span*100));

  return h;
}
async function importData(txt,over,msg){
  let arr, whole=null; try{ arr=JSON.parse(txt); if(!Array.isArray(arr)){ whole=arr; arr=arr.tickets?Object.values(arr.tickets):[]; } }catch(e){ msg.textContent='That isn’t a readable export.'; return; }
  if(whole){ for(const a of Object.values(whole.arch||{})){ if(a&&a.id&&(over||!S.arch[a.id])){ S.arch[a.id]=a; await write('arch',a.id,a); } } if(whole.leaders&&whole.leaders.list){ S.leaderSnap=whole.leaders; await write('config','leaders',whole.leaders); } if(whole.process&&whole.process.presets){ S.process=whole.process; await write('config','process',whole.process); } if(whole.people&&whole.people.roles){ S.people=whole.people; await write('config','people',whole.people); } if(whole.notify){ S.notify=whole.notify; await write('config','notify',whole.notify); } for(const m of Object.values(whole.media||{})){ if(m&&m.id){ S.media[m.id]=m; await write('media',m.id,m); } } }
  if(!arr.length){ msg.textContent='Nothing to import.'; return; }
  let n=0, skip=0; S.importing=true; msg.innerHTML='<span class="spin"></span> Importing…';
  const queue=arr.slice(); const work=async()=>{ while(queue.length){ const t=queue.shift(); if(!t||!t.id) continue; if(S.tickets[t.id]&&!over){ skip++; continue; }
    t.history=(t.history&&t.history.length)?t.history:seedHistory(t); t.stageSince=t.stageSince||(t.dates&&(t.dates.imSubmitted||t.dates.workStart))||t.importedAt||today(); t.sub=t.sub||''; t.dates=t.dates||{};
    S.tickets[t.id]=t; await write('tickets',t.id,t); n++; if(n%10===0) msg.innerHTML='<span class="spin"></span> '+n+' of '+arr.length+'…'; } };
  await Promise.all([work(),work(),work()]); S.importing=false;
  msg.textContent='Imported '+n+(skip?', skipped '+skip+' already here':'')+'.'; renderAll();
}

/* ---------- wiring the page ---------- */
function wireMain(m){
  $$('[data-open]',m).forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('[data-decide],[data-media],a')) return; openPanel(el.dataset.open); }));
  $$('[data-go]',m).forEach(b=>b.onclick=()=>{ const g=b.dataset.go; if(g==='late'){ S.filters.state='live'; go('all'); S.filters.sort='target'; S.filters.dir=1; renderAll(); return; } if(g==='hold'){ S.filters.state='hold'; go('all'); return; } if(g==='hub'){ window.open('https://resources.mismo.org/initiative-hub/work-requests.html#all','_blank','noopener'); return; } go(g); });
  $$('[data-stage]',m).forEach(b=>b.onclick=()=>{ go('board'); setTimeout(()=>{ const c=$('[data-col="'+b.dataset.stage+'"]'); if(c) c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); },50); });
  $$('[data-fac]',m).forEach(b=>b.onclick=()=>{ S.filters.fac=b.dataset.fac==='Unassigned'?'':b.dataset.fac; go('board'); });
  $$('[data-decide]',m).forEach(b=>b.onclick=()=>decideFromList(b.dataset.decide));
  $$('[data-media]',m).forEach(b=>b.onclick=()=>mediaUpdate(b.dataset.media));
  $$('[data-sent]',m).forEach(b=>b.onclick=async()=>{ const x=Object.assign({},S.outbox[b.dataset.sent],{status:'Sent',sentAt:new Date().toISOString()}); S.outbox[x.id]=x; await write('outbox',x.id,x); renderAll(); });
  const sa=$('#sentall',m); if(sa) sa.onclick=async()=>{ for(const x of Object.values(S.outbox).filter(o=>o.status==='Queued')){ const y=Object.assign({},x,{status:'Sent',sentAt:new Date().toISOString()}); S.outbox[y.id]=y; await write('outbox',y.id,y); } renderAll(); };
  const nt=$('#newtk',m); if(nt) nt.onclick=newTicket;
  const ag=$('#agenda',m); if(ag) ag.onclick=()=>{ const L=liveTickets().filter(t=>t.state==='active'&&GOV_STAGES.includes(t.stage)); const txt=govName()+' agenda items, '+fmt(today())+'\n\n'+L.map(t=>'• '+t.wr+' '+t.name+' ('+t.workgroup+'): '+stageDef(t.stage).name+(t.classification?' · '+t.classification:'')).join('\n'); try{ navigator.clipboard.writeText(txt); toast('Agenda copied'); }catch(e){ modal({title:'Agenda',body:'<textarea rows="10" style="width:100%">'+esc(txt)+'</textarea>',ok:'Done'}); } };
  $$('[data-state]',m).forEach(b=>b.onclick=()=>{ S.filters.state=b.dataset.state; renderAll(); });
  $$('th[data-sort]',m).forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; if(S.filters.sort===k) S.filters.dir*=-1; else { S.filters.sort=k; S.filters.dir=1; } renderAll(); });
  const fq=$('#fq',m); if(fq){ fq.oninput=()=>{ S.filters.q=fq.value; clearTimeout(fq._t); fq._t=setTimeout(()=>{ renderAll(); const n=$('#fq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); }; }
  [['#ffac','fac'],['#fwg','wg'],['#fsize','size'],['#ftype','type']].forEach(([id,k])=>{ const s=$(id,m); if(s) s.onchange=()=>{ S.filters[k]=s.value; renderAll(); }; });
  const fc=$('#fclear',m); if(fc) fc.onclick=()=>{ Object.assign(S.filters,{q:'',fac:'',wg:'',size:'',type:''}); renderAll(); };
  const bd=$('#board',m);
  if(bd && S.canWrite && S.isStaff){
    let dragId=null;
    $$('[data-drag]',bd).forEach(c=>{ c.addEventListener('dragstart',e=>{ dragId=c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragId); }catch(x){} }); c.addEventListener('dragend',()=>{ c.classList.remove('dragging'); $$('.bcol',bd).forEach(x=>x.classList.remove('drop')); }); });
    $$('.bcol',bd).forEach(col=>{ col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drop'); }); col.addEventListener('dragleave',e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop',async e=>{ e.preventDefault(); col.classList.remove('drop'); const t=S.tickets[dragId]; const to=col.dataset.col; if(!t||t.stage===to) return; await move(t,to,{text:'Moved on the board from '+stageDef(t.stage).name+' to '+stageDef(to).name}); }); });
  }
  if(S.view==='settings') wireSettings(m);
  if(S.view==='home') homeLive(m);
  wireArch(m);
  $$('[data-mform]',m).forEach(b=>b.onclick=async()=>{ const x=S.media[b.dataset.mform]; if(x){ try{ await navigator.clipboard.writeText(x.kind+' for '+x.wr+' '+x.name+'\n\n'+x.text); toast('Request copied: paste it into the MISMO Media form'); }catch(e){} } window.open('https://resources.mismo.org/forms/request/','_blank','noopener'); });
}

/* ---------- rail: collapse, remember, search (Summit HQ pattern) ---------- */
(function(){
  const KEY='hq.rail.off';
  function set(off,remember){ document.body.classList.toggle('railmini',!!off); const h=$('#rail-hide'); if(h){ h.setAttribute('aria-expanded',off?'false':'true'); h.setAttribute('aria-label',off?'Open the menu':'Narrow the menu'); h.title=(off?'Open the menu':'Narrow the menu')+' (backslash)'; } if(off) close(); if(remember!==false){ try{ localStorage.setItem(KEY,off?'1':'0'); }catch(e){} } }
  function toggle(){ set(!document.body.classList.contains('railmini')); }
  function start(){
    let off=null; try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off=window.matchMedia('(max-width:900px)').matches; set(off,false);
    $('#rail-hide').addEventListener('click',toggle); $('#rail-scrim').addEventListener('click',()=>set(true));
    $('#rail-qb').addEventListener('click',()=>{ set(false); setTimeout(()=>$('#rail-q').focus(),230); });
    $$('.hq nav button[data-hq]').forEach(b=>b.addEventListener('click',()=>{ go(b.dataset.hq); if(window.matchMedia('(max-width:900px)').matches) set(true); }));
    wireFind();
  }
  document.addEventListener('keydown',e=>{ const t=e.target; const typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(e.key==='\\'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); set(false); setTimeout(()=>{ const q=$('#rail-q'); q.focus(); q.select(); },230); }
    if(e.key==='Escape'&&S.panel&&!$('#modal-root').innerHTML) closePanel(); });
  let picked=-1, rows=[];
  const norm=x=>String(x||'').replace(/\s+/g,' ').trim().toLowerCase();
  function gather(q){ const t=norm(q); if(t.length<2) return []; const out=[];
    const score=n=>{ n=norm(n); return n===t?3:n.indexOf(t)===0?2:n.indexOf(t)>=0?1:0; };
    try{ allTickets().forEach(x=>{ const s=Math.max(score(x.name),score(x.wr),score(x.product)); if(!s) return; out.push({group:x.state==='active'||x.state==='hold'?'Live Work':'Earlier Work',name:x.wr+' '+x.name,where:[stageDef(x.stage).name,x.facilitator,x.workgroup].filter(Boolean).join(' · '),s,go:()=>openPanel(x.id)}); }); }catch(e){}
    try{ [...new Set(allTickets().map(x=>x.workgroup).filter(Boolean))].forEach(w=>{ const s=score(w); if(s) out.push({group:'Workgroups',name:w,where:liveTickets().filter(x=>x.workgroup===w).length+' live',s,go:()=>{ S.filters.wg=w; go('board'); }}); }); }catch(e){}
    try{ (S.people.facilitators||[]).forEach(p=>{ const s=score(p.name); if(s) out.push({group:'Facilitators',name:p.name,where:liveTickets().filter(x=>x.facilitator===p.name).length+' live',s,go:()=>{ S.filters.fac=p.name; go('board'); }}); }); }catch(e){}
    const ORDER=['Live Work','Workgroups','Facilitators','Earlier Work']; const best={}; out.forEach(h=>best[h.group]=Math.max(best[h.group]||0,h.s));
    out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))||(b.s-a.s)||a.name.localeCompare(b.name)); return out; }
  function draw(list){ const box=$('#rail-hits'); box.textContent=''; rows=[]; picked=-1;
    if(!list.length){ const n=document.createElement('div'); n.className='rh-none'; n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return; }
    let g=null; list.slice(0,24).forEach(h=>{ if(h.group!==g){ g=h.group; const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh'; const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm); if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); }); rows.push(b); box.appendChild(b); }); box.hidden=false; }
  function close(){ const b=$('#rail-hits'); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on',i===picked)); if(rows[picked]) rows[picked].scrollIntoView({block:'nearest'}); }
  function wireFind(){ const q=$('#rail-q'), x=$('#rail-qx'); let tmr=null;
    const run=()=>{ const v=q.value; x.hidden=!v; if(norm(v).length<2){ close(); return; } draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); }); q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{ if(e.key==='Escape'){ close(); q.blur(); return; } if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); } else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); } else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); } });
    x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.railfind')) close(); }); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
(function theme(){
  const btn=$('#theme-btn');
  const cur=()=>document.documentElement.getAttribute('data-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const paint=()=>{ const dark=cur()==='dark'; $('#theme-lab').textContent=dark?'Light Mode':'Dark Mode'; btn.title='Switch to '+(dark?'light':'dark')+' mode'; };
  btn.addEventListener('click',()=>{ document.documentElement.setAttribute('data-theme',cur()==='dark'?'light':'dark'); paint(); try{ localStorage.setItem('mismo.portal.theme',cur()); }catch(e){} });
  try{ const s=localStorage.getItem('mismo.portal.theme'); if(s) document.documentElement.setAttribute('data-theme',s); }catch(e){}
  paint();
  if(new Date().getMonth()===11) document.documentElement.setAttribute('data-season','december');
})();

/* ---------- start ---------- */
async function boot(){
  $('#toast-undo').onclick=doUndo; $('#scrim').onclick=closePanel;
  const h=(location.hash||'').slice(1); if(VIEWS[h]) S.view=h;
  const ok=await Store.init();
  try{ const u=window.claude&&await window.claude.use('user'); if(u){ const m=await u.me(); S.me={name:(m&&(m.name||m.displayName))||'',email:(m&&m.email)||''}; try{ const c=await u.can('data.write'); S.canWrite=c!==false; }catch(e){} try{ S.isOwnerish=await u.canEdit(); }catch(e){} } }catch(e){}
  try{ const rs=window.ResourcesSession&&window.ResourcesSession.current(); if(rs){ S.me.name=S.me.name||rs.name||''; S.me.email=S.me.email||rs.email||''; S.relayRole=window.ResourcesSession.role&&window.ResourcesSession.role('mms'); if(S.relayRole==='view') S.canWrite=false; } }catch(e){}
  if(!ok && window.__mmsSeed){ const sd=window.__mmsSeed; Store.mem={tickets:sd.tickets||{},config:{},outbox:sd.outbox||{},media:sd.media||{},arch:sd.arch||{}}; if(sd.me) S.me=sd.me; }
  try{ S.sample=window.claude&&await window.claude.use('sample'); }catch(e){ S.sample=null; }
  const done=()=>{ if(S.loaded.tickets&&S.loaded.config&&!S.ready){ S.ready=true; computeRole(); setupViewAs(); if(!location.hash&&!S.isStaff&&(S.people.facilitators||[]).some(f=>sameName(f.name,S.me.name))) S.view='mine'; go(S.view); runAutomations(); setInterval(runAutomations,5*60000); hubSync(); setInterval(hubSync,5*60000); electionsSync(); } else if(S.ready){ computeRole(); renderAll(); } };
  const timer=setTimeout(()=>{ if(!S.ready){ S.loaded.tickets=S.loaded.config=true; done(); toast('The MMS records are taking a while to load; what shows may be out of date.'); } },12000);
  Store.sub('tickets',o=>{ S.tickets=o; S.loaded.tickets=true; clearTimeout(timer); done(); });
  Store.sub('config',o=>{ if(o.process&&o.process.presets) S.process=o.process; if(o.people&&o.people.roles) S.people=o.people; if(o.notify) S.notify=Object.assign(clone(DEFAULT_NOTIFY),o.notify); if(o.leaders&&o.leaders.list&&(!S.leaderSnap||(o.leaders.at||'')>=(S.leaderSnap.at||''))) S.leaderSnap=o.leaders; if(o.digest) S.digestCfg=o.digest; if(o.digestLog) S.digestLog=o.digestLog; if(o.feed) S.feedState=o.feed; S.cfgDocs=o; S.loaded.config=true; done(); });
  Store.sub('cstatus',o=>{ S.cstat=o||{}; if(S.ready&&(S.view==='comment'||S.panel)) renderAll(); });
  Store.sub('outbox',o=>{ S.outbox=o; if(S.ready) counts(); if(S.ready&&S.view==='outbox') renderAll(); });
  Store.sub('arch',o=>{ S.arch=o; if(S.ready){ counts(); if(['arch','mine','home'].includes(S.view)) renderAll(); } });
  Store.sub('media',o=>{ S.media=o; if(S.ready) counts(); if(S.ready&&S.view==='media') renderAll(); });
  renderWho();
}
function computeRole(){
  const nm=(S.me.name||'').toLowerCase(), em=(S.me.email||'').toLowerCase();
  const inList=l=>(l||[]).some(p=>sameName(p.name,nm)||(em&&(p.email||'').toLowerCase()===em));
  S.isStaff=!!(S.isOwnerish||S.relayRole==='admin'||inList(S.people.roles&&S.people.roles.staff)||S.mode==='memory');
}
function setupViewAs(){
  const w=$('#viewas-wrap'); if(!S.isStaff){ w.hidden=true; return; } w.hidden=false;
  const ppl=[...new Map([...(S.people.facilitators||[]),...Object.values(S.people.roles||{}).flat()].map(p=>[p.name,p])).values()].sort((a,b)=>a.name.localeCompare(b.name));
  const s=$('#viewas'); s.innerHTML='<option value="">Myself'+(S.me.name?' ('+esc(S.me.name.split(' ')[0])+')':'')+'</option>'+ppl.filter(p=>p.name!==S.me.name).map(p=>'<option>'+esc(p.name)+'</option>').join('');
  s.onchange=()=>{ S.viewAs=s.value; renderAll(); };
}
function renderWho(){
  const w=$('#who-chip'); if(window.ResourcesSession||!S.me.name){ w.innerHTML=''; return; }
  const full=(personByName(S.me.name)||{}).name||S.me.name;
  const ini=full.split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();
  w.innerHTML='<span class="whochip" title="'+esc(full)+'"><span class="av">'+esc(ini)+'</span><span class="fn">'+esc(full.split(' ')[0])+'</span><span class="cv">\u25be</span></span>';
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
