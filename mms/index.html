const STAGE_ENTRY={approved:['bet','submitted'],cfp:['bet'],kickoff:['cfpPublished','bet'],work:['workStart','kickoffGc','bet'],aireview:['aiSubmitted'],im:['imSubmitted','aiDecision'],awg:['awgSubmitted','imDecision'],designation:['awgDecision'],'gc-comment':['designation','awgDecision'],comment:['commentStart','commentPublished','gcComment'],post:['commentEnd'],'gc-publish':['commentEnd','postGc'],release:['postGc']};
function stageEntered(t){ const d=t.dates||{}, imp=t.importedAt&&t.source==='smartsheet'&&t.stageSince===(d.imSubmitted||d.workStart||t.importedAt);
  if(t.stageSince&&!imp) return t.stageSince;
  const td=today(), c=(STAGE_ENTRY[t.stage]||[]).map(k=>d[k]).filter(x=>x&&x<=td).sort();
  return c.length?c[c.length-1]:(t.importedAt||t.stageSince||d.workStart||''); }
function stageAge(t){ return daysBetween(stageEntered(t),today()); }
function stalled(t){ const a=stageAge(t); return t.state==='active' && t.stage!=='work' && t.stage!=='comment' && a!=null && a>(S.notify.reminders.staleDays||45); }

async function move(t0,to,opts){
  opts=opts||{}; const t=clone(t0), before=clone(S.tickets[t0.id]||t0);
  const from=t.stage; t.stage=to; t.sub=opts.sub||''; t.stageSince=today(); t.state=to==='published'?'published':(t.state==='hold'?'active':t.state);
  if(to==='published'){ t.dates=t.dates||{}; t.dates.published=t.dates.published||today(); }
  Object.assign(t,opts.patch||{}); if(opts.dates){ t.dates=Object.assign(t.dates||{},opts.dates); }
  hist(t,opts.text||('Moved from '+stageDef(from).name+' to '+stageDef(to).name),{from,to,note:opts.note||''});
  stampDates(t,from,to);
  onEnter(t,to,from);
  await saveTicket(t,opts.toast||(t.wr+' moved to '+stageDef(to).name),before);
  if(!opts.rider){ for(const r of ridersOf(t.id)){ if(r.stage!==to) await move(r,to,{rider:true,sub:to==='published'?'':t.sub,text:'Moved with '+t.wr+' (Reference Model release) to '+stageDef(to).name,toast:t.wr+' and the work riding with it moved to '+stageDef(to).name}); } }
  if(from!==to) notifyEnter(t,to);
  return t;
}
async function setSub(t0,sub,text,patch,note){
  const t=clone(t0), before=clone(S.tickets[t0.id]||t0); t.sub=sub; Object.assign(t,patch||{}); hist(t,text,{note:note||''});
  await saveTicket(t,text,before); return t;
}
/* milestone dates for the metrics: stamped once, the first time a step is done */
const STAMP_LEAVE={kickoff:'kickoffGc',cfp:'cfpPublished',aireview:'aiDecision',im:'imDecision',awg:'awgDecision',designation:'designation','gc-comment':'gcComment','gc-publish':'postGc'};
const STAMP_ENTER={work:'workStart',comment:'commentPublished',published:'published'};
function stampDates(t,from,to){ if(from===to) return; t.dates=t.dates||{}; const d=today();
  const k1=STAMP_LEAVE[from]; if(k1&&!t.dates[k1]) t.dates[k1]=d;
  const k2=STAMP_ENTER[to]; if(k2&&!t.dates[k2]&&!(to==='comment'&&!t.dates.commentStart)) t.dates[k2]=d; } /* comment: stamped when it is actually posted (commentSetup) */
/* what happens automatically when a ticket enters a stage */
function onEnter(t,to){
  t.dates=t.dates||{};
  if(to==='aireview'){ t.dates.aiSubmitted=today(); }
  if(to==='im'){ t.dates.imSubmitted=t.dates.imSubmitted||today(); t.im=t.im||{}; if(!t.sub) t.sub='new'; }
  if(to==='awg'){ t.dates.awgSubmitted=t.dates.awgSubmitted||today(); t.awg=t.awg||{}; if(!t.sub) t.sub='new'; }
  /* AWG approved: the designation is recommended automatically and goes to the Designation Approver */
  if(to==='designation' && (!t.sub||t.sub==='prep')){ if(typeof withAutoDesignation==='function'&&!(t.designation&&t.designation.auto)) withAutoDesignation(t); t.sub='vps'; }
  if(to==='cfp'){ mediaRequest(t,'Call for Participation','Draft and publish the Call for Participation for '+t.name+'.'); }
  if(to==='comment'){
    const days=Number(t.commentDays)||proc().commentDays[0]||30;
    if(!t.dates.commentStart){ t.sub='setup'; }
    else if(!t.dates.commentEnd){ t.dates.commentEnd=addDays(t.dates.commentStart,days); }
    mediaRequest(t,'LinkedIn Post','LinkedIn post announcing '+(t.productPageName||t.name)+' is open for public comment.');
  }
  if(to==='release'){ mediaRequest(t,isStandard(t)?'Candidate Recommendation Announcement':'Final Release Announcement','Announce '+(t.productPageName||t.name)+' as '+(isStandard(t)?'a Candidate Recommendation':'Final')+'.'); }
}
function mediaRequest(t,kind,text){

  const m={id,ticket:t.id,wr:t.wr,name:t.name,kind,text,status:'Requested',requested:today(),by:S.me.name||'',due:''};

}
/* email notices: queued in Notifications; sent by the flow when one is set */
function notifyEnter(t,to){
  const roles=(S.notify.onEnter&&S.notify.onEnter[to])||[];
  const ppl=[]; roles.forEach(r=>peopleFor(r,t).forEach(p=>{ if(p.email && !ppl.some(x=>x.email===p.email)) ppl.push(p); }));
  if(!ppl.length) return;
  const w=whoseMove(t);
  queueMail({to:ppl.map(p=>p.email),subject:t.wr+' '+t.name+': '+stageDef(to).name,
    body:t.name+' ('+t.wr+') is now at '+stageDef(to).name+'.\n\nNext: '+(w.text||'')+(w.label?' ('+w.label+')':'')+'\n\nOpen it in the MISMO Manufacturing System: https://resources.mismo.org/mms/#wr='+encodeURIComponent(t.id),
    html:(typeof stageMailHtml==='function'?stageMailHtml(t,to,ppl):''),ticket:t.id,kind:'stage',key:t.id+'-'+to+'-'+today()});
}
/* until the system goes live, nothing sends: every email waits in Notifications as a preview */
function mailHeld(){ const h=S.notify&&S.notify.holdUntil; return !!h&&today()<h; }
async function queueMail(m){
  const id=(m.key||uid()).replace(/[^A-Za-z0-9_-]/g,'-').slice(0,140);
  if(S.outbox[id]) return;
  const held=mailHeld(); const doc=Object.assign({id,at:new Date().toISOString(),status:held?'Held':'Queued'},m); delete doc.key;
  S.outbox[id]=doc; await write('outbox',id,doc);
  if(!held&&S.notify.flowUrl){ try{ const r=await fetch(S.notify.flowUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:doc.to.join(';'),cc:(doc.cc||[]).join(';'),subject:doc.subject,body:doc.body,html:doc.html||'',from:S.notify.from})}); if(r.ok){ doc.status='Sent'; doc.sentAt=new Date().toISOString(); write('outbox',id,doc); } }catch(e){} }
}

/* ---------- automations that run whenever the page is open ---------- */
async function runAutomations(){
  if(!S.ready || !S.canWrite) return;
  const td=today(), R=S.notify.reminders||{};
  for(const t of liveTickets()){
    if(t.state!=='active') continue;
    const d=t.dates||{};
    if(t.stage==='comment' && t.sub!=='setup' && d.commentEnd && d.commentEnd<td){
      await move(t,'post',{text:'Comment period ended '+fmt(d.commentEnd)+'; moved to Post-Comment automatically',toast:t.wr+': comment period ended'});
      continue;
    }
    if(d.targetIM && ['work','approved'].includes(t.stage)){
      const n=daysBetween(td,d.targetIM);
      if(n!=null && n>=0 && n<=(R.targetDays||7)){
        queueMail({to:[emailOf(t.facilitator)].filter(Boolean),subject:t.wr+' '+t.name+': Target to Submit to IM is '+fmt(d.targetIM),body:'The Target to Submit to IM for '+t.name+' is '+fmt(d.targetIM)+'. Submit for AI Review when ready, or update the target date in the MMS.',ticket:t.id,kind:'reminder',key:t.id+'-target-'+d.targetIM});
      }
    }
    if(t.stage==='comment' && d.commentEnd){
      const n=daysBetween(td,d.commentEnd);
      if(n!=null && n>=0 && n<=(R.commentEndingDays||3)){
        queueMail({to:[emailOf(t.facilitator)].filter(Boolean),subject:t.wr+' '+t.name+': comment period ends '+fmt(d.commentEnd),body:'The comment period for '+t.name+' ends '+fmt(d.commentEnd)+'. You will be asked what came back the day after.',ticket:t.id,kind:'reminder',key:t.id+'-commentend-'+d.commentEnd});
      }
    }
  }
}

function modal(o){
  return new Promise(res=>{
    const root=$('#modal-root');
    root.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="box"><header><h3>'+esc(o.title)+'</h3>'+(o.text?'<p>'+o.text+'</p>':'')+'</header><div class="bd">'+(o.body||'')+'</div><footer><button class="btn" data-m="cancel" type="button">'+esc(o.cancel||'Cancel')+'</button><button class="btn '+(o.danger?'danger':'pri')+'" data-m="ok" type="button">'+esc(o.ok||'Save')+'</button></footer></div></div>';
    const box=$('.modal',root);

    const close=v=>{ root.innerHTML=''; res(v); };
    $('[data-m=cancel]',box).onclick=()=>close(null);
    box.addEventListener('mousedown',e=>{ if(e.target===box) close(null); });

    $('[data-m=ok]',box).onclick=()=>{
      const vals={}; $$('[name]',box).forEach(i=>{ if(i.type==='radio'){ if(i.checked) vals[i.name]=i.value; } else if(i.type==='checkbox'){ vals[i.name]=i.checked; } else vals[i.name]=i.value; });
      $$('[data-date]',box).forEach(i=>{ const v=parseDate(i.value); vals[i.dataset.date]=v===null?'__bad':v; });
      if(Object.values(vals).includes('__bad')){ toast('A date did not read right. Try a format like 9/30/26.'); return; }
      if(o.validate){ const err=o.validate(vals); if(err){ toast(err); return; } }
      close(vals);
    };
    const f=$('input,select,textarea',box); if(f) setTimeout(()=>f.focus(),30);
  });
}

const VIEWS={};

let renderT=0, renderAt=0;
function renderAll(){
  if(!S.ready||S.importing) return;
  const now=Date.now(); if(!S._readyAt) S._readyAt=now; if(!S._enter&&now-S._readyAt<10000&&now-renderAt<250){ clearTimeout(renderT); renderT=setTimeout(renderAll,250-(now-renderAt)); return; }
  clearTimeout(renderT); renderAt=now;
  const v=VIEWS[S.view]||VIEWS.home; const m=$('#main'); const y=window.scrollY;
  const html=(S.mode==='memory'?'<div class="banner">This copy isn\u2019t connected to the MMS records, so nothing here is saved. Open the published MMS to work for real.</div>':'')+(S.canWrite?'':'<div class="banner info">You can look at everything here; ask MISMO staff if you need to make changes.</div>')+v();
  const same=!S._enter&&S._lastView===S.view;
  if(same&&html===S._lastHtml){ counts(); if(S.panel) renderPanel(); return; }
  S._lastHtml=html; S._lastView=S.view;
  m.classList.toggle('calm',same);
  m.innerHTML=html;
  wireMain(m); window.scrollTo(0,y); counts(); if(S.panel) renderPanel();
}

  const row=t=>{ const d=t.dates, isOpen=open.includes(t), l=X(d.commentStart), w=Math.max(1.2,X(d.commentEnd)-l), n=daysBetween(td,d.commentEnd), right=l+w<78;

  html+='<div class="card cp"><h3>Comment Period Timeline<span class="sp cp-key"><span><i class="open"></i>Open now</span><span><i class="closed"></i>Closed in the last 45 days</span><span><i class="now"></i>Today</span></span></h3>'+axis+

function openPanel(id){ const wasOpen=!!S.panel, a=document.activeElement; if(!wasOpen&&a&&a!==document.body&&!(a.closest&&a.closest('#panel'))) pnlOpener={el:a,open:a.dataset&&a.dataset.open};

document.addEventListener('keydown',e=>{ if(e.key!=='Tab'||!S.panel||($('#modal-root')&&$('#modal-root').children.length)) return; const P=$('#panel'); if(!P||!P.classList.contains('on')) return;

function stageActions(t){
  const A=[], g=govName(), sub=t.sub||'';
  const add=(label,fn,cls)=>A.push({label,fn,cls:cls||''});
  if(t.state==='hold'){ add('Resume Work',()=>resume(t),'pri'); return A; }
  if(t.state!=='active'){ add('Reopen',()=>reopen(t),'pri'); return A; }
  if(t.split){ add('+ Add a Deliverable',()=>splitT(t),'pri'); return A; }
  if(t.rides){ const b=S.tickets[t.rides]; if(t.stage==='designation') add('Approve Recommended Designation',()=>approveRec(t),'pri'); add('Open '+(b?b.wr:'the Release'),()=>openPanel(t.rides)); add('Stop Riding: Move on Its Own',()=>unride(t)); return A; }
  switch(t.stage){
    case 'approved': add('Start Work →',()=>startWork(t),'pri'); break;
    case 'cfp': add('Call for Participation Published →',()=>cfpDone(t),'pri'); break;
    case 'kickoff': add('Record '+g+' Decision',()=>decide(t),'pri'); break;
    case 'work': add('Submit for AI Review →',()=>submitAI(t),'pri'); add('Change Target Date',()=>changeTarget(t)); break;
    case 'aireview':
      add(sub==='reviewed'?'Run AI Review Again':'Run AI Review',()=>aiReview(t),sub==='reviewed'?'':'pri');
      if(sub==='reviewed'||sub==='') add('Send to IM Review →',()=>move(t,nextStage(t),{dates:{aiDecision:today()},patch:{ai:Object.assign({},t.ai,{status:'Passed'})},text:'AI Review passed; sent to '+stageDef(nextStage(t)).name}),sub==='reviewed'?'pri':'');
      if(sub!=='updates') add('Make Updates First',()=>setSub(t,'updates','Facilitator making updates from AI Review'));
      else add('Resubmit for AI Review',()=>setSub(t,'resubmitted','Resubmitted for AI Review'),'pri');
      break;
    case 'im': case 'awg': {
      const k=t.stage, nm=k==='im'?'IM':'AWG';
      if(sub==='prep') add('Submitted to '+nm+' →',()=>setSub(t,'new','Submitted to '+nm+' through MISMO Connect',{dates:Object.assign({},t.dates,{[k+'Submitted']:today()})}),'pri');
      if(sub==='updates') add('Resubmit to '+nm,()=>{ const x=clone(t[k]||{}); x.resubs=(x.resubs||0)+1; return setSub(t,'resubmitted','Resubmitted to '+nm,{[k]:x,dates:Object.assign({},t.dates,{[k+'Resubmitted']:today()})}); },'pri');
      /* the review itself happens in IM Review / AWG Review; its decision moves the work request */
      if(sub!=='updates'&&sub!=='prep'){ const pq=typeof portalItemFor==='function'?portalItemFor(t,k):null;
        if(pq) add('Open in '+nm+' Review ↗',()=>portalOpen(k,pq.rep),'pri');
        else if(k==='im') add('Run the IM Pre-Review →',()=>{ S.ptab='reviews'; rvRun(t,'im'); },'pri');
        else add('Open AWG Review ↗',()=>portalOpen('awg',''),'pri'); }
      add('Not Required: Skip',()=>move(t,nextStage(t),{patch:{[k]:Object.assign({},t[k],{status:'Passed (not required)'})},text:nm+' review not required; skipped'}),'ghost');
      break; }
    case 'designation':
      if(sub==='director'||sub==='discuss'||sub==='prep'||!sub){ add('Approve Recommended Designation →',()=>approveRec(t),'pri'); add('Change the Designation',()=>directorRec(t)); }
      if(sub==='vps'){ add('Approve the Designation',()=>vpAgree(t),'pri'); if(S.isStaff||isRole('director',S.me)) add('Change the Designation',()=>directorRec(t)); }
      break;
    case 'gc-comment': add('Record '+g+' Decision',()=>decide(t),'pri'); break;
    case 'comment':
      if(sub==='setup') add('Posted: Set Comment Dates →',()=>commentSetup(t),'pri');
      else { add('End Comment Period Now',()=>move(t,'post',{text:'Comment period closed early',dates:{commentEnd:today()}})); add('Change Dates',()=>commentSetup(t)); }
      break;
    case 'post': add('Report What Came Back →',()=>postReport(t),'pri'); break;
    case 'gc-publish': add('Record '+g+' Decision',()=>decide(t),'pri'); break;
    case 'release': add('Mark Published →',()=>markPublished(t),'pri'); break;
    default: if(!STAGE_KEYS.includes(t.stage)) add('Done: Move On →',()=>move(t,nextStage(t),{text:stageDef(t.stage).name+' done'}),'pri');
  }
  if(S.canWrite&&(S.isStaff||sameName(t.facilitator,viewer().name))&&!t.parent&&!t.rides) A.push({label:'Split into Deliverables',fn:()=>splitT(t),cls:'ghost'});
  return A;
}

  }

  if(t.commentReport) inner+='<div class="vote"><span class="nm">Comment Report</span><span class="chip">'+esc(t.commentReport)+'</span></div>';

  if(!inner) return '';
  return '<div class="psec full" data-sec="stage"><h4>Reviews and Decisions</h4>'+inner+'</div>';
}

async function readFile(f){
  const n=f.name.toLowerCase();
  if(/\.(txt|md|csv|xml|json|xsd|html?)$/.test(n)) return await f.text();
  if(/\.docx$/.test(n)&&window.JSZip){ const z=await JSZip.loadAsync(f); const x=await z.file('word/document.xml').async('string'); return x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); }
  if(/\.(xlsx|xls)$/.test(n)&&window.XLSX){ const wb=XLSX.read(await f.arrayBuffer()); return wb.SheetNames.map(s=>'## '+s+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n\n'); }
  if(/\.pptx$/.test(n)&&window.JSZip){ const z=await JSZip.loadAsync(f); const names=Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort(); let out=''; for(const k of names){ out+='\n## '+k+'\n'+(await z.file(k).async('string')).replace(/<\/a:p>/g,'\n').replace(/<[^>]+>/g,''); } return out; }
  throw new Error(f.name+': paste the text instead (this file type can’t be read here)');
}
async function aiReview(t){
  if(!S.sample){
    const v=await modal({title:'AI Review',text:'Claude isn’t reachable from this copy of the MMS yet, so the review can’t run here. You can record the review by hand.',ok:'Record Review',body:fld('Result',radios('r',[['ready','Ready for IM'],['fix','Updates needed']],'ready'))+fld('Findings',ta('note',''))});
    if(!v) return; const x=clone(t); const r={at:new Date().toISOString(),by:S.me.name||'',verdict:v.r==='ready'?'ready':'fix',summary:v.note||'Recorded by hand',checks:[],edits:[],manual:true};
    x.ai=Object.assign({},x.ai,{rounds:[...((x.ai&&x.ai.rounds)||[]),r]}); return setSub(x,v.r==='ready'?'reviewed':'updates','AI Review recorded by hand: '+(v.r==='ready'?'ready for IM':'updates needed'));
  }
  const root=$('#modal-root');
  root.innerHTML='<div class="modal"><div class="box" style="width:min(760px,100%)"><header><h3>AI Review</h3><p>'+esc(t.name)+'. Add the work product files (Word, Excel, PowerPoint, text, CSV, XML) or paste the text. Files are read here and aren’t stored.</p></header><div class="bd">'+

/* ---------- license designation: the pattern so far, as a recommendation to approve ---------- */
const DES_SINCE='2025-01-01';
function desDate(x){ const d=x.dates||{}; return d.designation||d.gcComment||d.commentStart||''; }
function pastDesignations(){ return allTickets().filter(x=>x.designation&&x.designation.license&&desDate(x)>=DES_SINCE); }
function recommend(t){
  const nm=((t.name||'')+' '+(t.product||'')).toLowerCase(), wg=(t.workgroup||'').toLowerCase(), kind=(t.kind||'').toLowerCase();
  let cls, clsWhy;
  if(kind){ cls=/dataset|reference model|api|schema/.test(kind)?'Standard':'Collateral'; clsWhy='A '+t.kind+' is '+(cls==='Standard'?'a standard':'collateral')+'.'; }
  else if(/i-?guide|implementation guide|white paper|guidance|business process model|glossary maintenance|\bmeg\b|toolkit|adoption|\broi\b|template|life of loan|artifact update/.test(nm)){ cls='Collateral'; clsWhy='Guides, white papers, BPM, glossary and MEG work have been collateral.'; }
  else if(/dataset|reference model|\bapi\b|specification|schema|\bxml\b|\bjson\b|mapping|documents to data|as data|naming guide|glossary of|\bpart b\b/.test(nm)){ cls='Standard'; clsWhy='Datasets, Reference Model, API and specification work have been standards.'; }
  else { cls=t.classification||(t.workType==='Maintenance'?'Collateral':'Standard'); clsWhy='No clear signal in the name, so this follows '+(t.classification?'the classification on file':'the work type')+'.'; }
  let prof, why;
  if(/\bmeg\b|eldd|logical data dictionary|enumeration/.test(nm)||/architecture workgroup/.test(wg)){ prof={type:'Member',license:'Internal Use Only',royalty:'Royalty Temp Waived',availableTo:'Members Only'}; why='Architecture Workgroup, MEG and enumeration work has gone out Member, Internal Use Only since 2025.'; }
  else if(/business glossary/.test(wg+' '+nm)){ prof={type:'Member',license:'Commercial Distributor',royalty:'Royalty Temp Waived',availableTo:'Public'}; why='Business Glossary releases since 2025 have gone to Member comment, Commercial Distributor, available to the public.'; }
  else {
    prof={type:'Public',license:'Commercial Distributor',royalty:'Royalty Temp Waived',availableTo:'Public'}; why='This is how most work has gone out since 2025.';
    const prior=allTickets().filter(x=>x.id!==t.id&&x.workgroup&&x.workgroup===t.workgroup&&x.designation&&x.designation.license&&desDate(x)>=DES_SINCE).sort((a,b)=>desDate(b).localeCompare(desDate(a)))[0];
    if(prior&&prior.designation.type){ const d=prior.designation; prof={type:d.type,license:d.license,royalty:d.royalty||'Royalty Temp Waived',availableTo:d.availableTo||'Public'}; why='Same as '+prior.wr+' '+prior.name+', the last one from '+t.workgroup+' ('+fmtS(desDate(prior))+').'; }
  }
  const P=pastDesignations(); const same=P.filter(x=>x.designation.type===prof.type&&x.designation.license===prof.license).length;
  const days=(proc().commentDays||[30]).includes(30)?30:(proc().commentDays||[30])[0];
  return Object.assign({classification:cls,clsWhy,why,commentDays:days,match:same,of:P.length},prof);
}
function recPanel(t){
  if(t.stage!=='designation'||t.state!=='active') return '';
  const r=recommend(t);
  const row=(l,v)=>'<div class="f"><label>'+l+'</label><div class="ro"><b>'+esc(v)+'</b></div></div>';
  return '<div class="psec full rec"><h4>Recommended Designation<span class="sp chip good">Matches '+r.match+' of '+r.of+' since 2025</span></h4><div class="kv">'+row('Classification',r.classification)+row('Comment Type',r.type)+row('License Usage',r.license)+row('Royalty Status',r.royalty)+row('Available To',r.availableTo)+row('Comment Length',r.commentDays+' days')+'</div><div class="muted" style="font-size:12.5px;margin-top:8px">'+esc(r.why)+' '+esc(r.clsWhy)+'</div></div>';
}
async function approveRec(t){
  const r=recommend(t), x=clone(t);
  x.classification=r.classification; x.commentDays=x.commentDays||r.commentDays;
  x.designation=Object.assign({},x.designation,{type:r.type,license:r.license,royalty:r.royalty,availableTo:r.availableTo,recommended:true,vps:{}});
  x.dates=Object.assign({},x.dates,{designation:today()});
  if(t.rides){ hist(x,'Approved the recommended designation: '+[r.classification,r.type,r.license,r.availableTo].join(', ')); await saveTicket(x,'Designation approved',clone(t)); return; }
  /* when the approver is the person approving it here, one click does it: no second approval of their own designation */
  const ap=peopleFor('vps'); if(ap.length&&ap.every(p=>sameName(p.name,S.me.name))){ x.designation.vps={[ap[0].name]:{vote:'Approve',note:'',at:today()}}; x.designation.status='3. Approved';
    await move(x,nextStage(x),{text:'Designation approved by '+ap[0].name+': '+[r.classification,r.type,r.license,r.availableTo].join(', ')+'; added to the '+govName()+' agenda'}); return; }
  await setSub(x,'vps','Director approved the recommended designation: '+[r.classification,r.type,r.license,r.availableTo].join(', '));
  queueMail({to:peopleFor('vps').map(p=>p.email),subject:t.wr+' '+t.name+': designation ready for your agreement',body:'The Director approved: '+[r.classification,r.type,r.license,r.royalty,r.availableTo].join(' · ')+'.\n\nAgree or ask to discuss in the MMS.',ticket:t.id,kind:'stage',key:t.id+'-vps-'+today()});
}
function trendsCard(){
  const P=pastDesignations(); if(!P.length) return '';
  const c={}; P.forEach(x=>{ const d=x.designation; const k=[d.type,d.license,d.royalty,d.availableTo||'—'].join(' · '); c[k]=(c[k]||0)+1; });
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const cls={Standard:0,Collateral:0}; P.forEach(x=>{ if(cls[x.classification]!=null) cls[x.classification]++; });
  const thirty=P.filter(x=>+x.commentDays===30).length;
  return '<div class="card"><h3>Designation Trends since 2025<span class="sp muted" style="font-size:12px;font-weight:500">'+P.length+' designations</span></h3>'+
    top.map(([k,n])=>'<div style="display:grid;grid-template-columns:1fr 180px 36px;gap:10px;align-items:center;padding:5px 0"><span style="font-size:13px">'+esc(k)+'</span><span class="tbar"><i style="width:'+Math.round(n/P.length*100)+'%"></i></span><b style="text-align:right">'+n+'</b></div>').join('')+
    '<p class="muted" style="font-size:12.5px;margin:10px 0 0">'+cls.Standard+' standards and '+cls.Collateral+' collateral; '+thirty+' of '+P.length+' used a 30-day comment period. Each designation now comes with a recommendation built from this pattern, so the Director can approve it in one click.</p></div>';
}

/* ---------- current leadership for each group, brought in from Elections HQ ---------- */
const ELECTIONS_ROSTER='https://resources.mismo.org/elections-hq/';
const gnorm=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/\b(cop|dwg|community of practice|development workgroup|workgroup|task force|area of focus|docs)\b/g,' ').replace(/[^a-z0-9]/g,'');
/* Elections HQ is read by whoever can open it (staff); a copy lands in the MMS records so every
   facilitator sees the same leaders, whether or not they have Elections HQ themselves. */
async function electionsSync(){
  if(S.mode!=='relay') return;
  const rs=window.ResourcesSession, tok=rs&&rs.token(); if(!tok) return;
  const get=async n=>{ const r=await fetch(window.__hqRelay.config.RELAY_URL+'/elections-hq/data/'+n,{headers:{Authorization:'Bearer '+tok},cache:'no-store'}); if(!r.ok) throw new Error(r.status); const b=await r.json(); return Object.values((b.data&&b.data.docs)||{}); };
  try{
    const [L,G]=await Promise.all([get('leaders'),get('groups')]);
    const alias={}; G.forEach(g=>{ const a=[g.name,g.formerly,g.mtName].filter(Boolean); a.forEach(x=>{ alias[gnorm(x)]=a; }); });
    const list=L.filter(x=>x.status!=='inactive'&&x.status!=='former').map(l=>{ const a=new Set([l.group,l.formerGroup,...(alias[gnorm(l.group)]||[]),...(alias[gnorm(l.formerGroup)]||[])].filter(Boolean)); return [l.name||'',l.position||'',l.company||'',l.group||'',l.formerGroup||'',(l.termEnd||'').slice(0,10),l.gtype||'',[...a].join('|')]; }).sort((a,b)=>(a[3]+a[0]).localeCompare(b[3]+b[0]));
    const old=S.leaderSnap&&JSON.stringify(S.leaderSnap.list);
    S.leaderSnap={at:new Date().toISOString(),list};
    if(S.canWrite&&old!==JSON.stringify(list)) write('config','leaders',S.leaderSnap);
    if(S.panel) renderPanel();
  }catch(e){}
}
function leadersFor(t){
  const snap=S.leaderSnap; if(!snap||!snap.list) return null;
  const k=gnorm(t.workgroup); if(!k) return [];
  const rank=p=>{ p=String(p).toLowerCase(); return /^chair|^co-chair/.test(p)?0:/vice/.test(p)?1:/lead/.test(p)?2:/rep/.test(p)?3:4; };
  return snap.list.map(r=>({name:r[0],position:r[1],company:r[2],group:r[3],formerGroup:r[4],termEnd:r[5],gtype:r[6],aliases:(r[7]||'').split('|')}))
    .filter(l=>[l.group,l.formerGroup,...l.aliases].some(x=>x&&gnorm(x)===k))
    .sort((a,b)=>rank(a.position)-rank(b.position)||a.name.localeCompare(b.name));
}
const GTYPE={aof:'Area of Focus',tf:'Task Force',process:'Process Group',gov:'Governance',board:'Board',other:'Workgroup'};

/* ---------- facilitators ask; MISMO staff decide (hold, resume, close, cancel) ---------- */
const ASK_WORD={hold:'Put on Hold',resume:'Resume',close:'Close',cancel:'Cancel'};
const ASK_THIS={hold:'put this on hold',resume:'resume this',close:'close this',cancel:'cancel this'};
async function askFor(t,kind){
  const v=await modal({title:'Ask to '+ASK_WORD[kind],text:'MISMO staff will see your request and decide. Nothing changes until they do.',ok:'Send Request',cancel:'Never Mind',body:
    fld('Why',ta('why','',kind==='hold'?'What it is waiting on':'What happened'))+(kind==='hold'?fld('Check Back On',dateField('until',''),'Optional'):''),validate:x=>x.why&&x.why.trim()?'':'Say why'});

function askBanner(t){

  return '<div class="askb"><div><div class="eyebrow">Request</div><b>'+who+' asked to '+esc(ASK_THIS[r.kind]||r.kind)+'</b><div class="muted" style="font-size:12.5px">'+esc(r.why||'')+(r.until?' · check back '+esc(fmtS(r.until)):'')+' · '+esc(fmtS(atDay(r.at)))+'</div></div>'+
    (S.isStaff?'<button class="btn pri" data-req="yes" type="button">Approve: '+esc(ASK_WORD[r.kind])+'</button><button class="btn" data-req="no" type="button">Decline</button>':'<span class="chip warn">Waiting on MISMO staff</span>')+'</div>';
}
async function decideAsk(t,yes){
  const r=t.request; if(!r) return;
  let note='';
  if(!yes){ const v=await modal({title:'Decline the Request',ok:'Decline',body:fld('Note for '+(r.by||'the facilitator'),ta('note',''))}); if(!v) return; note=v.note||''; }
  const x=clone(t), b=clone(t); delete x.request;
  if(yes){
    if(r.kind==='hold'){ x.state='hold'; x.holdReason=r.why; x.holdUntil=r.until; }
    if(r.kind==='resume'){ x.state='active'; delete x.holdReason; delete x.holdUntil; }
    if(r.kind==='close'){ x.state='closed'; x.dates=Object.assign({},x.dates,{closed:today()}); x.notes=Object.assign({},x.notes,{closed:r.why}); }
    if(r.kind==='cancel'){ x.state='canceled'; x.dates=Object.assign({},x.dates,{canceled:today()}); x.notes=Object.assign({},x.notes,{closed:r.why}); }
    hist(x,'Approved '+(r.by||'')+'’s request to '+ASK_WORD[r.kind].toLowerCase(),{note:r.why});
  } else hist(x,'Declined '+(r.by||'')+'’s request to '+ASK_WORD[r.kind].toLowerCase(),{note});
  await saveTicket(x,yes?t.wr+': '+ASK_WORD[r.kind].toLowerCase()+' approved':'Request declined',b);
  const fe=emailOf(r.by)||emailOf(t.facilitator);
  if(fe) queueMail({to:[fe],subject:t.wr+' '+t.name+': your request to '+ASK_WORD[r.kind].toLowerCase()+' was '+(yes?'approved':'declined'),body:yes?'MISMO staff approved it.':'MISMO staff declined it.'+(note?'\n\n'+note:''),ticket:t.id,kind:'request',key:t.id+'-askd-'+r.kind+'-'+today()});
}

const ARCH_TYPES=['Data Modeling / Reference Model','Schema (XSD) or Extension','MEG or Guideline Question','API Design or Review','Work Product Review','Mapping Support','Website or Documentation','Outside Question','Other'];

    (t?'':fld('Related Work Request',sel('wr',[['','Not tied to a work request'],...live.map(x=>[x.id,x.wr+' '+x.name])],''))+fld('Workgroup',sel('wg',[['','Not tied to a workgroup'],...wgs.map(w=>[w,w])],follow?follow.workgroup:'')))+
    fld('Type of Help',radios('type',ARCH_TYPES,follow?follow.type:ARCH_TYPES[0]))+
    fld('Description of the Work',ta('details',follow?follow.further||'':'','What the architect should do, the question to answer, and what done looks like'))+

    fld('Workgroup Meeting Needed?',radios('meet',[['no','No'],['yes','Yes, join a workgroup call']],'no')),
    validate:x=>!x.title?'Name the request':(!x.details?'Describe the work':'')});
  if(!v) return;
  const tk=t||(v.wr?S.tickets[v.wr]:null);
  const id=nextAtb();
  const a={id,ticket:tk?tk.id:'',wr:tk?tk.wr:'',name:tk?tk.name:'',workgroup:tk?(tk.workgroup||''):(v.wg||''),facilitator:tk?(tk.facilitator||''):(S.me.name||''),requestedBy:S.me.name||'',requested:today(),at:new Date().toISOString(),
    title:v.title,type:v.type,details:v.details,info:v.info,product:v.product,version:v.version,priority:v.pri,needBy:v.need||'',hours:v.hours,links:v.links,meeting:v.meet==='yes',status:'Requested',

function avHue(n){ let h=0; for(const c of String(n||'')) h=(h*31+c.charCodeAt(0))>>>0; return AV_C[h%AV_C.length]; }
function av(n,cls){ return '<span class="av'+(cls?' '+cls:'')+'" style="--av:'+(n?avHue(n):'#7794aa')+'" title="'+esc(n||'Unassigned')+'">'+esc(n?initials(n):'?')+'</span>'; }
const firstName=n=>String(n||'').split(' ')[0];
const ATT_TIP={late:'Target to Submit to IM has passed',soon:'Comment period ends within 7 days',stall:'Sitting 45+ days in one step',post:'Approved for comment, not on the website yet'};
function ageLong(n){ if(n==null) return ''; if(n<60) return n+' day'+(n===1?'':'s'); if(n<365) return Math.round(n/30.4)+' months'; return (n/365).toFixed(1).replace(/\.0$/,'')+' years'; }
function ageTxt(n){ if(n==null) return ''; if(n<60) return n+'d'; if(n<365) return Math.round(n/30.4)+' mo'; return (n/365).toFixed(1).replace(/\.0$/,'')+' yr'; }
function heatLevel(t){ const a=stageAge(t); if(a==null||t.state!=='active') return -1; if(pastTarget(t)) return 2; if(stalled(t)) return 1;
  const lim=t.stage==='work'?((typeof sizeImDays==='function'?sizeImDays(t):SIZE_DAYS[t.size]||120)):(t.stage==='comment'?(+t.commentDays||30):21); return a>lim*.6?1:0; }
function heat(t){ const a=stageAge(t), l=heatLevel(t); if(l<0) return ''; return '<span class="heat h'+l+'" title="'+a+' days in '+esc(stageDef(t.stage).name)+'"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>'+ageTxt(a)+'</span>'; }
function tags(t){ return [t.kind?'<span class="chip">'+esc(t.kind)+'</span>':'', t.rides?'<span class="chip info">Moves With '+esc((S.tickets[t.rides]||{}).wr||'')+'</span>':'', ridersOf(t.id).length?'<span class="chip info">'+ridersOf(t.id).length+' Riding</span>':'', t.request?'<span class="chip warn">Asked to '+esc(t.request.kind)+'</span>':'', subChip(t), stateChip(t), pastTarget(t)?'<span class="chip bad">Past Target</span>':''].join(''); }
function canAct(t){ return S.canWrite && (S.isStaff || isMine(t)); }
S._qa=S._qa||{};
function qaBtns(t,max,all){

  return A.map((a,i)=>{ const k=t.id+'|'+i+'|'+a.label; S._qa[k]=a.fn; return '<button type="button" class="btn sm '+(a.cls==='pri'?'pri':'')+'" data-qa="'+esc(k)+'">'+esc(a.label)+'</button>'; }).join('');
}
function card2(t,o){

  return '<div role="button" tabindex="0" class="tk2'+(t.state==='hold'?' hold':'')+(pastTarget(t)?' late':'')+(o.focus?' isnext':'')+'" data-open="'+esc(t.id)+'"'+(o.drag?' draggable="true" data-drag="'+esc(t.id)+'"':'')+' style="--i:'+(o.i||0)+'">'+
    '<div class="t2-top"><span class="wr">'+esc(t.wr)+'</span>'+(t.size?'<span class="t2-sz" title="Size: '+esc(typeof sizeLabel==='function'?sizeLabel(t):'')+'">'+esc(t.size)+'</span>':'')+age+'</div>'+
    '<div class="t2-nm">'+esc(t.name)+'</div>'+
    (o.stage?'<div class="t2-st">'+esc(s.name)+'</div>':'')+
    (tg?'<div class="t2-tags">'+tg+'</div>':'')+
    '<div class="t2-ft">'+av(o.next&&w.role&&w.role!=='facilitator'?((movers(t)[0]||{}).name||t.facilitator):t.facilitator,'sm')+'<span class="t2-who">'+(o.next?'<b>'+esc(w.label||'')+':</b> '+esc(w.text||''):esc(t.facilitator||'No facilitator'))+'</span></div>'+
    (acts?'<div class="t2-acts">'+acts+'</div>':'')+'</div>';
}
function lanesHtml(id,L,lt,each){

  S.laneSel=S.laneSel||{}; const keys=L.map(l=>l.key); const sel=keys.includes(S.laneSel[id])?S.laneSel[id]:(L.find(l=>l.n)||L[0]).key;

    '<div class="lanes" data-lanes="'+id+'" style="--n:'+L.length+(lt?';--lt:'+lt:'')+'">'+L.map(l=>'<section class="lane'+(l.key===sel?' on':'')+(l.cls?' '+l.cls:'')+'" data-lanekey="'+l.key+'" style="--lc:'+l.c+'"><header><div class="lh"><h4>'+esc(l.title)+'</h4><b class="ln">'+l.n+'</b></div>'+(l.sub?'<div class="o">'+l.sub+'</div>':'')+(l.head||'')+'</header><div class="lane-b">'+(pg[l.key]?(pg[l.key].items.join('')||l.body||''):l.body||'<div class="lane-e"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'+(l.empty||'Nothing here')+'</div>')+(l.drop||'')+'</div>'+(pg[l.key]?pg[l.key].bar:'')+'</section>').join('')+'</div>';

function lens(id,items){

  return '<div class="figs lensfigs">'+items.map(x=>'<button type="button" class="fig'+(x.cls?' '+x.cls:'')+(cur===x.key?' on':'')+(x.key?'':' static')+'"'+(x.key?' data-lens="'+id+'" data-lk="'+x.key+'"':'')+' style="--fc:'+x.c+'"><div class="k">'+x.k+'</div><div class="v" data-n="'+x.v+'">'+x.v+'</div><div class="s">'+x.s+'</div>'+(x.key?'<span class="fig-f">'+(cur===x.key?'Showing ✕':'Show')+'</span>':'')+'</button>').join('')+'</div>';

function facPick(list,cur){
  const facs=[...new Set(list.map(t=>t.facilitator).filter(Boolean))].sort();
  if(!facs.length) return '';

function moreFilters(){

/* ---------------- Pipeline Board ---------------- */
VIEWS.board=function(){
  const L=filteredLive(), f=S.filters, mode=S.boardMode||'lanes', stF=S.bStage||'';
  const drag=S.canWrite&&S.isStaff;
  const seg='<div class="seg" id="bmode"><button type="button" data-bm="lanes" aria-pressed="'+(mode==='lanes')+'">By Phase</button><button type="button" data-bm="fac" aria-pressed="'+(mode==='fac')+'">By Facilitator</button></div>';
  const only=stF?'<button type="button" class="onlyst" data-rv="'+stF+'">Only '+esc(stageDef(stF).name)+' <span aria-hidden="true">✕</span></button>':'';
  let body='', i=0;
  if(mode==='lanes'){
    body=lanesHtml('board',PHASES.map(ph=>{ const sts=phaseStages(ph); if(!sts.length) return null;
      const inPh=L.filter(t=>sts.some(s=>s.key===t.stage));
      const groups=sts.filter(s=>!stF||s.key===stF).map(s=>{ const ts=inPh.filter(t=>t.stage===s.key).sort((a,b)=>(stageAge(b)||0)-(stageAge(a)||0)); if(!ts.length) return '';
        return '<div class="bg"><div class="bg-h"><span>'+esc(s.name)+'</span><b>'+ts.length+'</b></div>'+ts.map(t=>card2(t,{drag,i:i++})).join('')+'</div>'; }).join('');
      const drop=drag?'<div class="dz">'+sts.map(s=>'<div class="dzi" data-dz="'+s.key+'"><span>Move to</span><b>'+esc(s.name)+'</b></div>').join('')+'</div>':'';
      return {key:ph.key,title:ph.name,n:inPh.length,c:'var(--navy)',sub:esc(sts.map(s=>s.name).join(' · ')),drop,body:groups,empty:'Nothing here right now'}; }),'var(--lt-board)');
  } else {
    const facs=[...new Set(L.map(t=>t.facilitator||''))].sort((a,b)=>(!a)-(!b)||a.localeCompare(b));

    body='<div class="mx" style="--n:'+phs.length+'"><div class="mx-h"><span></span>'+phs.map(ph=>'<span>'+esc(ph.name)+'</span>').join('')+'</div><div class="mx-b">'+facs.map(fa=>{ const ts=L.filter(t=>(t.facilitator||'')===fa&&(!stF||t.stage===stF));
      return '<div class="mx-r"><button type="button" class="mx-p" data-fp="'+esc(fa)+'">'+av(fa)+'<span><b>'+esc(fa||'Unassigned')+'</b><em>'+ts.length+' live</em></span></button>'+phs.map(ph=>{ const c=ts.filter(t=>phaseOf(t.stage)===ph.key).sort((a,b)=>(stageAge(b)||0)-(stageAge(a)||0));
        return '<div class="mx-c">'+c.slice(0,5).map(t=>'<button type="button" class="mc'+(pastTarget(t)?' late':'')+(t.state==='hold'?' hold':'')+'" data-open="'+esc(t.id)+'" title="'+esc(t.wr+' '+t.name+' · '+stageDef(t.stage).name+(stageAge(t)!=null?' · '+stageAge(t)+' days':''))+'"><span>'+esc(t.name)+'</span><em>'+esc(stageDef(t.stage).name)+'</em></button>').join('')+(c.length>5?'<button type="button" class="mc-more" data-fp="'+esc(fa)+'" data-bm2="lanes">+'+(c.length-5)+' more</button>':'')+'</div>'; }).join('')+'</div>'; }).join('')+'</div></div>';
  }
  return '<div class="pagehead slim"><div><h1>Pipeline Board</h1><div class="sub">'+L.length+' live work requests, oldest first in each stage'+(drag?'. Drag a card onto a stage to move it.':'.')+'</div></div><div class="acts">'+seg+'<a class="btn pri" href="https://resources.mismo.org/initiative-hub/work-requests.html#new" target="_blank" rel="noopener">+ New Work Request</a></div></div>'+

/* ---------------- My Queue ---------------- */
function urgency(t){ return (pastTarget(t)?-1e6:0)+(t.request?-5e5:0)-(stageAge(t)||0); }
VIEWS.mine=function(){
  const me=viewer(), nm=me.name||'';
  if(!nm) return '<div class="pagehead"><div><h1>My Queue</h1></div></div><div class="empty">Sign in to see your queue.</div>';
  const who=S.viewAs?firstName(nm):'you';
  const yours=qSort(liveTickets().filter(t=>waitingOn(t,me)),me);
  const later=qSort(liveTickets().filter(t=>isMine(t,me)&&!dueNow(t)),me).sort((a,b)=>String((a.dates||{}).targetIM||'9').localeCompare(String((b.dates||{}).targetIM||'9')));
  const facT=qSort(myFacTickets(me).filter(t=>!yours.includes(t)&&!later.includes(t)),me);
  const act=x=>x.state==='active';
  const withRev=facT.filter(t=>act(t)&&['aireview','im','awg','designation'].includes(t.stage));
  const withGov=facT.filter(t=>act(t)&&GOV_STAGES.includes(t.stage));
  const out=facT.filter(t=>act(t)&&!withRev.includes(t)&&!withGov.includes(t));
  const held=facT.filter(t=>t.state==='hold');
  const n=yours.length; S.focusIdx=Math.min(S.focusIdx||0,Math.max(0,n-1)); const ft=yours[S.focusIdx];
  let hero;
  if(ft){
    const w=whoseMove(ft), d=ft.dates||{}; let due='';
    if(ft.stage==='comment'&&d.commentEnd) due='Comment ends '+fmt(d.commentEnd); else if(d.targetIM&&['approved','work','aireview'].includes(ft.stage)) due=(pastTarget(ft)?'Was due to IM ':'Target to IM ')+fmt(d.targetIM);
    const list=stages(), ci=list.findIndex(s=>s.key===ft.stage);
    const step='<div class="fx-step">'+list.map((s,j)=>'<i class="'+(j<ci?'d':j===ci?'c':'')+'" title="'+esc(s.name)+'" style="--sc:'+s.color+'"></i>').join('')+'<span>Step '+(ci+1)+' of '+list.length+': <b>'+esc(stageDef(ft.stage).name)+'</b></span></div>';
    const rest=yours.filter(t=>t!==ft).slice(0,4);
    hero='<div class="focus"><div class="fx-l"><div class="fx-k"><span class="pulse"></span>Up Next'+(n>1?' · '+(S.focusIdx+1)+' of '+n:'')+'</div>'+
      '<div class="fx-wr">'+esc(ft.wr)+' <span class="fx-stage" style="--sc:'+stageDef(ft.stage).color+'"><i></i>'+esc(stageDef(ft.stage).name)+'</span>'+tags(ft)+heat(ft)+'</div><h2 data-open="'+esc(ft.id)+'">'+esc(ft.name)+'</h2>'+
      '<div class="fx-next">'+esc(w.text||'')+'</div>'+(due?'<div class="fx-due'+(pastTarget(ft)?' bad':'')+'">'+esc(due)+'</div>':'')+step+
      '<div class="fx-acts">'+qaBtns(ft,2)+'<button class="btn" type="button" data-open="'+esc(ft.id)+'">Open Details</button>'+(n>1?'<button class="btn ghost" type="button" id="fxskip">Next One →</button>':'')+'</div></div>'+
      '<div class="fx-r"><div class="ring" style="--p:'+Math.round(n/Math.max(1,n+facT.length)*100)+'"><b data-n="'+n+'">'+n+'</b><span>waiting on '+esc(who)+'</span></div>'+
      (rest.length?'<div class="fx-then"><div class="fx-th">Then</div>'+rest.map(t=>'<button type="button" class="fx-row" data-open="'+esc(t.id)+'"><i style="background:'+stageDef(t.stage).color+'"></i><span><b>'+esc(t.wr)+'</b> '+esc(t.name)+'</span>'+heat(t)+'</button>').join('')+'</div>':'<div class="fx-then"><div class="fx-th">Also Moving</div><div class="fx-mini"><span><b>'+withRev.length+'</b> with reviewers</span><span><b>'+withGov.length+'</b> with '+esc(govName())+'</span><span><b>'+out.length+'</b> out the door</span></div></div>')+'</div></div>';
  } else {
    const archN=Object.values(S.arch||{}).filter(a=>(isRole('pm',me)&&a.status==='Requested')||(isRole('architect',me)&&['Approved','In Progress'].includes(a.status)&&sameName(a.assignedTo,nm))).length;
    hero='<div class="focus clear"><div class="fx-l"><div class="okmark"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><div><h2>'+(archN?archN+' Architecture Help task'+(archN===1?' is':'s are')+' waiting on '+esc(who):(S.viewAs?esc(who)+' Is':'You’re')+' All Caught Up')+'</h2><p>'+(archN?'They’re below. No work request is due from '+esc(who)+' this week.':'Nothing is due from '+esc(who)+' this week.')+(later.length?' Next up: <b>'+esc(later[0].wr)+'</b> '+esc(later[0].name)+((later[0].dates||{}).targetIM?', Target to IM '+esc(fmt(later[0].dates.targetIM)):'')+'.':'')+(facT.length?' '+qWhere(facT,[[withRev,'with reviewers'],[withGov,'with '+govName()],[out,'out the door'],[held,'on hold']],S.viewAs?'Their':'Your'):'')+'</p></div></div></div>';
  }
  let team='';
  if(S.isStaff&&!S.viewAs){
    const pm=new Map(); const addP=(p,r)=>{ if(!p||!p.name) return; const k=p.name.toLowerCase(); const x=pm.get(k)||Object.assign({rs:[]},p); if(!x.rs.includes(r)) x.rs.push(r); pm.set(k,x); };
    (S.people.facilitators||[]).forEach(p=>addP(p,'Facilitator')); Object.entries(S.people.roles||{}).forEach(([r,L])=>(L||[]).forEach(p=>addP(p,ROLE_LABEL[r]||r)));
    const ppl=[...pm.values()].map(p=>Object.assign(p,{r:p.rs.join(' · ')}));
    const byFirst=(a,b)=>firstName(a.p.name).localeCompare(firstName(b.p.name))||a.p.name.localeCompare(b.p.name);

    const facs=all.filter(x=>x.fac&&(x.q.length||x.live)).sort(byFirst), staff=all.filter(x=>!x.fac&&!x.p.rs.every(r=>['Architect','IM Reviewer','Workgroup'].includes(r))).sort(byFirst); // architects work in Architecture Help, IM reviewers in IM Review
    const card=x=>{ const late=x.q.filter(pastTarget).length, me=sameName(x.p.name,S.me.name);
      return '<button type="button" class="tm" data-peek="'+(me?'':esc(x.p.name))+'">'+av(x.p.name)+'<span class="tm-n"><b>'+esc(x.p.name)+(me?' (you)':'')+'</b><em>'+esc(x.p.r)+'</em></span><span class="tm-q'+(x.q.length?' on':'')+'" title="'+x.q.length+' work request'+(x.q.length===1?' is':'s are')+' waiting on '+esc(firstName(x.p.name))+' to do the next step"><b>'+x.q.length+'</b>waiting on '+esc(me?'you':firstName(x.p.name))+'</span><span class="tm-s">'+[late?'<b class="bad">'+late+' past target</b>':'',x.live?x.live+' live work request'+(x.live===1?'':'s')+' in all':''].filter(Boolean).join(' · ')+'</span></button>'; };
    if(facs.length||staff.length) team='<div class="secthead"><h2>Everyone’s Queue</h2><span class="muted" style="font-size:12.5px">Click a person to see their queue the way they see it.</span></div>'+

  const isFac=facT.length>0||(S.people.facilitators||[]).some(f=>sameName(f.name,nm)), solo=!isFac&&!later.length;
  const lanes=showLanes?'<div class="secthead"><h2>'+(S.viewAs?esc(who)+'’s':'Your')+' Work, Wherever It Is</h2>'+qSortBar(me)+'</div>'+lanesHtml('mine',[
    {key:'yours',title:'Your Move',n:yours.length,c:'var(--c4)',cls:solo?'wide':'',items:yours.map((t,i)=>card2(t,{next:true,act:true,focus:t===ft,i})),empty:'Nothing due this week'},

    !isFac?null:{key:'gov',title:'With '+govName(),n:withGov.length,c:'var(--c5)',sub:'Waiting on Governance',items:withGov.map((t,i)=>card2(t,{next:true,stage:true,i}))},
    !isFac?null:{key:'out',title:'Out the Door',n:out.length,c:'var(--c6)',sub:'Comment, release and more',items:out.map((t,i)=>card2(t,{next:true,stage:true,i}))},
    held.length?{key:'hold',title:'On Hold',n:held.length,c:'var(--hold)',items:held.map((t,i)=>card2(t,{next:true,i}))}:null],'var(--lt-mine)'):'';
  return '<div class="pagehead slim"><div><div class="eyebrow">'+esc(nm)+'</div><h1>My Queue</h1></div>'+(S.viewAs?'<div class="acts"><button class="btn" type="button" data-peek="">← Back to My Own Queue</button></div>':'')+'</div>'+hero+archMine(me)+lanes+team;
};

/* "Your other work request is out the door." / "Your other 3 work requests: 1 with reviewers and 2 out the door." */
function qWhere(all,groups,pos){ const g=groups.filter(x=>x[0].length); if(!g.length) return '';
  if(all.length===1) return pos+' other work request is '+esc(g[0][1])+'.';

VIEWS.comment=function(){
  const td=today(), lk=(S.lens||{}).cp||'';
  const open=allTickets().filter(t=>t.stage==='comment'&&t.state==='active'&&t.sub!=='setup'&&t.dates&&t.dates.commentStart&&t.dates.commentEnd).sort((a,b)=>a.dates.commentEnd.localeCompare(b.dates.commentEnd));
  const closed=allTickets().filter(t=>!open.includes(t)&&t.dates&&t.dates.commentStart&&t.dates.commentEnd&&t.dates.commentEnd<td&&daysBetween(t.dates.commentEnd,td)<=45).sort((a,b)=>b.dates.commentEnd.localeCompare(a.dates.commentEnd));
  const setup=liveTickets().filter(t=>t.stage==='comment'&&t.sub==='setup');
  const soon=open.filter(t=>daysBetween(td,t.dates.commentEnd)<=7), next=open[0];
  const figs=lens('cp',[{key:'open',k:'Open Now',v:open.length,s:next?'Next closes '+fmtS(next.dates.commentEnd):'None open',c:'var(--c6)'},{key:'soon',k:'Closing in 7 Days',v:soon.length,s:'Facilitators report back the day after',c:'var(--c4)',cls:soon.length?'warnf':''},{key:'setup',k:'Not Posted Yet',v:setup.length,s:'Approved for comment',c:'var(--warn)'},{key:'closed',k:'Closed, Last 45 Days',v:closed.length,s:'Now in Post-Comment or later',c:'var(--ink-3)'}]);
  const head='<div class="pagehead slim"><div><h1>Comment Periods</h1><div class="sub">What’s open for comment, what just closed, and what’s approved but not posted yet. Click a figure to narrow the view.</div></div></div>'+figs;
  const sdp=pageOf('cp-side',setup,fitN(480,190,2));
  const side=setup.length?'<section class="pane cp-side"><header><h3>Approved, Not Posted Yet</h3><span class="chip warn">'+setup.length+'</span></header><div class="pane-b">'+sdp.items.map((t,i)=>card2(t,{next:true,act:true,i})).join('')+'</div>'+sdp.bar+'</section>':'';
  if(lk==='setup') return head+(side||'<div class="empty">Everything approved for comment is posted.</div>');
  let rows=lk==='open'?open:lk==='soon'?soon:lk==='closed'?closed:[...open,...closed];
  if(!rows.length) return head+'<div class="cp-wrap'+(side?' has-side':'')+'"><div class="empty">No comment periods match.</div>'+side+'</div>';
  const lo=addDays([td,...rows.map(t=>t.dates.commentStart)].sort()[0],-3), hi=addDays([addDays(td,14),...rows.map(t=>t.dates.commentEnd)].sort().slice(-1)[0],3);
  const span=Math.max(1,daysBetween(lo,hi)), X=d=>Math.max(0,Math.min(100,daysBetween(lo,d)/span*100));
  const ticks=[]; { const d=toD(lo); d.setDate(1); d.setMonth(d.getMonth()+1); while(ymd(d)<=hi){ ticks.push(ymd(d)); d.setMonth(d.getMonth()+1); } }
  const axis='<div class="cp-axis"><div></div><div class="cp-scale">'+ticks.filter(m=>Math.abs(X(m)-X(td))>5).map(m=>'<span style="left:'+X(m)+'%">'+MON[toD(m).getMonth()]+'</span>').join('')+'<span class="cp-today" style="left:'+X(td)+'%">Today</span></div></div>';
  const row=t=>{ const d=t.dates, isOpen=open.includes(t), l=X(d.commentStart), w=Math.max(1.2,X(d.commentEnd)-l), n=daysBetween(td,d.commentEnd), right=l+w<78, pct=isOpen?Math.max(0,Math.min(100,daysBetween(d.commentStart,td)/Math.max(1,daysBetween(d.commentStart,d.commentEnd))*100)):100;
    return '<div class="cp-row" data-open="'+esc(t.id)+'"><div class="cp-name">'+av(t.facilitator,'xs')+'<span><b>'+esc(t.name)+'</b><span>'+esc(t.wr)+' · '+esc(cpName(t)!==t.name?'Page: '+cpName(t):(t.facilitator||''))+'</span></span></div><div class="cp-track">'+ticks.map(m=>'<i class="cp-grid" style="left:'+X(m)+'%"></i>').join('')+'<i class="cp-now" style="left:'+X(td)+'%"></i><div class="cp-bar '+(isOpen?'open':'closed')+(isOpen&&n<=7?' soon':'')+'" style="left:'+l+'%;width:'+w+'%"><span class="cp-fill" style="width:'+pct+'%"></span></div><span class="cp-lab '+(right?'r':'l')+'" style="'+(right?'left:calc('+(l+w)+'% + 8px)':'right:calc('+(100-l)+'% + 8px)')+'">'+(isOpen?'<b>'+(n<=0?'Closes today':n+' day'+(n===1?'':'s')+' left')+'</b> · ':'')+esc(fmtS(d.commentStart))+' to '+esc(fmtS(d.commentEnd))+'</span></div></div>'; };
  const cpp=pageOf('cp-rows:'+lk,rows,fitN(500,50,5)), vis=cpp.items;
  const o2=vis.filter(t=>open.includes(t)), c2=vis.filter(t=>!open.includes(t));
  return head+'<div class="cp-wrap'+(side?' has-side':'')+'"><div class="card cp"><h3>Comment Period Timeline<span class="sp cp-key"><span><i class="open"></i>Open now</span>'+(o2.some(t=>soon.includes(t))?'<span><i class="soon"></i>Closing in 7 days</span>':'')+'<span><i class="closed"></i>Closed in the last 45 days</span><span><i class="now"></i>Today</span></span></h3>'+axis+'<div class="cp-scroll">'+
    (o2.length?'<div class="cp-grp">Open Now</div>'+o2.map(row).join(''):'')+(c2.length?'<div class="cp-grp">Recently Closed</div>'+c2.map(row).join(''):'')+'</div>'+cpp.bar+'</div>'+side+'</div>';

    const step=now=>{ const p=Math.min(1,(now-t0)/dur); el.textContent=Math.round(end*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); }; el.textContent='0'; requestAnimationFrame(step); });
}

   The Line: one picture of the whole process, built from Settings.
   Used on the Overview ("How It All Connects") and as the heart of the
   Pipeline Board. Stage names, owners, colors, on/off and custom stages

function ownerName(s){ return s.owner==='gov'?govName():s.owner==='imawg'?'IM and AWG':(ROLE_LABEL[s.owner]||'MISMO Staff'); }
function metro(o){
  o=o||{}; const L=o.L||liveTickets(), st=stages(), td=today();
  const hc=hubCounts(), hubOn=!!S.hub;
  const nodes=[];
  if(o.hub){
    nodes.push({key:'hub-new',name:'Request Submitted',owner:'Initiative Hub',n:hubOn?hc.confirm:null,ext:'hub',c:'#7794aa',desc:'Someone submits a work request in the Initiative Hub and MISMO staff confirm it.',hub:1});
    nodes.push({key:'hub-bet',name:proc().gov==='RSGC'?'BET Approval':'BET Approval',owner:'BET',n:hubOn?hc.queue:null,ext:'hub',c:'#7794aa',desc:'The Business Executive Team approves it. Once approved, it lands here in the MMS on its own.',hub:1});
  }
  st.forEach(s=>{ const ts=L.filter(t=>t.stage===s.key); nodes.push({key:s.key,name:s.name,owner:ownerName(s),n:ts.length,c:s.color||'#2477b8',desc:s.desc||'',late:ts.filter(t=>heatLevel(t)===2).length,hold:ts.filter(t=>t.state==='hold').length,oldest:ts.reduce((m,t)=>Math.max(m,stageAge(t)||0),0),stage:1}); });
  if(o.pub){ const n=allTickets().filter(t=>t.state==='published'&&((t.dates&&t.dates.published)||'')>=addDays(td,-365)).length; nodes.push({key:'published',name:'Published',owner:'Last 12 months',n,ext:'pub',c:'#0f7b5c',desc:'Out the door: posted on the standards page and announced.',pub:1}); }
  const N=nodes.length, max=Math.max(1,...nodes.filter(x=>x.stage).map(x=>x.n||0));
  const X=i=>((i+.5)/N*100);
  const firstStage=nodes.findIndex(x=>x.stage), lastStage=nodes.length-1-[...nodes].reverse().findIndex(x=>x.stage);
  const tracks=(o.hub&&firstStage>0?'<i class="mt-tr hubtr" style="left:'+X(0)+'%;width:'+(X(firstStage)-X(0))+'%"></i>':'')+
    '<i class="mt-tr live" style="left:'+X(firstStage)+'%;width:'+(X(lastStage)-X(firstStage))+'%"></i>'+
    (o.pub?'<i class="mt-tr pubtr" style="left:'+X(lastStage)+'%;width:'+(X(N-1)-X(lastStage))+'%"></i>':'');
  const node=(x,i)=>{ const sz=x.n?Math.round(34+Math.min(22,Math.sqrt(x.n/max)*22)):26;
    const cls=['mn',x.n?'':'z',o.sel===x.key?'on':'',x.late?'hot':'',x.hub?'ext':'',x.pub?'pub':''].filter(Boolean).join(' ');
    const tip='<span class="mn-tip"><b>'+esc(x.name)+'</b><em>'+esc(x.owner)+'</em>'+(x.desc?'<span>'+esc(x.desc)+'</span>':'')+(x.stage?'<span class="mn-tf">'+(x.n?x.n+' here'+(x.oldest?' · oldest '+ageTxt(x.oldest):'')+(x.late?' · <b class="bad">'+x.late+' overdue</b>':''):'Nothing here right now')+'</span>':'')+'</span>';
    return '<button type="button" class="'+cls+'" '+(x.ext?'data-mext="'+x.ext+'"':'data-mst="'+x.key+'"')+' style="--sc:'+x.c+';--sz:'+sz+'px;--d:'+(i*40)+'ms"><span class="mn-dot"><b'+(x.n?' data-n="'+x.n+'"':'')+'>'+(x.n==null?'—':x.n)+'</b>'+(x.late?'<i class="mn-late" title="'+x.late+' overdue">'+x.late+'</i>':'')+'</span><span class="mn-l">'+esc(x.name)+'</span><span class="mn-o">'+esc(x.owner)+'</span>'+tip+'</button>'; };
  // phase brackets along the bottom
  const groups=[]; nodes.forEach((x,i)=>{ const g=x.hub?{k:'hub',n:'Initiative Hub',c:'#7794aa'}:x.pub?{k:'pub',n:'Done',c:'#0f7b5c'}:(()=>{ const p=PHASES.find(p=>p.key===phaseOf(x.key)); return {k:p.key,n:p.name,c:p.c}; })(); const last=groups[groups.length-1]; if(last&&last.k===g.k) last.span++; else groups.push(Object.assign({start:i+1,span:1},g)); });
  const ph='<div class="mt-ph">'+groups.map(g=>'<span style="grid-column:'+g.start+' / span '+g.span+';--lc:'+g.c+'">'+esc(g.n)+'</span>').join('')+'</div>';
  return '<div class="metro'+(o.drop?' can-drop':'')+'" style="--n:'+N+'"><div class="mt-row">'+tracks+nodes.map(node).join('')+'</div>'+ph+'</div>';

/* ---------- Meeting Trackers and Service Orders, read for the digest ---------- */
const MT_KEY=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function mtHash8(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return ('0000000'+h.toString(36)).slice(-8); }
function mtSafe(s){ return String(s).toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/-{3,}/g,'--').replace(/^-+|-+$/g,'')||'x'; }
function mtFile(s){ s=mtSafe(s); return s.length<=40?s:s.slice(0,31).replace(/-+$/,'')+'-'+mtHash8(s); }
async function gunzipB64(b64){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); }
let digestSrc=null, digestSrcAt=0;
async function loadDigestSources(force){
  if(!force&&digestSrc&&Date.now()-digestSrcAt<10*60000) return digestSrc;
  const out={mt:null,hours:{},comments:S.comments||[],note:[]};
  if(S.mode!=='relay'){ out.note.push('Meeting attendance and hours come in on the live MMS at resources.mismo.org.'); digestSrc=out; digestSrcAt=Date.now(); return out; }
  try{
    const base=await rGet('meeting-trackers','baseline'); const B=base&&base.data&&base.data.doc&&base.data.doc.z?await gunzipB64(base.data.doc.z):null;
    const groups={}, sched={}, logged={};
    if(B){ const gks=B.groups.map(x=>MT_KEY(x[0])); B.groups.forEach((x,i)=>{ groups[gks[i]]={name:x[0],archived:!!x[2],facilitator:x[3]||''}; }); Object.assign(sched,B.sched||{}); B.meetings.forEach(m=>{ const k=gks[m[0]]; (logged[k]=logged[k]||{})[m[1]]=1; }); }
    const sd=await rGet('meeting-trackers','sched'); Object.entries(((sd&&sd.data.docs['sched/all'])||{}).items||{}).forEach(([k,v])=>{ sched[k]=v.removed?{removed:true}:Object.assign({},sched[k]||{},v); });
    const gd=await rGet('meeting-trackers','groups'); Object.entries(((gd&&gd.data.docs['groups/all'])||{}).items||{}).forEach(([k,v])=>{ groups[k]=Object.assign({},groups[k]||{},v); });
    const idx=await rGet('meeting-trackers','own-index'); const yr=new Date().getFullYear();
    const want=Object.keys((idx&&idx.data.docs)||{}).filter(p=>{ const id=p.split('/')[1]||''; const k=id.split('__')[0], y=+id.split('__')[1]; const sc=sched[k]; return y>=yr-1&&sc&&!sc.removed&&sc.rule; });
    await Promise.all(want.map(async p=>{ const id=p.split('/')[1]; const d=await rGet('meeting-trackers',mtFile('m-'+id)); const items=(d&&d.data&&d.data.doc&&d.data.doc.items)||{}; const k=id.split('__')[0]; Object.keys(items).forEach(dt=>{ (logged[k]=logged[k]||{})[dt]=1; }); }));
    const G={}; Object.entries(sched).forEach(([k,v])=>{ const g=groups[k]||{}; G[k]={name:g.name||v.sheetName||k,fac:v.fac||g.facilitator||'',rule:v.rule,en:v.en,removed:!!v.removed,hold:!!g.hold,archived:!!g.archived}; });
    out.mt={groups:G,logged};
  }catch(e){ out.note.push('Meeting Trackers could not be read just now.'); }
  try{
    const V=['actualize','falcon','phoenix','trex','trudigital','vianteye'], y=new Date().getFullYear(), fys=['fy'+(y+1),'fy'+y];
    const known=(S.digestCfg&&S.digestCfg.hoursVendor)||{};
    await Promise.all((S.people.facilitators||[]).map(async p=>{ const slug=String(p.name).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      const order=known[p.name]?[known[p.name]].concat(V.filter(v=>v!==known[p.name])):V;
      for(const v of order){ for(const fy of fys){ const f=await rFile('so-'+v,'hours/'+slug+'-'+fy+'.json'); if(f&&f.weeks){ out.hours[p.name]=f; known[p.name]=v; return; } } } }));
    out.hoursVendor=known;
  }catch(e){ out.note.push('Service Orders hours could not be read just now.'); }
  digestSrc=out; digestSrcAt=Date.now(); return out;
}
function digestInput(src,now){ return {now:now||new Date(),tickets:S.tickets,process:S.process,people:S.people,arch:S.arch,media:S.media,comments:((src&&src.comments)||S.comments||[]).filter(c=>!cmIsTest(c)),mt:src&&src.mt,hours:src&&src.hours,settings:S.digestCfg,moveFor:(t,p)=>waitingOn(t,p)?(whoseMove(t).text||'Your move'):null}; }
async function sendDigests(list,why){
  let n=0; for(const m of list){ if(!m.to.length) continue; if(m.empty&&MMSDigest.settings(S.digestCfg).skipEmpty) continue;
    await queueMail({to:m.to,cc:m.cc,subject:m.subject,body:m.text,html:m.html,kind:'digest',key:'digest-'+m.name+'-'+today()+(why==='test'?'-test-'+Date.now():'')}); n++; }
  return n;
}

function autoLinks(t){

  /* anything the same workgroup already has on another work request */
  const sib=allTickets().filter(x=>x.id!==t.id&&x.workgroup&&x.workgroup===t.workgroup&&x.links);
  ['workgroupPage','connect'].forEach(k=>{ const hit=sib.find(x=>x.links[k]); if(hit) set(k,hit.links[k]); });
  /* the product page, when its name is already a web address */
  if(/^https?:\/\//i.test(t.productPageName||'')) set('productPage',t.productPageName);
  /* announcements, from MISMO Media once they carry a link */
  Object.values(S.media||{}).filter(m=>m.ticket===t.id&&m.link).forEach(m=>{ if(/comment/i.test(m.kind+' '+m.text)) set('newsComment',m.link); else if(/release|final|publish|announce/i.test(m.kind+' '+m.text)) set('newsFinal',m.link); });
  /* the comment form, for anything at or past comment */

  if(t.hubId) set('hub','https://resources.mismo.org/initiative-hub/work-requests.html#'+encodeURIComponent(t.hubId));

function etYmd(off){ const n=new Date(Date.now()+(off||0)*864e5); return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(n); }

// Meeting Trackers and the MMS don't always spell a workgroup the same way
// ("VA Docs to Data DWG" vs "VA Documents to Data DWG"), so match on the words.
const MT_STOP=new Set(['the','and','of','to','for','a','an','in','on','cop','dwg','workgroup','community','practice','development','task','force','group','wg']);
function mtWords(s){ return String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/&/g,' and ').split(/[^a-z0-9]+/).filter(w=>w&&!MT_STOP.has(w)).map(w=>w.slice(0,3)); }
function mtGroupFor(t){
  if(!mtLite||!t.workgroup) return null;
  const L=Object.values(mtLite).filter(x=>x.rule&&!x.off); const mk=MT_KEY(t.workgroup), k=gnorm(t.workgroup);
  const exact=L.find(x=>x.key===mk||gnorm(x.name)===k||gnorm(x.key)===k); if(exact) return exact;
  const A=new Set(mtWords(t.workgroup)); if(!A.size) return null;
  let best=null, bs=0;
  L.forEach(x=>{ const B=new Set(mtWords(x.name)); if(!B.size) return; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); let sc=n/(A.size+B.size-n); if(sc>bs){ bs=sc; best=x; } });
  return bs>=.75?best:null;

function nextMeeting(t){

  for(let i=0;i<75;i++){ const d=etYmd(i); if(i===0&&nowMin>=endMin) continue; if(meetsOnRule(g.rule,d)) return {date:d,name:/^[a-z0-9]+$/.test(g.name)?t.workgroup:g.name,st:g.st,en:g.en,time:g.time,zoom:g.zoom}; }
  return null;
}

function relDays(d){ const n=daysBetween(today(),d); if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday'; return n>0?'In '+n+' days':Math.abs(n)+' days ago'; }

/* ---------- the timeline, like the Hub's deliverables chart ---------- */
function wrTimeline(t){
  const d=t.dates||{}, td=today();
  const ev=[
    ['submitted','Submitted','dot'],['bet','Approved','dot'],['workStart','Work Started','start'],['aiSubmitted','AI Review','ring'],
    ['imSubmitted','Submitted to IM','ring'],['commentStart','Comment Opens','dia'],['commentEnd','Comment Ends','dia2'],['published','Published','fin']
  ].filter(([k])=>d[k]).map(([k,l,c])=>({k,l,c,d:d[k]}));
  const tgt=d.targetIM&&!d.imSubmitted?d.targetIM:null;
  if(!ev.length&&!tgt) return '';
  const all=[...ev.map(e=>e.d),tgt,td].filter(Boolean).sort();
  const lo=addDays(all[0],-10), hi=addDays(all[all.length-1],14);
  // time runs left to right, but long quiet stretches are shortened and close events get room,
  // so a few busy weeks followed by months of work don't squash into one end
  const pts=[...new Set([lo,...all,hi])].sort(), gaps=pts.slice(1).map((p,i)=>Math.max(1,daysBetween(pts[i],p))), wts=gaps.map(g=>Math.max(2.2,Math.sqrt(g)));
  const tot=wts.reduce((a,b)=>a+b,0), acc=[0]; wts.forEach(w=>acc.push(acc[acc.length-1]+w/tot*100));
  const X=x=>{ if(x<=pts[0]) return 0; for(let i=1;i<pts.length;i++){ if(x<=pts[i]) return acc[i-1]+(acc[i]-acc[i-1])*(daysBetween(pts[i-1],x)/Math.max(1,gaps[i-1])); } return 100; };
  const years=[]; for(let y=+lo.slice(0,4)+1;y<=+hi.slice(0,4);y++) years.push(y);
  const durTxt=n=>n>=365?(Math.round(n/36.5)/10)+' yr':n>=60?Math.round(n/30.4)+' mo':n>=14?Math.round(n/7)+' wk':n+' d';
  const gapLabs=all.slice(1).map((p,i)=>{ const n=daysBetween(all[i],p); if(n<45||all[i]===p) return ''; const a=X(all[i]), b=X(p); if(b-a<9) return ''; return '<span class="tl-gap" style="left:'+((a+b)/2)+'%">'+durTxt(n)+'</span>'; }).join('');
  const startD=(ev.find(e=>e.k==='workStart')||ev.find(e=>e.k==='bet')||ev[0]||{}).d||td;
  const endD=d.published||td;
  const items=ev.slice(); if(tgt) items.push({k:'tgt',l:'Target to IM',c:'tgt'+(pastTarget(t)?' late':''),d:tgt});
  items.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  // markers that sit close together share one label, so nothing overlaps
  const groups=[]; items.forEach(e=>{ const x=X(e.d), g=groups[groups.length-1]; if(g&&x-g.x0<12) g.items.push(e); else groups.push({x0:x,items:[e]}); });
  const marks=groups.map((g,gi)=>{ const A=g.items, a=A[0], z=A[A.length-1], cx=(X(a.d)+X(z.d))/2;
    const lbl=(A.length===2&&a.k==='commentStart'&&z.k==='commentEnd')?'Comment Period':A.length===1?esc(a.l):A.length===2?esc(a.l)+' & '+esc(z.l):esc(a.l)+' → '+esc(z.l);
    const when=a.d===z.d?esc(fmtS(a.d)):esc(fmtS(a.d))+' – '+esc(fmtS(z.d));
    const edge=cx<8?' edge-l':cx>92?' edge-r':'';
    return A.map(e=>'<span class="tl-m '+e.c+'" style="left:'+X(e.d)+'%" title="'+esc(e.l+' · '+fmt(e.d))+'"><i></i></span>').join('')+
      '<span class="tl-lab r'+(gi%2)+edge+(A.some(e=>/late/.test(e.c))?' late':'')+'" style="left:'+cx+'%" title="'+esc(A.map(e=>e.l+' '+fmt(e.d)).join(' · '))+'">'+lbl+'<small>'+when+'</small></span>'; }).join('');
  return '<div class="psec full wh-tl"><h4>Progress over Time<span class="sp tl-key"><span><i class="k-start"></i>Work started</span><span><i class="k-dia"></i>Comment</span><span><i class="k-ring"></i>Review</span><span><i class="k-fin"></i>Published</span><span><i class="k-tgt"></i>Target</span></span></h4>'+
    '<div class="tl"><div class="tl-yrs">'+years.map(y=>'<span style="left:'+X(y+'-01-01')+'%">'+y+'</span>').join('')+'</div>'+
    '<div class="tl-track" style="left:'+X(all[0])+'%"></div><div class="tl-bar" style="left:'+X(startD)+'%;width:'+Math.max(.5,X(endD)-X(startD))+'%"></div>'+gapLabs+marks+
    (!d.published?'<span class="tl-today" style="left:'+X(td)+'%"><b>Today</b></span>':'')+'</div></div>';
}

async function rvUnzip(buf){
  const u=new Uint8Array(buf), dv=new DataView(buf); let e=u.length-22;

  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){ const meth=dv.getUint16(p+10,true), csz=dv.getUint32(p+20,true), fnl=dv.getUint16(p+28,true), exl=dv.getUint16(p+30,true), cml=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    files[new TextDecoder().decode(u.subarray(p+46,p+46+fnl))]={meth,csz,lho}; p+=46+fnl+exl+cml; }
  const get=async name=>{ const f=files[name]; if(!f) return null; const l=f.lho, a=l+30+dv.getUint16(l+26,true)+dv.getUint16(l+28,true); const data=u.subarray(a,a+f.csz);
    if(f.meth===0) return new TextDecoder().decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); };
  return {names:Object.keys(files),get};
}

let rvPdfLib=null;
function rvLoadPdfJs(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib); if(rvPdfLib) return rvPdfLib;
  rvPdfLib=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); }catch(e){ rej(e); } }; s.onerror=()=>{ rvPdfLib=null; rej(new Error('The PDF reader couldn’t load. Save the PDF as Word and try again.')); }; document.head.appendChild(s); });

    tc.items.forEach(it=>{ const y=Math.round(it.transform[5]), h=Math.abs(it.transform[3])||10; if(last&&Math.abs(last.y-y)<h*0.5){ last.t+=(last.t.endsWith(' ')||it.str.startsWith(' ')?'':' ')+it.str; } else { last={y,h,t:it.str}; lines.push(last); } });

    pages.push({n:i,top:(lines[0]||{}).t||'',bottom:(lines[lines.length-1]||{}).t||''}); }

}
async function rvReadFile(f){
  const buf=await f.arrayBuffer(), ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf') return Object.assign(await rvReadPdf(buf),{name:f.name});
  if(ext==='docx') return Object.assign(await rvReadDocx(buf),{name:f.name});
  if(ext==='xlsx'||ext==='xlsm') return Object.assign(await rvReadXlsx(buf),{name:f.name});
  if(ext==='txt'||ext==='md'||ext==='csv') return {kind:'text',name:f.name,text:await f.text()};

}

/* ---------- small text helpers ---------- */
const rvNorm=s=>String(s||'').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const rvWords=s=>rvNorm(s).replace(/[^a-z0-9' ]/g,' ').split(' ').filter(Boolean);
function rvSim(a,b){ const A=new Set(rvWords(a)), B=new Set(rvWords(b)); if(!A.size||!B.size) return 0; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n/Math.max(A.size,B.size); }
function rvWordDiff(expected,actual){ const A=rvWords(actual), E=rvWords(expected); const a=new Set(A), e=new Set(E); return {missing:[...new Set(E.filter(w=>!a.has(w)))].slice(0,12),extra:[...new Set(A.filter(w=>!e.has(w)))].slice(0,12)}; }
const RV_YEAR=()=>String(new Date().getFullYear());
const rvQ=s=>'“'+String(s||'').replace(/\s+/g,' ').trim().slice(0,90)+(String(s||'').length>90?'…':'')+'”';

/* ---------- which boilerplate this work request needs now ---------- */
const RV_BP_LABEL={draft:'DRAFT','comment':'IPR/COMMENT PERIOD','commercial-standard':'Commercial Distributor – Standard','commercial-collateral':'Commercial Distributor – Collateral','internal-standard':'Internal Use Only – Standard','internal-collateral':'Internal Use Only – Collateral','noncommercial-standard':'Non-Commercial Distributor – Standard','noncommercial-collateral':'Non-Commercial Distributor – Collateral'};
function rvExpectedBoiler(t){
  const ci=stageIndex('comment'), si=stageIndex(t.stage);
  if(ci<0||si<0||si<ci) return 'draft';
  if(t.stage==='comment'||(t.stage==='gc-comment')) return 'comment';
  const ds=t.designation||{}, lic=String(ds.license||'').toLowerCase(), cls=String(t.classification||(typeof recommend==='function'?(recommend(t)||{}).classification:'')||'').toLowerCase().includes('standard')?'standard':'collateral';
  const l=/non/.test(lic)?'noncommercial':/internal/.test(lic)?'internal':/commercial/.test(lic)?'commercial':'';
  return l?l+'-'+cls:'comment';
}
function rvDetectBoiler(text){
  let best=null, bs=0; const T=rvNorm(text);
  Object.entries(RV_BOILER).forEach(([k,ps])=>{ const key=ps.slice(1).map(p=>rvNorm(p).slice(0,60)); const hits=key.filter(x=>T.includes(x)).length/key.length; if(hits>bs){ bs=hits; best=k; } });
  return bs>=0.34?best:null;
}

function rvEditorChecks(files,ctx){

        let best='', bs=0; body.forEach(x=>{ const s=rvSim(p,x.t); if(s>bs){ bs=s; best=x.t; } });

      else if(years.some(y=>y!==year)) add('fix','Copyright','The copyright year is '+years.join(' and ')+'.','Work products not yet published use the current year: ©'+year+'.',W,'cp-year');
      if(isW&&cp.length&&!f.hf.some(h=>h.kind==='footer'&&/©|copyright/i.test(h.t))) add('fix','Copyright','The copyright isn’t in the footer, so it won’t show on every page.','Put the copyright line in the footer.',W,'cp-footer');

      if(!f.hf.some(h=>h.kind==='footer'&&h.page)) add('fix','Header and Footer','No page numbers were found in the footer.','Add page numbers to every page except the title page.',W,'pg');
      else if(isW&&!f.titlePg) add('recommend','Header and Footer','The title page may be showing a page number.','Turn on “Different First Page” so the title page has no number.',W,'pg-title');

      const hid=f.sheets.filter(s=>s.state!=='visible'); if(hid.length) add('question','Excel Setup','Hidden tabs: '+hid.map(s=>s.name).join(', ')+'.','Should these be published, removed, or left hidden?',W,'xl-hidden');
    }

function rvRepairJson(t){
  t=String(t||''); const a=t.indexOf('{'); if(a<0) return null; t=t.slice(a);
  try{ return JSON.parse(t.slice(0,t.lastIndexOf('}')+1)); }catch(e){}
  const st=[]; let inS=false, esc2=false, lastSafe=-1, safeStack=null;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(inS){ if(esc2) esc2=false; else if(c==='\\') esc2=true; else if(c==='"') inS=false; continue; }
    if(c==='"'){ inS=true; continue; }
    if(c==='{'||c==='[') st.push(c==='{'?'}':']');
    else if(c==='}'||c===']'){ st.pop(); if(st.length){ lastSafe=i; safeStack=st.slice(); } } }
  if(lastSafe<0) return null;
  try{ return JSON.parse(t.slice(0,lastSafe+1)+safeStack.reverse().join('')); }catch(e){ return null; }
}

/* ---------- Reviews and Decisions, step by step ---------- */
function rdPast(t,key){ const a=stageIndex(key), b=stageIndex(t.stage); return a>=0&&b>a; }
function rdRow(name,chip,detail,extra){ return '<div class="rd-row"><div class="rd-n">'+esc(name)+'</div><div class="rd-s">'+chip+'</div><div class="rd-d">'+(detail||'')+'</div>'+(extra?'<div class="rd-x">'+extra+'</div>':'')+'</div>'; }
const RD_BEFORE='<span class="chip rd-before" title="This step happened before the MMS, so the MMS has no record of it">Before the MMS</span>';
stagePanel=function(t){ const rows=[], sub=t.sub||'', d=t.dates||{};
  if(t.cfp&&t.cfp.needed) rows.push(rdRow('Call for Participation',d.cfpPublished?'<span class="chip good">Published</span>':'<span class="chip warn">Needed</span>',d.cfpPublished?esc(fmtS(d.cfpPublished)):''));
  const ai=t.ai||{}, rounds=ai.rounds||[];
  if(rounds.length){ const r=rounds.at(-1); rows.push(rdRow('AI Review','<span class="chip '+(r.verdict==='ready'?'good':'warn')+'">'+(r.verdict==='ready'?'Ready':'Updates Suggested')+'</span>',esc(r.summary||''),rounds.map((x,i)=>'<button class="btn sm" data-aiview="'+i+'" type="button">Round '+(i+1)+' · '+esc(fmtS(atDay(x.at)))+'</button>').join(''))); }
  else if(t.stage==='aireview') rows.push(rdRow('AI Review',subChip(t)||'<span class="chip warn">Not run yet</span>',''));
  else if(rdPast(t,'aireview')) rows.push(rdRow('AI Review',RD_BEFORE,''));
  const rv=(k,nm)=>{ const o=t[k]||{}, st=plainCode(o.status), dd=d[k+'Decision'];
    if(t.stage===k) rows.push(rdRow(nm,subChip(t)||'<span class="chip info">In Review</span>',[d[k+'Submitted']?'Submitted '+fmtS(d[k+'Submitted']):'',o.resubs?o.resubs+' resubmission'+(o.resubs===1?'':'s'):''].filter(Boolean).map(esc).join(' · ')));
    else if(st||dd) rows.push(rdRow(nm,'<span class="chip '+(/approv|pass/i.test(st||'Decided')?'good':/return|denied|resub/i.test(st)?'warn':'')+'">'+esc(st||'Decided')+'</span>',[dd?'Decided '+fmtS(dd):'',o.resubs?o.resubs+' resubmission'+(o.resubs===1?'':'s'):''].filter(Boolean).map(esc).join(' · ')));
    else if(rdPast(t,k)) rows.push(rdRow(nm,RD_BEFORE,'')); };
  rv('im','IM Review'); rv('awg','AWG Review');
  const ds=t.designation||{}, approved=/Approved/i.test(ds.status||'');
  if(t.stage==='designation'||ds.type||ds.license){
    const chip=approved?'<span class="chip good">Designated</span>':t.stage==='designation'?(subChip(t)||'<span class="chip info">For Approval</span>'):'<span class="chip">Set</span>';
    const tiles='<div class="rd-tiles">'+[['Comment Type',ds.type],['Classification',t.classification],['License Usage',ds.license],['Royalty Status',ds.royalty],['Available To',ds.availableTo],['Comment Length',t.commentDays?t.commentDays+' days':'']].map(([l,v])=>'<div class="dg-f'+(v?'':' miss')+'"><label>'+esc(l)+'</label><b>'+esc(v||'Not set')+'</b></div>').join('')+'</div>';
    const deciding=t.stage==='designation'&&!approved; rows.push(rdRow('License Designation',chip,deciding?'Being decided: see License Designation above':d.designation&&approved?'Designated '+esc(fmtS(d.designation)):'',deciding?'':tiles)); }
  else if(rdPast(t,'designation')) rows.push(rdRow('License Designation',RD_BEFORE,''));
  (t.votes||[]).forEach(v=>rows.push(rdRow(stageDef(v.stage).name,'<span class="chip '+(v.outcome==='Approved'?'good':v.outcome==='Deferred'?'warn':'bad')+'">'+esc(v.outcome)+'</span>',esc([fmtS(v.date),v.method,v.tally].filter(Boolean).join(' · ')),Object.keys(v.members||{}).length?'<div class="muted" style="font-size:12px">'+esc(Object.entries(v.members).map(([n,x])=>n+': '+x).join(' · '))+'</div>':'')));
  if(t.commentReport) rows.push(rdRow('Comment Report','<span class="chip">'+esc(t.commentReport)+'</span>',''));

/* MISMO holidays (no IM or AWG call): MLK Day, Presidents' Day, Memorial Day, Juneteenth, Independence Day, Labor Day,
   Veterans Day, Thanksgiving and the day after, and Winter Break (Christmas Day through New Year's Day).
   A call that lands on one is skipped; if it is moved, Meeting Trackers logs the new date and it shows up from there. */
function mismoHoliday(ymd){ const d=new Date(String(ymd).slice(0,10)+"T12:00:00"); if(isNaN(d)) return false; const y=d.getFullYear(), m=d.getMonth(), day=d.getDate(), dow=d.getDay();
  const nth=(mo,wd,n)=>{ const f=new Date(y,mo,1,12); const off=(wd-f.getDay()+7)%7; return 1+off+(n-1)*7; }, last=(mo,wd)=>{ const l=new Date(y,mo+1,0,12); return l.getDate()-((l.getDay()-wd+7)%7); };
  const obs=(mo,dd)=>{ const x=new Date(y,mo,dd,12), w=x.getDay(); return w===6?[mo,dd-1]:w===0?[mo,dd+1]:[mo,dd]; };
  const is=(mo,dd)=>m===mo&&day===dd;
  if(is(0,nth(0,1,3))||is(1,nth(1,1,3))||is(4,last(4,1))||is(8,nth(8,1,1))) return true;
  for(const [mo,dd] of [[5,19],[6,4],[10,11]]){ const [a,b]=obs(mo,dd); if(is(a,b)) return true; }
  const tg=nth(10,4,4); if(is(10,tg)||is(10,tg+1)) return true;
  if((m===11&&day>=25)||(m===0&&day===1)) return true;
  return false; }
/* =====================================================================
   IM Review Desk. The IM Pre-Review drafts IM's decision for every row of the
   IM Submission Form (decision, comment, suggested wording). IM reviewers
   (People and Roles › IM Reviewer) open the draft, agree or correct each row,
   and finish. Their corrections teach the next draft; once a kind of row has
   matched IM's decisions often enough, staff can let those rows arrive
   already approved so reviewers only look at the exceptions.
   Data: imqueue/<report id> (the list), imr-<ticket>/<report id> (rows and
   decisions), imlearn-<year>/<report id>_<row> (what IM did with each draft),
   config/imauto (the kinds of rows that arrive already approved).
   ===================================================================== */
ROLE_LABEL.imreview='IM Reviewer';
const IMR_URL_NAV='https://resources.mismo.org/im-review/';
const IM_DEC=['Approved as Submitted','Approved with Modification','Returned','Denied','Withdrawn','Deferred'];
const IM_RANK={'Approved as Submitted':0,'Approved with Modification':1,'Deferred':2,'Returned':3,'Withdrawn':3,'Denied':4};
const IM_RULE={deny:['rm-exists','rm-cn-exists','rm-enum-exists','rm-ac-exists'],
  ret:['rm-missing','rm-cn-missing','rm-parent','rm-enum-dp','rm-enum-missing','rm-xpath','rm-rename-taken','ct','rm-type-enums','other-desc','xpath'],
  mod:['template','def-acr','def-impl','abbr','classword','normal-english','def-period','def-repeat','neg-ind','rm-old-def','dup'],
  look:['rm-similar','rm-enum-near','rm-deprecated','rm-already-there','rm-dep-already']};
