.widget > header .cnt{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface);border:1px solid var(--border);
  border-radius:3px;padding:0 5px;flex:0 0 auto}
.widget > header{cursor:grab}
.widget > header .grip{cursor:grab;color:var(--ink-3);display:inline-flex;align-items:center;flex:0 0 auto;opacity:.55}
.widget > header:hover .grip{opacity:1;color:var(--c1)}
.widget.dragging{opacity:.45}
.widget > header .grip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.widget > header .wacts{margin-left:auto;display:flex;gap:4px;align-items:center;flex:0 0 auto}
.widget .wbody{padding:14px;display:flex;flex-direction:column;gap:11px;min-height:0}
.linkcards{display:flex;flex-direction:column;gap:8px}
.lcard{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 8px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface-2);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600}
.lcard:hover{border-color:var(--border-strong);background:var(--surface-3)}
.lcard .ic{width:28px;height:28px;border-radius:6px;background:var(--lc,var(--c1));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:12px;font-weight:700}
.lcard small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.lcard .lflag{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;background:var(--warn-soft,var(--surface-3));color:var(--ink-2);
  border:1px solid var(--border-strong);vertical-align:1px}
.lcard .lflag.doc{background:var(--surface-3);color:var(--ink-3)}
.lcard .arr{margin-left:auto;color:var(--ink-3);font-size:16px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.stat span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.good b{color:var(--good)}
.addw{border:1px dashed var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--ink-2);
  padding:22px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;grid-column:span 4;display:flex;
  align-items:center;justify-content:center;gap:8px;min-height:90px}
.addw:hover{background:var(--surface-3);color:var(--ink);border-color:var(--c1)}
@media(max-width:760px){.addw{grid-column:span 12}}
.wpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:520px){.wpick{grid-template-columns:1fr}}
.wopt{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;padding:12px;text-align:left;
  color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.wopt:hover{border-color:var(--c1);background:var(--info-soft)}
.wopt b{font-size:13.5px;font-weight:700}
.wopt small{font-size:12px;color:var(--ink-2);line-height:1.4}

/* ---------- the panel chooser list ---------- */
.wlist{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:14px;padding:11px 13px;border:1px solid var(--border);
  border-radius:7px;background:var(--surface-2)}
.prow.is-on{border-color:var(--c1);background:var(--info-soft)}
.prow .wrt{min-width:0;flex:1}
.prow .wrt b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.prow .wrt small{display:block;font-size:12px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.prow .wra{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.btnrow.tiny button{min-height:28px;padding:0 10px;font-size:12px}
/* when the row sits in a view's header it lines up with the button next to it */
.vhead .btnrow.tiny button{min-height:32px}
@media(max-width:560px){.prow{flex-wrap:wrap}.prow .wra{width:100%;justify-content:flex-end}}

/* ---------- numbers out of the other systems ---------- */
.figgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(196px,100%),1fr));gap:10px}
.fig{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;padding:12px 13px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig:hover{border-color:var(--c1);background:var(--info-soft)}
.fig b{font-size:25px;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis}
.fig > span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fig small{font-size:11px;color:var(--ink-3);line-height:1.35}
.fig.stale b{color:var(--ink-3)}
.fig.stale small{color:var(--c4)}
.fig{padding:0;cursor:default;gap:0}
.fig:hover{border-color:var(--border);background:var(--surface-2)}
.fig .figv{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
  width:100%;background:none;border:0;padding:12px 13px 8px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.fig .figv:hover b{color:var(--c1)}
.fig .figv:focus-visible{outline:2px solid var(--c1);outline-offset:-2px;border-radius:7px}
.fig .figsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 13px 10px}
.fig .figsel select{flex:1 1 84px;min-width:0;font-size:11.5px;padding:4px 5px}
.fig .fignote{display:block;padding:0 13px 11px;font-size:11px;color:var(--ink-3);line-height:1.4}
.fig .fignote[hidden]{display:none}

/* ---------- expenses ---------- */
.exphead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.exphead{grid-template-columns:repeat(2,minmax(0,1fr))}}
.exptile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 15px;box-shadow:var(--shadow)}
.exptile b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.exptile span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px}
.exptile.warn b{color:var(--warn)} .exptile.bad b{color:var(--bad)} .exptile.good b{color:var(--good)}
.trip{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.triph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--rule);
  width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:var(--ink);font:inherit;cursor:pointer}
.triph:hover{background:var(--surface-3)}
.triph .tn{font-size:14px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.triph .tn small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:1px}
.triph .amt{margin-left:auto;font-size:16px;font-weight:700;white-space:nowrap}
.exprow{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;padding:9px 15px;border-bottom:1px solid var(--rule);
  width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.exprow:last-child{border-bottom:0}
.exprow:hover{background:var(--surface-2)}
.exprow .rc{width:30px;height:30px;border-radius:4px;overflow:hidden;background:var(--surface-3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.exprow .rc img{width:100%;height:100%;object-fit:cover;display:block}
.exprow .rc svg{width:15px;height:15px;fill:none;stroke:var(--ink-3);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.exprow .rc.none{background:var(--bad-soft)}
.exprow .rc.none svg{stroke:var(--bad)}
.exprow .ex b{display:block;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.exprow .ex small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.exprow .er{display:flex;align-items:center;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.exprow .ea{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.exprow.flag{background:var(--warn-soft)}
.exprow.flag:hover{background:var(--warn-soft);filter:brightness(.97)}
.rcpt{border:1px dashed var(--border-strong);border-radius:7px;background:var(--surface-2);padding:16px;text-align:center;cursor:pointer;display:block}
.rcpt:hover{border-color:var(--c1);background:var(--info-soft)}
.rcpt.has{padding:0;border-style:solid;overflow:hidden;background:var(--surface-3)}
.rcpt img{max-width:100%;max-height:260px;display:block;margin:0 auto}
.rcpt .ph{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink-2);font-size:13px;font-weight:600}
.rcpt .ph svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rcpt .ph small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.rcpt input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.policy{display:flex;flex-direction:column;gap:7px}
.policy .pl{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;padding:8px 12px;border-radius:0 5px 5px 0;border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--ink)}
.policy .pl.ok{border-color:var(--good);background:var(--good-soft)}
.policy .pl.bad{border-color:var(--bad);background:var(--bad-soft)}
.policy .pl svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.money{font-variant-numeric:tabular-nums}

/* ---------- misc ---------- */
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:9px 16px;border-radius:5px;font-size:13px;z-index:200;box-shadow:var(--shadow);max-width:90vw}
.toast{display:flex;align-items:center;gap:14px}
.toast-undo{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;
  border-radius:4px;padding:3px 11px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
.toast-undo:hover{background:rgba(255,255,255,.3)}
:root[data-theme="dark"] .toast-undo{background:rgba(6,32,47,.16);border-color:rgba(6,32,47,.4);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast-undo{background:rgba(6,32,47,.16);border-color:rgba(6,32,47,.4);color:var(--navy-deep)}}
/* the little x on a sticky: one click arms it, the next clears the note */
.sticky .sx{cursor:pointer;font-weight:700;border-radius:3px;padding:0 5px;line-height:1.5}
.sticky .sx:hover{background:rgba(0,0,0,.1)}
.sticky .sx.arm{background:#b3372c;color:#fff;font-size:10.5px;letter-spacing:.02em}
:root[data-theme="dark"] .toast{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--sky);color:var(--navy-deep)}}
.callout{border-left:3px solid var(--c1);background:var(--info-soft);padding:11px 15px;border-radius:0 6px 6px 0;font-size:13px;line-height:1.5}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout b{font-weight:700}
.savebar{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.savebar i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.savebar.off i{background:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.agn{display:flex;flex-direction:column}
.agn .ai{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--rule)}
.agn .ai:last-child{border-bottom:0}
.agn .ai .tx b{display:block;font-size:13.5px;font-weight:600}
.agn .ai .tx small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.45}


/* ---------- the quick status setter off My Board's headline ---------- */
.stbtn{border:1px solid rgba(116,191,235,.35)}
.stbtn:hover{background:rgba(255,255,255,.2)!important}
.stbtn .stpen{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;opacity:.65;margin-left:1px}
.stpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px;margin-bottom:16px}
.stopt{display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 13px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);text-align:left}
.stopt:hover{border-color:var(--border-strong);color:var(--ink)}
.stopt i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.stopt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .stopt[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stopt[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}

/* ---------- new certifications ---------- */
.certs{display:flex;flex-direction:column;gap:7px}
.cert{display:flex;align-items:center;gap:12px;background:var(--surface-2);
  border:1px solid var(--border);border-left:3px solid var(--cc,var(--c1));
  border-radius:6px;padding:10px 13px}
.cert .cx{flex:1 1 auto;min-width:0}
.cert .cx b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.cert .cx span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cert .cr{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cert .cr small{font-size:11px;color:var(--ink-3);white-space:nowrap}
.pill.sm{padding:4px 9px;font-size:11.5px}

/* ---------- the way back out of the right rail ---------- */
.pback{flex:0 0 auto;margin:1px 0 0 -6px;width:30px;height:30px;display:inline-flex;align-items:center;
  justify-content:center;background:none;border:0;border-radius:6px;color:var(--ink-3);cursor:pointer;padding:0}
.pback:hover{background:var(--surface-2);color:var(--ink)}
.pback:focus-visible{outline:2px solid var(--c1);outline-offset:1px}
.pback[hidden]{display:none}
.pback svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- plan my day ---------- */
.plan{display:flex;flex-direction:column;gap:2px;font-size:13.5px;line-height:1.6}
.plan p{margin:0 0 10px}
.plan p:last-child{margin-bottom:0}
.plan strong{color:var(--ink);font-weight:700}
.plan ul{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.plan li{line-height:1.55}
.plan .thinking{color:var(--ink-3);font-style:italic}
.plan .muted{color:var(--ink-3)}
.plan .callout.warn{margin-bottom:12px}

/* ---------- overlap flags somebody has set aside ---------- */
.asidebar{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:10px}
.asidebar .lk{align-self:flex-start;font-size:12.5px;color:var(--ink-3)}
.asidebar .lk:hover{color:var(--c1)}
.ovlrow.aside{opacity:.62}
.ovlrow.aside .ic{filter:grayscale(1)}

/* a board panel is narrower than the page, so its countdowns run a bit tighter */
.widget .cds{grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr))}

/* the same little flags, in the Which Systems? picker */
.prow .wrt .lflag{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;
  letter-spacing:.03em;background:var(--warn-soft,var(--surface-3));color:var(--warn);vertical-align:middle}
.prow .wrt .lflag.doc{background:var(--surface-3);color:var(--ink-3)}

/* whose a team project is, when it is not the team's */
.chip.ch-own{background:var(--surface-3);color:var(--ink-2);border-color:var(--border-strong)}
.filterbar.whosebar{margin-bottom:8px}

/* The count on a filter button has to stay readable when the button is hovered
   or pressed — it was inheriting a colour that vanished against the fill. */
.pill b{color:inherit;opacity:.72;font-weight:700;margin-left:7px}
.pill:hover:not(:disabled) b{color:inherit;opacity:1}
.pill[aria-pressed="true"] b{color:inherit;opacity:.85}

/* Touch: a 28px pill is fine under a mouse and fiddly under a thumb. */
@media (pointer:coarse), (max-width:820px){
  .pill, .btn.sm, .btnrow.tiny button, .vhead .btnrow.tiny button{min-height:36px}
  .btn, .seg{min-height:38px}
  .bgear{width:38px;height:38px}
  .wgear, .cwb{min-width:32px;min-height:32px}
  .lk{min-height:32px;display:inline-flex;align-items:center}
}

/* ---------- holidays and birthdays on the calendar ---------- */
.calday.hol{background:color-mix(in srgb,var(--c3) 7%,var(--surface))}
.cpill.hol{--kc:var(--c3);font-weight:700}
.cpill.bday{--kc:var(--c5)}
/* summer Friday: the office closes at 1:00 PM, so it is marked but not shut */
.calday.half{background:color-mix(in srgb,var(--c4) 5%,var(--surface))}
.cpill.half{--kc:var(--c4)}
/* skipping one occurrence of a repeating date, without touching the rest */
.occbox{display:flex;flex-direction:column;gap:8px}
.occlist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.occrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);min-height:44px}
.occrow:last-child{border-bottom:0}
.occrow .on{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.occrow .on small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
@media(max-width:620px){.occrow{flex-wrap:wrap}.occrow .on{flex:1 1 100%}}
.occrow.off{background:var(--surface-2)}
.occrow.off .on{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.pcard .stn.bd{color:var(--c5);font-weight:600}
/* ---------- plans ---------- */
.plancards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:16px;align-items:start}
.plancard{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);text-align:left;
  color:var(--ink);font:inherit;cursor:pointer;padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column;width:100%}
.plancard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,var(--c1))}
.plancard:hover{border-color:var(--border-strong)}
.plancard:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.plancard .pin{padding:14px 16px 12px 18px;display:flex;flex-direction:column;gap:8px}
.plancard h3{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.pprog{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 18px;border-top:1px solid var(--rule);background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.pprog .pn{white-space:nowrap;font-weight:600}
.pprog .pw{white-space:nowrap;color:var(--ink-3)}
.pbackl{align-self:flex-start;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:-14px}
.pbackl:hover{text-decoration:underline}
.psecs{display:flex;flex-direction:column;gap:12px}
.psec{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.psec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-2)}
.psec > summary::-webkit-details-marker{display:none}
.psec > summary:hover{background:var(--surface-3)}
.psec > summary:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.psec > summary .caret{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:var(--ink-3);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.psec[open] > summary .caret{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.psec > summary .caret{transition:none}}
.psec > summary .pst{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.psec > summary .pst small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:1px}
.psec > summary .psr{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.psec > summary .pcount{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;min-width:52px;text-align:right}
.psec.now{border-color:var(--c1)}
.psec.now > summary{box-shadow:inset 3px 0 0 var(--c1)}
.minibar{width:84px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:0 0 auto}
.minibar i{display:block;height:100%;background:var(--good)}
@media(max-width:620px){.psec > summary{flex-wrap:wrap}.psec > summary .psr{flex:1 1 100%;padding-left:26px}.minibar{flex:1 1 auto}}
.psecbody{border-top:1px solid var(--rule);display:flex;flex-direction:column}
.psecnote{padding:10px 16px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--rule);background:var(--surface)}
.psecbody > .rgrp{border-top:0}
.pirow{border-bottom:1px solid var(--rule)}
.pih{display:flex;align-items:center;gap:11px;padding:9px 16px;cursor:pointer}
.pih:hover{background:var(--surface-2)}
.pih:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.pirow.open > .pih{background:var(--sky-wash)}
.pchk{width:20px;height:20px;border:1.5px solid var(--border-strong);border-radius:4px;background:var(--surface);flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#fff}
.pchk svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pchk:hover{border-color:var(--good)}
.pchk:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pchk.on{background:var(--good);border-color:var(--good)}
.pchk.on svg{opacity:1}
:root[data-theme="dark"] .pchk.on{color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pchk.on{color:var(--navy-deep)}}
.pchk.half{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 16%,var(--surface))}
.pchk.na{background:var(--surface-3);border-style:dashed}
.pih .pt{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.pih .pt small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.pih.done .pt > span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.pih .pr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.pib{padding:14px 16px 16px 47px;background:var(--surface-2);border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:14px}
.pib .rowacts{margin-top:0}
@media(max-width:620px){.pib{padding-left:16px}.pih{flex-wrap:wrap}.pih .pt{flex:1 1 calc(100% - 40px)}.pih .pr{flex:1 1 100%;justify-content:flex-start;padding-left:31px}}
.pqa{padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.pqa .quickadd{flex:1 1 280px;box-shadow:none;padding:6px 10px}
.pvt > summary .lockic{width:16px;height:16px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pvt{border-style:dashed}
.psedit{display:flex;flex-direction:column;gap:10px}
.pse{border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.psedit > .btn{align-self:flex-start}
/* leadership view: one bar per section, broken into done / in progress / not started / behind */
.lchart{display:flex;flex-direction:column;gap:12px}
.lrow{display:grid;grid-template-columns:minmax(150px,230px) 1fr minmax(96px,auto);gap:14px;align-items:center}
.lrow .ln{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.lrow .ln small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
.lrow .lnp{display:flex;align-items:center;gap:8px}
.lbar{display:flex;gap:2px;height:14px;min-width:0}
.lbar i{display:block;height:100%;flex-basis:0;min-width:3px}
.lbar i:first-child{border-radius:4px 0 0 4px}
.lbar i:last-child{border-radius:0 4px 4px 0}
.lbar i:only-child{border-radius:4px}
.lbar i.dn{background:var(--good)}
.lbar i.ip{background:var(--c1)}
.lbar i.ns{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--border)}
.lbar i.bh{background:var(--bad)}
.lrow .lv{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
@media(max-width:620px){.lrow{grid-template-columns:1fr auto}.lrow .lbar{grid-column:1 / -1;order:3}}
.plancard .rkm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plancard .rkd{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.pib .rowacts select{max-width:220px}
@media(max-width:620px){.pib .rowacts .spacer{flex:1 1 100%}}
/* private notes: one line on the page, the notes in the rail */
.pvtopen{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;margin-top:4px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:8px;cursor:pointer;color:var(--ink);font:inherit}
.pvtopen:hover{background:var(--surface-2)}
.pvtopen:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pvtopen .pst{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:700}
.pvtopen .pst small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:1px}
.pvtopen .lockic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pvtopen .caret{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:var(--ink-3);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pnlist{display:flex;flex-direction:column;gap:10px}
.pnote{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;background:var(--surface)}
.pnh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pnh b{font-size:13.5px}
.pnh .spacer{flex:1 1 auto}
.pnt{margin-top:6px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}

#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}

/* ---- new certifications, read out of the Certification Management System ----
   The figure doc carries a recent list alongside its monthly series. win is a

const CERT_PROGS = {RON:'Remote Online Notarization', eVault:'eVault', eClosing:'eClosing',
  Consultant:'Certified Consultant', Product:'Product Certification'};
function CERT_PROG(k){ return CERT_PROGS[k] || k; }
function certColor(k){ const i=Object.keys(CERT_PROGS).indexOf(k); return i<0 ? 0 : i+1; }
/* The most recent summit that has already finished, off Key Dates. Null when
   none is on the calendar yet. */
function lastSummit(){
  const t=today(); let best=null;
  S.dates.forEach(d=>{
    if(d.k!=='Summit') return;
    const end=parseD(d.e || dOf(d)); if(!end || end>=t) return;
    /* An exact summit counts from the day it finished. An approximate one only
       knows its month, so it counts from the first of that month — better to
       catch a few days too many than to silently hide everything that happened
       later in the month the summit was in. */
    const from = d.approx ? (parseD(dOf(d)) || end) : end;
    if(!best || end>best.end) best={end:end, from:from, t:d.t, approx:!!d.approx};
  });
  return best;
}
/* A window is 'summit', a number of days, or 0 for everything. */
const CERT_WINS = [{v:'summit',n:'Since the Last Summit'},{v:90,n:'Last 90 Days'},
                   {v:365,n:'Last 12 Months'},{v:0,n:'Everything'}];
function certWin(w){ return (w && w.win !== undefined) ? w.win : 'summit'; }
function certWindow(win){
  const t=today();
  if(win==='summit'){
    const s=lastSummit();
    if(s) return {iso:isoOf(s.from), label:'since '+s.t+(s.approx?' \u2014 counting from the start of that month':'')};
    /* no finished summit on Key Dates, so fall back to the fiscal year and say so */
    const y = t.getMonth()>=9 ? t.getFullYear() : t.getFullYear()-1;
    return {iso:y+'-10-01', label:'since the start of FY'+(y+1)+' \u2014 no finished summit on Key Dates yet'};
  }
  if(!win) return {iso:'', label:'on record, all time'};
  const c=new Date(t.getTime() - win*86400000);
  return {iso:isoOf(c), label:'since '+fmtD(isoOf(c))};
}
function newCerts(win){
  const f=figure('fig-cms-new');
  const list=(f && f.recent) || [];
  const w=certWindow(win);
  if(!w.iso) return list;
  return list.filter(c=> c.d >= w.iso);
}
function figFmt(f){
  const raw = String(f && f.v!=null ? f.v : '').trim();
  if(!raw) return '—';
  const num = Number(raw.replace(/[$,%\s,]/g,''));
  if(!isFinite(num) || raw==='') return raw;
  if(f.f==='Dollars') return '$'+Math.round(num).toLocaleString('en-US');
  if(f.f==='Percent') return (Math.round(num*10)/10)+'%';
  return num.toLocaleString('en-US');
}
function figAge(f){
  if(!f || !f.asof) return 'Not Filled in Yet';
  const n = days(f.asof);
  if(n===null) return 'As of '+f.asof;
  if(n===0) return 'As of Today';
  if(n===-1) return 'As of Yesterday';
  if(n<0) return 'As of '+Math.abs(n)+' Days Ago';
  return 'As of '+fmtD(f.asof);
}
function figStale(f){ const n = f && f.asof ? days(f.asof) : null; return n===null || n < -30; }

/* ---- a figure with a month-by-month series can be read three ways ---- */
const FIG_MODES = [{v:'m',n:'Month'},{v:'c',n:'Calendar Year'},{v:'f',n:'Fiscal Year'}];
function hasSeries(f){ return !!(f && f.series && Object.keys(f.series).length); }
/* MISMO's year runs 1 Oct to 30 Sep, so Oct 2025 onwards is FY2026 */
function fyOf(m){ const y=+m.slice(0,4), mo=+m.slice(5,7); return mo>=10 ? y+1 : y; }
/* October 1 of the fiscal year we are in now. MISMO's year runs Oct 1 - Sep 30,
   and expenses close with it, so anything before this date is settled. */
function fyStart(d){
  const t = d ? new Date(d) : today();
  const y = t.getMonth() >= 9 ? t.getFullYear() : t.getFullYear()-1;
  const a = new Date(y, 9, 1); a.setHours(0,0,0,0); return a;
}
function figKeys(f){ return hasSeries(f) ? Object.keys(f.series).sort() : []; }
/* every period there is data for, newest first */
function figPeriods(f, mode){
  const ks=figKeys(f); if(!ks.length) return [];
  if(mode==='m') return ks.slice().reverse().map(k=>({v:'m:'+k, n:monLabel(k)}));
  const set = new Set(ks.map(k=> mode==='c' ? k.slice(0,4) : String(fyOf(k))));
  return Array.from(set).sort().reverse().map(y=>({v:mode+':'+y,
    n: mode==='c' ? 'Calendar '+y : 'FY'+y}));
}
function monLabel(k){
  const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return M[+k.slice(5,7)-1]+' '+k.slice(0,4);
}
function periodMonths(sel){
  const [mode, key] = String(sel||'').split(':');
  if(mode==='m') return [key];
  const y=+key; const out=[];
  if(mode==='c'){ for(let i=1;i<=12;i++) out.push(y+'-'+String(i).padStart(2,'0')); return out; }
  for(let i=10;i<=12;i++) out.push((y-1)+'-'+String(i).padStart(2,'0'));
  for(let i=1;i<=9;i++) out.push(y+'-'+String(i).padStart(2,'0'));
  return out;
}
/* the newest period that actually has figures in it */
function figDefaultSel(f){
  const ks=figKeys(f); if(!ks.length) return '';
  const last=ks[ks.length-1];
  const fy=fyOf(last);
  /* a part-finished year is not a fair total, so fall back to the last whole one */
  const whole = f.series[fy+'-09'] != null || last.slice(5,7)==='09';
  return 'f:'+(whole ? fy : fy-1);
}
function figSum(f, sel){
  if(!hasSeries(f)) return null;
  let t=0, any=false;
  periodMonths(sel).forEach(m=>{ if(f.series[m]!=null){ t+=Number(f.series[m])||0; any=true; } });
  return any ? t : null;
}
function figParts(f, sel){
  if(!f || !f.parts) return null;
  const o={g:0,r:0,i:0,c:0,w:0,a:0}; let any=false;
  periodMonths(sel).forEach(m=>{ const p=f.parts[m]; if(p){ any=true;
    o.g+=+p.g||0; o.r+=+p.r||0; o.i+=+p.i||0; o.c+=+p.c||0; o.w+=+p.w||0; o.a+=+p.a||0; } });
  return any ? o : null;
}
function periodLabel(sel){
  const [mode, key] = String(sel||'').split(':');
  if(mode==='m') return monLabel(key);
  if(mode==='c') return 'Calendar '+key;
  if(mode==='f') return 'FY'+key+' \u00b7 Oct '+(+key-1)+' to Sep '+key;
  return '';
}
function fmtNum(f, n){
  if(n==null) return '\u2014';
  if(f.f==='Dollars') return '$'+Math.round(n).toLocaleString('en-US');
  if(f.f==='Percent') return (Math.round(n*10)/10)+'%';
  return Math.round(n).toLocaleString('en-US');
}

function statusKey(p){ const raw = (p && p.status) || ''; return PSTAT_OLD[raw] || raw || 'around'; }

/* ============ the three times MISMO is not working ============
   Each person sets their own standing rule for each one, and can still take a
   single day back whenever they like. */
/* a function, not a const: the half-day wording reads HALF_END, which is
   declared further down this file */
function offCycles(){ return [
  {k:'weekend', n:'Weekends',                 d:'Every Saturday and Sunday'},
  {k:'holiday', n:'MISMO Holidays',           d:'The nine days the office is closed'},
  {k:'halfday', n:'Summer Friday Afternoons', d:'After '+HALF_END+' Eastern, Memorial Day to Labor Day'}

const OFF_RULES = [

  {v:'off',    n:'Always Show Me as Off'},
  {v:'around', n:'Always Show Me as Around'}
];
function offRuleOf(p, cycle){ const r=(p && p.offRule) || {}; return r[cycle] || 'ask'; }
function cycleName(k){ const c=offCycles().find(x=>x.k===k); return c? c.n : 'These Days'; }

/* A day MISMO is not working: the weekend, or one of the nine holidays. */
function offDay(d){ const x=new Date(d); x.setHours(0,0,0,0);
  const w=x.getDay(); return w===0 || w===6 || !!holidayOn(x); }

/* The office runs on Eastern time and the team does not, so the half-day cutoff
   is read in Eastern wherever the person happens to be sitting. */
function easternHour(){
  try{ return parseInt(new Intl.DateTimeFormat('en-US',
    {timeZone:'America/New_York', hour:'numeric', hour12:false}).format(new Date()), 10); }
  catch(e){ return new Date().getHours(); }
}
/* Which non-working stretch we are in RIGHT NOW, or null on an ordinary workday.
   Unlike offDay this one knows the clock, because a summer Friday is only half off. */
function offNow(){
  const t=today();
  const h=holidayOn(t); if(h) return {cycle:'holiday', why:h.t};
  const w=t.getDay(); if(w===0 || w===6) return {cycle:'weekend', why:'Weekend'};
  if(isHalfFriday(t) && easternHour()>=13)
    return {cycle:'halfday', why:'Summer Friday \u2014 the office closed at '+HALF_END};
  return null;
}

function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(s){ if(!s) return null; const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s).trim()); if(!m) return null;
  const d=new Date(+m[1], +m[2]-1, +m[3]); d.setHours(0,0,0,0); return isNaN(d)?null:d; }
function isoOf(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function days(s){ const d=parseD(s); if(!d) return null; return Math.round((d-today())/86400000); }

/* ---- recurring dates ---- */
/* The nth <weekday> of a month. Asking for one the month does not have — a 5th
   Friday in a 4-Friday month — gives the last one rather than spilling into the
   month after, which used to put the date on a day the calendar disagreed with. */
function nthDow(y,m,nth,dow){
  const last=()=>{ const d=new Date(y,m+1,0); d.setHours(0,0,0,0);
    while(d.getDay()!==dow) d.setDate(d.getDate()-1); return d; };
  if(nth===-1) return last();
  const d=new Date(y,m,1); d.setHours(0,0,0,0);
  while(d.getDay()!==dow) d.setDate(d.getDate()+1);
  d.setDate(d.getDate()+(nth-1)*7);
  return d.getMonth()===m ? d : last();
}
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
/* the next occurrence that is actually going to happen: past any single
   occurrence someone cancelled, and nothing at all once the series has ended */
/* the next slot the rule produces, before any move — this is the key an
   override is filed under */
function nextKey(r, after, depth){
  const iso = rawNextRec(r, after);
  if(!iso) return '';
  if(r.until && iso > r.until) return '';
  if(r.skip && r.skip.indexOf(iso)>=0) return (depth||0)>40 ? '' : nextKey(r, iso, (depth||0)+1);
  return iso;
}
function nextRec(r, after, depth){
  const iso = nextKey(r, after, depth);
  if(!iso) return '';
  const ov=(r.over||{})[iso];
  if(ov && ov.on) return ov.on;           /* this one was moved */
  return iso;
}
/* A repeating date as it will next appear — name, time, people, pin and all,
   with whatever was changed for that one occurrence already folded in. Every
   forward-looking list reads dates through this, so a change made on the
   calendar shows up in Key Dates and in the countdowns too. */
/* ============ asking for something ============
   Nobody should have to put up with a missing panel or a figure they cannot
   find in silence. An ask goes straight to whoever looks after Team HQ, who

const ASK_KINDS = [
  {v:'panel',  n:'A Panel That Is Not There'},

function askKindName(v){ return (ASK_KINDS.find(x=>x.v===v)||ASK_KINDS[3]).n; }
function askState(k){ return ASK_STATES.find(x=>x.k===k) || ASK_STATES[0]; }
function openAsks(){ return (S.asks||[]).filter(a=> a.state!=='Built' && a.state!=='Not Doing'); }

/* ============ focus blocks ============
   A block is an hour someone has set aside to work on something. It arrives
   one of two ways and the shape is the same either way:

     from Outlook  — an event marked Free with the reminder off, carrying the
                     Team HQ category. Power Automate writes it in here.
     from Team HQ  — somebody books time against a task. It sits here waiting,
                     and Power Automate puts it on their Outlook calendar.

   `origin` says which way it came, `evId` is the Outlook event once it exists,
   and `state` is how the flow knows what still needs doing. Nothing in this
   page talks to Outlook directly — Team HQ writes rows, the flow does the rest. */
const BLK_MINS = [15,30,45,60,90,120];
function blockWho(b){ return b.who || ''; }
function blocksOn(who, iso){
  return (S.blocks||[]).filter(b=> b.who===who && b.date===iso && b.state!=='remove')
    .sort((a,b)=> String(a.start||'').localeCompare(String(b.start||'')));
}

}
/* 09:00 -> 9:00 AM, and back again */
function hhmm(t){
  if(!t) return '';
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(t)); if(!m) return String(t);
  let h=+m[1]; const ap = h<12 ? 'AM':'PM'; h = h%12 || 12;
  return h+':'+m[2]+' '+ap;
}
function addMins(t, n){
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'09:00')); if(!m) return '';
  let mins = (+m[1])*60 + (+m[2]) + (+n||0);
  mins = Math.max(0, Math.min(23*60+59, mins));
  return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
}
function blockLen(b){
  const a=/^(\d{1,2}):(\d{2})$/.exec(String(b.start||'')), z=/^(\d{1,2}):(\d{2})$/.exec(String(b.end||''));
  if(!a||!z) return b.mins||60;
  return ((+z[1])*60+(+z[2])) - ((+a[1])*60+(+a[2]));
}
function blockLabel(b){
  const n=blockLen(b);
  const len = n>=60 ? (n%60? (n/60).toFixed(1).replace('.0','')+' hr' : (n/60)+' hr') : n+' min';
  return hhmm(b.start)+' \u00b7 '+len;
}
/* what the flow has not dealt with yet — shown in settings so a stuck row is visible */
function blocksWaiting(){

}

/* ============ sponsorship prospects ============
   A read-only mirror of the Sponsorship Portal's prospect list, refreshed
   overnight. Team HQ never writes to it — the portal is where a prospect is
   actually worked — so this is about seeing what is waiting, not doing it here.
   A prospect is "in flight" once someone has started talking to them and before
   money is on the table; "quiet" once that conversation has gone cold. */
const LEAD_DONE  = ['Converted to Application','Invoiced','Paid','Lost','Declined'];
const LEAD_NEW   = ['New Lead'];
const QUIET_DAYS = 14;
function leadDone(l){ return LEAD_DONE.indexOf(l.status)>=0; }
function leadAge(l){
  const d = parseD(l.lastContactDate || l.createdDate);
  return d ? Math.round((today()-d)/86400000) : null;
}
function leadBuckets(){
  const live = (S.leads||[]).filter(l=> !leadDone(l));
  const fresh  = live.filter(l=> LEAD_NEW.indexOf(l.status)>=0);
  const flight = live.filter(l=> LEAD_NEW.indexOf(l.status)<0);
  const quiet  = flight.filter(l=>{ const a=leadAge(l); return a!==null && a>=QUIET_DAYS; });
  const noOwner= live.filter(l=> !l.owner);
  const won    = (S.leads||[]).filter(l=> ['Invoiced','Paid'].indexOf(l.status)>=0);
  return {live, fresh, flight, quiet, noOwner, won,
    all:(S.leads||[]), done:(S.leads||[]).filter(leadDone)};
}
/* the sentence at the top of the panel */
function leadSay(b){
  if(!b.all.length) return 'Nothing has come across from the Sponsorship Portal yet.';
  const bits=[];
  if(b.fresh.length) bits.push(b.fresh.length+(b.fresh.length===1?' has never been approached':' have never been approached'));
  if(b.quiet.length) bits.push(b.quiet.length+' has gone quiet'.replace('has', b.quiet.length===1?'has':'have'));
  if(!bits.length) return b.live.length+(b.live.length===1?' prospect is':' prospects are')+' in flight and none has gone quiet.';
  return b.live.length+(b.live.length===1?' prospect':' prospects')+' still open \u2014 '+bits.join(', ')+'.';
}
/* ---- how far ahead the countdowns look ----
   Jonna: filters instead of a sideways-scrolling strip. Whole View wraps onto
   as many rows as it needs. */
const CDWINS = [
  {k:'w',   n:'This Week'},
  {k:'m',   n:'This Month'},
  {k:'y',   n:'This Year'},
  {k:'all', n:'Whole View'}
];
function cdWin(){ return LS.get('cdwin','m'); }
function setCdWin(k){ LS.set('cdwin', k); }
function cdWinName(k){ return (CDWINS.find(x=>x.k===(k||cdWin()))||CDWINS[1]).n; }
/* the last day a window covers — anything on or before it counts */
function cdEnd(k){
  const t=today();
  if(k==='w'){ const x=new Date(t); x.setDate(x.getDate()+7); return x; }
  if(k==='m') return new Date(t.getFullYear(), t.getMonth()+1, 0);
  if(k==='y') return new Date(t.getFullYear(), 11, 31);
  return null;                                  /* Whole View: no end */
}
function cdIn(d, k){
  const end = cdEnd(k || cdWin());
  if(!end) return true;
  const x = parseD(dOf(d));
  return x ? x <= end : false;                  /* no date at all: only Whole View */
}
/* the pinned dates still ahead, newest deadline first, before any window */
function cdAll(){
  return dateList().filter(d=>{ const n=days(dOf(d)); return n!==null && n>=-1; })
    .sort((a,b)=> days(dOf(a))-days(dOf(b)));
}
function asNext(x){
  if(!(x.rec && x.rec.f)) return x;
  const k = nextKey(x.rec);
  return k ? occOf(x, k) : x;
}
function dateList(){ return S.dates.map(asNext); }
/* every occurrence left this year and next, so a list of them can be offered */
function recUpcoming(r, n){
  const out=[]; let after=null;
  for(let i=0;i<(n||6)+10 && out.length<(n||6);i++){
    const iso=rawNextRec(r, after); if(!iso) break;
    if(after && iso<=after) break;                 /* never the same day twice */
    if(r.until && iso > r.until) break;
    if(!(r.skip && r.skip.indexOf(iso)>=0)) out.push(iso);
    after=iso; }
  return out;
}
function rawNextRec(r, after){
  if(!r || !r.f) return '';
  /* Walking forward from a date (`after`) must always land on a LATER one.
     Without this, a once-a-year date sitting in its own month kept returning
     that same month and the list repeated one day over and over. */
  const strict = !!after;
  const t = after ? (()=>{ const x=parseD(after); x.setDate(x.getDate()+1); return x; })() : today();
  const Y=t.getFullYear(), M=t.getMonth();
  const mk=(y,m,d)=>{ const x=new Date(y,m,d); x.setHours(0,0,0,0); return x; };
  try{
    const dayIn=(y,m)=> Number(r.day)===-1 ? daysInMonth(y,m) : Math.min(r.day||1, daysInMonth(y,m));
    if(r.f==='w'){
      const a=parseD(r.from); if(!a) return '';
      const step=(r.every||1)*7;
      const x=new Date(a);
      if(x<t){ const gaps=Math.ceil((t-x)/86400000/step); x.setDate(x.getDate()+gaps*step); }
      while(x<t) x.setDate(x.getDate()+step);
      return isoOf(x);
    }
    if(r.f==='md'){
      for(let i=0;i<15;i++){ const y=Y+Math.floor((M+i)/12), m=(M+i)%12;
        const x=mk(y, m, dayIn(y,m)); if(x>=t) return isoOf(x); }
    }
    if(r.f==='mw'){
      for(let i=0;i<15;i++){ const y=Y+Math.floor((M+i)/12), m=(M+i)%12;
        const x=nthDow(y, m, r.nth||1, r.dow||0); if(x>=t) return isoOf(x); }
    }
    if(r.f==='y'){
      for(let i=0;i<4;i++){ const y=Y+i, m=(r.m||1)-1;
        const x=mk(y, m, dayIn(y,m)); if(x>=t) return isoOf(x); }
    }
    if(r.f==='ym'){
      /* a month with no fixed day: sit on an anchor day, and only roll to next year
         once the whole month is behind us */
      for(let i=0;i<5;i++){ const y=Y+i, m=(r.m||1)-1;
        const anchor=mk(y, m, Math.min(r.day||15, daysInMonth(y,m)));
        if(anchor>=t) return isoOf(anchor);
        if(strict) continue;            /* walking a list: never repeat a day */
        const last=mk(y, m, daysInMonth(y,m));
        if(last>=t) return isoOf(anchor); }
    }
    if(r.f==='q'){
      const ms=(r.months&&r.months.length)? r.months : [1,4,7,10];
      for(let i=0;i<30;i++){ const y=Y+Math.floor((M+i)/12), m=(M+i)%12;
        if(ms.indexOf(m+1)<0) continue;
        const x=mk(y, m, dayIn(y,m)); if(x>=t) return isoOf(x); }
    }
  }catch(e){}
  return '';
}
/* the effective date of a key date: computed for recurring ones, stored for the rest */
function dOf(x){ return (x && x.rec && x.rec.f) ? nextRec(x.rec) : (x? x.d : ''); }
function recLabel(r){
  if(!r || !r.f) return '';
  if(r.f==='w'){
    const a=parseD(r.from); const dn = a? DOW[a.getDay()] : 'week';
    const n=r.every||1;
    return n===1 ? 'Every '+dn : n===2 ? 'Every other '+dn : 'Every '+n+' weeks on '+dn;
  }
  if(r.f==='md') return Number(r.day)===-1 ? 'The last day of every month' : 'The '+ord(r.day||1)+' of every month';
  if(r.f==='mw'){ const n=(NTHS.find(x=>+x.v===(r.nth||1))||{n:'1st'}).n;
    return (n==='Last'?'The last ':'The '+n+' ')+DOW[r.dow||0]+' of every month'; }
  if(r.f==='y')  return Number(r.day)===-1 ? 'The last day of '+MONTHS[(r.m||1)-1]+', every year' : 'Every year on '+MONTHS[(r.m||1)-1]+' '+(r.day||1);
  if(r.f==='ym') return 'Every year in '+MONTHS[(r.m||1)-1];
  if(r.f==='q')  return 'Every year in '+((r.months||[]).map(m=>MONTHS[m-1].slice(0,3)).join(', ')||'several months');
  return '';
}
/* the label plus anything that limits it, for the preview line */
function recLabelFull(r){
  let s=recLabel(r); if(!s) return '';
  if(r.until) s += ', until '+fmtD(r.until);
  const n=(r.skip||[]).filter(x=>x>=isoOf(today())).length;
  if(n) s += ' \u00b7 '+n+(n===1?' date skipped':' dates skipped');
  const c=Object.keys(r.over||{}).filter(x=>x>=isoOf(today())).length;
  if(c) s += ' \u00b7 '+c+(c===1?' date changed':' dates changed');
  return s;
}
function ord(n){ if(Number(n)===-1) return 'last day'; const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

function fmtD(s,long){ const d=parseD(s); if(!d) return '';
  return d.toLocaleDateString('en-US', long? {weekday:'short',month:'long',day:'numeric',year:'numeric'} : {month:'short',day:'numeric',year:'numeric'}); }
function fmtRange(a,b){ if(!b) return fmtD(a,1); const x=parseD(a),y=parseD(b); if(!x||!y) return fmtD(a,1);
  const sameM = x.getMonth()===y.getMonth() && x.getFullYear()===y.getFullYear();
  const mo = x.toLocaleDateString('en-US',{month:'long'});
  return sameM ? mo+' '+x.getDate()+'–'+y.getDate()+', '+y.getFullYear() : fmtD(a)+' – '+fmtD(b,0);
}
/* ============ birthdays ============ */
/* Held as MM-DD on the person, so they never need a year and never go stale. */
function bdayOn(d){
  const k=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return S.people.filter(p=> p.bday===k);
}
function nextBday(p){
  if(!p || !p.bday) return null;
  const t=today(), parts=String(p.bday).split('-');
  const m=+parts[0]-1, dd=+parts[1];
  let x=new Date(t.getFullYear(), m, dd); x.setHours(0,0,0,0);

}

/* ============ the MISMO holiday calendar ============ */
/* The same every year, so it is worked out rather than typed in. Winter break
   runs December 25 to January 1 inclusive. A fixed-date holiday that lands on a
   weekend is observed on the nearest weekday, the way MBA does it. */
function observed(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  if(x.getDay()===6) x.setDate(x.getDate()-1);   /* Saturday -> Friday before */
  if(x.getDay()===0) x.setDate(x.getDate()+1);   /* Sunday  -> Monday after  */
  return x;
}
const WINTER_BREAK = {};   /* year -> ['YYYY-MM-DD','YYYY-MM-DD'] to pin a span */
/* Christmas Day through New Year's Day, trimmed inward to weekdays. Jonna:
   "it's usually the week after christmas before new year". When Dec 25 falls
   on a Saturday the break starts the Monday after; when Jan 1 falls on a
   Saturday it ends the Friday before. 2027 comes out Dec 27-31, which is
   what she confirmed. */
function trimIn(d, fwd){
  const x=new Date(d); x.setHours(0,0,0,0);
  while(x.getDay()===0 || x.getDay()===6) x.setDate(x.getDate()+(fwd?1:-1));
  return x;
}
function winterBreak(y){
  const pin = WINTER_BREAK[y];
  if(pin){ return {d:parseD(pin[0]), e:parseD(pin[1]), t:'Winter Break'}; }
  const a = trimIn(new Date(y,11,25), true);
  const b = trimIn(new Date(y+1,0,1), false);
  return {d:a, e:b, t:'Winter Break'};
}

/* ---- summer half-day Fridays ----
   Every Friday between Memorial Day and Labor Day is a half day: the office
   closes at 1:00 PM Eastern. A Friday that is already a full holiday (July 4
   observed, say) is a whole day off, not a half. */
const HALF_END = '1:00 PM';
function isHalfFriday(d){
  if(d.getDay()!==5) return false;
  if(holidayOn(d)) return false;
  const y=d.getFullYear();
  const mem=nthDow(y,4,-1,1);            /* last Monday of May */
  const lab=nthDow(y,8,1,1);             /* first Monday of September */
  return d>mem && d<lab;
}
function holidaysIn(y){
  const mk=(m,d)=>{ const x=new Date(y,m,d); x.setHours(0,0,0,0); return x; };
  const th = nthDow(y,10,4,4);                   /* 4th Thursday of November */
  const out = [
    {d:nthDow(y,0,3,1),  t:'Martin Luther King, Jr. Birthday'},
    {d:nthDow(y,1,3,1),  t:'Presidents\u2019 Day'},
    {d:nthDow(y,4,-1,1), t:'Memorial Day'},
    {d:observed(mk(5,19)), t:'Juneteenth'},
    {d:observed(mk(6,4)),  t:'Independence Day'},
    {d:nthDow(y,8,1,1),  t:'Labor Day'},
    {d:observed(mk(10,11)),t:'Veterans Day'},
    {d:th,               t:'Thanksgiving Day'},
    {d:new Date(th.getFullYear(),th.getMonth(),th.getDate()+1), t:'Day after Thanksgiving'}
  ];
  /* winter break: Dec 25 through Jan 1, each end moved off a weekend the
     same way every other holiday here is. Pin a year in WINTER_BREAK to
     override, e.g. WINTER_BREAK[2027] = ['2027-12-23','2027-12-31'] */
  out.push(winterBreak(y));
  /* and the tail of last year's break, so early January knows about it */
  out.push(winterBreak(y-1));
  out.forEach(h=>{ h.d.setHours(0,0,0,0); if(h.e) h.e.setHours(0,0,0,0); });
  return out;
}
let HOL_CACHE = {};
function holidayOn(d){
  const y=d.getFullYear();
  if(!HOL_CACHE[y]) HOL_CACHE[y]=holidaysIn(y);
  const list=HOL_CACHE[y];
  for(let i=0;i<list.length;i++){
    const h=list[i], b=h.e||h.d;
    if(d>=h.d && d<=b) return h;
  }
  return null;
}
/* every holiday that touches a month, for the calendar grid */
function holidaysTouching(y, m){
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  first.setHours(0,0,0,0); last.setHours(0,0,0,0);
  const seen={}, out=[];
  [y-1,y,y+1].forEach(yy=>{
    if(!HOL_CACHE[yy]) HOL_CACHE[yy]=holidaysIn(yy);
    HOL_CACHE[yy].forEach(h=>{
      const b=h.e||h.d;
      if(b<first || h.d>last) return;
      const k=h.t+'|'+isoOf(h.d);
      if(!seen[k]){ seen[k]=1; out.push(h); }
    });
  });
  return out;
}

function workdaysLeft(){
  const t=today(), end=new Date(t.getFullYear(),11,31); end.setHours(0,0,0,0);
  let n=0; const d=new Date(t);
  while(d<=end){ const w=d.getDay();
    /* MISMO holidays are not working days; a summer Friday is half of one */
    if(w!==0 && w!==6 && !holidayOn(d)) n += isHalfFriday(d) ? 0.5 : 1;
    d.setDate(d.getDate()+1); }
  return n;
}
/* 56 and 56.5 both want to read naturally in a tile */
function fmtDays(n){ return (n % 1) ? n.toFixed(1) : String(n); }

/* ============ what today is ============
   The one place that decides whether a day is worth calling out: a holiday,
   a summer half day, somebody's birthday. Today and My Board both read from
   here, so the wording stays the same on both. `meId` makes it personal —
   on your own board your birthday is wished, not reported. */
function occasionsOn(d, meId){
  const out=[];
  const hol=holidayOn(d);
  if(hol){
    const end = hol.e && hol.e>hol.d ? fmtD(isoOf(hol.e),1) : '';
    out.push({k:'holiday', icon:'',
      lead: hol.t+'.',
      rest: end ? 'The office is shut through '+end+'.' : 'The office is shut today.'});
  } else if(isHalfFriday(d)){
    out.push({k:'half', icon:'',
      lead:'Half day.',
      rest:'A summer Friday \u2014 the office closes at '+HALF_END+' Eastern.'});
  }
  const bds = bdayOn(d);
  if(bds.length){
    const mine = bds.filter(p=>p.id===meId);
    const them = bds.filter(p=>p.id!==meId);
    const names = a => a.map(p=>p.name.split(' ')[0])
      .reduce((s,n,i,arr)=> i===0 ? n : (i===arr.length-1 ? s+' and '+n : s+', '+n), '');
    if(mine.length){
      out.push({k:'bday', icon:'\ud83c\udf82',
        lead:'Happy Birthday, '+mine[0].name.split(' ')[0]+'!',
        rest: them.length ? 'It is '+names(them)+'\u2019s birthday too.' : ''});
    } else {
      out.push({k:'bday', icon:'\ud83c\udf82',
        lead:'It is '+names(them)+'\u2019s birthday today.',
        rest: them.length===1 ? 'Worth a note.' : ''});
    }
  }
  return out;
}
/* the navy band's callout row — identical on Today and on My Board */
function occBanner(meId){
  const occ = occasionsOn(today(), meId);
  if(!occ.length) return null;
  const wrap=el('div','hl-occs');

    if(o.icon) r.appendChild(el('span','oi', o.icon));
    const tx=el('span','ot');
    tx.appendChild(el('b',null,o.lead));
    if(o.rest){ tx.appendChild(document.createTextNode(' '+o.rest)); }
    r.appendChild(tx);
    wrap.appendChild(r);
  });
  return wrap;
}
function inThisMonth(iso){ const d=parseD(iso), t=today();
  return !!d && d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth(); }
function dateLabel(x){
  if(typeof x==='string') x={d:x};        /* callers hand it a bare ISO date too */
  const iso=dOf(x); if(!iso) return 'No date set';
  if(x.approx){ const d=parseD(iso); if(!d) return 'No date set';
    return 'Around '+d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
  return fmtRange(iso, x.e);
}
function dueChip(s){

  else if(n<=7){ c.className='chip ch-soon'; c.textContent='In '+n+(n===1?' Day':' Days'); }
  else { c.className='chip ch-ns'; c.textContent=fmtD(s); }
  return c;
}

function toast(msg){
  const t=$('#toast'); if(!t) return; t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.hidden=true; }, 2800);
}
/* The same toast, with a way back. Deleting something small should not need a
   dialog, but it does need a few seconds of second thoughts. */
function undoToast(msg, onUndo){
  const t=$('#toast'); if(!t) return toast(msg);
  t.textContent='';
  t.appendChild(el('span',null,msg));
  const b=el('button','toast-undo','Undo'); b.type='button';
  b.addEventListener('click', async ()=>{ clearTimeout(toast._t); t.hidden=true;
    await onUndo(); toast('Put back.'); });
  t.appendChild(b);
  t.hidden=false;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ t.hidden=true; t.textContent=''; }, 8000);
}
function openTasks(){ return S.tasks.filter(t=>t.s!=='Done'); }
/* Accountable is t.o. Working it is t.d (a list). With nobody named in t.d the
   accountable person is doing it themselves, so they are the doer too. */
function doers(t){ return (t.d && t.d.length) ? t.d.slice() : (t.o? [t.o] : []); }
function isDoing(t,id){ return doers(t).indexOf(id)>=0; }
function hasHelp(t){ return !!(t.d && t.d.length) && !(t.d.length===1 && t.d[0]===t.o); }
/* everything that touches you, either way — this is what My Board shows */
function myTasks(id){ return S.tasks.filter(t=> t.o===id || isDoing(t,id)); }
function doingTasks(id){ return S.tasks.filter(t=> isDoing(t,id)); }
function watchingTasks(id){ return S.tasks.filter(t=> t.o===id && !isDoing(t,id)); }
function weight(t){ return t.p==='High'?3 : t.p==='Low'?1 : 2; }
/* load is what you are HANDS ON for. What you are only accountable for counts
   separately, as oversight — otherwise the VPs look buried and their teams look idle. */
function loadOf(id){
  const ts = doingTasks(id).filter(t=>t.s!=='Done');
  const ov = watchingTasks(id).filter(t=>t.s!=='Done');
  return { total: ts.length, rails: ts.filter(t=>t.rail).length,
           high: ts.filter(t=>t.p==='High').length,
           late: ts.filter(t=>{const n=days(t.due); return n!==null && n<0;}).length,
           score: ts.reduce((a,t)=>a+weight(t),0),
           oversight: ov.length,
           oversightLate: ov.filter(t=>{const n=days(t.due); return n!==null && n<0;}).length };
}
/* a person's status right now: away from a key date wins, then an expired "until", then what they set */
/* what is landing on YOU in the next seven days — hands-on or accountable */
function mySoon(me){
  if(!me) return [];
  return openTasks().filter(t=>{
    const n=days(t.due); if(n===null || n>7) return false;
    return t.o===me || isDoing(t, me);
  }).sort((a,b)=>days(a.due)-days(b.due));
}

/* is this person away on this particular day, and why — the same rule
   effStatus uses for today, asked about any date */
/* ---- nudges: a gentle reminder or a note from one person to another ----
   They sit on the recipient's navy header until they clear them. Trips with no
   expenses against them raise one by themselves. */
const NUDGE_KINDS = [
  {v:'gentle', n:'A Gentle Reminder'},
  {v:'note',   n:'Just a Note'},
  {v:'ask',    n:'Something I Need'}
];
function myNudges(id){
  if(!id) return [];
  return S.nudges.filter(n=> n.to===id && !n.done).sort((a,b)=>(b.at||0)-(a.at||0));
}
/* One trip, for one person, as a key we can store against. The date it ended is
   in there so a repeating trip is cleared one occurrence at a time. */
function tripKey(x, backIso){ return (x.id||x.t)+'|'+backIso; }
function expCleared(p){ return (p && p.expClear) || []; }
/* trips somebody took that have no expense line against them */
function expenseGaps(id){
  const out=[]; const t=today();
  const who = person(id);
  const cleared = expCleared(who);
  S.dates.forEach(x=>{
    if(TRAVEL_KINDS.indexOf(x.k)<0) return;
    if((x.who||[]).indexOf(id)<0) return;
    if(x.approx) return;
    const a=parseD(dOf(x)); if(!a) return;
    const b=parseD(x.e)||a;
    if(b>=t) return;                                   /* not back yet */
    /* A closed fiscal year is closed. Expenses are submitted and the books are
       shut, so nobody gets chased in October about a trip they took in August.
       This moves itself along every October 1 without anyone editing it. */
    if(b < fyStart()) return;
    const n=Math.round((t-b)/86400000);
    if(n<3 || n>120) return;                           /* give them a few days, forget old ones */
    const hit = S.expenses.some(e=>{
      if(e.who!==id) return false;
      const d=parseD(e.date); if(!d) return false;
      const lo=new Date(a.getFullYear(),a.getMonth(),a.getDate()-2);
      const hi=new Date(b.getFullYear(),b.getMonth(),b.getDate()+14);
      return d>=lo && d<=hi;
    });
    const key = tripKey(x, isoOf(b));
    if(cleared.indexOf(key)>=0) return;                /* claimed somewhere else */
    if(!hit) out.push({t:x.t, loc:x.loc||'', back:isoOf(b), days:n, key:key});
  });
  return out;
}

function awayOn(pid, d){
  const h=holidayOn(d);                           /* the office is shut for everyone */
  if(h) return {k:'out', t:h.t, loc:'', holiday:1};
  for(let i=0;i<S.dates.length;i++){
    const x=S.dates[i];
    if(AWAY_KINDS.indexOf(x.k)<0) continue;
    if((x.who||[]).indexOf(pid)<0) continue;
    if(x.approx) continue;
    const a=parseD(dOf(x)); if(!a) continue;
    const b=parseD(x.e)||a;
    if(d>=a && d<=b) return {k: OOO_KINDS.indexOf(x.k)>=0 ? 'out' : 'travel', t:x.t, loc:x.loc||''};
  }
  return null;
}
/* every key date touching a given day */
/* Does a repeating date land on this exact day? dOf() only ever answers with
   the NEXT occurrence, so asking it was showing a monthly meeting in one month
   and in none of the others. */
function recOn(r, d){
  if(!r || !r.f) return false;
  /* a single occurrence someone cancelled, and the date the whole series stops */
  if(r.skip && r.skip.indexOf(isoOf(d))>=0) return false;
  if(r.until && isoOf(d) > r.until) return false;
  const y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  const dayIn = Number(r.day)===-1 ? daysInMonth(y,m) : Math.min(r.day||1, daysInMonth(y,m));
  if(r.f==='w'){
    /* every N weeks counted from a real date, so bi-weekly lands right */
    const a=parseD(r.from); if(!a) return false;
    if(d<a) return false;
    const step=(r.every||1)*7;
    return Math.round((d-a)/86400000) % step === 0;
  }
  if(r.f==='md') return day===dayIn;
  if(r.f==='mw'){ const x=nthDow(y, m, r.nth||1, r.dow||0); return x.getMonth()===m && x.getDate()===day; }
  if(r.f==='y')  return (m===(r.m||1)-1) && day===dayIn;
  if(r.f==='ym'){ /* no fixed day — it sits on its anchor day that month */
    return (m===(r.m||1)-1) && day===Math.min(r.day||15, daysInMonth(y,m)); }
  if(r.f==='q'){
    const ms=(r.months&&r.months.length)? r.months : [1,4,7,10];
    return ms.indexOf(m+1)>=0 && day===dayIn;
  }
  return false;
}
/* One occurrence of a repeating date, as it actually turned out that day.
   A month where the Council of Chairs became a Joint Committee meeting is
   held as an override on that one date, so every other month is untouched.
   `_occ` marks the copy as an occurrence, and `_base` points back at the
   series, so an editor knows which of the two it is working on. */
function occFields(){ return ['t','k','loc','note','who','pin','time']; }
function occOf(x, iso){
  const ov = x.rec && x.rec.over && x.rec.over[iso];
  const c = Object.assign({}, x, {_occ: iso, _base: x.id, _on: iso});
  if(ov){ occFields().forEach(k=>{ if(ov[k]!==undefined) c[k]=ov[k]; });
    c._changed=1; if(ov.on){ c._on=ov.on; c._moved=1; } }
  return c;
}
function hasOcc(x, iso){ return !!(x.rec && x.rec.over && x.rec.over[iso]); }
/* an occurrence that was moved: which of its usual days now lands on `iso` */
function movedTo(x, iso){
  const ov=(x.rec&&x.rec.over)||{};
  for(const k in ov){ if(ov[k] && ov[k].on===iso) return k; }
  return '';
}
function datesOn(d){
  const out=[], iso=isoOf(d), hol=holidayOn(d);
  S.dates.forEach(x=>{
    /* On a MISMO holiday everybody is out, so an out-of-office entry on that
       day says nothing the holiday has not already said. A block of leave
       that happens to span one still shows on its working days. */
    if(hol && x.k==='Out of Office') return;
    if(x.rec && x.rec.f){
      /* one that was moved onto this day */
      const from=movedTo(x, iso);
      if(from){ out.push(occOf(x, from)); return; }
      /* its usual day — unless this one was moved off it */
      if(recOn(x.rec, d)){
        const ov=(x.rec.over||{})[iso];
        if(ov && ov.on && ov.on!==iso) return;
        /* a series whose day is set each year stays off the grid until the
           year in question has actually been pinned down */
        if(x.approx && !ov) return;
        out.push(occOf(x, iso));
      }
      return;
    }
    if(x.approx) return;
    const a=parseD(dOf(x)); if(!a) return;
    const b=parseD(x.e)||a;
    if(d>=a && d<=b) out.push(x);
  });
  return out;
}

function effStatus(p){
  const t=today();
  for(let i=0;i<S.dates.length;i++){
    const x=S.dates[i];
    if(AWAY_KINDS.indexOf(x.k)<0) continue;
    if(!(x.who||[]).length || (x.who||[]).indexOf(p.id)<0) continue;
    if(x.approx) continue;
    const a=parseD(dOf(x)); if(!a) continue;
    const b=parseD(x.e)||a;
    if(t>=a && t<=b) return {k: OOO_KINDS.indexOf(x.k)>=0 ? 'out' : 'travel',
      note:x.t+(x.loc? ' · '+x.loc : ''), auto:1};
  }
  const oc = offNow();
  /* Anything this person set TODAY wins outright, whatever the calendar says.
     That is the single-day override, in both directions: Around on a Saturday,
     or Off on a Friday afternoon they have decided to stop. It lasts the day
     only, so it never leaks into the next weekend. */
  const setToday = p.statusAt && p.statusAt.slice(0,10) === isoOf(t);
  if(setToday) return {k:statusKey(p), note:p.statusNote||'', auto:0};
  if(p.until){ const u=parseD(p.until); if(u && t>u)
    return oc ? {k:'off', note:oc.why, auto:1, cycle:oc.cycle} : {k:'around', note:'', auto:0}; }
  const set = statusKey(p);
  /* On a non-working stretch the standing rule decides. "Ask Me Each Time" still
     shows Off — the asking is a nudge when they open the page, not a status.
     A status they chose themselves (Heads Down, Traveling) is left alone. */
  if(oc && offRuleOf(p, oc.cycle)!=='around' && set==='around' && !p.statusNote)
    return {k:'off', note:oc.why, auto:1, cycle:oc.cycle};
  return {k:set, note:p.statusNote||'', auto:0};
}

/* `leads` is a nightly mirror of the Sponsorship Portal's prospect list. Team HQ
   only ever reads it; the portal stays the place those records are edited. */
const COLS = ['people','rocks','tasks','dates','notes','agenda','expenses','figures','nudges','leads','blocks','asks','plans','planitems','plankinds','datekinds'];
const KEYOF = {people:'people', rocks:'rocks', tasks:'tasks', dates:'dates', notes:'notes', agenda:'agenda', expenses:'expenses', figures:'figures', nudges:'nudges', leads:'leads', blocks:'blocks', asks:'asks', plans:'plans', planitems:'planitems', plankinds:'plankinds', datekinds:'datekinds'};
let unsubs = [];
let localOnly = false;

function sortAll(){
  S.people.sort((a,b)=>(a.ord||0)-(b.ord||0) || String(a.name).localeCompare(String(b.name)));
  S.rocks.sort((a,b)=>(a.order||99)-(b.order||99) || String(a.name).localeCompare(String(b.name)));
  S.tasks.sort((a,b)=>(a.ord||0)-(b.ord||0));
  S.dates.sort((a,b)=> String(dOf(a)||'9999-99-99').localeCompare(String(dOf(b)||'9999-99-99')));
  S.notes.sort((a,b)=>(b.at||0)-(a.at||0));
  S.expenses.sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')));
  S.asks.sort((a,b)=> (b.at||0)-(a.at||0));
  S.blocks.sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')) || String(a.start||'').localeCompare(String(b.start||'')));
  S.agenda.sort((a,b)=> String(b.mtg||'').localeCompare(String(a.mtg||'')) || (a.ord||0)-(b.ord||0) || (a.at||0)-(b.at||0));
  S.figures.sort((a,b)=> String(a.n||'').localeCompare(String(b.n||'')));
  S.nudges.sort((a,b)=>(b.at||0)-(a.at||0));
  S.planitems.sort((a,b)=>(a.ord||0)-(b.ord||0));
  S.plans.sort((a,b)=> (PLAN_STATES.indexOf(a.status||'Active')-PLAN_STATES.indexOf(b.status||'Active')) || String(a.title||'').localeCompare(String(b.title||'')));
}

async function boot(){
  // who am I (local pick, remembered)
  S.me = LS.get('me', null);
  S.dateView = LS.get('dateview','list');

  let dbp=null, userp=null;
  try{ dbp = await claude.use('db'); }catch(e){}
  try{ userp = await claude.use('user'); }catch(e){}
  S.db = dbp;

  if(userp){
    try{ S.uid = await userp.id(); }catch(e){}
    if(!S.me || window.__forceMe){
      try{
        const me = await userp.me();
        const nm = (me && me.name) ? String(me.name).toLowerCase() : '';
        if(nm){ const hit = SEED_PEOPLE.find(p=> nm.indexOf(p.name.split(' ')[0].toLowerCase())>=0
                  && nm.indexOf(p.name.split(' ').slice(-1)[0].toLowerCase())>=0);
          if(hit){ S.me = hit.id; LS.set('me', S.me); } }
      }catch(e){}
    }
  }

  if(!S.db){
    localOnly = true;
    const cached = LS.get('data', null);
    if(cached){ COLS.forEach(c=> S[KEYOF[c]] = cached[c]||[]); }
    else {
      S.people = SEED_PEOPLE.map((p,i)=>Object.assign({ord:i},p));
      S.rocks  = SEED_ROCKS.slice();
      S.tasks  = SEED_TASKS.map((t,i)=>Object.assign({ord:i*10, at:Date.now()},t));
      S.dates  = SEED_DATES.slice();
      S.notes  = []; S.agenda = [];
      S.figures = SEED_FIGURES.map(f=>Object.assign({},f));
      S.nudges = [];
      saveLocal();
    }
    S.layout = LS.get('layout', null);
    S.view = LS.get('view', S.view);
    S.bset = LS.get('bset', null);
    S.ready = true; sortAll(); renderAll();
    return;
  }

  // private per-person layout
  if(S.uid){
    try{
      const snap = await S.db.doc('data/users/'+S.uid+'/profile').get();
      if(snap.exists){ const d=snap.data()||{};
        /* snapshots come back frozen — clone before anything mutates them */
        S.layout = d.layout ? JSON.parse(JSON.stringify(d.layout)) : null;
        S.bset = d.bset ? JSON.parse(JSON.stringify(d.bset)) : null;
        if(d.me && !S.me){ S.me=d.me; LS.set('me',S.me); }
        if(d.view) S.view=d.view;
      }
    }catch(e){}
  }
  if(!S.layout) S.layout = LS.get('layout', null);
  if(!S.view) S.view = LS.get('view', 'rows');
  if(!S.bset) S.bset = LS.get('bset', null);

  let first = COLS.length;
  COLS.forEach(c=>{
    try{
      const un = S.db.collection(c).onSnapshot(
        snap=>{
          S[KEYOF[c]] = snap.docs.map(d=>{
            let b; try{ b=JSON.parse(JSON.stringify(d.data()||{})); }catch(e){ b=Object.assign({}, d.data()||{}); }
            b.id=d.id; return b; });
          sortAll();
          if(first>0){ first--; if(first===0){ S.ready=true; } }
          if(S.ready) renderAll();
        },
        err=>{ if(first>0){ first--; if(first===0){ S.ready=true; renderAll(); } } }
      );
      unsubs.push(un);
    }catch(e){ if(first>0){ first--; } }
  });
  setTimeout(()=>{ if(!S.ready){ S.ready=true; renderAll(); } }, 4000);
}

function saveLocal(){
  if(!localOnly) return;
  const o={}; COLS.forEach(c=> o[c]=S[KEYOF[c]]); LS.set('data', o);
}

async function put(col, obj){
  const id = obj.id || uid(col.slice(0,2));
  obj.id = id;
  const body = Object.assign({}, obj); delete body.id;
  const arr = S[KEYOF[col]];
  const i = arr.findIndex(x=>x.id===id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  sortAll(); renderAll();
  if(localOnly){ saveLocal(); return id; }
  try{ await S.db.collection(col).doc(id).set(body); }
  catch(e){ toast('Could not save that — you may have view-only access.'); }
  return id;
}
/* ---- two people, one record ----
   Seven of us work in here at once. Without this, whoever saved second quietly
   replaced whatever the first had just written — their change simply vanished.
   An editor remembers what the record looked like when it opened; on save, if
   the stored one no longer matches, the person is told and gets to choose. */
function snapOf(col, id){
  if(!id) return null;
  const r=(S[KEYOF[col]]||[]).find(x=>x.id===id);
  return r ? JSON.stringify(r) : null;
}
function movedUnderYou(col, id, opened){
  if(opened==null) return false;                 /* new, or it was already gone */
  const now = snapOf(col, id);
  return now!=null && now!==opened;
}

let PSTACK = [];
