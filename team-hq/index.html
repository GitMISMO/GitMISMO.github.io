    prev.addEventListener('click', ()=>{ S.calM=new Date(S.calM.getFullYear(), S.calM.getMonth()-1, 1); vDates(root); });
    const ttl=el('h2','sect-t', MONTHS[S.calM.getMonth()]+' '+S.calM.getFullYear()); ttl.style.margin='0 6px';
    const next=el('button','btn ghost sm', MONTHS[(S.calM.getMonth()+1)%12]+' \u2192'); next.type='button';
    next.addEventListener('click', ()=>{ S.calM=new Date(S.calM.getFullYear(), S.calM.getMonth()+1, 1); vDates(root); });
    const tod=el('button','btn ghost sm','This Month'); tod.type='button'; tod.style.marginLeft='auto';
    tod.addEventListener('click', ()=>{ S.calM=today(); vDates(root); });
    bar.appendChild(prev); bar.appendChild(ttl); bar.appendChild(next); bar.appendChild(tod);
    root.appendChild(bar);
    root.appendChild(monthGrid(S.calM, dayPanel));
    return;
  }
  if(mode==='free'){
    const w=el('div');
    w.appendChild(el('h2','sect-t','Who Is Free, the Next Two Weeks'));
    w.appendChild(freeGrid(14));
    root.appendChild(w);
    return;
  }

  const withD = dateList().map(x=> ({x:x, iso:dOf(x), n:days(dOf(x))}));
  const stillOn = r=> r.n===null || r.n>=0 || (r.x.approx && inThisMonth(r.iso));
  const future = withD.filter(stillOn).sort((a,b)=>{
    if(a.n===null) return 1; if(b.n===null) return -1; return a.n-b.n; });
  const past = withD.filter(r=> !stillOn(r)).sort((a,b)=> b.n-a.n);
  const pinned = future.filter(r=>r.x.pin);

  if(pinned.length){
    root.appendChild(cdBlock('Pinned Dates', pinned.map(r=>r.x),
      ()=> vDates($('#app-dates'))));
  }

  const dups = dateDupes();
  if(dups.length){
    const bx=el('div','box');
    const h=el('div','rowflex'); h.style.marginBottom='10px';
    h.appendChild(el('h2','sect-t','Looks Like the Same Thing Twice'));
    bx.appendChild(h);
    const ovl=el('div','ovl');
    dups.forEach(d=>{
      const r=el('button','ovlrow'); r.type='button';
      const ic=el('span','ic');
      ic.innerHTML='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>';
      r.appendChild(ic);
      const x=el('div','ox');
      x.appendChild(el('b',null, d.a.t));
      x.appendChild(el('small',null, 'and \u201C'+d.b.t+'\u201D \u00B7 '+dateLabel(d.a)));
      r.appendChild(x);
      const avs=el('div','avs');
      Array.from(new Set((d.a.who||[]).concat(d.b.who||[]))).slice(0,5).forEach(id=>avs.appendChild(avatar(id,'xs')));
      r.appendChild(avs);
      r.addEventListener('click', ()=> mergeDates(d.a, d.b));
      ovl.appendChild(r);
    });
    bx.appendChild(ovl);
    root.appendChild(bx);
  }

  const bar=el('div','filterbar');
  const counts={}; future.forEach(r=> counts[r.x.k]=(counts[r.x.k]||0)+1);
  const opts=[{v:'',n:'All',c:future.length}].concat(dateKinds().filter(k=>counts[k]).map(k=>({v:k,n:k,c:counts[k]})));
  if(!S.dateFilter) S.dateFilter='';
  opts.forEach(o=>{
    const b=el('button','pill'); b.type='button';
    b.setAttribute('aria-pressed', S.dateFilter===o.v?'true':'false');
    b.appendChild(document.createTextNode(o.n)); b.appendChild(el('b',null,String(o.c)));
    b.addEventListener('click',()=>{ S.dateFilter=o.v; vDates(root); });
    bar.appendChild(b);
  });
  root.appendChild(bar);

  const shown = future.filter(r=> !S.dateFilter || r.x.k===S.dateFilter);
  const rows=el('div','rows');
  if(!shown.length) rows.appendChild(emptyBox('Nothing coming up here.','Try another filter, or add a date.'));
  else shown.forEach(r=> rows.appendChild(dateRow(r.x)));
  root.appendChild(rows);

  if(past.length) fold(root,'Already Passed', past.length, false, b=>{
    const r2=el('div','rows'); past.forEach(r=>r2.appendChild(dateRow(r.x))); b.appendChild(r2);
  });

  const c=el('div','callout');
  c.innerHTML='<b>Travel marks itself.</b> Add a date with the kind set to Travel or Summit and tag who is going — those people show as Traveling under Where My Team Is Today for exactly those days, with no one having to remember to set it.';
  root.appendChild(c);
}
function dateRow(d){
  const row=el('div','row');
  const h=el('button','rh2'); h.type='button';
  const t=el('span','t'); t.appendChild(document.createTextNode(d.t));
  const sm=el('small');
  sm.textContent = (d._on? fmtD(d._on,1) : dateLabel(d))
    + (d.time? ' · '+d.time : '')
    + (d.loc? ' · '+d.loc : '')
    + (d.rec && d.rec.f ? ' · '+recLabel(d.rec) : '')
    + (d.note? ' · '+d.note : '');
  t.appendChild(sm); h.appendChild(t);
  const r=el('span','r');
  if(d.pin) r.appendChild(el('span','chip ch-hi','Pinned'));
  const kc=el('span','chip ch-ns'); const i=el('i'); i.style.background=DKIND_C[d.k]||'var(--cn)';
  kc.appendChild(i); kc.appendChild(document.createTextNode(d.k)); r.appendChild(kc);
  const n=days(dOf(d));
  if(n!==null && n>=0){ const c=el('span','chip '+(n<=7?'ch-od':n<=30?'ch-soon':'ch-ns'));
    c.textContent = n===0?'Today': (d.approx?'≈':'')+n+(n===1?' day':' days'); r.appendChild(c); }
  (d.who||[]).slice(0,4).forEach(id=>r.appendChild(avatar(id,'xs')));
  h.appendChild(r);
  if(d._moved) r.insertBefore(el('span','chip ch-warn','Moved'), r.firstChild);
  else if(d._changed) r.insertBefore(el('span','chip ch-warn','Changed This Time'), r.firstChild);
  h.addEventListener('click', ()=> openDate(d));
  row.appendChild(h);
  return row;
}

/* Change one occurrence of a repeating date without touching the rest.
   Only the fields that differ are stored, so a later rename of the series
   still flows through to every month nobody has overridden. */
/* A row can be a standing date or one changed occurrence of one. Send each
   to the editor that matches what the row is actually showing. */
function openDate(d){
  if(d && d._occ && d._changed){
    const b=S.dates.find(x=>x.id===d._base);
    if(b) return editOccurrence(b, d._occ);
  }
  editDate(d && d._base ? S.dates.find(x=>x.id===d._base) || d : d);
}
function editOccurrence(base, iso){
  if(!base){ toast('That date has gone.'); return; }
  const ov = (base.rec && base.rec.over && base.rec.over[iso]) || {};
  const cur = k => ov[k]!==undefined ? ov[k] : base[k];
  panel('Just This One', base.t+' \u00b7 '+fmtD(iso,1), body=>{
    const note=el('div','statusnote');
    note.textContent='Changes here apply to '+fmtD(iso,1)+' only. Every other '
      +recLabel(base.rec).replace(/^The /,'').replace(/^Every /,'')+' stays as it is.';
    body.appendChild(note);

    const g=el('div','fields');
    const fT=field(g,'What Is It?', inp('text', cur('t'), base.t), 'w4');
    const fK=dateKindField(g, cur('k'));
    const pw=el('div','f w2'); pw.appendChild(el('span',null,'Countdown on Today'));
    const fP=el('label','chkrow'); const cb=el('input'); cb.type='checkbox'; cb.checked=!!cur('pin');
    fP.appendChild(cb); fP.appendChild(el('span',null,'Pin It'));
    pw.appendChild(fP); g.appendChild(pw);
    const fTm=field(g,'Time', inp('text', cur('time')||'', 'e.g. 11:00 AM \u2013 1:00 PM Eastern'), 'w2');
    const fL=field(g,'Where', inp('text', cur('loc')||'', 'City or Venue'), 'w2');
    const fMv=field(g,'Move It To', inp('date', ov.on||iso), 'w2');
    const fN=field(g,'Note', ta(cur('note')||'', 'Anything worth knowing about this one', 3), 'w4');
    body.appendChild(g);
    const mvn=el('p','note','Leave the date as it is unless this one occurrence moved. The rest of the series keeps its usual day either way.');
    body.appendChild(mvn);

    body.appendChild(el('h3','sect-t','Who Is Involved'));
    const pills=el('div','pills'); const who=new Set(cur('who')||[]);
    S.people.forEach(p2=>{
      const b2=el('button','pill'); b2.type='button'; b2.textContent=p2.name.split(' ')[0];
      b2.setAttribute('aria-pressed', who.has(p2.id)?'true':'false');
      b2.addEventListener('click',()=>{ if(who.has(p2.id)) who.delete(p2.id); else who.add(p2.id);
        b2.setAttribute('aria-pressed', who.has(p2.id)?'true':'false'); });
      pills.appendChild(b2);
    });
    body.appendChild(pills);

    const acts=el('div','rowacts');
    if(Object.keys(ov).length){
      const undo=el('button','btn ghost','Put It Back to Normal'); undo.type='button';
      undo.addEventListener('click', async ()=>{
        const rec=JSON.parse(JSON.stringify(base.rec)); if(rec.over) delete rec.over[iso];
        if(rec.over && !Object.keys(rec.over).length) delete rec.over;
        await put('dates', Object.assign({}, base, {rec:rec}));
        closePanel(); renderAll(); toast('Back to the usual '+base.t+'.');
      });
      acts.appendChild(undo);
    }
    const whole=el('button','btn ghost','Edit the Whole Series'); whole.type='button';
    whole.addEventListener('click', ()=>{ closePanel(); editDate(S.dates.find(x=>x.id===base.id)); });
    acts.appendChild(whole);
    acts.appendChild(el('span','spacer'));
    const skip=el('button','btn ghost danger','Skip It Entirely'); skip.type='button';
    skip.addEventListener('click', async ()=>{
      const rec=JSON.parse(JSON.stringify(base.rec));
      rec.skip=[...new Set([...(rec.skip||[]), iso])].sort();
      if(rec.over) delete rec.over[iso];
      await put('dates', Object.assign({}, base, {rec:rec}));
      closePanel(); renderAll(); toast(base.t+' skipped for '+fmtD(iso)+'.');
    });
    acts.appendChild(skip);
    const cancel=el('button','btn ghost','Cancel'); cancel.type='button'; cancel.addEventListener('click',closePanel);
    const save=el('button','btn','Save This One'); save.type='button';
    save.addEventListener('click', async ()=>{
      if(!fT.value.trim()){ fT.focus(); toast('Give it a name first.'); return; }
      const next={t:fT.value.trim(), k:fK.value, loc:fL.value.trim(), note:fN.value.trim(),
        who:Array.from(who), pin:cb.checked?1:0, time:fTm.value.trim()};
      /* store only what actually differs from the series */
      const diff={}; occFields().forEach(k=>{
        const a=JSON.stringify(next[k]||''), b=JSON.stringify(base[k]||'');
        if(a!==b) diff[k]=next[k];
      });
      if(fMv.value && fMv.value!==iso) diff.on=fMv.value;
      const rec=JSON.parse(JSON.stringify(base.rec));
      rec.over=rec.over||{};
      if(Object.keys(diff).length) rec.over[iso]=diff; else delete rec.over[iso];
      if(!Object.keys(rec.over).length) delete rec.over;
      await put('dates', Object.assign({}, base, {rec:rec}));
      closePanel(); renderAll();
      toast(!Object.keys(diff).length ? 'Nothing different \u2014 left as it was.'
        : diff.on ? 'Moved to '+fmtD(diff.on)+', this time only.'
        : 'Changed for '+fmtD(iso)+' only.');
    });
    acts.appendChild(cancel); acts.appendChild(save);
    body.appendChild(acts);
  });
}
function editDate(d0){
  const isNew=!d0;
  const d = d0? JSON.parse(JSON.stringify(d0)) : {t:'', d:'', e:'', k:'Deadline', pin:0, who:[], loc:'', note:'', rec:null, approx:0};
  const openedAs = snapOf('dates', d.id);
  panel(isNew?'Add a Date':'Edit Date', d.t||'', body=>{
    const g=el('div','fields');
    const fT=field(g,'What Is It?', inp('text', d.t, 'e.g. MISMO Winter Summit 2027'), 'w4');
    const fK=dateKindField(g, d.k);
    const fRep=field(g,'Repeats', sel(REPEATS, (d.rec&&d.rec.f)||''));
    const pw=el('div','f w2'); pw.appendChild(el('span',null,'Countdown on Today'));
    const fP=el('label','chkrow'); const cb=el('input'); cb.type='checkbox'; cb.checked=!!d.pin;
    fP.appendChild(cb); fP.appendChild(el('span',null,'Pin It'));
    pw.appendChild(fP); g.appendChild(pw);
    body.appendChild(g);

    /* one-off date fields */
    const oneG=el('div','fields');
    const fD=field(oneG,'Date', inp('date', d.d), 'w2');
    const fE=field(oneG,'Ends (Optional)', inp('date', d.e||''), 'w2');
    body.appendChild(oneG);

    /* repeating fields */
    const recG=el('div','fields');
    const fNth  = field(recG,'Which Week', btnRow(NTHS, String((d.rec&&d.rec.nth)||1), null, ()=>sync()), 'w2');
    const fDow  = field(recG,'Which Day', btnRow(DOW_S.map((n,i)=>({v:String(i),n:n,t:DOW[i]})), String((d.rec&&d.rec.dow)!=null?d.rec.dow:2), 'wk', ()=>sync()), 'w2');
    const fMon  = field(recG,'Month', btnRow(MONTHS.map((n,i)=>({v:String(i+1),n:n.slice(0,3),t:n})), String((d.rec&&d.rec.m)||1), 'mo', ()=>sync()), 'w4');
    const fDay  = field(recG,'Day of the Month', dayGrid((d.rec&&d.rec.day)||1, ()=>sync()), 'w4');
    const fMons = field(recG,'Which Months', el('div','btnrow mo'), 'w4');
    const monSel = new Set(((d.rec&&d.rec.months)||[1,4,7,10]).map(Number));
    MONTHS.forEach((n,i)=>{
      const b=el('button'); b.type='button'; b.textContent=n.slice(0,3); b.title=n;
      b.setAttribute('aria-pressed', monSel.has(i+1)?'true':'false');
      b.addEventListener('click',()=>{ const v=i+1; if(monSel.has(v)) monSel.delete(v); else monSel.add(v);
        b.setAttribute('aria-pressed', monSel.has(v)?'true':'false'); sync(); });
      fMons.appendChild(b);
    });
    const fFrom  = field(recG,'Starting From', inp('date', (d.rec&&d.rec.from)||isoOf(today())), 'w2');
    const fEvery = field(recG,'How Often', btnRow([1,2,3,4].map(n=>({v:String(n),
      n:n===1?'Every week':n===2?'Every other week':'Every '+n+' weeks'})),
      String((d.rec&&d.rec.every)||2), null, ()=>sync()), 'w4');
    const fUntil = field(recG,'Stop Repeating After (Optional)', inp('date', (d.rec&&d.rec.until)||''), 'w2');
    body.appendChild(recG);

    /* occurrences: cancel one without touching the rest, and put one back */
    const skips = new Set(((d.rec&&d.rec.skip)||[]));
    const occG = el('div','occbox');
    body.appendChild(occG);
    function drawOcc(){
      occG.innerHTML='';
      const r=buildRec(); if(!r){ occG.hidden=true; return; }
      occG.hidden=false;
      occG.appendChild(el('h3','sect-t','The Next Few'));
      occG.appendChild(el('p','note','Skip one of these and the rest carry on as normal. To stop it for good, set Stop Repeating After. Delete takes it off the page entirely.'));
      const list=el('div','occlist');
      const soon=recUpcoming(Object.assign({}, r, {skip:[]}), 5);
      const over=(d.rec&&d.rec.over)||{};
      soon.forEach(iso=>{
        const row=el('div','occrow'+(skips.has(iso)?' off':''));
        const o=over[iso]||null;
        const nm=el('span','on', fmtD(o && o.on ? o.on : iso, 1));
        const bits=[]; if(o && o.t) bits.push(o.t); if(o && o.time) bits.push(o.time);
        if(o && o.on) bits.push('moved from '+fmtD(iso));
        if(bits.length) nm.appendChild(el('small',null,bits.join(' \u00b7 ')));
        row.appendChild(nm);
        if(o && !skips.has(iso)) row.appendChild(el('span','chip ch-warn', o.on?'Moved':'Changed'));
        if(!isNew && !skips.has(iso)){
          const c=el('button','btn sm ghost','Change'); c.type='button';
          c.title='Rename or re-tag this one occurrence';
          c.addEventListener('click',()=> editOccurrence(S.dates.find(y=>y.id===d.id), iso));
          row.appendChild(c);
        }
        const b=el('button','btn sm ghost', skips.has(iso)? 'Put It Back' : 'Skip This One'); b.type='button';
        b.addEventListener('click',()=>{ if(skips.has(iso)) skips.delete(iso); else skips.add(iso); drawOcc(); sync(); });
        row.appendChild(b);
        list.appendChild(row);
      });
      [...skips].filter(x=> soon.indexOf(x)<0).sort().forEach(iso=>{
        const row=el('div','occrow off');
        row.appendChild(el('span','on', fmtD(iso,1)));
        const b=el('button','btn sm ghost','Put It Back'); b.type='button';
        b.addEventListener('click',()=>{ skips.delete(iso); drawOcc(); sync(); });
        row.appendChild(b); list.appendChild(row);
      });
      occG.appendChild(list);
    }

    const apw=el('div'); const apL=el('label','chkrow');
    const apb=el('input'); apb.type='checkbox'; apb.checked=!!d.approx;
    apL.appendChild(apb); apL.appendChild(el('span',null,'The exact day is not set yet — show it as approximate'));
    apw.appendChild(apL); body.appendChild(apw);

    const prev=el('div','statusnote'); body.appendChild(prev);

    const g2=el('div','fields');
    const fTm=field(g2,'Time (Optional)', inp('text', d.time||'', 'e.g. 11:00 AM \u2013 1:00 PM Eastern'), 'w2');
    const fL=field(g2,'Where', inp('text', d.loc||'', 'City or Venue'), 'w2');
    const fN=field(g2,'Note', ta(d.note||'', 'Anything worth knowing about this date', 3), 'w4');
    body.appendChild(g2);

    function buildRec(){
      const f=fRep.value; if(!f) return null;
      let r=null;
      if(f==='w')  r={f:f, from:fFrom.value||isoOf(today()), every:+gv(fEvery)};
      if(f==='md') r={f:f, day:+gv(fDay)};
      if(f==='mw') r={f:f, nth:+gv(fNth), dow:+gv(fDow)};
      if(f==='y')  r={f:f, m:+gv(fMon), day:+gv(fDay)};
      if(f==='ym') r={f:f, m:+gv(fMon)};
      if(f==='q')  r={f:f, months:Array.from(monSel).sort((a,b)=>a-b), day:+gv(fDay)};
      if(!r) return null;
      const u=fUntil.value; if(u) r.until=u;
      const sk=[...skips].sort(); if(sk.length) r.skip=sk;
      /* per-occurrence changes survive an edit to the series */
      if(d.rec && d.rec.over && Object.keys(d.rec.over).length) r.over=d.rec.over;
      return r;
    }
    function sync(){
      const f=fRep.value;
      oneG.hidden = !!f;
      recG.hidden = !f;
      fFrom.parentNode.hidden  = (f!=='w');
      fEvery.parentNode.hidden = (f!=='w');
      fDay.parentNode.hidden  = !(f==='md'||f==='y'||f==='q');
      fNth.parentNode.hidden  = (f!=='mw');
      fDow.parentNode.hidden  = (f!=='mw');
      fMon.parentNode.hidden  = !(f==='y'||f==='ym');
      fMons.parentNode.hidden = (f!=='q');
      fUntil.parentNode.hidden = !f;
      apw.hidden = !f && !d.approx ? false : false;
      if(f){ const r=buildRec(); const iso=nextRec(r);
        prev.textContent = recLabelFull(r) + (iso? ' · next on ' + fmtD(iso,1) : ' · nothing left to come');
        prev.hidden=false; }
      else { const n=days(fD.value);
        prev.textContent = fD.value? (n===0?'That is today.': n>0? 'That is '+n+(n===1?' day':' days')+' from now.' : 'That has already passed.') : 'Pick a date, or set it to repeat.';
        prev.hidden=false; }
    }
    [fRep,fD,fUntil,fFrom].forEach(x=> x.addEventListener('change', ()=>{ drawOcc(); sync(); }));
    drawOcc(); sync();

    body.appendChild(el('h3','sect-t','Who Is Involved'));
    const pills=el('div','pills'); const who = new Set(d.who||[]);
    S.people.forEach(p=>{
      const b=el('button','pill'); b.type='button'; b.textContent=p.name.split(' ')[0];
      b.setAttribute('aria-pressed', who.has(p.id)?'true':'false');
      b.addEventListener('click',()=>{ if(who.has(p.id)) who.delete(p.id); else who.add(p.id);
        b.setAttribute('aria-pressed', who.has(p.id)?'true':'false'); });
      pills.appendChild(b);
    });
    body.appendChild(pills);

    const acts=el('div','rowacts');
    if(!isNew){
      const rep = !!(d.rec && d.rec.f);
      const del=el('button','btn danger', rep?'Delete the Whole Series':'Delete'); del.type='button';
      del.title = rep? 'Takes every occurrence off the page, past and future' : '';
      del.addEventListener('click',()=>{ if(del.dataset.c){ closePanel(); dropUndo('dates', d.id, rep?'Series':'Date'); }
        else { del.dataset.c='1'; del.textContent='Click Again to Delete'; } });
      acts.appendChild(del); acts.appendChild(el('span','spacer'));
    }
    const cancel=el('button','btn ghost','Cancel'); cancel.type='button'; cancel.addEventListener('click',closePanel);
    const save=el('button','btn','Save'); save.type='button';
    save.addEventListener('click', async ()=>{
      if(!fT.value.trim()){ fT.focus(); toast('Give it a name first.'); return; }
      const r=buildRec();
      if(!r && !fD.value){ toast('Pick a date, or set it to repeat.'); return; }
      d.t=fT.value.trim(); d.k=fK.value; d.pin=cb.checked?1:0; d.approx=apb.checked?1:0;
      d.loc=fL.value.trim(); d.note=fN.value.trim(); d.who=Array.from(who); d.time=fTm.value.trim();
      if(r){ d.rec=r; d.d=''; d.e=''; } else { d.rec=null; d.d=fD.value; d.e=fE.value; }
      const commitD = async ()=>{ await put('dates', d); closePanel(); toast(isNew?'Date added.':'Saved.'); };
      const DLAB = {t:'the name', k:'the kind', d:'the date', e:'the end date', pin:'the pin',
        who:'who is involved', loc:'where', note:'the note', time:'the time', rec:'how it repeats'};
      if(movedUnderYou('dates', d.id, openedAs)) return askOverwrite('dates', d.id, openedAs, DLAB, commitD);
      await commitD();
    });
    acts.appendChild(cancel); acts.appendChild(save); body.appendChild(acts);
  });
}

const DEF_ROWS = [
  [{t:'mytasks', wide:1}, {t:'duesoon'}],
  [{t:'countdown'}],
  [{t:'myrails'}, {t:'watching'}],
  [{t:'numbers'}, {t:'links'}]
];
const DEF_LAYOUT = DEF_ROWS;
/* ---------------------------------------------------------------------------
   The board is ROWS of panels, not one long list. A row splits evenly between
   whatever is on it, so taking one off a row of three leaves two halves, and
   dropping a fourth on makes four quarters. A panel marked wide takes a double
   share of its row. This is what makes a drop land where the bar said it would:
   with fixed widths, inserting at the right place still reflowed panels into
   a different row.
   Shape: S.layout = [ {r:[panel, panel]}, {r:[panel]} ]
--------------------------------------------------------------------------- */
const ROW_MAX = 4;
/* ---- board-wide settings, with the per-panel gear still able to override ---- */
const BSET_DEF = {match:1, autocol:1, style:'plain', tiles:['total','oversight','high','late']};
const HEAD_TILES = [
  {v:'total',     n:'Hands-On'},
  {v:'oversight', n:'Watching'},
  {v:'high',      n:'High Priority'},
  {v:'late',      n:'Past Due'},
  {v:'rails',     n:'Running Rails'},
  {v:'week',      n:'Landing This Week'},
  {v:'rocks',     n:'Projects I Am In'}
];
function bset(){
  if(!S.bset) S.bset = JSON.parse(JSON.stringify(BSET_DEF));
  if(!Array.isArray(S.bset.tiles) || !S.bset.tiles.length) S.bset.tiles = BSET_DEF.tiles.slice();
  if(S.bset.style!=='bold' && S.bset.style!=='plain') S.bset.style = BSET_DEF.style;
  return S.bset;
}
/* a color nobody on the board is already using, where one is free */
function nextColor(L){
  const used={}; eachPanel(L, w=>{ if(w.col) used[w.col]=1; });
  const pool = PANEL_COLORS.filter(c=>c.v);
  const free = pool.filter(c=>!used[c.v]);
  const from = free.length ? free : pool;
  return from[Math.floor(Math.random()*from.length)].v;
}
function layout(){
  if(!(S.layout && S.layout.length)) S.layout = DEF_ROWS.map(r=>({r:r.map(x=>Object.assign({},x))}));
  /* an older board was a flat list of panels — pack it into rows by the widths
     it used to carry, so it comes back looking much as it did */
  if(!S.layout[0] || !S.layout[0].r){
    const span = {w3:3,w4:4,w6:6,w8:8,w9:9,w12:12};
    const rows=[]; let cur=[], used=0;
    S.layout.forEach(w=>{
      if(!w || !WTYPES[w.t]) return;
      const sp = span[w.w] || 6;
      if(used+sp > 12 || cur.length >= ROW_MAX){ if(cur.length) rows.push({r:cur}); cur=[]; used=0; }
      if(sp >= 8) w.wide = 1;
      delete w.w;
      cur.push(w); used += sp;
    });
    if(cur.length) rows.push({r:cur});
    S.layout = rows.length ? rows : DEF_ROWS.map(r=>({r:r.map(x=>Object.assign({},x))}));
    saveMine();
  }
  /* drop anything retired, and any row left empty, so an old board heals itself */
  let changed=false;
  const clean=[];
  S.layout.forEach(row=>{
    if(!row || !row.r) { changed=true; return; }
    const keep = row.r.filter(w=> w && WTYPES[w.t]);
    if(keep.length !== row.r.length) changed=true;
    if(keep.length){ row.r = keep.slice(0, ROW_MAX); clean.push(row); }
    else changed=true;
  });
  if(changed){ S.layout = clean.length ? clean : DEF_ROWS.map(r=>({r:r.map(x=>Object.assign({},x))})); saveMine(); }
  return S.layout;
}
/* how many of the twelve columns each panel on a row gets */
function rowSpans(row){
  const shares = row.r.map(w=> w.wide ? 2 : 1);
  const total = shares.reduce((a,b)=>a+b,0);
  const spans = shares.map(sh=> Math.max(3, Math.floor(12*sh/total)));
  /* give whatever is left over to the widest one, so a row always fills */
  let slack = 12 - spans.reduce((a,b)=>a+b,0);
  while(slack > 0){ let k=0; spans.forEach((v,i)=>{ if(shares[i]>shares[k]) k=i; }); spans[k]++; slack--; }
  while(slack < 0){ let k=0; spans.forEach((v,i)=>{ if(spans[i]>spans[k]) k=i; }); if(spans[k]<=3) break; spans[k]--; slack++; }
  return spans;
}
/* every panel on the board, in order, with where it sits */
function eachPanel(L, fn){ L.forEach((row,ri)=> row.r.forEach((w,ci)=> fn(w,ri,ci,row))); }
function findPanel(L, w){
  for(let ri=0; ri<L.length; ri++){ const ci=L[ri].r.indexOf(w); if(ci>=0) return {ri,ci}; }
  return null;
}

  bg.addEventListener('click', ()=> boardSettings(layout()));
  right.appendChild(bg);
  vhead(root,'My Board', me? 'Drag a panel by its header to move it. Drop it on a row to join that row, above or below to start a new one.' : 'Pick your name up top and this becomes yours.', right);

    const b2=el('button','btn','Pick My Name'); b2.type='button'; b2.style.marginTop='14px';
    b2.addEventListener('click', pickMe); bx.appendChild(b2);

/* ---- the board's own gear ---- */
function boardSettings(L){
  const B=bset();
  sheet(box=>{
    box.appendChild(el('h2',null,'My Board Settings'));
    box.appendChild(el('p',null,'These set the whole board. A panel\u2019s own settings still win, so one panel can differ.'));

      B.match = v==='1'?1:0; saveMine(); vMine($('#app-mine')); }));
    mf.appendChild(el('small','hint','A collapsed panel always stays short, whichever you pick.'));
    fs.appendChild(mf);

    const cf=el('label','f w2'); cf.appendChild(el('span',null,'Color'));
    const cr=el('div','rowflex'); cr.style.flexWrap='wrap'; cr.style.gap='8px';
    const rnd=el('button','btn sm','Randomize Every Panel'); rnd.type='button';
    rnd.addEventListener('click', ()=>{
      const pool=PANEL_COLORS.filter(c=>c.v).map(c=>c.v);
      for(let i=pool.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[k]; pool[k]=t; }
      let i=0; eachPanel(L, w=>{ w.col = pool[i % pool.length]; i++; });
      saveMine(); vMine($('#app-mine')); toast('Colors shuffled.');
    });
    const clr=el('button','btn ghost sm','Clear Them All'); clr.type='button';
    clr.addEventListener('click', ()=>{ eachPanel(L, w=>{ w.col=''; }); saveMine(); vMine($('#app-mine')); toast('Colors cleared.'); });
    cr.appendChild(rnd); cr.appendChild(clr);
    cf.appendChild(cr);
    const ac=el('label','chkrow'); const cb=inp('checkbox'); cb.checked=!!B.autocol;
    cb.addEventListener('change', ()=>{ B.autocol = cb.checked?1:0; saveMine(); });
    ac.appendChild(cb); ac.appendChild(el('span',null,'Give a new panel a color automatically'));
    cf.appendChild(ac);
    fs.appendChild(cf);

    const sf=el('label','f w2'); sf.appendChild(el('span',null,'How a New Panel Looks'));
    sf.appendChild(btnRow([{v:'plain',n:'Plain'},{v:'bold',n:'Bold'}], B.style, 'tiny', v=>{
      B.style = (v==='bold')?'bold':'plain'; saveMine(); closeSheet(); boardSettings(L); }));
    const sr=el('div','rowflex'); sr.style.marginTop='8px';
    const sa=el('button','btn ghost sm','Change Every Panel to This'); sa.type='button';
    sa.addEventListener('click', ()=>{
      eachPanel(L, w=>{ if(B.style==='bold') w.st='bold'; else delete w.st; });
      saveMine(); vMine($('#app-mine')); toast(B.style==='bold'?'All bold.':'All plain.');
    });
    sr.appendChild(sa); sf.appendChild(sr);
    sf.appendChild(el('small','hint','Bold adds a strip across the top showing how much of the work inside is done.'));
    fs.appendChild(sf);

    const tf=el('label','f w2'); tf.appendChild(el('span',null,'What the Top Band Counts'));
    const tg=el('div','pills');
    HEAD_TILES.forEach(t=>{
      const on = B.tiles.indexOf(t.v)>=0;
      const bb=el('button','pill',t.n); bb.type='button';
      bb.setAttribute('aria-pressed', String(on));
      if(!on && B.tiles.length>=4){ bb.disabled=true; bb.title='Take one off first \u2014 four is all that fits.'; }
      bb.addEventListener('click', ()=>{
        const k=B.tiles.indexOf(t.v);
        if(k>=0){ if(B.tiles.length<=1) { toast('Keep at least one.'); return; } B.tiles.splice(k,1); }
        else { if(B.tiles.length>=4){ return; } B.tiles.push(t.v); }
        saveMine(); vMine($('#app-mine')); closeSheet(); boardSettings(L);
      });
      tg.appendChild(bb);
    });
    tf.appendChild(tg);
    tf.appendChild(el('small','hint','Four at a time. Take one off and the rest become available again \u2014 they show in the order you pick them.'));
    fs.appendChild(tf);

    box.appendChild(fs);
    const acts=el('div','modal-acts');
    const rs=el('button','btn ghost','Reset to the Default Board'); rs.type='button';
    rs.addEventListener('click', ()=>{ S.bset = JSON.parse(JSON.stringify(BSET_DEF)); saveMine(); closeSheet(); vMine($('#app-mine')); });
    const dn=el('button','btn','Done'); dn.type='button'; dn.addEventListener('click', closeSheet);
    acts.appendChild(rs); acts.appendChild(dn); box.appendChild(acts);
  });
}

/* the navy band, the same shape as the one on Today but about you */
function myHeadline(me){
  const L=loadOf(me.id);
  const h=new Date().getHours();
  const greet = h<12 ? 'Morning' : h<17 ? 'Afternoon' : 'Evening';
  const mine = doingTasks(me.id).filter(t=>t.s!=='Done');
  const late = mine.filter(t=>{const n=days(t.due); return n!==null && n<0;});
  const week = mine.filter(t=>{const n=days(t.due); return n!==null && n>=0 && n<=7;});
  const ef = effStatus(me);

  const hl=el('div','headline');
  const top=el('div','rowflex');
  top.appendChild(el('div','hl-date', greet+', '+me.name.split(' ')[0]));
  const st=el('button','chip stbtn'); st.type='button';
  st.title='Set My Status';
  st.style.cssText='margin-left:auto;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(116,191,235,.35);cursor:pointer';
  const si=el('i'); si.style.background=statusOf(ef.k).c; st.appendChild(si);
  st.appendChild(document.createTextNode(statusOf(ef.k).n));
  const pen=document.createElementNS('http://www.w3.org/2000/svg','svg');
  pen.setAttribute('class','stpen'); pen.setAttribute('viewBox','0 0 24 24');
  const pp=document.createElementNS('http://www.w3.org/2000/svg','path');
  pp.setAttribute('d','M6 9l6 6 6-6'); pen.appendChild(pp); st.appendChild(pen);
  st.addEventListener('click', ()=> setStatus(me));
  top.appendChild(st);
  hl.appendChild(top);

  const say=el('div','hl-say');
  if(late.length) say.innerHTML = 'You have <em class="hl-late">'+late.length+(late.length===1?' thing':' things')+' past due</em>'+(week.length? ' and '+week.length+' more landing this week.' : '.');
  else if(week.length) say.innerHTML = 'Nothing late. <em>'+week.length+(week.length===1?' thing lands':' things land')+'</em> this week.';
  else if(mine.length) say.innerHTML = '<em>Nothing late, nothing due this week.</em> Good week to push a Team Project along.';
  else say.innerHTML = '<em>Your board is clear.</em> Room to take something on.';
  hl.appendChild(say);
  const occ = occBanner(me.id);
  if(occ) hl.appendChild(occ);

  const tl=el('div','tiles');
  const mk=(n,lab,sub,cls,go)=>{ const t=el('button','tile'+(cls?' '+cls:'')); t.type='button';
    t.appendChild(el('b',null,String(n))); t.appendChild(el('span',null,lab));
    if(sub) t.appendChild(el('small',null,sub)); if(go) t.addEventListener('click',go); return t; };
  const rocksIn = (()=>{ const seen={}; doingTasks(me.id).forEach(t=>{ if(t.r) seen[t.r]=1; });
    return Object.keys(seen).length; })();
  const TILE = {
    total:     ()=> mk(L.total,'Hands-On','things you are doing'),
    oversight: ()=> mk(L.oversight,'Watching','yours, someone else is doing it'),
    high:      ()=> mk(L.high,'High Priority', L.high>3?'a lot at once':'across your work', L.high>3?'warn':''),
    late:      ()=> mk(late.length,'Past Due', late.length?'needs a decision':'all clear', late.length?'bad':''),
    rails:     ()=> mk(L.rails,'Running Rails','the ongoing ones'),
    week:      ()=> mk(week.length,'Landing This Week', week.length?'due in seven days':'nothing due'),
    rocks:     ()=> mk(rocksIn,'Projects I Am In','the ones you have work in')
  };
  bset().tiles.forEach(k=>{ const f=TILE[k]; if(f) tl.appendChild(f()); });
  hl.appendChild(tl);

  /* what other people have asked of you, and the trips with no expenses yet */
  const nu = myNudges(me.id);
  const gaps = expenseGaps(me.id);
  if(nu.length || gaps.length){
    const nl=el('div','nudges');
    gaps.forEach(g=>{
      const r=el('div','nudge auto');
      const tx=el('div','nx');
      tx.appendChild(el('b',null,'No expenses yet for '+g.t));
      tx.appendChild(el('span',null,'You got back '+g.days+(g.days===1?' day':' days')+' ago'+(g.loc?' from '+g.loc:'')+'. Nothing has been claimed against it.'));
      r.appendChild(tx);
      const acts=el('div','nbtns');
      /* Expenses do not always go through Team HQ — a lot of them are filed
         straight into DataBasics. This is how that reminder goes away without
         anyone having to type the expense in twice. */
      const done=el('button','nbtn ghost','Already Claimed'); done.type='button';
      done.title='Clear this reminder \u2014 the expenses were submitted somewhere else';
      done.addEventListener('click', ()=> clearExpGap(me.id, g));
      acts.appendChild(done);
      const go=el('button','nbtn','Add Them'); go.type='button';
      go.addEventListener('click', ()=>{ show('expenses'); setTimeout(()=>editExp(null, g.t), 120); });
      acts.appendChild(go);
      r.appendChild(acts);
      nl.appendChild(r);
    });
    nu.forEach(n=>{
      const r=el('div','nudge k-'+(n.k||'note'));
      const tx=el('div','nx');
      const from = person(n.by);
      tx.appendChild(el('b',null, n.m || '(no message)'));
      tx.appendChild(el('span',null, (from? from.name.split(' ')[0] : 'Someone')+
        ' \u00b7 '+(NUDGE_KINDS.find(x=>x.v===n.k)||{n:'Note'}).n.toLowerCase()+
        ' \u00b7 '+relWhen(n.at)));
      r.appendChild(tx);
      const ok=el('button','nbtn','Got It'); ok.type='button';
      ok.addEventListener('click', ()=>{ const o=Object.assign({},n,{done:1, doneAt:Date.now()}); put('nudges', o); });
      r.appendChild(ok);
      nl.appendChild(r);
    });
    hl.appendChild(nl);
  }
  return hl;
}
function relWhen(at){
  if(!at) return '';
  const n=Math.floor((Date.now()-at)/86400000);
  return n<=0 ? 'today' : n===1 ? 'yesterday' : n+' days ago';
}

/* send someone a nudge */
function sendNudge(to){
  const me=S.me;
  if(!me){ toast('Pick your name first.'); return; }

  {v:'', n:'None'},      {v:'c1', n:'Blue'},   {v:'c2', n:'Orange'}, {v:'c3', n:'Green'},
  {v:'c4', n:'Gold'},    {v:'c5', n:'Pink'},   {v:'c6', n:'Leaf'},   {v:'c7', n:'Violet'},

];
const PANEL_SHARE = [{v:'',n:'An Equal Share'},{v:'1',n:'A Double Share'}];
const PANEL_STYLES = [{v:'',n:'Plain'},{v:'bold',n:'Bold'}];

function widget(w, ri, ci, L, span){
  const def = WTYPES[w.t] || {n:'Panel'};
  const n=el('div','widget'+(w.st==='bold'?' bold':''));
  n.style.gridColumn = 'span '+span;
  if(w.col) n.style.setProperty('--pc', 'var(--'+w.col+')');
  n.dataset.r=String(ri); n.dataset.c=String(ci); n.dataset.t=w.t;
  const h=el('header');
  let dragged=false;
  const grip=el('span','grip'); grip.title='Drag this header to move the panel \u2014 on a phone, hold it until it lifts, then drag';
  grip.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"/></svg>';
  h.appendChild(grip);
  let title = def.n;
  if(w.t==='rock' && w.k && rock(w.k)) title = rock(w.k).name;
  if(w.t==='person' && w.k && person(w.k)) title = person(w.k).name.split(' ')[0]+'\u2019s Board';
  if(w.t==='plan' && w.k && planOf(w.k)) title = planOf(w.k).title;
  /* a numbers panel holding exactly one figure is that figure, so say so */
  if(w.t==='numbers' && w.k && w.k.length===1){ const f1=figure(w.k[0]); if(f1) title = f1.n; }
  /* The chevron folds the panel away. The title opens it in the right rail at
     full width, which is where a long list is actually readable. */
  const fold=el('button','cwb'); fold.type='button';
  fold.setAttribute('aria-expanded', w.c?'false':'true');
  fold.title = w.c? 'Open this panel' : 'Collapse this panel';
  fold.setAttribute('aria-label', fold.title);
  const cw=document.createElementNS('http://www.w3.org/2000/svg','svg');
  cw.setAttribute('class','cw'); cw.setAttribute('viewBox','0 0 24 24');
  const cp=document.createElementNS('http://www.w3.org/2000/svg','path');
  cp.setAttribute('d','M9 6l6 6-6 6'); cw.appendChild(cp); fold.appendChild(cw);
  fold.addEventListener('click', e=>{ e.stopPropagation(); if(dragged){ dragged=false; return; }
    w.c = w.c?0:1; saveMine(); vMine($('#app-mine')); });
  /* the note wall stays open: a wall of jotted notes nobody can see is the one
     thing worse than no wall at all */
  if(w.t!=='notes') h.appendChild(fold);
  else w.c = 0;

  const tog=el('button','tog'); tog.type='button';
  tog.title = 'Open '+title+' in the side panel';
  /* the note wall says the number in words, so it does not also need a badge */
  const named = (w.t==='notes' && S.notes.length);
  if(named) title = S.notes.length+(S.notes.length===1?' Note to Review':' Notes to Review');
  tog.appendChild(el('h3',null,title));
  const cnt = named ? null : widgetCount(w);
  if(cnt!=null) tog.appendChild(el('span','cnt', String(cnt)));
  tog.addEventListener('click', ()=>{ if(dragged){ dragged=false; return; }
    openWidgetPanel(w, title); });
  h.appendChild(tog);

  const acts=el('div','wacts');
  const gear=el('button','wgear'); gear.type='button'; gear.title='How this panel looks';
  gear.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/>'+
    '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  gear.addEventListener('click', e=>{ e.stopPropagation(); panelLook(w, L, title); });
  acts.appendChild(gear);
  h.appendChild(acts);
  n.appendChild(h);
  if(w.st==='bold'){
    const m = widgetMeter(w);
    if(m){
      const strip=el('div','wmeter');
      if(m.pct!=null){
        const tr=el('div','wmtrack'); const fl=el('i');
        fl.style.width = Math.max(2, m.pct)+'%';
        tr.appendChild(fl); strip.appendChild(tr);
        strip.appendChild(el('span','wmpct', m.pct+'%'));
      }
      strip.appendChild(el('span','wmlab', m.label));
      n.appendChild(strip);
    }
  }
  if(w.c) n.classList.add('shut');
  else { const b=el('div','wbody'); buildWidget(w, b); n.appendChild(b); }

  dragHandle(h, {
    ignore: '.wacts',
    ghostNode: ()=>{
      const g=el('div','ghostpill');
      if(w.col) g.style.setProperty('--pc','var(--'+w.col+')');
      g.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"/></svg>';
      g.appendChild(el('span',null,title));
      return g;
    },
    hitTest: (under)=>{ const t = under.closest && under.closest('#app-mine .widget');
      return (t && t!==n) ? t : null; },
    candidates: ()=> $$('#app-mine .widget').filter(x=>x!==n),
    /* near the top or bottom edge of a panel means a NEW row, not a seat on
       this one — that is the whole difference she asked for */
    bandFor: (t, x, y)=>{
      const r=t.getBoundingClientRect();
      const pad=Math.min(26, r.height/3);
      if(y < r.top + pad) return {mode:'row', before:true};
      if(y > r.bottom - pad) return {mode:'row', before:false};
      const full = (L[+t.dataset.r]||{r:[]}).r.length >= ROW_MAX;
      if(full) return {mode:'row', before: y < r.top + r.height/2};
      return {mode:'seat', before: x < r.left + r.width/2};
    },
    onArm: ()=>{ n.classList.add('lifted'); },
    onStart: ()=>{ dragged=true; n.classList.add('dragging'); n.classList.add('lifted');
      document.body.classList.add('moving-panel'); },
    onEnd: (didDrag)=>{ n.classList.remove('dragging'); n.classList.remove('lifted');
      document.body.classList.remove('moving-panel');
      if(didDrag) setTimeout(()=>{ dragged=false; }, 60); else dragged=false; },
    onDrop: (target, band)=>{
      const here = findPanel(L, w); if(!here) return;
      const tr = +target.dataset.r, tc = +target.dataset.c;
      if(isNaN(tr) || isNaN(tc)) return;
      /* lift it out first, then put it back — so every index below is the
         index in the board as it will actually be */
      L[here.ri].r.splice(here.ci,1);
      let rowAt = tr;
      if(!L[here.ri].r.length){ L.splice(here.ri,1); if(tr > here.ri) rowAt--; }
      if(band.mode==='row'){
        L.splice(band.before ? rowAt : rowAt+1, 0, {r:[w]});
      } else {
        const row = L[rowAt];
        if(!row){ L.push({r:[w]}); }
        else {
          let at = tc;
          /* compare against the row it CAME from, not the possibly-shifted index
             of the row it is going to — otherwise a panel that was alone on the
             row above lands one seat to the left of the marker */
          if(here.ri===tr && here.ci < tc) at--;
          if(!band.before) at++;
          at = Math.max(0, Math.min(at, row.r.length));
          row.r.splice(at, 0, w);
        }
      }
      saveMine(); vMine($('#app-mine'));
      /* the board has just redrawn, so find the panel again and flash where it
         landed — on a phone especially, a silent reshuffle is disorienting */
      setTimeout(()=>{
        const moved = $$('#app-mine .widget').find(x=> x.dataset.t===w.t);
        if(moved){ moved.classList.add('justmoved');
          setTimeout(()=>{ moved.classList.remove('justmoved'); }, 1100); }
      }, 30);
      toast((WTYPES[w.t]||{n:'Panel'}).n+' moved.');
    }
  });

  return n;
}

/* one sheet for everything about how a panel looks */
function panelLook(w, L, title){
  const def = WTYPES[w.t] || {};
  sheet(box=>{
    box.appendChild(el('h2',null, title));
    box.appendChild(el('p',null,'How this panel looks on your board. Nobody else sees your choices.'));
    const fs=el('div','fields');

    const here = findPanel(L, w);
    const onRow = here ? L[here.ri].r.length : 1;
    const wf=el('label','f w2'); wf.appendChild(el('span',null,'Share of Its Row'));
    wf.appendChild(btnRow(PANEL_SHARE, w.wide? '1':'', 'tiny', v=>{
      w.wide = v? 1 : 0; saveMine(); vMine($('#app-mine')); }));
    wf.appendChild(el('small','hint', onRow>1
      ? 'Sharing this row with '+(onRow-1)+(onRow===2?' other panel.':' other panels.')+' A double share makes it twice as wide as the rest.'
      : 'On a row of its own, so it runs the full width. Drag another panel onto this row to split it.'));
    fs.appendChild(wf);

    const cf=el('label','f w2'); cf.appendChild(el('span',null,'Color'));
    const cg=el('div','swatches');
    PANEL_COLORS.forEach(c=>{
      const b=el('button','sw'+((w.col||'')===c.v?' on':'')); b.type='button'; b.title=c.n;
      if(c.v) b.style.setProperty('--pc','var(--'+c.v+')'); else b.classList.add('none');
      b.addEventListener('click', ()=>{ w.col=c.v; saveMine(); vMine($('#app-mine'));
        cg.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
      cg.appendChild(b);
    });
    cf.appendChild(cg); fs.appendChild(cf);

    const sf=el('label','f w2'); sf.appendChild(el('span',null,'Style'));
    sf.appendChild(btnRow(PANEL_STYLES, w.st||'', 'tiny', v=>{
      w.st=v; saveMine(); vMine($('#app-mine')); applyLbl(); }));
    const allb=el('button','btn ghost sm','Use This Style on Every Panel'); allb.type='button';
    allb.style.marginTop='8px'; allb.style.alignSelf='flex-start';
    allb.addEventListener('click', ()=>{
      const v=w.st||'';
      eachPanel(L, x=>{ x.st = v; });
      saveMine(); vMine($('#app-mine'));
      toast('Every panel is now '+(v==='bold'?'bold':'plain')+'.');
    });
    const applyLbl=()=>{ allb.textContent = 'Use '+((w.st||'')==='bold'?'Bold':'Plain')+' on Every Panel'; };
    applyLbl();
    sf.appendChild(allb);
    sf.appendChild(el('small','hint','Plain is the quiet card. Bold adds a colored top edge and, under the heading, how far along what is inside actually is \u2014 so you can read the panel without opening it.'));
    fs.appendChild(sf);

    box.appendChild(fs);
    const acts=el('div','modal-acts');
    const off=el('button','btn ghost danger','Take It Off My Board'); off.type='button';
    off.addEventListener('click', ()=>{
      const at=findPanel(L, w);
      if(at){ L[at.ri].r.splice(at.ci,1); if(!L[at.ri].r.length) L.splice(at.ri,1); }
      saveMine(); closeSheet(); vMine($('#app-mine'));
    });
    const done=el('button','btn','Done'); done.type='button'; done.addEventListener('click', closeSheet);
    acts.appendChild(off); acts.appendChild(done); box.appendChild(acts);
  });
}

/* the number on a collapsed panel, so a shut one still tells you something */
/* One panel, opened on its own in the right rail. It is the same body the board
   draws, just given the whole width — and it redraws itself when something in it
   changes the board. */
function openWidgetPanel(w, title){
  const def = WTYPES[w.t] || {n:'Panel', d:''};
  const e = {title:title, sub:def.d||'', wpanel:1,
    build: b=>{ b.classList.add('wpanelbody'); buildWidget(w, b); }};
  if(!panelOpen()) PSTACK = [];
  PSTACK.push(e);
  drawPanel();
}

function widgetCount(w){
  const me=S.me; if(!me) return null;
  try{
    if(w.t==='mytasks')  return doingTasks(me).filter(t=>t.s!=='Done' && !t.rail).length;
    if(w.t==='myrails')  return doingTasks(me).filter(t=>t.s!=='Done' && t.rail).length;
    if(w.t==='watching') return watchingTasks(me).filter(t=>t.s!=='Done').length;
    if(w.t==='duesoon')  return mySoon(me).length;
    if(w.t==='dueteam')  return openTasks().filter(t=>{const n=days(t.due); return n!==null && n<=7;}).length;
    if(w.t==='countdown')return cdAll().filter(d=>d.pin && cdIn(d)).length;
    if(w.t==='team')     return S.people.length;
    if(w.t==='links')    return myLinks(w).length;
    if(w.t==='calendar')  return null;
  if(w.t==='sponsors'){ const b2=leadBuckets(); return b2.fresh.length + b2.quiet.length; }
    if(w.t==='taskcal'){ const m=w.m?new Date(w.m):today();
      return doingTasks(me).concat(S.tasks.filter(x=>x.o===me && !isDoing(x,me)))
        .filter(x=>{ const d=parseD(x.due); return d && d.getMonth()===m.getMonth() && d.getFullYear()===m.getFullYear(); }).length; }
    if(w.t==='freebusy') return S.people.length;
    if(w.t==='newcerts') return newCerts(certWin(w)).length;
    if(w.t==='planday')  return null;
    if(w.t==='numbers')  return (w.k || []).map(figure).filter(Boolean).length;
    if(w.t==='notes')    return S.notes.length;
    if(w.t==='overlap')  return overlaps().length;
    if(w.t==='person' && w.k) return person(w.k)? doingTasks(w.k).filter(t=>t.s!=='Done').length : null;
    if(w.t==='rock' && w.k)   return rock(w.k)? S.tasks.filter(t=>t.r===w.k && t.s!=='Done').length : null;
    if(w.t==='plan' && w.k){ const p=planOf(w.k); return p? planItems(p.id).filter(i=>itemCounts(i)&&!itemDone(i)).length : null; }
  }catch(e){}
  return null;
}
/* What a bold panel says about its contents without being opened: how far
   along it is, and a line of plain English. Returns null when a panel has no
   honest sense of done-ness. */
function widgetMeter(w){
  const me=S.me;
  const over = list => {
    const total=list.length;
    if(!total) return {pct:null, label:'Nothing here'};
    const done=list.filter(t=>t.s==='Done').length;
    const late=list.filter(t=>{const n=days(t.due); return t.s!=='Done' && n!==null && n<0;}).length;
    return {pct: Math.round(done/total*100), done:done, total:total,
      label: done+' of '+total+' done' + (late? ' \u00b7 '+late+' past due':'')};
  };
  try{
    if(w.t==='mytasks')  return over(doingTasks(me).filter(t=>!t.rail));
    if(w.t==='myrails')  return over(doingTasks(me).filter(t=>t.rail));
    if(w.t==='watching') return over(watchingTasks(me));
    if(w.t==='person' && w.k) return over(doingTasks(w.k));
    if(w.t==='rock' && w.k)   return over(S.tasks.filter(t=>t.r===w.k));
    if(w.t==='plan' && w.k){ const p=planOf(w.k); if(!p) return null; const st=planStats(p);
      return {pct:st.pct, label: st.done+' of '+st.total+' done'+(st.behind? ' \u00b7 '+st.behind+' behind' : '')+' \u00b7 '+planDayLabel(p)}; }
    if(w.t==='duesoon'){
      return over(S.tasks.filter(t=>{const n=days(t.due);
        return n!==null && n<=7 && n>=-30 && (t.o===me || isDoing(t,me));}));
    }
    if(w.t==='dueteam'){
      return over(S.tasks.filter(t=>{const n=days(t.due); return n!==null && n<=7 && n>=-30;}));
    }
    if(w.t==='numbers'){
      const ids=(w.k && w.k.length)? w.k : [];
      const list=ids.map(figure).filter(Boolean);
      if(!list.length) return {pct:null, label:'No numbers picked yet'};
      /* one figure: show the figure, not a tally of one */
      if(list.length===1){
        const f=list[0];
        if(hasSeries(f)){
          const sel=(w.sel && w.sel[f.id]) || figDefaultSel(f);
          return {pct:null, label: fmtNum(f, figSum(f, sel))+' \u00b7 '+periodLabel(sel)};
        }
        const v=String(f.v||'').trim();
        return {pct:null, label: v ? figFmt(f)+' \u00b7 '+figAge(f) : 'Not filled in yet'};
      }
      const filled=list.filter(f=> hasSeries(f) || String(f.v||'').trim()).length;
      return {pct: Math.round(filled/list.length*100), label: filled+' of '+list.length+' filled in'};
    }
    if(w.t==='countdown'){
      const all=cdAll().filter(d=>d.pin);
      if(!all.length) return {pct:null, label:'Nothing pinned'};
      const inW=all.filter(d=>cdIn(d));
      if(!inW.length) return {pct:null, label:'None in '+cdWinName()+' \u00b7 '+all.length+' further out'};
      const n=days(dOf(inW[0]));
      return {pct:null, label: inW.length+' in '+cdWinName()+' \u00b7 next '+(n<=0?'today':'in '+n+(n===1?' day':' days'))};
    }
    if(w.t==='overlap'){ const n=overlaps().length;
      return {pct:null, label: n? n+(n===1?' part two people are both in':' parts two people are both in') : 'No overlaps'}; }
    if(w.t==='notes'){ const n=S.notes.length;
      return {pct:null, label: n? 'There '+(n===1?'is 1 note':'are '+n+' notes')+' on the wall to be looked at'
        : 'Nothing on the wall'}; }
    if(w.t==='team'){
      const t3=today();
      if(offDay(t3)){ const h=holidayOn(t3);
        return {pct:null, label: (h ? h.t : 'The weekend')+' \u2014 the team is off'}; }
      const away=S.people.filter(p=>{ const e=effStatus(p); return e && (e.k==='travel'||e.k==='out'); }).length;
      return {pct:null, label: away? away+' of '+S.people.length+' away right now' : 'Everyone is around'}; }
    if(w.t==='links'){ const n=myLinks(w).length; return {pct:null, label: n+(n===1?' system':' systems')}; }
    if(w.t==='planday'){
      if(!w.plan || !w.plan.at) return {pct:null, label:'No plan yet today'};
      const same = new Date(w.plan.at).toDateString() === new Date().toDateString();
      return {pct:null, label: same ? 'Planned '+relWhen(w.plan.at) : 'Last planned '+relWhen(w.plan.at)+' \u2014 worth redoing'};
    }
    if(w.t==='newcerts'){
      const f=figure('fig-cms-new');
      const n=newCerts(certWin(w)).length;
      if(!f) return {pct:null, label:'Nothing read in from the Certification System yet'};
      const fyN = figSum(f, 'f:'+fyOf(isoOf(today()).slice(0,7)));
      const wl = certWindow(certWin(w)).label;
      return {pct:null, label: (n? n+(n===1?' new certification ':' new certifications ') : 'None ')+wl+
        ' \u00b7 '+(fyN==null?0:fyN)+' this fiscal year'};
    }
    if(w.t==='freebusy'){
      const t2=today();
      if(offDay(t2)){ const h=holidayOn(t2);
        return {pct:null, label: (h ? h.t : 'The weekend')+' \u2014 nobody is working today'}; }
      let free=0;
      S.people.forEach(p=>{ if(!awayOn(p.id,t2)) free++; });
      return {pct:null, label: free+' of '+S.people.length+' free today'}; }
    if(w.t==='asks'){ const n=asksForMe(me).length;
      return {pct:null, label: n? n+(n===1?' waiting on an answer':' waiting on an answer') : 'Nothing outstanding'}; }
    if(w.t==='sponsors'){ const b2=leadBuckets();
      if(!b2.all.length) return {pct:null, label:'Not refreshed yet'};
      return {pct:null, label: b2.live.length+' open \u00b7 '+b2.fresh.length+' never approached \u00b7 '+b2.quiet.length+' quiet'}; }
    if(w.t==='taskcal'){ const m=w.m?new Date(w.m):today();
      const all=doingTasks(me).concat(S.tasks.filter(x=>x.o===me && !isDoing(x,me)));
      const inM=all.filter(x=>{ const d=parseD(x.due); return d && d.getMonth()===m.getMonth() && d.getFullYear()===m.getFullYear(); });
      const none=all.filter(x=>!x.due && x.s!=='Done').length;
      return {pct:null, label: inM.length+' in '+MONTHS[m.getMonth()]+(none? ' \u00b7 '+none+' with no date' : '')};
    }
    if(w.t==='calendar'){ const n=datesOn(today()).length;
      return {pct:null, label: n? n+(n===1?' thing on today':' things on today') : 'Nothing on today'}; }
  }catch(e){}
  return null;
}

function buildWidget(w, b){
  const me=S.me;
  /* an empty panel should say what would fill it, not just that it is empty */
  const EMPTY = {
    mytasks:  ['Nothing on your plate.','Click Jot It Down or Add a Task to put something here.'],
    myrails:  ['No running rails.','A task marked as a running rail \u2014 an ongoing responsibility rather than a one-off \u2014 lands here.'],
    watching: ['Nothing to watch.','A task shows up here when you are accountable for it but somebody else is doing it.'],
    duesoon:  ['Nothing due this week.','Anything of yours landing in the next seven days appears here.'],
    dueteam:  ['Nothing due across the team this week.','Everyone\u2019s work landing in the next seven days appears here.']
  };
  const rows = list => {
    if(!list.length){ const e=EMPTY[w.t]||['Nothing here.','']; b.appendChild(emptyBox(e[0], e[1])); return; }
    b.appendChild(taskHolder(list));
  };
  if(w.t==='watching'){
    /* This one fills itself: a task lands here when you are the accountable
       person and somebody else is checked as hands-on. So the way to add to it
       is to hand one of yours over, not to type a new one. */
    const list = watchingTasks(me).filter(t=>t.s!=='Done');
    if(!list.length){
      b.appendChild(emptyBox('Nothing to watch.',
        'A task shows up here when you are accountable for it but somebody else is doing it. Hand one of yours over and it moves here on its own.'));
    } else {
      b.appendChild(taskHolder(list));
    }
    const ho=el('button','btn'+(list.length?' ghost sm':' sm'),'Hand Something Over'); ho.type='button';
    ho.style.alignSelf='flex-start';
    ho.addEventListener('click', ()=> handOver(me));
    return b.appendChild(ho);
  }
  if(w.t==='mytasks') return rows(doingTasks(me).filter(t=>t.s!=='Done' && !t.rail)
    .sort((a,b2)=>{const x=days(a.due),y=days(b2.due); if(x===null&&y===null)return 0; if(x===null)return 1; if(y===null)return -1; return x-y;}));
  if(w.t==='myrails') return rows(doingTasks(me).filter(t=>t.s!=='Done' && t.rail));
  if(w.t==='duesoon') return rows(mySoon(me));
  if(w.t==='dueteam') return rows(openTasks().filter(t=>{const n=days(t.due); return n!==null && n<=7;})
    .sort((a,b2)=>days(a.due)-days(b2.due)));
  if(w.t==='countdown'){
    const ds=cdAll().filter(d=>d.pin);
    if(!ds.length) return b.appendChild(emptyBox('No pinned dates.','Pin one in Key Dates.'));
    return b.appendChild(cdBlock('', ds, ()=> renderAll()));
  }
  if(w.t==='team'){ const s=el('div','strip'); S.people.forEach(p=>s.appendChild(personCard(p))); return b.appendChild(s); }
  if(w.t==='numbers'){
    const pick=()=>{ const L=layout(); const me=L.find(x=>x===w)||w; pickFigures(L, me); };
    const list = (w.k || []).map(figure).filter(Boolean);
    if(!list.length){
      b.appendChild(emptyBox('No numbers picked yet.','Choose which ones you want on your board.'));
      const e0=el('button','btn sm','Choose Which Numbers'); e0.type='button';
      e0.style.alignSelf='flex-start'; e0.addEventListener('click', pick);
      return b.appendChild(e0);
    }
    w.sel = w.sel || {};
    const g=el('div','figgrid');
    list.forEach(f=>{
      const box=el('div','fig'+(figStale(f)&&!hasSeries(f)?' stale':''));
      if(hasSeries(f)){
        let cur = w.sel[f.id] || figDefaultSel(f);
        if(!figPeriods(f, cur.split(':')[0]).some(p=>p.v===cur)) cur = figDefaultSel(f);

        const head=el('button','figv'); head.type='button';
        head.title='Open this number';
        const big=el('b',null, fmtNum(f, figSum(f, cur)));
        const cap=el('small',null, f.src + ' \u00b7 ' + periodLabel(cur));
        head.appendChild(big);
        head.appendChild(el('span',null, f.n));
        head.appendChild(cap);
        head.addEventListener('click', ()=> editFigure(f.id));
        box.appendChild(head);

        const row=el('div','figsel');
        const drop=el('select');
        const fill=()=>{
          drop.textContent='';
          figPeriods(f, cur.split(':')[0]).forEach(p=>{
            const o=el('option',null,p.n); o.value=p.v;
            if(p.v===cur) o.selected=true; drop.appendChild(o);
          });
        };
        const paint=()=>{
          big.textContent = fmtNum(f, figSum(f, cur));

function newPanel(p, L){
  const B=bset();
  if(B.autocol && !p.col) p.col = nextColor(L);
  if(!p.st && B.style==='bold') p.st='bold';
  return p;
}
function addWidget(L){
  sheet(box=>{
    box.appendChild(el('h2',null,'Your Panels'));
    box.appendChild(el('p',null,'Switch a panel on or off, and say whether it should start open or collapsed. Drag a panel by its header to move it around.'));
    const g=el('div','wlist');

      const redraw = ()=>{ closeSheet(); vMine($('#app-mine')); };
    const allOf = k => { const out=[]; eachPanel(L,(w)=>{ if(w.t===k) out.push(w); }); return out; };
    const rowFor = (k, t)=>{
      const on = allOf(k);
      const r=el('div','prow'+(on.length?' is-on':''));
      const txt=el('div','wrt');
      txt.appendChild(el('b',null,t.n));
      txt.appendChild(el('small',null,t.d));
      r.appendChild(txt);
      const acts=el('div','wra');

      if(on.length && !t.multi){
        /* already on the board — choose how it starts */
        const w0 = on[0];
        acts.appendChild(btnRow([{v:'0',n:'Open'},{v:'1',n:'Collapsed'}], String(w0.c?1:0), 'tiny', v=>{
          on.forEach(w=>{ w.c = v==='1'?1:0; }); saveMine(); vMine($('#app-mine'));
        }));
        const off=el('button','btn ghost sm','Take It Off'); off.type='button';
        off.addEventListener('click', ()=>{
          for(let ri=L.length-1; ri>=0; ri--){
            for(let ci=L[ri].r.length-1; ci>=0; ci--) if(L[ri].r[ci].t===k) L[ri].r.splice(ci,1);
            if(!L[ri].r.length) L.splice(ri,1);
          }
          saveMine(); redraw();
        });
        acts.appendChild(off);
      } else {
        const add=el('button','btn sm','Add It'); add.type='button';
        add.addEventListener('click', ()=> pickExtra(k, t, L));
        acts.appendChild(add);
      }
      r.appendChild(acts);
      return r;
    };

    const onBoard = [];
    eachPanel(L,(w)=>{ if(WTYPES[w.t] && onBoard.indexOf(w.t)<0) onBoard.push(w.t); });
    const rest = Object.keys(WTYPES).filter(k=> onBoard.indexOf(k)<0);
    onBoard.concat(rest).forEach(k=>{
      const t=WTYPES[k];
      /* these can sit on the board more than once, so they always offer Add It */
      if(k==='rock' || k==='person' || k==='plan'){
        const mine = allOf(k);
        const r=el('div','prow'+(mine.length?' is-on':''));
        const txt=el('div','wrt');
        txt.appendChild(el('b',null,t.n));
        txt.appendChild(el('small',null, mine.length? (mine.length+' on your board · '+t.d) : t.d));
        r.appendChild(txt);
        const acts=el('div','wra');
        const add=el('button','btn sm','Add It'); add.type='button';
        add.addEventListener('click', ()=> pickExtra(k, t, L));
        acts.appendChild(add);
        r.appendChild(acts); g.appendChild(r); return;
      }
      g.appendChild(rowFor(k, t));
    });
    box.appendChild(g);

    /* the gap in the list is the moment to ask for what is missing */
    const miss=el('div','prow askrow');
    const mtx=el('div','wrt');
    mtx.appendChild(el('b',null,'Not Here?'));
    mtx.appendChild(el('small',null,'Ask for a panel or a number that does not exist yet. It goes to '
      +(person(ASK_OWNER)? person(ASK_OWNER).name.split(' ')[0] : 'whoever looks after Team HQ')+'.'));
    miss.appendChild(mtx);
    const ma=el('div','wra');
    const mb=el('button','btn sm','Ask for It'); mb.type='button';
    mb.addEventListener('click', ()=>{ closeSheet(); askSheet({kind:'panel', t:'', why:''}); });
    ma.appendChild(mb); miss.appendChild(ma);
    box.appendChild(miss);

    const acts=el('div','modal-acts');
    const reset=el('button','btn ghost','Reset to the Default Board'); reset.type='button';
    reset.addEventListener('click', ()=>{ S.layout=null; saveMine(); closeSheet(); vMine($('#app-mine')); toast('Board reset.'); });
    const cl=el('button','btn','Done'); cl.type='button'; cl.addEventListener('click',closeSheet);
    acts.appendChild(reset); acts.appendChild(cl); box.appendChild(acts);
  });
}

/* a few panels need you to say which one before they go on */
function pickExtra(k, t, L){
  const done = ()=>{ saveMine(); closeSheet(); vMine($('#app-mine')); };
  if(k==='rock' || k==='person'){
    sheet(box=>{
      box.appendChild(el('h2',null, k==='rock'?'Which Team Project?':'Whose Board?'));
      const g2=el('div','linkcards');
      (k==='rock'? S.rocks : S.people).forEach(x=>{
        const bb=el('button','lcard'); bb.type='button';
        if(k==='person') bb.appendChild(avatar(x.id,'sm'));
        const sp=el('span'); sp.appendChild(document.createTextNode(x.name));
        sp.appendChild(el('small',null, k==='rock'? (x.status+' · '+((x.ws||[]).length===1?'1 part':(x.ws||[]).length+' parts')) : x.role));
        bb.addEventListener('click', ()=>{ L.push({r:[newPanel({t:k, k:x.id}, L)]}); done(); });
        bb.appendChild(sp); g2.appendChild(bb);
      });
      box.appendChild(g2);
      const a=el('div','modal-acts'); const b=el('button','btn ghost','Back'); b.type='button';
      b.addEventListener('click', ()=> addWidget(L)); a.appendChild(b); box.appendChild(a);
    });
    return;
  }
  if(k==='plan'){
    sheet(box=>{
      box.appendChild(el('h2',null,'Which Plan?'));
      const g2=el('div','linkcards');
      (S.plans||[]).forEach(x=>{
        const bb=el('button','lcard'); bb.type='button';
        if(x.who) bb.appendChild(avatar(x.who,'sm'));
        const sp=el('span'); sp.appendChild(document.createTextNode(x.title));
        const st=planStats(x); sp.appendChild(el('small',null,(x.status||'Active')+' \u00b7 '+st.done+' of '+st.total+' done'));
        bb.appendChild(sp);

/* which of the MISMO systems show on this board. Everyone can reach all of
   them; which ones sit on your own board is yours. No choice saved means all
   of them, so an existing board does not suddenly empty. */
/* `w.k` is a list and its order is the order they appear in — dragging one
   rewrites that list. A name that is no longer a real system is dropped. */
function myLinks(w){
  if(!w || !w.k) return SEED_LINKS.slice();
  const byName={}; SEED_LINKS.forEach(l=> byName[l.n]=l);
  const out=[], seen={};
  (w.k||[]).forEach(n=>{ if(byName[n] && !seen[n]){ out.push(byName[n]); seen[n]=1; } });
  return out;
}
function pickLinks(L, existing){
  const chosen = new Set(existing && existing.k ? existing.k : SEED_LINKS.map(l=>l.n));
  sheet(box=>{
    box.appendChild(el('h2',null,'Which Systems?'));
    box.appendChild(el('p',null,'Tick the ones you want inside the My Systems panel. Everybody can still reach all of them \u2014 this only changes which ones show on your own board.'));
    const g=el('div','wlist');
    const draw = ()=>{
      g.textContent='';
      SEED_LINKS.forEach(l=>{
        const on = chosen.has(l.n);
        const r=el('div','prow'+(on?' is-on':''));
        const txt=el('div','wrt');
        const bb=el('b',null,l.n);
        if(l.tmp) bb.appendChild(el('span','lflag','On Claude for Now'));
        if(l.doc) bb.appendChild(el('span','lflag doc','Document'));
        txt.appendChild(bb);
        txt.appendChild(el('small',null,l.d));
        r.appendChild(txt);
        const acts=el('div','wra');
        const b2=el('button','btn sm'+(on?' ghost':''), on?'Remove':'Add It'); b2.type='button';
        b2.addEventListener('click', ()=>{ if(on) chosen.delete(l.n); else chosen.add(l.n); draw(); });
        acts.appendChild(b2); r.appendChild(acts); g.appendChild(r);
      });
    };
    draw();
    box.appendChild(g);
    const acts=el('div','modal-acts');
    /* These tick boxes decide what is IN the panel, not whether the panel is on
       the board — so the buttons say that. "Put It on My Board" only makes
       sense the first time, when the panel does not exist yet. */
    const all=el('button','btn ghost','Tick Every One'); all.type='button';
    all.addEventListener('click', ()=>{ SEED_LINKS.forEach(l=>chosen.add(l.n)); draw(); });
    const none=el('button','btn ghost','Untick Them All'); none.type='button';
    none.addEventListener('click', ()=>{ chosen.clear(); draw(); });
    const ok=el('button','btn', existing? 'Save' : 'Put It on My Board'); ok.type='button';
    ok.addEventListener('click', ()=>{
      /* keep the order they already dragged these into; anything newly ticked on
         goes on the end rather than jumping back into the middle */
      const had = (existing && existing.k) ? existing.k.slice() : [];
      const ids = had.filter(n=>chosen.has(n))
        .concat(SEED_LINKS.filter(l=>chosen.has(l.n) && had.indexOf(l.n)<0).map(l=>l.n));
      if(existing) existing.k = ids;
      else L.push({r:[newPanel({t:'links', k:ids}, L)]});
      saveMine(); closeSheet(); vMine($('#app-mine'));
    });
    acts.appendChild(all); acts.appendChild(none); acts.appendChild(ok); box.appendChild(acts);
  });
}

/* ============ EXPENSES ============ */
const DB_CATS = ['Airfare','Baggage Fees','Gasoline','Hotel/Lodging','Meal Trvl - Breakfast',
  'Meal Trvl - Snack','Meal Trvl - Lunch','Meal Trvl - Dinner','Membership Dues','Metro / Bus',
  'Mileage','Parking','Taxi/Uber/Lyft','Tolls','Train'];
const MEAL_CAP = {'Meal Trvl - Breakfast':20,'Meal Trvl - Lunch':35,'Meal Trvl - Dinner':50,'Meal Trvl - Snack':10};
const DAILY_MEAL_CAP = 115;
const RECEIPT_OVER = 25;      /* original paid receipts required over $25 */
const MEAL_RECEIPT_OVER = 15; /* meals need a receipt over $15; without one they cap at $15 */

function money(n){ const v=Number(n)||0;
  return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function isMeal(c){ return String(c||'').indexOf('Meal Trvl') === 0; }
function expOf(id){ return S.expenses.find(x=>x.id===id) || null; }
function myExpenses(id){ return S.expenses.filter(x=>x.who===id); }
function canProcess(){ const p=person(S.me); return !!p && (p.id==='vanessa' || p.id==='jonna' || p.mgr); }

/* every policy check on one expense, from the MBA travel and expense policy */
function checkExp(e){
  const out=[]; const amt=Number(e.amt)||0;
  if(isMeal(e.cat)){
    const cap=MEAL_CAP[e.cat];
    if(cap && amt>cap) out.push({lvl:'warn', m:'Over the '+e.cat.replace('Meal Trvl - ','').toLowerCase()+' guideline of '+money(cap)+'. Put the business reason in the notes or reimbursement may be delayed.'});
    if(amt>MEAL_RECEIPT_OVER && !e.receipt) out.push({lvl:'bad', m:'Meals over '+money(MEAL_RECEIPT_OVER)+' need a receipt. Without one this caps at '+money(15)+'.'});
    /* the one being entered is not in S.expenses yet, and an edit still holds the
       old amount there — so swap it in rather than counting the stale copy */
    const sameDay = S.expenses.filter(x=> x.id!==e.id && x.who===e.who && x.date===e.date && isMeal(x.cat)).concat([e]);
    const tot = sameDay.reduce((a,x)=>a+(Number(x.amt)||0),0);
    if(tot>DAILY_MEAL_CAP) out.push({lvl:'warn', m:'Meals for this day total '+money(tot)+', over the '+money(DAILY_MEAL_CAP)+' per-person daily cap.'});
  } else if(amt>RECEIPT_OVER && !e.receipt){
    out.push({lvl:'bad', m:'Charges over '+money(RECEIPT_OVER)+' need an original paid receipt.'});
  }
  if(e.receipt && e.rcptAmt && Math.abs(Number(e.rcptAmt)-amt) > 0.009)
    out.push({lvl:'warn', m:'The receipt says '+money(e.rcptAmt)+' but the expense is '+money(amt)+'.'});
  if(!e.trip) out.push({lvl:'warn', m:'No trip name yet — these are grouped by trip when they are entered.'});
  return out;
}
function worst(e){ const c=checkExp(e); return c.some(x=>x.lvl==='bad')?'bad' : c.length?'warn' : 'ok'; }

  if(assetsTried) return assetsCap;

  try{ assetsCap = await claude.use('assets'); }catch(e){ assetsCap=null; }
  return assetsCap;
}

function vExpenses(root){
  root.textContent='';
  const me=person(S.me);
  const right=el('div','rowflex');
  const nb=el('button','btn'); nb.type='button';
  nb.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  nb.appendChild(el('span',null,'Add an Expense'));
  nb.addEventListener('click', ()=> editExp(null));
  right.appendChild(nb);
  vhead(root,'Expenses','Snap the receipt, pick the type, done. They are picked up here and entered in DataBasics.', right);

  if(!me){
    const bx=el('div','box'); bx.style.textAlign='center'; bx.style.padding='40px 20px';
    bx.appendChild(emptyBox('Team HQ does not know who you are yet.','Pick your name in the top right corner and your expenses show up here.'));
    root.appendChild(bx); return;
  }

  if(!S.expScope) S.expScope = 'mine';
  const canP = canProcess();
  if(canP){
    const bar=el('div','filterbar');
    [['mine','Mine'],['all','Everyone'],['todo','To Process']].forEach(([v,n])=>{
      const b=el('button','pill'); b.type='button';
      b.setAttribute('aria-pressed', S.expScope===v?'true':'false');
      b.textContent=n;
      const c = v==='mine'? myExpenses(me.id).length
              : v==='all'? S.expenses.length
              : S.expenses.filter(x=>!x.submitted).length;
      b.appendChild(el('b',null,String(c)));
      b.addEventListener('click',()=>{ S.expScope=v; vExpenses(root); });
      bar.appendChild(b);
    });
    const ex=el('button','btn ghost sm','Export for DataBasics'); ex.type='button'; ex.style.marginLeft='auto';
    ex.addEventListener('click', exportExpenses);
    bar.appendChild(ex);
    root.appendChild(bar);
  }

  const list = S.expScope==='mine' ? myExpenses(me.id)
             : S.expScope==='todo' ? S.expenses.filter(x=>!x.submitted)
             : S.expenses.slice();

  /* numbers across the top */
  const tot = list.reduce((a,x)=>a+(Number(x.amt)||0),0);
  const noR = list.filter(x=>!x.receipt && (Number(x.amt)||0)>RECEIPT_OVER).length;
  const flags = list.filter(x=>worst(x)!=='ok').length;
  const pend = list.filter(x=>!x.submitted).length;
  const g=el('div','exphead');
  const tile=(n,l,c)=>{ const t=el('div','exptile'+(c?' '+c:'')); const b=el('b',null,n); b.className='money'; t.appendChild(b); t.appendChild(el('span',null,l)); return t; };
  g.appendChild(tile(money(tot),'Total'));
  g.appendChild(tile(String(pend),'Not Yet Submitted', pend?'warn':'good'));
  g.appendChild(tile(String(noR),'Missing a Receipt', noR?'bad':'good'));
  g.appendChild(tile(String(flags),'Outside Policy', flags?'warn':'good'));
  root.appendChild(g);

  if(!list.length){
    const bx=el('div','box');
    bx.appendChild(emptyBox('Nothing here yet.','Click Add an Expense, snap the receipt and it is done.'));
    root.appendChild(bx); return;
  }

  /* grouped by trip, newest first */
  const trips={};
  list.forEach(x=>{ const k=x.trip||'No Trip Name Yet'; (trips[k]=trips[k]||[]).push(x); });
  /* newest trip first. Math.max over ISO strings gives NaN, so take the latest
     date by string comparison instead. */
  const latest = k => trips[k].reduce((m,x)=>{ const d=String(x.date||''); return d>m?d:m; }, '');
  const names=Object.keys(trips).sort((a,b)=> latest(b).localeCompare(latest(a)));
  if(!S.openTrips) S.openTrips={};
  names.forEach(n=>{
    const rows=trips[n].slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const sum=rows.reduce((a,x)=>a+(Number(x.amt)||0),0);
    const open = S.openTrips[n]!==false;
    const box=el('div','trip');
    const h=el('button','triph'); h.type='button';
    const tn=el('span','tn'); tn.appendChild(document.createTextNode(n));
    const who=Array.from(new Set(rows.map(x=>x.who))).map(pname).join(', ');
    tn.appendChild(el('small',null, rows.length+(rows.length===1?' expense':' expenses')+' · '+who));
    h.appendChild(tn);
    const nsub=rows.filter(x=>!x.submitted).length;
    if(nsub) h.appendChild(el('span','chip ch-soon', nsub+' to submit'));
    else h.appendChild(el('span','chip ch-dn','All Submitted'));
    const am=el('span','amt money', money(sum)); h.appendChild(am);
    h.addEventListener('click', ()=>{ S.openTrips[n] = !open; vExpenses(root); });
    box.appendChild(h);
    if(open) rows.forEach(x=> box.appendChild(expRow(x)));
    root.appendChild(box);
  });

  const c=el('div','callout');
  c.innerHTML='<b>The rules built in here</b> come from MBA’s January 2019 travel and expense policy: receipts over '+money(RECEIPT_OVER)+' (meals over '+money(MEAL_RECEIPT_OVER)+'), meal guidelines of '+money(20)+' breakfast, '+money(35)+' lunch, '+money(50)+' dinner, '+money(10)+' snacks, and '+money(DAILY_MEAL_CAP)+' per person per day.';
  root.appendChild(c);
}

function csvCell(v){ const s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
async function exportExpenses(){

    .sort((a,b)=> String(a.trip||'').localeCompare(String(b.trip||'')) || String(a.date||'').localeCompare(String(b.date||'')));

/* ============ "Already Claimed" ============
   Team HQ is not the only way an expense gets filed — most of them go straight
   into DataBasics. Without this, a trip claimed that way would keep raising its
   reminder until it aged out, and people learn to ignore reminders that lie. */
async function clearExpGap(id, g){
  const p = person(id); if(!p) return;
  const prev = expCleared(p).slice();
  const list = prev.slice();
  if(list.indexOf(g.key) < 0) list.push(g.key);
  /* The list cannot grow forever: a closed fiscal year is never chased anyway,
     so its keys are dead weight and get dropped here. */
  const keep = list.filter(k=>{ const dt = parseD(String(k).split('|')[1]);
    return !dt || dt >= fyStart(); });
  const d = Object.assign({}, p, {expClear: keep});
  await put('people', d);
  undoToast('Cleared. "'+g.t+'" will not be chased again.', async ()=>{
    const q = Object.assign({}, person(id), {expClear: prev});
    await put('people', q);
  });
}
/* ============ TEAM MEETING ============
   Every two weeks on a Thursday, 10-11am Eastern. Anyone can put something on
   the agenda between meetings; on the day you work down the list and what does
   not get covered carries itself to the next one. Items are held against the
   meeting date they belong to, so the record of what was discussed stays put. */
const MTG = {
  anchor: '2026-10-15',          /* a real meeting; every other Thursday from here */
  everyWeeks: 2,
  time: '10:00 – 11:00 AM Eastern',
  mins: 60
};
/* the meeting on or after a given day */
function mtgOnOrAfter(d){
  const a=parseD(MTG.anchor); if(!a) return '';
  const step=MTG.everyWeeks*7;
  let x=new Date(a);
  if(x<d){ const gap=Math.ceil((d-x)/86400000/step); x.setDate(x.getDate()+gap*step); }
  while(x<d) x.setDate(x.getDate()+step);
  return isoOf(x);
}
function nextMtg(){ return mtgOnOrAfter(today()); }
function prevMtg(iso){ const d=parseD(iso); d.setDate(d.getDate()-MTG.everyWeeks*7); return isoOf(d); }
function afterMtg(iso){ const d=parseD(iso); d.setDate(d.getDate()+MTG.everyWeeks*7); return isoOf(d); }
/* the next few, so the picker is not open-ended */
function mtgSeries(n){ const out=[]; let x=nextMtg();
  for(let i=0;i<(n||6);i++){ out.push(x); x=afterMtg(x); } return out; }
/* a meeting that lands on a holiday needs a decision, not a surprise */
function mtgClash(iso){
  const d=parseD(iso); if(!d) return null;
  const h=holidayOn(d); if(h) return {kind:'holiday', t:h.t};
  const away=S.people.filter(p=>awayOn(p.id,d));
  if(away.length>=3) return {kind:'away', t:away.length+' people are away'};
  return null;
}
function agendaFor(iso){ return (S.agenda||[]).filter(x=>x.mtg===iso); }
const AG_KINDS = ['Discuss','Decide','Heads Up','Round the Table'];

/* ---- the view ---- */

  vhead(root,'Team Meeting', 'Every other Thursday, '+MTG.time+'. Add what you want raised and it waits here until the meeting.', right);

  const past=[prevMtg(prevMtg(nextMtg())), prevMtg(nextMtg())].filter(i=> i>=MTG.anchor);
  past.concat(mtgSeries(3)).forEach(iso=>{
    const b=el('button','pill'); b.type='button';
    b.textContent = iso===nextMtg()? 'Next · '+fmtD(iso) : fmtD(iso);

  /* the headline band */
  const items=agendaFor(sel);

  const hl=el('div','headline');

  const say=el('div','hl-say');
