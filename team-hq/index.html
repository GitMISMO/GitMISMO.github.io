/* ---- dragging ----
   The browser's own drag-and-drop does not fire reliably here, so this does it
   with pointer events instead: works with a mouse, a trackpad and a finger. */
function dragHandle(handle, opts){
  handle.style.touchAction = 'none';
  handle.style.userSelect = 'none';
  handle.style.webkitUserSelect = 'none';
  handle.setAttribute('draggable','false');
  handle.addEventListener('dragstart', e=>e.preventDefault());

  handle.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    /* controls inside the handle stay clickable; everything else can start a drag */
    if(opts.ignore && e.target.closest && e.target.closest(opts.ignore)) return;
    /* A handle that sits INSIDE a link or a button — a grip on a card that is
       itself a link — would be stopped by the guard below, so it says so. */
    if(!opts.ignore && !opts.insideLink && e.target.closest && e.target.closest('button,a,input,select,textarea')
       && e.target.closest('button')!==handle) return;

    /* No preventDefault and no pointer capture YET. Both of those change how the
       browser dispatches the click that follows, and a plain click on this
       header has to go on folding the panel. Capture is taken on the first real
       move instead, once we know this is a drag and not a click. */
    let captured=false;

    const sx=e.clientX, sy=e.clientY;
    let dragging=false, ghost=null, mark=null, drop=null, scroller=null, scrollBy=0;
    let lx=sx, ly=sy;
    const touchy = e.pointerType !== 'mouse';
    let armed = !touchy;
    /* On a finger there is a short hold before a drag starts. Without a sign
       that the hold has registered, people let go too early and nothing moves —
       so the handle lights up the instant it is ready, and buzzes if it can. */
    const armTimer = touchy ? setTimeout(()=>{ armed=true;
      handle.classList.add('armed');
      if(opts.onArm) opts.onArm();
      try{ if(navigator.vibrate) navigator.vibrate(12); }catch(err){}
    }, 200) : null;
    const stopScroll = ()=>{ if(scroller){ clearInterval(scroller); scroller=null; } scrollBy=0; };

    /* where would it land? the panel under the pointer, and which side of it */
    const hover = ()=>{
      let t = null;
      const under = document.elementFromPoint(lx, ly);
      if(under) t = opts.hitTest(under);
      /* a near miss — the gap between panels, the page margin — should still
         land somewhere sensible, so fall back to whichever panel is nearest */
      if(!t && opts.candidates){
        let best=null, bd=Infinity;
        opts.candidates().forEach(c=>{
          const r=c.getBoundingClientRect();
          const dx = lx < r.left ? r.left-lx : lx > r.right ? lx-r.right : 0;
          const dy = ly < r.top  ? r.top-ly  : ly > r.bottom ? ly-r.bottom : 0;
          const d = dx*dx + dy*dy;
          if(d < bd){ bd=d; best=c; }
        });
        t = best;
      }
      if(!t){ drop=null; if(mark) mark.hidden=true; return; }
      const band = opts.bandFor ? opts.bandFor(t, lx, ly) : {mode:'seat', before: lx < t.getBoundingClientRect().left + t.getBoundingClientRect().width/2};
      drop={node:t, band:band};
      place(t, band);
    };
    /* an upright bar means a seat on this row; a flat rule means a new row */
    const place=(t, band)=>{
      if(!mark){ mark=el('div','dropmark'); document.body.appendChild(mark); }
      const r=t.getBoundingClientRect();
      mark.hidden=false;
      if(band.mode==='cell'){
        /* a whole square lights up, rather than a bar between two things */
        mark.className='dropmark cell';
        mark.style.left=r.left+'px'; mark.style.top=r.top+'px';
        mark.style.width=r.width+'px'; mark.style.height=r.height+'px';
      } else if(band.mode==='row'){
        const row = t.closest('.wrow') || t;
        const rr = row.getBoundingClientRect();
        mark.className='dropmark wide';
        mark.style.left = rr.left+'px';
        mark.style.width = rr.width+'px';
        mark.style.height = '4px';
        mark.style.top = ((band.before ? rr.top-8 : rr.bottom+4))+'px';
      } else {
        mark.className='dropmark';
        mark.style.top = r.top+'px';
        mark.style.height = Math.max(r.height,40)+'px';
        mark.style.width = '4px';
        mark.style.left = ((band.before ? r.left-9 : r.right+5))+'px';
      }
    };
    const edgeScroll = y=>{
      const h=window.innerHeight, pad=90;
      scrollBy = y < pad ? -Math.ceil((pad-y)/5) : y > h-pad ? Math.ceil((y-(h-pad))/5) : 0;
      if(scrollBy && !scroller) scroller = setInterval(()=>{ window.scrollBy(0, scrollBy); hover(); }, 16);
      if(!scrollBy) stopScroll();
    };
    const move = ev=>{
      if(!dragging){
        if(!armed) return;
        if(Math.abs(ev.clientX-sx)<5 && Math.abs(ev.clientY-sy)<5) return;
        dragging=true;
        /* now it is unmistakably a drag: take the pointer so every later move
           and the release come back here, whatever they pass over on the way */
        if(!captured){ try{ handle.setPointerCapture(e.pointerId); captured=true; }catch(err){} }
        document.body.classList.add('dragging-now');
        if(opts.ghostNode){
          ghost = opts.ghostNode();
          ghost.className = (ghost.className||'')+' dragghost';
        } else {
          const src = opts.ghostFrom ? opts.ghostFrom() : handle;
          const r = src.getBoundingClientRect();
          ghost = src.cloneNode(true);
          ghost.className = (ghost.className||'')+' dragghost';
          ghost.style.width = Math.min(r.width, 420)+'px';
          ghost.style.height = Math.min(r.height, 220)+'px';
        }
        document.body.appendChild(ghost);
        if(opts.onStart) opts.onStart();
      }
      ev.preventDefault();
      lx=ev.clientX; ly=ev.clientY;
      ghost.style.transform = 'translate('+(lx+12)+'px,'+(ly+10)+'px)';
      edgeScroll(ly);
      hover();
    };
    const up = ()=>{
      if(armTimer) clearTimeout(armTimer);
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      handle.classList.remove('armed');
      if(captured){ try{ handle.releasePointerCapture(e.pointerId); }catch(err){} captured=false; }
      stopScroll();
      document.body.classList.remove('dragging-now');
      if(ghost){ ghost.remove(); ghost=null; }
      if(mark){ mark.remove(); mark=null; }
      if(dragging && drop) opts.onDrop(drop.node, drop.band);
      if(opts.onEnd) opts.onEnd(dragging);
      drop=null; dragging=false;
    };
    /* listen on BOTH: the document hears the moves before capture is taken, the
       handle hears them after. The same function runs either way and it is
       idempotent, so a duplicate is harmless. */
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
}

/* ============ overlap detection ============ */
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
const STOP = new Set(['the','a','an','and','or','for','to','of','in','on','with','at','by','from','up','our','we','is','are','be']);
function words(s){ return norm(s).split(' ').filter(w=>w.length>2 && !STOP.has(w)); }
/* how much of the shorter title is wholly contained in the longer one.
   "MBA Annual" inside "MBA Annual, Tech at Annual and mPower" = 1.0, a real duplicate.
   "Residential Standards..." vs "Commercial Standards..." = 0.8 — different things. */
function contains(a,b){
  const A=new Set(words(a)), B=new Set(words(b));
  if(A.size<2 || B.size<2) return 0;
  const small = A.size<=B.size ? A : B, big = A.size<=B.size ? B : A;
  let hit=0; small.forEach(w=>{ if(big.has(w)) hit++; });
  return hit / small.size;
}
function similar(a,b){
  const A=new Set(words(a)), B=new Set(words(b));
  if(!A.size || !B.size) return 0;
  let hit=0; A.forEach(w=>{ if(B.has(w)) hit++; });
  return hit / Math.min(A.size,B.size);
}
/* An overlap flag is a prompt, not a verdict. Two people in the same part is
   often exactly right — so any flag can be set aside, and it stays set aside
   for the whole team until somebody puts it back. The decision is kept on the
   team project (for a shared part) or on the task (for a look-alike pair), so it
   travels with the thing it is about. */
function ovlKey(o){
  return o.kind==='ws' ? 'ws:'+o.rock+'||'+o.ws
    : 'dup:'+[o.tasks[0].id, o.tasks[1].id].sort().join('|');
}
function ovlAside(o){
  if(o.kind==='ws'){ const r=rock(o.rock); return !!(r && (r.okws||[]).indexOf(o.ws)>=0); }
  const a=o.tasks[0], c=o.tasks[1];
  return (a.okdup||[]).indexOf(c.id)>=0 || (c.okdup||[]).indexOf(a.id)>=0;
}
async function ovlSetAside(o, on){
  if(o.kind==='ws'){
    const r=rock(o.rock); if(!r) return;
    const d=Object.assign({}, r); const set=new Set(d.okws||[]);
    if(on) set.add(o.ws); else set.delete(o.ws);
    d.okws=Array.from(set);
    await put('rocks', d); return;
  }
  const a=S.tasks.find(x=>x.id===o.tasks[0].id), c=S.tasks.find(x=>x.id===o.tasks[1].id);
  if(!a || !c) return;
  const d=Object.assign({}, a); const set=new Set(d.okdup||[]);
  if(on) set.add(c.id); else set.delete(c.id);
  d.okdup=Array.from(set);
  await put('tasks', d);
  /* a flag set aside from the other side too has to be cleared from both */
  if(!on && (c.okdup||[]).indexOf(a.id)>=0){
    const e=Object.assign({}, c); e.okdup=(e.okdup||[]).filter(x=>x!==a.id);
    await put('tasks', e);
  }
}
function overlapsAside(){ return allOverlaps().filter(ovlAside); }
function overlaps(){ return allOverlaps().filter(o=>!ovlAside(o)); }
function allOverlaps(){
  const out=[];
  // 1. same workstream, more than one owner
  const byWs = {};
  openTasks().forEach(t=>{
    if(!t.r || !t.w) return;
    const k = t.r+'||'+t.w;
    (byWs[k] = byWs[k] || {r:t.r, w:t.w, who:new Set(), ts:[]});
    doers(t).forEach(id=> byWs[k].who.add(id));
    byWs[k].ts.push(t);
  });
  Object.values(byWs).forEach(g=>{
    if(g.who.size>1) out.push({kind:'ws', rock:g.r, ws:g.w, who:Array.from(g.who), tasks:g.ts,
      title:(rock(g.r)?rock(g.r).name:'')+' — '+g.w,
      sub: g.who.size+' people have open tasks in this part'});
  });
  // 2. near-duplicate task titles across different owners
  const ts = openTasks();
  for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length;j++){
    if(ts[i].o===ts[j].o) continue;
    if(similar(ts[i].t, ts[j].t) >= 0.72)
      out.push({kind:'dup', who:[ts[i].o, ts[j].o], tasks:[ts[i],ts[j]],
        title:ts[i].t, sub:'Looks a lot like “'+ts[j].t+'”'});
  }
  return out;
}

/* ============ task editor ============ */
function editTask(t, after){
  /* A prefilled task with no id is still a NEW task — that is how the calendar's
     +, a sticky note and a calendar block all hand one over. Without this they
     all opened saying "Edit Task" for something that did not exist yet. */
  const isNew = !t || !t.id;
  const d = t ? JSON.parse(JSON.stringify(t)) : {t:'', o:S.me||'', d:[], r:'', w:'', s:'Not Started', p:'Normal', due:'', notes:'', rail:0, at:Date.now()};
  if(!d.d) d.d=[];
  /* what it looked like when this editor opened, so a save can tell whether
     somebody else got in first */
  const openedAs = snapOf('tasks', d.id);
  panel(isNew?'New Task':'Edit Task', d.t||'', body=>{
    const g=el('div','fields');
    const fT = field(g,'Task', inp('text', d.t, 'What needs doing?'), 'w4');
    const fO = field(g,'Accountable', sel(peopleOpts(), d.o, 'Unassigned'));
    const fS = field(g,'Status', sel(TSTAT, d.s));

/* ============ capture ============ */
let rec=null;
function dictateHint(){
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad|iPod|Android/i.test(ua)) return 'Tap the microphone on your keyboard and start talking — it types straight into the box.';
  if(/Mac OS X|Macintosh/i.test(ua)) return 'Click in the box, then press the microphone key (or Fn twice) to dictate straight into it.';
  if(/Windows/i.test(ua)) return 'Click in the box, then press the Windows key + H to dictate straight into it.';
  return 'Click in the box and use your device’s own dictation to talk into it.';
}
function capture(presetRock){
  sheet(box=>{
    box.appendChild(el('h2','', 'Jot It Down'));
    box.appendChild(el('p',null,'Write it the way you would on a sticky note. Put it straight on a board, or park it on the note wall and deal with it later.'));
    const ta=el('textarea','cap-in'); ta.placeholder='Type it here…'; box.appendChild(ta);

    const mrow=el('div','rowflex'); mrow.style.marginTop='12px';
    const mic=el('button','mic'); mic.type='button'; mic.title='Speak it instead';
    mic.innerHTML='<svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7"/></svg>';
    const mnote=el('span','micnote','Or click the microphone and say it out loud.');
    mrow.appendChild(mic); mrow.appendChild(mnote); box.appendChild(mrow);

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    function fallback(reason){
      mic.classList.remove('rec'); mic.disabled=true; mic.style.opacity='.4';
      mnote.textContent = reason + ' ' + dictateHint();
      ta.focus();
    }
    if(!SR){ mic.disabled=true; mic.style.opacity='.4'; mnote.textContent='This browser cannot listen for speech. '+dictateHint(); }

    mic.addEventListener('click', async ()=>{
      if(!SR) return;
      if(rec){ try{rec.stop();}catch(e){} rec=null; mic.classList.remove('rec'); mnote.textContent='Stopped.'; return; }
      // ask for the microphone first so a blocked mic fails clearly instead of silently
      try{
        if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
          const st = await navigator.mediaDevices.getUserMedia({audio:true});
          st.getTracks().forEach(t=>t.stop());
        }
      }catch(e){
        fallback('This page cannot reach the microphone.'); return;
      }
      let heard=false;
      try{
        rec = new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=true;
        const base = ta.value ? ta.value.replace(/\s+$/,'')+' ' : '';
        rec.onresult = ev=>{ heard=true; let txt='';
          for(let i=0;i<ev.results.length;i++) txt += ev.results[i][0].transcript;
          ta.value = base + txt; };
        rec.onerror = ev=>{
          const c = ev && ev.error;
          rec=null;
          if(c==='not-allowed' || c==='service-not-allowed' || c==='audio-capture')
            fallback('This page cannot reach the microphone.');
          else if(c==='no-speech'){ mic.classList.remove('rec'); mnote.textContent='Did not hear anything — click again and speak up.'; }
          else if(c==='network') fallback('The voice service could not be reached.');
          else { mic.classList.remove('rec'); mnote.textContent='Voice stopped. '+dictateHint(); }
        };
        rec.onend = ()=>{ mic.classList.remove('rec'); rec=null;
          if(!heard && mnote.textContent.indexOf('Listening')===0) mnote.textContent='Nothing came through. '+dictateHint(); };
        rec.start(); mic.classList.add('rec'); mnote.textContent='Listening… click again to stop.';
        setTimeout(()=>{ if(rec && !heard) mnote.textContent='Listening… still waiting to hear you.'; }, 4000);
      }catch(e){ fallback('Voice is not available here.'); }
    });

    const g=el('div','fields'); g.style.marginTop='14px';
    const fO=field(g,'Accountable', sel(peopleOpts(), S.me||'', 'Unassigned'), 'w2');
    const fR=field(g,'Team Project', sel(S.rocks.map(r=>({v:r.id,n:r.name})), presetRock||'', 'Not Linked'), 'w2');
    box.appendChild(g);

    const acts=el('div','modal-acts');
    const cancel=el('button','btn ghost','Cancel'); cancel.type='button'; cancel.addEventListener('click',closeSheet);
    const park=el('button','btn ghost','Park It'); park.type='button';
    park.title='Keeps it as a note on the wall. No owner, no date, no pressure.';
    const mk=el('button','btn','Put It on My Board'); mk.type='button';
    /* say where it is going, so the button is the answer rather than a riddle */
    const mkLabel = ()=>{
      const v=fO.value;
      mk.textContent = !v ? 'Make It a Task'
        : v===S.me ? 'Put It on My Board'
        : 'Put It on '+pname(v).split(' ')[0]+'\u2019s Board';
    };
    fO.addEventListener('change', mkLabel); mkLabel();
    park.addEventListener('click', async ()=>{
      const v=ta.value.trim(); if(!v){ ta.focus(); return; }
      await put('notes', {t:v, by:S.me||'', r:fR.value||'', at:Date.now(), col:['y','b','g','p','o'][Math.floor(Math.random()*5)]});
      closeSheet(); toast('Parked on the note wall.');
    });
    /* One press puts it on the board and nothing else. Filling in a due date or
       a part is a click on the task afterwards, not a form in the way. */
    const save = async (open)=>{
      const v=ta.value.trim(); if(!v){ ta.focus(); return; }
      const t={t:v, o:fO.value, r:fR.value, w:'', s:'Not Started', p:'Normal', due:'', notes:'',
               rail:0, ord:(S.tasks.length+1)*10, at:Date.now(), by:S.me||'', src:'note'};
      closeSheet();
      const id = await put('tasks', t); t.id=id;
      if(open){ editTask(t); return; }
      toast(!fO.value ? 'Added, unassigned.'
        : fO.value===S.me ? 'On your board.'
        : 'On '+pname(fO.value).split(' ')[0]+'\u2019s board.');
    };
    mk.addEventListener('click', ()=> save(false));
    const more=el('button','btn ghost','Add Detail First'); more.type='button';
    more.title='Opens the task so you can set a due date, a part and who else is hands-on';
    more.addEventListener('click', ()=> save(true));
    acts.appendChild(cancel); acts.appendChild(park); acts.appendChild(more); acts.appendChild(mk);
    box.appendChild(acts);
  });
}

/* ============ drag and drop ============ */
/* Cards and sticky notes used to be draggable, and the hand cursor said so —
   but every panel sorts its own list (My Tasks by what is due next, Due This
   Week by date), so a hand-set order was written down and then immediately
   sorted away. The affordance was lying. Clicking a card opens the task;
   panels still move by their headers. */
function wireDrag(node, t, onClick){
  node.addEventListener('click', ()=>{ if(onClick) onClick(); });
}
function wireDragOld(node, t, onClick){
  let moved=false;
  node.addEventListener('click', ()=>{ if(!moved && onClick) onClick(); moved=false; });
  dragHandle(node, {
    ghostFrom: ()=> node,
    hitTest: (under)=>{ const x = under.closest && under.closest('[data-tid]');
      return (x && x!==node) ? x : null; },
    onStart: ()=>{ moved=true; node.classList.add('dragging'); },
    onEnd: (dragged)=>{ node.classList.remove('dragging');
      if(dragged) setTimeout(()=>{ moved=false; }, 60); else moved=false; },
    onDrop: async (target)=>{
      const to = S.tasks.find(x=>x.id===target.dataset.tid);
      if(!to || to.id===t.id) return;
      /* drop onto another task: take its place in the order */
      const list = S.tasks.slice().sort((a,b)=>(a.ord||0)-(b.ord||0));
      const from = list.findIndex(x=>x.id===t.id);
      const at   = list.findIndex(x=>x.id===to.id);
      if(from<0 || at<0) return;
      const it = list.splice(from,1)[0];
      list.splice(at,0,it);
      const changed=[];
      list.forEach((x,i)=>{ const o=i*10; if(x.ord!==o){ x.ord=o; changed.push(x); } });
      sortAll(); renderAll();
      for(const x of changed.slice(0,40)) await put('tasks', x);
      toast('Moved.');
    }
  });
}

  const first = me? me.name.split(' ')[0] : 'Team';
  if(late.length){ say.innerHTML = first+', the team has <em class="hl-late">'+late.length+(late.length===1?' task':' tasks')+' past due</em> and '+week.length+' more landing this week.'; }
  else if(week.length){ say.innerHTML = first+', nothing on the team is late. <em>'+week.length+(week.length===1?' task lands':' tasks land')+'</em> this week.'; }
  else { say.innerHTML = first+', <em>nothing is late and nothing is due this week.</em> Good week to move a team project forward.'; }
  hl.appendChild(say);
  const occ = occBanner(me? me.id : '');
  if(occ) hl.appendChild(occ);
  const tl=el('div','tiles');
  const mk=(n,lab,sub,cls,go)=>{ const t=el('button','tile'+(cls?' '+cls:'')); t.type='button';
    t.appendChild(el('b',null,String(n))); t.appendChild(el('span',null,lab)); if(sub) t.appendChild(el('small',null,sub));
    if(go) t.addEventListener('click',go); return t; };
  /* Every number here is the whole team, not just you. Say so on the tile —
     a bare 124 reads as yours. */
  const nAct = S.rocks.filter(r=>r.status==='Active').length;
  tl.appendChild(mk(openTasks().length,'Open Tasks',
    'everyone\u2019s, across all '+S.rocks.length+' team projects','',()=>show('rocks')));
  tl.appendChild(mk(late.length,'Past Due',
    late.length? 'anyone\u2019s, any project' : 'nobody is late', late.length?'bad':'', ()=>show('rocks')));
  tl.appendChild(mk(ovl.length,'Possible Overlaps', ovl.length?'two people, one part':'nothing doubled up', ovl.length?'warn':'', ()=>show('rocks')));
  tl.appendChild(mk(nAct,'Active Projects', 'of '+S.rocks.length+' team projects', '', ()=>show('rocks')));
  tl.appendChild(mk(trav.length,'Traveling', trav.length? trav.map(p=>p.name.split(' ')[0]).join(', ') : 'nobody is away', trav.length?'warn':'', ()=>show('dates')));
  const wd=workdaysLeft();
  tl.appendChild(mk(fmtDays(wd),'Working Days Left',
    'weekdays left in '+new Date().getFullYear()+', minus holidays', wd<40?'warn':'', ()=>show('dates')));
  hl.appendChild(tl);
  root.appendChild(hl);

  // ask
  /* Ask needs Claude, so it lives only in the Claude version */

  // countdowns
  const pinned = cdAll();
  const useDates = pinned.filter(d=>d.pin).length ? pinned.filter(d=>d.pin) : pinned;
  if(useDates.length) root.appendChild(cdBlock('Counting Down', useDates, ()=> vToday($('#app-today'))));

  // team strip — and the bulk assigner that used to sit on the Team tab
  const w2=el('div');
  const sh=el('div','rowflex'); sh.style.marginBottom='2px';
  sh.appendChild(el('h2','sect-t','Where My Team Is Today'));
  const wb=el('button','btn ghost sm'); wb.type='button'; wb.style.marginLeft='auto';
  wb.textContent='Who Is Doing What';
  wb.title='Put someone on a task without giving up being accountable for it';
  wb.addEventListener('click', ()=> assignPanel());
  sh.appendChild(wb);
  w2.appendChild(sh);
  const strip=el('div','strip');
  S.people.forEach(p=> strip.appendChild(personCard(p)));
  w2.appendChild(strip); root.appendChild(w2);

  /* Your own work lives on My Board. Today is the team view — it used to
     repeat your task list here, which meant two places to keep an eye on. */
  if(!me){
    const c=el('div','callout');
    c.innerHTML='<b>Tell Team HQ who you are</b> so it can show your board. ';
    const lk=el('button','lk','Pick My Name'); lk.type='button'; lk.addEventListener('click',pickMe);
    c.appendChild(lk); root.appendChild(c);
  }

  // note wall — always open, the same shape as Counting Down above it
  if(S.notes.length){
    const w3=el('div');
    const n3=S.notes.length;
    w3.appendChild(el('h2','sect-t', n3===1? '1 Note to Review' : n3+' Notes to Review'));
    w3.appendChild(el('p','note','Things people jotted down that are not tasks yet. Click one to turn it into a task, or click the × to clear it.'));
    const g=el('div','stickies'); g.style.marginTop='12px';
    S.notes.forEach(n=> g.appendChild(noteSticky(n)));
    w3.appendChild(g);
    root.appendChild(w3);
  }

  /* The overlap list sits on Team Projects, where the parts it is about live.
     The tile up top is the signal; clicking it goes there. */
}

/* the This Week / This Month / This Year / Whole View switch that sits above
   every set of countdowns. One choice, remembered, shared by all of them. */
function cdFilters(redraw){
  const g=el('div','pills');
  CDWINS.forEach(w=>{
    const b=el('button','pill'); b.type='button'; b.textContent=w.n;
    b.setAttribute('aria-pressed', cdWin()===w.k ? 'true':'false');
    b.addEventListener('click', ()=>{ setCdWin(w.k); redraw(); });
    g.appendChild(b);
  });
  return g;
}
/* heading, filters and the grid itself — used on Today, on Key Dates and in
   the board panel, so all three behave the same */
function cdBlock(title, all, redraw){
  const w=el('div');
  /* heading and filters share one line and one left edge. Pushed apart they
     made a second ragged cluster under the view buttons. */
  const bar=el('div','cdbar');
  if(title){ const h=el('h2','sect-t',title); h.style.margin='0'; bar.appendChild(h); }
  bar.appendChild(cdFilters(redraw));
  w.appendChild(bar);
  const show=all.filter(d=>cdIn(d));
  if(!show.length){
    const e=emptyBox('Nothing Pinned Lands in '+cdWinName()+'.',
      all.length? 'There are '+all.length+' further out.' : 'Pin a date in Key Dates and it shows up here.');
    if(all.length){ const b=el('button','btn ghost sm','Show the Whole View'); b.type='button';
      b.style.marginTop='10px';
      b.addEventListener('click', ()=>{ setCdWin('all'); redraw(); });
      e.appendChild(b); }
    w.appendChild(e);
  } else {
    const g=el('div','cds');
    show.forEach(d=> g.appendChild(countdown(d)));
    w.appendChild(g);
  }
  return w;
}
/* One note on the wall. The × asks once before it clears anything, and what it
   clears can be put straight back from the toast. */
function noteSticky(n){
  const c=el('div','sticky '+(n.col||'y'));
  c.appendChild(el('div',null,n.t));
  const f=el('div','sfoot');
  f.appendChild(avatar(n.by,'xs'));
  f.appendChild(el('span',null,(person(n.by)||{name:'Someone'}).name.split(' ')[0]));
  const x=el('span','sdue sx','\u00d7'); x.title='Clear this note';
  let armed=null;
  x.addEventListener('click', async e=>{
    e.stopPropagation();
    if(!x.classList.contains('arm')){
      x.classList.add('arm'); x.textContent='Clear It?';
      x.title='Click again to take this note off the wall';
      armed=setTimeout(()=>{ x.classList.remove('arm'); x.textContent='\u00d7'; x.title='Clear this note'; }, 4000);
      return;
    }
    clearTimeout(armed);
    const kept=JSON.parse(JSON.stringify(n));
    await drop('notes', n.id);
    undoToast('Note cleared.', async ()=>{ await put('notes', kept); });
  });
  f.appendChild(x); c.appendChild(f);
  c.addEventListener('click', ()=>{
    editTask({t:n.t, o:n.by||S.me||'', r:n.r||'', w:'', s:'Not Started', p:'Normal', due:'', notes:'',
              ord:(S.tasks.length+1)*10, at:Date.now(), src:'note'}, ()=> drop('notes', n.id));
  });
  return c;
}
function countdown(d){
  const iso = dOf(d);
  const n = days(iso);
  const c=el('button','cd'+(n!==null&&n<=7?' now':n!==null&&n<=30?' soon':'')); c.type='button';
  c.style.setProperty('--kc', DKIND_C[d.k]||'var(--c1)');
  c.appendChild(el('div','kk', d.k));
  const nn=el('div','nn');
  if(n===null){ nn.textContent='No Date'; }
  else if(n<0 && d.approx && inThisMonth(iso)){ nn.textContent='This Month'; }
  else if(n<0) { nn.textContent='Passed'; }
  else if(n===0){ nn.textContent='Today'; }
  else { nn.appendChild(document.createTextNode((d.approx?'≈':'')+String(n)));
    nn.appendChild(el('small',null, n===1?'day to go':'days to go')); }
  c.appendChild(nn);
  c.appendChild(el('div','tt', d.t));
  c.appendChild(el('div','dd', (d._on? fmtD(d._on,0) : dateLabel(d))
    + (d.time? ' · '+d.time : '') + (d.loc? ' · '+d.loc : '')));
  if(d.rec && d.rec.f){
    const r=el('div','recchip');
    r.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 11a8 8 0 0113.6-5.6L21 9M21 13a8 8 0 01-13.6 5.6L3 15"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>';
    r.appendChild(document.createTextNode(recLabel(d.rec)));
    c.appendChild(r);
  }
  if(d.who && d.who.length){ const w=el('div','who'); d.who.slice(0,5).forEach(id=>w.appendChild(avatar(id,'xs'))); c.appendChild(w); }
  c.addEventListener('click', ()=> openDate(d));
  return c;
}

function personCard(p){
  const ef=effStatus(p); const st=statusOf(ef.k);
  const c=el('button','pcard'); c.type='button';
  c.style.setProperty('--pc', PCOL[p.color % PCOL.length]);
  const a=avatar(p.id);
  const dot=el('span','dot'); dot.style.background=st.c; a.appendChild(dot);
  c.appendChild(a);
  /* No job titles — everyone here knows who everyone is, and the two- and
     three-line ones were what made these cards ragged. Name, status, one line
     of detail, load bar on the floor: every card the same shape. */
  c.title = p.name+' \u2014 '+p.role;
  const m=el('div','pm');
  m.appendChild(el('b',null,p.name));
  /* the avatar already carries a status dot, so the line below is text only —
     two dots side by side read like a mistake */
  const s=el('span','st'); s.appendChild(document.createTextNode(st.n)); s.style.color=st.c;
  m.appendChild(s);
  /* exactly one detail line, always present, so every card is the same height */
  const bday = bdayOn(today()).some(x=>x.id===p.id);
  const det = bday ? '\ud83c\udf82 Birthday today'
    : ef.note ? (ef.auto && ef.k!=='off' ? '\u2708 ':'')+ef.note : '';
  const dl = el('span','stn'+(bday?' bd':''), det);
  if(!det) dl.innerHTML='&nbsp;';
  dl.title = det;
  m.appendChild(dl);
  const L=loadOf(p.id);
  const ld=el('div','ld');
  for(let k=0;k<6;k++){ const b=el('i'); if(k < Math.min(6, Math.ceil(L.score/3))) b.className='on'; ld.appendChild(b); }
  ld.title = L.total+' open · '+L.rails+' running rails · '+L.high+' high priority';
  m.appendChild(ld);
  c.appendChild(m);
  c.addEventListener('click', ()=> personPanel(p));
  return c;
}

/* The ones somebody has already said are fine, kept one click away rather than
   gone for good. */
function asideLine(){
  const list = overlapsAside();
  if(!list.length) return null;
  const w=el('div','asidebar');
  const b=el('button','lk'); b.type='button';
  b.textContent = list.length+(list.length===1?' flag set aside':' flags set aside')+' \u00b7 Show Them';
  const box=el('div'); box.hidden=true;
  b.addEventListener('click', ()=>{ box.hidden=!box.hidden;
    b.textContent = list.length+(list.length===1?' flag set aside':' flags set aside')+
      ' \u00b7 '+(box.hidden?'Show Them':'Hide Them');
    if(!box.firstChild) box.appendChild(overlapList(list, 1)); });
  w.appendChild(b); w.appendChild(box);
  return w;
}
function overlapList(ovl, aside){
  const w=el('div','ovl');
  ovl.slice(0,20).forEach(o=>{
    const r=el('button','ovlrow'+(aside?' aside':'')); r.type='button';
    const ic=el('span','ic'+(o.kind==='dup'?' bad':''));
    ic.innerHTML = o.kind==='dup'
      ? '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg>';
    r.appendChild(ic);
    const x=el('div','ox'); x.appendChild(el('b',null,o.title)); x.appendChild(el('small',null,o.sub));
    r.appendChild(x);

    r.addEventListener('click', ()=> overlapPanel(o));

  });

function overlapPanel(o){
  panel(o.kind==='dup'?'These Two Look Alike':'Two People, One Part', o.title, b=>{
    const aside = ovlAside(o);
    const c=el('div','callout'+(aside?'':' warn'));
    c.textContent = aside
      ? 'Set aside. Somebody has already looked at this and said it is fine, so it has stopped showing on the boards.'
      : o.kind==='dup'
      ? 'Different people, very similar task. Worth 30 seconds to check whether one of them can hand it over.'
      : 'More than one person has open work in this part. That is often right — but it is also where effort gets doubled.';
    b.appendChild(c);
    b.appendChild(el('h3','sect-t','The Tasks'));
    const r=el('div','rows'); o.tasks.forEach(t=>r.appendChild(taskRow(t))); b.appendChild(r);

    const acts=el('div','rowacts');
    acts.appendChild(el('span','note spacer', aside
      ? 'Putting it back makes it show up again for everyone.'
      : 'Not actually an overlap? Set it aside and it stops showing \u2014 for the whole team, until somebody puts it back.'));
    const btn=el('button','btn'+(aside?'':' ghost'), aside? 'Put It Back' : 'Not an Overlap'); btn.type='button';
    btn.addEventListener('click', async ()=>{
      btn.disabled=true;
      await ovlSetAside(o, !aside);
      closePanel(); renderAll();
      toast(aside? 'Back on the boards.' : 'Set aside.');
    });
    acts.appendChild(btn);
    b.appendChild(acts);
  });
}

/* ============ BIG ROCKS ============ */
function vRocks(root){
  root.textContent='';
  const right=el('div','rowflex');
  const nb=el('button','btn'); nb.type='button';
  nb.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  nb.appendChild(el('span',null,'New Team Project'));
  nb.addEventListener('click', ()=> editRock(null));
  right.appendChild(nb);
  vhead(root,'Team Projects','The umbrella efforts everything rolls up to. Open one to see its parts and who has work in each — that is where overlap shows up.', right);

  const ovl = overlaps();
  if(ovl.length){
    const bx=el('div','box');
    const h=el('div','rowflex'); h.style.marginBottom='10px';
    h.appendChild(el('h2','sect-t','Overlap Check'));
    const cc=el('span','chip ch-warn', ovl.length+(ovl.length===1?' to look at':' to look at')); cc.style.marginLeft='auto';
    h.appendChild(cc);
    bx.appendChild(h);
    bx.appendChild(overlapList(ovl));
    const al=asideLine(); if(al) bx.appendChild(al);
    root.appendChild(bx);
  }

  const dupWs = {};
  ovl.filter(o=>o.kind==='ws').forEach(o=> dupWs[o.rock+'||'+o.ws]=1);

  /* Whose is it — the team's list, or one person's own work.
     Amy's list is the team's; everything else belongs to somebody. */
  const wbar=el('div','filterbar whosebar');
  const nTeam = S.rocks.filter(r=>!r.whose).length;
  const nMine = S.me ? S.rocks.filter(r=>r.whose===S.me).length : 0;
  const nOther = S.rocks.length - nTeam - nMine;
  const wopts = [{v:'', n:'Everything', c:S.rocks.length},
                 {v:'team', n:'The Team\u2019s', c:nTeam}];
  if(S.me) wopts.push({v:'mine', n:'Mine', c:nMine});
  if(nOther) wopts.push({v:'others', n:'Other People\u2019s', c:nOther});
  wopts.forEach(o=>{
    const b=el('button','pill'); b.type='button';
    b.setAttribute('aria-pressed', (S.whoseFilter||'')===o.v ? 'true':'false');
    b.appendChild(document.createTextNode(o.n));
    b.appendChild(el('b',null,String(o.c)));
    b.addEventListener('click', ()=>{ S.whoseFilter=o.v; vRocks(root); });
    wbar.appendChild(b);
  });
  /* With everything on the team's list there is nothing to filter, so the row
     only appears once something here actually belongs to one person. */
  if(nTeam < S.rocks.length) root.appendChild(wbar);
  else S.whoseFilter='';

  const whoseOK = r =>
      !S.whoseFilter ? true
    : S.whoseFilter==='team' ? !r.whose
    : S.whoseFilter==='mine' ? r.whose===S.me
    : !!r.whose && r.whose!==S.me;
  const pool = S.rocks.filter(whoseOK);

  /* filter bar */
  const counts = {}; RSTAT.forEach(k=> counts[k]=pool.filter(r=>r.status===k).length);
  const bar=el('div','filterbar');
  const opts = [{v:'', n:'All', c:pool.length}].concat(RSTAT.map(k=>({v:k, n:(k==='Someday'?'Someday':k), c:counts[k]})));
  opts.forEach(o=>{
    const b=el('button','pill'); b.type='button';
    b.setAttribute('aria-pressed', S.rockFilter===o.v ? 'true':'false');
    b.appendChild(document.createTextNode(o.n));
    b.appendChild(el('b',null,String(o.c)));
    b.addEventListener('click', ()=>{ S.rockFilter=o.v; vRocks(root); });
    bar.appendChild(b);
  });
  root.appendChild(bar);

  if(S.rockFilter && RSTAT_D[S.rockFilter]){
    root.appendChild(el('div','statusnote', RSTAT_D[S.rockFilter]));
  }

  const list = pool.filter(r=> !S.rockFilter || r.status===S.rockFilter);
  if(!list.length){
    const bx=el('div','box');
    bx.appendChild(emptyBox('Nothing here yet.',
      S.rockFilter==='Someday'
        ? 'A good idea, but not one to spend time on now. Parked on purpose so it stops pulling at us.'
        : 'Click New Team Project to add one.'));
    root.appendChild(bx); return;
  }
  const g=el('div','rocks');
  list.forEach(r=> g.appendChild(rockCard(r, dupWs, root)));
  root.appendChild(g);
}

function rockCard(r, dupWs, root){
  const c=el('div','rock');
  const mine = S.tasks.filter(t=>t.r===r.id);
  const all = mine.length, dn = mine.filter(t=>t.s==='Done').length;
  const flagged = (r.ws||[]).some(w=> dupWs && dupWs[r.id+'||'+w]);

  /* header — the only thing visible when collapsed */
  const h=el('button','rkh'); h.type='button';
  h.setAttribute('aria-haspopup','dialog');
  h.style.setProperty('--rc', PCOL[(r.color||0)%PCOL.length]);
  const inn=el('div','rkin');
  const t=el('h3');
  const cv=document.createElementNS('http://www.w3.org/2000/svg','svg');
  cv.setAttribute('class','cv'); cv.setAttribute('viewBox','0 0 24 24');
  const pth=document.createElementNS('http://www.w3.org/2000/svg','path');
  pth.setAttribute('d','M9 6l6 6-6 6'); cv.appendChild(pth); t.appendChild(cv);
  t.appendChild(el('span','nm', r.name));
  inn.appendChild(t);
  const m=el('div','rkm');
  const sc=el('span','chip '+(r.status==='Active'?'ch-ip':r.status==='Next Up'?'ch-soon':r.status==='Done'?'ch-dn':'ch-out'));
  sc.textContent=r.status; m.appendChild(sc);
  if(r.lead){ const l=el('span','chip ch-ns'); l.appendChild(avatar(r.lead,'xs'));
    l.appendChild(document.createTextNode(pname(r.lead).split(' ')[0])); m.appendChild(l); }
  if(r.whose) m.appendChild(el('span','chip ch-own', pname(r.whose).split(' ')[0]+'\u2019s Own'));
  const np=(r.ws||[]).length;
  m.appendChild(el('span','chip ch-ns', np+(np===1?' part':' parts')));
  if(flagged) m.appendChild(el('span','chip ch-warn','Overlap'));
  inn.appendChild(m);
  h.appendChild(inn);

  /* progress bar — stays visible whether open or shut */
  const prog=el('div','prog');
  prog.appendChild(el('span','pn', dn+' of '+all+' done'));
  const pb=el('div','pbar'); const bi=el('i'); bi.style.width=(all? Math.round(dn/all*100):0)+'%'; pb.appendChild(bi);
  prog.appendChild(pb);
  prog.appendChild(el('span','pw', (all-dn)+' open'));
  h.appendChild(prog);

  h.addEventListener('click', ()=> rockPanel(r, dupWs));
  c.appendChild(h);

  return c;
}

/* Everything that used to drop down below the card now opens in the right rail,
   so the row of cards never reflows under you while you read one. */
function rockPanel(r, dupWs){
  const head = (()=>{ const m=S.tasks.filter(t=>t.r===r.id);
    return r.status+(r.lead? ' \u00b7 lead '+pname(r.lead):'')+' \u00b7 '+m.filter(t=>t.s==='Done').length+' of '+m.length+' done'; })();
  panel(r.name, head, body=>{
    /* worked out inside build, so stepping back here after finishing a task
       shows the list as it is now, not as it was when you opened it */
    const mine = S.tasks.filter(t=>t.r===r.id);
    const all = mine.length, dn = mine.filter(t=>t.s==='Done').length;
    if(r.desc) body.appendChild(el('div','rkd', r.desc));

    const pb=el('div','pbar'); pb.style.margin='14px 0 2px';
    const bi=el('i'); bi.style.width=(all? Math.round(dn/all*100):0)+'%'; pb.appendChild(bi);
    body.appendChild(pb);

    body.appendChild(el('h3','sect-t','The Parts'));
    const ws=el('div','ws');
    (r.ws||[]).forEach(w=>{
      const ts = mine.filter(t=>t.w===w && t.s!=='Done');
      const done = mine.filter(t=>t.w===w && t.s==='Done').length;
      const who = Array.from(new Set(ts.map(t=>t.o))).filter(Boolean);
      const row=el('button','wsr'+(dupWs && dupWs[r.id+'||'+w]?' dup':'')); row.type='button';
      const wn=el('span','wn'); wn.appendChild(document.createTextNode(w));
      const sm=el('small');
      sm.textContent = ts.length? ts.length+(ts.length===1?' open task':' open tasks')+(done?' \u00b7 '+done+' done':'')
                     : (done? done+' done, nothing open' : 'nothing here yet');
      wn.appendChild(sm); row.appendChild(wn);
      const wr=el('span','wr');
      if(who.length>1) wr.appendChild(el('span','chip ch-warn', who.length+' people'));
      const avs=el('span','avs'); who.slice(0,4).forEach(id=>avs.appendChild(avatar(id,'xs'))); wr.appendChild(avs);
      row.appendChild(wr);
      row.addEventListener('click', ()=> wsPanel(r, w));
      ws.appendChild(row);
    });
    if(!(r.ws||[]).length) ws.appendChild(emptyBox('No parts yet.','Edit this team project to add the parts people divide up.'));
    body.appendChild(ws);

    const acts=el('div','rowacts');
    const add=el('button','btn ghost','Jot Something Down'); add.type='button';
    add.addEventListener('click', ()=>{ closePanel(); capture(r.id); }); acts.appendChild(add);
    /* The lead is answerable for this one; this is how they put somebody else
       on the actual work without giving up being accountable for it. */
    const wh=el('button','btn ghost','Who Is Doing What'); wh.type='button';
    wh.title='Put someone on a task here without giving up being accountable for it';
    wh.addEventListener('click', ()=> assignPanel(r.id)); acts.appendChild(wh);
    const ed=el('button','btn','Edit This Team Project'); ed.type='button';
    ed.addEventListener('click', ()=> editRock(r)); acts.appendChild(ed);
    body.appendChild(acts);
  });
}

function wsPanel(r, w){
  panel(r.name, w, b=>{
    const mine = S.tasks.filter(t=>t.r===r.id && t.w===w);
    const ts = mine.filter(t=>t.s!=='Done');

    const who = Array.from(new Set(ts.map(t=>t.o))).filter(Boolean);
    if(who.length>1){
      const c=el('div','callout warn');
      const nm=who.map(id=>pname(id).split(' ')[0]);
      const list = nm.length===2 ? nm.join(' and ') : nm.slice(0,-1).join(', ')+' and '+nm[nm.length-1];
      c.textContent = list+' have open work here. Worth a quick check that nobody is covering the same ground.';
      b.appendChild(c);
    }
    const bar=el('div','rowflex');
    const add=el('button','btn','Add a Task Here'); add.type='button';
    add.addEventListener('click', ()=>{
      editTask({t:'', o:S.me||'', r:r.id, w:w, s:'Not Started', p:'Normal', due:'', notes:'', rail:0,
                ord:(S.tasks.length+1)*10, at:Date.now()});
    });
    bar.appendChild(add);
    if(ts.length){
      const wh=el('button','btn ghost','Who Is Doing What'); wh.type='button';
      wh.addEventListener('click', ()=> assignPanel(r.id));
      bar.appendChild(wh);
    }
    if(done) bar.appendChild(el('span','note pushr', done+' already done here'));
    b.appendChild(bar);
    if(!ts.length){ b.appendChild(emptyBox('Nothing open here.','Add a task, or leave it — an empty part is fine.')); return; }
    const rows=el('div','rows'); ts.forEach(t=>rows.appendChild(taskRow(t))); b.appendChild(rows);
  }, w);
}

function editRock(r){
  const isNew=!r;
  const d = r? JSON.parse(JSON.stringify(r)) : {name:'', desc:'', status:'Next Up', lead:S.me||'', color:S.rocks.length%7, order:(S.rocks.length+1), ws:[]};
  const openedAs = snapOf('rocks', d.id);
  panel(isNew?'New Team Project':'Edit Team Project', d.name||'', body=>{
    const g=el('div','fields');
    const fN=field(g,'Name', inp('text', d.name, 'e.g. MISMO FRAME'), 'w2');
    const fS=field(g,'Status', sel(RSTAT, d.status));
    const fL=field(g,'Lead', sel(peopleOpts(), d.lead, 'No Lead Yet'));
    const fWh=field(g,'Whose Is This?', sel(peopleOpts(), d.whose||'', 'The Team\u2019s'), 'w2');
    const fD=field(g,'What It Is', ta(d.desc||'', '', 3), 'w4');
    const fW=field(g,'The Parts (One per Line)', ta((d.ws||[]).join('\n'), '', 6), 'w4');
    body.appendChild(g);
    const hint=el('p','note','The parts are how you divide and conquer — for FRAME that might be Certification, Marketing, Development, Workshops, Webinars, Education. Tasks get tagged to a part, and Team HQ flags it when two people are in the same one.');
    body.appendChild(hint);
    const st=el('div','callout'); st.textContent = RSTAT_D[fS.value]; body.appendChild(st);
    fS.addEventListener('change', ()=>{ st.textContent = RSTAT_D[fS.value]; });

    const acts=el('div','rowacts');
    if(!isNew){
      const del=el('button','btn danger','Delete'); del.type='button';
      del.addEventListener('click', async ()=>{ if(del.dataset.c){
          /* take the project off its tasks first, or they keep pointing at
             something that is gone and lose their part the next time one is saved */
          /* undoing this has to put the tasks back on the project too, not just
             the project itself — so what each one looked like is kept */
          const orphans=S.tasks.filter(t=>t.r===d.id);
          const before=orphans.map(t=>JSON.parse(JSON.stringify(t)));
          const keptRock=JSON.parse(JSON.stringify(S.rocks.find(r=>r.id===d.id)||d));
          for(const t of orphans){ const o=Object.assign({},t); o.r=''; o.w=''; await put('tasks', o); }
          await drop('rocks', d.id); closePanel();
          undoToast('Team project deleted.'
            +(orphans.length? ' Its '+orphans.length+' task'+(orphans.length===1?'':'s')+' stayed, with no project on them.':''),
            async ()=>{ await put('rocks', keptRock);
              for(const t of before) await put('tasks', t); });
        }
        else { del.dataset.c='1'; del.textContent='Click Again to Delete'; } });
      acts.appendChild(del); acts.appendChild(el('span','spacer'));
    }
    const cancel=el('button','btn ghost','Cancel'); cancel.type='button'; cancel.addEventListener('click',closePanel);
    const save=el('button','btn','Save'); save.type='button';
    save.addEventListener('click', async ()=>{
      if(!fN.value.trim()){ fN.focus(); return; }
      d.name=fN.value.trim(); d.status=fS.value; d.lead=fL.value; d.whose=fWh.value; d.desc=fD.value.trim();
      d.ws = fW.value.split('\n').map(x=>x.trim()).filter(Boolean);
      const commitR = async ()=>{ await put('rocks', d); closePanel();
        toast(isNew?'Team project added.':'Saved.'); };
      const RLAB = {name:'the name', status:'the status', lead:'who is accountable',
        whose:'whose it is', desc:'the description', ws:'the parts'};
      if(movedUnderYou('rocks', d.id, openedAs)) return askOverwrite('rocks', d.id, openedAs, RLAB, commitR);
      await commitR();
    });
    acts.appendChild(cancel); acts.appendChild(save); body.appendChild(acts);
  });
}

/* presetRock opens it already narrowed to one team project, which is how the
   lead of that project gets here from the project itself. */
const asgTmr = {};   /* one save timer per task, so a flurry of clicks writes once */
function assignPanel(presetRock){
  if(typeof presetRock === 'string') S.asgRock = presetRock;
  const pr = (typeof presetRock==='string') ? rock(presetRock) : null;
  panel(pr ? 'Who Is Doing What on '+pr.name : 'Who Is Doing What',
        'Check anyone hands-on. The outlined one is the accountable person.', body=>{
    const c=el('div','callout');
    c.innerHTML='<b>Accountable is not the same as doing it.</b> Amy may be accountable while Kelly does the work, or Perry helps on something Jonathan owns. Check whoever is actually working it \u2014 that is what the load bars under Where My Team Is Today use.';
    body.appendChild(c);

    const bar=el('div','rowflex');
    const fR=sel(S.rocks.map(r=>({v:r.id,n:r.name})), S.asgRock||'', 'Every Team Project');
    const lw=el('label'); lw.style.cssText='display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)';
    lw.appendChild(el('span',null,'Show')); lw.appendChild(fR);
    bar.appendChild(lw);
    const only=el('label','chkrow'); only.style.marginLeft='auto';
    const ocb=el('input'); ocb.type='checkbox'; ocb.checked=!!S.asgOnly;
    only.appendChild(ocb); only.appendChild(el('span',null,'Only tasks with nobody hands-on yet'));
    bar.appendChild(only);
    body.appendChild(bar);

    const wrap=el('div','rows'); body.appendChild(wrap);
    function draw(){
      wrap.textContent='';
      let list = openTasks();
      if(S.asgRock) list = list.filter(t=>t.r===S.asgRock);
      if(S.asgOnly) list = list.filter(t=>!(t.d && t.d.length));
      if(!list.length){ wrap.appendChild(emptyBox('Nothing to set here.','Everything in this view already has someone on it.')); return; }
      const byRock={}; list.forEach(t=> (byRock[t.r||'']=byRock[t.r||'']||[]).push(t));
          /* a task can still point at a project that has since gone; show those too
         rather than quietly leaving them out of the list */
      const gone=Object.keys(byRock).filter(id=> id && !S.rocks.some(r=>r.id===id));
      const order=S.rocks.map(r=>r.id).filter(id=>byRock[id]).concat(gone).concat(byRock['']?['']:[]);
      order.forEach(rid=>{
        const g=el('div','asgrp');
        g.appendChild(document.createTextNode(rid? (rock(rid)||{name:rid}).name : 'No Team Project'));
        g.appendChild(el('span',null,String(byRock[rid].length)));
        wrap.appendChild(g);
        byRock[rid].forEach(t=> wrap.appendChild(asgRow(t)));
      });
    }
    function asgRow(t){
      const r=el('div','asrow');
      const at=el('span','at'); at.appendChild(document.createTextNode(t.t));
      const sm=el('small');
      sm.innerHTML='Accountable: <b>'+esc(pname(t.o).split(' ')[0])+'</b>'+(t.w? ' \u00B7 '+esc(t.w) : '');
      at.appendChild(sm); r.appendChild(at);
      const w=el('span','asw');
      S.people.forEach(pp=>{
        const b=el('button','tog'+(pp.id===t.o?' acc':'')); b.type='button';
        b.style.setProperty('--tc', pcolor(pp.id));
        b.textContent=initials(pp.name);
        b.title=pp.name+(pp.id===t.o?' (accountable)':'');
        const on = isDoing(t, pp.id) && !!(t.d && t.d.length);
        b.setAttribute('aria-pressed', on?'true':'false');
        b.addEventListener('click', ()=>{
          const set=new Set(t.d||[]);
          if(set.has(pp.id)) set.delete(pp.id); else set.add(pp.id);
          t.d=Array.from(set);
          b.setAttribute('aria-pressed', set.has(pp.id)?'true':'false');
          clearTimeout(asgTmr[t.id]);
          asgTmr[t.id]=setTimeout(()=>{ put('tasks', t); }, 700);
        });
        w.appendChild(b);
      });
      r.appendChild(w);
      return r;
    }
    fR.addEventListener('change', ()=>{ S.asgRock=fR.value; draw(); });
    ocb.addEventListener('change', ()=>{ S.asgOnly=ocb.checked; draw(); });
    draw();
  });
  /* this one wants the room, but only while it is open — otherwise every
     panel after it opened wide for the rest of the session */
  const pw=$('#panel');
  if(!pw.classList.contains('wide')){
    $('#panel-wide').click();
    PSTACK[PSTACK.length-1].narrow = 1;
  }
}

/* ============ "Working today?" ============
   On a weekend, a holiday or a summer Friday afternoon, anyone who opens Team HQ
   is shown as Off. That is right for the six people who are not working and wrong
   for the one who is — and the one who is, is the one who just opened the page.
   So we ask, once, and let them answer for today or for good. */
function askedToday(set){
  const k='offasked';
  const iso=isoOf(today());
  if(set){ LS.set(k, iso); return true; }
  return LS.get(k,'') === iso;
}
async function offPrompt(){
  const p = S.people.find(x=>x.id===S.me);
  if(!p) return;
  const oc = offNow(); if(!oc) return;
  if(offRuleOf(p, oc.cycle) !== 'ask') return;      /* already decided, for good */
  if(p.statusAt && p.statusAt.slice(0,10) === isoOf(today())) return;  /* decided today */
  if(askedToday()) return;                           /* asked already on this device */
  askedToday(true);
  sheet(box=>{
    box.appendChild(el('h2',null, oc.cycle==='holiday' ? oc.why : cycleName(oc.cycle)));
    box.appendChild(el('p','note', 'Right now the team sees you as Off. Are you working?'));
    const keep=el('label','chk');
    const cb=el('input'); cb.type='checkbox';
    keep.appendChild(cb);
    keep.appendChild(el('span',null,'Do this every time and stop asking me'));
    box.appendChild(keep);
    const acts=el('div','rowacts');
    const no=el('button','btn ghost','No, I Am Off'); no.type='button';
    const yes=el('button','btn','Yes, Show Me as Around'); yes.type='button';
    const answer = async (around)=>{
      const d=Object.assign({}, p);
      if(cb.checked){
        d.offRule = Object.assign({}, d.offRule||{}, {[oc.cycle]: around?'around':'off'});
      }
      if(around){ d.status='around'; d.statusNote=''; d.statusAt=new Date().toISOString(); }
      closeSheet();
      await put('people', d);
      toast(around ? 'Showing as Around.' : 'Left as Off.');
    };
    no.addEventListener('click', ()=>answer(false));
    yes.addEventListener('click', ()=>answer(true));
    acts.appendChild(no); acts.appendChild(yes);

/* ============ KEY DATES ============ */
/* two entries for the same thing, sitting on top of each other */
function dateDupes(){
  const out=[], xs=dateList();
  for(let i=0;i<xs.length;i++) for(let j=i+1;j<xs.length;j++){
    const a=xs[i], b=xs[j];
    if((a.nodupe||[]).indexOf(b.id)>=0 || (b.nodupe||[]).indexOf(a.id)>=0) continue;
    const a1=parseD(dOf(a)), b1=parseD(dOf(b));
    if(!a1||!b1) continue;
    const a2=parseD(a.e)||a1, b2=parseD(b.e)||b1;
    const overlaps = a1<=b2 && b1<=a2;
    const near = Math.abs((a1-b1)/86400000) <= 3;
    if(!overlaps && !near) continue;
    if(contains(a.t, b.t) < 0.9) continue;
    out.push({a:a, b:b});
  }
  return out;
}
function mergeDates(a, b){
  /* keep whichever is more specific: real dates beat an approximate month */
  let keep=a, drop=b;
  const score = x => (x.approx?0:2) + (x.e?1:0) + (x.pin?1:0);
  if(score(b) > score(a)){ keep=b; drop=a; }
  panel('Merge These Two', 'They look like the same thing on the same days.', body=>{
    const c=el('div','callout warn');
    c.textContent='One entry survives. The people from both are combined, and the other note is kept underneath.';
    body.appendChild(c);
    const pick=el('div','fields');
    const fK=field(pick,'Keep', sel([{v:'a',n:keep.t},{v:'b',n:drop.t}], 'a'), 'w4');
    body.appendChild(pick);
    const prev=el('div','rows'); body.appendChild(prev);
    function result(){
      const K = fK.value==='a'? keep : drop;
      const D = fK.value==='a'? drop : keep;
      const who = Array.from(new Set((K.who||[]).concat(D.who||[])));
      const notes = [K.note, D.note].filter(Boolean).filter((v,i,ar)=>ar.indexOf(v)===i).join(' ');
      const out = Object.assign({}, K, {who:who, note:notes,
        loc: K.loc || D.loc || '',
        pin: (K.pin||D.pin)?1:0,
        d: K.approx && !D.approx ? D.d : K.d,
        e: K.approx && !D.approx ? D.e : K.e,
        approx: (K.approx && !D.approx) ? 0 : K.approx||0,
        rec: K.rec || D.rec || null});
      return {out:out, dropId:D.id};
    }
    function draw(){
      prev.textContent='';
      const r=result();
      prev.appendChild(dateRow(r.out));
    }
    fK.addEventListener('change', draw); draw();
    const acts=el('div','rowacts');
    const no=el('button','btn ghost','Not Duplicates'); no.type='button';
    no.addEventListener('click', async ()=>{
      const x=Object.assign({}, a); x.nodupe=Array.from(new Set((a.nodupe||[]).concat([b.id])));
      await put('dates', x); closePanel(); toast('Left as two separate dates.');
    });
    const cancel=el('button','btn ghost','Cancel'); cancel.type='button'; cancel.addEventListener('click',closePanel);
    const go=el('button','btn','Merge into One'); go.type='button';
    go.addEventListener('click', async ()=>{
      const r=result();
      await put('dates', r.out);
      await drop('dates', r.dropId);
      closePanel(); toast('Merged.');
    });
    acts.appendChild(no); acts.appendChild(el('span','spacer'));
    acts.appendChild(cancel); acts.appendChild(go);
    body.appendChild(acts);
  });
}

const DOW_H = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function monthGrid(anchorDate, onPick){
  const y=anchorDate.getFullYear(), m=anchorDate.getMonth();

        bp.textContent='\ud83c\udf82 '+pp.name.split(' ')[0];
        bp.title=pp.name+'\u2019s birthday'; ev.appendChild(bp); });

      });

/* ============ MY TASKS ON A CALENDAR ============
   The same month shell as The Month, but carrying a person's own tasks
   instead of Key Dates. A task is dragged from one day to another to change
   when it is due, dragged down to the strip underneath to take the date off
   again, and clicked to open the usual task editor. */
function taskCal(who, anchorDate, moreFor){
  const y=anchorDate.getFullYear(), m=anchorDate.getMonth();
  const first=new Date(y,m,1);
  let lead=(first.getDay()+6)%7;
  const start=new Date(y,m,1-lead);
  const t=today();
  const mine = doingTasks(who).concat(S.tasks.filter(x=> x.o===who && !isDoing(x,who)));
  const byDay={};
  mine.forEach(x=>{ if(!x.due) return; (byDay[x.due]=byDay[x.due]||[]).push(x); });

  const wrap=el('div','cal tcal');
  const head=el('div','calhead');
  DOW_H.forEach(dd=>head.appendChild(el('span',null,dd)));
  wrap.appendChild(head);
  const body=el('div','calbody');

  const pill = x =>{
    const n=days(x.due);
    const bcls = x.s==='Done' ? ' done' : (n!==null && n<0) ? ' late' : '';
    const bb=el('button','tpill'+bcls+(x.p==='High'?' hi':'')); bb.type='button';
    bb.style.setProperty('--tc', pcolor(x.o));
    bb.textContent=x.t;
    const r=rock(x.r);
    bb.title=x.t+'\n'+(r? r.name+' \u00b7 ' : '')+x.s+' \u00b7 '+x.p
      +'\nDrag to another day to move it. Click to open it.';
    bb.addEventListener('click', ()=> editTask(x));
    dragTask(bb, x);
    return bb;
  };

  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const out = d.getMonth()!==m;
    const iso = isoOf(d);
    const cell=el('div','calday'+(out?' out':'')+(d.getTime()===t.getTime()?' today':''));
    cell.dataset.iso=iso;
    if(holidayOn(d)) cell.classList.add('hol');
    else if(isHalfFriday(d)) cell.classList.add('half');
    cell.appendChild(el('span','cn', String(d.getDate())));
    /* time set aside sits above the tasks, because it is when, not what */
    blocksOn(who, iso).forEach(b2=> cell.appendChild(blockPill(b2)));
    const list=(byDay[iso]||[]).slice().sort((a,b2)=> (a.s==='Done')-(b2.s==='Done') || a.t.localeCompare(b2.t));
    const show = moreFor===iso ? list : list.slice(0,3);
    show.forEach(x=> cell.appendChild(pill(x)));
    if(list.length>show.length){
      const more=el('button','cmore','+'+(list.length-show.length)+' more'); more.type='button';
      more.addEventListener('click', ()=> dayTasks(who, d, list));
      cell.appendChild(more);
    }
    /* the empty part of a day is a button: click it and the new task already
       knows which day you meant */
    const add=el('button','dayadd'); add.type='button';
    add.title='Add a task due '+fmtD(iso,1);
    add.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
    add.addEventListener('click', e=>{ e.stopPropagation();
      editTask({t:'', o:who, d:[who], r:'', w:'', s:'Not Started', p:'Normal',
        due:iso, notes:'', rail:0, ord:(S.tasks.length+1)*10, at:Date.now()});
    });
    cell.appendChild(add);
    body.appendChild(cell);
  }
  wrap.appendChild(body);

  const out=el('div'); out.style.cssText='display:flex;flex-direction:column;gap:10px';
  out.appendChild(wrap);

  /* anything of theirs with no date yet, ready to be dragged onto a day */
  const bank=el('div','tcbank'); bank.dataset.bank='1';
  const undated = mine.filter(x=> !x.due && x.s!=='Done');
  bank.appendChild(el('div','tcb-h','No Date Yet \u2014 '+undated.length));
  if(undated.length){
    const l=el('div','tcb-l');
    undated.slice(0,24).forEach(x=>{
      const bb=el('button','tpill'+(x.p==='High'?' hi':'')); bb.type='button';
      bb.style.setProperty('--tc', pcolor(x.o));
      bb.textContent=x.t; bb.title=x.t+'\nDrag it onto a day to give it a due date.';
      bb.addEventListener('click', ()=> editTask(x));
      dragTask(bb, x);
      l.appendChild(bb);
    });
    if(undated.length>24) l.appendChild(el('span','note','and '+(undated.length-24)+' more'));
    bank.appendChild(l);
  } else bank.appendChild(el('div','tcal-help','Everything with a date is on the calendar. Drop one here to take its date off.'));
  out.appendChild(bank);
  out.appendChild(el('div','tcal-help','Drag a task to another day to change when it is due. Click one to open it.'));
  return out;
}
