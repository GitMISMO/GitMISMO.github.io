<style>html.hq-out body > *:not(#hq-gate):not(.rs-scrim){visibility:hidden}</style>
<script>(function(){
  var out = true;
  try {
    var s = JSON.parse(localStorage.getItem('resources:session') || 'null');
    out = !(s && s.token && s.expiresAt && Date.parse(s.expiresAt) > Date.now());
  } catch (e) { out = true; }

<script src="/assets/session.js"></script>
<script>(function(){
  function sync(){
    var rs = window.ResourcesSession, inn = !!(rs && rs.current());
    document.documentElement.classList.toggle('hq-out', !inn);
    document.documentElement.classList.toggle('hq-in', inn);
  }
  if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
  else { document.addEventListener('DOMContentLoaded', function(){
    if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
    else document.documentElement.classList.remove('hq-out');
  }); }
})();</script>
<script>
/* ============================================================================
   TEAM HQ ON resources.mismo.org — the one door to MISMO's save relay
   ----------------------------------------------------------------------------
   Team HQ was built inside Claude, where every tab reached its data through
   window.claude.use('db' | 'user' | 'assets' | 'downloads' | 'sample'). This
   file gives the page that same door, backed by the save relay instead, so none
   of the tabs had to change how they read or save. It follows Summit HQ's door
   (summit-hq/index.html), trimmed to what Team HQ uses.

   Where the data lives:
     team-hq          PRIVATE repo GitMISMO/team-hq-data — everything the team shares
     team-hq-private  PRIVATE repo GitMISMO/team-hq-private-data — Jonna's private notes
                      on how someone is doing with a plan. Only people given the
                      "Team HQ Private Notes" tool can read it; nobody else is.
     sponsorship      the Sponsorship Portal's own prospect list, read live (never
                      written) for anyone who also has the portal. Replaces the
                      nightly copy the Claude version needed.
   The page itself (in the PUBLIC team-hq repo) holds no team data.

   How documents are filed (the relay has no "list a folder" route, so each
   collection is one file):
     data/<collection>.json   {docs:{<id>:{...}}}   people, tasks, dates, plans …
     data/profiles.json       {docs:{<email>:{...}}} each person's own board layout
     data/plannotes.json      (in team-hq-private)  {docs:{<email>:{notes:[…]}}}
     receipts/<time>-<name>   receipt photos, stored as files

   Saving: every save sends the version (sha) it last read. If someone else saved
   in between, the relay answers 409; the change is re-applied on top of theirs
   and sent again, so two people editing different things never overwrite each
   other. Saves made within a moment of each other go out together.

   Seeing other people's changes: the relay has no push, so files are re-read
   every 30 seconds while the page is in use (the busy ones), every 3 minutes for
   the rest, every 2 minutes after ten idle minutes, and not at all while the tab
   is hidden. The relay asks GitHub "has it changed?", which costs nothing when
   it hasn't.

   Sign-in is the shared resources.mismo.org sign-in (/assets/session.js).
   ========================================================================== */
(function () {
  'use strict';
  if (window.__hqRelay) return;

  var RELAY_URL = 'https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws';
  var PROJECT = 'team-hq';
  var PRIVATE = 'team-hq-private';
  var PORTAL = 'sponsorship';
  var TOOL = 'Team HQ';
  var POLL_MS = 30000, IDLE_POLL_MS = 120000, IDLE_AFTER = 10 * 60000, COOL_POLL_MS = 180000;
  var HOT = { tasks: 1, nudges: 1, notes: 1, agenda: 1, planitems: 1, people: 1, blocks: 1 };
  var FLUSH_MS = 350, RETRY_MS = 8000;
  var MAX_FILE = 940000;              /* the relay takes at most 1,000,000 bytes a save */
  var MAX_RECEIPT = 4 * 1024 * 1024;  /* base64 adds a third; the relay's request limit is about 6 MB */
  var COLLS = ['people', 'rocks', 'tasks', 'dates', 'notes', 'agenda', 'expenses', 'figures', 'nudges',
    'leads', 'blocks', 'asks', 'plans', 'planitems', 'plankinds', 'datekinds'];

  /* ---------- browser storage: every tool shares this web address ----------
     Team HQ's own keys (mismo.teamhq.…, hq.rail.off) are filed under
     tools:team-hq: so they cannot collide with another tool's. The sign-in and the
     MISMO theme are shared on purpose and are left alone. */
  (function () {
    var P = 'tools:team-hq:';
    var shared = function (k) { k = String(k); return k.indexOf('tools:') === 0 || k.indexOf('resources:') === 0 || k === 'mismo.portal.theme'; };
    try {
      var S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem;
      S.getItem = function (k) { return g.call(this, shared(k) ? k : P + k); };
      S.setItem = function (k, v) { return s.call(this, shared(k) ? k : P + k, v); };
      S.removeItem = function (k) { return r.call(this, shared(k) ? k : P + k); };
      S.clear = function () { /* never: it would wipe every other tool's storage too */ };
    } catch (e) {}
  })();

  function RS() { return window.ResourcesSession || null; }
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function err(code, message, status) { var e = new Error(message || code); e.code = code; e.status = status || 0; return e; }
  function now() { return Date.now(); }
  function myId() { var s = RS() && RS().current(); return String((s && s.email) || '').toLowerCase(); }

  /* ---------- where a document is filed ---------- */
  function place(path) {
    var seg = String(path).split('/');
    if (seg.length === 4 && seg[0] === 'data' && seg[1] === 'users') {
      if (seg[3] === 'profile') return { proj: PROJECT, file: 'profiles', key: seg[2] };
      if (seg[3] === 'plannotes') return { proj: PRIVATE, file: 'plannotes', key: seg[2] };
    }
    if (seg.length === 2) {
      if (seg[0] === 'leads') return { proj: PORTAL, file: 'leads', key: seg[1], ro: true };
      if (COLLS.indexOf(seg[0]) >= 0) return { proj: PROJECT, file: seg[0], key: seg[1] };
    }
    throw err('invalid_argument', 'Team HQ does not keep anything at ' + path);
  }
  function fileOfColl(coll) { return coll === 'leads' ? { proj: PORTAL, file: 'leads', ro: true } : { proj: PROJECT, file: coll }; }

  /* ---------- talking to the relay ---------- */
  var status = { offline: false, lastError: '' };
  function call(proj, path, method, body) {
    var rs = RS(), tok = rs && rs.token();
    if (!tok) return Promise.reject(err('SIGNED_OUT', 'Not signed in', 401));
    var headers = { 'Authorization': 'Bearer ' + tok };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch(RELAY_URL + '/' + proj + path, {
      method: method, cache: 'no-store', headers: headers, body: body ? JSON.stringify(body) : undefined

      status.offline = false;
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.ok) return b;
        var e = err((b && b.error) || ('HTTP_' + r.status), b && b.message, r.status);
        if (r.status === 401 && rs) { needSignIn(); }
        throw e;
      });
    }, function () { status.offline = true; throw err('OFFLINE', 'Could not reach the relay', 0); });
  }
  function net(method, f, body) { return call(f.proj, '/data/' + encodeURIComponent(f.name), method, body); }

  /* ---------- files ---------- */
  var F = {};
  function file(proj, name, ro) {
    var k = proj + ':' + name;
    if (!F[k]) F[k] = { k: k, proj: proj, name: name, ro: !!ro, server: null, sha: null, loaded: false, loading: null,
      loadedAt: 0, pending: [], timer: null, flushing: false, view: null, waitingSignIn: false, denied: false };
    return F[k];

  function fileFor(p) { return file(p.proj, p.file, p.ro); }
  function normalise(c) {
    c = c && typeof c === 'object' ? c : {};

  /* Reading something this person may not have — the Sponsorship Portal's prospects, or
     the private notes — is not a failure of Team HQ: it reads as empty, quietly. */
  function optional(f) { return f.proj !== PROJECT; }
  function load(f) {
    if (f.loading) return f.loading;
    f.loading = net('GET', f).then(function (b) {
      return { content: normalise(b && b.data), sha: (b && b.sha) || null };
    }, function (e) {
      /* the relay answers a missing file with {data:null}; a 404 means something else is

      if (e && e.status === 404 && (e.code === 'NOT_FOUND' || e.code === 'HTTP_404')) return { content: { docs: {} }, sha: null };
      if (optional(f) && e && (e.status === 403 || e.status === 404 || e.code === 'NO_ACCESS' || e.code === 'UNKNOWN_PROJECT')) {
        f.denied = true; return { content: { docs: {} }, sha: null };
      }
      throw e;
    }).then(function (got) {
      var before = f.loaded ? JSON.stringify(f.server) : null;
      f.server = got.content; f.sha = got.sha; f.loaded = true; f.loadedAt = now(); f.view = null;
      f.loading = null;
      if (before !== JSON.stringify(f.server)) notify(f, false);
      return f;
    }, function (e) { f.loading = null; throw e; });
    return f.loading;
  }
  function ensure(f) { return f.loaded ? Promise.resolve(f) : load(f); }

  function applyOps(content, ops) {
    ops.forEach(function (op) {
      if (op.kind === 'set') content.docs[op.key] = clone(op.data);
      else if (op.kind === 'update') content.docs[op.key] = Object.assign({}, content.docs[op.key] || {}, clone(op.data));
      else if (op.kind === 'delete') delete content.docs[op.key];

  }
  function viewOf(f) {
    if (!f.loaded) return null;
    if (!f.view) f.view = applyOps(clone(f.server), f.pending);
    return f.view;
  }
  function docIn(f, key) {
    var v = viewOf(f); if (!v) return undefined;
    var d = v.docs[key];
    return d === undefined ? null : d;
  }

  /* ---------- saving ---------- */
  function queue(path, kind, data) {
    var p = place(path), f = fileFor(p);
    if (p.ro) return Promise.reject(err('READ_ONLY', 'Team HQ only reads the Sponsorship Portal’s prospects.'));
    return new Promise(function (res, rej) {
      var go = function () {
        if (f.denied) { rej(err('NO_ACCESS', 'You do not have access to save this.', 403)); return; }
        if (kind === 'update' && f.loaded && docIn(f, p.key) === null) { rej(err('not-found', 'No document to update: ' + path)); return; }
        var op = { kind: kind, key: p.key, data: data, res: res, rej: rej };
        f.pending.push(op); f.view = null;
        notify(f, true);
        schedule(f, FLUSH_MS);

      else go();

  }
  function schedule(f, ms) {
    if (f.timer) return;
    f.timer = setTimeout(function () { f.timer = null; flush(f); }, ms);
  }
  /* GitHub makes one commit to a branch at a time: two saves sent together and the
     second is refused as a conflict. So every save goes out after the one before it
     has finished, never side by side. */
  var putChain = Promise.resolve();
  function serial(fn) {
    var p = putChain.then(fn, fn);
    putChain = p.then(function () {}, function () {});
    return p;
  }
  function flush(f) {
    if (f.flushing || !f.pending.length) return;
    if (!(RS() && RS().token())) { f.waitingSignIn = true; needSignIn(); return; }
    f.flushing = true;
    var batch = f.pending.slice(), tries = 0;
    var attempt = function () {
      return ensure(f).then(function () {
        var next = applyOps(clone(f.server), batch);
        if (JSON.stringify(next).length > MAX_FILE) throw err('TOO_BIG', 'This part of Team HQ has grown too big to save in one piece.');
        return serial(function () { return net('PUT', f, { content: next, sha: f.sha }); }).then(function (b) {
          f.server = next; f.sha = (b && b.sha) || f.sha; f.loadedAt = now();
          f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
          batch.forEach(function (op) { op.res(); });
          notify(f, false);
          saved();
        });
      }).catch(function (e) {
        if (e && e.status === 409 && tries < 8) {
          tries++;
          f.loaded = false;
          return new Promise(function (r) { setTimeout(r, 300 * tries + Math.random() * 500); })
            .then(function () { return load(f); }).then(attempt);
        }
        throw e;
      });
    };
    attempt().catch(function (e) {
      /* a 502 from the relay with TOKEN or GITHUB is a setup problem, not a blip: say so at
         once rather than retrying quietly forever */
      var transient = e && (e.code === 'OFFLINE' || e.status === 401 || e.code === 'SIGNED_OUT' ||
        (e.status >= 500 && e.code !== 'TOKEN' && e.code !== 'GITHUB' && e.code !== 'REJECTED'));
      if (transient) {
        /* nothing is lost: the change stays queued and goes out once the relay is back */
        if (e.status === 401 || e.code === 'SIGNED_OUT') f.waitingSignIn = true;
        else setTimeout(function () { schedule(f, 0); }, RETRY_MS);
        problem(e);
        return;
      }
      f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
      batch.forEach(function (op) { op.rej(e); });
      notify(f, false);
      problem(e, true);
    }).then(function () {
      f.flushing = false;
      if (f.pending.length && !f.waitingSignIn) schedule(f, FLUSH_MS);
    });
  }
  function anyPending() { return Object.keys(F).some(function (k) { return F[k].pending.length; }); }
  window.addEventListener('beforeunload', function (e) {
    if (anyPending()) { e.preventDefault(); e.returnValue = 'Team HQ is still saving.'; return e.returnValue; }
  });

  /* ---------- snapshots and listeners ---------- */
  function docSnap(id, data, pending) {
    var exists = data !== null && data !== undefined;
    return { id: id, exists: exists, ref: { id: id },
      data: function () { return exists ? clone(data) : undefined; },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  var collL = [];
  function collSnap(coll, pending) {
    var fo = fileOfColl(coll), f = file(fo.proj, fo.file, fo.ro), v = viewOf(f) || { docs: {} };
    var list = Object.keys(v.docs).map(function (id) { return docSnap(id, v.docs[id], pending); });
    return { docs: list, size: list.length, empty: !list.length,
      forEach: function (fn) { list.forEach(fn); },
      docChanges: function () { return list.map(function (d) { return { type: 'added', doc: d }; }); },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  function notify(f, pending) {
    collL.forEach(function (l) {
      var fo = fileOfColl(l.coll);
      if (fo.proj + ':' + fo.file !== f.k || !f.loaded) return;
      var sig = JSON.stringify(viewOf(f));
      if (l.primed && sig === l.sig) return;
      l.primed = true; l.sig = sig;
      try { l.cb(collSnap(l.coll, pending)); } catch (e) { console.error(e); }
    });
  }

  /* ---------- the store, in the shape the tabs already use ---------- */
  function docRef(path) {
    var p = place(path);
    return {
      id: p.key, path: path,
      get: function () {
        var f = fileFor(p);
        var fresh = f.loaded && !f.loading && (hasListener(f) || f.pending.length || now() - f.loadedAt < 15000);
        return (fresh ? Promise.resolve(f) : load(f)).then(function () {
          if (f.denied && f.proj === PRIVATE) throw err('NO_ACCESS', 'Private notes are not turned on for this account.', 403);
          return docSnap(p.key, docIn(f, p.key), f.pending.length > 0);
        });
      },
      set: function (data) { return queue(path, 'set', data); },
      update: function (patch) { return queue(path, 'update', patch); },
      delete: function () { return queue(path, 'delete', null); }
    };
  }
  function collRef(coll) {
    var ref = {
      id: coll, path: coll,
      doc: function (id) { return docRef(coll + '/' + (id || (now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      where: function () { return ref; }, orderBy: function () { return ref; }, limit: function () { return ref; },
      get: function () {
        var fo = fileOfColl(coll), f = file(fo.proj, fo.file, fo.ro);
        return ensure(f).then(function () { return collSnap(coll, false); });
      },
      onSnapshot: function (cb, errCb) {
        var l = { coll: coll, cb: cb, primed: false, sig: null }; collL.push(l);
        var fo = fileOfColl(coll), f = file(fo.proj, fo.file, fo.ro);
        ensure(f).then(function () {
          if (l.primed) return;
          l.primed = true; l.sig = JSON.stringify(viewOf(f)); cb(collSnap(coll, false));
        }).catch(function (e) { if (errCb) errCb(e); });
        return function () { var i = collL.indexOf(l); if (i >= 0) collL.splice(i, 1); };
      }
    };
    return ref;
  }
  function hasListener(f) {
    return collL.some(function (l) { var fo = fileOfColl(l.coll); return fo.proj + ':' + fo.file === f.k; });
  }
  var DB = { doc: docRef, collection: function (c) { return collRef(c); } };

  /* ---------- keeping up with everyone else ---------- */
  var lastActive = now();
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { lastActive = now(); }, { capture: true, passive: true });
  });
  function poll(force) {
    if (!ready || !(RS() && RS().token())) return;
    if (!force && document.visibilityState === 'hidden') return;
    var idle = now() - lastActive > IDLE_AFTER;
    Object.keys(F).forEach(function (k) {
      var f = F[k];
      if (!f.loaded || f.flushing || f.pending.length || f.loading || f.denied || !hasListener(f)) return;
      var gap = (f.proj === PROJECT && HOT[f.name]) ? (idle ? IDLE_POLL_MS : POLL_MS) : COOL_POLL_MS;
      if (!force && now() - (f.polledAt || f.loadedAt) < gap) return;
      f.polledAt = now();
      load(f).catch(function () {});
    });
  }
  setInterval(function () { poll(false); }, 5000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') poll(true); });

  /* ---------- who is signed in ---------- */
  function me() { var s = RS() && RS().current(); return { name: (s && s.name) || '', email: (s && s.email) || '' }; }
  var USER = {
    id: function () { return Promise.resolve(myId()); },
    me: function () { return Promise.resolve(me()); },
    profile: function () { return Promise.resolve(me()); }
  };

  /* ---------- receipt photos ----------
     Stored as files in team-hq-data under receipts/, through the relay's /commit route,
     and read back through /file/, so the photos never sit anywhere public. */
  var blobs = {};
  function toBase64(fileObj) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { rej(err('READ', 'That file could not be read.')); };
      r.readAsDataURL(fileObj);
    });
  }
  var ASSETS = {
    upload: function (fileObj) {
      if (!fileObj) return Promise.reject(err('NO_FILE', 'No file.'));
      if (fileObj.size > MAX_RECEIPT) return Promise.reject(err('TOO_BIG', 'That photo is over 4 MB. Try a smaller one.'));
      var safe = String(fileObj.name || 'receipt').replace(/[^A-Za-z0-9._-]/g, '_').slice(-80);
      var path = 'receipts/' + now().toString(36) + '-' + safe;
      return toBase64(fileObj).then(function (b64) {
        return serial(function () {
          return call(PROJECT, '/commit', 'POST', { message: 'Receipt ' + safe + ' (' + (me().name || 'Team HQ') + ')',
            files: [{ path: path, content: b64, encoding: 'base64' }] });
        });
      }).then(function () {
        blobs[path] = URL.createObjectURL(fileObj);
        return { id: path, name: fileObj.name, size: fileObj.size, type: fileObj.type };
      });
    }
  };
  /* where the Claude version wrote <img src="/_blob/ID">, this fills the picture in */
  window.__relayBlob = function (img, id) {

    if (String(id).indexOf('receipts/') !== 0) { img.alt = 'Receipt (kept in the Claude version)'; return; }

      var bin = atob((b && b.content) || ''), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      img.src = blobs[id];
    }, function () { img.alt = 'The receipt could not be loaded'; });
  };

  /* ---------- files handed to the person ---------- */
  var DOWNLOADS = {
    save: function (o) {
      return new Promise(function (res) {
        var data = o && o.data, blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });

  /* ---------- the sign-in gate ---------- */
  var ready = false, readyWaiters = [], gateEl = null;
  function whenReady() { return ready ? Promise.resolve() : new Promise(function (r) { readyWaiters.push(r); }); }
  var WHY = {
    UNKNOWN_PROJECT: 'The save relay doesn’t know Team HQ yet. It needs the team-hq entry in projects.json.',
    NO_ACCESS: 'Your account doesn’t have Team HQ yet. Ask Jonna Critchley to add you.',
    TOKEN: 'The save relay’s GitHub key was refused. It needs the team-hq-data repository added to it.',
    GITHUB: 'GitHub refused the save. The save relay’s GitHub key most likely doesn’t include the team-hq-data repository yet.',
    CONFIG_UNAVAILABLE: 'The save relay can’t read its settings right now.',
    OFFLINE: 'Team HQ couldn’t reach the save relay. Check your connection.',
    TOO_BIG: 'This part of Team HQ has grown too big to save in one piece.'

  /* The gate sits UNDER the shared sign-in box (session.js draws it at z-index 9500),
     so pressing Sign In shows that box on top rather than behind this card. */
  function gate(kind, e) {
    if (!document.body) { document.addEventListener('DOMContentLoaded', function () { gate(kind, e); }, { once: true }); return; }
    if (!gateEl) {
      var st = document.createElement('style');
      st.textContent = '#hq-gate{position:fixed;inset:0;z-index:9400;display:flex;align-items:center;justify-content:center;padding:16px;' +
        'background:var(--ground,#f1f6fa);font-family:"IBM Plex Sans",system-ui,sans-serif}' +
        '#hq-gate[hidden]{display:none}' +
        '#hq-gate .card{max-width:420px;width:100%;background:var(--surface,#fff);border:1px solid var(--border,#d5e2ed);border-radius:12px;padding:28px 26px;box-shadow:0 8px 28px rgba(13,49,76,.12)}' +

/* ---------- page shell ---------- */
main{padding-inline:28px;padding-block:26px 90px}
@media(max-width:700px){main{padding-inline:14px;padding-block:18px 96px}}
.view{display:flex;flex-direction:column;gap:26px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.vhead h1{font-size:24px;font-weight:700}
.vhead p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.vhead .grow{flex:1 1 320px}
.sect-t{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px}
.muted{color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-2)}
.rowflex{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pushr{margin-left:auto}

/* collapsible section */
.fold{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;
  font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary:hover{background:var(--surface-3)}
.fold > summary .caret{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.fold[open] > summary .caret{transform:rotate(90deg)}
.fold > summary .cnt{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0 7px;font-size:11px;letter-spacing:0;color:var(--ink)}
.fold .foldbody{padding:16px;border-top:1px solid var(--rule)}

/* ---------- headline band ---------- */
.headline{background:var(--navy);color:#fff;border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.headline .hl-date{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sky-soft)}
.headline .hl-say{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.4;margin:-8px 0 0}
.headline .hl-say em{font-style:normal;color:var(--sky)}
.headline .hl-say em.hl-late{color:#ffcf73}
/* the day's occasion — a birthday, a holiday, a half day — inside the navy
   band on Today and on My Board. One rule, both places, so the wording and
   the look never drift apart. */
.hl-occs{display:flex;flex-direction:column;gap:8px}
.hl-occ{display:flex;align-items:flex-start;gap:10px;border-radius:6px;padding:10px 14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(116,191,235,.28);
  border-left:3px solid var(--sky);font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.86)}
.hl-occ .oi{font-size:16px;line-height:1.3;flex:0 0 auto}
.hl-occ .ot{min-width:0}
.hl-occ .ot b{color:#fff;font-weight:700}
.hl-occ.bday{border-left-color:#f7a8c4}
.hl-occ.holiday{border-left-color:#7ddcb0}
.hl-occ.half{border-left-color:#ffcf73}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(152px,100%),1fr));gap:12px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.28);border-radius:6px;padding:12px 14px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tile:hover{background:rgba(255,255,255,.14)}
.tile b{display:block;font-size:28px;font-weight:700;line-height:1.1;color:#fff}
.tile span{display:block;font-size:12px;color:var(--sky-soft);margin-top:3px}
.tile small{display:block;font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px}
.tile.warn b{color:#ffcf73}
.tile.bad b{color:#ff9d91}

/* ---------- team strip ---------- */
/* Every person card is the same height and the bits inside line up across the
   row: name, status, one detail line, load bar on the floor. */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:12px;align-items:stretch}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 13px;display:flex;gap:11px;
  align-items:flex-start;text-align:left;color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;
  height:100%}
.pcard:hover{border-color:var(--border-strong)}
.pcard:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc,var(--cn))}
.av{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;background:var(--pc,var(--cn));position:relative}
.av.sm{width:26px;height:26px;font-size:10.5px}
.av.xs{width:21px;height:21px;font-size:9px}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface)}
.pcard .pm{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;align-self:stretch}
.pcard .pm b{display:block;font-size:13.5px;font-weight:700;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pm .st{display:block;margin-top:6px;font-size:11.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pm .stn{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;min-height:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .ld{display:flex;gap:2px;margin-top:auto;padding-top:10px;height:14px;box-sizing:content-box}
.pcard .ld i{flex:1 1 auto;height:4px;align-self:flex-end;border-radius:2px;background:var(--surface-3)}
.pcard .ld i.on{background:var(--pc,var(--cn))}
.s-office{--sc:var(--good)} .s-remote{--sc:var(--c1)} .s-travel{--sc:var(--c2)}
.s-focus{--sc:var(--c7)} .s-out{--sc:var(--ink-3)} .s-meeting{--sc:var(--c4)}
.stdot{background:var(--sc,var(--cn))}
.sttxt{color:var(--sc,var(--ink-2))}

/* ---------- countdowns ---------- */
/* Countdowns wrap onto as many rows as the chosen window needs. The window
   itself (This Week / This Month / This Year / Whole View) is what keeps the
   block short, so there is nothing to scroll sideways. */
.cdbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.cdbar .pills{gap:6px}
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:12px;align-items:stretch}
.cds > .cd{min-width:0}
@media(max-width:620px){.cds{grid-template-columns:1fr}}
.cd{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.cd:hover{border-color:var(--border-strong)}
.cd::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--kc,var(--c1))}
.cd .kk{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--kc,var(--c1))}
.cd .nn{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.cd .nn small{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:5px;letter-spacing:0}
.cd .tt{font-size:13.5px;font-weight:600;line-height:1.3;margin-top:2px}
.cd .dd{font-size:12px;color:var(--ink-3)}
.cd.soon .nn{color:var(--warn)} .cd.now .nn{color:var(--bad)}
.cd .who{display:flex;gap:-4px;margin-top:6px}
.cd .who .av{margin-right:-6px;border:2px solid var(--surface)}

/* ---------- team projects ---------- */
/* Jonna: opening a card on one side must not move the card beside it. The grid
   stretches its rows by default, which made a tall opened card drag its whole
   row taller. align-items:start lets every card take only its own height. */
/* min(330px,100%) so a narrow phone gets one column that fits rather than a
   330px card the page has to scroll sideways to reach */
.rocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:16px;align-items:start}
.rock{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.rock .rkh{padding:14px 16px 12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:7px;position:relative}
.rock .rkh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,var(--c1))}
.rock h3{font-size:16px;font-weight:700;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rock h3 .lk{flex:0 0 auto}
.rock .rkd{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.rock .rkm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ws{display:flex;flex-direction:column}
.wsr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--rule);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.wsr:last-child{border-bottom:0}
.wsr:hover{background:var(--surface-2)}
.wsr .wn{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.wsr .wn small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.wsr .wr{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.wsr .avs{display:flex}
.wsr .avs .av{margin-right:-7px;border:2px solid var(--surface)}
.wsr .avs .av:last-child{margin-right:0}
.wsr.dup{background:var(--warn-soft)}
.wsr.dup:hover{background:var(--warn-soft);filter:brightness(.97)}
.rkfoot{margin-top:auto;padding:10px 16px;border-top:1px solid var(--rule);background:var(--surface-2);
  display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.pbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex;flex:1 1 auto;min-width:40px}
.pbar i{display:block;height:100%;background:var(--good)}

/* team project collapsible card */
.rock .rkh{padding:0;border-bottom:0;display:block;position:relative;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.rock .rkh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,var(--c1));z-index:1}
.rock .rkh:hover{background:var(--surface-2)}
.rock .rkh:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.rock .rkin{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.rock h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px;min-width:0}
.rock h3 .cv{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:var(--ink-3);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.rock.open h3 .cv{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.rock h3 .cv{transition:none}}
.rock h3 .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.rock .rkd{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.rock .rkm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rock .prog{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--rule);background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.rock .prog .pn{white-space:nowrap;font-weight:600}
.rock .prog .pw{white-space:nowrap;color:var(--ink-3)}
.rkbody{border-top:1px solid var(--rule)}
.rkacts{padding:10px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filterbar .pill{display:inline-flex;align-items:center;gap:7px}
.filterbar .pill b{font-weight:700;font-size:11px;background:var(--surface-3);border-radius:3px;padding:0 5px;min-width:18px;text-align:center;color:var(--ink-2)}
.filterbar .pill[aria-pressed="true"] b{background:rgba(255,255,255,.22);color:#fff}
:root[data-theme="dark"] .filterbar .pill[aria-pressed="true"] b{background:rgba(6,32,47,.2);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .filterbar .pill[aria-pressed="true"] b{background:rgba(6,32,47,.2);color:var(--navy-deep)}}
.statusnote{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--c1);border-radius:0 6px 6px 0;padding:9px 13px}
.recchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-3)}
.recchip svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.whopair{display:inline-flex;align-items:center;gap:3px}
.whopair .av.helper{box-shadow:0 0 0 1.5px var(--surface)}
.whopair .wsep{color:var(--ink-3);font-size:11px;font-weight:700;margin:0 1px}

/* who is working it — the bulk screen */
.assign{display:flex;flex-direction:column}
.asgrp{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--surface-3);border-bottom:1px solid var(--rule);
  font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);position:sticky;top:0;z-index:2}
.asgrp span{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0 6px;font-size:11px;letter-spacing:0;color:var(--ink)}
.asrow{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.asrow:last-child{border-bottom:0}
.asrow:hover{background:var(--surface-2)}
.asrow .at{font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.asrow .at small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.asrow .at small b{color:var(--ink-2);font-weight:600}
.asw{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.asw .tog{width:30px;height:30px;border-radius:4px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--ink-3);font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;padding:0;line-height:1;
  display:inline-flex;align-items:center;justify-content:center}
.asw .tog:hover{border-color:var(--border-strong);color:var(--ink)}
.asw .tog[aria-pressed="true"]{background:var(--tc,var(--c1));border-color:var(--tc,var(--c1));color:#fff}
.asw .tog.acc{box-shadow:inset 0 0 0 2px var(--navy)}
:root[data-theme="dark"] .asw .tog.acc{box-shadow:inset 0 0 0 2px var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .asw .tog.acc{box-shadow:inset 0 0 0 2px var(--sky)}}
@media(max-width:620px){.asrow{grid-template-columns:1fr}.asw{justify-content:flex-start}}
.legkey{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--ink-2);align-items:center}
.legkey i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:6px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.6}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.ch-ns{background:var(--surface-3);color:var(--ink-2)}
.ch-ip{background:var(--info-soft);color:var(--c1)}
.ch-bl{background:var(--bad-soft);color:var(--bad)}
.ch-dn{background:var(--good-soft);color:var(--good)}
.ch-od{background:var(--bad-soft);color:var(--bad)}
.ch-soon{background:var(--warn-soft);color:var(--warn)}
.ch-hi{background:var(--navy);color:#fff}
:root[data-theme="dark"] .ch-hi{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ch-hi{background:var(--sky);color:var(--navy-deep)}}
.ch-out{background:var(--surface-2);border-color:var(--border);color:var(--ink-2)}
.ch-warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- task views ---------- */
/* the view switch sits beside Add a Panel, so it matches a button's height exactly */
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:5px;overflow:hidden;
  box-sizing:border-box;min-height:32px;align-items:stretch}
.seg button{border:0;border-right:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);padding:0 13px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}}
.seg button:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.seg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* rows */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.row{border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.rh2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;background:none;border:0;text-align:left;padding:10px 14px;color:var(--ink);cursor:pointer;font:inherit;font-size:13.5px}
.rh2:hover{background:var(--surface-2)}
.rh2:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.row.open > .rh2{background:var(--sky-wash)}
.rh2 .t{flex:1 1 240px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rh2 .t small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.rh2 .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.rh2 .d{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rh2.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.rb{padding:14px;background:var(--surface-2);border-top:1px solid var(--rule)}
.rgrp{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface-3);border-bottom:1px solid var(--rule);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.rgrp span{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0 6px;font-size:11px;letter-spacing:0;color:var(--ink)}
.empty{padding:22px;color:var(--ink-3);text-align:center;font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:14px;font-weight:600;margin-bottom:4px}

/* task cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--cn))}
.tcard:hover{border-color:var(--border-strong)}
.tcard .tt{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.tcard .tm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcard .tf{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);margin-top:auto;padding-top:8px;border-top:1px solid var(--rule)}

/* sticky notes */
.stickies{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:14px;align-items:stretch}
.sticky{border:0;border-radius:2px;padding:15px 14px 30px;min-height:150px;text-align:left;cursor:pointer;position:relative;
  font-family:var(--hand);font-size:19px;line-height:1.3;color:#1d2a16;box-shadow:2px 3px 9px rgba(13,49,76,.22);
  display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere}
.sticky.y{background:#fdf0a4}
.sticky.b{background:#b7e3f7}
.sticky.g{background:#c3ecbd}
.sticky.p{background:#f9c9dd}
.sticky.o{background:#fcd3a6}
.sticky:hover{transform:scale(1.02);box-shadow:3px 5px 14px rgba(13,49,76,.3);z-index:2}
.sticky .sfoot{position:absolute;left:14px;right:12px;bottom:8px;display:flex;align-items:center;gap:7px;
  font-family:var(--display);font-size:10.5px;font-weight:600;color:rgba(29,42,22,.6)}
.sticky .sfoot .av{width:18px;height:18px;font-size:8px;border:0}
.sticky .sdue{margin-left:auto;font-family:var(--display);font-size:10.5px;font-weight:700}
.sticky .sdue.od{color:#9c2b20}
:root[data-theme="dark"] .sticky{box-shadow:2px 3px 12px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sticky{box-shadow:2px 3px 12px rgba(0,0,0,.5)}}

/* drag + drop */
.dragging{opacity:.4}

.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1000px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.lanes{grid-template-columns:1fr}}
.lane{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.lane > h3{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.lane > h3 span{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0 6px;font-size:11px;letter-spacing:0;color:var(--ink)}
.lanebody{display:flex;flex-direction:column;gap:10px;min-height:60px}
.lane.stk .lanebody{display:grid;grid-template-columns:1fr;gap:14px}

/* ---------- load bars (team view) ---------- */
.loads{display:flex;flex-direction:column;gap:2px}
.loadrow{display:grid;grid-template-columns:150px 1fr 78px;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--rule);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.loadrow:last-child{border-bottom:0}
.loadrow:hover{background:var(--surface-2)}
.loadrow .nm{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-width:0}
.loadrow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--surface-3)}
.stack > i{height:100%;min-width:2px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-style:normal}
.loadrow .n{text-align:right;font-size:12px;color:var(--ink-2);white-space:nowrap}
.loadrow .n b{color:var(--ink);font-size:14px}
@media(max-width:620px){.loadrow{grid-template-columns:1fr auto}.loadrow .stack{grid-column:1 / -1}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---------- forms + buttons ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.toolbar label{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
select,input[type=text],input[type=date],input[type=url],input[type=number],input[type=search],textarea{
  background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);border-radius:4px;padding:6px 8px;font-size:13px;max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--c1);outline-offset:-1px}
textarea{width:100%;resize:vertical;line-height:1.5;min-height:72px;field-sizing:content;max-height:420px}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:4px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--navy-mid)}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.42;cursor:not-allowed}
/* small buttons and filter pills sit in the same rows, so they are one height */
.btn.sm{padding:0 10px;font-size:12px;min-height:28px}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
@media(max-width:1100px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1 / -1}
@media(max-width:560px){.f.w2{grid-column:auto}}
.f > span{font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.f input,.f select,.f textarea{width:100%}
.f .ro{font-size:13px;color:var(--ink);padding:6px 0;overflow-wrap:anywhere}
.f .chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
#sheet-box .chk{display:flex;align-items:center;gap:9px;font-size:13px;margin:14px 0 4px;cursor:pointer}
#sheet-box .chk input{width:16px;height:16px;flex:none;cursor:pointer}
.f .fhint{display:block;font-size:11px;line-height:1.35;color:var(--ink-3);margin-top:4px}
.rowacts{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.rowacts .spacer{margin-right:auto}
.lk{background:none;border:0;padding:0;color:var(--c1);cursor:pointer;font:inherit;text-decoration:underline}
.lk.plain{text-decoration:none;font-size:18px;color:var(--ink-3)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:4px;
  padding:0 11px;min-height:28px;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;cursor:pointer}
.pill:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .pill[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}

.railfind input[type=search]{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;
  border-radius:6px;font-size:12.5px;padding:6px 26px 6px 32px;max-width:none}
.railfind input[type=search]:focus{background:rgba(255,255,255,.16);border-color:var(--sky)}
.chkrow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:8px 12px;cursor:pointer;min-height:34px}
.chkrow input[type=checkbox]{width:16px;height:16px;flex:0 0 auto;margin:0;accent-color:var(--c1)}
.chkrow > span{font-size:13px;font-weight:600;line-height:1.3}
.chkrow:hover{background:var(--surface-3)}

.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:330px}
.daygrid button,.btnrow button{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);
  border-radius:4px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0;line-height:1;
  display:inline-flex;align-items:center;justify-content:center}
.daygrid button{aspect-ratio:1/1;min-height:34px}
.daygrid button.last{grid-column:span 4;aspect-ratio:auto;padding:0 8px;font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:4px}
.btnrow button{min-height:32px;padding:0 11px}
.btnrow.wk button{width:40px;padding:0}
.btnrow.mo button{width:46px;padding:0}
.daygrid button:hover,.btnrow button:hover{border-color:var(--border-strong);color:var(--ink);background:var(--surface-3)}
.daygrid button[aria-pressed="true"],.btnrow button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .daygrid button[aria-pressed="true"],:root[data-theme="dark"] .btnrow button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .daygrid button[aria-pressed="true"],:root:not([data-theme="light"]) .btnrow button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.daygrid button:focus-visible,.btnrow button:focus-visible{outline:2px solid var(--c1);outline-offset:1px}

/* ---------- side panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,32,47,.4);z-index:98;border:0;padding:0}
.panel{position:fixed;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(680px,calc(100vw - 56px));z-index:99;background:var(--ground);
  border-left:1px solid var(--border-strong);box-shadow:-12px 0 32px rgba(6,32,47,.22);display:flex;flex-direction:column;
  transform:translateX(0);transition:transform .22s cubic-bezier(.4,0,.2,1),width .22s cubic-bezier(.4,0,.2,1)}
.panel.off{transform:translateX(102%);visibility:hidden}
.panel.wide{width:min(1320px,calc(100vw - 88px))}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
@media(max-width:800px){.panel,.panel.wide{width:100vw}}
.ph{display:flex;align-items:flex-start;gap:12px;padding:16px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
.ph h2{font-size:19px;font-weight:700}
.ph p{margin:3px 0 0;color:var(--ink-2);font-size:13px}
.ph .x{background:none;border:1px solid var(--border-strong);border-radius:4px;width:32px;height:32px;font-size:18px;color:var(--ink);cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.ph .x:hover{background:var(--surface-2)}
.ph .x.wide-b{margin-left:auto;border-color:transparent;color:var(--ink-3);padding:0}
.ph .x.wide-b:hover{color:var(--ink);background:var(--sky-wash);border-color:var(--sky)}
.ph .x.wide-b + .x{margin-left:-6px}
.ph .x.wide-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ph .x.wide-b .i-min{display:none}
.panel.wide .ph .x.wide-b .i-max{display:none}
.panel.wide .ph .x.wide-b .i-min{display:block}
@media(max-width:800px){.ph .x.wide-b{display:none}.ph .x.wide-b + .x{margin-left:auto}}
.pb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 22px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;container-type:inline-size}
.pb > *{flex:0 0 auto}
@container (max-width:900px){.pb .fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:480px){.pb .fields{grid-template-columns:1fr}.pb .f.w2{grid-column:auto}}
@media(max-width:700px){.ph,.pb{padding-inline:15px}}

.dragghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;opacity:.9;overflow:hidden;
  border:1px solid var(--c1);border-radius:8px;background:var(--surface);box-shadow:0 12px 30px rgba(6,32,47,.35)}
.dragghost.ghostpill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;
  --pc:var(--navy);background:var(--pc);border-color:var(--pc);color:#fff;font-weight:700;font-size:13.5px;white-space:nowrap;max-width:360px}
.dragghost.ghostpill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;opacity:.7;flex:0 0 auto}
.dragghost.ghostpill span{overflow:hidden;text-overflow:ellipsis}
body.dragging-now{cursor:grabbing;user-select:none}
body.dragging-now *{cursor:grabbing!important}

/* ---------- quick add ---------- */
.quickadd{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:9px 11px;box-shadow:var(--shadow)}
.quickadd svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.quickadd input{flex:1 1 auto;border:0;background:transparent;font-size:14px;padding:4px 0;color:var(--ink)}
.quickadd input:focus{outline:none}
.quickadd input::placeholder{color:var(--ink-3)}
.quickadd .hint{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
@media(max-width:620px){.quickadd .hint{display:none}}

/* ---------- capture sheet ---------- */
.modal{position:fixed;inset:0;z-index:150;background:rgba(6,32,47,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:0 18px 48px rgba(6,32,47,.4);padding:20px 22px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal-box h2{font-size:18px;font-weight:700}
.modal-box > p{margin:5px 0 15px;color:var(--ink-2);font-size:13px}
.modal-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center}
.cap-in{width:100%;min-height:92px;font-family:var(--hand);font-size:22px;line-height:1.35;
  background:#fdf0a4;color:#1d2a16;border:0;border-radius:3px;padding:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);resize:vertical}
.cap-in:focus{outline:2px solid var(--c1);outline-offset:2px}
.cap-in::placeholder{color:rgba(29,42,22,.42)}
.mic{width:46px;height:46px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mic:hover{background:var(--surface-2);color:var(--ink)}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,55,44,.5)}50%{box-shadow:0 0 0 9px rgba(179,55,44,0)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.micnote{font-size:12px;color:var(--ink-3);flex:1 1 140px}

/* ---------- ask / AI ---------- */
.askwrap{display:flex;flex-direction:column;gap:14px}
.askbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.askbar input{flex:1 1 300px;font-size:15px;padding:11px 14px;border-radius:6px}
.askex{display:flex;flex-wrap:wrap;gap:8px}
.askex[hidden]{display:none}
.asklink{align-self:flex-start;background:none;border:0;padding:0;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--border-strong)}
.asklink:hover{color:var(--c1);text-decoration-color:var(--c1)}
.asklink:focus-visible{outline:2px solid var(--c1);outline-offset:2px;border-radius:3px}
.askans{position:relative}
.askans[hidden]{display:none}
.askx{position:absolute;top:9px;right:9px;z-index:1;width:28px;height:28px;padding:0;line-height:1;
  border:1px solid var(--border);border-radius:5px;background:var(--surface-2);color:var(--ink-3);
  font-size:18px;cursor:pointer}
.askx:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.askx:focus-visible{outline:2px solid var(--c1);outline-offset:1px}
.askout{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 48px 18px 20px;font-size:14px;line-height:1.6;min-height:70px}
.askout p{margin:0 0 10px}.askout p:last-child{margin:0}
.askout ul,.askout ol{margin:0 0 10px;padding-left:20px}
.askout li{margin:4px 0}
.askout h3{font-size:14.5px;font-weight:700;margin:14px 0 7px}
.askout h3:first-child{margin-top:0}
.askout strong{font-weight:700}
.askout code{background:var(--surface-3);border-radius:3px;padding:1px 5px;font-size:13px}
.thinking{color:var(--ink-3);font-style:italic}

/* ---------- overlap ---------- */
.ovl{display:flex;flex-direction:column}
.ovlrow{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--rule);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.ovlrow:last-child{border-bottom:0}
.ovlrow:hover{background:var(--surface-2)}
.ovlrow .ic{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--warn-soft);color:var(--warn)}
.ovlrow .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ovlrow .ic.bad{background:var(--bad-soft);color:var(--bad)}
.ovlrow .ox b{display:block;font-size:13.5px;font-weight:600}
.ovlrow .ox small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.ovlrow .avs{display:flex}
.ovlrow .avs .av{margin-right:-7px;border:2px solid var(--surface)}
.ovlrow .avs .av:last-child{margin-right:0}

/* ---------- my board widgets ---------- */
.wgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.widget{grid-column:span 4;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;position:relative}
.wrows{display:flex;flex-direction:column;gap:16px}
.wrow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
/* "Match Their Heights": panels side by side line up, but a folded one stays short */
.wrows.matched .wrow{align-items:stretch}
.wrows.matched .wrow > .widget.shut{align-self:start}
.bgear{padding:0;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  background:none;border:0;border-radius:6px;color:var(--ink-3);cursor:pointer}
.bgear:hover{background:var(--surface-2);color:var(--ink)}
.bgear:focus-visible{outline:2px solid var(--c1);outline-offset:1px}
.bgear svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the month ---------- */
.cal{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.calhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface-3);
  border-bottom:1px solid var(--border)}
.calhead span{padding:7px 9px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.calbody{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calday{min-height:104px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:var(--surface);padding:6px 7px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:0}
.calday:nth-child(7n){border-right:0}
.calday:hover{background:var(--surface-2)}
.calday:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.calday.out{background:var(--surface-2);opacity:.55}
.calday.today{background:var(--info-soft);box-shadow:inset 0 2px 0 var(--c1)}
.calday .cn{font-size:12px;font-weight:700;color:var(--ink-2)}
.calday.today .cn{color:var(--c1)}
.cev{display:flex;flex-direction:column;gap:3px;min-width:0}
.cpill{font-size:10.5px;line-height:1.3;font-weight:600;padding:2px 5px;border-radius:3px;
  background:color-mix(in srgb,var(--kc) 14%,var(--surface));color:var(--kc);
  border-left:2px solid var(--kc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmore{font-size:10px;color:var(--ink-3)}
.caway{display:flex;margin-top:auto;padding-top:3px}
.caway .av{margin-right:-5px;border:1.5px solid var(--surface)}
@media(max-width:760px){.calday{min-height:72px}.cpill{font-size:9.5px}}
.awayc{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--border);
  border-radius:7px;background:var(--surface-2)}
.awayc b{display:block;font-size:13px}
.awayc small{display:block;font-size:11.5px;color:var(--ink-3)}

/* ---------- who is free ---------- */
.freewrap{border:1px solid var(--border);border-radius:8px;background:var(--surface);
  box-shadow:var(--shadow);padding:12px;overflow-x:auto}
.freegrid{display:grid;grid-template-columns:132px repeat(var(--n),minmax(26px,1fr));gap:3px;min-width:560px}
.fcorner{}
.fhead{text-align:center;padding:3px 0 5px;font-size:10px;color:var(--ink-3);line-height:1.2}
.fhead b{display:block;font-size:10px;font-weight:700}
.fhead span{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.fhead.wk{opacity:.55}
.fhead.today b,.fhead.today span{color:var(--c1)}
.fname{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding-right:8px;min-width:0}
.fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcell{height:26px;border:0;border-radius:4px;cursor:pointer;padding:0}
.fcell.ok{background:color-mix(in srgb,var(--good) 20%,var(--surface-3))}
.fcell.trav{background:var(--c2)}
.fcell.out{background:var(--ink-3)}
.fcell.wk{background:var(--surface-3);opacity:.5;cursor:default}
.fcell:hover:not(.wk){outline:2px solid var(--c1);outline-offset:-1px}
.flegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-2)}
.flegend span{display:inline-flex;align-items:center;gap:6px}
.flegend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.flegend i.ok{background:color-mix(in srgb,var(--good) 20%,var(--surface-3))}
.flegend i.trav{background:var(--c2)}
.flegend i.out{background:var(--ink-3)}
.flegend i.wk{background:var(--surface-3)}

/* ---------- nudges on the navy header, and in a person's panel ---------- */
.headline .nudges{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.nudges{display:flex;flex-direction:column;gap:8px}
.nudge{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:7px;
  background:rgba(255,255,255,.08);border:1px solid rgba(116,191,235,.3);border-left:3px solid var(--sky)}
.nudge .nx{flex:1 1 auto;min-width:0}
.nudge .nx b{display:block;font-size:13.5px;font-weight:600;line-height:1.35;color:#fff}
.nudge .nx span{display:block;font-size:11.5px;color:var(--sky-soft);margin-top:2px}
.nudge.auto{border-left-color:var(--c4);background:rgba(237,161,0,.14);border-color:rgba(237,161,0,.4)}
.nudge.k-ask{border-left-color:var(--c2);background:rgba(235,104,52,.14);border-color:rgba(235,104,52,.38)}
.nbtn{flex:0 0 auto;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;
  border-radius:5px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.nbtn:hover{background:#fff;color:var(--navy)}
.nbtn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.nudge .nbtns{flex:0 0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.nbtn.ghost{background:transparent;border-color:rgba(255,255,255,.28);color:var(--sky-soft)}
.nbtn.ghost:hover{background:rgba(255,255,255,.14);color:#fff}
.panel .nbtn.ghost,.widget .nbtn.ghost{border-color:var(--border);color:var(--ink-2)}
.panel .nbtn.ghost:hover,.widget .nbtn.ghost:hover{background:var(--sunk);color:var(--ink)}
@media (max-width:620px){.nudge{flex-wrap:wrap}.nudge .nbtns{width:100%;justify-content:flex-end}}
/* the same list inside a white side panel reads the other way round */
.panel .nudge{background:var(--surface-2);border-color:var(--border);border-left-color:var(--c1)}
.panel .nudge .nx b{color:var(--ink)}
.panel .nudge .nx span{color:var(--ink-3)}
.panel .nbtn{border-color:var(--border-strong);background:var(--surface);color:var(--ink-2)}
.panel .nbtn:hover{background:var(--surface-3);color:var(--ink)}
@media(max-width:560px){.nudge{flex-wrap:wrap}.nbtn{width:100%}}
@media(max-width:900px){.wrow{grid-template-columns:repeat(2,minmax(0,1fr))}.wrow > .widget{grid-column:span 1!important}}
@media(max-width:620px){.wrow{grid-template-columns:1fr}.wrow > .widget{grid-column:span 1!important}}

/* ---------- a panel's own color and the bold style ---------- */
.widget{--pc:var(--border-strong)}
.widget.bold{border-color:color-mix(in srgb,var(--pc) 42%,var(--border))}
.widget.bold::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc);z-index:1}
.widget.bold > header{background:color-mix(in srgb,var(--pc) 9%,var(--surface));
  border-bottom-color:color-mix(in srgb,var(--pc) 24%,var(--rule));padding-top:3px}
.widget.bold > header h3{color:var(--pc);font-size:13px;letter-spacing:.05em}
.widget.bold > header .cnt{border-color:color-mix(in srgb,var(--pc) 35%,var(--border));color:var(--pc)}
.widget.bold > header .grip{color:var(--pc)}
.widget:not(.bold) > header .cw{stroke:var(--ink-3)}
.widget.bold > header .cw{stroke:var(--pc)}
/* One line, one height, whether or not this panel has a bar to show. It used
   to wrap the label onto a second line only when there was a bar, which made
   folded panels sitting side by side different heights. */
.wmeter{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:34px;flex-wrap:nowrap;
  background:color-mix(in srgb,var(--pc) 5%,var(--surface));border-bottom:1px solid var(--rule)}
.widget.shut .wmeter{border-bottom:0}
.wmtrack{flex:0 1 96px;min-width:48px;height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.wmtrack i{display:block;height:100%;border-radius:4px;background:var(--pc)}
.wmpct{font-size:11.5px;font-weight:700;color:var(--pc);font-variant-numeric:tabular-nums;flex:0 0 auto}
.wmlab{font-size:11.5px;color:var(--ink-2);flex:1 1 auto;min-width:0;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- the gear, and the sheet behind it ---------- */
.widget > header .wgear{display:flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;
  border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink-3);cursor:pointer;opacity:0}
.widget > header:hover .wgear,.widget > header .wgear:focus-visible{opacity:1}
.widget > header .wgear:hover{color:var(--c1);border-color:var(--border);background:var(--surface)}
.widget > header .wgear svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
@media(hover:none){.widget > header .wgear{opacity:.6}}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatches .sw{width:30px;height:30px;border-radius:6px;border:2px solid transparent;background:var(--pc);
  cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatches .sw.none{background:var(--surface-3);position:relative}
.swatches .sw.none::after{content:"";position:absolute;left:4px;right:4px;top:13px;height:2px;
  background:var(--ink-3);transform:rotate(-45deg);border-radius:1px}
.swatches .sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.swatches .sw:focus-visible{outline:2px solid var(--c1);outline-offset:2px}

/* ---------- where a dragged panel will land ---------- */
.dropmark{position:fixed;z-index:299;border-radius:2px;background:var(--c1);pointer-events:none;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 28%,transparent)}
.dropmark.wide{border-radius:2px}
.dropmark[hidden]{display:none}
.dropmark.cell{background:color-mix(in srgb,var(--c1) 16%,transparent);border:2px solid var(--c1);border-radius:7px}

/* ---------- my tasks on a calendar ---------- */
.tcal .calday{align-items:stretch;gap:3px;cursor:default}
.tcal .calday.drop{background:color-mix(in srgb,var(--c1) 10%,var(--surface))}
/* the quiet + that fills the rest of a day cell — only visible when wanted */
.tcal .calday{position:relative}
.tcal .dayadd{position:absolute;right:4px;top:3px;width:22px;height:22px;padding:0;border-radius:5px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-3);cursor:pointer;
  display:none;align-items:center;justify-content:center}
.tcal .dayadd svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.tcal .dayadd:hover{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .tcal .dayadd:hover{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tcal .dayadd:hover{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.tcal .calday:hover .dayadd, .tcal .dayadd:focus-visible{display:flex}
.tcal .calday.out .dayadd{display:none!important}
/* on a touch screen there is no hover, so it is always there but faint */
@media (pointer:coarse){ .tcal .dayadd{display:flex;opacity:.5} }
.tcal .tpill{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--tc,var(--cn));
  border-radius:3px;background:var(--surface-3);color:var(--ink);font:inherit;font-size:11px;font-weight:600;
  line-height:1.25;padding:3px 5px;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;touch-action:none}
.tcal .tpill:hover{background:var(--sky-wash)}
.tcal .tpill.late{background:var(--bad-soft);color:var(--bad)}
.tcal .tpill.hi::after{content:"!";float:right;font-weight:700;color:var(--warn)}
.tcal .tpill.done{opacity:.55;text-decoration:line-through;text-decoration-color:var(--border-strong)}
.tcal .cmore{cursor:pointer}
.tcbank{display:flex;flex-direction:column;gap:7px;border:1px dashed var(--border-strong);border-radius:7px;
  padding:10px 12px;background:var(--surface-2)}
.tcbank.drop{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 8%,var(--surface))}
.tcbank .tcb-h{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.tcbank .tcb-l{display:flex;flex-wrap:wrap;gap:6px}
.tcbank .tpill{display:inline-block;width:auto;max-width:230px;border:0;border-left:3px solid var(--tc,var(--cn));
  border-radius:3px;background:var(--surface-3);color:var(--ink);font:inherit;font-size:11.5px;font-weight:600;
  padding:4px 8px;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;touch-action:none}
.tcbank .tpill:hover{background:var(--sky-wash)}
.tcal-help{font-size:12px;color:var(--ink-3)}

/* ---------- time set aside ---------- */
.tcal .blkpill{display:flex;align-items:baseline;gap:5px;width:100%;text-align:left;border:0;
  border-left:3px solid var(--c7);border-radius:3px;background:color-mix(in srgb,var(--c7) 13%,var(--surface));
  color:var(--ink);font:inherit;font-size:11px;font-weight:600;line-height:1.25;padding:3px 5px;
  cursor:pointer;overflow:hidden;white-space:nowrap}
.tcal .blkpill .bt{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--c7)}
.tcal .blkpill .bn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tcal .blkpill:hover{background:color-mix(in srgb,var(--c7) 22%,var(--surface))}
.tcal .blkpill.pend{border-left-style:dashed}
.tcal .blkpill.going{opacity:.5;text-decoration:line-through}
.blklist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.blkrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.blkrow:last-child{border-bottom:0}
.blkrow:hover{background:var(--surface-2)}
.blkrow .bt{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--c7);font-variant-numeric:tabular-nums}
.blkrow .bn{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;overflow-wrap:anywhere}
/* the "not here?" row at the foot of a chooser */
.prow.askrow{margin-top:10px;border:1px dashed var(--border-strong);background:var(--surface-2)}
.prow.askrow .wrt b{color:var(--ink)}

/* ---------- a task row on a phone ----------
   The chips always wrapped onto their own line under the title, which pushed a
   single task to 107px — barely three of them on screen at once. Tighter
   padding, smaller chips and a single meta line give back about a third of it
   without losing anything. */
@media (max-width:620px){
  .rh2{padding:9px 12px;gap:4px 8px}
  .rh2 .t{flex:1 1 100%;font-size:13.5px;line-height:1.3}
  .rh2 .t small{font-size:11px;margin-top:1px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .rh2 .r{flex:1 1 100%;justify-content:flex-start;gap:5px;margin-top:1px}
  .rh2 .r .chip{font-size:10.5px;padding:0 6px;line-height:1.55}
  .rh2 .r .av.xs{width:18px;height:18px;font-size:8px}
  .rh2 .d{font-size:11.5px}
  .rgrp{padding:7px 12px;font-size:11px}
  .widget .wbody{padding:10px 12px}
  .wrap, main{--row-gap:10px}
  .view{gap:18px}
  .headline{padding:16px 16px}
  .headline .hl-say{font-size:16px}
  .tile{padding:10px 12px}
  .tile b{font-size:24px}
}
/* ---- a system card is dragged by the handle on its left ----
   The handle used to be invisible until hover AND sat underneath the icon, so
   there was nothing to find. It now has its own column, is always there, and
   darkens when the pointer is over it. */
.lcard{position:relative}
.lcard .lgrip{flex:0 0 auto;width:20px;height:30px;margin-left:-4px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:grab;
  border-radius:4px;opacity:.55;touch-action:none;transition:opacity .12s, background .12s}
.lcard .lgrip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.lcard:hover .lgrip{opacity:1}
.lcard .lgrip:hover,.lcard .lgrip:focus-visible{background:var(--surface-3);color:var(--ink);opacity:1}
.lcard .lgrip:active{cursor:grabbing}
.lcard.lifted{outline:2px solid var(--c1);outline-offset:2px;transform:scale(.98)}
.lcard.dragging{opacity:.45}
/* a finger needs a bigger target than a mouse */
@media (pointer:coarse){ .lcard .lgrip{width:30px;height:38px;opacity:.75} }
@media (prefers-reduced-motion:reduce){ .lcard .lgrip{transition:none} }

/* ---------- moving a panel, so you can tell it is happening ---------- */
/* held long enough to move: the panel lifts off the page */
.widget.lifted{transform:scale(.985);box-shadow:0 10px 26px rgba(6,32,47,.22);
  outline:2px solid var(--c1);outline-offset:2px;transition:transform .12s ease, box-shadow .12s ease}
:root[data-theme="dark"] .widget.lifted{box-shadow:0 10px 26px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .widget.lifted{box-shadow:0 10px 26px rgba(0,0,0,.5)}}
.widget.dragging{opacity:.45}
/* the grip itself lights up the instant the hold registers */
.whead .grip.armed, .whead.armed .grip{color:var(--c1)}
.whead.armed{background:var(--sky-wash);border-radius:6px}
/* while something is in flight, every other panel shows it will take a drop */
body.moving-panel .widget:not(.dragging){outline:1px dashed var(--border-strong);outline-offset:-1px}
/* where it landed */
@keyframes justmoved{0%{box-shadow:0 0 0 3px var(--c1)}100%{box-shadow:0 0 0 3px transparent}}
.widget.justmoved{animation:justmoved 1.1s ease-out}
@media (prefers-reduced-motion:reduce){
  .widget.lifted{transition:none} .widget.justmoved{animation:none;outline:2px solid var(--c1)}
}
/* a fat, unmissable drop marker on a touch screen */
@media (pointer:coarse){
  .dropmark{box-shadow:0 0 0 2px var(--surface)}
  .dropmark:not(.wide):not(.cell){width:6px!important}
  .dropmark.wide{height:6px!important}
}

/* ---------- a panel's own figure tiles (sponsorship prospects) ---------- */
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(132px,100%),1fr));gap:10px}
.tile2{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:11px 13px}
.tile2 b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.tile2 span{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-top:2px}
.tile2 small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.tile2.warn b{color:var(--warn)}
.tile2.bad b{color:var(--bad)}
.widget > header{display:flex;align-items:center;gap:8px;padding:0 14px 0 14px;border-bottom:1px solid var(--rule);background:var(--surface-2);min-height:42px}
.widget.shut > header{border-bottom:0}
.widget > header .tog{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0;background:none;border:0;
  padding:11px 0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.widget > header .tog:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.widget > header .tog:hover h3{color:var(--c1);text-decoration:underline;text-underline-offset:3px}
.widget > header .cwb{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:24px;padding:0;margin:0;background:none;border:0;cursor:pointer;color:var(--ink-3)}
.widget > header .cwb:hover{color:var(--c1)}
.widget > header .cwb:focus-visible{outline:2px solid var(--c1);outline-offset:-2px;border-radius:4px}
.widget > header .cwb .cw{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.widget:not(.shut) > header .cwb .cw{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.widget > header .cwb .cw{transition:none}}
/* a panel shown on its own in the rail: same body, room to breathe */
.pb.wpanelbody{display:flex;flex-direction:column;gap:12px}
.widget > header h3{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
