  const when = n===null? '' : n<0? 'That one has been.' : n===0? 'That is today.'
    : n===1? 'That is tomorrow.' : 'That is in '+n+' days.';
  if(!items.length) say.innerHTML = when+' <em>Nothing on the agenda yet.</em>';
  else if(!open.length) say.innerHTML = when+' <em>All '+items.length+' covered.</em>';
  else say.innerHTML = when+' <em>'+open.length+(open.length===1?' thing':' things')+'</em> to get through, about '+mins+' minutes’ worth.';
  hl.appendChild(say);

  const clash=mtgClash(sel);
  if(clash){ const c=el('div','hl-occs'); const r=el('div','hl-occ '+(clash.kind==='holiday'?'holiday':'half'));
    const tx=el('span','ot');
    tx.appendChild(el('b',null, clash.kind==='holiday'? clash.t+'.' : 'Thin on the ground.'));
    tx.appendChild(document.createTextNode(clash.kind==='holiday'
      ? ' The office is shut that day — this one will need moving.'
      : ' '+clash.t+' that day.'));
    r.appendChild(tx); c.appendChild(r); hl.appendChild(c); }

  const tl=el('div','tiles');
  const mk=(v,lab2,sub,cls)=>{ const t=el('div','tile'+(cls?' '+cls:''));
    t.appendChild(el('b',null,String(v))); t.appendChild(el('span',null,lab2));
    if(sub) t.appendChild(el('small',null,sub)); return t; };
  tl.appendChild(mk(open.length,'To Cover', open.length?'still to talk about':'nothing waiting', ''));
  tl.appendChild(mk(mins+'m','Rough Length', mins>MTG.mins? 'longer than the hour':'inside the hour', mins>MTG.mins?'warn':''));
  tl.appendChild(mk(items.filter(x=>x.done).length,'Covered','ticked off',''));
  tl.appendChild(mk(items.filter(x=>x.from).length,'Carried Over','from a previous meeting', items.filter(x=>x.from).length?'warn':''));
  hl.appendChild(tl);
  root.appendChild(hl);

  /* the list itself */
  const list=el('div');
  list.appendChild(el('h2','sect-t','The Agenda'));
  if(!items.length){
    list.appendChild(emptyBox('Nothing on this agenda yet.',
      'Click Put Something On. Anyone on the team can add to it, any time between meetings.'));
  } else {
    const rows=el('div','rows');
    items.slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0) || (a.ord||0)-(b.ord||0)).forEach(x=>rows.appendChild(agRow(x, sel)));
    list.appendChild(rows);
  }

  /* things the page already knows are worth raising */
  if(isNext){

    if(sug.length){

      w.appendChild(el('h2','sect-t','Worth Raising'));
      w.appendChild(el('p','note','Team HQ spotted these. Clicking one puts it on the agenda — it does not add itself.'));
      const g=el('div','rows');
      sug.forEach(s2=>{
        const row=el('div','row'); const h=el('button','rh2'); h.type='button';
        const t=el('span','t'); t.appendChild(document.createTextNode(s2.t));
        t.appendChild(el('small',null,s2.why)); h.appendChild(t);
        const r=el('span','r');
        r.appendChild(el('span','chip '+(s2.bad?'ch-od':'ch-soon'), s2.tag));
        r.appendChild(el('span','chip ch-ns','Put It On'));
        h.appendChild(r);

        row.appendChild(h); g.appendChild(row);
      });
      w.appendChild(g); root.appendChild(w);
    }
  }

  /* after the meeting */
  if(!isNext && items.length){
    const w=el('div');
    w.appendChild(el('h2','sect-t','What Was Said'));
    const g=el('div','rows');
    items.filter(x=>x.outcome).forEach(x=>{
      const row=el('div','row'); const h=el('div','rh2'); h.style.cursor='default';
      const t=el('span','t'); t.appendChild(document.createTextNode(x.t));
      t.appendChild(el('small',null,x.outcome)); h.appendChild(t); row.appendChild(h); g.appendChild(row);
    });
    if(!g.children.length) g.appendChild(el('div','empty','Nothing was written down for this one.'));
    w.appendChild(g); root.appendChild(w);
  }
}

function agRow(x, mtg){
  const row=el('div','row');
  const h=el('button','rh2'+(x.done?' done':'')); h.type='button';
  const t=el('span','t'); t.appendChild(document.createTextNode(x.t));
  const bits=[];
  if(x.who) bits.push(pname(x.who));
  bits.push((x.mins||5)+' min');
  if(x.from) bits.push('carried from '+fmtD(x.from));
  if(x.notes) bits.push(x.notes);
  t.appendChild(el('small',null, bits.join(' · ')));
  h.appendChild(t);
  const r=el('span','r');
  if(x.done) r.appendChild(el('span','chip ch-dn','Covered'));
  if(x.from) r.appendChild(el('span','chip ch-warn','Carried Over'));
  r.appendChild(el('span','chip ch-ns', x.kind||'Discuss'));
  if(x.who) r.appendChild(avatar(x.who,'xs'));
  h.appendChild(r);
  h.addEventListener('click', ()=> editAgenda(x, mtg));
  row.appendChild(h);
  return row;
}

/* what the page already knows is worth a mention */
function agSuggest(mtg){
  const already = agendaFor(mtg).map(x=>norm(x.t));
  const out=[];
  const late = openTasks().filter(t=>{const n=days(t.due); return n!==null && n<-3;});
  if(late.length) out.push({t:'Tasks that are past due', tag:late.length+' late', bad:1, kind:'Decide',
    why:late.length+' across the team are more than three days past their date.'});
  const ov = overlaps();
  if(ov.length) out.push({t:'Two people in the same part', tag:ov.length+' to check', kind:'Discuss',
    why:ov.slice(0,3).map(o=>o.title).filter(Boolean).join('; ')+(ov.length>3?'; and more':'')});
  const soon = S.dates.filter(d=>{const n=days(dOf(d)); return n!==null && n>=0 && n<=21 && d.pin;});
  if(soon.length) out.push({t:'Dates coming up in the next three weeks', tag:soon.length+' dates', kind:'Heads Up',
    why:soon.slice(0,3).map(d=>d.t).join(', ')+(soon.length>3?' and more':'')});
  const stuck = openTasks().filter(t=>t.s==='Blocked');
  if(stuck.length) out.push({t:'Work that is blocked', tag:stuck.length+' blocked', bad:1, kind:'Decide',
    why:stuck.slice(0,3).map(t=>t.t).join(', ')+(stuck.length>3?' and more':'')});
  const noOne = S.rocks.filter(r=>r.status==='Active' && !r.lead);
  if(noOne.length) out.push({t:'Team projects with nobody accountable', tag:noOne.length, kind:'Decide',
    why:noOne.map(r=>r.name).join(', ')});
  return out.filter(s=> already.indexOf(norm(s.t))<0);
}

/* ---- the editor ---- */
function editAgenda(x, mtg){
  const isNew = !x || !x.id;
  const d = x ? JSON.parse(JSON.stringify(x)) : {t:'', kind:'Discuss', mins:5, who:S.me||'', notes:'', outcome:'', done:0};
  /* something new goes on the next meeting by default, whichever one you were
     looking at — the picker below is there to put it somewhere else */
  d.mtg = d.id ? (d.mtg || mtg) : nextMtg();
  const openedAs = snapOf('agenda', d.id);
  panel(isNew?'Put Something On the Agenda':'Agenda Item', fmtD(d.mtg,1), body=>{
    const g=el('div','fields');
    const fT=field(g,'What Do You Want to Raise?', inp('text', d.t, 'In a few words'), 'w4');
    const fK=field(g,'What Kind?', sel2(AG_KINDS.map(k=>({v:k,n:k})), d.kind));
    const fM=field(g,'How Long?', sel2([5,10,15,20,30].map(n=>({v:String(n),n:n+' minutes'})), String(d.mins||5)));
    const fW=field(g,'Who Is Raising It?', sel(peopleOpts(), d.who, 'Anyone'));
    const fG=field(g,'Which Meeting?', sel2(mtgSeries(5).concat(d.mtg && mtgSeries(5).indexOf(d.mtg)<0?[d.mtg]:[])
      .map(i=>({v:i,n:fmtD(i,1)})), d.mtg));
    const fN=field(g,'Anything to Read First?', ta(d.notes||'', 'Background, a link, what you need from everyone', 3), 'w4');
    body.appendChild(g);

    if(!isNew){
      body.appendChild(el('h3','sect-t','After You Have Talked About It'));
      const g2=el('div','fields');
      const fO=field(g2,'What Was Decided?', ta(d.outcome||'', 'What came out of it, and who is doing what', 3), 'w4');
      const cw=el('div','f w4');
      const cl=el('label','chkrow'); const cb=el('input'); cb.type='checkbox'; cb.checked=!!d.done;
      cl.appendChild(cb); cl.appendChild(el('span',null,'Covered — tick this once it has been talked about'));
      cw.appendChild(cl); g2.appendChild(cw);
      body.appendChild(g2);
      d.__fO=fO; d.__cb=cb;
    }

    const acts=el('div','rowacts');
    if(!isNew){
      const carry=el('button','btn ghost','Carry It to the Next One'); carry.type='button';
      carry.addEventListener('click', async ()=>{
        const to=afterMtg(d.mtg);
        await put('agenda', Object.assign({}, d, {mtg:to, from:d.mtg, done:0, __fO:undefined, __cb:undefined}));
        closePanel(); toast('Moved to '+fmtD(to)+'.');
      });
      acts.appendChild(carry);
      const del=el('button','btn danger','Delete'); del.type='button';
      del.addEventListener('click', ()=>{ if(del.dataset.c){ closePanel(); dropUndo('agenda', d.id, 'Agenda item'); }
        else { del.dataset.c='1'; del.textContent='Click Again to Delete'; } });
      acts.appendChild(del);
    }
    acts.appendChild(el('span','spacer'));
    const cancel=el('button','btn ghost','Cancel'); cancel.type='button'; cancel.addEventListener('click',closePanel);
    const save=el('button','btn','Save'); save.type='button';
    const ALAB={t:'the wording', kind:'the kind', mins:'how long', who:'who is raising it',
      mtg:'which meeting', notes:'the background', outcome:'what was decided', done:'whether it is covered'};
    save.addEventListener('click', async ()=>{
      if(!fT.value.trim()){ fT.focus(); toast('Say what you want to raise first.'); return; }
      d.t=fT.value.trim(); d.kind=fK.value; d.mins=+fM.value; d.who=fW.value; d.mtg=fG.value;
      d.notes=fN.value.trim();
      if(d.__fO){ d.outcome=d.__fO.value.trim(); d.done=d.__cb.checked?1:0; }
      delete d.__fO; delete d.__cb;
      if(isNew){ d.at=Date.now(); d.ord=(agendaFor(d.mtg).length+1)*10; }
      const commit=async ()=>{ await put('agenda', d); closePanel();
        toast(isNew? 'On the agenda for '+fmtD(d.mtg)+'.' : 'Saved.'); S.mtgPick=d.mtg; };
      if(movedUnderYou('agenda', d.id, openedAs)) return askOverwrite('agenda', d.id, openedAs, ALAB, commit);
      await commit();
    });
    acts.appendChild(cancel); acts.appendChild(save);
    body.appendChild(acts);
  });
}
/* a plain value/name select, where the options are not people */

          people:P, teamProjects:R, openTasks:T, keyDates:D, possibleOverlaps:O, parkedNotes:N, expenses:X, plans:PL};

function mdLite(s){
  const lines = String(s||'').split('\n');
  const frag=document.createDocumentFragment();
  let ul=null;
  const inline = (txt, into)=>{
    const parts = String(txt).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
    parts.forEach(p=>{
      if(/^\*\*[^*]+\*\*$/.test(p)) into.appendChild(el('strong',null,p.slice(2,-2)));
      else if(/^`[^`]+`$/.test(p)) into.appendChild(el('code',null,p.slice(1,-1)));
      else if(p) into.appendChild(document.createTextNode(p));
    });
  };
  lines.forEach(ln=>{
    const t=ln.trim();
    if(/^[-*•]\s+/.test(t)){
      if(!ul){ ul=el('ul'); frag.appendChild(ul); }
      const li=el('li'); inline(t.replace(/^[-*•]\s+/,''), li); ul.appendChild(li); return;
    }
    ul=null;
    if(!t) return;
    if(/^#{1,4}\s+/.test(t)){ const h=el('h3'); inline(t.replace(/^#{1,4}\s+/,''), h); frag.appendChild(h); return; }
    const p=el('p'); inline(t, p); frag.appendChild(p);
  });
  return frag;
}

/* ============ PLANS ============
   A plan is a document someone works through over time — an onboarding plan, a
   handover, a project checklist. It has sections (a phase like Days 1–30, or a
   plain list like Shared Inboxes) and items people check off. Items can sit on
   somebody's board as a real task; when that task is done, so is the item.

   Shared: the plan (`plans`) and every item (`planitems`, one row each, so two
   people ticking things at once never overwrite each other).
   Private: a manager's notes on how it is going, kept under data/users/<id>/,
   which nobody else can read — not the person the plan is about, not leadership. */
const ISTAT = ['Not Started','In Progress','Done','Not Needed'];
const PLAN_KINDS = ['Onboarding','Membership','Handover','Project','Checklist','Other'];
/* the kinds on offer: the standard ones, any the team has added, and any a
   plan already uses — with Other kept at the end */
function planKinds(){
  const out=[], seen={};
  const add=k=>{ k=String(k||'').trim(); if(!k) return; const n=k.toLowerCase(); if(seen[n]) return; seen[n]=1; out.push(k); };
  PLAN_KINDS.filter(k=>k!=='Other').forEach(add);
  (S.plankinds||[]).slice().sort((a,b)=>String(a.n).localeCompare(String(b.n))).forEach(x=>add(x.n));
  (S.plans||[]).forEach(p=>add(p.kind));
  add('Other');
  return out;
}
/* a row of squared buttons for a kind, with a way to add a new one.

function dateKinds(){
  const out=[], seen={};
  const add=k=>{ k=String(k||'').trim(); if(!k) return; const n=k.toLowerCase(); if(seen[n]) return; seen[n]=1; out.push(k); };
  DKIND.forEach(add);
  (S.datekinds||[]).slice().sort((a,b)=>String(a.n).localeCompare(String(b.n))).forEach(x=>add(x.n));
  (S.dates||[]).forEach(d=>add(d.k));
  return out;
}
function dateKindField(g, cur){ return kindPicker(g, cur, {list:dateKinds, col:'datekinds', fallback:'Deadline'}); }
const PLAN_STATES = ['Active','Draft','Done'];
const HOW_OPTS = [{v:'ahead',n:'Ahead'},{v:'ontrack',n:'On Track'},{v:'support',n:'Needs Support'}];
function planOf(id){ return (S.plans||[]).find(p=>p.id===id) || null; }
function planItems(pid){ return (S.planitems||[]).filter(i=>i.plan===pid).sort((a,b)=>(a.ord||0)-(b.ord||0)); }
function planSecs(p){ return (p && p.secs) || []; }
function planSec(p, sid){ return planSecs(p).find(s=>s.id===sid) || null; }
function hasNum(v){ return v!==null && v!==undefined && v!=='' && !isNaN(+v); }

/* Day 1 is the start date. A working-day count skips weekends and MISMO holidays. */
function addWorkdays(d0, n){
  const d=new Date(d0); d.setHours(0,0,0,0);
  while(offDay(d)) d.setDate(d.getDate()+1);
  let k=1; while(k<n){ d.setDate(d.getDate()+1); if(!offDay(d)) k++; }
  return d;
}
/* When an item is due: a date typed on the item wins; otherwise its own day
   number; otherwise the end of its section. Day 0 means "before Day 1". */
function itemDayNo(it, p){
  if(hasNum(it.day)) return +it.day;
  const s=planSec(p, it.sec);
  return (s && hasNum(s.to)) ? +s.to : null;
}
function itemDue(it, p){
  if(it.date) return it.date;
  const st=parseD(p && p.start); if(!st) return '';
  if(hasNum(it.wd)) return isoOf(addWorkdays(st, +it.wd));
  const n=itemDayNo(it, p); if(n===null) return '';
  const d=new Date(st); d.setDate(d.getDate() + (n<=0 ? -1 : n-1));
  return isoOf(d);
}
function itemDueLabel(it, p){
  if(it.date) return '';
  if(hasNum(it.wd)) return 'Working Day '+it.wd;
  const n=itemDayNo(it, p); if(n===null) return '';
  return n<=0 ? 'Before Day 1' : 'Day '+n;
}
/* a task on the board, linked to an item, decides whether the item is done */
function linkedTask(it){ return it && it.task ? S.tasks.find(t=>t.id===it.task) || null : null; }
function itemStatus(it){
  if(it.s==='Not Needed') return 'Not Needed';
  const t=linkedTask(it);
  if(t){ if(t.s==='Done') return 'Done';
    if(t.s==='Not Started') return it.s==='In Progress' ? 'In Progress' : 'Not Started';
    return 'In Progress'; }
  return it.s || 'Not Started';
}
function itemDone(it){ return itemStatus(it)==='Done'; }
function itemCounts(it){ return itemStatus(it)!=='Not Needed'; }
function itemBehind(it, p){
  if(!itemCounts(it) || itemDone(it)) return false;
  const n=days(itemDue(it,p)); return n!==null && n<0;
}
function itemSoon(it, p, win){
  if(!itemCounts(it) || itemDone(it)) return false;
  const n=days(itemDue(it,p)); return n!==null && n>=0 && n<=(win||14);
}
function planDay(p){ const st=parseD(p && p.start); if(!st) return null; return Math.round((today()-st)/86400000)+1; }
function planLen(p){ let m=0; planSecs(p).forEach(s=>{ if(hasNum(s.to) && +s.to>m) m=+s.to; }); return m||null; }
function planStats(p, list){
  const items=(list || planItems(p.id)).filter(itemCounts);
  const done=items.filter(itemDone).length;
  return { total:items.length, done:done,
    behind: items.filter(i=>itemBehind(i,p)).length,
    prog:   items.filter(i=>!itemDone(i) && itemStatus(i)==='In Progress').length,
    soon:   items.filter(i=>itemSoon(i,p)).length,
    pct: items.length ? Math.round(done/items.length*100) : 0 };
}
/* the phase the calendar says we are in: the narrowest window holding today */
function curSec(p){
  const n=planDay(p); if(n===null) return null;
  const ss=planSecs(p).filter(s=>hasNum(s.from));
  if(n<1) return ss.find(s=> hasNum(s.to) && +s.to<=0) || null;
  const hit=ss.filter(s=> +s.from<=n && (!hasNum(s.to) || n<=+s.to) && (!hasNum(s.to) || +s.to>0))
    .sort((a,b)=> ((hasNum(a.to)?+a.to:9999)-+a.from) - ((hasNum(b.to)?+b.to:9999)-+b.from));
  return hit[0] || null;
}
function secWindow(s){
  if(!hasNum(s.from) && !hasNum(s.to)) return '';
  if(hasNum(s.to) && +s.to<=0) return 'Before Day 1';
  if(!hasNum(s.to)) return 'From Day '+s.from;
  if(+s.from===+s.to) return 'Day '+s.from;
  return 'Days '+s.from+'–'+s.to;
}
function planDayLabel(p){
  const n=planDay(p), len=planLen(p);
  if(n===null) return 'No start date yet';
  if(n<1){ const k=1-n; return 'Starts in '+k+(k===1?' day':' days')+' · '+fmtD(p.start); }
  if(len && n<=len) return 'Day '+n+' of '+len;
  return 'Day '+n+(len? ' · past Day '+len : '');
}
function firstName(id){ const x=person(id); return x? x.name.split(' ')[0] : ''; }

/* ---- saving ---- */
async function saveItem(it, patch){
  const o=Object.assign({}, it, patch||{});
  await put('planitems', o);
  return o;
}
/* tick or untick, keeping a linked task in step */
async function setItemStatus(it, s){
  const patch={s:s};
  if(s==='Done'){ patch.doneAt=Date.now(); patch.doneBy=S.me||''; }
  else { patch.doneAt=0; patch.doneBy=''; }
  const t=linkedTask(it);
  if(t && s!=='Not Needed'){
    const ts = s==='Done' ? 'Done' : s==='In Progress' ? 'In Progress' : 'Not Started';
    if(t.s!==ts) await put('tasks', Object.assign({}, t, {s:ts}));
  }
  await saveItem(it, patch);
}
function nextItemOrd(pid, sid){
  const xs=planItems(pid).filter(i=>!sid || i.sec===sid);
  return (xs.length ? Math.max.apply(null, xs.map(i=>+i.ord||0)) : 0) + 10;
}

/* ---- private notes, readable only by the person who wrote them ---- */
let PNOTES = null;      /* [{id, plan, d, how, t, at}] */
/* one load, shared: a second caller waits for the first instead of seeing an
   empty list and saving over the notes that were still on their way */
let PNOTES_P = null;
function loadPlanNotes(){
  if(PNOTES) return Promise.resolve(PNOTES);
  if(PNOTES_P) return PNOTES_P;
  if(!S.db || !S.uid) return Promise.resolve([]);
  PNOTES_P = (async ()=>{
    let got=[];
    try{ const snap=await S.db.doc('data/users/'+S.uid+'/plannotes').get();
      if(snap.exists){ const d=snap.data()||{}; got = JSON.parse(JSON.stringify(d.notes||[])); }
      PNOTES=got;
    }catch(e){ PNOTES_P=null; throw e; }
    return PNOTES;
  })();
  return PNOTES_P;
}
async function savePlanNotes(){
  if(!S.db || !S.uid || !PNOTES) return false;
  try{ await S.db.doc('data/users/'+S.uid+'/plannotes').set({notes:PNOTES||[]}); return true; }
  catch(e){ toast('Could not save that note.'); return false; }
}

/* ---- the view ----
   Rows edit in place, so a refresh that lands while somebody is typing waits
   until they leave the field rather than wiping what they typed. */
function planBusy(root){
  if(S.planForce) return false;
  const a=document.activeElement;
  if(a && root.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='checkbox'){ S.planDirty=1; return true; }
  return false;
}
function vPlans(root){
  if(planBusy(root)) return;
  S.planForce=0;
  root.textContent='';
  if(!S.openSecs) S.openSecs={};
  if(!S.openItems) S.openItems={};
  const p = S.planOpen ? planOf(S.planOpen) : null;
  if(S.planOpen && !p) S.planOpen=null;
  if(p) planView(root, p); else planList(root);
  if(S.planQA){ const q=root.querySelector('input[data-qa="'+S.planQA+'"]'); S.planQA=null; if(q) q.focus(); }
  if(S.planScroll){ const r=root.querySelector('[data-iid="'+S.planScroll+'"]'); S.planScroll=null;
    if(r) setTimeout(()=>{ try{ r.scrollIntoView({block:'center'}); }catch(e){} }, 40); }
}

function planHeadline(p){
  const st=planStats(p); const n=planDay(p); const cur=curSec(p);
  const hl=el('div','headline');
  hl.appendChild(el('div','hl-date', [p.who? pname(p.who) : '', p.kind||'Plan', planDayLabel(p)].filter(Boolean).join(' · ')));

  if(n!==null && n<1){
    const k=1-n;
    let s=(who1? who1+' starts' : 'This plan starts')+' in '+k+(k===1?' day':' days')+'.';
    if(cur){ const cs=planStats(p, planItems(p.id).filter(i=>i.sec===cur.id));
      s+=' <em>'+cs.done+' of '+cs.total+'</em> '+esc(cur.name.replace(/\s*\(.*\)\s*$/,''))+' items are done.'; }
    say.innerHTML=s;
  } else if(st.behind){
    say.innerHTML=(n!==null? 'Day '+n+'. ' : '')+'<em class="hl-late">'+st.behind+(st.behind===1?' item is':' items are')+' behind</em> — '+st.done+' of '+st.total+' done overall.';
  } else {

  tl.appendChild(mk(st.pct+'%','Done', st.done+' of '+st.total+' items'));

function planView(root, p){

function secBlock(p, s, isNow){
  const key=p.id+':'+s.id;
  const items=planItems(p.id).filter(i=>i.sec===s.id);
  const st=planStats(p, items);
  const d=el('details','psec'+(isNow?' now':''));
  d.open=!!S.openSecs[key];
  d.addEventListener('toggle', ()=>{ S.openSecs[key]=d.open; });
  const sm=el('summary');
  const c=document.createElementNS('http://www.w3.org/2000/svg','svg');
  c.setAttribute('class','caret'); c.setAttribute('viewBox','0 0 24 24');
  const pth=document.createElementNS('http://www.w3.org/2000/svg','path'); pth.setAttribute('d','M9 6l6 6-6 6'); c.appendChild(pth);
  sm.appendChild(c);
  const tt=el('span','pst'); tt.appendChild(document.createTextNode(s.name||'Section'));
  const win=secWindow(s);
  const bits=[]; if(win) bits.push(win);
  if(win && p.start && hasNum(s.to) && +s.to>0){ const dd=itemDue({sec:s.id}, p); if(dd) bits.push('by '+fmtD(dd)); }
  if(win && p.start && hasNum(s.to) && +s.to<=0){ bits.push('by '+fmtD(itemDue({sec:s.id}, p))); }
  if(bits.length) tt.appendChild(el('small',null,bits.join(' · ')));
  sm.appendChild(tt);
  const r=el('span','psr');
  if(isNow) r.appendChild(el('span','chip ch-hi','Now'));
  if(st.behind) r.appendChild(el('span','chip ch-od', st.behind+' Behind'));
  const mb=el('span','minibar'); const mi=el('i'); mi.style.width=st.pct+'%'; mb.appendChild(mi); r.appendChild(mb);
  r.appendChild(el('span','pcount', st.done+' of '+st.total));
  sm.appendChild(r);
  d.appendChild(sm);

  const body=el('div','psecbody');
  if(s.note) body.appendChild(el('div','psecnote', s.note));
  const plain=items.filter(i=>!i.crit), crit=items.filter(i=>i.crit);
  let g=null;
  plain.forEach(it=>{
    if((it.grp||'')!==g){ g=it.grp||''; if(g) body.appendChild(el('div','rgrp', g)); }
    body.appendChild(itemRow(p, s, it));
  });
  if(crit.length){
    body.appendChild(el('div','rgrp','By the End of This Phase'));
    crit.forEach(it=> body.appendChild(itemRow(p, s, it)));
  }
  if(!items.length) body.appendChild(el('div','empty','Nothing in this section yet.'));

  const qa=el('div','pqa');
  const w=el('div','quickadd');
  w.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  const i=inp('text','','Add an item and press Enter…'); i.dataset.qa=s.id;
  w.appendChild(i); qa.appendChild(w);
  i.addEventListener('keydown', async e=>{
    if(e.key!=='Enter') return;
    const v=i.value.trim(); if(!v) return; e.preventDefault();
    S.planForce=1; S.planQA=s.id;
    await put('planitems', {plan:p.id, sec:s.id, t:v, who:p.who||'', s:'Not Started', ord:nextItemOrd(p.id, s.id), at:Date.now(), by:S.me||''});
  });
  const fb=el('button','btn ghost sm','Add From the Board'); fb.type='button';
  fb.title='Pull tasks already on someone’s board into this section';
  fb.addEventListener('click', ()=> pullFromBoard(p, s));
  qa.appendChild(fb);
  body.appendChild(qa);
  d.appendChild(body);
  return d;
}

/* one item: click the row and it opens in the right rail */
function railItem(){ const e=PSTACK[PSTACK.length-1]; return (panelOpen() && e && e.iid) || ''; }
function itemRow(p, s, it){
  const stt=itemStatus(it), done=stt==='Done', na=stt==='Not Needed';
  const row=el('div','pirow'+(railItem()===it.id?' open':'')); row.dataset.iid=it.id;
  const h=el('div','pih'+(done||na?' done':'')); h.tabIndex=0; h.setAttribute('role','button');
  h.title='Open this item';
  const ck=el('button','pchk'+(done?' on': na?' na' : stt==='In Progress'?' half':'')); ck.type='button';
  ck.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  ck.title = done ? 'Done — click to untick' : (s.doneLabel ? 'Tick when: '+s.doneLabel : 'Tick it off');
  ck.setAttribute('aria-label', ck.title);
  ck.addEventListener('click', async e=>{ e.stopPropagation(); await setItemStatus(it, done? 'Not Started' : 'Done'); repaintItem(it.id); });
  h.appendChild(ck);
  const tx=el('span','pt'); tx.appendChild(el('span',null,it.t||'(untitled)'));
  const meta=[];
  (s.cols||[]).forEach(c=>{
    const v=(it.x||{})[c.k];
    if(c.type==='check'){ if(v) meta.push(c.n+' ✓'); return; }
    if(c.type==='person'){ if(v) meta.push(c.n+': '+pname(v)); return; }
    if(v) meta.push(c.n+': '+v);
  });
  if(it.note) meta.push(it.note);
  if(meta.length) tx.appendChild(el('small',null,meta.join(' · ')));
  h.appendChild(tx);
  const r=el('span','pr');
  const t=linkedTask(it);
  if(t) r.appendChild(el('span','chip ch-ip','On '+(firstName(t.o)||'the')+(t.o?'’s':'')+' Board'));
  if(na) r.appendChild(el('span','chip ch-out','Not Needed'));
  else if(done) r.appendChild(el('span','chip ch-dn', it.doneAt? 'Done '+new Date(it.doneAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : 'Done'));
  else { if(stt==='In Progress') r.appendChild(el('span','chip ch-ip','In Progress'));
    const dc=dueChip(itemDue(it,p)); if(dc) r.appendChild(dc); }
  if(it.who) r.appendChild(avatar(it.who,'xs'));
  h.appendChild(r);
  const go=()=> itemPanel(p.id, it.id);
  h.addEventListener('click', go);
  h.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ if(e.target===h){ e.preventDefault(); go(); } } });
  row.appendChild(h);
  return row;
}

/* the item in the right rail — opening another item swaps it rather than stacking */
function itemPanel(pid, iid){
  const fresh=()=> (S.planitems||[]).find(x=>x.id===iid) || null;
  const it0=fresh(), p0=planOf(pid); if(!it0 || !p0) return;
  const top=PSTACK[PSTACK.length-1];
  if(panelOpen() && top && top.iid) PSTACK.pop();
  const s0=planSec(p0, it0.sec);
  panel(it0.t||'Plan Item', [p0.title, s0 && s0.name].filter(Boolean).join(' · '), body=>{
    const it=fresh(), p=planOf(pid);
    if(!it || !p){ body.appendChild(emptyBox('This item is gone.','Someone may have deleted it.')); return; }
    itemBody(p, planSec(p, it.sec) || {}, it, body);
  }, 'the item');
  PSTACK[PSTACK.length-1].iid=iid;
  markOpenRow();
}
function markOpenRow(){ const id=railItem();
  $$('.pirow[data-iid]').forEach(r=> r.classList.toggle('open', !!id && r.dataset.iid===id)); }
/* rebuild the rail after a change that alters what it shows */
function repaintItem(iid){
  const e=PSTACK[PSTACK.length-1]; if(!panelOpen() || !e || e.iid!==iid) return;
  const it=(S.planitems||[]).find(x=>x.id===iid);

function itemBody(p, s, it, b){
  const iid=it.id;
  const cur=()=> (S.planitems||[]).find(x=>x.id===iid) || it;
  const save=patch=> saveItem(cur(), patch);
  b.appendChild(el('p','note','Changes save as you go.'));
  const g=el('div','fields');
  const fT=field(g,'What It Is', inp('text', it.t||''), 'w4');
  fT.addEventListener('change', async ()=>{ const v=fT.value.trim(); if(v && v!==cur().t){ await save({t:v});
    const e=PSTACK[PSTACK.length-1]; if(e && e.iid===iid){ e.title=v; $('#panel-t').textContent=v; } } });
  const sw=el('div','f w4'); sw.appendChild(el('span',null,'Where It Stands'));
  sw.appendChild(btnRow(ISTAT.map(x=>({v:x,n:x})), itemStatus(it), 'tiny', async v=>{ await setItemStatus(cur(), v); repaintItem(iid); }));
  g.appendChild(sw);

  fW.addEventListener('change', ()=> save({who:fW.value}));
  const fS=field(g,'Section', sel2(planSecs(p).map(x=>({v:x.id,n:x.name})), it.sec), 'w2');
  fS.addEventListener('change', async ()=>{ await save({sec:fS.value, ord:nextItemOrd(p.id, fS.value), grp:'', crit:0});
    S.openSecs[p.id+':'+fS.value]=true; repaintItem(iid); });
  const due=itemDue(it,p), lab=itemDueLabel(it,p);
  const fD=field(g,'Target Date', inp('date', due), 'w2');
  fD.addEventListener('change', async ()=>{ await save({date:fD.value}); repaintItem(iid); });
  const hint=el('span','fhint');
  if(it.date && (hasNum(it.wd) || itemDayNo(it,p)!==null)){
    hint.appendChild(document.createTextNode('Set by hand. '));

    back.addEventListener('click', async ()=>{ await save({date:''}); repaintItem(iid); });
    hint.appendChild(back);
  } else hint.textContent = lab ? 'From the plan: '+lab+(p.start?'':' — add a start date to the plan to turn it into a date') : 'No date on this one. Pick one if it needs it.';
  fD.parentNode.appendChild(hint);
  (s.cols||[]).forEach(c=>{
    const v0=(it.x||{})[c.k];
    const patch = v=>{ const x=Object.assign({}, cur().x||{}); x[c.k]=v; save({x:x}); };

    }
    if(c.type==='person'){
      const f=field(g, c.n, sel(peopleOpts(), v0||'', 'Nobody Yet'), 'w2');
      f.addEventListener('change', ()=> patch(f.value)); return;
    }
    const f=field(g, c.n, inp('text', v0||''), 'w2');
    f.addEventListener('change', ()=> patch(f.value.trim()));
  });
  const fN=field(g,'Notes', ta(it.note||'', 'Anything worth knowing about this one', 3), 'w4');
  fN.addEventListener('change', ()=> save({note:fN.value.trim()}));
  b.appendChild(g);

  /* the link to somebody's board */
  const t=linkedTask(it);

    lk.appendChild(un);
  } else {
    if(it.task) lk.appendChild(el('p','note','The task this was linked to has been deleted.'));
    else lk.appendChild(el('p','note','Put it on someone’s board as a task, or link a task that is already there. Either way, finishing the task ticks this off.'));
    const bar=el('div','rowflex');
    const mkb=el('button','btn sm','Put It on the Board'); mkb.type='button';
    mkb.addEventListener('click', async ()=>{ await itemToTask(p, s, cur()); repaintItem(iid); });
    const lnb=el('button','btn ghost sm','Link a Task Already There'); lnb.type='button';
    lnb.addEventListener('click', ()=> linkTaskSheet(p, cur()));
    bar.appendChild(mkb); bar.appendChild(lnb); lk.appendChild(bar);
  }
  b.appendChild(lk);

  const acts=el('div','rowacts');
  const who = it.doneBy ? pname(it.doneBy) : '';
  acts.appendChild(el('span','note spacer', itemDone(it) && it.doneAt
    ? 'Ticked off'+(who?' by '+who:'')+' on '+fmtD(isoOf(new Date(it.doneAt)),1)+'.'
    : (it.by ? 'Added by '+pname(it.by)+'.' : '')));
  const del=el('button','btn danger sm','Delete'); del.type='button';
  del.addEventListener('click', ()=>{ if(del.dataset.c){ closePanel(); dropUndo('planitems', iid, 'Item'); }
    else { del.dataset.c='1'; del.textContent='Click Again to Delete'; } });
  acts.appendChild(del);
  b.appendChild(acts);
}

async function itemToTask(p, s, it){
  const o = it.who || p.who || S.me || '';
  const stt=itemStatus(it);
  const t={t:it.t, o:o, d:[], r:p.rock||'', w:p.part||'', s: stt==='Done'?'Done': stt==='In Progress'?'In Progress':'Not Started',
    p:'Normal', due:itemDue(it,p), notes:'From the plan “'+(p.title||'')+'” · '+(s.name||''), rail:0,
    ord:(S.tasks.length+1)*10, at:Date.now(), by:S.me||'', src:'plan', plan:p.id};
  const id=await put('tasks', t);
  await saveItem(it, {task:id});
  toast(o===S.me ? 'On your board.' : o ? 'On '+firstName(o)+'’s board.' : 'On the board, unassigned.');
}

/* choose a task already on a board */
function taskPicker(title, sub, prefer, onPick, keepOpen){
  sheet(box=>{
    box.appendChild(el('h2',null,title));
    box.appendChild(el('p',null,sub));
    const q=inp('search','','Type to find a task…'); q.style.width='100%';
    box.appendChild(q);
    const list=el('div','rows'); list.style.marginTop='12px'; list.style.maxHeight='52vh'; list.style.overflow='auto';
    box.appendChild(list);
    const picked=new Set();
    const draw=()=>{
      list.textContent='';
      const t=norm(q.value);
      let xs=openTasks().filter(x=> !t || norm(x.t).indexOf(t)>=0 || norm(pname(x.o)).indexOf(t)>=0);
      xs.sort((a,b)=> (prefer(b)-prefer(a)) || String(a.t).localeCompare(String(b.t)));
      xs.slice(0,60).forEach(x=>{
        const row=el('div','row'); const hb=el('button','rh2'); hb.type='button';
        const tt=el('span','t'); tt.appendChild(document.createTextNode(x.t));
        const r0=rock(x.r);
        tt.appendChild(el('small',null, pname(x.o)+(r0? ' · '+r0.name : '')+(x.due? ' · due '+fmtD(x.due) : '')));
        hb.appendChild(tt);
        const rr=el('span','r');
        rr.appendChild(el('span','chip '+(picked.has(x.id)?'ch-dn':'ch-ns'), picked.has(x.id)?'Added':'Pick It'));
        hb.appendChild(rr);
        hb.addEventListener('click', async ()=>{
          if(picked.has(x.id)) return;
          picked.add(x.id); await onPick(x);
          if(keepOpen) draw(); else closeSheet();
        });
        row.appendChild(hb); list.appendChild(row);
      });
      if(!xs.length) list.appendChild(el('div','empty','No open task matches that.'));
    };
    q.addEventListener('input', draw); draw();
    const acts=el('div','modal-acts');
    const dn=el('button','btn','Done'); dn.type='button'; dn.addEventListener('click', closeSheet);
    acts.appendChild(dn); box.appendChild(acts);
  });
}
function linkTaskSheet(p, it){
  const pref = x=> (x.o===it.who||isDoing(x,it.who)?2:0) + (x.r && x.r===p.rock?1:0);
  taskPicker('Link a Task', 'Pick the task that covers this item. When it is marked done, the item ticks itself off.', pref,
    async x=>{ await saveItem(it,{task:x.id}); toast('Linked.'); }, false);
}
function pullFromBoard(p, s){
  const pref = x=> (x.o===p.who||isDoing(x,p.who)?2:0) + (x.o===p.owner?1:0) + (x.r && x.r===p.rock?1:0);
  taskPicker('Add From the Board', 'Pick tasks to bring into “'+(s.name||'this section')+'”. Each one stays on its board and ticks off here when it is done.', pref,
    async x=>{
      const already=planItems(p.id).some(i=>i.task===x.id);
      if(already){ toast('That one is already in this plan.'); return; }
      S.openSecs[p.id+':'+s.id]=true;
      await put('planitems', {plan:p.id, sec:s.id, t:x.t, who:x.o||'', task:x.id, s:'Not Started',
        ord:nextItemOrd(p.id, s.id), at:Date.now(), by:S.me||''});
    }, true);
}

      listWrap.textContent='';

/* ---- leadership view: the plan and where it stands, nothing private ---- */
function leadView(root, p){
  const items=planItems(p.id);
  if(p.summary){ const c=el('div','statusnote'); c.textContent=p.summary; root.appendChild(c); }

  /* where each section stands — a composition bar per section */
  const box=el('div','box');
  box.appendChild(el('h2','sect-t','Where Each Part of the Plan Stands'));
  const ch=el('div','lchart');
  planSecs(p).forEach(s=>{
    const xs=items.filter(i=>i.sec===s.id && itemCounts(i));
    if(!xs.length) return;
    const dn=xs.filter(itemDone).length, bh=xs.filter(i=>itemBehind(i,p)).length;
    const ip=xs.filter(i=>!itemDone(i) && !itemBehind(i,p) && itemStatus(i)==='In Progress').length;
    const ns=xs.length-dn-bh-ip;
    const row=el('div','lrow');
    const ln=el('div','ln'); ln.appendChild(document.createTextNode(s.name));
    const w=secWindow(s); if(w) ln.appendChild(el('small',null,w));
    row.appendChild(ln);
    const bar=el('div','lbar'); bar.setAttribute('role','img');
    bar.setAttribute('aria-label', s.name+': '+dn+' done, '+ip+' in progress, '+ns+' not started, '+bh+' behind');
    [['dn',dn,'Done'],['ip',ip,'In Progress'],['ns',ns,'Not Started'],['bh',bh,'Behind']].forEach(([k,n,lab])=>{
      if(!n) return; const i=el('i',k); i.style.flexGrow=String(n); i.title=lab+': '+n; bar.appendChild(i); });
    row.appendChild(bar);
    row.appendChild(el('div','lv', dn+' of '+xs.length+' done'+(bh? ' · '+bh+' behind':'')));
    ch.appendChild(row);
  });
  box.appendChild(ch);
  const lg=el('div','legend');
  [['var(--good)','Done'],['var(--c1)','In Progress'],['var(--surface-3)','Not Started'],['var(--bad)','Behind']].forEach(([c,n])=>{
    const s2=el('span'); const i=el('i'); i.style.background=c; i.style.border='1px solid var(--border)'; s2.appendChild(i);
    s2.appendChild(document.createTextNode(n)); lg.appendChild(s2); });
  box.appendChild(lg);
  root.appendChild(box);

  const grid=el('div','grid2');
  /* the handover itself */
  const own=planSecs(p).find(s=>s.own);
  if(own){
    const xs=items.filter(i=>i.sec===own.id);
    const b2=el('div','box');
    b2.appendChild(el('h2','sect-t', own.name==='Responsibilities' ? 'Handing Over the Work' : own.name));
    const r=el('div','rows');
    let g=null;
    xs.forEach(it=>{
      if((it.grp||'')!==g){ g=it.grp||''; if(g) r.appendChild(el('div','rgrp', g)); }
      r.appendChild(leadRow(p, it, true));
    });
    b2.appendChild(r); grid.appendChild(b2);
  }
  /* who owns what */
  const b3=el('div','box');
  b3.appendChild(el('h2','sect-t','Who Owns What'));
  const by={}; items.filter(itemCounts).forEach(i=>{ const k=i.who||''; (by[k]=by[k]||[]).push(i); });
  const keys=Object.keys(by).sort((a,b)=> (a===''?1:0)-(b===''?1:0) || by[b].length-by[a].length);
  const lw=el('div','lchart');
  keys.forEach(k=>{
    const xs=by[k]; const dn=xs.filter(itemDone).length, bh=xs.filter(i=>itemBehind(i,p)).length;
    const row=el('div','lrow');
    const ln=el('div','ln lnp');
    if(k) ln.appendChild(avatar(k,'xs'));
    ln.appendChild(document.createTextNode(k? pname(k) : 'Nobody Yet'));
    row.appendChild(ln);
    const bar=el('div','lbar');
    [['dn',dn,'Done'],['ns',xs.length-dn-bh,'Still to Do'],['bh',bh,'Behind']].forEach(([c,n,lab])=>{
      if(!n) return; const i=el('i',c); i.style.flexGrow=String(n); i.title=lab+': '+n; bar.appendChild(i); });
    row.appendChild(bar);
    row.appendChild(el('div','lv', dn+' of '+xs.length+(bh? ' · '+bh+' behind':'')));
    lw.appendChild(row);
  });
  if(!keys.length) lw.appendChild(el('div','empty','Nothing in this plan yet.'));
  b3.appendChild(lw);
  grid.appendChild(b3);
  root.appendChild(grid);

  const lists=el('div','grid2');
  const listBox=(title, xs, empty)=>{
    const bx=el('div','box'); bx.appendChild(el('h2','sect-t',title));
    if(!xs.length){ bx.appendChild(el('div','empty',empty)); return bx; }
    const r=el('div','rows'); xs.forEach(it=> r.appendChild(leadRow(p, it))); bx.appendChild(r); return bx;
  };
  const byDue=(a,b)=> String(itemDue(a,p)||'9999').localeCompare(String(itemDue(b,p)||'9999'));
  lists.appendChild(listBox('Behind', items.filter(i=>itemBehind(i,p)).sort(byDue), 'Nothing is behind.'));
  lists.appendChild(listBox('Coming Up in the Next Two Weeks', items.filter(i=>itemSoon(i,p)).sort(byDue).slice(0,15), 'Nothing due in the next 14 days.'));
  root.appendChild(lists);
  const recent=items.filter(i=>itemDone(i) && i.doneAt && (Date.now()-i.doneAt) < 14*86400000).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  root.appendChild(listBox('Done in the Last Two Weeks', recent.slice(0,20), 'Nothing ticked off in the last 14 days.'));

  const acts=el('div','rowflex');
  const dl=el('button','btn'); dl.type='button';
  dl.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
  dl.appendChild(el('span',null,'Download a Progress Report'));
  dl.addEventListener('click', ()=> planReport(p));
  acts.appendChild(dl);
  acts.appendChild(el('span','note','Everyone with Team HQ can open this view. Private notes never appear here or in the report.'));
  root.appendChild(acts);
}
function leadRow(p, it, ownership){
  const row=el('div','row');
  const h=el('button','rh2'+(itemDone(it)?' done':'')); h.type='button';
  const t=el('span','t'); t.appendChild(document.createTextNode(it.t));
  const s=planSec(p, it.sec);
  const bits=[];
  if(ownership){ const x=it.x||{}; if(x.from) bits.push('Starts '+x.from); if(x.by) bits.push('Full ownership '+x.by); }
  else if(s) bits.push(s.name);
  const dd=itemDue(it,p); if(dd && !itemDone(it)) bits.push('due '+fmtD(dd));
  if(itemDone(it) && it.doneAt) bits.push('done '+fmtD(isoOf(new Date(it.doneAt)))+(it.doneBy? ' by '+firstName(it.doneBy) : ''));
  t.appendChild(el('small',null,bits.join(' · ')));
  h.appendChild(t);
  const r=el('span','r');
  const stt=itemStatus(it);
  if(stt==='Not Needed') r.appendChild(el('span','chip ch-out','Not Needed'));
  else if(itemDone(it)) r.appendChild(el('span','chip ch-dn', ownership? 'Owned' : 'Done'));
  else if(itemBehind(it,p)) r.appendChild(el('span','chip ch-od','Behind'));
  else if(stt==='In Progress') r.appendChild(el('span','chip ch-ip','In Progress'));
  else { const n=days(dd); r.appendChild(dd && n!==null && n<=7 ? el('span','chip ch-soon','Due '+(n===0?'Today':'in '+n+(n===1?' Day':' Days')))
    : el('span','chip ch-ns', dd? 'On Track' : 'Not Started')); }
  if(it.who) r.appendChild(avatar(it.who,'xs'));
  h.appendChild(r);
  h.title='Open this item';
  h.addEventListener('click', ()=> itemPanel(p.id, it.id));
  row.appendChild(h);
  return row;
}

async function copyPlan(src, base){
  if(!src) return '';
  const map={};
  const secs=planSecs(src).map(s=>{ const n=JSON.parse(JSON.stringify(s)); n.id=uid('sc'); map[s.id]=n.id; return n; });
  const np=Object.assign({}, base, {summary:src.summary||'', secs:secs, rock:src.rock||'', part:src.part||'', copiedFrom:src.id});
  const id=await put('plans', np);
  const its=planItems(src.id);
  for(const it of its){
    const x={}; Object.keys(it.x||{}).forEach(k=>{
      const col=(planSec(src,it.sec)||{cols:[]}).cols; const c=(col||[]).find(cc=>cc.k===k);
      x[k] = c && c.type==='check' ? 0 : it.x[k]; });
    await put('planitems', {plan:id, sec:map[it.sec]||it.sec, t:it.t, grp:it.grp||'', crit:it.crit||0,
      who: (it.who && it.who===src.who) ? (base.who||'') : (it.who||''),
      day: hasNum(it.day)? it.day : '', wd: hasNum(it.wd)? it.wd : '', note:it.note||'', x:x,
      s:'Not Started', ord:it.ord||0, at:Date.now(), by:S.me||''});
  }
  return id;
}

<script>
/* ---------- rail: collapse, remember, search ---------- */
(function(){
  "use strict";
  const KEY='hq.rail.off';
  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }
  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{ if(window.matchMedia('(max-width:900px)').matches) set(true); });
    });
    wireFind();
  }
  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q){ q.focus(); q.select(); } }, 230);
    }
  });
  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function nz(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }
  function go(tab){ if(window.__show) window.__show(tab); }
  function gather(q){
    const t=nz(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=nz(name); return n===t?3 : n.indexOf(t)===0?2 : n.indexOf(t)>=0?1 : 0; };
    const push=(group,name,where,fn)=>{ if(out.length<60) out.push({group,name,where,go:fn,s:score(name)}); };
    try{ if(window.__search) window.__search(t, push, go); }catch(e){}
    const best={}; out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['Tasks','Team Projects','Parts','Plans','Plan Items','People','Key Dates','Expenses','Notes'];
    out.sort((a,b)=> (best[b.group]-best[a.group]) || (ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      || (b.s-a.s) || String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=''; rows=[]; picked=-1;
    if(!list.length){ const n=document.createElement('div'); n.className='rh-none';
      n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return; }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group; const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); });
      rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }
  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx');
    if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value; if(x) x.hidden = !v;
      if(nz(v).length<2){ close(); return; } draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(nz(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.railfind')) close(); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>

<script>
/* ---------- theme ---------- */
(function theme(){
  var btn = document.getElementById("theme-btn");
  if(!btn) return;
  function cur(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint(){
    const dark = cur() === "dark";
    const lab = document.getElementById("theme-lab");
    if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode";
    btn.title = "Switch to " + (dark ? "light" : "dark") + " mode";
  }
  btn.addEventListener("click", function(){
    document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark");
    paint();
    try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  });
  try{
    var saved = localStorage.getItem("mismo.portal.theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  paint();
})();
</script>
