<!DOCTYPE html>
<html lang="en" data-rs-gate>
<head>
<meta charset="utf-8">

<title>Help — MISMO Resources</title>
<script>/* The theme before any CSS paints, so a dark-mode visitor never sees a flash of light. */
(function(){ try { var t = localStorage.getItem('resources:home:theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F1F6FA; --surface:#FFFFFF; --sunk:#E9F1F8; --ink:#0F314C; --ink-2:#456179; --ink-3:#546F88;
    --line:#E5EEF5; --line-2:#D5E2ED; --line-3:#ADC4D6; --accent:#14486E; --accent-soft:#DCEDF8; --sky:#50A4DB;
    --btn:#0F314C; --btn-ink:#FFFFFF; --pin:#14486E; --pin-soft:#DCEDF8; --admin-bg:#E4E8FF; --admin-ink:#2A3FB8;
    --shadow:0 1px 2px rgba(15,49,76,.06), 0 10px 26px -18px rgba(15,49,76,.45);
    --display:'Archivo','Libre Franklin',sans-serif; --font:'Libre Franklin',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color-scheme:light;
  }
  /* Light unless someone picks Dark Mode (Perry, 6 Nov 2026): no longer follows the computer's own dark setting. */
  :root[data-theme="dark"]{
    --paper:#0B1826; --surface:#112336; --sunk:#172D44; --ink:#EEF3F8; --ink-2:#B9C8D6; --ink-3:#8C9FB1;
    --line:#1A3048; --line-2:#243E5A; --line-3:#3A5A7C; --accent:#8CC6EC; --accent-soft:#173A57;
    --btn:#50A4DB; --btn-ink:#0F314C; --pin:#8CC6EC; --pin-soft:#173A57; --admin-bg:#23305E; --admin-ink:#B8C4FF;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -18px rgba(0,0,0,.9); color-scheme:dark;
  }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
  html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px) }
  *,*::before,*::after{ box-sizing:inherit }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased }
  a{ color:inherit; text-decoration:none }
  button{ font:inherit; color:inherit }
  :focus-visible{ outline:2px solid var(--sky); outline-offset:2px; border-radius:6px }
  svg.i{ width:1em; height:1em; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

  /* top bar: the Resources frame */
  .top{ position:sticky; top:0; z-index:20; height:64px; padding:0 22px; background:#0f314c; color:#fff; display:flex; align-items:center; box-shadow:0 1px 0 rgba(80,164,219,.28) }
  .plate{ background:#fff; border-radius:5px; padding:9px 13px; line-height:0 } .plate svg{ height:24px; width:auto }
  .rule{ width:2px; height:34px; margin:0 20px; border-radius:1px; background:#50a4db }
  .brand{ font-size:15.5px; font-weight:700; color:#50a4db }
  .top-r{ margin-left:auto; display:flex; align-items:center; gap:10px; position:relative }
  .helpbtn{ width:auto !important; padding:0 13px; gap:7px; font-size:14px; font-weight:700; text-decoration:none } .helpbtn[aria-current="page"]{ background:rgba(116,191,235,.2) }
@media (max-width:600px){ .helpbtn{ width:40px !important; padding:0 } .helpbtn span{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap } }   /* a phone: the icon alone, its name still read out */
.iconbtn{ width:40px; height:40px; border-radius:4px; border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px }
  .acct{ display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 12px 0 7px; border-radius:4px; border:0; background:#fff; color:#2C74A6; font-weight:600; font-size:13px; cursor:pointer }
  .acct .av{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; background:linear-gradient(160deg,#a8d4ef,#6fb2dc) }
  .menu{ position:absolute; right:0; top:52px; width:290px; background:var(--surface); color:var(--ink); border:1px solid var(--line-2); border-radius:12px; box-shadow:0 18px 40px -18px rgba(6,32,47,.55); padding:8px }
  .menu p{ margin:4px 8px 8px; font-size:12px; color:var(--ink-3) }
  .menu button{ display:block; width:100%; text-align:left; background:none; border:0; border-radius:8px; padding:9px 10px; cursor:pointer }
  .menu button:hover, .menu button[aria-checked="true"]{ background:var(--accent-soft) }
  .menu b{ display:block; font-size:13.5px } .menu small{ font-size:12px; color:var(--ink-2) }
  .proto{ max-width:1200px; margin:14px auto 0; padding:8px 14px; border:1px dashed var(--line-3); border-radius:10px; font-size:12.5px; color:var(--ink-2) }

  main{ max-width:1200px; margin:0 auto; padding:36px 24px 72px }
  /* the greeting and the box: the first thing anyone sees */
  .hello{ max-width:760px; margin:0 auto; text-align:center }
  .date{ font-size:12.5px; font-weight:600; color:var(--ink-3) }
  h1{ margin:4px 0 0; font-family:var(--display); font-weight:800; font-size:clamp(28px,4vw,36px); letter-spacing:-.02em; line-height:1.1 }
  .ask{ margin-top:22px; display:flex; align-items:center; gap:12px; background:var(--surface); border:2px solid var(--sky); border-radius:16px; padding:0 18px; box-shadow:0 18px 40px -26px rgba(15,49,76,.55) }
  .ask svg{ color:var(--sky); font-size:22px }
  .ask input{ flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:17px; padding:18px 0 }
  .ask input::placeholder{ color:var(--ink-3) }
  .ask input::-webkit-search-cancel-button, .ask input::-webkit-search-decoration{ -webkit-appearance:none; appearance:none; display:none }   /* the page's own clear button only */
  .ask kbd{ font:600 11px var(--font); color:var(--ink-3); border:1px solid var(--line-2); border-radius:5px; padding:1px 6px }
  .ask .clear{ border:0; background:var(--sunk); color:var(--ink-2); border-radius:4px; width:26px; height:26px; cursor:pointer }
  /* results: under the box, ranked, each saying why it matched */
  .results{ margin-top:14px; text-align:left; background:var(--surface); border:1px solid var(--line-2); border-radius:16px; box-shadow:var(--shadow); overflow:hidden }
  .best{ display:flex; align-items:center; gap:14px; padding:16px 18px; background:var(--accent-soft) }
  .best .lbl{ font-size:12px; font-weight:700; color:var(--accent) }
  .best .t{ font-size:17px; font-weight:700 } .best .s{ font-size:13px; color:var(--ink-2) }
  .best .go{ margin-left:auto; flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; border-radius:8px; padding:9px 15px; font-size:13.5px; font-weight:700; background:var(--btn); color:var(--btn-ink) }
  .more{ list-style:none; margin:0; padding:4px 0 }
  .more a{ display:flex; align-items:center; gap:12px; padding:10px 18px }
  .more a:hover, .more a:focus-visible{ background:var(--sunk); outline-offset:-2px }
  .more .t{ font-size:14px; font-weight:700 } .more .s{ font-size:12.5px; color:var(--ink-2) }
  .why{ display:inline-flex; flex-wrap:wrap; gap:4px; margin-top:4px }
  .why span{ font-size:11.5px; color:var(--ink-3); border:1px solid var(--line-2); border-radius:4px; padding:0 8px }
  .missing{ display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-2) }
  .missing b{ color:var(--accent) }
  .noresults{ padding:16px 18px; font-size:13.5px; color:var(--ink-2) }
  .grp{ padding:12px 18px 2px; font-size:12px; font-weight:700; color:var(--ink-3); border-top:1px solid var(--line) }
  .best + .grp{ border-top:0 }
  .kind{ display:inline-block; vertical-align:2px; margin-left:6px; font-size:11px; font-weight:600; color:var(--ink-3); border:1px solid var(--line-2); border-radius:4px; padding:0 8px }

  h2{ margin:0; font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.01em }
  .bar{ display:flex; align-items:baseline; gap:12px; margin:40px 0 12px; flex-wrap:wrap }
  .bar .hint{ font-size:12.5px; color:var(--ink-3) }
  .bar .linkbtn{ margin-left:auto; border:0; background:none; font-weight:600; font-size:13px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:4px 2px }

  /* pinned */
  .pins{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px }
  .pins.n3{ grid-template-columns:repeat(3,minmax(0,1fr)) } .pins.n2{ grid-template-columns:repeat(2,minmax(0,1fr)) } .pins.n1{ grid-template-columns:minmax(0,420px) }
  .pcard{ position:relative; background:var(--surface); border:1px solid var(--line-2); border-radius:14px; box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:12px }
  .pcard.dragging{ opacity:.45 } .pcard.over{ outline:2px dashed var(--sky); outline-offset:2px }
  .pcard .head{ display:flex; align-items:center; gap:10px }
  .ticon{ flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center }
  .tag{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-3); min-width:0 }
  .tag i{ width:8px; height:8px; border-radius:2px; flex:0 0 auto }
  .pcard .t{ font-size:17px; font-weight:700 } .pcard .s{ font-size:13px; color:var(--ink-2); margin-top:3px }
  .pcard .go{ align-self:flex-start; margin-top:auto; display:inline-flex; align-items:center; gap:7px; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; background:var(--btn); color:var(--btn-ink) }
  .handle{ margin-left:auto; border:0; background:none; color:var(--ink-3); cursor:grab; padding:4px; border-radius:6px; font-size:16px; display:inline-flex }
  .handle:active{ cursor:grabbing }
  .pinbtn{ flex:0 0 auto; width:32px; height:32px; border-radius:8px; border:1px solid var(--line-2); background:transparent; color:var(--ink-3); display:inline-flex; align-items:center; justify-content:center; cursor:pointer }
  .pinbtn:hover{ border-color:var(--line-3); color:var(--ink) }
  .pinbtn[aria-pressed="true"]{ background:var(--pin-soft); border-color:var(--pin-soft); color:var(--pin) }
  .pinbtn[aria-pressed="true"] path{ fill:currentColor }
  .empty{ border:1px dashed var(--line-3); border-radius:14px; padding:22px; text-align:center; color:var(--ink-2); font-size:13.5px }

  /* everything: section cards that open and close */
  .sec{ margin-top:14px; background:var(--surface); border:1px solid var(--line-2); border-radius:14px; box-shadow:var(--shadow); overflow:hidden }
  .sec > button.sh{ width:100%; display:flex; align-items:center; gap:12px; padding:16px 20px; background:none; border:0; cursor:pointer; text-align:left }
  .sh .dots{ display:inline-flex; gap:4px } .sh .dots i{ width:10px; height:10px; border-radius:3px }
  .sh .nm{ font-family:var(--display); font-weight:700; font-size:17px }
  .sh .ct{ font-size:12.5px; color:var(--ink-3) }
  .sh .chev{ margin-left:auto; color:var(--ink-3); font-size:18px; transition:transform .18s }
  .sec[data-open="false"] .chev{ transform:rotate(-90deg) }
  .cols{ display:grid; gap:28px; padding:14px 20px 12px; border-top:1px solid var(--line) }
  .cols.c1{ grid-template-columns:minmax(0,1fr) } .cols.c2{ grid-template-columns:repeat(2,minmax(0,1fr)) } .cols.c3{ grid-template-columns:repeat(3,minmax(0,1fr)) }
  .tool .th{ display:flex; align-items:center; gap:10px; margin-bottom:4px }
  .tool .tn{ flex:1; min-width:0; font-size:14px; font-weight:700 } .tool .tn small{ display:block; font-weight:500; font-size:12px; color:var(--ink-3) }
  .role{ font-size:11.5px; font-weight:700; border-radius:4px; padding:2px 9px; background:var(--accent-soft); color:var(--accent); white-space:nowrap }
  .role.admin{ background:var(--admin-bg); color:var(--admin-ink) }
  .row{ display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px dotted var(--sky) }
  .tool .row:first-of-type{ border-top:0 }
  .row a{ flex:1; min-width:0; display:flex; align-items:center; gap:12px; border-radius:8px }
  .row a:hover .rt{ text-decoration:underline; text-underline-offset:3px }
  .rt{ font-size:13.5px; font-weight:700 } .rs{ font-size:12px; color:var(--ink-2) }
  mark{ background:var(--accent-soft); color:inherit; border-radius:3px; padding:0 1px }
  .closed{ display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 16px }
  .tchip{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-2); background:transparent; border-radius:4px; padding:5px 12px 5px 6px; font-size:13px; font-weight:600; cursor:pointer }
  .tchip:hover{ border-color:var(--line-3) }
  .askadmin{ margin-top:22px; display:flex; align-items:center; gap:12px; border:1px dashed var(--line-3); border-radius:12px; padding:14px 18px; color:var(--ink-2); font-size:13.5px }
  .askadmin b{ color:var(--accent) }
  .toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; font-size:13.5px; transition:all .2s; pointer-events:none; z-index:50 }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0) }
  @media (max-width:900px){ .pins, .pins.n3{ grid-template-columns:repeat(2,minmax(0,1fr)) } .cols.c3, .cols.c2{ grid-template-columns:minmax(0,1fr) } }
  @media (max-width:560px){ .pins, .pins.n2, .pins.n3{ grid-template-columns:minmax(0,1fr) } .top .brand, .rule{ display:none } main{ padding:24px 16px 56px } .sh .ct{ display:none } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important } }

/* Home page D with pins (Perry, 13 Oct 2026): tool tiles, each with a pin menu */
.tsec{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.tsec{overflow:visible;position:relative} .tsec:has(.menu-open){z-index:30}   /* the pin menu may overflow its section */
.sh2 .dots{display:flex;gap:4px} .sh2 .dots i{width:10px;height:10px;border-radius:2px;display:block}
.sh2{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)} .sh2 .nm{font-family:Archivo,sans-serif;font-weight:700;font-size:17px} .sh2 .ct{font-size:12.5px;color:var(--ink-3)}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:14px 18px 16px}
@media (max-width:1100px){.tgrid{grid-template-columns:repeat(4,minmax(0,1fr))}} @media (max-width:760px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ttile{position:relative;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);min-height:112px;transition:border-color .12s,box-shadow .12s}
.ttile:hover,.ttile:focus-within,.ttile.menu-open{border-color:var(--sky);box-shadow:0 0 0 3px var(--sunk)}
.tlink{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 12px;height:100%;text-decoration:none;color:inherit;border-radius:10px}
.tlink b{font-size:14px;line-height:1.25;padding-right:30px} .tlink small{font-size:11.5px;color:var(--ink-3)}
.ttile .tpin{position:absolute;top:12px;right:10px}
.pmenu{position:absolute;top:50px;left:-1px;z-index:20;width:330px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 34px rgba(15,49,76,.22);padding:10px;text-align:left}
.tgrid .ttile:nth-child(6n) .pmenu,.tgrid .ttile:nth-child(6n-1) .pmenu{left:auto;right:-1px}
.pttl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin:0 2px 8px} .pttl span{color:var(--ink-3);font-weight:600}
#pmq{width:100%;height:34px;border:1px solid var(--line-2);border-radius:4px;padding:0 10px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink);margin-bottom:6px}
#pmq:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px var(--sunk)}
.plab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:8px 4px 4px}
.pmenu{max-height:min(460px,70vh);overflow:auto}
.prow{display:flex;align-items:center;gap:9px;width:100%;padding:6px;border:0;border-radius:4px;background:none;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer}
.prow:hover,.prow:focus-visible{background:var(--sunk);outline:none} .prow .nm{flex:1;line-height:1.25} .prow small{display:block;color:var(--ink-3);font-size:11px}
.prow .pinbtn{width:26px;height:26px} .prow .pinbtn.on{background:var(--sunk);border-color:var(--sky);color:var(--accent)}
.prow mark{background:#FFF1B8;color:inherit;padding:0 1px;border-radius:2px}
.pfoot{font-size:11.5px;color:var(--ink-3);margin:8px 4px 2px;line-height:1.4}
</style>
<style>
/* Help (Perry, 6 Nov 2026) */
.hh-band{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(120deg,#0F314C 0%,#14486E 58%,#0F7A86 135%);color:#fff;padding:22px 26px 0}
.hh-ey{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#94C8E9}
.hh-band h1{font-size:32px;font-weight:800;margin:6px 0 0;color:#fff;letter-spacing:-.01em} .hh-band p{color:#cfe3f1;font-size:14px;margin:6px 0 0}
.hh-tabs{display:flex;gap:10px;margin:18px -26px 0;padding:8px 26px 0;background:rgba(5,22,36,.28);border-top:1px solid rgba(255,255,255,.08)}
.hh-tabs .lbl{align-self:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#94C8E9;margin-right:6px}
.hh-tabs button{all:unset;cursor:pointer;padding:10px 18px 11px;border-radius:11px 11px 0 0;font-size:13.5px;font-weight:600;color:#cfe3f1}
.hh-tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700} .hh-tabs button:focus-visible{outline:2px solid #74BFEB;outline-offset:-2px}
.hh-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:18px}
.hh-card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:18px 20px}
.hh-card h2{font-size:16.5px;margin:0 0 6px;color:var(--ink)} .hh-card h2.more{margin-top:18px}
.hh-who{color:var(--ink-2);margin:0 0 12px;font-size:14px}
.hh-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.hh-steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.hh-steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:#0F314C;color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .hh-steps li::before{background:#50A4DB;color:#0F314C}
.hh-good{margin:0;padding-left:18px;font-size:14px;line-height:1.55} .hh-good li{margin:4px 0}
.hh-what{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.hh-q{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;color:var(--ink-2)} .hh-q b{color:var(--ink)} .hh-q a{color:var(--accent)}
.hh-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.hh-node{border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;background:var(--sunk);color:var(--ink);border:1px solid var(--line-2);text-align:center}
.hh-node small{display:block;font-weight:600;font-size:11px;color:var(--ink-3)}
.hh-node.ask{background:#FBF1DE;border-color:#EBD7AE;color:#7a5413} .hh-node.ask small{color:inherit;opacity:.8}
.hh-node.dk{background:#0F314C;color:#fff;border-color:#0F314C} .hh-node.dk small{color:#a9c7dc} .hh-arr{color:var(--ink-3);font-weight:800}
@media (max-width:900px){ .hh-grid{grid-template-columns:1fr} }
</style>

<header class="top">
  <span class="plate"><svg role="img" aria-label="MISMO" viewBox="0 0 708 108"><use href="#mismo-logo"/></svg></span>
  <span class="rule" aria-hidden="true"></span><span class="brand">Resources</span>
  <span class="top-r">
    <!-- Help (Perry, 6 Nov 2026): this page has no sidebar, so Help sits here, beside dark mode -->
    <a class="iconbtn helpbtn" id="helpBtn" href="/help.html" title="Help" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 015 .9c0 1.7-2.5 2.2-2.5 3.8"/><path d="M12 17.2v.1"/></svg><span>Help</span></a>
    <button type="button" class="iconbtn" id="theme" aria-label="Switch to dark mode"></button>
    <!-- The shared account button every tool shows in this spot (session.js fills it). -->
    <div id="rs-account"></div>
  </span>
</header>
<main id="helpMain" aria-label="Help"></main>
<script src="/assets/session.js"></script>
<script>
  /* Help (Perry, 6 Nov 2026): built by _internal/make-help.py; the wording lives there. */
  const G = {"what": "MISMO Resources is the front door to every MISMO tool you can use, with one sign-in.", "flowTitle": "How It Works", "flow": [["Sign In", "once, for every tool", ""], ["Find It", "search or browse your tools", ""], ["Pin It", "a tool, or any page in it", "ask"], ["Start", "straight into the tool", "dk"]], "roles": [["Everyone", "You use one or more of MISMO’s tools.", ["Sign in once; every tool you can use is listed under Everything You Can Do.", "Type what you need into the search box, such as a task, a tool, an initiative or a workgroup, and Start goes straight to it.", "Pin a tool, or any page inside it, to keep it at the top of your page. Drag the pins to reorder them.", "Switch between light and dark with the button at the top right."], ["Your pins follow you to any computer you sign in on.", "You see only the tools you have access to. Ask the person who runs a tool if you need it.", "Press / to jump to the search box."]], ["Platform Admin", "You manage who can use which MISMO tool.", ["Open the Admin panel from your account menu, at the top right.", "In People, add someone, or change which tools they can use and how: view, edit or admin.", "Tools lists every tool on the platform.", "Use View as beside a person to see the site the way they do: read-only, for 30 minutes, and recorded in Activity."], ["Changes in People apply to the home page and to every tool.", "Activity keeps a record of changes and View as sessions."]]]};
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const M = document.getElementById('helpMain'); let r = 0;
  function render(focus){ const R = G.roles[r];
    M.innerHTML = `<header class="hh-band"><div class="hh-ey">Help</div><h1>How MISMO Resources Works</h1><p>For each person who uses it: pick who you are. Questions: Perry Williams.</p>
      <div class="hh-tabs" role="tablist" aria-label="Who are you?"><span class="lbl" aria-hidden="true">Who Are You?</span>${G.roles.map((x, i) => `<button type="button" role="tab" data-r="${i}" aria-selected="${i === r}" tabindex="${i === r ? 0 : -1}">${esc(x[0])}</button>`).join('')}</div></header>
      <div class="hh-grid"><section class="hh-card"><h2>${esc(R[0])}: What You Do Here</h2><p class="hh-who">${esc(R[1])}</p><ol class="hh-steps">${R[2].map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ol></section>
        <section class="hh-card"><h2>Good to Know</h2><ul class="hh-good">${R[3].map(x => `<li>${esc(x)}</li>`).join('')}</ul><h2 class="more">What This Is</h2><p class="hh-what">${esc(G.what)}</p>
          <div class="hh-q">Something missing or unclear? Tell <b>Perry Williams</b> (<a href="mailto:pwilliams@mba.org">pwilliams@mba.org</a>).</div></section></div>
      <section class="hh-card" style="margin-top:16px"><h2>${esc(G.flowTitle)}</h2><div class="hh-flow">${G.flow.map(n => `<div class="hh-node ${n[2]}">${esc(n[0])}${n[1] ? `<small>${esc(n[1])}</small>` : ''}</div>`).join('<span class="hh-arr" aria-hidden="true">→</span>')}</div></section>`;
    M.querySelectorAll('[data-r]').forEach(b => { b.addEventListener('click', () => { r = +b.dataset.r; render(true); });
      b.addEventListener('keydown', ev => { if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return; ev.preventDefault(); r = (r + 1) % G.roles.length; render(true); }); });
    if (focus) { const f = M.querySelector(`[data-r="${r}"]`); if (f) f.focus(); } }
  render();
  /* signed in, as on the home page: the page stays hidden until then */
  const RS = window.ResourcesSession;
  if (!RS) document.documentElement.classList.remove('rs-wait');
  else RS.requireSignIn({ toolName: 'MISMO Resources', eyebrow: 'Programs & Operations' }).then(() => document.documentElement.classList.remove('rs-wait'), () => document.documentElement.classList.remove('rs-wait'));
  /* light or dark: the home page's saved choice, light unless chosen */
  const tb = document.getElementById('theme');
  const SUN = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.4v2.3M12 19.3v2.3M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.4 12h2.3M19.3 12h2.3M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>';
  const MOON = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6.4 6.4 0 009 9 9 9 0 11-9-9z"/></svg>';
  function paint(){ const d = document.documentElement.getAttribute('data-theme') === 'dark'; tb.innerHTML = d ? SUN : MOON; tb.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode'); }
  tb.addEventListener('click', () => { const d = document.documentElement.getAttribute('data-theme') === 'dark', n = d ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('resources:home:theme', n); } catch (e) {} paint(); });
  paint();
</script>
