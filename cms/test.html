/* How many of their meetings fall in this working week, Monday to Friday — the number a
   facilitator actually plans around. */
function weekCount(gks,now){
  const d0=new Date(now.getTime());
  d0.setDate(d0.getDate()-((d0.getDay()+6)%7));        /* back to Monday */
  let t=0;
  for(let i=0;i<5;i++){
    const d=new Date(d0.getTime()); d.setDate(d.getDate()+i);
    gks.forEach(k=>{ const sc=(M.sched||{})[k];
      const g=M.gr.get(k); if(g&&(g.archived||g.hold)) return;
      if(sc&&sc.rule&&meetsOn(sc.rule,d)) t++; });
  }
  return t;
}
/* A circle of initials, coloured from the chart palette by the name itself so the same
   person is always the same colour. The fill is a tint of it and the letters a deepened
   version, so both read clearly on the light and the dark surface. */
function initialsOf(nm){
  const w=String(nm||"").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return "?";
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[w.length-1][0]).toUpperCase();
}
function avSlot(nm){
  let h=0; const s2=String(nm||"");
  for(let i=0;i<s2.length;i++) h=(h*31+s2.charCodeAt(i))>>>0;
  return "var(--c"+((h%6)+1)+")";
}
function avatar(nm){
  const a=el("span","pc-av",initialsOf(nm));
  a.style.setProperty("--av",avSlot(nm));
  a.setAttribute("aria-hidden","true");
  return a;
}
/* Until the saves made since the history was imported have arrived, a "to log" count would
   be the imported figure \u2014 right-looking and wrong. Say it is still being worked out. */
function countsReady(){ return !M.expectDb||!!M.dbReady; }
function groupCard(gk){
  const g=M.gr.get(gk); if(!g) return null;
  const sc=(M.sched||{})[gk]||{}, pend=pendingFor(gk), last=lastLogged(gk);
  const now=etNow(), isToday=sc.rule&&meetsOn(sc.rule,now);
  const c=el("button","pcard2"); c.type="button";
  c.style.setProperty("--tc", g.archived?"var(--ink-3)":pend.length?"var(--warn)":isToday?"var(--sky)":"var(--c1)");
  if(g.archived) c.classList.add("arch");

  const body=el("div","pc-body");
  const top=el("div","pc-top"); top.appendChild(el("div","pc-n",g.name));
  if(g.archived) top.appendChild(el("div","pc-b arch","Archived"));
  else if(g.hold) top.appendChild(el("div","pc-b hold","On Hold"));
  else if(!countsReady()) top.appendChild(el("div","pc-b wait","Checking\u2026"));
  else if(pend.length) top.appendChild(el("div","pc-b",pend.length===1?"1 to log":pend.length+" to log"));
  else if(isToday) top.appendChild(el("div","pc-b now","Today"));
  else top.appendChild(el("div","pc-b ok","Up to date"));
  body.appendChild(top);

  const ms=schedShort(gk);
  const meet=el("div","pc-meet"+(ms?"":" none"));
  meet.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  meet.appendChild(document.createTextNode(g.hold?"Not meeting at the moment":(ms?(ms+" ET"):"No cadence set")));
  if(g.hold) meet.className="pc-meet none";
  body.appendChild(meet);
  body.appendChild(el("div","pc-sp"));
  c.appendChild(body);

  const foot=el("div","pc-foot");
  const l=el("span");
  if(last){ l.appendChild(document.createTextNode("Last logged "));
    l.appendChild(el("b",null,fmtD(last))); }
  else l.appendChild(document.createTextNode("Nothing logged yet"));
  foot.appendChild(l);
  foot.appendChild(el("span","pc-ct",n(liveCount(gk))+" meetings"));
  c.appendChild(foot);

  c.addEventListener("click",()=>openLog(gk));
  c.title="Log attendance for "+g.name;
  return c;
}

function drawPicker(){
  const host=$("#pk-host"); if(!host) return; host.textContent="";
  const q=nk(($("#pk-q")||{}).value||"");
  if(PICKMODE==="fac"&&!PICKFAC&&!q){
    const fl=facList();
    $("#pk-c").textContent=n(fl.length)+" facilitators"+(SHOWARC?", archived included":"");
    const grid=el("div","cardgrid");
    fl.forEach(([nm,gks])=>{
      const pend=gks.reduce((a,k)=>a+pendingFor(k).length,0);
      const now=etNow(), todayN=gks.filter(k=>{ const sc=(M.sched||{})[k]; return sc&&sc.rule&&meetsOn(sc.rule,now); }).length;
      const wk=weekCount(gks,now);
      const c=el("button","pcard2"); c.type="button";
      /* the stripe is the person's own colour, the same one their circle carries \u2014 the
         amber "to log" badge is what says there is a backlog */
      c.style.setProperty("--tc",avSlot(nm));
      const body=el("div","pc-body");
      const top=el("div","pc-top");
      top.appendChild(avatar(nm));
      const nmw=el("div","pc-nw");
      nmw.appendChild(el("div","pc-n",nm));
      nmw.appendChild(el("div","pc-sub",n(gks.length)+" workgroup"+(gks.length===1?"":"s")));
      top.appendChild(nmw);
      top.appendChild(!countsReady()?el("div","pc-b wait","Checking\u2026")
        :pend?el("div","pc-b",pend+" to log"):el("div","pc-b ok","Up to date"));
      body.appendChild(top);
      body.appendChild(el("div","pc-sp"));
      c.appendChild(body);
      const foot=el("div","pc-foot");
      const meet=el("span","pc-meet"+(todayN?"":" none"));
      meet.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
      meet.appendChild(document.createTextNode(
        todayN? (todayN+" today") : "Nothing today"));
      foot.appendChild(meet);
      const w=el("span","pc-ct");
      if(wk){ w.appendChild(el("b",null,n(wk))); w.appendChild(document.createTextNode(" this week")); }
      else w.textContent="None this week";
      foot.appendChild(w);
      c.appendChild(foot);
      c.addEventListener("click",()=>{ PICKFAC=nm; drawPicker(); window.scrollTo(0,0); });
      grid.appendChild(c);
    });
    host.appendChild(grid);
    if(!fl.length) host.appendChild(el("div","empty","No facilitators are listed yet. Add one in a group's Meeting Schedule and Settings."));
    return;
  }
  if(PICKMODE==="fac"&&PICKFAC&&!q){
    const back=el("button","backb"); back.type="button";
    back.innerHTML='<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';
    back.appendChild(document.createTextNode("All Facilitators"));
    back.addEventListener("click",()=>{ PICKFAC=""; drawPicker(); });
    host.appendChild(back);
    host.appendChild(el("h2",null,PICKFAC)); 
    const gks=(facList().find(x=>x[0]===PICKFAC)||[null,[]])[1];
    $("#pk-c").textContent=n(gks.length)+" workgroup"+(gks.length===1?"":"s");
    const grid=el("div","cardgrid"); grid.style.marginTop="12px";
    gks.map(k=>M.gr.get(k)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name))
      .forEach(g=>{ const c=groupCard(g.k); if(c) grid.appendChild(c); });
    host.appendChild(grid);
    return;
  }
  let gs=[...M.gr.values()].filter(pickVisible);
  if(q) gs=gs.filter(g=>nk(g.name).indexOf(q)>=0);
  gs.sort((a,b)=>a.name.localeCompare(b.name));
  $("#pk-c").textContent=n(gs.length)+" workgroup"+(gs.length===1?"":"s")+
    (SHOWARC?", archived included":"");
  const grid=el("div","cardgrid");
  gs.forEach(g=>{ const c=groupCard(g.k); if(c) grid.appendChild(c); });
  host.appendChild(grid);
  if(!gs.length) host.appendChild(el("div","empty","No workgroups match that search."));
}
</script>
<script>
"use strict";
/* ======================= pane ======================= */
function openPane(title,sub,build){
  $("#pane-t").textContent=title; $("#pane-s").textContent=sub||"";
  const b=$("#pane-b"); b.textContent=""; b.scrollTop=0;
  const r=build(); if(r) b.appendChild(r);
  document.body.classList.add("paneon"); $("#pane").setAttribute("aria-hidden","false");
}
function closePane(){ document.body.classList.remove("paneon","panewide"); $("#pane").setAttribute("aria-hidden","true"); }
$("#pane-x").addEventListener("click",closePane);
$("#pane-wide").addEventListener("click",()=>{ const w=document.body.classList.toggle("panewide");
  $("#pane-wide").setAttribute("aria-label",w?"Back to normal size":"Expand the panel");
  $("#pane-wide").title=w?"Back to normal size":"Expand the panel"; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.body.classList.contains("paneon")) closePane(); });

function facts(pairs){
  const f=el("div","facts");
  pairs.forEach(([k,v])=>{ if(v==null||v==="") return;
    const d=el("div","fact"); d.appendChild(el("label",null,k));
    const dv=el("div"); if(v instanceof Node) dv.appendChild(v); else dv.textContent=v;
    d.appendChild(dv); f.appendChild(d); });
  return f;
}
function catSelect(val,onchange){
  const s=el("select"); s.style.cssText="width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:12.5px;background:var(--surface);color:var(--ink)";
  M.cats.forEach(c=>{ const o=el("option",null,c); o.value=c; if(c===val)o.selected=true; s.appendChild(o); });
  s.addEventListener("change",()=>onchange(s.value));
  if(!CANWRITE) s.disabled=true;
  return s;
}
function mtgList(idxs,showGroup){
  const ul=el("div","tl");
  idxs.slice().sort((a,b)=>M.mt[b].d.localeCompare(M.mt[a].d)).slice(0,400).forEach(i=>{
    const m=M.mt[i], g=M.gr.get(m.gk);
    const li=el("button","tli"); li.type="button";
    li.appendChild(el("span","d",fmtD(m.d)));
    const mid=el("span","w");
    mid.appendChild(document.createTextNode(showGroup?(g?g.name:m.gk):(isCancelled(m)?"Cancelled":n(m.p.size)+" attended")));
    if(isCancelled(m)){ const t=el("span","tag canc","Cancelled"); t.style.marginLeft="8px"; mid.appendChild(t); li.classList.add("canc"); }
    if(m.sum){ const _s=M.summits.get(m.sum); const t=el("span","tag",_s?_s.name:"Summit"); t.style.marginLeft="8px"; mid.appendChild(t); }
    if(m.src==="db"){ const t=el("span","tag","Logged Here"); t.style.marginLeft="6px"; mid.appendChild(t); }
    li.appendChild(mid);
    li.appendChild(el("span","st",showGroup?(isCancelled(m)?"Cancelled":n(m.p.size)+" attended"):(m.by||m.label||"")));
    li.title="Open this meeting";
    li.addEventListener("click",()=>openMeeting(m.gk,m.d));
    ul.appendChild(li);
  });
  if(!idxs.length) ul.appendChild(el("div","empty","No meetings recorded yet."));
  return ul;
}
/* ---- a Word-ready attendance table on the clipboard ---- */
function esc2(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function attendanceTable(pks){
  const rows=pks.map(pk=>M.pp.get(pk)).filter(Boolean)
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map(p=>[p.name, compName(p.k)==="\u2014"?"":compName(p.k)]);
  /* Word turns each cell into a paragraph and gives it the document's space-after,
     which is where the gaps come from — so each cell carries its own zero-margin paragraph. */
  const F="font-family:Aptos,'Aptos Display',Calibri,Arial,sans-serif;font-size:11.0pt";
  const P="margin:0cm;margin-bottom:0cm;line-height:107%;"+F;
  const PH="margin:0cm;margin-bottom:0cm;line-height:107%;font-weight:bold;"+F;
  const CELL="border:solid #BFBFBF 1.0pt;padding:1.0pt 5.0pt;vertical-align:top";
  const HEAD=CELL+";background:#F2F2F2";
  const td=(v,h)=>"<"+(h?"th":"td")+' style="'+(h?HEAD:CELL)+'"><p style="'+(h?PH:P)+'">'+
    esc2(v)+"</p></"+(h?"th":"td")+">";
  const html='<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;'+F+'">'+
    "<thead><tr>"+td("Name",1)+td("Company",1)+"</tr></thead><tbody>"+
    rows.map(r=>"<tr>"+td(r[0])+td(r[1])+"</tr>").join("")+
    "</tbody></table>";
  const text=["Name\tCompany"].concat(rows.map(r=>r[0]+"\t"+r[1])).join("\n");
  return {html:html,text:text,rows:rows};
}
async function putOnClipboard(html,text){
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":new Blob([html],{type:"text/html"}),
        "text/plain":new Blob([text],{type:"text/plain"})})]);
      return true;
    }
  }catch(e){}
  try{
    const d=document.createElement("div");
    d.setAttribute("contenteditable","true");
    d.style.cssText="position:fixed;left:-99999px;top:0;opacity:0";
    d.innerHTML=html;
    document.body.appendChild(d);
    const r=document.createRange(); r.selectNodeContents(d);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const okc=document.execCommand("copy");
    sel.removeAllRanges(); d.remove();
    if(okc) return true;
  }catch(e){}
  return false;
}
function showFallback(host,html){
  const old=$(".copyfall",host); if(old) old.remove();
  const box=el("div","copyfall");
  box.appendChild(el("div","hint","Your browser blocked the copy. The table below is already selected \u2014 press Ctrl+C (Cmd+C on a Mac), then paste into Word."));
  const w=el("div","copyfall-t"); w.innerHTML=html; box.appendChild(w);
  host.appendChild(box);
  try{ const r=document.createRange(); r.selectNodeContents(w);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }catch(e){}
}
function copyBtn(getPks,host,label){
  const b=el("button","btn ghost",label||"Copy for the Minutes"); b.type="button";
  b.title="Copies a Name and Company table you can paste straight into Word";
  b.addEventListener("click",async()=>{
    const pks=getPks();
    if(!pks.length){ toast("Nobody is marked present yet.",true); return; }
    const t=attendanceTable(pks);
    const okc=await putOnClipboard(t.html,t.text);
    if(okc){ b.textContent="Copied \u2014 Paste Into Word"; toast(n(t.rows.length)+" names copied as a table.");
      setTimeout(()=>{ b.textContent=label||"Copy for the Minutes"; },3500); }
    else showFallback(host||b.parentNode,t.html);
  });
  return b;
}
function isCancelled(m){ return !!(m&&m.cancelled); }
function cancelledOn(gk,d){ const m=findMeeting(gk,d); return isCancelled(m)?m:null; }
function findMeeting(gk,d){ const i=(M.byG.get(gk)||[]).find(x=>M.mt[x].d===d); return i==null?null:M.mt[i]; }
function openMeeting(gk,d){
  const m=findMeeting(gk,d), g=M.gr.get(gk);
  if(!m) return;
  openPane((g?g.name:gk), fmtD(d)+" \u00b7 "+(isCancelled(m)?"Cancelled":n(m.p.size)+" attended"), ()=>{
    const box=el("div");
    const sm=m.sum?((M.summits.get(m.sum)||{}).name||""):"";
    if(isCancelled(m)){ const cb=el("div","banner warn-b");
      cb.innerHTML="<b>This meeting was cancelled.</b> No attendance is counted for it"+
        (m.label?" \u2014 \u201c"+esc(m.label)+"\u201d":"")+".";
      box.appendChild(cb); }
    box.appendChild(facts([
      ["Date",fmtD(d)],[isCancelled(m)?"Status":"Attended",isCancelled(m)?"Cancelled":n(m.p.size)],
      ["Where It Came From",m.src==="db"?"Logged in this tool":"Tracker workbooks"],
      ["Logged By",m.by||"\u2014"],
      ["Logged On",m.at?fmtD(String(m.at).slice(0,10)):"\u2014"],
      ["First Recorded By",(m.createdBy&&m.createdBy!==m.by)?m.createdBy:""],
      ["Summit",sm],["Note",m.label||""]
    ]));
    if(CANWRITE){
      const row=el("div","btnrow"); row.style.marginTop="2px";
      const b=el("button","btn",isCancelled(m)?"Open It to Reopen or Edit":"Open This Meeting to Edit"); b.type="button";
      b.addEventListener("click",()=>{ closePane(); openLog(gk,d); });
      row.appendChild(b);
      if(m.src==="db"){
        const rm=el("button","btn danger","Remove This Meeting"); rm.type="button";
        let armed=false;
        rm.addEventListener("click",async()=>{
          if(!armed){ armed=true; rm.textContent="Remove It \u2014 Click Again to Confirm";
            setTimeout(()=>{ armed=false; rm.textContent="Remove This Meeting"; },6000); return; }
          rm.disabled=true; rm.textContent="Removing\u2026";
          const okr=await removeDoc("meetings","m_"+gk+"_"+d.replace(/-/g,""),{gk:gk,d:d});
          rm.disabled=false; rm.textContent="Remove This Meeting";
          if(!okr) return;
          const i=(M.byG.get(gk)||[]).find(x=>M.mt[x].d===d);
          if(i!=null) M.mt.splice(i,1);
          DRAFTS.delete(gk+"|"+d);
          buildIndexes(); closePane();
          renderToday(); renderAll(true);
          toast("That meeting was removed.");
        });
        row.appendChild(rm);
      }
      box.appendChild(row);
      box.appendChild(el("div","hint",m.src==="db"
        ? "It opens with everyone currently marked present. Saving again records you as the person who last changed it, and keeps whoever first recorded it. Removing it undoes a meeting logged on the wrong date \u2014 it only affects what was entered here, never the imported history."
        : "It opens with everyone currently marked present. Saving again records you as the person who last changed it. This meeting came from the tracker workbooks, so it cannot be removed \u2014 only corrected."));
    }
    if(!isCancelled(m)){
      const cw=el("div"); cw.style.cssText="margin:2px 0 14px";
      const crow=el("div","btnrow"); crow.style.marginTop="0";
      crow.appendChild(copyBtn(()=>[...m.p],cw));
      cw.appendChild(crow);
      cw.appendChild(el("div","hint","Copies a Name and Company table for your meeting minutes. It pastes into Word as a real table you can restyle."));
      box.appendChild(cw);
    }
    if(!isCancelled(m)) box.appendChild(sect("Who Was There",m.p.size,()=>{
      const w=el("div","tblwrap"), t=el("table","tbl"), th=el("thead"), tr=el("tr");
      ["Name","Company","Category"].forEach(x=>tr.appendChild(el("th",null,x)));
      th.appendChild(tr); t.appendChild(th);
      if(CANWRITE) tr.appendChild(el("th",null,""));
      const tb=el("tbody");
      [...m.p].map(pk=>M.pp.get(pk)).filter(Boolean)
        .sort((a,b)=>a.name.localeCompare(b.name)).forEach(pp=>{
          const r=el("tr","clik");
          const nmd=el("td",null,pp.name);
          nmd.addEventListener("click",()=>openPerson(pp.k)); r.appendChild(nmd);
          const cod=el("td",null,compNameAt(pp.k,m.d));
          cod.addEventListener("click",()=>openPerson(pp.k)); r.appendChild(cod);
          const cad=el("td",null,catAt(pp.k,m.d));
          cad.addEventListener("click",()=>openPerson(pp.k)); r.appendChild(cad);
          /* put the wrong person in a meeting? take them straight back out from here */
          if(CANWRITE){
            const xd=el("td"); xd.style.textAlign="right";
            const xb=el("button","rowx"); xb.type="button"; xb.textContent="Remove";
            xb.title="Take "+pp.name+" off this meeting";
            let armed=false;
            xb.addEventListener("click",ev=>{ ev.stopPropagation();
              if(!armed){ armed=true; xb.textContent="Remove \u2014 Sure?"; xb.classList.add("arm");
                setTimeout(()=>{ if(!xb.isConnected) return; armed=false;
                  xb.textContent="Remove"; xb.classList.remove("arm"); },5000); return; }
              dropFromMeeting(m.gk,m.d,pp.k,pp.name);
            });
            xd.appendChild(xb); r.appendChild(xd);
          }
          tb.appendChild(r); });
      t.appendChild(tb); w.appendChild(t); return w;
    },true));
    if(!isCancelled(m)) box.appendChild(sect("Category Mix in the Room",null,()=>{
      const by=new Map();
      m.p.forEach(pk=>{ const c=catAt(pk,m.d); by.set(c,(by.get(c)||0)+1); });
      const arr=[...by.entries()].sort((a,b)=>b[1]-a[1]);
      return barList(arr.map(([c,v],i)=>({label:c,value:v,color:ramp(i,arr.length)})),{labelWidth:"200px"});
    }));
    return box;
  });
}

/* ---- group pane ---- */
function openGroup(gk,openSched){
  const g=M.gr.get(gk); if(!g) return;
  const idxs=inIdx(M.byG.get(gk));
  const ppl=new Map(), cos=new Map(), cats=new Map(); let recs=0;
  idxs.forEach(i=>{ const m=M.mt[i]; recs+=m.p.size;
    m.p.forEach(pk=>{ ppl.set(pk,(ppl.get(pk)||0)+1);
      const ck=ckAt(pk,m.d); if(ck) cos.set(ck,(cos.get(ck)||0)+1);
      const c=catAt(pk,m.d); cats.set(c,(cats.get(c)||0)+1); }); });
  openPane(g.name, gtypeShort(g.type)+(g.archived?" · Archived":g.hold?" · On Hold":"")+(g.facilitator?" · "+g.facilitator:"")+(rangeOn()?" · "+rangeLabel():""), ()=>{
    const box=el("div");
    const st=el("span","pill "+(g.archived?"arch":g.hold?"hold":"live"),
      g.archived?"Archived":g.hold?"On Hold":"Active");
    box.appendChild(facts([
      ["Type",g.type],["Status",st],["Facilitator",g.facilitator||"—"],
      ["Meetings",n(idxs.length)],["People",n(ppl.size)],["Attendance Records",n(recs)],
      ["First Meeting",fmtD(g.first)],["Last Meeting",fmtD(g.last)],
      ["Average per Meeting",idxs.length?Math.round(recs/idxs.length):0]
    ]));
    box.appendChild(sect("Who Attends Most",ppl.size,()=>barList(
      [...ppl.entries()].sort((a,b)=>b[1]-a[1]).slice(0,25).map(([pk,v])=>{ const p=M.pp.get(pk);
        return {label:p?p.name:pk,sub:compName(pk),value:v,color:"var(--c1)",go:()=>openPerson(pk)};}),
      {labelWidth:"190px",pct:false})));
    box.appendChild(sect("Companies in the Room",cos.size,()=>barList(
      [...cos.entries()].sort((a,b)=>b[1]-a[1]).slice(0,25).map(([ck,v])=>{ const c=M.co.get(ck);
        return {label:c?c.name:ck,sub:c?c.cat:"",value:v,color:"var(--c2)",go:()=>openCompany(ck)};}),
      {labelWidth:"190px",pct:false})));
    box.appendChild(sect("Category Mix",null,()=>{
      const arr=[...cats.entries()].sort((a,b)=>b[1]-a[1]);
      return barList(arr.map(([c,v],i)=>({label:c,value:v,color:ramp(i,arr.length)})),{labelWidth:"190px"});
    }));
    box.appendChild(sect("Meeting History",idxs.length,()=>mtgList(idxs,false)));
    if(CANWRITE&&!g.archived) box.appendChild(sect(g.hold?"Start This Workgroup Up Again":"Put This Workgroup on Hold",null,()=>{
      const d=el("div");
      d.appendChild(el("div","hint",g.hold
        ? "It is on hold, so it is off the facilitator cards, the Today box and every still-to-log count. Starting it up again puts it back on those screens from its usual cadence."
        : "For a workgroup that still exists but has paused \u2014 between phases, waiting on a decision, or just not meeting for a while. It stops asking to be logged and drops out of the Today box, but it stays an active workgroup: it keeps its facilitator, its cadence and its place in the totals, and it is not archived. Attendance can still be logged against it if a meeting does happen."));
      const row=el("div","btnrow");
      const bt=el("button","btn"+(g.hold?"":" ghost"),g.hold?"Start It Up Again":"Put It on Hold");
      bt.type="button";
      bt.addEventListener("click",async()=>{ bt.disabled=true;
        bt.textContent=g.hold?"Starting\u2026":"Pausing\u2026";
        const r2=await setHold(gk,!g.hold,()=>{ renderAll(true); openGroup(gk); });
        if(!r2){ bt.disabled=false; bt.textContent=g.hold?"Start It Up Again":"Put It on Hold"; } });
      row.appendChild(bt); d.appendChild(row);
      return d;
    }));
    if(CANWRITE) box.appendChild(sect(g.archived?"Bring This Workgroup Back":"Archive This Workgroup",null,()=>{
      const d=el("div");
      d.appendChild(el("div","hint",g.archived
        ? "It is archived, so it is off the facilitator cards and the still-to-log counts. Bringing it back puts it on those screens again. Its history has been counted all along either way."
        : "For a workgroup that has stopped meeting. It comes off the facilitator cards, the A\u2013Z list and every still-to-log count \u2014 but nothing is removed: its "+
          n(idxs.length)+" meeting"+(idxs.length===1?"":"s")+" and "+n(recs)+" attendance record"+(recs===1?"":"s")+
          " stay in every total and drill-down, and it can be brought back at any time."));
      const row=el("div","btnrow");
      const bt=el("button","btn"+(g.archived?"":" ghost"),g.archived?"Bring It Back":"Archive It");
      bt.type="button";
      bt.addEventListener("click",async()=>{ bt.disabled=true;
        bt.textContent=g.archived?"Restoring\u2026":"Archiving\u2026";
        const r2=await setArchived(gk,!g.archived,()=>{ renderAll(true); openGroup(gk); });
        if(!r2){ bt.disabled=false; bt.textContent=g.archived?"Bring It Back":"Archive It"; } });
      row.appendChild(bt); d.appendChild(row);
      return d;
    }));
    if(CANWRITE) box.appendChild(sect("Meeting Schedule and Settings",null,()=>{
      const d=el("div"), sc=(M.sched&&M.sched[gk])||{};
      const grid=el("div","ctrls");
      function fld(lab,node,wide){ const f=el("div","fld"+(wide?" wide":"")); f.appendChild(el("label",null,lab));
        f.appendChild(node); grid.appendChild(f); return node; }
      function inp(type,val,ph){ const i=el("input"); i.type=type; i.value=val||"";
        if(ph) i.placeholder=ph; return i; }
      function sel(opts,val){ const t=el("select");
        opts.forEach(([v,l])=>{ const o=el("option",null,l); o.value=v; if(String(v)===String(val))o.selected=true; t.appendChild(o); });
        t.style.cssText="width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;background:var(--surface);color:var(--ink)";
        return t; }

      const iFac=fld("Facilitator",inp("text",g.facilitator,"Who runs this group"));
      const iSt =fld("Status",sel([["0","Active"],["h","On Hold"],["1","Archived"]],
        g.archived?"1":g.hold?"h":"0"));
      const iDay=fld("Meeting Day",sel([["","\u2014 Not Scheduled \u2014"],["Monday","Monday"],["Tuesday","Tuesday"],
        ["Wednesday","Wednesday"],["Thursday","Thursday"],["Friday","Friday"]],sc.day||""));
      const cur=spanOf(sc)||[];
      const pad=m=>m==null?"":String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
      const iFrom=fld("Starts (ET)",inp("time",sc.st||pad(cur[0])));
      const iTo  =fld("Ends (ET)",inp("time",sc.en||pad(cur[1])));
      const iZoom=fld("Zoom Link",inp("text",sc.zoom,"https://mba-org.zoom.us/j/\u2026"),true);

      const hf=el("div","fld wide"); hf.appendChild(el("label",null,"How Often"));
      const box2=el("div"); box2.style.cssText="display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center";
      const every=el("input"); every.type="checkbox";
      const wk=(sc.rule&&sc.rule.weeks)||[];
      every.checked=(wk==="*");
      const lw=el("label","tgl"); lw.style.cssText="display:flex;gap:7px;font-size:13px;cursor:pointer";
      lw.append(every,document.createTextNode("Every Week")); box2.appendChild(lw);
      const boxes=[1,2,3,4].map(nn=>{
        const c=el("input"); c.type="checkbox"; c.checked=(wk!=="*"&&wk.indexOf(nn)>=0);
        const l=el("label","tgl"); l.style.cssText="display:flex;gap:7px;font-size:13px;cursor:pointer";
        l.append(c,document.createTextNode(ORD[nn])); box2.appendChild(l); return c; });
      hf.appendChild(box2);
      hf.appendChild(el("div","hint","Tick Every Week, or tick which weeks of the month this group meets \u2014 1st and 3rd, say."));
      grid.appendChild(hf);
      d.appendChild(grid);

      const pv=el("div","banner info"); d.appendChild(pv);
      const sv=el("button","btn","Save Schedule and Settings"); sv.type="button";
      function rule(){
        if(!iDay.value) return null;
        const dw={Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5}[iDay.value];
        if(every.checked) return {dow:dw,weeks:"*"};
        const w=[1,2,3,4].filter((_,i)=>boxes[i].checked);
        return w.length?{dow:dw,weeks:w}:null;
      }
      function nextOn(r){
        if(!r) return "";
        const n0=etNow();
        for(let i=0;i<70;i++){ const dd=new Date(n0.getTime()); dd.setDate(dd.getDate()+i);
          if(meetsOn(r,dd)) return DAYS[dd.getDay()]+", "+MONF[dd.getMonth()]+" "+dd.getDate(); }
        return "";
      }
      function badTimes(){
        const a=hm(iFrom.value), b2=hm(iTo.value);
        return (a!=null&&b2!=null&&b2<=a);
      }
      function preview(){
        const r=rule(), t=fmtSpan(iFrom.value,iTo.value), bad=badTimes();
        pv.classList.toggle("warn-b",bad);
        if(bad){
          pv.innerHTML="<b>The end time is not after the start time.</b> "+
            esc(fmtClock(hm(iFrom.value)))+" to "+esc(fmtClock(hm(iTo.value)))+
            " cannot be saved \u2014 fix the times and this will clear.";
          sv.disabled=true; return;
        }
        sv.disabled=false;
        if(!r){ pv.innerHTML="<b>Not on the schedule.</b> Pick a day and how often, and this group appears in the Today band."; return; }
        const nx=nextOn(r);
        pv.innerHTML="<b>"+esc(cadenceText(r,iDay.value))+(t?", "+esc(t)+" ET":"")+".</b>"+
          (nx?" Next on "+esc(nx)+".":"");
      }
      [iDay,iFrom,iTo,every].concat(boxes).forEach(x=>x.addEventListener("change",preview));
      every.addEventListener("change",()=>{ boxes.forEach(c=>{ c.disabled=every.checked;
        c.parentNode.style.opacity=every.checked?".45":"1"; }); });
      boxes.forEach(c=>{ c.disabled=every.checked; c.parentNode.style.opacity=every.checked?".45":"1"; });
      preview();

      const row=el("div","btnrow");
      sv.addEventListener("click",async()=>{
        if(badTimes()){ toast("The end time has to be after the start time.",true); return; }
        sv.disabled=true;
        const r=rule(), t=fmtSpan(iFrom.value,iTo.value);
        const writes=[{c:"groups",id:gk,data:{name:g.name,type:g.type,
          facilitator:iFac.value.trim(),archived:iSt.value==="1",hold:iSt.value==="h"}}];
        if(r) writes.push({c:"sched",id:gk,data:{fac:iFac.value.trim(),day:iDay.value,
          st:iFrom.value||"",en:iTo.value||"",time:t,cadence:cadenceText(r,iDay.value),
          zoom:iZoom.value.trim(),status:"Active",rule:r,removed:false}});
        else writes.push({c:"sched",id:gk,data:{removed:true}});
        const okr=await saveMany(writes);
        sv.disabled=false;
        if(!okr) return;
        g.facilitator=iFac.value.trim(); g.archived=iSt.value==="1"; g.hold=iSt.value==="h";
        if(r) M.sched[gk]={fac:g.facilitator,day:iDay.value,st:iFrom.value||"",en:iTo.value||"",
          time:t,cadence:cadenceText(r,iDay.value),zoom:iZoom.value.trim(),status:"Active",rule:r};
        else delete M.sched[gk];
        renderToday(); tickToday(); renderAll(); openGroup(gk); toast("Saved.");
      });
      row.appendChild(sv); d.appendChild(row);
      d.appendChild(el("div","hint","Times are Eastern, the way the Zoom schedule keeps them. Archiving a group hides it from the active lists; its meetings and people stay in every total."));
      return d;
    },!!openSched));
    return box;
  });
}

/* ---- person pane ---- */
function openPerson(pk){
  const p=M.pp.get(pk); if(!p) return;
  const idxs=inIdx(M.byP.get(pk));
  const grps=new Map(); let first="",last="";
  idxs.forEach(i=>{ const m=M.mt[i]; grps.set(m.gk,(grps.get(m.gk)||0)+1);
    if(!first||m.d<first)first=m.d; if(!last||m.d>last)last=m.d; });
  openPane(p.name, compName(pk)+" · "+catOf(pk)+(rangeOn()?" · "+rangeLabel():""), ()=>{
    const box=el("div");
    box.appendChild(facts([
      ["Company",(()=>{ const b=el("button","linkb",compName(pk)); b.type="button";
        if(p.ck) b.addEventListener("click",()=>openCompany(p.ck)); return b; })()],
      ["Category",catOf(pk)],["Role",p.role||"—"],
      ["Meetings Attended",n(idxs.length)],["Groups",n(grps.size)],
      ["First Seen",fmtD(first)],["Last Seen",fmtD(last)]
    ]));
    /* a merge is a decision somebody made — say so on the record it ended up on */
    const folded=(M.merges||[]).filter(r=>r.into===pk);
    if(folded.length){
      const b=el("div","banner");
      const bits=folded.map(r=>"<b>"+esc2(r.name)+"</b>"+
        (r.by?" by "+esc2(r.by):"")+(r.at?" on "+esc2(fmtD(String(r.at).slice(0,10))):""));
      b.innerHTML="<b>Records folded into this one.</b> "+bits.join("; ")+
        ". Their meetings are counted above and either name still finds this person.";
      box.appendChild(b);
    }
    box.appendChild(sect("Groups They Attend",grps.size,()=>barList(
      [...grps.entries()].sort((a,b)=>b[1]-a[1]).map(([gk,v])=>{ const g=M.gr.get(gk);
        return {label:g?g.name:gk,sub:(g?gtypeShort(g.type):"")+(g&&g.archived?" · Archived":""),
                value:v,color:"var(--c1)",go:()=>openGroup(gk)};}),{labelWidth:"210px",pct:false})));
    box.appendChild(sect("Attendance History",idxs.length,()=>mtgList(idxs,true)));
    if(CANWRITE) box.appendChild(sect("Name, Company and Job Moves",null,()=>{
      const d=el("div");
      d.appendChild(personEditor(pk,()=>{ renderAll(true); openPerson(pk); }));
      d.appendChild(el("div","hint","The company is what gives this person a category — categories always follow the company, so they never have to be picked by hand."));
      return d;
    }));
    if(CANWRITE) box.appendChild(sect("Remove This Record",null,()=>{
      const d=el("div");
      const cnt=(M.byP.get(pk)||[]).length;
      d.appendChild(el("div","hint","For a record that was never a person — a name entered by "+
        "mistake, a set of initials, a stray line from the trackers. Removing it takes it out of "+
        "every meeting it is on, so the attendance total drops by "+n(cnt)+". It cannot be undone "+
        "from this page. If someone really was in the room and you just cannot say who, set them "+
        "aside instead — that keeps the attendance and only takes them off the Issues list."));
      const row=el("div","btnrow");
      const sa=el("button","btn ghost",SETASIDE.has(pk)?"Put Back on the Issues List":"Set Aside — Not a Person");
      sa.type="button";
      sa.addEventListener("click",async()=>{ sa.disabled=true;
        const fn=SETASIDE.has(pk)?unsetAside:setAside;
        const r2=await fn(pk,()=>{ renderAll(true); openPerson(pk); });
        if(!r2) sa.disabled=false; });
      row.appendChild(sa);
      const rm=el("button","btn danger","Remove This Record"); rm.type="button";
      let armed=false;
      rm.addEventListener("click",async()=>{
        if(!armed){ armed=true;
          rm.textContent=cnt?("Remove + "+n(cnt)+" Attendance Record"+(cnt===1?"":"s")+" — Click Again"):"Remove — Click Again";
          setTimeout(()=>{ if(!rm.isConnected) return; armed=false; rm.textContent="Remove This Record"; },7000);
          return; }
        rm.disabled=true; rm.textContent="Removing…";
        const r2=await removePerson(pk,()=>{ try{ closePane(); }catch(e){} renderAll(true); });
        if(!r2){ rm.disabled=false; armed=false; rm.textContent="Remove This Record"; } });
      row.appendChild(rm);
      d.appendChild(row);
      return d;
    }));
    return box;
  });
}

/* ---- company pane ---- */
function openCompany(ck){
  const c=M.co.get(ck); if(!c) return;
  const ppl=M.coPeople.get(ck)||new Set();
  const grps=new Map(), per=new Map(); let recs=0,first="",last="";
  M.mt.forEach((m,i)=>{ if(!inRange(m.d)||isCancelled(m)) return; let hit=0;
    m.p.forEach(pk=>{ if(ckAt(pk,m.d)===ck){ hit++; per.set(pk,(per.get(pk)||0)+1); } });
    if(hit){ recs+=hit; grps.set(m.gk,(grps.get(m.gk)||0)+hit);
      if(!first||m.d<first)first=m.d; if(!last||m.d>last)last=m.d; } });
  openPane(c.name, c.cat+" · "+n(ppl.size)+" people"+(rangeOn()?" · "+rangeLabel():""), ()=>{
    const box=el("div");
    box.appendChild(facts([
      ["Category",CANWRITE?catSelect(c.cat,async v=>{
        const okr=await saveDoc("companies",ck,{name:c.name,cat:v});
        if(okr){ c.cat=v; renderAll(); toast("Category saved."); } }):c.cat],
      ["People",n(ppl.size)],["Groups",n(grps.size)],["Attendance Records",n(recs)],
      ["First Seen",fmtD(first)],["Last Seen",fmtD(last)]
    ]));
    box.appendChild(el("div","hint","This category is the one Member 360 uses. Change it here and every person at this company, every chart and the Member 360 feed all follow — nothing is categorized by hand."));
    box.appendChild(sect("People From This Company",per.size,()=>barList(
      [...per.entries()].sort((a,b)=>b[1]-a[1]).map(([pk,v])=>{ const p=M.pp.get(pk);
        return {label:p?p.name:pk,value:v,color:"var(--c1)",go:()=>openPerson(pk)};}),{labelWidth:"200px",pct:false})));
    box.appendChild(sect("Groups They Take Part In",grps.size,()=>barList(
      [...grps.entries()].sort((a,b)=>b[1]-a[1]).map(([gk,v])=>{ const g=M.gr.get(gk);
        return {label:g?g.name:gk,sub:(g?gtypeShort(g.type):"")+(g&&g.archived?" · Archived":""),
                value:v,color:"var(--c2)",go:()=>openGroup(gk)};}),{labelWidth:"210px",pct:false})));
    return box;
  });
}

<script>
"use strict";
/* ======================= company picker ======================= */
/* Fold one person's record into another: every meeting the duplicate attended becomes the
   keeper's, every name either has gone by is kept so searches still find them, and the duplicate
   record goes. Nothing is lost — the attendance moves, it is never deleted. */
async function mergePeople(dupKey,keepKey,after,opts){
  const dup=M.pp.get(dupKey), keep=M.pp.get(keepKey);
  if(!dup||!keep||dupKey===keepKey) return false;
  /* what the kept record's own company was before any of this — a record with none takes
     the other's below, and taking the merge back has to put it the way it was */
  const keepWas={ck:keep.ck||"",hist:(keep.hist||[]).map(e=>({ck:e.ck||"",from:e.from||""}))};
  const idxs=(M.byP.get(dupKey)||[]).slice();
  const writes=[], now=new Date().toISOString(), me=whoAmI();
  const touched=[];
  idxs.forEach(i=>{ const m=M.mt[i];
    const p=new Set(m.p); p.delete(dupKey); p.add(keepKey);
    writes.push({c:"meetings",id:"m_"+m.gk+"_"+String(m.d).replace(/-/g,""),
      data:{gk:m.gk,d:m.d,sum:m.sum||"",label:m.label||"",cancelled:!!m.cancelled,
        p:[...p],by:me,byId:(USER&&USER.id)||"",at:now,
        createdBy:m.createdBy||m.by||me,createdAt:m.createdAt||m.at||now}});
    touched.push({i:i,p:p});
  });
  /* the keeper answers to every name either of them used */
  const alt=(keep.alt||[]).slice();
  [nk(keep.name),nk(dup.name),dupKey].concat(dup.alt||[]).forEach(a=>{
    if(a&&alt.indexOf(a)<0) alt.push(a); });
  /* One person who changed firms: keep both companies with the date they moved, so the
     earlier meetings still count for the old one. */
  /* the record being kept may be the one with no company on it \u2014 take the other's
     rather than leaving every meeting counting for nobody */
  const keepHist=histOf(keep).filter(e=>e.ck);
  const dupHist=histOf(dup).filter(e=>e.ck);
  const hist=(opts&&opts.hist&&opts.hist.length)
    ? opts.hist.map(e=>({ck:e.ck,from:e.from||""}))
    : (keepHist.length?keepHist:dupHist).map(e=>({ck:e.ck,from:e.from||""}));
  const nowCk=hist.length?hist[hist.length-1].ck:(keep.ck||dup.ck||"");
  writes.push({c:"people",id:keepKey,data:{name:keep.name,ck:nowCk,role:keep.role||dup.role||"",
    hist:hist,alt:alt}});
  /* The duplicate may have come from the imported history, which is reloaded every time.
     Deleting the shared-data record would not remove them — so leave a marker saying
     "this one is now that one", which the loader applies over the history. */
  writes.push({c:"people",id:dupKey,data:{name:dup.name,mergedInto:keepKey,
    mergedBy:whoAmI(),mergedAt:new Date().toISOString(),
    prevCk:keepWas.ck,prevHist:keepWas.hist}});
  const okr=await saveMany(writes);
  if(!okr) return false;
  touched.forEach(t=>{ M.mt[t.i].p=t.p; M.mt[t.i].src="db"; });
  M.pp.set(keepKey,{k:keepKey,name:keep.name,ck:nowCk,role:keep.role||dup.role||"",
    hist:hist,alt:alt,
    addedBy:keep.addedBy||"",addedAt:keep.addedAt||""});
  M.pp.delete(dupKey);
  (M.merges=M.merges||[]).push({k:dupKey,name:dup.name,into:keepKey,by:me,at:now,n:idxs.length,
    prev:keepWas});
  buildIndexes();
  if(after) after();
  toast(dup.name+" folded into "+keep.name+" \u2014 "+n(idxs.length)+" meeting"+
    (idxs.length===1?"":"s")+" moved across"+
    ((opts&&opts.hist&&opts.hist.length>1)
      ? ", and the earlier ones still count for "+coNameOf(opts.hist[0].ck)
      : "")+". Searches for either name find them.");
  return true;
}

/* The same person at two firms. Which company a meeting counts for depends on when it
   happened, so before folding the two together the tool asks whether this was a move
   (keep the old firm's meetings with it) or a mistake (one company was simply wrong). */
function datesOf(pk){ const ds=(M.byP.get(pk)||[]).map(i=>M.mt[i].d).filter(Boolean).sort();
  return {first:ds[0]||"",last:ds[ds.length-1]||"",n:ds.length}; }
function askMove(row,keep,other,after){
  const old2=$(".movebox",row); if(old2) old2.remove();
  const dk=datesOf(keep.k), dd=datesOf(other.k);
  /* whichever record's meetings run later is where they are now */
  const laterIsKeep=(dk.last||"")>=(dd.last||"");
  const fromCk=laterIsKeep?other.ck:keep.ck;
  const toCk=laterIsKeep?keep.ck:other.ck;
  const suggested=(laterIsKeep?dk.first:dd.first)||todayISO();
  const box=el("div","movebox");
  const h=el("div","mb-h");
  h.innerHTML="Keeping <b>"+esc2(keep.name)+"</b>, and these two records sit at different companies. Which is it?";
  box.appendChild(h);
  const opts=el("div","mb-opts");
  const nm="mv"+Math.random().toString(36).slice(2,8);
  const mk=(v,label,checked)=>{
    const l=el("label","mb-opt");
    const r=el("input"); r.type="radio"; r.name=nm; r.value=v; if(checked) r.checked=true;
    l.appendChild(r); const sp=el("span"); sp.innerHTML=label; l.appendChild(sp);
    opts.appendChild(l); return r; };
  const rMove=mk("move","They changed company \u2014 count the earlier meetings for <b>"+
    esc2(coNameOf(fromCk))+"</b> and the later ones for <b>"+esc2(coNameOf(toCk))+"</b>",true);
  mk("fix","One of these was wrong \u2014 count all "+n(dk.n+dd.n)+" meetings for <b>"+
    esc2(coNameOf(keep.ck))+"</b>",false);
  box.appendChild(opts);
  const df=el("div","fld mb-when"); df.appendChild(el("label",null,"They Moved On"));
  const di=el("input"); di.type="date"; di.value=suggested; df.appendChild(di);
  df.appendChild(el("div","hint","Suggested from the dates in the trackers \u2014 their first meeting under "+
    coNameOf(toCk)+". Change it if you know better."));
  box.appendChild(df);
  const sync=()=>{ df.style.display=rMove.checked?"":"none"; };
  opts.addEventListener("change",sync); sync();
  const br=el("div","btnrow");
  const go2=el("button","btn","Fold Them Together"); go2.type="button";
  const cx=el("button","btn ghost","Cancel"); cx.type="button";
  cx.addEventListener("click",()=>box.remove());
  go2.addEventListener("click",async()=>{
    go2.disabled=true; cx.disabled=true; go2.textContent="Folding\u2026";
    const hist=rMove.checked
      ? [{ck:fromCk,from:""},{ck:toCk,from:di.value||suggested}]
      : [{ck:keep.ck,from:""}];
    const ok2=await withProgress((d2,t2)=>{
      go2.textContent=(t2&&d2<t2)?("Folding\u2026 "+n(d2)+" of "+n(t2)):"Finishing\u2026";
    },()=>mergePeople(other.k,keep.k,after,{hist:hist}));
    if(!ok2){ go2.disabled=false; cx.disabled=false; go2.textContent="Fold Them Together"; }
  });
  br.appendChild(go2); br.appendChild(cx); box.appendChild(br);
  row.appendChild(box);
  try{ box.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){}
}

/* Taking a merge back. The imported attendance is still on file untouched, so for every
   meeting the kept record now sits on, the workbooks say whether it was really the other
   one. Anything logged in the tool since a merge is left where it is. */
async function unmergePeople(dupKey,keepKey,dupName,after,prev){
  const keep=M.pp.get(keepKey); if(!keep) return false;
  const idxs=(M.byP.get(keepKey)||[]).slice();
  const writes=[], now=new Date().toISOString(), me=whoAmI();
  const touched=[]; let moved=0;
  idxs.forEach(i=>{ const m=M.mt[i], p0=m.p0;
    if(!p0||!p0.has(dupKey)||m.p.has(dupKey)) return;   /* really the kept one's meeting */
    const np=new Set(m.p);
    np.add(dupKey);
    /* the handful they both attended keep both; the rest go back to the other record */
    if(!p0.has(keepKey)) np.delete(keepKey);
    moved++;
    writes.push({c:"meetings",id:"m_"+m.gk+"_"+String(m.d).replace(/-/g,""),
      data:{gk:m.gk,d:m.d,sum:m.sum||"",label:m.label||"",cancelled:!!m.cancelled,
        p:[...np],by:me,byId:(USER&&USER.id)||"",at:now,
        createdBy:m.createdBy||m.by||me,createdAt:m.createdAt||m.at||now}});
    touched.push({i:i,p:np}); });
  /* the kept record stops answering to the other name */
  const dn=nk(dupName||dupKey);
  const alt=(keep.alt||[]).filter(a=>a!==dupKey&&a!==dn);
  /* and its company goes back to its own. A record with no company takes the other's when
     they are folded together — left alone, it would keep it, and never show up on the
     people-with-no-company list again. Older folds have no record of what it was, so the
     imported trackers answer for them. */
  const was=prev||(BASEPP.has(keepKey)?{ck:BASEPP.get(keepKey).ck||"",hist:[]}:null);
  const bkCk=was?(was.ck||""):(keep.ck||"");
  const bkHist=(was&&was.hist&&was.hist.length)
    ? was.hist.map(e=>({ck:e.ck||"",from:e.from||""}))
    : (was?[]:histOf(keep).map(e=>({ck:e.ck,from:e.from||""})));
  writes.push({c:"people",id:keepKey,data:{name:keep.name,ck:bkCk,role:keep.role||"",
    hist:bkHist,alt:alt}});
  const okr=await saveMany(writes);
  if(!okr) return false;
  /* and the marker that folded them together goes */
  const gone=await removeDoc("people",dupKey);
  if(!gone) return false;
  touched.forEach(t=>{ M.mt[t.i].p=t.p; M.mt[t.i].src="db"; });
  keep.alt=alt; keep.ck=bkCk; keep.hist=bkHist;
  /* put them back on the roster now, as the imported history has them */
  if(!M.pp.has(dupKey)) M.pp.set(dupKey,Object.assign({k:dupKey,name:dupName||dupKey,ck:"",
    role:"",alt:[],addedBy:"",addedAt:""},BASEPP.get(dupKey)||{}));
  MERGEDTO.delete(dupKey);
  M.merges=(M.merges||[]).filter(r=>r.k!==dupKey);
  buildIndexes();
  if(after) after();
  toast(dupName+" is a separate record again \u2014 "+n(moved)+" meeting"+(moved===1?"":"s")+
    " went back to them"+(bkCk?(", and "+keep.name+" is back at "+coNameOf(bkCk)):
      (", and "+keep.name+" has no company again"))+
    ". The pair is on the duplicates list once more.");
  return true;
}

/* A row that was never a person — initials, a stray line. Keep it and its attendance
   exactly as they are, but stop listing it as something to fix. */
async function setAside(pk,after){
  const p=M.pp.get(pk); if(!p) return false;
  const now=new Date().toISOString();
  const okr=await saveDoc("people",pk,{name:p.name,ck:p.ck||"",role:p.role||"",
    hist:histOf(p).map(e=>({ck:e.ck,from:e.from||""})),alt:p.alt||[],
    addedBy:p.addedBy||"",addedAt:p.addedAt||"",
    setAside:true,setAsideBy:whoAmI(),setAsideAt:now});
  if(!okr) return false;
  SETASIDE.set(pk,{by:whoAmI(),at:now,name:p.name});
  if(after) after();
  toast(p.name+" set aside \u2014 their attendance still counts, but they are off the list.");
  return true;
}
async function unsetAside(pk,after){
  const p=M.pp.get(pk); if(!p) return false;
  const okr=await saveDoc("people",pk,{name:p.name,ck:p.ck||"",role:p.role||"",
    hist:histOf(p).map(e=>({ck:e.ck,from:e.from||""})),alt:p.alt||[],

/* The last resort: the record is not a person, so it comes out of every meeting it is on.
   The attendance total drops by exactly that many — which is the point. */
async function removePerson(pk,after){
  const p=M.pp.get(pk); if(!p) return false;
  const idxs=(M.byP.get(pk)||[]).slice();
  const writes=[], now=new Date().toISOString(), me=whoAmI();
  const touched=[];
  idxs.forEach(i=>{ const m=M.mt[i];
    const np=new Set(m.p); np.delete(pk);
    writes.push({c:"meetings",id:"m_"+m.gk+"_"+String(m.d).replace(/-/g,""),
      data:{gk:m.gk,d:m.d,sum:m.sum||"",label:m.label||"",cancelled:!!m.cancelled,
        p:[...np],by:me,byId:(USER&&USER.id)||"",at:now,
        createdBy:m.createdBy||m.by||me,createdAt:m.createdAt||m.at||now}});
    touched.push({i:i,p:np}); });
  writes.push({c:"people",id:pk,data:{name:p.name,removed:true,
    removedBy:me,removedAt:now,removedN:idxs.length}});
  const okr=await saveMany(writes);
  if(!okr) return false;
  touched.forEach(t=>{ M.mt[t.i].p=t.p; M.mt[t.i].src="db"; });
  M.pp.delete(pk);
  GONE.set(pk,{by:me,at:now,name:p.name,n:idxs.length});
  buildIndexes();
  if(after) after();
  toast(p.name+" removed \u2014 "+n(idxs.length)+" attendance record"+
    (idxs.length===1?"":"s")+" taken out with them.");
  return true;
}

/* The opposite of a merge: somebody has looked at the pair and they are two people.
   Recorded so the pair is never offered again, and so the decision can be seen and reversed. */

  return true;
}
async function rejoinPair(key,after){

}

    const nm=ni.value.trim();
    if(!nm){ toast("A name cannot be blank.",true); return; }
    const moved=ck!==(p.ck||"");
    const renamed=nm!==p.name;
    if(!moved&&!renamed){ toast("Nothing has changed.",true); return; }
    /* typing an existing person's name would otherwise make two records of the same human */
    const clash=personKeyFor(nm);
    if(renamed&&clash&&clash!==pk){
      toast("MISMO already has a "+nm+". Open that record instead so the two are not split.",true); return; }
    sv.disabled=true; sv.textContent="Saving\u2026";

    const alt=(p.alt||[]).slice();
    /* every name they have gone by, their first one included — this is what makes a search,
       an import or a facilitator typing the old surname still land on them */
    if(renamed){ [nk(p.name),nk(nm)].forEach(a=>{ if(a&&alt.indexOf(a)<0) alt.push(a); }); }
    let hist=histOf(p).map(e=>({ck:e.ck,from:e.from||""}));
    if(moved){
      if(!ck) hist=[{ck:"",from:""}];
      else if(sel.value==="fix") hist=[{ck:ck,from:""}];
      else {
        const from=di.value||todayISO();
        hist=hist.filter(e=>String(e.from||"")!==from);
        hist.push({ck:ck,from:from});
        hist.sort((a,b)=>String(a.from).localeCompare(String(b.from)));
      }
    }
    const data={name:nm,ck:moved?ck:(p.ck||""),role:p.role||"",hist:hist,alt:alt,
      addedBy:p.addedBy||"",addedAt:p.addedAt||""};
    const okr=await saveDoc("people",pk,data);
    sv.disabled=false; sv.textContent="Save Changes";
    if(!okr) return;
    const before={name:p.name,ck:p.ck||"",hist:histOf(p).map(e=>({ck:e.ck,from:e.from||""})),alt:(p.alt||[]).slice()};
    M.pp.set(pk,{k:pk,name:nm,ck:data.ck,role:data.role,hist:hist,alt:alt});
    buildIndexes();
    if(after) after();
    const bits=[];
    if(renamed) bits.push("<b>"+esc(before.name)+"</b> is now <b>"+esc(nm)+"</b>");
    if(moved) bits.push("<b>"+esc(before.ck?coNameOf(before.ck):"no company")+"</b> \u2192 <b>"+
      esc(ck?coNameOf(ck):"no company")+"</b>"+
      (!ck?"":(sel.value==="fix"?" for every meeting":" from "+esc(fmtD(di.value||todayISO())))));
    setUndo(bits.join(", ")+".",async()=>{
      const okr2=await saveDoc("people",pk,{name:before.name,ck:before.ck,role:data.role,
        hist:before.hist,alt:before.alt});
      if(!okr2) return false;
      M.pp.set(pk,{k:pk,name:before.name,ck:before.ck,role:data.role,hist:before.hist,alt:before.alt});
      buildIndexes(); if(after) after();
      toast("Put back to "+before.name+(before.ck?(" at "+coNameOf(before.ck)):" with no company")+".");
      return true;
    });
  });
  return d;
}

function coPicker(initCk,onPick){
  const wrap=el("div"); wrap.style.position="relative";
  const inp=el("input"); inp.type="text"; inp.autocomplete="off"; inp.placeholder="Start typing a company";
  inp.style.cssText="width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;background:var(--surface);color:var(--ink)";
  const init=M.co.get(initCk); if(init) inp.value=init.name;
  const list=el("div","ac"); list.hidden=true; list.style.top="100%";
  let chosen=initCk||"";
  function close(){ list.hidden=true; list.textContent=""; }
  function run(){
    const q=nk(inp.value); list.textContent="";
    if(q.length<2){ close(); return; }
    const hits=[...M.co.values()].filter(c=>nk(c.name).indexOf(q)>=0)
      .sort((a,b)=>nk(a.name).indexOf(q)-nk(b.name).indexOf(q)||a.name.localeCompare(b.name)).slice(0,30);
    hits.forEach(c=>{ const b=el("button"); b.type="button";
      b.appendChild(el("b",null,c.name)); b.appendChild(el("i",null,c.cat));
      b.addEventListener("click",()=>{ chosen=c.k; inp.value=c.name; onPick(c.k); close(); });
      list.appendChild(b); });
    const nm=inp.value.trim();
    if(nm && !M.co.has(nk(nm))){
      const b=el("button"); b.type="button";
      b.appendChild(el("b",null,'Add "'+nm+'" as a new company'));
      b.appendChild(el("i",null,"It will start as Unknown until you set its category"));
      b.addEventListener("click",async()=>{ const k=nk(nm);
        const okr=await saveDoc("companies",k,{name:nm,cat:"Unknown"});
        if(okr){ M.co.set(k,{k:k,name:nm,cat:"Unknown"}); chosen=k; inp.value=nm; onPick(k); close(); toast("Company added."); } });
      list.appendChild(b);
    }
    list.hidden=!list.children.length;
    floatAC(list,inp); trackAC(list,inp);
  }
  let t=null;
  /* emptying the box means no company — otherwise a company put on by mistake can only
     ever be swapped for another one, never taken off */
  inp.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{
    if(!inp.value.trim()){ if(chosen){ chosen=""; onPick(""); } close(); return; }
    run(); },120); });
  inp.addEventListener("focus",run);
  document.addEventListener("click",e=>{ if(!wrap.contains(e.target)) close(); });
  wrap.append(inp,list);
  if(!CANWRITE) inp.disabled=true;
  return wrap;
}

let SEL=null;
function rowsTable(cols,grid){
  const box=el("div","rows");
  const h=el("div","rhead"); if(grid) h.style.setProperty("--rg",grid);
  cols.forEach(c=>h.appendChild(el("span",null,c)));

}
function addRow(box,grid,key,cells,onOpen){
  const b=el("button","rowbtn"); b.type="button"; if(grid) b.style.setProperty("--rg",grid);
  cells.forEach(c=>{ if(c instanceof Node) b.appendChild(c); else b.appendChild(el("span",null,c==null?"":String(c))); });
  b.appendChild(el("span","caret","▸"));
  b.addEventListener("click",()=>{
    if(SEL===key && document.body.classList.contains("paneon")){ closePane(); SEL=null;
      $$(".rowbtn.sel").forEach(x=>x.classList.remove("sel")); return; }
    SEL=key; $$(".rowbtn.sel").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); onOpen();
  });
  box.appendChild(b); return b;
}
function nmCell(main,sub){ const s=el("span","nm"); s.appendChild(document.createTextNode(main));
  if(sub) s.appendChild(el("small",null,sub)); return s; }
function pager(box,items,draw,step){
  step=step||60; let shown=0;
  function more(){ const b=$(".more",box); if(b) b.remove();
    items.slice(shown,shown+step).forEach(draw); shown+=step;
    if(shown<items.length){ const mb=el("button","more","Show "+Math.min(step,items.length-shown)+" More — "+n(items.length-shown)+" remaining");
      mb.type="button"; mb.addEventListener("click",more); box.appendChild(mb); } }
  more();
  if(!items.length) box.appendChild(el("div","empty","Nothing matches these filters."));
}

const GGRID="minmax(0,2.1fr) minmax(0,.85fr) minmax(0,.95fr) minmax(0,1.3fr) 66px 66px 86px 14px";
const DOW3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function schedShort(gk){
  const sc=(M.sched||{})[gk];
  if(!sc||!sc.rule) return "";
  const d=DOW3[sc.rule.dow]||"";
  const w=sc.rule.weeks==="*"?"Weekly":(sc.rule.weeks||[]).map(x=>ORD[x]).join(" & ");
  const t=timeLabel(sc);
  return (w==="Weekly"?("Weekly "+d):(w+" "+d))+(t?" \u00b7 "+t:"");
}

function renderGroupList(){
  const host=$("#grp-host"); if(!host) return; host.textContent="";

  const recs=new Map(), ppl=new Map();
  gs.forEach(g=>{ const idx=inIdx(M.byG.get(g.k)); let r=0; const s=new Set();
    idx.forEach(i=>{ r+=M.mt[i].p.size; M.mt[i].p.forEach(p=>s.add(p)); });
    recs.set(g.k,r); ppl.set(g.k,s.size); });
  gs.sort((a,b)=>(recs.get(b.k)-recs.get(a.k))||a.name.localeCompare(b.name));
  $("#f-gc").textContent=n(gs.length)+" group"+(gs.length===1?"":"s")+
    (rangeOn()?" \u00b7 "+n(gs.filter(g=>inIdx(M.byG.get(g.k)).length).length)+" met in this range":"");
  const box=rowsTable(["Group","Type","Facilitator","Meets","Meetings","People","Last Met"],GGRID);
  pager(box,gs,g=>{
    const st=el("span"); st.appendChild(el("span","pill "+gtypeCls(g.type),gtypeShort(g.type)));
    if(g.archived){ const a=el("span","pill arch","Archived"); a.style.marginLeft="5px"; st.appendChild(a); }
    else if(g.hold){ const a=el("span","pill hold","On Hold"); a.style.marginLeft="5px"; st.appendChild(a); }
    addRow(box,GGRID,"g:"+g.k,[
      nmCell(g.name,null), st,
      el("span","muted hide-sm",g.facilitator||"—"),
      (()=>{ const t=schedShort(g.k); const e2=el("span",t?"muted hide-sm":"muted hide-sm",t||"Not scheduled");
        if(!t) e2.style.opacity=".55"; e2.title=t?((M.sched[g.k]||{}).cadence||t)+" ET":"No day or cadence on file";
        e2.style.overflow="hidden"; e2.style.textOverflow="ellipsis"; e2.style.whiteSpace="nowrap"; return e2; })(),
      el("span","num hide-sm",n(inIdx(M.byG.get(g.k)).filter(i=>!isCancelled(M.mt[i])).length)),
      el("span","num hide-sm",n(ppl.get(g.k)||0)),

    ],()=>openGroup(g.k));

  host.appendChild(box);
}

function renderPeopleList(){
  const host=$("#ppl-host"); if(!host) return; host.textContent="";
  const q=nk($("#f-pq").value), ct=$("#f-pcat").value, gk=$("#f-pgrp").value;
  const cnt=new Map(), grpn=new Map(), last=new Map();
  meetings().forEach(m=>{ if(gk&&m.gk!==gk) return;
    m.p.forEach(pk=>{ cnt.set(pk,(cnt.get(pk)||0)+1);
      let s=grpn.get(pk); if(!s){s=new Set();grpn.set(pk,s);} s.add(m.gk);
      if(!last.get(pk)||m.d>last.get(pk)) last.set(pk,m.d); }); });
  let ps=[...cnt.keys()].map(k=>M.pp.get(k)).filter(Boolean);
  if(q) ps=ps.filter(p=>nk(p.name).indexOf(q)>=0||nk(compName(p.k)).indexOf(q)>=0||(p.alt||[]).some(a=>a.indexOf(q)>=0));
  if(ct) ps=ps.filter(p=>catOf(p.k)===ct);

  const box=rowsTable(["Name","Company","Category","Meetings","Groups","Last Seen"],PGRID);

      el("span","muted hide-sm",catOf(p.k)),
      el("span","num hide-sm",n(cnt.get(p.k)||0)),
      el("span","num hide-sm",n((grpn.get(p.k)||new Set()).size)),
      el("span","num muted",fmtDS(last.get(p.k)))
    ],()=>openPerson(p.k));
  });

}

function statCompanies(root){

function renderCompanyList(){
  const host=$("#co-host"); if(!host) return; host.textContent="";
  const q=nk($("#f-cq").value), ct=$("#f-ccat").value;
  const recs=new Map(), grpn=new Map(), pplc=new Map(), last=new Map();
  meetings().filter(m=>!isCancelled(m)).forEach(m=>{ m.p.forEach(pk=>{
    const ck=ckAt(pk,m.d); if(!ck) return;
    recs.set(ck,(recs.get(ck)||0)+1);
    let s=grpn.get(ck); if(!s){s=new Set();grpn.set(ck,s);} s.add(m.gk);
    let u=pplc.get(ck); if(!u){u=new Set();pplc.set(ck,u);} u.add(pk);
    if(!last.get(ck)||m.d>last.get(ck)) last.set(ck,m.d); }); });
  let cs=[...recs.keys()].map(k=>M.co.get(k)).filter(Boolean);
  if(q) cs=cs.filter(c=>nk(c.name).indexOf(q)>=0);
  if(ct) cs=cs.filter(c=>c.cat===ct);
  cs.sort((a,b)=>(recs.get(b.k)-recs.get(a.k))||a.name.localeCompare(b.name));
  $("#f-cc").textContent=n(cs.length)+" compan"+(cs.length===1?"y":"ies");
  const S2=stats();
  if(S2.noCoRecs&&!q&&!ct){
    const nb=el("div","banner");
    nb.innerHTML="<b>"+n(S2.noCoRecs)+" attendance records are not in any company\u2019s numbers.</b> "+
      "They belong to "+n(S2.noCoPpl.size)+" "+(S2.noCoPpl.size===1?"person":"people")+
      " with no company on file. Give them a company and they join these totals \u2014 "+
      "Data Health on Stats lists them.";
    host.appendChild(nb);
  }
  const box=rowsTable(["Company","Category","People","Groups","Attendance","Last Seen"],CGRID);
  pager(box,cs,c=>{
    addRow(box,CGRID,"c:"+c.k,[
      nmCell(c.name,null),
      el("span","muted",c.cat),
      el("span","num hide-sm",n((pplc.get(c.k)||new Set()).size)),
      el("span","num hide-sm",n((grpn.get(c.k)||new Set()).size)),
      el("span","num hide-sm",n(recs.get(c.k)||0)),
      el("span","num muted",fmtDS(last.get(c.k)))
    ],()=>openCompany(c.k));
  });
  host.appendChild(box);
}

<script>
"use strict";

/* ======================= Schedule and Facilitators ======================= */
function facOf(gk){
  const sc=(M.sched||{})[gk]||{}, g=M.gr.get(gk)||{};
  return (sc.fac||g.facilitator||"").trim();
}
function allFacs(){
  const set=new Set();
  M.gr.forEach(g=>{ if(g.archived) return; const f=facOf(g.k); if(f) set.add(f); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function manageSection(){
  return sect("Schedule and Facilitators",null,()=>{
    const d=el("div");
    d.appendChild(el("div","hint","Who runs each workgroup, when it meets, and its Zoom room. Changing a cadence here is what moves the Today box and the \u201cto log\u201d counts."));

    if(CANWRITE){
      const sw=el("div","panel"); sw.style.cssText="margin:14px 0 18px;border-left:3px solid var(--c2)";
      sw.appendChild(el("h2",null,"Hand a Facilitator's Workgroups to Someone Else"));
      sw.appendChild(el("div","psub","Pick who is leaving and who takes over. Every workgroup moves unless you untick it. Attendance history is never touched."));
      const g2=el("div","ctrls"); g2.style.marginTop="14px";
      const f1=el("div","fld"); f1.appendChild(el("label",null,"Currently Run By"));
      const from=el("select"); from.id="sw-from";
      from.style.cssText="width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;background:var(--surface);color:var(--ink)";
      const o0=el("option",null,"\u2014 Choose \u2014"); o0.value=""; from.appendChild(o0);
      allFacs().forEach(f=>{ const o=el("option",null,f); o.value=f; from.appendChild(o); });
      f1.appendChild(from); g2.appendChild(f1);
      const f2=el("div","fld"); f2.appendChild(el("label",null,"Hand Over To"));
      const to=el("input"); to.type="text"; to.id="sw-to"; to.setAttribute("list","sw-facs");
      to.placeholder="Start typing or pick a name";
      to.style.cssText="width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;background:var(--surface);color:var(--ink)";
      const dl=el("datalist"); dl.id="sw-facs";
      allFacs().forEach(f=>{ const o=el("option"); o.value=f; dl.appendChild(o); });
      f2.append(to,dl); g2.appendChild(f2);
      sw.appendChild(g2);
      const list=el("div"); list.id="sw-list"; list.style.marginTop="4px"; sw.appendChild(list);
      const row=el("div","btnrow");
      const go2=el("button","btn","Hand Over"); go2.type="button"; go2.disabled=true; go2.id="sw-go";
      row.appendChild(go2); sw.appendChild(row);
      function draw(){
        list.textContent=""; const f=from.value;
        if(!f){ go2.disabled=true; go2.textContent="Hand Over"; return; }
        const gks=[...M.gr.values()].filter(g=>!g.archived&&facOf(g.k)===f).map(g=>g.k);
        list.appendChild(el("div","sechead","Workgroups to Move"));
        const w=el("div"); w.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 16px";
        gks.forEach(k=>{ const g=M.gr.get(k);
          const l=el("label","tgl"); l.style.cssText="display:flex;gap:8px;font-size:13px;cursor:pointer;align-items:flex-start";
          const c=el("input"); c.type="checkbox"; c.checked=true; c.dataset.gk=k; c.style.marginTop="3px";
          c.addEventListener("change",count);
          l.append(c,document.createTextNode(g?g.name:k)); w.appendChild(l); });
        list.appendChild(w);
        if(!gks.length) list.appendChild(el("div","empty","No active workgroups are listed under that name."));
        count();
      }
      function count(){
        const nsel=$$("#sw-list input[type=checkbox]").filter(c=>c.checked).length;
        go2.textContent=nsel?("Hand Over "+nsel+" Workgroup"+(nsel===1?"":"s")):"Hand Over";
        go2.disabled=!nsel||!to.value.trim()||!from.value;
      }
      from.addEventListener("change",draw);
      to.addEventListener("input",count);
      go2.addEventListener("click",async()=>{
        const nm=to.value.trim(), gks=$$("#sw-list input[type=checkbox]").filter(c=>c.checked).map(c=>c.dataset.gk);
        if(!nm||!gks.length) return;
        go2.disabled=true; go2.textContent="Saving\u2026";
        const writes=[];
        gks.forEach(k=>{ const g=M.gr.get(k);
          writes.push({c:"groups",id:k,data:{name:g.name,type:g.type,archived:!!g.archived,hold:!!g.hold,facilitator:nm}});
          writes.push({c:"sched",id:k,data:{fac:nm}}); });
        const okr=await saveMany(writes);
        go2.disabled=false;
        if(!okr){ count(); return; }
        const was=gks.map(k=>({k:k,fac:((M.sched||{})[k]||{}).fac||"",
          gfac:(M.gr.get(k)||{}).facilitator||""}));
        gks.forEach(k=>{ const g=M.gr.get(k); if(g) g.facilitator=nm;
          if((M.sched||{})[k]) M.sched[k].fac=nm; });
        PICKFAC=""; renderToday(); renderAll(true);
        setUndo("<b>"+n(gks.length)+" workgroup"+(gks.length===1?"":"s")+"</b> handed to "+esc(nm)+".",async()=>{
          const back=[];
          was.forEach(w=>{ const g2=M.gr.get(w.k); if(!g2) return;
            back.push({c:"groups",id:w.k,data:{name:g2.name,type:g2.type,archived:!!g2.archived,hold:!!g2.hold,facilitator:w.gfac}});
            back.push({c:"sched",id:w.k,data:{fac:w.fac}}); });
          const okr2=await saveMany(back);
          if(!okr2) return false;

let LOG={gk:"",d:"",present:new Set(),extra:[],note:"",existing:null,seenAt:"",syncKey:"",force:false};

/* The page loads the shared data once. When two facilitators are logging at the same time,
   one can be looking at a meeting the other has just saved or cancelled. This re-reads the one
   group-year that matters, straight from the shared data, so the screen shows the truth. */
async function syncMeeting(gk,d){
  if(!DB||!gk||!d) return findMeeting(gk,d);
  const yr=String(d).slice(0,4), path="meetings/"+gk+"__"+yr;
  try{
    const sn=await DB.doc(path).get();
    const cur=(sn&&sn.exists)?(sn.data()||{}):{};
    DBC.set(path,cur);
    const items=cur.items||{};
    Object.keys(items).forEach(dd=>{ const it=items[dd]||{};
      const rec={id:"m_"+gk+"_"+String(dd).replace(/-/g,""),gk:gk,d:dd,sum:it.sum||"",label:it.label||"",
        p:new Set(it.p||[]),src:"db",by:it.by||"",at:it.at||"",byId:it.byId||"",
        cancelled:!!it.cancelled,createdBy:it.createdBy||"",createdAt:it.createdAt||""};
      const ex=(M.byG.get(gk)||[]).find(i=>M.mt[i].d===dd);
      if(ex!=null) M.mt[ex]=rec; else M.mt.push(rec);
    });
    /* a record this page still holds but the shared data no longer has — someone reopened or
       undid it; drop it, but never touch the imported history (src is not "db") */
    let dropped=false;
    for(let i=M.mt.length-1;i>=0;i--){ const m=M.mt[i];
      if(m.gk===gk&&m.src==="db"&&String(m.d).slice(0,4)===yr&&!(m.d in items)){ M.mt.splice(i,1); dropped=true; } }
    if(dropped||Object.keys(items).length) buildIndexes();
  }catch(e){}
  return findMeeting(gk,d);
}

function noteNow(){ const e2=$("#lg-note"); return e2?e2.value:""; }
function keepDraft(){ if(LOG.gk&&LOG.d) DRAFTS.set(draftKey(),{p:new Set(LOG.present),note:noteNow()}); }
function sameSet(a,b){ if(a.size!==b.size) return false; for(const x of a) if(!b.has(x)) return false; return true; }

/* mark every outstanding date for this workgroup as a meeting that did not happen */
async function cancelAllPending(btn){
  const gk=LOGGK, pend=pendingFor(gk);
  if(!gk||!pend.length) return;
  btn.disabled=true; btn.textContent="Saving\u2026";
  const reason=($("#lg-note")||{}).value||"";
  const now=new Date().toISOString(), me=whoAmI(), uid=(USER&&USER.id)||"";
  const writes=pend.map(d=>({c:"meetings",id:"m_"+gk+"_"+d.replace(/-/g,""),
    data:{gk:gk,d:d,sum:"",label:reason,p:[],cancelled:true,
      by:me,byId:uid,at:now,createdBy:me,createdAt:now}}));
  const okr=await saveMany(writes);
  btn.disabled=false;
  if(!okr){ refreshPending(); return; }
  writes.forEach(w=>{
    const ex=(M.byG.get(gk)||[]).find(i=>M.mt[i].d===w.data.d);
    const rec=Object.assign({},w.data,{id:w.id,p:new Set(),src:"db"});
    if(ex!=null) M.mt[ex]=rec; else M.mt.push(rec);
    DRAFTS.delete(gk+"|"+w.data.d);
  });
  buildIndexes();
  const g=M.gr.get(gk);
  const ds=pend.slice();
  renderToday(); tickToday(); loadRoster();
  setUndo("<b>"+n(ds.length)+" meetings marked cancelled</b> for "+esc(g?g.name:"")+
    (reason?" \u2014 \u201c"+esc(reason)+"\u201d":"")+".",async()=>{
    const okr2=await removeMany(ds.map(d=>({c:"meetings",id:"m_"+gk+"_"+d.replace(/-/g,""),data:{gk:gk,d:d}})),
      it=>!!(it&&it.cancelled));
    if(!okr2) return false;
    const set=new Set(ds);
    for(let i=M.mt.length-1;i>=0;i--){ const m=M.mt[i];
      if(m.gk===gk&&set.has(m.d)&&m.cancelled&&m.src==="db") M.mt.splice(i,1); }
    buildIndexes();
    toast(n(ds.length)+" cancellations undone \u2014 those dates are back on the to-log list.");
    renderToday(); tickToday();
    if(LOGGK) loadRoster(); else renderAll(true);
    return true;
  },$("#lg-pendwrap"));
}
