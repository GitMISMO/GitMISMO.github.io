<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MISMO Meeting Trackers</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#f1f6fa;color:#0d314c}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<script src="/assets/session.js"></script>
<script>
/* ============================================================================
   MEETING TRACKERS ON resources.mismo.org — the same door Summit HQ uses
   ----------------------------------------------------------------------------
   Meeting Trackers was built inside Claude, where it reached its data through
   window.claude.use('db' | 'user'). This gives the page that same door, backed by
   MISMO's save relay instead, so not a line of the tool itself had to change.

   Where the data lives: the PRIVATE repository GitMISMO/meeting-trackers-data,
   reached only through the relay under the project key "meeting-trackers". The
   page itself holds no attendance beyond the imported history in
   data/baseline.json; everything logged since arrives only after sign-in.

   How documents are filed (the relay has no "list a folder" route, so related
   documents share one file, and the ones that grow forever get a file each):
     people, companies, groups, summits, aliases, sched   one file per collection
     m-<group>-<year>                                     meetings/<group>__<year>
     own-index                                            the list of those meeting files

   Saving: every save sends the version (sha) it last read. If someone else saved
   in between, the relay answers 409; the change is re-applied on top of theirs and
   sent again, so two facilitators logging different meetings never overwrite each
   other. Saves made within a moment of each other go out as one commit.

   Seeing other people's work: the relay has no push, so loaded files are re-read
   every 30 seconds while the page is in use (every 2 minutes after ten idle
   minutes, not at all while the tab is hidden).

   Sign-in is the shared resources.mismo.org sign-in (/assets/session.js).
   ========================================================================== */
(function () {
  'use strict';
  if (window.claude || window.__mtRelay) return;          /* inside Claude: leave it alone */

  var RELAY_URL = 'https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws';
  var PROJECT = 'meeting-trackers';
  var POLL_MS = 30000, IDLE_POLL_MS = 120000, IDLE_AFTER = 10 * 60000;
  var FLUSH_MS = 350, RETRY_MS = 8000;
  var MAX_FILE = 940000;        /* the relay takes at most 1,000,000 bytes a save */
  /* every collection but meetings is a handful of bucket documents, so each collection
     sits in one file; meetings grow without end, so each group-year gets its own */
  var GROUPED = ['people', 'companies', 'groups', 'summits', 'aliases', 'sched', 'notdup'];
  var BASELINE = 'baseline';    /* the imported history, kept out of the public page */

  /* ---------- browser storage: every tool shares this web address ---------- */
  (function () {
    var P = 'tools:meeting-trackers:';
    var shared = function (k) { k = String(k); return k.indexOf('tools:') === 0 || k.indexOf('resources:') === 0 || k === 'mismo.portal.theme'; };
    try {
      var S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem;
      S.getItem = function (k) { return g.call(this, shared(k) ? k : P + k); };
      S.setItem = function (k, v) { return s.call(this, shared(k) ? k : P + k, v); };
      S.removeItem = function (k) { return r.call(this, shared(k) ? k : P + k); };
    } catch (e) {}
  })();

  /* the page asks for the imported history here instead of fetching a public data file */
  var baseDone = null, baseFail = null;
  window.__mtBaselinePromise = new Promise(function (res, rej) { baseDone = res; baseFail = rej; });

  function RS() { return window.ResourcesSession || null; }
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function hash8(s) { var h = 5381; s = String(s); for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return ('0000000' + h.toString(36)).slice(-8); }
  function safe(s) { return String(s).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{3,}/g, '--').replace(/^-+|-+$/g, '') || 'x'; }
  function fname(s) { s = safe(s); return s.length <= 40 ? s : s.slice(0, 31).replace(/-+$/, '') + '-' + hash8(s); }
  function err(code, message, status) { var e = new Error(message || code); e.code = code; e.status = status || 0; return e; }
  function now() { return Date.now(); }
  function idOf(p) { var s = String(p).split('/'); return s[s.length - 1]; }
  function parentOf(p) { var s = String(p).split('/'); return s.slice(0, -1).join('/'); }

  /* ---------- where a document is filed ---------- */
  function place(path) {
    var seg = String(path).split('/');
    if (seg.length !== 2) throw err('invalid_argument', 'Not a document path: ' + path);
    var c0 = seg[0];
    if (c0 === 'meetings') return { file: fname('m-' + seg[1]), own: true, coll: c0, id: seg[1] };
    if (GROUPED.indexOf(c0) >= 0) return { file: fname(c0), coll: c0, id: seg[1] };
    return { file: fname(c0), coll: c0, id: seg[1] };
  }
  function groupFor(coll) { return coll === 'meetings' ? [] : [fname(coll)]; }
  function filesOfColl(coll) { return groupFor(coll).concat(['own-index']); }

  /* ---------- talking to the relay ---------- */
  var status = { offline: false, lastError: '' };
  function net(method, name, body) {
    var rs = RS(), tok = rs && rs.token();
    if (!tok) return Promise.reject(err('SIGNED_OUT', 'Not signed in', 401));
    var headers = { 'Authorization': 'Bearer ' + tok };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch(RELAY_URL + '/' + PROJECT + '/data/' + encodeURIComponent(name), {
      method: method, cache: 'no-store', headers: headers, body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      status.offline = false;
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.ok) return b;
        var e = err((b && b.error) || ('HTTP_' + r.status), b && b.message, r.status);
        if (r.status === 401 && rs) needSignIn();
        throw e;
      });
    }, function () { status.offline = true; throw err('OFFLINE', 'Could not reach the relay', 0); });
  }

  /* ---------- files ---------- */
  var F = {};
  function file(name, own) {
    if (!F[name]) F[name] = { name: name, own: !!own, server: null, sha: null, loaded: false, loading: null,
      loadedAt: 0, pending: [], timer: null, flushing: false, view: null, waitingSignIn: false };
    if (own) F[name].own = true;
    return F[name];
  }
  function empty(f) { return f.own ? { doc: null } : { docs: {} }; }
  function normalise(f, c) {
    c = c && typeof c === 'object' ? c : {};
    if (f.own) return { doc: c.doc === undefined ? null : c.doc };
    return { docs: c.docs && typeof c.docs === 'object' ? c.docs : {} };
  }
  function load(f) {
    if (f.loading) return f.loading;
    f.loading = net('GET', f.name).then(function (b) {
      return { content: normalise(f, b && b.data), sha: b.sha || null };
    }, function (e) {
      /* the relay answers a missing file with {data:null}; a 404 means something else is
         wrong (most often UNKNOWN_PROJECT) and must not be mistaken for an empty file */
      if (e && e.status === 404 && (e.code === 'NOT_FOUND' || e.code === 'HTTP_404')) return { content: empty(f), sha: null };
      throw e;
    }).then(function (got) {
      var before = f.loaded ? JSON.stringify(f.server) : null;
      f.server = got.content; f.sha = got.sha; f.loaded = true; f.loadedAt = now(); f.view = null;
      f.loading = null;
      if (before !== null && before !== JSON.stringify(f.server)) changedByOthers();
      return f;
    }, function (e) { f.loading = null; throw e; });
    return f.loading;
  }
  function ensure(f) { return f.loaded ? Promise.resolve(f) : load(f); }

  function applyOps(f, content, ops) {
    ops.forEach(function (op) {
      if (f.own) {
        if (op.kind === 'set') content.doc = clone(op.data);
        else if (op.kind === 'update') content.doc = Object.assign({}, content.doc || {}, clone(op.data));
        else if (op.kind === 'delete') content.doc = null;
      } else {
        if (op.kind === 'set') content.docs[op.path] = clone(op.data);
        else if (op.kind === 'update') content.docs[op.path] = Object.assign({}, content.docs[op.path] || {}, clone(op.data));
        else if (op.kind === 'delete') delete content.docs[op.path];
      }
    });
    return content;
  }
  function viewOf(f) {
    if (!f.loaded) return null;
    if (!f.view) f.view = applyOps(f, clone(f.server), f.pending);
    return f.view;
  }
  function docIn(f, path) {
    var v = viewOf(f); if (!v) return undefined;
    var d = f.own ? v.doc : v.docs[path];
    return d === undefined ? null : d;
  }

  /* ---------- saving ---------- */
  function queue(path, kind, data) {
    var p = place(path), f = file(p.file, p.own);
    return new Promise(function (res, rej) {
      var go = function () {
        var op = { kind: kind, path: path, data: data, res: res, rej: rej };
        f.pending.push(op); f.view = null;
        if (p.own) register(path, kind !== 'delete');
        schedule(f, FLUSH_MS);
      };
      if (!f.loaded) ensure(f).then(go, function (e) { rej(e); });
      else go();
    });
  }
  /* the meeting files hold one document each, so they are listed in own-index
     and the whole collection can be read back */
  function register(path, present) {
    var r = file('own-index');
    var known = r.loaded ? !!(viewOf(r).docs[path]) : null;
    if (known === present) return;
    var op = { kind: present ? 'set' : 'delete', path: path,
      data: present ? { file: place(path).file } : null, res: function () {}, rej: function () {} };
    r.pending.push(op); r.view = null;
    if (!r.loaded) ensure(r).catch(function () {});
    schedule(r, FLUSH_MS);
  }
  function schedule(f, ms) {
    if (f.timer) return;
    f.timer = setTimeout(function () { f.timer = null; flush(f); }, ms);
  }
  /* GitHub makes one commit to a branch at a time, so saves go out one after another */
  var putChain = Promise.resolve();
  function put(name, body) {
    var go = function () { return net('PUT', name, body); };
    var p = putChain.then(go, go);
    putChain = p.then(function () {}, function () {});
    return p;
  }
  function flush(f) {
    if (f.flushing || !f.pending.length) return;
    if (!(RS() && RS().token())) { f.waitingSignIn = true; needSignIn(); return; }
    f.flushing = true;
    var batch = f.pending.slice(), tries = 0;
    var attempt = function () {
      return ensure(f).then(function () {
        var next = applyOps(f, clone(f.server), batch);
        if (JSON.stringify(next).length > MAX_FILE)
          throw err('TOO_BIG', 'This part of the trackers has grown too big to save in one piece.');
        return put(f.name, { content: next, sha: f.sha }).then(function (b) {
          f.server = next; f.sha = (b && b.sha) || f.sha; f.loadedAt = now();
          f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
          batch.forEach(function (op) { op.res(); });
          saved();
        });
      }).catch(function (e) {
        if (e && e.status === 409 && tries < 8) {
          tries++; f.loaded = false;
          return new Promise(function (r) { setTimeout(r, 300 * tries + Math.random() * 500); })
            .then(function () { return load(f); }).then(attempt);
        }
        throw e;
      });
    };
    attempt().catch(function (e) {
      var transient = e && (e.code === 'OFFLINE' || e.status === 401 || e.code === 'SIGNED_OUT' ||
        (e.status >= 500 && e.code !== 'TOKEN' && e.code !== 'GITHUB' && e.code !== 'REJECTED'));
      if (transient) {
        if (e.status === 401 || e.code === 'SIGNED_OUT') f.waitingSignIn = true;
        else setTimeout(function () { schedule(f, 0); }, RETRY_MS);
        problem(e);
        return;
      }
      f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
      batch.forEach(function (op) { op.rej(e); });
      problem(e, true);
    }).then(function () {
      f.flushing = false;
      if (f.pending.length && !f.waitingSignIn) schedule(f, FLUSH_MS);
    });
  }
  function anyPending() { return Object.keys(F).some(function (k) { return F[k].pending.length; }); }
  /* how many files are still waiting to be committed — the page shows this during a long
     save so a minute of work does not look like nothing happening */
  function pendingCount() {
    var n = 0;
    Object.keys(F).forEach(function (k) { if (F[k].pending.length) n++; });
    return n;
  }
  window.addEventListener('beforeunload', function (e) {
    if (anyPending()) { e.preventDefault(); e.returnValue = 'Attendance is still saving.'; return e.returnValue; }
  });

  /* ---------- the store, in the shape the tool already uses ---------- */
  function docSnap(path, data, pending) {
    var exists = data !== null && data !== undefined;
    return { id: idOf(path), exists: exists, ref: { id: idOf(path), path: path },
      data: function () { return exists ? clone(data) : undefined; },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  function collDocs(coll) {
    var out = {};
    groupFor(coll).forEach(function (g) {
      var v = viewOf(file(g));
      if (v) Object.keys(v.docs).forEach(function (p) { if (parentOf(p) === coll) out[p] = v.docs[p]; });
    });
    var r = viewOf(file('own-index'));
    if (r) Object.keys(r.docs).forEach(function (p) {
      if (parentOf(p) !== coll) return;
      var f = F[place(p).file];
      if (f && f.loaded) { var d = docIn(f, p); if (d !== null) out[p] = d; }
    });
    return out;
  }
  function loadColl(coll) {
    var jobs = [ensure(file('own-index'))];
    groupFor(coll).forEach(function (g) { jobs.push(ensure(file(g))); });
    return Promise.all(jobs).then(function () {
      var r = viewOf(file('own-index')), more = [];
      Object.keys(r.docs).forEach(function (p) { if (parentOf(p) === coll) more.push(ensure(file(place(p).file, true))); });
      return Promise.all(more);
    });
  }
  function collSnap(coll) {
    var docs = collDocs(coll), list = Object.keys(docs).map(function (p) { return docSnap(p, docs[p], false); });
    return { docs: list, size: list.length, empty: !list.length,
      forEach: function (fn) { list.forEach(fn); },
      docChanges: function () { return list.map(function (d) { return { type: 'added', doc: d }; }); },
      metadata: { hasPendingWrites: false, fromCache: false } };
  }
  function docRef(path) {
    var p = place(path);
    return {
      id: p.id, path: path,
      get: function () {
        var f = file(p.file, p.own);
        var fresh = f.loaded && !f.loading && (f.pending.length || now() - f.loadedAt < 15000);
        return (fresh ? Promise.resolve(f) : load(f)).then(function () { return docSnap(path, docIn(f, path), f.pending.length > 0); });
      },
      set: function (data) { return queue(path, 'set', data); },
      update: function (patch) { return queue(path, 'update', patch); },
      delete: function () { return queue(path, 'delete', null); }
    };
  }
  function collRef(coll, max) {
    var ref = { id: idOf(coll), path: coll,
      doc: function (id) { return docRef(coll + '/' + id); },
      limit: function (n) { return collRef(coll, n); },
      get: function () { return loadColl(coll).then(function () {
        var s = collSnap(coll);
        if (max && s.docs.length > max) { s.docs = s.docs.slice(0, max); s.size = s.docs.length; }
        return s; }); } };
    return ref;
  }
  var DB = { doc: docRef, collection: function (c) { return collRef(c); } };

  /* ---------- keeping up with everyone else ---------- */
  var lastActive = now(), refreshing = false;
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { lastActive = now(); }, { capture: true, passive: true });
  });
  /* when a re-read brings in someone else's work, fold it into the page */
  function changedByOthers() {
    if (refreshing) return;
    refreshing = true;
    setTimeout(function () {
      refreshing = false;
      try {
        if (typeof window.loadShared !== 'function') return;
        window.loadShared().then(function (docs) {
          try { window.applyDbDocs(docs); window.buildIndexes(); window.renderAll(true); window.renderToday(); } catch (e) {}
        }).catch(function () {});
      } catch (e) {}
    }, 400);
  }
  function poll() {
    if (!ready || !(RS() && RS().token())) return;
    if (document.visibilityState === 'hidden') return;
    var gap = now() - lastActive > IDLE_AFTER ? IDLE_POLL_MS : POLL_MS;
    Object.keys(F).forEach(function (k) {
      var f = F[k];
      if (!f.loaded || f.flushing || f.pending.length || f.loading) return;
      if (now() - (f.polledAt || f.loadedAt) < gap) return;
      f.polledAt = now();
      load(f).catch(function () {});
    });
  }
  setInterval(poll, 5000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { lastActive = now(); poll(); } });

  /* ---------- who is signed in ---------- */
  function me() { var s = RS() && RS().current(); return { name: (s && s.name) || '', email: (s && s.email) || '' }; }
  var USER = {
    isOwner: function () { return false; },
    canEdit: function () { return false; },
    can: function (what) { return what === 'data.write' ? ready : false; },
    id: function () { return Promise.resolve(me().email || ''); },
    me: function () { return Promise.resolve(me()); },
    profile: function () { return Promise.resolve(me()); }
  };

  /* ---------- the sign-in gate ---------- */
  var ready = false, readyWaiters = [], gateEl = null, starting = false;
  function whenReady() { return ready ? Promise.resolve() : new Promise(function (r) { readyWaiters.push(r); }); }
  function gate(kind, e) {
    if (!gateEl) {
      gateEl = document.createElement('div');
      gateEl.id = 'mt-gate';
      /* This cover hides the trackers until access is settled. It must sit ABOVE the page
         (highest 132) and BELOW the shared sign-in, whose scrim is 9500 and whose account
         menu is 9000 — at 9998 it covered the sign-in form and left a blank screen. */
      gateEl.style.cssText = 'position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;' +
        'background:#f1f6fa;color:#0d314c;font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;text-align:center;padding:24px';
      document.documentElement.appendChild(gateEl);
    }
    if (!kind) { gateEl.hidden = true; return; }
    gateEl.hidden = false;
    if (kind === 'blank') gateEl.innerHTML = '';
    else if (kind === 'loading') gateEl.innerHTML = '<div>Loading the meeting trackers&hellip;</div>';
    else if (kind === 'nosession') gateEl.innerHTML = '<div><b>Sign-in is not available on this page.</b><br>The shared sign-in script did not load. Tell Jonna.</div>';
    else gateEl.innerHTML = '<div><b>This could not be opened.</b><br>' +
      ((e && (e.message || e.code)) || 'The relay did not answer') + '</div>';
  }
  function start() {
    var rs = RS(); if (!rs) { gate('nosession'); return; }
    if (starting) return;
    if (ready && rs.current() && rs.role(PROJECT)) { gate(null); resumeWrites(); return; }
    starting = true; gate('blank');
    rs.requireAccess(PROJECT, { toolName: 'Meeting Trackers' }).then(function () {
      if (ready) return;
      gate('loading');
      /* the page asks for these the moment it has the history, so fetch them alongside it
         rather than after it \u2014 it is the difference between waiting twice and once */
      warm();
      return openBaseline();
    }).then(function () {
      ready = true; starting = false; gate(null); resumeWrites();
      readyWaiters.splice(0).forEach(function (r) { r(); });
    }, function (e) {
      starting = false;
      if (e && e.code === 'NO_ACCESS') { rs.signIn({ reason: 'no-access', toolName: 'Meeting Trackers', gated: true }).catch(function () {}); return; }
      if (e && e.message === 'cancelled') return;
      gate('error', e);
    });
  }
  /* Everything the page reads at startup, pulled in while the history is still arriving. */
  var warmed = false;
  function warm() {
    if (warmed) return; warmed = true;
    try {
      ensure(file('own-index')).then(function () {
        var r = viewOf(file('own-index'));
        if (!r) return;
        Object.keys(r.docs).forEach(function (p) { ensure(file(place(p).file, true)); });
      }, function () {});
      GROUPED.forEach(function (g) { ensure(file(fname(g))).catch(function () {}); });
    } catch (e) {}
  }
  /* ---------- the imported history ---------- */
  /* The history is 48,000 records. Written out as plain JSON the stored file lands near
     1.2 MB once the relay formats it, which is past what it can read back in one piece —
     it comes home truncated and unreadable. So it is squeezed first: the same data as one
     compressed string, about 130 KB, and formatting cannot inflate a single string. */
  function gz(obj) {
    if (typeof CompressionStream !== 'function') return Promise.reject(err('NO_GZIP',
      'This browser cannot compress the history. Use Chrome, Edge, Firefox or Safari 16.4 or newer.'));
    var body = new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(body).arrayBuffer().then(function (buf) {
      var b = new Uint8Array(buf), s2 = '', CH = 0x8000;
      for (var i = 0; i < b.length; i += CH) s2 += String.fromCharCode.apply(null, b.subarray(i, i + CH));
      return btoa(s2);
    });
  }
  function ungz(b64) {
    if (typeof DecompressionStream !== 'function') return Promise.reject(err('NO_GZIP',
      'This browser cannot read the stored history. Use Chrome, Edge, Firefox or Safari 16.4 or newer.'));
    var bin = atob(b64), b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    var body = new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(body).text().then(function (t) { return JSON.parse(t); });
  }
  var baseLoaded = false;
  function openBaseline() {
    if (baseLoaded) return Promise.resolve();
    var f = file(BASELINE, true);
    return load(f).then(function () {
      var doc = f.server && f.server.doc;
      if (doc && doc.z) {                     /* the squeezed form */
        return ungz(doc.z).then(function (full) {
          baseLoaded = true; baseDone(full);
        }, function () { return seedGate(f); });
      }
      if (doc && doc.v) { baseLoaded = true; baseDone(doc); return; }
      return seedGate(f);                     /* nothing there yet \u2014 offer to put it in, once */
    }, function (e) {
      /* An earlier attempt left something the relay cannot read back. Rather than a dead
         end, offer to put the history in again \u2014 the save replaces whatever is there. */
      if (e && e.status === 404) throw e;
      return seedGate(f, e);
    });
  }
  /* A one-time step for whoever sets this up: choose the baseline.json that came with the
     tool and it is written into the private data repository. Nobody sees this again. */
  function seedGate(f, prevErr) {
    return new Promise(function (res, rej) {
      gate('blank');
      gateEl.innerHTML =
        '<div style="max-width:560px;text-align:left">' +
        '<h2 style="margin:0 0 10px;font:600 19px/1.3 \'IBM Plex Sans\',system-ui,sans-serif">The Imported History Is Not Loaded Yet</h2>' +
        (prevErr ? '<p style="margin:0 0 14px;padding:9px 11px;border-radius:6px;background:#fbe9e7;color:#8a2f24;font-size:13px">' +
          'What is stored could not be read back (' + String((prevErr.message || prevErr.code || '')).replace(/[<>&]/g, '') +
          '). Loading it again replaces it.</p>' : '') +
        '<p style="margin:0 0 14px">This is a one-time step. The tracker history is member information, so it is kept in the private ' +
        '<code>meeting-trackers-data</code> repository rather than in this page. Choose the <b>baseline.json</b> that came with the tool and it will be put there.</p>' +
        '<p style="margin:0 0 16px;color:#456179;font-size:13.5px">Everyone else just sees the trackers \u2014 this screen only appears while the history is missing.</p>' +
        '<input type="file" id="mt-seed-f" accept="application/json,.json">' +
        '<div style="margin-top:16px"><button id="mt-seed-go" disabled ' +
        'style="background:#0d314c;color:#fff;border:0;border-radius:6px;padding:9px 16px;font:600 13px \'IBM Plex Sans\',system-ui,sans-serif;cursor:pointer">Load the History</button>' +
        '<span id="mt-seed-s" style="margin-left:12px;font-size:13px;color:#456179"></span></div></div>';
      var fi = document.getElementById('mt-seed-f'), go = document.getElementById('mt-seed-go'),
          st = document.getElementById('mt-seed-s'), picked = null;
      fi.addEventListener('change', function () {
        picked = fi.files && fi.files[0];
        go.disabled = !picked;
        st.textContent = picked ? (Math.round(picked.size / 1024) + ' KB selected') : '';
      });
      go.addEventListener('click', function () {
        if (!picked) return;
        go.disabled = true; st.textContent = 'Reading\u2026';
        var rd = new FileReader();
        rd.onerror = function () { go.disabled = false; st.textContent = 'That file could not be read.'; };
        rd.onload = function () {
          var doc;
          try { doc = JSON.parse(rd.result); } catch (e) { go.disabled = false; st.textContent = 'That is not a JSON file.'; return; }
          if (!doc || !doc.v || !doc.meetings) { go.disabled = false; st.textContent = 'That does not look like the tracker baseline.'; return; }
          st.textContent = 'Squeezing it down\u2026';
          gz(doc).then(function (z) {
            if (z.length > MAX_FILE) throw err('TOO_BIG', 'the history is too big for one save even squeezed');
            st.textContent = 'Saving to the private repository\u2026 (' + Math.round(z.length / 1024) + ' KB)';
            var packed = { v: 1, z: z };
            return put(BASELINE, { content: { doc: packed }, sha: f.sha }).then(function (b) {
              f.server = { doc: packed }; f.sha = (b && b.sha) || f.sha; f.view = null;
              baseLoaded = true; baseDone(doc); res();
            });
          }).catch(function (e) {
            go.disabled = false;
            var c = e && e.code;
            if (c === 'CONFLICT') {
              /* something unreadable is already filed there, so the relay will not let a
                 fresh save replace it \u2014 the old one has to be taken out by hand first */
              st.innerHTML = '';
              var w = document.createElement('div');
              w.style.cssText = 'margin-top:12px;padding:10px 12px;border-radius:6px;background:#fbe9e7;color:#8a2f24;font-size:13px;line-height:1.5';
              w.innerHTML = 'There is already a file there that cannot be read, and the relay will not ' +
                'write over it. Open the <b>data</b> folder in the private ' +
                '<code>meeting-trackers-data</code> repository, delete the file inside it, then reload ' +
                'this page and load the history again.';
              st.parentNode.appendChild(w);
              return;
            }
            st.textContent = 'It would not save: ' + ((e && (e.message || c)) || 'relay error');
          });
        };
        rd.readAsText(picked);
      });
    });
  }

  function resumeWrites() {
    Object.keys(F).forEach(function (k) { var f = F[k]; if (f.waitingSignIn) { f.waitingSignIn = false; schedule(f, 0); } });
  }
  var askedSignIn = false;
  function needSignIn() {
    if (askedSignIn) return; askedSignIn = true;
    var rs = RS(); if (!rs) return;
    rs.signIn({ reason: 'expired' }).catch(function () {}).then(function () { askedSignIn = false; });
  }
  function hookSession() {
    var rs = RS(); if (!rs) { gate('nosession'); return; }
    rs.onChange(function () { start(); });
    mountAccount(rs);
    start();
  }
  /* The shared sign-in puts the account chip into #rs-account when it loads, but this page
     is built after it runs, so the spot does not exist yet. Hand it over once it does —
     the same chip Summit HQ and Team HQ carry, in the same corner. */
  function mountAccount(rs) {
    if (!rs || typeof rs.mount !== 'function') return;
    var tries = 0;
    (function go() {
      var el = document.getElementById('rs-account');
      if (el) { if (!el.getAttribute('data-rs-mount')) { try { rs.mount(el); } catch (e) {} } return; }
      if (tries++ < 40) setTimeout(go, 120);
    })();
  }

  /* ---------- a quiet line when a save has a problem ---------- */
  var WHY = { TOO_BIG: 'this part has grown too big to save in one piece',
    REJECTED: 'the relay refused the change', TOKEN: 'the relay is not set up right',
    GITHUB: 'the relay could not reach GitHub', UNKNOWN_PROJECT: 'the relay does not know this tool yet' };
  function note(text, bad) {
    try { if (typeof window.toast === 'function') { window.toast(text, !!bad); return; } } catch (e) {}
    console[bad ? 'error' : 'log'](text);
  }
  var troubled = false;
  function problem(e, lost) {
    status.lastError = (e && (e.code || e.message)) || 'error';
    if (lost) { note('That did not save (' + ((e && (WHY[e.code] || e.message)) || 'relay error') + '). It has been taken back.', true); return; }
    troubled = true;
    note(e && (e.status === 401 || e.code === 'SIGNED_OUT')
      ? 'Sign in again to finish saving — nothing is lost.'
      : 'Not saved yet — trying again. Keep this tab open.', true);
  }
  function saved() { if (troubled && !anyPending()) { troubled = false; note('All changes saved.'); } }

  /* ---------- the door ---------- */
  window.claude = {
    use: function (cap) {
      if (cap === 'db') return whenReady().then(function () { return DB; });
      if (cap === 'user') return whenReady().then(function () { return USER; });
      return Promise.resolve(null);
    }
  };
  window.__mtRelay = { files: F, place: place, poll: poll, pending: anyPending,
    pendingCount: pendingCount, status: status,
    config: { RELAY_URL: RELAY_URL, PROJECT: PROJECT, POLL_MS: POLL_MS } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hookSession); else hookSession();
})();
</script>

<body>
<title>Artifact - Meeting Trackers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0d314c; --navy-deep:#06202f; --navy-mid:#14486e;

  --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
  --good-soft:#e1f2ec; --bad-soft:#fbe9e7; --warn-soft:#f7efe0;
  --accent:#14486e; --accent-soft:#e4f2fb; --chip:#eef4f9;
  --c1:#2477b8; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --ramp-a:#0d314c; --ramp-b:#74bfeb;

  --ui:var(--display);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --hq-h:64px; --rail-w:240px; --rail-mini:62px;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52; --sunk:#173c52;
    --border:#1f4a63; --border-strong:#2f6688; --rule:#173547; --line:#173547;
    --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
    --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
    --good-soft:#0c3128; --bad-soft:#3a1c19; --warn-soft:#3a2e13;
    --accent:#74bfeb; --accent-soft:#123143; --chip:#173c52; --navy-mid:#7fc0ea;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f;
    --ramp-a:#1b5a85; --ramp-b:#a9d8f3;

  }
}
:root[data-theme="dark"]{
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52; --sunk:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547; --line:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
  --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
  --good-soft:#0c3128; --bad-soft:#3a1c19; --warn-soft:#3a2e13;
  --accent:#74bfeb; --accent-soft:#123143; --chip:#173c52; --navy-mid:#7fc0ea;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f;
  --ramp-a:#1b5a85; --ramp-b:#a9d8f3;

}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- masthead + rail ---------- */

.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:0;overflow:hidden auto;overscroll-behavior:contain;box-shadow:1px 0 0 rgba(116,191,235,.22),4px 0 18px rgba(6,32,47,.14);transition:width .2s cubic-bezier(.4,0,.2,1)}
body{padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.hq.rail,body,.hqtop{transition:none}}

body.railmini .hq nav button[aria-current] svg{stroke:var(--navy-deep);opacity:1}
body.railmini .railsum{display:none}
body.railmini .hq .mast-right{gap:3px;padding:8px 0 11px;align-items:center}
body.railmini .hq .mast-right .theme-btn{width:42px;padding:9px 0;font-size:0;justify-content:center;border-radius:9px}
body.railmini .hq .mast-right .theme-btn .ti{width:19px;height:19px}
body.railmini .hq .mast-right .theme-btn span{display:none}
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);align-items:center;justify-content:center;padding:0;cursor:pointer}
.railfind-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.railfind-b:hover{background:rgba(255,255,255,.18);color:#fff}
.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;border-bottom:1px solid rgba(116,191,235,.2);flex:0 0 auto}
.rail-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}

.railhide:hover{background:rgba(255,255,255,.14);color:#fff}
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}

.railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font-size:12.5px;padding:6px 26px 6px 30px}

.railhits .rh-g{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);cursor:pointer;font-family:var(--ui)}

  letter-spacing:.08em;color:var(--ink-3)}

.linkb.quiet{font-size:11.5px;font-weight:500;color:var(--ink-2)}

  .tl .tli.addrow>.d{white-space:nowrap}

  .nocoacts{grid-column:1/-1;justify-content:flex-start;gap:16px}}

  font-weight:600;margin:14px 0 6px}

  background:var(--accent-soft);color:var(--navy-mid);border:1px solid var(--border);border-radius:6px;
  padding:4px 10px;font-family:var(--ui);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}

<script>
"use strict";
/* ======================= theme ======================= */
(function theme(){
  var btn=document.getElementById("theme-btn"); if(!btn) return;
  function cur(){var t=document.documentElement.getAttribute("data-theme");if(t)return t;
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
  function paint(){var dark=cur()==="dark";var lab=document.getElementById("theme-lab");
    if(lab)lab.textContent=dark?"Light Mode":"Dark Mode";
    btn.title="Switch to "+(dark?"light":"dark")+" mode";}
  btn.addEventListener("click",function(){
    document.documentElement.setAttribute("data-theme",cur()==="dark"?"light":"dark");
    paint(); try{localStorage.setItem("mismo.portal.theme",cur());}catch(e){}
    window.dispatchEvent(new Event("resize"));});
  try{var s=localStorage.getItem("mismo.portal.theme"); if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}
  paint();
})();
(function season(){ if(new Date().getMonth()===11) document.documentElement.setAttribute("data-season","december"); })();

/* ======================= helpers ======================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const nk=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
/* Put a match list where it can actually be reached: anchored to the input on screen,
   no taller than the room there is, and flipped above the box when below is too tight. */
function floatAC(list,input){
  if(!list||!input||list.hidden) return;
  const r=input.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12;
  const up=below<170&&above>below;
  list.classList.add("acfix");
  list.style.left=Math.round(r.left)+"px";
  list.style.width=Math.round(r.width)+"px";
  list.style.maxHeight=Math.max(110,Math.min(300,Math.round(up?above:below)))+"px";
  if(up){ list.style.top="auto"; list.style.bottom=Math.round(window.innerHeight-r.top+4)+"px"; }
  else { list.style.bottom="auto"; list.style.top=Math.round(r.bottom+4)+"px"; }
}
function trackAC(list,input){
  if(list.__ac) return;
  list.__ac=()=>{ if(list.isConnected&&!list.hidden) floatAC(list,input); };
  window.addEventListener("scroll",list.__ac,true);
  window.addEventListener("resize",list.__ac);
}
const esc=s=>String(s==null?"":s);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtD(iso){ if(!iso) return ""; const p=String(iso).split("-");
  return p.length<3?iso:MON[+p[1]-1]+" "+(+p[2])+", "+p[0]; }
function fmtDS(iso){ const p=String(iso||"").split("-"); return p.length<3?iso:p[1]+"/"+p[2]+"/"+p[0].slice(2); }
function n(x){ return (x==null?0:x).toLocaleString(); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
let TT=null;
/* When this page is embedded in a frame that is sized to its whole content, the frame itself
   never scrolls — so anything pinned to the bottom of the "screen" actually sits at the bottom
   of the whole document, thousands of pixels below whatever the person is reading. In that case
   messages have to be put into the page itself, right beside whatever was just clicked. */
let LASTCLICK=null;
document.addEventListener("click",e=>{ LASTCLICK=e.target; },true);

/* Put the message beside whatever was just used. If that element has gone (the view redrew),
   fall through to the top of the current view, which is where a redraw leaves the eye. */
const NOTEHOSTS=".inote,.rosterbar,.btnrow,.ctrls,.filters,.addp,.panel,.banner,.pickbar,.sbody,.pane-body,.rngbar";
let NOTEAT=null, PLACEDEXACT=false;
function placeNote(w){
  /* one-shot: a caller that redrew the page can say exactly where its note belongs,
     so the reader is not thrown back to the top of the view to find it */
  if(NOTEAT){ const at=NOTEAT; NOTEAT=null;
    if(at&&at.parentNode&&document.body.contains(at)){
      at.parentNode.insertBefore(w,at); PLACEDEXACT=true; return true; } }
  const e=LASTCLICK;
  if(e&&e.closest&&document.body.contains(e)){
    /* the roster area is wiped and rebuilt on every save, so notes raised from inside it
       go in a slot just above it that survives the redraw */
    const slot=$("#lg-noteslot");
    if(slot&&e.closest("#lg-state")){ slot.textContent=""; slot.appendChild(w); return true; }
    const a=e.closest(NOTEHOSTS)||e.parentElement;
    /* the panel body is the scrolling area itself — go inside it, not after it */
    if(a&&a.classList&&a.classList.contains("pane-body")){ a.insertBefore(w,a.firstChild); return true; }
    if(a&&a.parentNode){ a.parentNode.insertBefore(w,a.nextSibling); return true; }
  }
  const pb=$(".pane-body"); if(pb&&document.body.contains(pb)&&document.body.classList.contains("paneon")){
    pb.insertBefore(w,pb.firstChild); return true; }
  const m=$("#main");
  if(m){ const h=$(".vhead",m); if(h&&h.parentNode===m) m.insertBefore(w,h.nextSibling);
    else m.insertBefore(w,m.firstChild); return true; }
  return false;
}
function inlineNote(msg,bad){
  $$(".inote.auto").forEach(x=>x.remove());
  const w=el("div","inote auto"+(bad?" bad":""));
  const t=el("span","it-t"); t.textContent=msg; w.appendChild(t);
  const x=el("button","it-x","\u00d7"); x.type="button"; x.setAttribute("aria-label","Dismiss this");
  x.addEventListener("click",()=>w.remove()); w.appendChild(x);
  PLACEDEXACT=false;
  if(!placeNote(w)) return false;
  /* a note put in a chosen spot is already where the reader is looking — moving the page
     to it would undo the scroll position we just went to the trouble of keeping */
  if(!PLACEDEXACT) try{ w.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){}
  setTimeout(()=>{ if(w.isConnected&&!bad) w.remove(); },bad?12000:6500);
  return true;
}
/* A bar pinned to the bottom of the screen is useless when this page is embedded in a frame
   sized to its whole content — it lands at the foot of the document, far below the reader.
   So messages go into the page, and the floating bar is only the fallback. */
function toast(msg,bad){
  if(inlineNote(msg,bad)) return;
  const t=$("#toast"); t.textContent=msg; t.classList.toggle("bad",!!bad); t.classList.add("on");
  clearTimeout(TT); TT=setTimeout(()=>t.classList.remove("on"),bad?5200:2800);
}
/* ---- undo: one step back for the actions that change a lot at once ---- */
let UNDO=null;
async function runUndo(btn){
  if(!UNDO||!UNDO.run) return;
  const bs=[$("#undo-go"),...$$(".inote.undo .btn")].filter(Boolean);
  bs.forEach(b=>{ b.disabled=true; b.textContent="Undoing\u2026"; });
  let ok=false;
  try{ ok=await UNDO.run(); }catch(e){ ok=false; }
  if(ok) clearUndo();
  else { bs.forEach(b=>{ b.disabled=false; b.textContent="Undo"; });
    toast("That could not be undone just now. Try again in a moment.",true); }
}
/* `where` is the element the person just acted on — the inline copy goes right under it,
   which is the only place guaranteed to be on screen however this page is embedded. */
function setUndo(html,run,where){
  UNDO={run:run};
  $$(".inote.undo").forEach(x=>x.remove());
  let placed=false;
  if(where!==false){
    const b=el("div","inote undo warnish");
    const t=el("span","it-t"); t.innerHTML=html; b.appendChild(t);
    const u=el("button","btn ghost","Undo"); u.type="button";
    u.addEventListener("click",()=>runUndo(u)); b.appendChild(u);
    const x=el("button","it-x","\u00d7"); x.type="button"; x.setAttribute("aria-label","Dismiss this");
    x.addEventListener("click",clearUndo); b.appendChild(x);
    if(where&&where.parentNode&&document.body.contains(where)){
      where.parentNode.insertBefore(b,where.nextSibling); placed=true; }
    else placed=placeNote(b);
    if(placed){ try{ b.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){} }
  }
  const w=$("#undo");
  if(w){
    if(placed){ w.hidden=true; document.body.classList.remove("undoon"); }
    else { $("#undo-t").innerHTML=html;
      const g=$("#undo-go"); g.disabled=false; g.textContent="Undo";
      w.hidden=false; document.body.classList.add("undoon"); }
  }
}
function clearUndo(){ UNDO=null;
  const w=$("#undo"); if(w) w.hidden=true;
  document.body.classList.remove("undoon");
  $$(".inote.undo").forEach(x=>x.remove()); }
(function(){
  const x=$("#undo-x"); if(x) x.addEventListener("click",clearUndo);
  const g=$("#undo-go");
  if(g) g.addEventListener("click",()=>runUndo(g));
  document.addEventListener("keydown",e=>{
    const t=e.target, typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
    if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&!typing&&UNDO){
      e.preventDefault(); const b=$("#undo-go"); if(b&&!b.disabled) b.click(); }
  });
})();
const SERIES=["--c1","--c2","--c3","--c4","--c5","--c6"];
function sc(i){ return "var("+SERIES[i%6]+")"; }
function ramp(i,total){ const t=total<2?0:i/(total-1);
  return "color-mix(in srgb, var(--ramp-b) "+Math.round(t*78)+"%, var(--ramp-a))"; }
function gtypeCls(t){ return t.indexOf("Community")===0?"t-cop":t.indexOf("Development")===0?"t-dwg":
  t==="Workgroup"?"t-wg":t==="Governance"?"t-gov":"t-other"; }
function gtypeShort(t){ return t.indexOf("Community")===0?"COP":t.indexOf("Development")===0?"DWG":t; }

/* ======================= model ======================= */
const M={cats:[],co:new Map(),pp:new Map(),gr:new Map(),mt:[],byG:new Map(),byP:new Map(),byC:new Map(),summits:new Map(),nameIdx:new Map(),dbReady:false};
let DB=null, USER=null, CANWRITE=true, SELFHOST=false, RELAYDOWN=false;

function addIdx(map,k,v){ let a=map.get(k); if(!a){a=[];map.set(k,a);} a.push(v); }

function buildIndexes(){
  M.byG=new Map(); M.byP=new Map(); M.byC=new Map();
  M.mt.forEach((m,i)=>{
    addIdx(M.byG,m.gk,i);
    m.p.forEach(pk=>{ addIdx(M.byP,pk,i);
      const ck=ckAt(pk,m.d); if(ck) addIdx(M.byC,ck,i); });
  });
  M.coPeople=new Map();
  M.mt.forEach(m=>{ m.p.forEach(pk=>{ const ck=ckAt(pk,m.d); if(ck){
    let s=M.coPeople.get(ck); if(!s){s=new Set();M.coPeople.set(ck,s);} s.add(pk); } }); });
  rebuildNames();
}
M.coPeople=new Map();

function loadBaseline(B){
  M.cats=B.cats.slice();
  B.companies.forEach(c=>{ const k=nk(c[0]); if(!M.co.has(k)) M.co.set(k,{k:k,name:c[0],cat:B.cats[c[1]]||"Unknown"}); });
  const pk=[];
  B.people.forEach(p=>{ const k=nk(p[0]); pk.push(k);
    const rec0={k:k,name:p[0],ck:p[1]>=0?nk(B.companies[p[1]][0]):"",role:p[2]||""};
    BASEPP.set(k,rec0);                    /* the record as imported, for taking a merge back */
    if(!M.pp.has(k)) M.pp.set(k,Object.assign({},rec0)); });
  const gk=[];
  B.groups.forEach(g=>{ const k=nk(g[0]); gk.push(k);
    M.gr.set(k,{k:k,name:g[0],type:g[1],archived:!!g[2],facilitator:g[3]||"",first:g[4],last:g[5]}); });
  B.summits.forEach(s=>{ M.summits.set(nk(s[0]),{k:nk(s[0]),name:s[0],start:s[1],end:s[2]}); });
  M.sched=B.sched||{};
  B.meetings.forEach((m,i)=>{
    /* p0 is the attendance exactly as the workbooks had it. Nothing ever writes to it, so
       a merge can be taken back by asking it who was really on a meeting. */
    const p0=new Set((B.att[i]||[]).map(x=>pk[x]));
    M.mt.push({id:"b"+i,gk:gk[m[0]],d:m[1],sum:(m[2]>=0?nk(B.summits[m[2]][0]):""),label:m[3]||"",
               p:new Set(p0),p0:p0,src:"base"});
  });
}

/* Two records with the same surname are not always two records of the same person —
   Michael Brown at one firm and Mike Brown at another are two people. Once somebody says
   so, the pair stops being offered. */
const NOTDUP=new Map();
const pairKey=(a,b)=>[a,b].sort().join("|");
/* Some rows in the trackers were never a person — a set of initials, a line of junk.
   SETASIDE keeps them and their attendance but stops the tool nagging about them.
   GONE is the harder case: the record is removed from every meeting it appears in. */
const SETASIDE=new Map(), GONE=new Map(), MERGEDTO=new Map(), BASEPP=new Map();
/* ---- overlay rows the facilitators have added since ---- */
function applyDbDocs(docs){
  (docs.sched||[]).forEach(d=>{ const k=d.id; if(!k) return;
    if(d.removed){ delete M.sched[k]; return; }
    M.sched[k]=Object.assign({},M.sched[k]||{},d); });
  (docs.summits||[]).forEach(d=>{ const k=d.id||nk(d.name); M.summits.set(k,{k:k,name:d.name,start:d.start||"",end:d.end||""}); });
  (docs.companies||[]).forEach(d=>{ const k=d.id||nk(d.name);
    M.co.set(k,{k:k,name:d.name,cat:d.cat||"Unknown"}); });
  /* pairs somebody has already looked at and said are two different people */
  NOTDUP.clear(); SETASIDE.clear(); GONE.clear();
  (docs.notdup||[]).forEach(d=>{ if(d&&d.id) NOTDUP.set(d.id,
    {by:d.by||"",at:d.at||"",a:d.a||"",b:d.b||"",an:d.an||d.a||"",bn:d.bn||d.b||""}); });
  /* people folded into somebody else: drop the old record and hand its names to the keeper */
  M.merges=[];
  MERGEDTO.clear();
  (docs.people||[]).forEach(d=>{ if(!d.mergedInto) return;
    const k=d.id||nk(d.name), into=d.mergedInto;
    M.merges.push({k:k,name:d.name||k,into:into,by:d.mergedBy||"",at:d.mergedAt||"",
      prev:(d.prevCk!==undefined||d.prevHist)
        ?{ck:d.prevCk||"",hist:(d.prevHist||[]).map(e=>({ck:e.ck||"",from:e.from||""}))}:null});
    MERGEDTO.set(k,into);
    const keep=M.pp.get(into); M.pp.delete(k);
    if(keep){ const alt=(keep.alt||[]).slice();
      [k,nk(d.name||"")].forEach(a=>{ if(a&&alt.indexOf(a)<0) alt.push(a); });
      keep.alt=alt; } });
  /* set aside: kept in full, left off the Issues list */
  (docs.people||[]).forEach(d=>{ if(!d.setAside) return;
    SETASIDE.set(d.id||nk(d.name),{by:d.setAsideBy||"",at:d.setAsideAt||"",name:d.name||""}); });
  /* removed outright: taken out of every meeting as well as the roster */
  (docs.people||[]).forEach(d=>{ if(!d.removed) return;
    const k=d.id||nk(d.name);
    GONE.set(k,{by:d.removedBy||"",at:d.removedAt||"",name:d.name||k,n:d.removedN||0});
    M.pp.delete(k); });
  (docs.people||[]).forEach(d=>{ if(d.mergedInto||d.removed) return;
    const k=d.id||nk(d.name);
    const prev=M.pp.get(k)||{};
    M.pp.set(k,{k:k,name:d.name||prev.name,ck:d.ck!=null?d.ck:(prev.ck||""),role:d.role||prev.role||"",
      hist:(d.hist&&d.hist.length)?d.hist:prev.hist,alt:(d.alt&&d.alt.length)?d.alt:prev.alt,
      addedBy:d.addedBy||prev.addedBy||"",addedAt:d.addedAt||prev.addedAt||""}); });
  (docs.groups||[]).forEach(d=>{ const k=d.id||nk(d.name);
    const prev=M.gr.get(k)||{first:"",last:""};
    M.gr.set(k,{k:k,name:d.name||prev.name,type:d.type||prev.type||"Other",
      archived:d.archived!=null?!!d.archived:!!prev.archived,
      hold:d.hold!=null?!!d.hold:!!prev.hold,
      facilitator:d.facilitator!=null?d.facilitator:(prev.facilitator||""),
      first:prev.first,last:prev.last}); });
  const seen=new Map(); M.mt.forEach((m,i)=>seen.set(m.gk+"|"+m.d,i));
  (docs.meetings||[]).forEach(d=>{
    if(!d.gk||!d.d) return;
    const key=d.gk+"|"+d.d, ex=seen.get(key);
    const rec={id:d.id,gk:d.gk,d:d.d,sum:d.sum||"",label:d.label||"",
               p:new Set(d.p||[]),src:"db",by:d.by||"",at:d.at||"",byId:d.byId||"",
               p0:(ex!=null?M.mt[ex].p0:null),
               cancelled:!!d.cancelled,createdBy:d.createdBy||"",createdAt:d.createdAt||""};
    if(ex!=null && M.mt[ex].src==="db"){ M.mt[ex]=rec; }
    else if(ex!=null){ if(!rec.cancelled) rec.p=new Set([...M.mt[ex].p,...rec.p]); M.mt[ex]=rec; }
    else { seen.set(key,M.mt.length); M.mt.push(rec); }
  });
  /* A saved meeting is merged with the imported one so a facilitator's save adds to the
     history rather than replacing it. That union would also put back anyone a merge folded
     away or a removal took out, so those are applied here — after the union, never before. */
  if(MERGEDTO.size||GONE.size) M.mt.forEach(m=>{
    const had=m.p.size!=null?m.p.size:(m.p.length||0);
    const out=new Set();
    (m.p.forEach?m.p:new Set(m.p)).forEach(k=>{
      if(GONE.has(k)) return;
      let t=k, hops=0;
      while(MERGEDTO.has(t)&&hops++<8) t=MERGEDTO.get(t);   /* a record merged twice */
      if(!GONE.has(t)) out.add(t); });
    if(out.size!==had||[...out].some(k=>!(m.p.has?m.p.has(k):false))){ m.p=out; if(!m.src) m.src="db"; }
    else m.p=out;
  });
  // refresh group first/last
  M.gr.forEach(g=>{ const ds=M.mt.filter(m=>m.gk===g.k).map(m=>m.d).sort();
    if(ds.length){ g.first=ds[0]; g.last=ds[ds.length-1]; } });
}

/* ---- scope ---- */
let SCOPE="all";
function inScope(gk){ const g=M.gr.get(gk); if(!g) return false;
  return SCOPE==="all"||(SCOPE==="active"&&!g.archived)||(SCOPE==="archived"&&g.archived); }
let RANGE={from:"",to:"",preset:"all"};
function inRange(d){ if(RANGE.from&&d<RANGE.from) return false;
  if(RANGE.to&&d>RANGE.to) return false; return true; }
function rangeOn(){ return !!(RANGE.from||RANGE.to); }
function rangeLabel(){
  if(!rangeOn()) return "All Time";
  if(RANGE.from&&RANGE.to) return fmtD(RANGE.from)+" \u2013 "+fmtD(RANGE.to);
  return RANGE.from?("From "+fmtD(RANGE.from)):("Up to "+fmtD(RANGE.to));
}
function meetings(){ return M.mt.filter(m=>inScope(m.gk)&&inRange(m.d)); }
function inIdx(idxs){ return (idxs||[]).filter(i=>inRange(M.mt[i].d)); }
/* A person keeps the same identity for life. Their name can change (marriage, a correction)
   and their employer can change, and every meeting they have ever attended still points at them.
   `hist` records which company they were at and from when, so a meeting counts towards whoever
   they worked for ON THE DAY — moving jobs never rewrites where they used to be. */
function histOf(p){
  if(!p) return [];
  const h=(p.hist&&p.hist.length)?p.hist.slice():[{ck:p.ck||"",from:""}];
  return h.sort((a,b)=>String(a.from||"").localeCompare(String(b.from||"")));
}
function ckAt(pk,d){
  const p=M.pp.get(pk); if(!p) return "";
  const h=histOf(p); if(!h.length) return p.ck||"";
  let ck=h[0].ck||"";
  for(const e of h){ if(!e.from||String(e.from)<=String(d||"9999")) ck=e.ck||ck; else break; }
  return ck||p.ck||"";
}
function coNameOf(ck){ const c=M.co.get(ck); return c?c.name:"\u2014"; }
function coCatOf(ck){ const c=M.co.get(ck); return c?c.cat:"Unknown"; }
function catOf(pk){ const p=M.pp.get(pk); if(!p||!p.ck) return "Unknown"; return coCatOf(p.ck); }
function compName(pk){ const p=M.pp.get(pk); if(!p||!p.ck) return "\u2014"; return coNameOf(p.ck); }
/* the same two, as they stood on the day of a given meeting */
function catAt(pk,d){ const ck=ckAt(pk,d); return ck?coCatOf(ck):"Unknown"; }
function compNameAt(pk,d){ const ck=ckAt(pk,d); return ck?coNameOf(ck):"\u2014"; }

/* People are entered by whoever is in the room, so the same person turns up as Bob Black one
   week and Robert Black the next. These are the everyday short forms; they are only ever used to
   SUGGEST that two records are the same person, never to merge anything on their own. */
const NICK={robert:["bob","rob","bobby","robbie"],william:["bill","will","billy","willie"],
  richard:["dick","rick","rich","ricky"],james:["jim","jimmy","jamie"],john:["jack","johnny","jon"],
  michael:["mike","mick","micky"],charles:["charlie","chuck","chas"],thomas:["tom","tommy"],
  joseph:["joe","joey"],edward:["ed","eddie","ted","teddy"],anthony:["tony"],christopher:["chris"],
  daniel:["dan","danny"],david:["dave","davey"],donald:["don","donny"],elizabeth:["liz","beth","betty","eliza","lizzie"],
  katherine:["kate","kathy","katie","kat"],catherine:["cathy","kate","katie","cate"],margaret:["maggie","meg","peggy","marge"],
  patricia:["pat","patty","trish"],deborah:["deb","debbie"],jennifer:["jen","jenny"],jessica:["jess"],
  rebecca:["becky","becca"],stephen:["steve","steve"],steven:["steve"],matthew:["matt"],nicholas:["nick"],
  andrew:["andy","drew"],benjamin:["ben","benny"],alexander:["alex","al","sandy"],samuel:["sam","sammy"],
  gregory:["greg"],timothy:["tim","timmy"],kenneth:["ken","kenny"],ronald:["ron","ronnie"],
  lawrence:["larry","laurie"],frederick:["fred","freddie"],theodore:["ted","teddy","theo"],
  albert:["al","bert"],arthur:["art","artie"],eugene:["gene"],francis:["frank","fran"],
  raymond:["ray"],vincent:["vince"],peter:["pete"],philip:["phil"],phillip:["phil"],
  douglas:["doug"],jonathan:["jon","jonny"],zachary:["zach"],nathaniel:["nate","nat"],
  susan:["sue","susie"],barbara:["barb","babs"],victoria:["vicky","tori"],veronica:["ronnie"],
  cynthia:["cindy"],sandra:["sandy"],pamela:["pam"],kimberly:["kim"],melissa:["mel"],
  amanda:["mandy"],angela:["angie"],christine:["chris","chrissy"],christina:["chris","tina"],
  theresa:["terry","tess"],teresa:["terry","tess"],virginia:["ginny","ginger"],eleanor:["ellie","nell"],
  gerald:["jerry","gerry"],jeffrey:["jeff"],bradley:["brad"],leonard:["len","lenny"],
  marion:["mary"],rosemary:["rose"],dorothy:["dot","dotty"],frances:["fran","franny"]};
const NICKOF=(function(){ const m=new Map();
  Object.keys(NICK).forEach(full=>{ NICK[full].forEach(n2=>{
    if(!m.has(n2)) m.set(n2,new Set()); m.get(n2).add(full);
    if(!m.has(full)) m.set(full,new Set()); m.get(full).add(n2); }); });
  return m; })();
/* the words of a name, lowercased, nothing else */
function words(nm){ return String(nm||"").toLowerCase().split(/[^a-z]+/).filter(Boolean); }
/* two names that are plausibly the same human: same surname, and first names that match
   outright, by initial, or through a known short form */
function sameNameish(a,b){
  const A=words(a), B=words(b);
  if(!A.length||!B.length) return false;
  if(A.join(" ")===B.join(" ")) return false;                /* identical is not a duplicate pair */
  const as=A[A.length-1], bs=B[B.length-1];
  if(as!==bs||as.length<3) return false;                     /* surnames must agree */
  const af=A[0], bf=B[0];
  if(af===bf) return true;
  if((af.length===1&&bf[0]===af)||(bf.length===1&&af[0]===bf)) return true;
  const n1=NICKOF.get(af), n2=NICKOF.get(bf);
  if(n1&&n1.has(bf)) return true;
  if(n2&&n2.has(af)) return true;
  return false;
}
/* everyone already on file who might be the same person as this name */
function nameLookalikes(nm,skipKey){
  const out=[];
  M.pp.forEach(p=>{ if(p.k===skipKey) return;
    if(sameNameish(nm,p.name)) out.push(p); });
  return out.sort((a,b)=>(M.byP.get(b.k)||[]).length-(M.byP.get(a.k)||[]).length);
}

/* a person found by any name they have gone by, so a later import or a facilitator
   typing the new surname lands on the same person rather than making a second one */
function personKeyFor(name){
  const q=nk(name); if(!q) return "";
  if(M.pp.has(q)) return q;
  const hit=M.nameIdx.get(q); return hit||"";
}
function rebuildNames(){
  M.nameIdx=new Map();
  M.pp.forEach(p=>{ M.nameIdx.set(nk(p.name),p.k);
    (p.alt||[]).forEach(a=>{ if(!M.pp.has(a)) M.nameIdx.set(a,p.k); }); });
}

/* ---- matching a TrackPod session name to a group ---- */
const GALIAS=new Map();               // session key -> group key, remembered between uploads
function bareKey(x){ return nk(String(x||"").replace(/\([^)]*\)/g," ")); }
function resolveGroup(name){
  const k=nk(name); if(M.gr.has(k)) return k;
  if(GALIAS.has(k)) return GALIAS.get(k);
  const b=bareKey(name);
  for(const g of M.gr.values()){ if(bareKey(g.name)===b) return g.k; }
  return "";
}
function guessGroup(name){
  const b=bareKey(name); let best="",bs=0;
  for(const g of M.gr.values()){
    const gb=bareKey(g.name); let sc2=0;
    if(gb.indexOf(b)>=0||b.indexOf(gb)>=0) sc2=Math.min(gb.length,b.length)/Math.max(gb.length,b.length);
    if(sc2>bs){ bs=sc2; best=g.k; }
  }
  return bs>=0.55?best:"";
}

function fyBounds(back){

/* ======================= stats ======================= */
function stats(){
  const ms=meetings().filter(m=>!isCancelled(m)); let recs=0;
  const ppl=new Set(), cos=new Set(), bycat=new Map(), bytype=new Map(), bygrp=new Map(), byco=new Map();
  let summitRecs=0, regRecs=0, summitMtgs=0, noCoRecs=0; const noCoPpl=new Set();
  ms.forEach(m=>{
    if(isCancelled(m)) return;
    recs+=m.p.size;
    const g=M.gr.get(m.gk); const ty=g?g.type:"Other";
    bytype.set(ty,(bytype.get(ty)||0)+m.p.size);
    bygrp.set(m.gk,(bygrp.get(m.gk)||0)+m.p.size);
    if(m.sum){ summitRecs+=m.p.size; summitMtgs++; } else regRecs+=m.p.size;
    m.p.forEach(pk=>{ ppl.add(pk);
      /* the company as it was on the day, so these agree with the category split and the
         company drill-downs after someone changes jobs */
      const c=catAt(pk,m.d); bycat.set(c,(bycat.get(c)||0)+1);
      const ck=ckAt(pk,m.d);
      if(ck){ cos.add(ck); byco.set(ck,(byco.get(ck)||0)+1); } else { noCoRecs++; noCoPpl.add(pk); } });
  });
  let act=0,arc=0; M.gr.forEach(g=>{ if(!inScope(g.k)) return; g.archived?arc++:act++; });
  let metA=0,metR=0; bygrp.forEach((v,k)=>{ const g=M.gr.get(k); if(!g) return; g.archived?metR++:metA++; });
  return {ms,recs,ppl,cos,bycat,bytype,bygrp,byco,summitRecs,regRecs,summitMtgs,act,arc,metA,metR,noCoRecs,noCoPpl};
}

/* ======================= Overview — the facilitator landing page ======================= */
let PICKMODE="fac", PICKFAC="", LOGGK="", LOGISO="";
/* Archived workgroups stay out of the facilitator view by default — nobody is logging
   attendance for a group that stopped meeting — but they are never gone, so one button

let SHOWARC=false;
try{ SHOWARC=localStorage.getItem("mismo.mt.showarchived")==="1"; }catch(e){}

  try{ localStorage.setItem("mismo.mt.showarchived",SHOWARC?"1":"0"); }catch(e){}
  PICKFAC=""; renderAll(); }
function archCount(){ let n2=0; M.gr.forEach(g=>{ if(g.archived) n2++; }); return n2; }
function pickVisible(g){ return SHOWARC||!g.archived; }

function facList(){
  const m=new Map();

    const g=M.gr.get(gk); if(!g||!pickVisible(g)) return;
    const nm=f||(g.facilitator||"").trim(); if(!nm) return;
    if(!m.has(nm)) m.set(nm,[]); m.get(nm).push(gk); });
  M.gr.forEach(g=>{ if(!pickVisible(g)||!g.facilitator) return;
    if((M.sched||{})[g.k]) return;
    const nm=g.facilitator.trim(); if(!m.has(nm)) m.set(nm,[]);
    if(m.get(nm).indexOf(g.k)<0) m.get(nm).push(g.k); });
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}
/* scheduled dates in the last 60 days with nothing logged against them */
function pendingFor(gk){
  const g0=M.gr.get(gk); if(g0&&g0.hold) return [];   /* on hold: nothing is owed */
  const sc=(M.sched||{})[gk]; if(!sc||!sc.rule) return [];
  const have=new Set((M.byG.get(gk)||[]).map(i=>M.mt[i].d));
  const now=etNow(), out=[];
  for(let i=0;i<60;i++){
    const d=new Date(now.getTime()); d.setDate(d.getDate()-i);
    if(!meetsOn(sc.rule,d)) continue;
    const iso=dISO(d);
    if(i===0){ const sp=spanOf(sc); if(sp&&(now.getHours()*60+now.getMinutes())<sp[1]) continue; }
    if(!have.has(iso)) out.push(iso);
  }
  return out;
}
function lastLogged(gk){
  const idx=M.byG.get(gk)||[]; let d="";
  idx.forEach(i=>{ if(!isCancelled(M.mt[i])&&M.mt[i].d>d) d=M.mt[i].d; });
  return d;
}
function liveCount(gk){ return (M.byG.get(gk)||[]).filter(i=>!isCancelled(M.mt[i])).length; }
function nextDue(gk){
  const p=pendingFor(gk);
  if(p.length) return p[0];
  const sc=(M.sched||{})[gk];
  if(sc&&sc.rule){ const now=etNow();
    if(meetsOn(sc.rule,now)) return dISO(now); }
  return todayISO();
}
function openLog(gk,iso){ LOGGK=gk; LOGISO=iso||nextDue(gk); go("ov"); window.scrollTo(0,0); }

function renderOverview(root){
  root.appendChild(todayBox());
  if(LOGGK){ logScreen(root); return; }

    ab.type="button"; ab.id="pk-arc";

      :"Also show the "+n(na)+" workgroups that have stopped meeting. Their attendance is kept for good.";
    ab.addEventListener("click",()=>setShowArc(!SHOWARC));

const GTYPES=["Development Workgroup","Community of Practice","Forum","Workgroup",
  "Governance","Workshop","Other"];
/* A new workgroup starts here: a name, what kind it is, and who runs it. Its day, time,
   cadence and Zoom link are set afterwards in Meeting Schedule and Settings. */
function newGroupPane(){
  openPane("Add a Workgroup","It appears straight away on the A\u2013Z list and in the log screen",()=>{

      if(ex){
        const b=el("div","banner warn-b");
        b.innerHTML="<b>"+esc2(ex.name)+" already exists.</b>"+(ex.archived?" It is archived \u2014 open it and bring it back rather than making a second one.":"");
        warn.appendChild(b);
