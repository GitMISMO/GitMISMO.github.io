function loadRoster(){
  refreshPending();
  const host=$("#lg-state"); if(!host) return; host.textContent="";
  const gk=$("#lg-grp").value, d=$("#lg-date").value;
  LOG.gk=gk; LOG.d=d; LOG.present=new Set(); LOG.extra=[]; LOG.existing=null;
  if(!gk||!d){ host.appendChild(el("div","empty","Choose a group and a date to bring up its roster.")); return; }

  /* check the shared data once per group+date, in case another facilitator has
     logged or cancelled this one since the page was opened */
  const sk=gk+"|"+d;
  if(LOG.syncKey!==sk){
    LOG.syncKey=sk; LOG.force=false;
    syncMeeting(gk,d).then(()=>{ if(LOG.gk===gk&&LOG.d===d) loadRoster(); });
  }

  const idxs=M.byG.get(gk)||[];
  const ex=idxs.find(i=>M.mt[i].d===d);
  LOG.seenAt=atOf(ex!=null?M.mt[ex]:null);
  if(ex!=null&&isCancelled(M.mt[ex])){
    LOG.existing=ex;
    const cb=el("div","banner warn-b");
    cb.innerHTML="<b>This meeting is recorded as cancelled.</b> "+esc(savedByText(M.mt[ex]))+
      (M.mt[ex].label?" \u2014 \u201c"+esc(M.mt[ex].label)+"\u201d":"")+
      ". No attendance is counted for it. Reopen it below if it went ahead after all.";
    host.appendChild(cb);
  }
  else if(ex!=null){ LOG.existing=ex; M.mt[ex].p.forEach(pk=>LOG.present.add(pk));
    const b=el("div","banner ok");
    b.innerHTML="<b>This meeting is already recorded.</b> "+n(M.mt[ex].p.size)+" people were marked present on "+fmtD(d)+
      ". "+esc(savedByText(M.mt[ex]))+". Change the ticks below and save again to update it.";
    host.appendChild(b); }

  /* the note belongs to the meeting, not to the screen: reset it on every date change */
  const savedNote=(ex!=null?(M.mt[ex].label||""):"");
  const noteEl=$("#lg-note"); if(noteEl) noteEl.value=savedNote;
  LOG.note=savedNote;

  const saved=new Set(LOG.present);
  const dr=DRAFTS.get(gk+"|"+d);
  if(dr&&(!sameSet(dr.p,saved)||(dr.note||"")!==savedNote)){
    LOG.present=new Set(dr.p);
    if(noteEl){ noteEl.value=dr.note||""; LOG.note=dr.note||""; }
    const nb=el("div","banner");
    nb.innerHTML="<b>Picking up where you left off.</b> Not saved yet \u2014 "+
      n(dr.p.size)+" marked present"+((dr.note||"")!==savedNote?" and a note":"")+
      ". Save to keep it, or Clear All to start again.";
    host.appendChild(nb);
  }

  const seen=new Map(), lastd=new Map();
  idxs.forEach(i=>{ const m=M.mt[i]; m.p.forEach(pk=>{ seen.set(pk,(seen.get(pk)||0)+1);
    if(!lastd.get(pk)||m.d>lastd.get(pk)) lastd.set(pk,m.d); }); });
  const roster=[...seen.keys()].map(k=>M.pp.get(k)).filter(Boolean)
    .sort((a,b)=>(lastd.get(b.k)||"").localeCompare(lastd.get(a.k)||"")||(seen.get(b.k)-seen.get(a.k))||a.name.localeCompare(b.name));
  /* someone added to this meeting who has never attended it before still belongs on the list */
  LOG.present.forEach(pk=>{ if(seen.has(pk)) return; const p2=M.pp.get(pk); if(!p2) return;
    seen.set(pk,0); roster.unshift(p2); });

  const bar=el("div","rosterbar");
  const nb=el("div"); nb.appendChild(el("div","nl","Marked Present")); const nn=el("div","n","0"); nn.id="lg-n"; nb.appendChild(nn);
  bar.appendChild(nb);
  const sb=el("div","fld"); sb.style.flex="1 1 180px"; sb.style.maxWidth="250px";
  const si=el("input"); si.type="search"; si.placeholder="Filter this list"; si.id="lg-q"; sb.appendChild(si); bar.appendChild(sb);
  /* a facilitator reading down a sign-in sheet wants the list in the same order as the sheet */
  const ob=el("div","fld"); ob.style.flex="0 0 auto";
  const os=el("select"); os.id="lg-sort"; os.setAttribute("aria-label","Order the roster");
  os.style.cssText="border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;background:var(--surface);color:var(--ink)";
  [["recent","Most Recent First"],["name","First Name A\u2013Z"],["co","Company A\u2013Z"]]
    .forEach(([v,t])=>{ const o=el("option",null,t); o.value=v; os.appendChild(o); });
  os.value=ROSTSORT;
  os.addEventListener("change",()=>{ ROSTSORT=os.value;
    try{ localStorage.setItem("mt.roster.sort",ROSTSORT); }catch(e){}
    drawRoster(roster,seen,lastd); });
  ob.appendChild(os); bar.appendChild(ob);
  const sp=el("div","sp");
  const clr=el("button","btn ghost","Clear All"); clr.type="button";
  clr.addEventListener("click",()=>{ LOG.present=new Set(); keepDraft(); drawRoster(roster,seen,lastd); });
  const sv=el("button","btn","Save Attendance"); sv.type="button"; sv.id="lg-save";
  sv.addEventListener("click",saveMeeting); if(!CANWRITE) sv.disabled=true;
  const cancelled=(ex!=null&&isCancelled(M.mt[ex]));
  const cb2=el("button","btn "+(cancelled?"ghost":"danger"),cancelled?"Reopen This Meeting":"Mark Cancelled");
  cb2.type="button"; cb2.id="lg-cancel";
  cb2.title=cancelled?"Put this meeting back so attendance can be logged"
    :"Record that this meeting did not take place \u2014 nobody is marked present and it stops showing as still to log";
  let armed=false;
  cb2.addEventListener("click",()=>{
    if(cancelled){ setCancelled(false); return; }
    if(!armed){ armed=true; cb2.textContent="Cancel It \u2014 Click Again to Confirm";
      setTimeout(()=>{ armed=false; cb2.textContent="Mark Cancelled"; },6000); return; }
    setCancelled(true);
  });
  if(!CANWRITE) cb2.disabled=true;
  if(cancelled){ sv.disabled=true; clr.disabled=true;
    sv.title="This meeting is recorded as cancelled. Reopen it first to log attendance.";
    sp.append(cb2,clr,sv); }
  else sp.append(copyBtn(()=>[...LOG.present],host),cb2,clr,sv);
  bar.appendChild(sp);
  host.appendChild(bar);

  si.addEventListener("input",()=>drawRoster(roster,seen,lastd));

  /* two slim buttons instead of two forms — both open in the right-hand panel so the
     roster keeps the screen */
  const tools=el("div"); tools.id="lg-tools";
  tools.style.cssText="display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px;color:var(--ink-3)";
  const t1=el("span",null,"Not on the list?");
  const addB=el("button","btn ghost","Add Someone"); addB.type="button"; addB.id="lg-addbtn";
  addB.addEventListener("click",()=>openAddPane());
  const t2=el("span",null,"Name or company changed?"); t2.style.marginLeft="6px";
  const fixB=el("button","btn ghost","Update Someone\u2019s Details"); fixB.type="button"; fixB.id="lg-fix";
  fixB.addEventListener("click",()=>openFixPane());
  tools.append(t1,addB,t2,fixB);
  host.appendChild(tools);

  const rl=el("div"); rl.id="lg-roster"; host.appendChild(rl);
  /* a cancelled meeting has no roster to tick — hide the list and the add box
     so nobody spends time marking people who cannot be saved */
  if(cancelled){
    tools.hidden=true; sb.hidden=true;
    const z=el("div","empty","Nothing to tick — this meeting did not take place. Use Reopen This Meeting if it went ahead after all.");
    rl.appendChild(z);
  }


  if(!cancelled) drawRoster(roster,seen,lastd);
}

let ROSTSORT=(()=>{ try{ return localStorage.getItem("mt.roster.sort")||"recent"; }catch(e){ return "recent"; } })();
/* A to Z on a roster means by the name as it is written \u2014 first name first */
function byFirst(nm){ return String(nm||"").trim().toLowerCase(); }
function drawRoster(roster,seen,lastd){
  const host=$("#lg-roster"); if(!host) return; host.textContent="";
  const q=nk(($("#lg-q")||{}).value||"");
  let list=q?roster.filter(p=>nk(p.name).indexOf(q)>=0||nk(compName(p.k)).indexOf(q)>=0):roster.slice();
  if(ROSTSORT==="name") list=list.slice().sort((a,b)=>byFirst(a.name).localeCompare(byFirst(b.name)));
  else if(ROSTSORT==="co"){
    /* a blank company is not a company name — those go to the end, not in front of the A's */
    const co=p=>{ const c=M.pp.get(p.k); return (c&&c.ck)?compName(p.k):""; };
    list=list.slice().sort((a,b)=>{
      const ca=co(a), cb=co(b);
      if(!ca!==!cb) return ca?-1:1;
      return ca.localeCompare(cb)||byFirst(a.name).localeCompare(byFirst(b.name)); });
  }
  const box=el("div","roster");
  list.slice(0,900).forEach(p=>{
    const b=el("button","rp"+(LOG.present.has(p.k)?" on":"")+((seen.get(p.k)||0)===0?" newp":"")); b.type="button";
    const bx=el("span","bx"); bx.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
    b.appendChild(bx);
    b.appendChild(el("span","pn",p.name));
    b.appendChild(el("span","pc",compName(p.k)));
    b.appendChild(el("span","pk",catOf(p.k)));
    b.appendChild(el("span","pl",(seen.get(p.k)||0)===0?"new":n(seen.get(p.k))+"×"));
    /* somebody typed in by hand, in this room, who should not have been: let them be taken
       off the master list from here rather than hunted down later */
    if(CANWRITE&&p.addedBy){
      const had=(M.byP.get(p.k)||[]).length;
      const x=el("span","rpx"); x.setAttribute("role","button"); x.tabIndex=0;
      x.textContent="×";
      x.title="Added by hand — take this record off the master list altogether";
      let armX=false;
      const fire=async ev=>{ ev.stopPropagation(); ev.preventDefault();
        if(!armX){ armX=true; x.classList.add("arm");
          x.textContent=had?("Remove + "+n(had)+" record"+(had===1?"":"s")+"?"):"Remove Them?";
          setTimeout(()=>{ if(!x.isConnected) return; armX=false;
            x.classList.remove("arm"); x.textContent="×"; },6000); return; }
        x.textContent="…";
        LOG.present.delete(p.k); keepDraft();
        await removePerson(p.k,()=>renderAll(true)); };
      x.addEventListener("click",fire);
      x.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" ") fire(e); });
      b.appendChild(x);
    }
    b.addEventListener("click",()=>{ if(!CANWRITE) return;
      if(LOG.present.has(p.k)) LOG.present.delete(p.k); else LOG.present.add(p.k);
      b.classList.toggle("on",LOG.present.has(p.k)); $("#lg-n").textContent=n(LOG.present.size);
      keepDraft(); });
    box.appendChild(b);
  });
  if(!list.length) box.appendChild(el("div","empty",roster.length?"Nobody matches that filter.":"This group has no roster yet — add the first people below."));
  host.appendChild(box);
  if(list.length>900) host.appendChild(el("div","hint","Showing the first 900. Use the filter to narrow the list."));
  const nn=$("#lg-n"); if(nn) nn.textContent=n(LOG.present.size);
}

function whoAmI(){ return (USER&&USER.name)||"Someone signed in"; }
function readOnlyBanner(){
  if(CANWRITE) return null;
  const b=el("div","banner warn-b");
  b.innerHTML=SELFHOST
    ? (RELAYDOWN
        ? "<b>Saving is not reachable right now.</b> "+esc(RELAY.name)+" did not answer, so attendance cannot be logged on this copy. Everything already on file is still here to read. Try again shortly, or tell Jonna."
        : "<b>This copy is read-only.</b> The whole history is here to look through, but it has not been connected to "+esc(RELAY.name)+" yet, so attendance cannot be logged on it.")
    : "<b>You have view-only access to this page.</b> Attendance can be read here but not logged. Ask Jonna for edit access if you facilitate a group.";
  return b;
}
function savedByText(m){
  if(!m) return "";
  if(m.src!=="db"&&!m.by) return "Imported from the tracker workbooks";
  const who=m.by||"someone";
  const when=m.at?fmtD(String(m.at).slice(0,10)):"";
  let t="Logged by "+who+(when?" on "+when:"");
  if(m.createdBy&&m.createdBy!==m.by) t+=" \u00b7 first recorded by "+m.createdBy+
    (m.createdAt?" on "+fmtD(String(m.createdAt).slice(0,10)):"");
  return t;
}
async function setCancelled(on){
  if(!LOG.gk||!LOG.d){ toast("Pick a group and a date.",true); return; }
  const btn=$("#lg-cancel"); if(btn){ btn.disabled=true; btn.textContent=on?"Saving\u2026":"Reopening\u2026"; }
  const id="m_"+LOG.gk+"_"+LOG.d.replace(/-/g,"");
  const live=await syncMeeting(LOG.gk,LOG.d);
  if(on && atOf(live)!==LOG.seenAt && !isCancelled(live)){
    if(btn){ btn.disabled=false; btn.textContent="Mark Cancelled"; }
    LOG.seenAt=atOf(live);
    toast("Someone else recorded this meeting just now \u2014 nothing was cancelled. Have another look.",true);
    loadRoster(); return;
  }
  const prev=live||(LOG.existing!=null?M.mt[LOG.existing]:null);
  const now=new Date().toISOString(), me=whoAmI();
  const reason=($("#lg-note")||{}).value||"";
  let okr;
  if(on){
    okr=await saveDoc("meetings",id,{gk:LOG.gk,d:LOG.d,sum:(prev&&prev.sum)||"",label:reason,
      p:[],cancelled:true,by:me,byId:(USER&&USER.id)||"",at:now,
      createdBy:(prev&&prev.createdBy)||(prev&&prev.by)||me,
      createdAt:(prev&&prev.createdAt)||(prev&&prev.at)||now});
  }else{
    okr=await removeDoc("meetings",id,{gk:LOG.gk,d:LOG.d});
  }
  if(btn){ btn.disabled=false; }
  if(!okr){ loadRoster(); return; }
  if(on){
    const rec={id:id,gk:LOG.gk,d:LOG.d,sum:(prev&&prev.sum)||"",label:reason,p:new Set(),
      cancelled:true,by:me,at:now,createdBy:(prev&&prev.createdBy)||(prev&&prev.by)||me,src:"db"};
    const exi=(M.byG.get(LOG.gk)||[]).find(x=>M.mt[x].d===LOG.d);
    if(exi!=null) M.mt[exi]=rec; else M.mt.push(rec);
    LOG.seenAt=now;
  }else{
    LOG.seenAt="";
    const i=(M.byG.get(LOG.gk)||[]).find(x=>M.mt[x].d===LOG.d);
    if(i!=null) M.mt.splice(i,1);
  }
  DRAFTS.delete(LOG.gk+"|"+LOG.d);
  LOG.present=new Set();
  buildIndexes();
  const g=M.gr.get(LOG.gk);
  if(on){
    const ugk=LOG.gk, ud=LOG.d;
    setUndo("<b>"+esc(g?g.name:"")+" on "+esc(fmtD(ud))+"</b> marked cancelled.",async()=>{
      const okr2=await removeMany([{c:"meetings",id:"m_"+ugk+"_"+ud.replace(/-/g,""),data:{gk:ugk,d:ud}}],
        it=>!!(it&&it.cancelled));
      if(!okr2) return false;
      for(let i=M.mt.length-1;i>=0;i--){ const m=M.mt[i];
        if(m.gk===ugk&&m.d===ud&&m.cancelled&&m.src==="db") M.mt.splice(i,1); }
      buildIndexes();
      toast("Cancellation undone \u2014 that date is back on the to-log list.");
      renderToday(); tickToday();
      if(LOGGK) loadRoster(); else renderAll(true);
      return true;
    },false);
  } else clearUndo();
  if(!on) toast("Meeting reopened. Log attendance when you are ready.");
  renderToday(); tickToday(); loadRoster();
}
/* take one person off a meeting from its own panel */
async function dropFromMeeting(gk,d,pk,nm){
  const live=await syncMeeting(gk,d);
  const m=live||findMeeting(gk,d);
  if(!m||!m.p.has(pk)){ toast("They are not on that meeting any more.",true); openMeeting(gk,d); return; }
  const left=[...m.p].filter(x=>x!==pk);
  const id="m_"+gk+"_"+String(d).replace(/-/g,"");
  const now=new Date().toISOString(), me=whoAmI();
  const g=M.gr.get(gk);
  let okr;
  if(!left.length){
    okr=await removeDoc("meetings",id,{gk:gk,d:d});
    if(!okr) return;
    for(let i=M.mt.length-1;i>=0;i--){ const x=M.mt[i];
      if(x.gk===gk&&x.d===d&&x.src==="db") M.mt.splice(i,1); }
  }else{
    const data={gk:gk,d:d,sum:m.sum||"",label:m.label||"",p:left,
      by:me,byId:(USER&&USER.id)||"",at:now,
      createdBy:m.createdBy||m.by||me,createdAt:m.createdAt||m.at||now};
    okr=await saveDoc("meetings",id,data);
    if(!okr) return;
    const rec=Object.assign({},data,{id:id,p:new Set(left),src:"db"});
    const ex=(M.byG.get(gk)||[]).find(i=>M.mt[i].d===d);
    if(ex!=null) M.mt[ex]=rec; else M.mt.push(rec);
  }
  DRAFTS.delete(gk+"|"+d);
  buildIndexes();
  renderToday(); tickToday(); renderAll(true);
  if(left.length) openMeeting(gk,d); else closePane();
  toast(nm+" taken off "+(g?g.name:"")+", "+fmtD(d)+
    (left.length?"." : " \u2014 nobody was left, so that meeting is off the record."));
}

/* unticking everyone on a meeting logged here: offer to remove the record outright */
let EMPTYARM=0;
async function emptyMeeting(){
  const btn=$("#lg-save"); if(!btn) return;
  const g=M.gr.get(LOG.gk);
  if(Date.now()-EMPTYARM>6000){
    EMPTYARM=Date.now();
    btn.textContent="Remove This Meeting \u2014 Click Again";
    btn.classList.add("danger");
    toast("Nobody is ticked. Click again to take this meeting off the record altogether, or tick someone and save.",true);
    setTimeout(()=>{ const b2=$("#lg-save"); if(b2&&Date.now()-EMPTYARM>=6000){
      b2.textContent="Save Attendance"; b2.classList.remove("danger"); } },6200);
    return;
  }
  EMPTYARM=0;
  btn.disabled=true; btn.textContent="Removing\u2026";
  const id="m_"+LOG.gk+"_"+LOG.d.replace(/-/g,"");
  const gk=LOG.gk, d=LOG.d;
  const okr=await removeDoc("meetings",id,{gk:gk,d:d});
  btn.disabled=false; btn.textContent="Save Attendance"; btn.classList.remove("danger");
  if(!okr) return;
  for(let i=M.mt.length-1;i>=0;i--){ const m=M.mt[i];
    if(m.gk===gk&&m.d===d&&m.src==="db") M.mt.splice(i,1); }
  DRAFTS.delete(gk+"|"+d);
  buildIndexes(); clearUndo();
  LOG.seenAt=""; LOG.force=false;
  renderToday(); tickToday(); loadRoster();
  toast("That meeting is off the record \u2014 "+(g?g.name:"")+", "+fmtD(d)+". It is back on the list still to log.");
}

async function saveMeeting(){
  if(!LOG.gk||!LOG.d){ toast("Pick a group and a date.",true); return; }
  if(LOG.existing!=null&&isCancelled(M.mt[LOG.existing])){
    toast("This meeting is recorded as cancelled. Reopen it first to log attendance.",true); return; }
  if(!LOG.present.size){
    /* Everyone has been unticked. On a meeting already on file that means "take this record
       away" — which is a real thing to want after adding the wrong person — so offer it
       rather than refusing the save and leaving them stuck. */
    const ex0=(M.byG.get(LOG.gk)||[]).find(i=>M.mt[i].d===LOG.d);
    if(ex0!=null&&M.mt[ex0].src==="db"){ emptyMeeting(); return; }
    toast(ex0!=null
      ? "Nobody is ticked. This meeting came from the tracker workbooks, so it cannot be emptied here \u2014 untick who was not there and leave at least one person, or mark the meeting cancelled."
      : "Nobody is marked present yet.",true);
    return; }
  const btn=$("#lg-save"); btn.disabled=true; btn.textContent="Saving\u2026";
  /* someone else may have saved or cancelled this very meeting since this screen was opened */
  const live=await syncMeeting(LOG.gk,LOG.d);
  if(!LOG.force && atOf(live)!==LOG.seenAt){
    LOG.force=true;
    btn.disabled=false; btn.textContent="Save Anyway";
    const host=$("#lg-state");
    if(host){
      const w=el("div","banner warn-b"); w.id="lg-clash";
      w.innerHTML="<b>Someone else changed this meeting while you had it open.</b> "+
        esc(savedByText(live))+(isCancelled(live)?" \u2014 it is now marked cancelled.":".")+
        " Your ticks are still here. Click <b>Save Anyway</b> to replace what they recorded, "+
        "or pick the date again to start from theirs.";
      const old=$("#lg-clash"); if(old) old.remove();
      host.insertBefore(w,host.firstChild);
      w.scrollIntoView({block:"center",behavior:"smooth"});
    }
    toast("Someone else changed this meeting. Nothing was saved yet.",true);
    return;
  }
  const id="m_"+LOG.gk+"_"+LOG.d.replace(/-/g,"");
  const note=($("#lg-note")||{}).value||"";
  const prev=live||(LOG.existing!=null?M.mt[LOG.existing]:null);
  const now=new Date().toISOString(), me=whoAmI();
  const data={gk:LOG.gk,d:LOG.d,sum:(prev&&prev.sum)||"",label:note,
    p:[...LOG.present],by:me,byId:(USER&&USER.id)||"",at:now,
    createdBy:(prev&&prev.createdBy)||(prev&&prev.by)||me,
    createdAt:(prev&&prev.createdAt)||(prev&&prev.at)||now};
  const okr=await saveDoc("meetings",id,data);
  btn.disabled=false; btn.textContent="Save Attendance";
  if(!okr) return;
  clearUndo();
  LOG.force=false; LOG.seenAt=now;
  const rec=Object.assign({},data,{id:id,p:new Set(LOG.present),src:"db"});
  const exi=(M.byG.get(LOG.gk)||[]).find(i=>M.mt[i].d===LOG.d);
  if(exi!=null) M.mt[exi]=rec; else M.mt.push(rec);
  const g=M.gr.get(LOG.gk); if(g){ if(!g.last||LOG.d>g.last) g.last=LOG.d; if(!g.first||LOG.d<g.first) g.first=LOG.d; }
  buildIndexes();
  DRAFTS.delete(LOG.gk+"|"+LOG.d);
  toast(n(LOG.present.size)+" marked present for "+(g?g.name:"")+" on "+fmtD(LOG.d)+".");
  loadRoster();
}
</script>
<script>
"use strict";
/* ======================= Summits ======================= */
function summitList(){ return [...M.summits.values()].sort((a,b)=>(b.start||"").localeCompare(a.start||"")); }
function statSummits(root){
  const f=el("div","filters");
  f.innerHTML='<select id="f-sum" aria-label="Summit"></select><span class="count" id="f-sc"></span>';
  root.appendChild(f);
  const sel=$("#f-sum",f);
  summitList().forEach(s=>{ const o=el("option",null,s.name); o.value=s.k; sel.appendChild(o); });
  const host=el("div"); host.id="sum-host"; root.appendChild(host);
  root.appendChild(buildUploader());
  sel.addEventListener("change",renderSummitBody);
  renderSummitBody();
}
function renderSummitBody(){
  const host=$("#sum-host"); if(!host) return; host.textContent="";
  const k=$("#f-sum").value, s=M.summits.get(k); if(!s){ host.appendChild(el("div","empty","No summits yet — upload a TrackPod export below.")); return; }
  const ms=M.mt.filter(m=>m.sum===k&&inRange(m.d));
  let recs=0; const ppl=new Set(), cos=new Map(), cats=new Map(), sess=new Map(), days=new Map();
  ms.forEach(m=>{ recs+=m.p.size; sess.set(m.gk,(sess.get(m.gk)||0)+m.p.size);
    days.set(m.d,(days.get(m.d)||0)+m.p.size);
    m.p.forEach(pk=>{ ppl.add(pk); const c=catAt(pk,m.d); cats.set(c,(cats.get(c)||0)+1);
      const p=M.pp.get(pk); if(p&&p.ck) cos.set(p.ck,(cos.get(p.ck)||0)+1); }); });
  $("#f-sc").textContent=fmtD(s.start)+" – "+fmtD(s.end);
  const t=el("div","tiles");
  t.append(tile("Attendance Records",n(recs),"Scans across all sessions","var(--c1)"),
    tile("Sessions",n(ms.length),"Tracked meetings","var(--c2)"),
    tile("People",n(ppl.size),"Unique attendees","var(--c3)"),
    tile("Companies",n(cos.size),"Represented","var(--c4)"),
    tile("Avg per Session",n(ms.length?Math.round(recs/ms.length):0),"People in the room","var(--c6)"),
    tile("Days",n(days.size),"Of programming","var(--ink-3)"));
  host.appendChild(t);
  host.appendChild(panel("Attendance by Day",
    "How the room filled across the summit.",
    mixBar([...days.entries()].sort().map(([d,v],i)=>({label:fmtD(d),value:v,color:sc(i)})))));
  host.appendChild(panel("Who Was in the Room",
    "Category mix across every session at this summit.",
    (()=>{ const arr=[...cats.entries()].sort((a,b)=>b[1]-a[1]);
      return barList(arr.map(([c,v],i)=>({label:c,value:v,color:ramp(i,arr.length)})),{labelWidth:"230px"}); })()));
  host.appendChild(sect("Sessions by Attendance",sess.size,()=>barList(
    [...sess.entries()].sort((a,b)=>b[1]-a[1]).map(([gk,v])=>{ const g=M.gr.get(gk);
      return {label:g?g.name:gk,value:v,color:"var(--c1)",go:()=>openGroup(gk)};}),{labelWidth:"280px",pct:false})));
  host.appendChild(sect("Companies at This Summit",cos.size,()=>barList(
    [...cos.entries()].sort((a,b)=>b[1]-a[1]).slice(0,40).map(([ck,v])=>{ const c=M.co.get(ck);

let PARSED=null;
/* ======================= bulk load people ======================= */
/* A membership list or a summit registration export, straight into the master list that
   feeds Add Someone. Anyone MISMO already knows is matched, not duplicated. */
let PPL=null;
function pickCol(head,wants,avoid){
  for(const w of wants){ const i=head.findIndex(h=>nk(h)===nk(w)); if(i>=0) return i; }
  for(const w of wants){ const i=head.findIndex(h=>nk(h).indexOf(nk(w))>=0&&!(avoid&&avoid.test(h)));
    if(i>=0) return i; }
  return -1;
}
function parsePeopleSheet(name,buf){
  let wb; try{ wb=XLSX.read(buf,{type:"array",cellDates:true}); }
  catch(e){ return {err:"That file could not be opened. It needs to be .xlsx, .xls or .csv."}; }
  const sn=wb.SheetNames[0];
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""});
  if(!aoa.length) return {err:"That sheet is empty."};
  let hi=-1;
  for(let i=0;i<Math.min(12,aoa.length);i++){
    const row=(aoa[i]||[]).map(x=>String(x||""));
    if(pickCol(row,["name","full name","attendee","first name","firstname","last name","surname"])>=0){ hi=i; break; }
  }
  if(hi<0) return {err:"No column headed Name (or First Name) was found in the first few rows."};
  const head=(aoa[hi]||[]).map(x=>String(x||""));
  const cFirst=pickCol(head,["first name","firstname","given name","first"]);
  const cLast=pickCol(head,["last name","lastname","surname","family name","last"]);
  /* a column headed "First Name" must never be mistaken for the whole name */
  const NOTNAME=/first|last|sur|given|family|user|login|company|organi|file|nick|screen/i;
  const cFull=(cFirst>=0&&cLast>=0)?-1:pickCol(head,["full name","name","attendee name","attendee"],NOTNAME);
  const cCo=pickCol(head,["company","organization","organisation","employer","company name","org"]);
  const cRole=pickCol(head,["title","job title","role","position"]);
  if(cFull<0&&(cFirst<0||cLast<0)) return {err:"There needs to be a Name column, or First Name and Last Name columns."};
  const rows=[], bad=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i]||[];
    let nm=cFull>=0?String(r[cFull]||"").trim():"";
    if(!nm&&cFirst>=0) nm=(String(r[cFirst]||"").trim()+" "+String(cLast>=0?r[cLast]||"":"").trim()).trim();
    if(!nm) continue;
    if(/^(total|totals|grand total)$/i.test(nm)) continue;
    const co=cCo>=0?String(r[cCo]||"").trim():"";
    const role=cRole>=0?String(r[cRole]||"").trim():"";
    if(nm.length<2||!/[a-z]/i.test(nm)){ bad.push(nm); continue; }
    rows.push({name:nm,co:co,role:role});
  }
  if(!rows.length) return {err:"No names were found under that header row."};
  /* work out what each row would do */
  const seen=new Set();
  rows.forEach(r=>{
    const k=personKeyFor(r.name)||nk(r.name);
    r.key=k;
    if(seen.has(k)){ r.what="dupe-in-file"; return; }
    seen.add(k);
    if(M.pp.has(k)) r.what="known";
    else { const look=nameLookalikes(r.name,""); r.look=look.slice(0,3);
      r.what=look.length?"maybe":"new"; }
    if(r.co){ r.ck=nk(r.co); r.newCo=!M.co.has(r.ck); }
  });
  return {name:name,sheet:sn,rows:rows,bad:bad,
    known:rows.filter(r=>r.what==="known").length,
    nw:rows.filter(r=>r.what==="new").length,
    maybe:rows.filter(r=>r.what==="maybe").length,
    dupes:rows.filter(r=>r.what==="dupe-in-file").length,
    newCos:[...new Set(rows.filter(r=>r.newCo).map(r=>r.co))]};
}

const H_SESS=["sessionname","session","sessioncode","sessiondescription","group"];
const H_FULL=["firstlastname","who","name","attendeename"];
const H_FIRST=["firstname"], H_LAST=["lastname"];
const H_ORG=["organization","company","organisation","badgecompany"];
const H_DATE=["sessionstartson","scannedon","datetimescanned","date","sessiondate"];
function pick(hdr,cands){ for(const c of cands){ const i=hdr.indexOf(c); if(i>=0) return i; } return -1; }
function xlDate(v){
  if(v instanceof Date) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  const s=String(v||"").trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return y+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0"); }
  return "";
}
function handleFile(file){
  const out=$("#dzout"); out.textContent="";
  out.appendChild(el("div","hint","Reading "+file.name+"…"));
  const fr=new FileReader();
  fr.onload=()=>{
    let wb; try{ wb=XLSX.read(fr.result,{type:"array",cellDates:true}); }
    catch(err){ out.textContent=""; const b=el("div","banner"); b.innerHTML="<b>That file could not be read.</b> It needs to be the TrackPod export as .xlsx, .xls or .csv."; out.appendChild(b); return; }
    try{ PARSED=parseWorkbook(wb,file.name); }
    catch(err){ out.textContent=""; const b=el("div","banner");
      b.innerHTML="<b>No attendance columns were found.</b> "+esc(err.message); out.appendChild(b); return; }
    showPreview(PARSED,out);
  };
  fr.readAsArrayBuffer(file);
}
function parseWorkbook(wb,fname){
  const rows=[]; let layout="";
  wb.SheetNames.forEach(sn=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,dateNF:"yyyy-mm-dd",defval:""});
    if(aoa.length<2) return;
    let hr=0,best=0;
    for(let i=0;i<Math.min(4,aoa.length);i++){ const c=aoa[i].filter(x=>String(x).trim()).length; if(c>best){best=c;hr=i;} }
    const hdr=aoa[hr].map(x=>nk(x));
    const iS=pick(hdr,H_SESS), iF=pick(hdr,H_FULL), i1=pick(hdr,H_FIRST), i2=pick(hdr,H_LAST),
          iO=pick(hdr,H_ORG), iD=pick(hdr,H_DATE);
    // wide meeting-tracker layout: Who + date columns
    const dateCols=[];
    hdr.forEach((h,i)=>{ if(i<5) return; const d=xlDate(aoa[hr][i]); if(d) dateCols.push([i,d]); });
    if(iF>=0 && iS>=0 && dateCols.length && iD<0){
      layout=layout||"Meeting tracker sheet";
      for(let r=hr+3;r<aoa.length;r++){ const row=aoa[r]; if(!row) continue;
        const who=String(row[iF]||"").trim(); if(!who) continue;
        const grp=String(row[iS]||"").trim(); const org=iO>=0?String(row[iO]||"").trim():"";
        dateCols.forEach(([ci,d])=>{ const v=row[ci]; if(v!==""&&v!=null&&v!=="0") rows.push({s:grp,who:who,org:org,d:d}); }); }
      return;
    }
    if(iS<0 || (iF<0 && (i1<0||i2<0))) return;
    layout=layout||((i1>=0&&i2>=0)?"TrackPod scan export":"Name-tag export");
    for(let r=hr+1;r<aoa.length;r++){ const row=aoa[r]; if(!row) continue;
      const s=String(row[iS]||"").trim(); if(!s) continue;
      let who=iF>=0?String(row[iF]||"").trim():"";
      if(!who && i1>=0) who=(String(row[i1]||"").trim()+" "+String(row[i2]||"").trim()).trim();
      if(!who) continue;
      const d=iD>=0?xlDate(row[iD]):"";
      rows.push({s:s,who:who,org:iO>=0?String(row[iO]||"").trim():"",d:d}); }
  });
  if(!rows.length) throw new Error("No rows with a session name and an attendee name were found in "+fname+".");
  const withD=rows.filter(r=>r.d); if(!withD.length) throw new Error("No usable dates were found — the export needs a session date or scan time column.");
  const seen=new Set(), out=[];
  withD.forEach(r=>{ const k=nk(r.s)+"|"+r.d+"|"+nk(r.who); if(seen.has(k)) return; seen.add(k); out.push(r); });
  const dates=[...new Set(out.map(r=>r.d))].sort();
  const sess=new Map(); out.forEach(r=>{ const k=nk(r.s)+"|"+r.d;
    if(!sess.has(k)) sess.set(k,{name:r.s,d:r.d,p:[],gk:resolveGroup(r.s)});
    sess.get(k).p.push(r); });
  const unmatched=new Map();
  sess.forEach(v=>{ if(!v.gk && !unmatched.has(nk(v.name))) unmatched.set(nk(v.name),{name:v.name,guess:guessGroup(v.name)}); });
  const newP=new Set(), newC=new Set(), newG=new Set();
  out.forEach(r=>{ const pk=personKeyFor(r.who)||nk(r.who); if(!M.pp.has(pk)) newP.add(r.who);
    if(r.org && !M.co.has(nk(r.org))) newC.add(r.org); });
  sess.forEach(v=>{ if(!v.gk) newG.add(v.name); });
  return {rows:out,sess:sess,dates:dates,newP:newP,newC:newC,newG:newG,unmatched:unmatched,
          layout:layout,fname:fname,dropped:rows.length-withD.length};
}

  }));

    d.appendChild(w); return d; }));

  const row=el("div","btnrow");

  imp.addEventListener("click",()=>doImport(P,imp));

async function doImport(P,btn){
  btn.disabled=true; btn.textContent="Importing…";
  let sk=$("#im-sum").value, sname="";

  const writes=[];
  writes.push({c:"summits",id:sk,data:{name:sname,start:P.dates[0],end:P.dates[P.dates.length-1]}});
  const newCo=new Map(); P.rows.forEach(r=>{ if(r.org&&!M.co.has(nk(r.org))) newCo.set(nk(r.org),r.org); });
  newCo.forEach((nm,k)=>writes.push({c:"companies",id:k,data:{name:nm,cat:"Unknown"}}));
  const newPp=new Map(); P.rows.forEach(r=>{ const k=personKeyFor(r.who)||nk(r.who);
    if(!M.pp.has(k)&&!newPp.has(k)) newPp.set(k,{name:r.who,ck:r.org?nk(r.org):""}); });
  newPp.forEach((v,k)=>writes.push({c:"people",id:k,data:{name:v.name,ck:v.ck,role:""}}));
  const chosen=new Map();
  $$("select[data-sess]").forEach(sl=>chosen.set(sl.dataset.sess,sl.value));
  const gkFor=s2=>s2.gk||chosen.get(nk(s2.name))||nk(s2.name);
  const newGr=new Map(), newAl=new Map();
  P.sess.forEach(s2=>{ const sk2=nk(s2.name), gk=gkFor(s2);
    if(!M.gr.has(gk)&&!newGr.has(gk)) newGr.set(gk,s2.name);
    if(gk!==sk2 && !GALIAS.has(sk2)) newAl.set(sk2,gk); });
  newGr.forEach((nm,k)=>writes.push({c:"groups",id:k,data:{name:nm,
    type:/\bCOP\b/i.test(nm)?"Community of Practice":/\bDWG\b/i.test(nm)?"Development Workgroup":/workgroup/i.test(nm)?"Workgroup":"Other",
    archived:false,facilitator:""}}));
  newAl.forEach((gk,sk2)=>writes.push({c:"aliases",id:sk2,data:{gk:gk,name:sk2}}));
  P.sess.forEach(s2=>{ const gk=gkFor(s2);
    writes.push({c:"meetings",id:"m_"+gk+"_"+s2.d.replace(/-/g,""),
      data:{gk:gk,d:s2.d,sum:sk,label:"",p:[...new Set(s2.p.map(r=>personKeyFor(r.who)||nk(r.who)))],
            by:(USER&&USER.name)||"",at:new Date().toISOString(),src:"trackpod"}}); });
  const okr=await saveMany(writes);
  btn.disabled=false; btn.textContent="Import "+n(P.rows.length)+" Attendance Records";
  if(!okr) return;
  // apply locally
  M.summits.set(sk,{k:sk,name:sname,start:P.dates[0],end:P.dates[P.dates.length-1]});
  newCo.forEach((nm,k)=>M.co.set(k,{k:k,name:nm,cat:"Unknown"}));
  newPp.forEach((v,k)=>M.pp.set(k,{k:k,name:v.name,ck:v.ck,role:""}));
  newGr.forEach((nm,k)=>M.gr.set(k,{k:k,name:nm,type:"Other",archived:false,facilitator:"",first:P.dates[0],last:P.dates[P.dates.length-1]}));
  newAl.forEach((gk,sk2)=>GALIAS.set(sk2,gk));
  const idx=new Map(); M.mt.forEach((m,i)=>idx.set(m.gk+"|"+m.d,i));
  P.sess.forEach(s2=>{ const gk=gkFor(s2), key=gk+"|"+s2.d;
    const rec={id:"m_"+gk+"_"+s2.d.replace(/-/g,""),gk:gk,d:s2.d,sum:sk,label:"",
               p:new Set(s2.p.map(r=>personKeyFor(r.who)||nk(r.who))),src:"db"};
    if(idx.has(key)) M.mt[idx.get(key)]=rec; else M.mt.push(rec); });
  M.gr.forEach(g=>{ const ds=M.mt.filter(m=>m.gk===g.k).map(m=>m.d).sort();
    if(ds.length){ g.first=ds[0]; g.last=ds[ds.length-1]; } });
  buildIndexes(); PARSED=null;
  renderAll();
  toast(n(P.rows.length)+" records imported into "+sname+".");
}

<script>
"use strict";
/* ======================= shared data =======================
   The store caps an artifact at 5,000 documents, so rows are packed into
   bucket documents: one per group-year for meetings, 36 alphabetical
   buckets for people and companies, one each for groups and summits. */
const DBC=new Map();           // docPath -> {items:{...}, ...}
const COLLS=["people","companies","groups","summits","meetings","aliases","sched","notdup"];
function bucketOf(kind,id,data){
  const a=(String(id||"").charAt(0)||"_").replace(/[^a-z0-9]/,"_");
  if(kind==="people") return "people/b_"+a;
  if(kind==="companies") return "companies/b_"+a;
  if(kind==="groups") return "groups/all";
  if(kind==="summits") return "summits/all";
  if(kind==="aliases") return "aliases/all";
  if(kind==="notdup") return "notdup/all";
  if(kind==="sched") return "sched/all";
  if(kind==="snapshot") return "snapshot/b_"+(String(id||"").length%10);
  if(kind==="meetings"){ const gk=(data&&data.gk)||"x", y=((data&&data.d)||"0000").slice(0,4);
    return "meetings/"+gk+"__"+y; }
  return kind+"/all";
}
function keyOf(kind,id,data){ return kind==="meetings"?((data&&data.d)||id):id; }
function dbErr(e){
  const c=(e&&e.code)||"";
  /* the save relay's own codes, when this copy is hosted on resources.mismo.org */
  if(c==="TOKEN"||c==="UNKNOWN_PROJECT") return "Saving is not set up correctly for this page yet. Tell Jonna \u2014 trying again will not help.";
  if(c==="GITHUB") return "The save relay could not reach its storage. Nothing was saved. Tell Jonna if it keeps happening.";
  if(c==="REJECTED") return "The relay refused that change. You may not have permission to log attendance.";
  if(c==="OFFLINE") return "No connection to the save relay. Your change is still here \u2014 it will go out when the connection is back.";
  if(c==="SIGNED_OUT") return "Your sign-in has expired. Sign in again to finish saving \u2014 nothing is lost.";
  if(c==="TOO_BIG") return "This group has grown too big to save in one piece. Tell Jonna.";
  if(c==="invalid_argument") return "You do not have edit access to this page, so that could not be saved.";
  if(c==="quota_exceeded") return "This page's shared data is full. Tell Jonna — old records need archiving before new ones can be added.";
  if(c==="resource_exhausted") return "Too many saves at once. Wait a moment and try again.";
  if(c==="not_granted"||c==="capability_disabled") return "Saving is not available in this view.";
  if(c==="revoked") return "Your access to this page changed. Reload and sign in again.";
  return "That could not be saved just now. Try again in a moment.";
}
/* Folding one person into another rewrites every meeting they ever attended, and on the
   self-hosted copy each one is its own commit — a minute of silence otherwise. Whoever
   started the save sets SAVEPROG and hears how far along it is. */
let SAVEPROG=null;
function withProgress(fn,run){
  const prev=SAVEPROG; SAVEPROG=fn;
  return Promise.resolve().then(run).finally(()=>{ SAVEPROG=prev; });
}
async function writeBuckets(groupsMap){
  if(!DB){ toast("Shared data is not available in this view, so nothing was saved.",true); return false; }
  const paths=[...groupsMap.keys()];
  const rep=SAVEPROG; let done=0;
  if(rep) try{ rep(0,paths.length); }catch(e){}
  /* The self-hosted copy commits one file at a time whatever we do, but it groups together
     everything handed to it at once — so asking for all the pieces up front turns scores
     of commits into a couple of dozen. The hosted copy limits how many saves it will take
     at once, so there we keep a handful in flight instead. */
  const lim=window.__mtRelay?paths.length:6;
  let bad=null, next=0;
  const one=async(path)=>{
    const ref=DB.doc(path);
    let cur={};
    try{ const s=await ref.get(); if(s.exists) cur=JSON.parse(JSON.stringify(s.data()||{})); }catch(e){}
    const items=Object.assign({},cur.items||{},groupsMap.get(path));
    const body={items:items,updated:new Date().toISOString()};
    const seg=path.split("/");
    if(seg[0]==="meetings"){ const gy=seg[1].split("__"); body.gk=gy[0]; body.year=gy[1]; }
    await ref.set(body);
    DBC.set(path,body);
    done++;
    if(rep) try{ rep(done,paths.length); }catch(e){}
  };
  const worker=async()=>{
    while(next<paths.length&&!bad){
      const path=paths[next++];
      try{ await one(path); }catch(e){ bad=bad||e; }
    }
  };
  await Promise.all(Array.from({length:Math.max(1,Math.min(lim,paths.length))},worker));
  if(bad){ toast(dbErr(bad),true); return false; }
  return true;
}
async function saveDoc(kind,id,data){
  const path=bucketOf(kind,id,data), m=new Map();
  m.set(path,{[keyOf(kind,id,data)]:data});
  return writeBuckets(m);
}
async function removeDoc(kind,id,data){
  if(!DB){ toast("Shared data is not available in this view, so nothing was removed.",true); return false; }
  const path=bucketOf(kind,id,data), key=keyOf(kind,id,data);
  try{
    const ref=DB.doc(path);
    let cur={}; try{ const sn=await ref.get(); if(sn.exists) cur=JSON.parse(JSON.stringify(sn.data()||{})); }catch(e){}
    const items=cur.items||{};
    if(!(key in items)) return true;
    delete items[key];
    const body=Object.assign({},cur,{items:items,updated:new Date().toISOString()});
    await ref.set(body); DBC.set(path,body);
    return true;
  }catch(e){ toast(dbErr(e),true); return false; }
}
/* delete several records in one pass — one write per bucket, and each bucket is re-read first
   so another facilitator's saves in the same bucket are kept. `only` guards each record so an
   undo cannot delete something that has since been changed into a real meeting. */
async function removeMany(rems,only){
  if(!DB){ toast("Shared data is not available in this view, so nothing was removed.",true); return false; }
  const m=new Map();
  rems.forEach(r=>{ const p=bucketOf(r.c,r.id,r.data);
    if(!m.has(p)) m.set(p,[]); m.get(p).push(keyOf(r.c,r.id,r.data)); });
  try{
    for(const [path,keys] of m){
      const ref=DB.doc(path);
      let cur={}; try{ const sn=await ref.get(); if(sn.exists) cur=JSON.parse(JSON.stringify(sn.data()||{})); }catch(e){}
      const items=cur.items||{};
      let any=false;
      keys.forEach(k=>{ if(!(k in items)) return;
        if(only&&!only(items[k])) return;
        delete items[k]; any=true; });
      if(!any) continue;
      const body=Object.assign({},cur,{items:items,updated:new Date().toISOString()});
      await ref.set(body); DBC.set(path,body);
    }
    return true;
  }catch(e){ toast(dbErr(e),true); return false; }
}
async function saveMany(writes){
  const m=new Map();
  writes.forEach(w=>{ const p=bucketOf(w.c,w.id,w.data);
    if(!m.has(p)) m.set(p,{}); m.get(p)[keyOf(w.c,w.id,w.data)]=w.data; });
  return writeBuckets(m);
}
async function loadShared(){
  if(!DB) return {};
  const out={people:[],companies:[],groups:[],summits:[],meetings:[],aliases:[],sched:[],notdup:[]};
  /* one round trip per collection, all in flight together \u2014 asked for one after another
     this took several seconds over the save relay, and the page showed figures from the
     imported history alone until the last one landed */
  const snaps=await Promise.all(COLLS.map(c=>
    DB.collection(c).limit(1000).get().then(x=>[c,x],e=>{ console.warn("load",c,e); return [c,null]; })));
  for(const [c,snap] of snaps){
    if(!snap) continue;
    try{
      snap.docs.forEach(d=>{
        const body=d.data()||{}; DBC.set(c+"/"+d.id,body);
        const items=body.items||{};
        Object.keys(items).forEach(k=>{
          const v=items[k]||{};
          if(c==="meetings") out.meetings.push(Object.assign({},v,{gk:body.gk||v.gk,d:k,id:(body.gk||"")+"_"+k}));
          else if(c==="aliases"){ if(v&&v.gk) GALIAS.set(k,v.gk); }
          else if(c==="notdup"){ out.notdup.push(Object.assign({id:k},v)); }
          else if(c==="sched"){ out.sched.push(Object.assign({id:k},v)); }
          else out[c].push(Object.assign({id:k},v));
        });
      });
    }catch(e){ console.warn("read",c,e); }
  }
  return out;
}

/* ======================= Stats ======================= */
let STATVIEW="grp";
const STATVIEWS=[["grp","Groups",()=>statGroups],["ppl","People",()=>statPeople],
                 ["co","Companies",()=>statCompanies],["sum","Summits",()=>statSummits]];
function scrollToEl(node){

  let red=false; try{ red=matchMedia("(prefers-reduced-motion:reduce)").matches; }catch(e){}
  const y=node.getBoundingClientRect().top+(window.scrollY||window.pageYOffset||0)-80;
  window.scrollTo({top:Math.max(0,y),behavior:red?"auto":"smooth"});
}
function goStat(v,then,scroll){
  STATVIEW=v; go("stats");

function renderStats(root){

        goStat("grp",null,true); }),
    tile("Archived Groups",n(S.arc),rangeOn()?n(S.metR)+" met in this range":"Kept, never deleted","var(--ink-3)",
      ()=>{ $("#scope-pick").value="archived"; SCOPE="archived"; goStat("grp",null,true); })

      go:()=>goStat("co",()=>{ const e2=$("#f-ccat"); if(e2){ e2.value=c; renderCompanyList(); } },true)})),{labelWidth:"230px"})));

  const TYPE_ORDER=["Community of Practice","Development Workgroup","Workgroup","Governance","Forum","Workshop","Other"];

  root.appendChild(panel("Attendance by Group Type",

      go:()=>goStat("grp",()=>{ const e2=$("#f-gtype"); if(e2){ e2.value=k; renderGroupList(); } },true)})))));

  root.appendChild(panel("Regular Meetings vs. Summits",

    mixBar([{label:"Regular Workgroup Meetings",value:S.regRecs,color:sc(0)},
            {label:"Summit Sessions",value:S.summitRecs,color:sc(1),go:()=>goStat("sum",null,true)}])));

  root.appendChild(sect("Data Health",null,()=>{

    box.appendChild(b);
    box.appendChild(barList([
      {label:"People With No Company Recorded",value:noCo.length,color:"var(--warn)",
       sub:n(stats().noCoRecs)+" attendance records sit outside every company total because of this",

/* ======================= today band ======================= */
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONF=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function meetsOn(rule,d){
  if(!rule||rule.dow!==d.getDay()) return false;
  if(rule.weeks==="*") return true;
  return rule.weeks.indexOf(Math.floor((d.getDate()-1)/7)+1)>=0;
}
function onDay(d,liveSort){
  const out=[];
  Object.keys(M.sched||{}).forEach(gk=>{ const sc2=M.sched[gk];
    if(sc2.status&&sc2.status.toLowerCase()!=="active") return;
    /* archived, or on hold: not meeting, whatever cadence is still on file for it */
    const g2=M.gr.get(gk); if(g2&&(g2.archived||g2.hold)) return;
    if(meetsOn(sc2.rule,d)) out.push(Object.assign({gk:gk},sc2)); });
  out.sort((a,b)=>(startOf(a)-startOf(b))||String(a.gk).localeCompare(String(b.gk)));
  if(liveSort){
    const rank=x=>{ const k=statusOf(x,liveSort).k; return k==="now"?0:k==="done"?2:1; };
    out.sort((a,b)=>(rank(a)-rank(b))||(startOf(a)-startOf(b)));
  }
  return out;
}
/* the schedule is kept in Eastern time, so the day and the clock both follow ET */
function etNow(){
  try{
    const pr=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hourCycle:"h23",
      year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date());
    const g=t=>+(pr.find(x=>x.type===t)||{}).value;
    return new Date(g("year"),g("month")-1,g("day"),g("hour"),g("minute"));
  }catch(e){ return new Date(); }
}
function one(part,fallbackAp){
  const m=String(part||"").match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if(!m) return null;
  let h=+m[1]; const mi=+(m[2]||0);
  const ap=(m[3]||fallbackAp||"").toUpperCase();
  if(ap==="PM"&&h<12) h+=12;
  if(ap==="AM"&&h===12) h=0;
  if(!ap&&h<8) h+=12;
  return h*60+mi;
}
function parseSpan(t){
  const str=String(t||"").trim(); if(!str) return null;
  const parts=str.split(/[\u2013\u2014-]/).map(x=>x.trim()).filter(Boolean);
  const ap=p2=>((String(p2).match(/(AM|PM)/i)||[])[1]||"").toUpperCase();
  if(parts.length<2){ const a=one(parts[0]); return a==null?null:[a,a+60]; }
  const a2=ap(parts[0]), b2=ap(parts[1]);
  let st=one(parts[0], a2||b2), en=one(parts[1], b2||a2);
  if(st==null||en==null) return null;
  if(st>=en) st-=720;                       /* "11 - 12PM" means 11 in the morning */
  if(st<0) st+=720;
  return [st,en];
}
function tmin(t){ const sp=parseSpan(t); return sp?sp[0]:9999; }
function hm(x){ const m=String(x||"").match(/^(\d{1,2}):(\d{2})$/); return m?(+m[1])*60+(+m[2]):null; }
function spanOf(it){
  const a=hm(it.st), b=hm(it.en);
  if(a!=null&&b!=null) return [a,b];
  return parseSpan(it.time);
}
function timeLabel(it){
  const sp=spanOf(it);
  return sp?(fmtSpan(String(Math.floor(sp[0]/60)).padStart(2,"0")+":"+String(sp[0]%60).padStart(2,"0"),
                     String(Math.floor(sp[1]/60)).padStart(2,"0")+":"+String(sp[1]%60).padStart(2,"0"))):(it.time||"");
}
function startOf(it){ const sp=spanOf(it); return sp?sp[0]:9999; }
function fmtClock(m){
  let h=Math.floor(m/60), mi=m%60; const ap=h>=12?"PM":"AM";
  h=h%12; if(h===0) h=12;
  return h+(mi?":"+String(mi).padStart(2,"0"):"")+ap;
}
function fmtSpan(st,en){
  const a=hm(st), b=hm(en); if(a==null||b==null) return "";
  const sa=fmtClock(a), sb=fmtClock(b);
  return (sa.slice(-2)===sb.slice(-2)? sa.slice(0,-2) : sa)+"\u2013"+sb;
}
const ORD=["","1st","2nd","3rd","4th","5th"];
function cadenceText(rule,day){
  if(!rule) return "";
  if(rule.weeks==="*") return "Every "+(day||"week");
  const w=(rule.weeks||[]).map(x=>ORD[x]||"").filter(Boolean);
  if(!w.length) return "";
  const j=w.length===1?w[0]:w.slice(0,-1).join(", ")+" and "+w[w.length-1];
  return j+" "+(day||"")+" of the month";
}
function statusOf(it,now){
  const sp=spanOf(it); if(!sp) return {k:"na",t:""};
  const m=now.getHours()*60+now.getMinutes();
  if(m>=sp[1]) return {k:"done",t:"Done"};
  if(m>=sp[0]) return {k:"now",t:"On Now"};
  const d=sp[0]-m;
  if(d<=90) return {k:"soon",t:d<=1?"Starting":("in "+(d>=60?Math.floor(d/60)+"h "+(d%60?(d%60)+"m":""):d+" min")).trim()};
  return {k:"later",t:""};
}

const TICKERS=[];
let WEEKOPEN=false, TDOPEN=false, TICKDAY="";
function tickToday(){
  const now=etNow();
  TICKERS.forEach(w=>{
    if(!w.isConnected||!w.__st) return;
    if(w.__iso&&cancelledOn(w.__it.gk,w.__iso)){
      w.classList.remove("now"); w.classList.add("done");
      w.__st.textContent="Cancelled"; w.__st.className="td-st s-canc"; w.__st.hidden=false; return;
    }
    const st=statusOf(w.__it,now);
    w.classList.toggle("now",st.k==="now");
    w.classList.toggle("done",st.k==="done");
    w.__st.textContent=st.t;
    w.__st.className="td-st"+(st.k==="now"?" s-now":st.k==="soon"?" s-soon":"");
    w.__st.hidden=!st.t;
  });
  const d=dISO(now);
  if(TICKDAY&&TICKDAY!==d) renderToday();   /* rolled past midnight ET */
  TICKDAY=d;
}

  else{

  const xb=el("button","td-x",WEEKOPEN?"Hide the Week":(wkend?"The Week Ahead":"This Week")); xb.type="button";

  else if(now.getDay()===6) mon.setDate(mon.getDate()+2);     /* Saturday -> the week ahead */
  else mon.setDate(mon.getDate()-(now.getDay()-1));
  for(let i=0;i<5;i++){

    const b2=el("b"); b2.appendChild(document.createTextNode(DAYS[d.getDay()]));
    b2.appendChild(el("small",null,MONF[d.getMonth()].slice(0,3)+" "+d.getDate()+(di===iso?" \u00b7 today":"")));
    row.appendChild(b2);
    const ds=el("div","td-ds");
    if(hits.length) hits.forEach(it=>{
      const q=el("button","td-q"); q.type="button";

      q.title="Log attendance for this meeting"+(it.cadence?" \u00b7 "+it.cadence:"");

    else ds.appendChild(el("span","td-q none","Nothing scheduled"));
    row.appendChild(ds); wk.appendChild(row);
  }
  const noc=Object.keys(M.sched).filter(k=>!M.sched[k].rule);
  if(noc.length) wk.appendChild(el("div","td-note","No set cadence on file for "+
    noc.map(k=>(M.gr.get(k)||{}).name||k).join(", ")+" \u2014 add a day and cadence in the Zoom schedule and it will appear here."));
  host.appendChild(wk);
  xb.addEventListener("click",()=>{ WEEKOPEN=!WEEKOPEN; renderToday(); tickToday(); });
}

/* ======================= Issues — what needs a human ======================= */
/* Everything a facilitator can enter on the fly ends up here until somebody checks it:
   people with nobody's company against them, companies with no category, two records that
   look like one person, and anyone added to the master list in the room. */
function issueSets(){
  const aside=k=>SETASIDE.has(k);
  const noCo=[...M.pp.values()].filter(p=>!p.ck&&M.byP.has(p.k)&&!aside(p.k))
    .sort((a,b)=>(M.byP.get(b.k)||[]).length-(M.byP.get(a.k)||[]).length);
  const noCat=[...M.co.values()].filter(c=>c.cat==="Unknown"&&M.coPeople.has(c.k))
    .sort((a,b)=>(M.byC.get(b.k)||[]).length-(M.byC.get(a.k)||[]).length);
  const added=[...M.pp.values()].filter(p=>p.addedBy&&!aside(p.k))
    .sort((a,b)=>String(b.addedAt||"").localeCompare(String(a.addedAt||"")));
  /* pairs that look like the same human, each pair listed once */
  const names=[...M.pp.values()].filter(p=>M.byP.has(p.k)&&!aside(p.k));
  const bySur=new Map();
  names.forEach(p=>{ const w=words(p.name); if(w.length<2) return;
    const sur=w[w.length-1]; if(sur.length<3) return;
    if(!bySur.has(sur)) bySur.set(sur,[]); bySur.get(sur).push(p); });
  const dups=[]; const seen=new Set();
  bySur.forEach(list=>{ if(list.length<2||list.length>40) return;
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      const a=list[i], b=list[j];
      if(!sameNameish(a.name,b.name)) continue;
      const key=pairKey(a.k,b.k); if(seen.has(key)) continue; seen.add(key);
      if(NOTDUP.has(key)) continue;
      dups.push({a:a,b:b,an:(M.byP.get(a.k)||[]).length,bn:(M.byP.get(b.k)||[]).length}); } });
  dups.sort((x,y)=>(y.an+y.bn)-(x.an+x.bn));
  return {noCo:noCo,noCat:noCat,added:added,dups:dups};
}
function issueCount(){ const I=issueSets(); return I.noCo.length+I.noCat.length+I.dups.length+I.added.length; }

    .sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
  const s5=el("div"); s5.id="iss-done"; root.appendChild(s5);
  s5.appendChild(sectK("iss-done","Already Settled",mg.length+ka.length+sa.length+gn.length,()=>{
    const d=el("div");
    d.appendChild(el("div","hint","Every decision is kept on the record \u2014 which name was folded into which, which pairs were looked at and found to be two people, who decided and when. Nothing here is counted as an issue; it is the trail of what has been dealt with."));
    if(ka.length){
      d.appendChild(el("h3","ssub","Kept Apart"));
      const kw=el("div","tl");
      ka.forEach(r=>{
        const row=el("div","tli"); row.style.cursor="default";
        row.appendChild(el("span","d",r.at?fmtD(String(r.at).slice(0,10)):""));
        row.appendChild(el("span",null,(r.an||r.a)+"  \u2260  "+(r.bn||r.b)));
        if(CANWRITE){
          const u=el("button","linkb quiet","Put Back"); u.type="button";
          u.title="Offer this pair as a possible duplicate again";
          u.addEventListener("click",()=>rejoinPair(r.key,()=>renderAll(true)));
          row.appendChild(u);
        } else row.appendChild(el("span","st","two people"));
        kw.appendChild(row); });
      d.appendChild(kw);
    }
    if(sa.length){
      d.appendChild(el("h3","ssub","Set Aside \u2014 Not a Person"));
      const sw=el("div","tl");
      sa.forEach(r=>{
        const p=M.pp.get(r.key);
        const row=el("div","tli"); row.style.cursor="default";
        row.appendChild(el("span","d",r.at?fmtD(String(r.at).slice(0,10)):""));
        row.appendChild(el("span",null,(p?p.name:r.name||r.key)+
          "  \u00b7  "+n((M.byP.get(r.key)||[]).length)+" meetings, still counted"));
        if(CANWRITE){ const u=el("button","linkb quiet","Put Back"); u.type="button";
          u.addEventListener("click",()=>unsetAside(r.key,()=>renderAll(true)));
          row.appendChild(u); } else row.appendChild(el("span","st","set aside"));
        sw.appendChild(row); });
      d.appendChild(sw);
    }
    if(gn.length){
      d.appendChild(el("h3","ssub","Deleted"));
      const gw=el("div","tl");
      gn.forEach(r=>{
        const row=el("div","tli"); row.style.cursor="default";
        row.appendChild(el("span","d",r.at?fmtD(String(r.at).slice(0,10)):""));
        row.appendChild(el("span",null,(r.name||r.key)+"  \u00b7  "+n(r.n||0)+" attendance record"+
          ((r.n===1)?"":"s")+" taken out"));
        row.appendChild(el("span","st",r.by?"by "+r.by:""));
        gw.appendChild(row); });
      d.appendChild(gw);
      d.appendChild(el("div","hint","A deleted record cannot be put back from this page \u2014 "+
        "it is out of the meetings it was on. Tell Jonna if one needs restoring."));
    }
    if(!mg.length){ if(!ka.length&&!sa.length&&!gn.length)
        d.appendChild(el("div","empty","Nothing has been settled yet."));
      return d; }
    if(ka.length||sa.length||gn.length) d.appendChild(el("h3","ssub","Merged"));
    const w=el("div","tl");
    mg.slice(0,120).forEach(r=>{
      const keep=M.pp.get(r.into);
      const row=el("div","tli addrow"); row.style.cursor=keep?"pointer":"default";
      row.appendChild(el("span","d",r.at?fmtD(String(r.at).slice(0,10)):""));
      row.appendChild(el("span",null,r.name+" \u2192 "+(keep?keep.name:r.into)));
      row.appendChild(el("span","st",(r.by?"by "+r.by:"")+(r.n!=null?(r.by?" \u00b7 ":"")+n(r.n)+" meeting"+(r.n===1?"":"s")+" moved":"")));
      if(CANWRITE&&keep){
        const acts=el("div","nocoacts");
        const ub=el("button","linkb quiet","Undo This Merge"); ub.type="button";
        ub.title="Split them back into two records and put the pair on the duplicates list again";
        let armed=false;
        ub.addEventListener("click",async ev=>{ ev.stopPropagation();
          if(!armed){ armed=true; ub.textContent="Split Them Apart?";
            setTimeout(()=>{ if(!ub.isConnected) return; armed=false; ub.textContent="Undo This Merge"; },7000);
            return; }
          ub.disabled=true; ub.textContent="Splitting\u2026";
          const ok2=await withProgress((d2,t2)=>{
            ub.textContent=(t2&&d2<t2)?("Splitting\u2026 "+n(d2)+" of "+n(t2)):"Finishing\u2026";
          },()=>unmergePeople(r.k,r.into,r.name,()=>renderAll(true),r.prev));
          if(!ok2){ ub.disabled=false; armed=false; ub.textContent="Undo This Merge"; } });
        acts.appendChild(ub); row.appendChild(acts);
      }
      if(keep) row.addEventListener("click",()=>openPerson(r.into));
      w.appendChild(row); });
    d.appendChild(w);
    if(mg.length>120) d.appendChild(el("div","hint",n(mg.length-120)+" more."));
    return d;
  }));

  /* ---- bulk load ---- */
  root.appendChild(peopleUploader());
}

/* ======================= router ======================= */
const VIEWS={ov:renderOverview,stats:renderStats,iss:renderIssues};
let CUR="ov";
function go(tab){
  if(!VIEWS[tab]) return;
  CUR=tab; SEL=null;
  $$(".hq nav button[data-hq]").forEach(b=>{
    if(b.dataset.hq===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const main=$("#main"); main.textContent=""; main.scrollTop=0;
  try{ VIEWS[tab](main); }
  catch(e){ console.error(e); const b=el("div","banner");
    b.innerHTML="<b>Something went wrong drawing this section.</b> Reload the page — none of your data is affected.";
    main.appendChild(b); }
  try{ if($("#today")) tickToday(); }catch(e){}
  const f=el("div","foot");
  f.textContent="MISMO Meeting Trackers · "+n(M.mt.length)+" meetings · "+n(M.pp.size)+" people · "+
    n(M.gr.size)+" groups, archived ones kept for good. History loaded from the tracker workbooks; everything logged here is saved to this page's shared data.";
  main.appendChild(f);
  if(KEEPSCROLL){ const y=KEEPSCROLL; KEEPSCROLL=0;
    requestAnimationFrame(()=>window.scrollTo(0,y)); }
  else window.scrollTo(0,0);
}
const RELIST={stats:()=>{ const f={grp:renderGroupList,ppl:renderPeopleList,
    co:renderCompanyList,sum:renderSummitBody}[STATVIEW]; if(f) f(); },
  ov:()=>{ if(LOGGK) loadRoster(); else drawPicker(); }};
let KEEPSCROLL=0;
function renderAll(keepScroll){
  if(keepScroll) KEEPSCROLL=window.scrollY||window.pageYOffset||0;
  /* keep whatever is typed into the view's own filters across the redraw */
  const SKIP=e=>e.type==="file"||e.type==="checkbox"||e.type==="radio";
  const snap={};
  $$("#main input[id], #main select[id]").forEach(e=>{ if(!SKIP(e)&&e.value) snap[e.id]=e.value; });
  go(CUR);
  let changed=false;
  $$("#main input[id], #main select[id]").forEach(e=>{
    if(SKIP(e)) return;
    const v=snap[e.id];
    if(v!==undefined && v!==e.value){ try{ e.value=v; }catch(err){ return; }
      if(e.value===v) changed=true; } });
  if(changed && RELIST[CUR]) try{ RELIST[CUR](); }catch(e){}
  try{ refreshIssueBadge(); }catch(e){}
}
function setScope(v){ SCOPE=v; renderAll(); }
$$(".hq nav button[data-hq]").forEach(b=>b.addEventListener("click",()=>{
  try{ closePane(); }catch(e){}
  if(b.dataset.hq==="ov"){ LOGGK=""; PICKFAC=""; }
  go(b.dataset.hq); }));
$("#scope-pick").addEventListener("change",e=>setScope(e.target.value));

/* ======================= rail ======================= */
(function(){
  const KEY="hq.rail.off";
  function set(off,remember){
    document.body.classList.toggle("railmini",!!off);
    const h=$("#rail-hide");
    if(h){ h.setAttribute("aria-expanded",off?"false":"true");
      h.setAttribute("aria-label",off?"Open the menu":"Narrow the menu");
      h.title=(off?"Open the menu":"Narrow the menu")+" (backslash)"; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY,off?"1":"0"); }catch(e){} }
    setTimeout(()=>window.dispatchEvent(new Event("resize")),230);
  }
  function toggle(){ set(!document.body.classList.contains("railmini")); }
  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==="1"); }catch(e){}
    if(off===null) off=window.matchMedia("(max-width:900px)").matches;
    set(off,false);
    const h=$("#rail-hide"); if(h) h.addEventListener("click",toggle);
    const sc=$("#rail-scrim"); if(sc) sc.addEventListener("click",()=>set(true));
    const qb=$("#rail-qb");
    if(qb) qb.addEventListener("click",()=>{ set(false); setTimeout(()=>{ const q=$("#rail-q"); if(q) q.focus(); },230); });
    $$(".hq nav button[data-hq]").forEach(b=>b.addEventListener("click",()=>{
      if(window.matchMedia("(max-width:900px)").matches) set(true); }));
    wireFind();
  }
  document.addEventListener("keydown",e=>{
    const t=e.target, typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
    if(e.key==="\\"&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); set(false);
      setTimeout(()=>{ const q=$("#rail-q"); if(q){ q.focus(); q.select(); } },230); }
  });
  const HITS=()=>$("#rail-hits");
  let picked=-1, rows=[];
  function nrm(x){ return String(x||"").replace(/\s+/g," ").trim().toLowerCase(); }
  function gather(q){
    const t=nrm(q); if(t.length<2) return [];
    const out=[];
    const score=nm=>{ const x=nrm(nm); return x===t?3:x.indexOf(t)===0?2:x.indexOf(t)>=0?1:0; };
    const push=(group,name,where,fn,log)=>{ if(out.length<80) out.push({group,name,where,go:fn,log:log||"",s:score(name)}); };
    try{ M.gr.forEach(g=>{ if(nrm(g.name).indexOf(t)<0) return;
      push("Groups",g.name,gtypeShort(g.type)+(g.archived?" · Archived":""),
        ()=>{ goStat("grp"); openGroup(g.k); },g.k); }); }catch(e){}
    try{ M.pp.forEach(p=>{ if(out.length>70) return;
      const byAlt=(p.alt||[]).some(a=>a.indexOf(nk(t))>=0);
      if(nrm(p.name).indexOf(t)<0&&!byAlt) return;
      if(!M.byP.has(p.k)) return;
      push("People",p.name,compName(p.k)+(byAlt&&nrm(p.name).indexOf(t)<0?" · previously known by that name":""),
        ()=>{ goStat("ppl"); openPerson(p.k); }); }); }catch(e){}
    try{ M.co.forEach(c=>{ if(out.length>76) return; if(nrm(c.name).indexOf(t)<0) return;
      push("Companies",c.name,c.cat,()=>{ goStat("co"); openCompany(c.k); }); }); }catch(e){}
    try{ M.summits.forEach(s=>{ if(nrm(s.name).indexOf(t)<0) return;
      push("Summits",s.name,fmtD(s.start),()=>{ goStat("sum",()=>{ const sl=$("#f-sum"); if(sl){sl.value=s.k;renderSummitBody();} }); }); }); }catch(e){}
    const best={}; out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0,h.s); });
    const ORDER=["Groups","People","Companies","Summits"];
    out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      ||(b.s-a.s)||String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=""; rows=[]; picked=-1;
    if(!list.length){ const nn=el("div","rh-none","Nothing matches."); box.appendChild(nn); box.hidden=false; return; }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group; box.appendChild(el("div","rh-g",g)); }
      const b=el("button","rh"); b.type="button";
      b.appendChild(el("b",null,h.name));
      if(h.where) b.appendChild(el("i",null,h.where));
      b.addEventListener("click",()=>{ close(); h.go(); });
      rows.push(b);
      /* a facilitator searching a workgroup usually wants the tracker, not the figures —
         so the tracker is one click from the result, with the name still opening the details */
      if(h.log&&CANWRITE){
        const row=el("div","rh-row"); row.appendChild(b);
        const lb=el("button","rh-log"); lb.type="button";
        lb.appendChild(document.createTextNode("Log"));
        const pend=pendingFor(h.log).length;
        if(pend) lb.appendChild(el("span","rh-n",n(pend)));
        lb.title="Log attendance for "+h.name+(pend?(" — "+n(pend)+" still to log"):"");
        lb.setAttribute("aria-label","Log attendance for "+h.name);
        lb.addEventListener("click",ev=>{ ev.stopPropagation(); close(); openLog(h.log); });
        row.appendChild(lb); box.appendChild(row);
      }
      else box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=""; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle("on",i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:"nearest"}); }catch(e){} }
  function wireFind(){
    const q=$("#rail-q"), x=$("#rail-qx"); if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value; if(x) x.hidden=!v;
      if(nrm(v).length<2){ close(); return; } draw(gather(v)); };
    q.addEventListener("input",()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener("focus",()=>{ if(nrm(q.value).length>=2) run(); });
    q.addEventListener("keydown",e=>{
      if(e.key==="Escape"){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==="ArrowDown"){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==="Enter"){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener("click",()=>{ q.value=""; x.hidden=true; close(); q.focus(); });
    document.addEventListener("click",e=>{ if(!e.target.closest(".railfind")) close(); });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
})();

/* ======================= where this page saves =======================
   On claude.ai the page uses the artifact's own shared data. Hosted anywhere else
   (GitHub Pages at resources.mismo.org, say) that runtime does not exist, so saving
   goes through MISMO's save relay instead. Fill RELAY.url in and the page writes
   through it; leave it blank and the page still loads every bit of history, but says
   plainly that it is read-only rather than looking broken.

   The relay needs three routes. Paths look like "meetings/apicop__2026".
     GET    <url>/doc?path=<path>              -> 200 {..document..} | 404 if absent
     PUT    <url>/doc?path=<path>              -> body is the document; 200 on success
     GET    <url>/list?prefix=<collection>/    -> 200 [{"path":"...","data":{...}}, ...]
   Send cookies (credentials:"include") so the relay can see who is signed in; it
   should refuse writes from anyone who is not allowed to log attendance.
   =================================================================== */
const RELAY={ url:"", name:"MISMO save relay" };

function relayStore(base){
  const hit=async(path,opts)=>{
    const r=await fetch(base.replace(/\/$/,"")+path,Object.assign({credentials:"include"},opts||{}));
    if(r.status===404) return null;
    if(r.status===401||r.status===403){ const e=new Error("relay "+r.status); e.code="invalid_argument"; throw e; }
    if(!r.ok){ const e=new Error("relay "+r.status); e.code="unavailable"; throw e; }
    const t=await r.text(); return t?JSON.parse(t):null;
  };
  const doc=p=>({
    id:p.split("/").pop(), path:p,
    get:async()=>{ const d=await hit("/doc?path="+encodeURIComponent(p));
      return {exists:d!=null,data:()=>d,metadata:{}}; },
    set:async d=>{ await hit("/doc?path="+encodeURIComponent(p),
      {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}); },
    update:async d=>{ const cur=(await hit("/doc?path="+encodeURIComponent(p)))||{};
      await hit("/doc?path="+encodeURIComponent(p),
        {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},cur,d))}); },
    delete:async()=>{ await hit("/doc?path="+encodeURIComponent(p),{method:"DELETE"}); }
  });
  const collection=c=>({ path:c, doc:id=>doc(c+"/"+id), limit(){ return this; },
    get:async()=>{ const rows=(await hit("/list?prefix="+encodeURIComponent(c+"/")))||[];
      return {docs:rows.map(r=>({id:String(r.path).split("/").pop(),exists:true,
        data:()=>r.data,metadata:{}})),docChanges:()=>[]}; } });
  return {doc,collection};
}

/* ======================= boot ======================= */
(async function boot(){
  try{
    /* On resources.mismo.org the imported history is member information, so it lives in the
       private data repository and arrives through the relay after sign-in. Inside Claude, and
       anywhere else, it is the data file published beside the page. */
    let B=null;
    if(window.__mtBaselinePromise) B=await window.__mtBaselinePromise;
    else { const r=await fetch("data/baseline.json");
      if(!r.ok) throw new Error("baseline "+r.status);
      B=await r.json(); }
    loadBaseline(B);
  }catch(e){
    console.error(e);
    $("#main").innerHTML='<div class="banner"><b>The tracker history could not be loaded.</b> Reload the page; if it keeps happening the data file did not publish with the page.</div>';
    return;
  }
  buildIndexes();
  /* a shared store is coming, so the counts on screen are not the final ones yet */
  M.expectDb=!!(window.claude||(window.__mtRelay&&RELAY.url)||RELAY.url);
  setInterval(tickToday,30000);
  go("ov");
  try{
    const u=await claude.use("user");
    if(u){ USER={isOwner:u.isOwner(),canEdit:u.canEdit(),name:""};
      try{ const myId=await u.id(); if(myId) USER.id=myId; }catch(e){}
      const w=u.can?u.can("data.write"):null; if(w===false) CANWRITE=false;
      try{ const me=await u.me(); if(me&&me.name) USER.name=me.name; }catch(e){} }
  }catch(e){}
  try{ DB=await claude.use("db"); }catch(e){ DB=null; }
  if(!DB&&RELAY.url){
    DB=relayStore(RELAY.url);
    try{ await DB.doc("groups/all").get(); SELFHOST=true; }
    catch(e){ DB=null; SELFHOST=true; RELAYDOWN=true; }
    /* the relay is the only thing that knows who is signed in here, and the meeting
       records keep whoever saved them — so ask it before anything is logged */
    if(DB&&!(USER&&USER.name)){
      try{
        const r=await fetch(RELAY.url.replace(/\/$/,"")+"/me",{credentials:"include"});
        if(r.ok){ const me=await r.json();
          if(me&&(me.name||me.id)) USER=Object.assign({},USER||{},{name:me.name||"",id:me.id||""});
          if(me&&me.canWrite===false) CANWRITE=false; }
      }catch(e){}
    }
  } else if(!DB){ SELFHOST=true; }
  /* get the shared data moving before asking who is signed in, so the two wait together */
  const SHARED=DB?loadShared():Promise.resolve({});
  if(DB){
    const docs=await SHARED;
    const any=COLLS.some(c=>(docs[c]||[]).length);
    if(any){ applyDbDocs(docs); buildIndexes(); }
    M.dbReady=true;
    renderAll();
  }else{
    CANWRITE=false;
    renderAll();
  }
})();
