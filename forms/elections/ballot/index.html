<!DOCTYPE html>
<!--
  MISMO Ballot: resources.mismo.org/forms/elections/ballot/?e=<election>
  The public ballot for Elections HQ, in the website's look. No sign-in. Each ballot goes to the
  "Elections Ballots" Power Automate flow (FLOW_ENDPOINT below). Nothing is stored in this file.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Cast your company's ballot in a MISMO election.">
<title>MISMO Ballot | MISMO</title>
<style>
/* ===================================================================
   MISMO website skin, applied over an application form.
   Values from MISMO-Website-Style-Guide.md, measured from the live
   Home page on 21 October 2026. Appended last so it wins on source
   order; the dark-mode selectors are repeated here at their own
   specificity so a stored "dark" preference cannot reach the page.
   No web font is imported - the site names IBM Plex Sans and does not
   load it, so importing it would make these forms look unlike the site.
   =================================================================== */
:root,
:root:not([data-theme="light"]),
:root[data-theme="dark"]{
  --mm-font:"IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --mm-hero:#071d2e; --mm-pill:#0f314c; --mm-blue:#1a8fe3; --mm-blue-top:#2e9dee;
  --mm-sky:#74bfeb; --mm-sky-2:#56b4f2; --mm-sub:#a9d8f3;
  --mm-text:#44607a; --mm-line:#cfdeeb; --mm-tag-bg:#e3f1fc; --mm-tag-ink:#1a74b8;

  /* the form's own tokens, remapped to the website palette */
  --navy:#071d2e; --navy-deep:#0d314c; --navy-mid:#1a8fe3;
  --sky:#1a8fe3; --sky-soft:#74bfeb; --sky-wash:#e3f1fc;
  --ground:#ffffff; --surface:#ffffff; --surface-2:#ffffff; --surface-3:#f4f8fc;
  --border:#cfdeeb; --border-strong:#cfdeeb; --rule:#e5eef5;
  --ink:#0d314c; --ink-2:#44607a; --ink-3:#44607a;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
  --chip:#e3f1fc; --track:#e3f1fc; --tab-active:#ffffff;
  /* --soft and --line are used by the form but were never declared, so the
     notes and the attestation box drew with no background and no border. */
  --soft:#f4f8fc; --line:#cfdeeb;
}
body{font-family:var(--mm-font); font-size:16px; line-height:1.6;
  background:#ffffff; color:var(--mm-ink,#0d314c);}
a{color:var(--mm-blue);}

/* ---------- Header bar (70px, dark navy, logo left, nav, Log in pill right) ---------- */
.mm-header{position:relative;z-index:5;height:70px;background:var(--mm-hero);box-shadow:0 2px 4px 0 rgba(0,0,0,.1),0 0 2px 0 rgba(153,153,153,.25);display:flex;align-items:center;padding:0 50px;gap:56px}
.mm-logo img{display:block;width:194px;height:36px;max-width:100%;object-fit:contain;object-position:left center} /* the logo file is 684x108; "contain" keeps its shape, as the live site does (it shows about 194x31). Never let it stretch to fill 194x36. */
.mm-logo{flex:0 1 194px;min-width:0}
.mm-nav{display:flex;align-items:stretch;height:70px;margin:0;padding:0;list-style:none;flex:1 1 auto}
.mm-nav>li{position:relative;display:flex;align-items:center;list-style:none}
.mm-nav-link{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--mm-font);font-size:15px;font-weight:500;line-height:21px;color:#ffffff;text-decoration:none;white-space:nowrap}
.mm-nav>li:hover>.mm-nav-link,.mm-nav-link:focus-visible{color:var(--mm-sky)}
.mm-chev{width:11px;height:8px}
/* Dropdown menus: measured from the live site (opens on hover or keyboard focus) */
.mm-dd{display:none;position:absolute;left:0;top:100%;z-index:20;min-width:250px;margin:0;padding:8px 0;list-style:none;background:#0b2740;border-top:2px solid var(--mm-blue);border-radius:0 0 8px 8px;box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
.mm-nav>li:hover>.mm-dd,.mm-nav>li:focus-within>.mm-dd{display:block}
.mm-dd a{display:block;padding:10px 18px 10px 16px;border-left:2px solid transparent;font-family:var(--mm-font);font-size:15px;font-weight:500;line-height:19.5px;color:#e6eef5;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.mm-dd a:hover,.mm-dd a:focus-visible{outline:none;background:rgba(116,191,235,.1);border-left-color:var(--mm-sky);color:var(--mm-sky)}
.mm-login{margin-left:auto;display:inline-block;padding:10px 20px;border-radius:50px;background:var(--mm-pill);color:#ffffff;font-family:var(--mm-font);font-size:16px;font-weight:600;line-height:16px;text-decoration:none;white-space:nowrap;min-width:max-content}
.mm-burger{display:none;width:40px;height:40px;margin-left:auto;padding:9px 8px;border:0;border-radius:6px;background:transparent;cursor:pointer}
.mm-burger span{display:block;height:2px;margin:4px 0;border-radius:2px;background:#ffffff;transition:transform .2s,opacity .2s}
/* Phones and tablets: hamburger shows the same menu as a panel under the bar, sub-pages listed under each heading */
@media (max-width:1100px){
  .mm-header{padding:0 20px;gap:12px}
  .mm-burger{display:block}
  .mm-nav{display:none}
  .mm-header.is-open .mm-nav{display:block;position:absolute;top:70px;left:0;right:0;height:auto;max-height:calc(100vh - 70px);overflow-y:auto;padding:8px 0 16px;background:#0b2740;border-top:2px solid var(--mm-blue);box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
  .mm-header.is-open .mm-nav>li{display:block}
  .mm-header.is-open .mm-nav-link{display:flex;padding:12px 20px 6px;font-weight:600}
  .mm-header.is-open .mm-chev{display:none}
  .mm-header.is-open .mm-dd{display:block;position:static;min-width:0;padding:0 0 6px;background:transparent;border:0;border-radius:0;box-shadow:none}
  .mm-header.is-open .mm-dd a{padding:9px 20px 9px 34px;white-space:normal}
  .mm-header.is-open .mm-burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .mm-header.is-open .mm-burger span:nth-child(2){opacity:0}
  .mm-header.is-open .mm-burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
}

/* ---------- footer: the live site's, measured 21 Oct 2026 at 1440px ----------
   One 68px bar in #f4f7f9 - light, not dark - logo left, address in the middle,
   policy links then the two social circles on the right. */
.mm-footer{background:#f4f7f9;}
.mm-footer-bar{background:#f4f7f9; display:flex; flex-wrap:wrap; align-items:center;
  justify-content:space-between; gap:10px 28px; padding:18px 50px;
  font-family:var(--mm-font);}
.mm-f-logo{flex:0 0 auto; line-height:0;
  /* the two colors the shared MISMO symbol reads */
  --logo-body:#0d314c; --logo-s:#50a4db;}
.mm-f-mark{display:block; width:197px; height:30px;}
.mm-f-addr{flex:1 1 300px; text-align:center; font-size:12.5px; line-height:20px;
  color:#5b7183;}
.mm-f-addr a{color:#0d314c; text-decoration:none;}
.mm-f-addr a:hover{text-decoration:underline;}
.mm-f-env{width:15px; height:12px; margin:0 7px 0 14px; color:#5b7183;
  vertical-align:-1px;}
.mm-f-links{flex:0 0 auto; display:flex; gap:16px;}
.mm-f-links a{font-size:13px; font-weight:600; color:#0d314c; text-decoration:none;
  white-space:nowrap;}
.mm-f-links a:hover{text-decoration:underline;}
.mm-f-social{flex:0 0 auto; display:flex; gap:13px;}
.mm-f-soc{width:32px; height:32px; border-radius:50px; background:#50a4db;
  color:#0d314c; display:flex; align-items:center; justify-content:center;}
.mm-f-soc svg{width:17px; height:17px; display:block;}
.mm-f-soc:hover{background:#74bfeb;}

/* ---------- the page column ---------- */
.wrap{max-width:960px; margin:0 auto; padding:46px clamp(20px,5vw,48px) 110px;}
/* The hero carries the title and the lede now, so the page does not say it twice. */
h1.doc, .docsub{display:none;}
.sect-head{margin:0 0 22px;}
.sect-head .mm-eyebrow{margin:0 0 10px; font-size:12px; font-weight:600;
  text-transform:uppercase; letter-spacing:.14em; color:var(--mm-blue);}
.sect-head h2{margin:0 0 12px; font-size:38px; font-weight:700; line-height:1.2;
  color:var(--mm-ink,#0d314c);}
.sect-head p{margin:0; font-size:16px; line-height:1.6; color:var(--mm-text);}
@media (max-width:600px){ .sect-head h2{font-size:30px;} }

/* ---------- stage tabs ---------- */
.stages{border-radius:10px;}
.stage{font-size:14px;}
.stage.on{box-shadow:0 1px 2px rgba(7,29,46,.12);}

/* ---------- the sticky progress bar ---------- */
/* The website header does not stick, so this sits at the top of the viewport
   rather than under a masthead that is no longer there. */
.bar{top:0; border-radius:12px; border:1px solid var(--mm-line); background:#ffffff;
  box-shadow:0 8px 22px -18px rgba(7,29,46,.45); padding:12px 16px;}
.ptrack{background:#e3f1fc;}
.pfill{background:var(--mm-blue);}
.bar .pct{color:var(--mm-blue);}

/* ---------- buttons: never wrap ---------- */
.btn{border-radius:8px; font-family:var(--mm-font); font-size:15px; font-weight:600;
  line-height:1.2; white-space:nowrap; min-width:max-content; padding:14px 22px;
  border:1.5px solid var(--mm-blue); color:#ffffff;
  background:linear-gradient(180deg,var(--mm-blue-top) 0%, var(--mm-blue) 100%);
  box-shadow:0 5px 16px -4px rgba(26,143,227,.55);}
.btn:hover{background:linear-gradient(180deg,var(--mm-blue) 0%, #1580cc 100%);}
.btn.ghost{background:#ffffff; color:var(--mm-blue); border:1.5px solid var(--mm-blue);
  box-shadow:none;}
.btn.ghost:hover{background:#f2f9fe; color:var(--mm-blue);}
.btn:focus-visible{outline:3px solid rgba(26,143,227,.35); outline-offset:2px;}
/* The bar sits above the form and holds three of them, so they take the smaller size. */
.bar-acts .btn{padding:9px 16px; font-size:14px;}
.rep-add{border-radius:8px; border:1.5px dashed var(--mm-line); color:var(--mm-text);
  font-size:14px; padding:11px 16px;}
.rep-add:hover{border-color:var(--mm-blue); color:var(--mm-blue);}

/* ---------- a section is a form card: white, 1px #cfdeeb, 12px corners ---------- */
.sect{border:1px solid var(--mm-line); border-radius:12px; background:#ffffff;
  margin-bottom:14px; box-shadow:0 14px 34px -26px rgba(7,29,46,.35);}
.sect-btn{padding:17px 24px; gap:14px;}
.sect-btn .st{font-size:17px; font-weight:600; color:var(--mm-ink,#0d314c);}
.sect-btn .sc{font-size:12px; padding:3px 11px; border-radius:4px; font-weight:600;
  letter-spacing:.04em; background:var(--mm-tag-bg); color:var(--mm-tag-ink);}
.sect-btn .sc.done{background:rgba(15,123,92,.13); color:var(--good);}
.sect-btn[aria-expanded="true"]{background:#f4f8fc;}
.sect-body{padding:6px 24px 24px;}
@media (max-width:600px){ .sect-btn{padding:15px 20px} .sect-body{padding:4px 20px 20px} }

/* ---------- questions ---------- */
.q-txt{font-size:15px; font-weight:600; color:var(--mm-ink,#0d314c);}
.q-no{font-size:12px; color:var(--mm-text);}
.q-guide, .sect-intro{font-size:13px; color:var(--mm-text);}

/* ---------- fields: 44px tall, 8px corners, the site's search box ---------- */
.fld label{font-size:14px; font-weight:600; color:var(--mm-ink,#0d314c);
  text-transform:none; letter-spacing:0; margin-bottom:6px;}
.in{border:1px solid var(--mm-line); border-radius:8px; background:#ffffff;
  color:var(--mm-ink,#0d314c); font-family:var(--mm-font); font-size:15px;}
input.in, select.in{height:44px; padding:0 14px;}
select.in{padding-right:34px;}
textarea.in{min-height:120px; padding:12px 14px; line-height:1.5;}
.flds .na-wide textarea.in{min-height:150px;}
.in:focus{outline:none; border-color:var(--mm-blue);
  box-shadow:0 0 0 3px rgba(26,143,227,.18);}
.opt{font-size:15px; color:var(--mm-ink,#0d314c);}
.fld .opt, .fld label.opt{font-size:15px;}
.opt input{accent-color:var(--mm-blue);}
.mx input{accent-color:var(--mm-blue);}
.mx th{color:var(--mm-text);}

/* ---------- notes, attestation, totals, attachments ---------- */
.note, .stage-note, .intro-card{border-radius:8px; border-left:3px solid var(--mm-blue);
  font-size:15px; color:var(--mm-text);}
.intro-card p{font-size:15px; color:var(--mm-text);}
.attest{border-left:3px solid var(--mm-blue); border-radius:0 8px 8px 0; font-size:15px;}
.attest-tick{border-radius:8px; font-size:15px;}
.att{border:1.5px dashed var(--mm-line); border-radius:12px; background:#f8fbfe;}
.att-list li{border-radius:8px; border-color:var(--mm-line);}
.tally{border-radius:12px; background:#f8fbfe;}
.done{border-radius:12px; border:1px solid var(--mm-line); border-left:3px solid var(--good);}
.done h3{font-size:19px;}
.done p{font-size:15px; color:var(--mm-text);}
.rep{border-radius:10px; border-color:var(--mm-line); background:#f8fbfe;}
.toast{border-radius:8px; font-size:15px;}
.foot{font-size:13px; color:var(--mm-text); margin-top:34px;}

/* ---------- phones ---------- */
@media (max-width:600px){
  .two-acts .btn{flex:1 1 100%}
  .mm-footer-bar{padding:18px 20px; justify-content:center; gap:14px 20px}
  .mm-f-addr{flex:1 1 100%}
  .mm-f-mark{width:170px; height:26px}
}

/* ---------- the hero rules the live site applies, lifted from the template ---------- */
/* Desktop rules the live site applies to every hero (from the shared stylesheet):
   the hero is 502px tall with 40px top and bottom padding, and hero buttons are only as wide as their text. */
div[style*="min-height: clamp(380px"]{min-height:502px !important;padding-top:40px !important;padding-bottom:40px !important}
div[style*="max-width: 560px"] > a{flex:0 0 auto !important}
/* Phone rules the live site applies to every hero (from the shared stylesheet) */
@media (max-width:600px){
  div[style*="min-height: clamp(380px"]{min-height:0 !important;padding:30px 20px !important}
  div[style*="flex: 0 1 200px"]{display:flex !important;flex-wrap:wrap;gap:4px 16px;border-left:0 !important;padding-left:0 !important;min-width:0 !important}
  div[style*="flex: 0 1 200px"] > div:nth-child(n+5){display:none !important}
  div[style*="max-width: 560px"] > a{flex:0 0 100% !important}
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="mm-chrome-v2">
.mm-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.mm-actions .mm-login{margin-left:0}
.mm-login{display:inline-block;padding:10px 20px;border-radius:50px;background:var(--mm-pill,#0f314c);color:#ffffff;font-family:var(--mm-font,inherit);font-size:16px;font-weight:600;line-height:16px;text-decoration:none;white-space:nowrap;min-width:max-content}
.mm-login:hover{background:#17476d;color:#ffffff}
.mm-login:focus-visible,.mm-search-btn:focus-visible,.mm-search-in:focus-visible{outline:2px solid var(--mm-sky,#74bfeb);outline-offset:2px}
.mm-search{display:flex;align-items:center;margin:0}
.mm-search-in{box-sizing:border-box;width:0;height:34px;padding:0;border:0;border-radius:6px;opacity:0;background:#ffffff;color:#0d314c;font-family:var(--mm-font,inherit);font-size:15px;transition:width .2s ease,opacity .2s ease,padding .2s ease}
.mm-search.is-open .mm-search-in{width:200px;padding:0 10px;opacity:1}
.mm-search-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:0;background:transparent;color:#ffffff;cursor:pointer}
@media (max-width:1100px){.mm-search{display:none}}
@media (max-width:720px){.mm-login{padding:9px 16px;font-size:15px}}
@media (max-width:1100px){.mm-header:has(.mm-actions){padding:0 38px}.mm-header:has(.mm-actions) .mm-logo{flex:0 1 228px}.mm-header:has(.mm-actions) .mm-logo img{width:228px;height:36px}.mm-actions + .mm-burger{margin-left:0}}
</style>
<style>
/* the sign-up form itself, in the website's colors */
:root{--f-ink:#0d314c;--f-ink2:#44607a;--f-ink3:#7794aa;--f-line:#cfdeeb;--f-field:#adc4d6;--f-wash:#f1f6fa;--f-bad:#b3372c;--f-bad-soft:#fbe9e7;--f-good:#0f7b5c;--f-good-soft:#e1f2ec;--f-blue:#1a8fe3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#ffffff;color:var(--f-ink);font-family:"IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub-wrap{max-width:1120px;margin:0 auto;padding:46px max(20px,env(safe-area-inset-right,0px)) 64px max(20px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:44px;align-items:start}
@media(max-width:900px){.sub-wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:30px}}
.sub-card{background:#ffffff;border:1px solid var(--f-line);border-radius:12px;padding:30px 30px 26px;box-shadow:0 10px 30px -18px rgba(7,29,46,.35)}
@media(max-width:600px){.sub-card{padding:22px 18px}}
.sub-card h2{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sub-card .lede{margin:0 0 22px;color:var(--f-ink2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label.l{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--f-ink)}
label.l i{font-style:normal;color:var(--f-bad)}
label.l small{font-weight:400;color:var(--f-ink3)}
input.t{width:100%;height:44px;padding:0 12px;border:1px solid var(--f-field);border-radius:6px;background:#fff;color:var(--f-ink);font:inherit;font-size:15px}
input.t:focus{outline:2px solid #74bfeb;outline-offset:0;border-color:#74bfeb}
input.t[aria-invalid="true"]{border-color:var(--f-bad);background:var(--f-bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--f-field);background:#fff;color:var(--f-ink);border-radius:6px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#0f314c;border-color:#0f314c;color:#fff}
.chip:focus-visible{outline:2px solid #74bfeb;outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--f-ink2);margin-top:4px}
.consent input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;accent-color:#0f314c}
.consent[data-bad="true"]{color:var(--f-bad)}
.go{display:inline-block;text-align:center;min-width:max-content;white-space:nowrap;margin-top:22px;padding:14px 22px;border-radius:8px;background:linear-gradient(180deg,#2e9dee 0%,#1a8fe3 100%);box-shadow:0 5px 16px -4px rgba(26,143,227,.55);color:#fff;font-family:inherit;font-size:15px;font-weight:600;line-height:1.2;border:1.5px solid #1a8fe3;cursor:pointer}
.go:hover{background:linear-gradient(180deg,#45a9f0 0%,#2e9dee 100%)}
.go:disabled{opacity:.6;cursor:wait}
.go:focus-visible{outline:2px solid #0f314c;outline-offset:3px}
.msg{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:14px;background:var(--f-bad-soft);color:var(--f-bad)}
.msg ul{margin:6px 0 0;padding-left:18px}
.fine{margin:18px 0 0;font-size:12.5px;color:var(--f-ink3)}
.fine a{color:var(--f-ink2)}
.sub-done{text-align:left}
.sub-done .tick{width:52px;height:52px;border-radius:50%;background:var(--f-good-soft);color:var(--f-good);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.sub-done .tick svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sub-done h2{margin-bottom:8px}
.sub-done p{color:var(--f-ink2);margin:0 0 10px}
.side h3{margin:0 0 14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1a74b8;font-weight:700}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.side li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.side li .ic{width:34px;height:34px;border-radius:8px;background:#e3f1fc;color:#1a74b8;display:flex;align-items:center;justify-content:center}
.side li .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side li b{display:block;font-size:15px}
.side li span{color:var(--f-ink2);font-size:14px}
.side .when{margin-top:22px;padding:14px 16px;border-radius:10px;background:var(--f-wash);font-size:14px;color:var(--f-ink2)}

<style>
/* Elections forms: the shared EF form (Elections HQ) in the website look */
:root{--surface:#ffffff;--surface-2:#f4f8fc;--accent-soft:#e3f1fc;--good:#0f7b5c;--good-soft:#e3f3ed;--bad:#b3372c;--ink:#0d314c;--ink-2:#44607a;--ink-3:#5b7790;--border:#cfdeeb;--border-strong:#adc4d6;--rule:#e5eef5;--navy-mid:#1a74b8}
.el-wrap{max-width:1120px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
.ef .ef-hero{display:none}
.ef [hidden]{display:none!important}
.ef{font-family:"IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px}
.ef fieldset{border:1px solid var(--border);border-radius:8px;padding:16px 18px 18px;margin:0 0 16px;background:var(--surface)}
.ef legend{font-weight:700;font-size:15px;padding:0 6px;color:var(--ink)}
.ef .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 16px}
.ef .field{display:flex;flex-direction:column;gap:5px;min-width:0}
.ef .field.wide{grid-column:1/-1}
.ef .field>label{font-size:13px;font-weight:600;color:var(--ink)}
.ef .efn{color:var(--ink-3);font-weight:400;font-size:12.5px;border:0;padding:0;margin:0;background:none}
.ef input[type=text],.ef input[type=email],.ef select,.ef textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:6px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
.ef input:focus,.ef select:focus,.ef textarea:focus{outline:2px solid #74bfeb;outline-offset:1px;border-color:var(--navy-mid)}
.ef .opts{display:flex;flex-direction:column;gap:8px}
.ef .opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:#fff}
.ef .opt:hover{border-color:var(--border-strong)}
.ef .opt input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--navy-mid);flex:0 0 auto}
.ef .opt b{display:block;font-size:14px}
.ef .opt small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.ef .opt.on{border-color:var(--navy-mid);background:var(--accent-soft)}
.ef .seatq{padding:14px 0;border-top:1px solid var(--rule)}
.ef .seatq:first-of-type{border-top:0;padding-top:0}
.ef .seatq h4{margin:0 0 8px;font-size:15px}
.ef .seatq h4 small{font-weight:500;color:var(--ink-3);margin-left:6px}
.ef .ack{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ef .ack input{margin:3px 0 0;width:16px;height:16px;flex:0 0 auto}
.ef .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ef .btn{font:inherit;font-weight:600;font-size:15px;border-radius:6px;padding:12px 22px;cursor:pointer;white-space:nowrap;min-width:max-content;border:1px solid var(--border-strong);background:#fff;color:var(--ink)}
.ef .btn.pri{background:#1a8fe3;border-color:#1a8fe3;color:#fff}
.ef .btn.pri:hover{background:#2e9dee}
.ef .btn:disabled{opacity:.6;cursor:default}
.ef .err{color:var(--bad);font-size:14px;margin-top:10px}
.ef .done{padding:24px 22px;border:1px solid var(--good);background:var(--good-soft);border-radius:8px}
.ef .done b{font-size:17px;display:block;margin-bottom:4px}
.ef .closed{padding:22px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
</style>
</head>

<script>

/* ================= the public forms (shared by Elections HQ and the website copies) =================
   EF.nominate(el, {elections, submit, onDone})   elections: [{cycle, type, name, open, closes, groups:[{name, positions:[{seat, position}]}], seats:[{seat, position}], boardSeats}]
   EF.ballot(el, {slate, code, submit})            slate: what slateOf() returns
   submit(record) returns a promise; the record is what gets filed (nomsubs or votes). */
var EF = (function(){
  "use strict";
  function e(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function id(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function val(root,n){ var x=root.querySelector('[name="'+n+'"]'); if(!x) return ""; if(x.type==="checkbox") return x.checked; return String(x.value||"").trim(); }
  function radio(root,n){ var x=root.querySelector('[name="'+n+'"]:checked'); return x?x.value:""; }
  function fld(name,label,type,req,extra){ return '<div class="field"><label for="ef-'+name+'">'+e(label)+(req?'':' <span class="efn">(optional)</span>')+'</label><input id="ef-'+name+'" name="'+name+'" type="'+(type||"text")+'" autocomplete="'+(extra||"off")+'"'+(req?' required':'')+'></div>'; }
  var LONG={aof:"Area of Focus Co-Chairs", domain:"Business Domain Leadership", goc:"Governance Committee", board:"Board of Directors"};
  var WHAT={aof:"Two Co-Chairs for each Area of Focus", domain:"Chair, Vice Chair and Care and Feeding Lead for each Business Domain", goc:"The five members who confirm MISMO's process was followed", board:"Recommend someone for MISMO's Board of Directors"};
  function fmt(s){ var m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ""; var d=new Date(+m[1],+m[2]-1,+m[3]); return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+", "+["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]+" "+d.getDate(); }

  function nominate(el, cfg){
    var open=(cfg.elections||[]).filter(function(x){ return x.open; });
    var started=Date.now();
    var hero='<div class="ef-hero"><small>MISMO Elections</small><h2>Nominate a Leader</h2><p>Nominate yourself or a colleague. Every nomination is reviewed by MISMO staff, and we confirm with each nominee before anything appears on a ballot.</p></div>';
    if(!open.length){ el.innerHTML='<div class="ef">'+hero+'<div class="closed"><b>Nominations are closed right now.</b><br>Questions? Write to elections@mismo.org.</div></div>'; return; }
    var pre=cfg.preset||open[0].cycle;
    el.innerHTML='<form class="ef" novalidate>'+hero+
      '<fieldset><legend>Which election?</legend><div class="opts">'+open.map(function(x){ return '<label class="opt'+(x.cycle===pre?" on":"")+'"><input type="radio" name="cycle" value="'+e(x.cycle)+'"'+(x.cycle===pre?" checked":"")+'><span><b>'+e(LONG[x.type]||x.name)+'</b><small>'+e(WHAT[x.type]||"")+(x.closes?' · nominations close '+e(fmt(x.closes)):'')+'</small></span></label>'; }).join("")+'</div></fieldset>'+
      '<fieldset id="ef-seatbox"><legend>Seat</legend><div class="fgrid" id="ef-seat"></div></fieldset>'+
      '<fieldset><legend>Are you nominating yourself?</legend><div class="opts"><label class="opt on"><input type="radio" name="self" value="yes" checked><span><b>Yes, I\'m nominating myself</b></span></label><label class="opt"><input type="radio" name="self" value="no"><span><b>No, I\'m nominating someone else</b></span></label></div></fieldset>'+
      '<fieldset><legend id="ef-nlg">Your details</legend><div class="fgrid">'+fld("first","First Name","text",true,"given-name")+fld("last","Last Name","text",true,"family-name")+fld("email","Work Email","email",true,"email")+fld("company","Company","text",true,"organization")+fld("title","Job Title","text",true,"organization-title")+'</div></fieldset>'+
      '<fieldset id="ef-by" hidden><legend>About you, the nominator</legend><div class="fgrid">'+fld("byFirst","Your First Name","text",true)+fld("byLast","Your Last Name","text",true)+fld("byEmail","Your Work Email","email",true)+fld("byCompany","Your Company","text",true)+'</div>'+
        '<div class="field" style="margin-top:12px"><label>Has the nominee agreed to be nominated?</label><div class="opts"><label class="opt"><input type="radio" name="aware" value="yes"><span><b>Yes</b></span></label><label class="opt"><input type="radio" name="aware" value="no"><span><b>Not yet</b><small>That\'s fine. MISMO will ask them.</small></span></label></div></div></fieldset>'+
      '<fieldset><legend id="ef-stlg">A few words for the ballot</legend><div class="field wide"><label for="ef-statement">Why this person is a good fit <span class="efn">(a few sentences; shown to voters)</span></label><textarea id="ef-statement" name="statement" rows="4" maxlength="1200"></textarea></div></fieldset>'+
      '<fieldset><legend>Before you send it</legend><label class="ack"><input type="checkbox" name="ack"> <span>The nominee works for a MISMO member company and can take part in the meetings this role needs.</span></label></fieldset>'+
      '<div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>'+
      '<button class="btn pri" type="submit" id="ef-go">Send the Nomination</button><div class="err" id="ef-err" role="alert"></div></form>';
    var f=el.querySelector("form");
    function seatBox(){
      var cy=radio(f,"cycle"); var x=open.filter(function(o){ return o.cycle===cy; })[0]; var box=f.querySelector("#ef-seat"); var fs=f.querySelector("#ef-seatbox");
      if(!x){ fs.hidden=true; return; }
      if(x.type==="aof"||x.type==="domain"){ fs.hidden=false; var gl=x.type==="aof"?"Area of Focus":"Business Domain";
        var doms={}; x.groups.forEach(function(g){ var d=g.domain||""; (doms[d]=doms[d]||[]).push(g); });
        var opts=Object.keys(doms).sort().map(function(d){ var o=doms[d].map(function(g){ return '<option>'+e(g.name)+'</option>'; }).join(""); return d?'<optgroup label="'+e(d)+'">'+o+'</optgroup>':o; }).join("");
        box.innerHTML='<div class="field"><label for="ef-group">'+gl+'</label><select id="ef-group" name="group" required><option value="">Choose one</option>'+opts+'</select></div><div class="field" id="ef-posf"><label for="ef-pos">Position</label><select id="ef-pos" name="seat" required><option value="">Choose the '+gl+' first</option></select></div>';
        var g=box.querySelector("#ef-group"), p=box.querySelector("#ef-pos"), pf=box.querySelector("#ef-posf");
        g.onchange=function(){ var gg=x.groups.filter(function(z){ return z.name===g.value; })[0]; var ps=gg?gg.positions:[];
          p.innerHTML=(ps.length===1?'':'<option value="">Choose one</option>')+ps.map(function(s){ return '<option value="'+e(s.seat)+'">'+e(s.position)+'</option>'; }).join(""); pf.hidden=ps.length===1; };
        pf.hidden=x.type==="aof"; }
      else if(x.type==="board"){ fs.hidden=false; box.innerHTML='<div class="field"><label for="ef-bseat">Kind of company</label><select id="ef-bseat" name="seatCat"><option value="">Choose one</option>'+(x.boardSeats||[]).map(function(s){ return '<option>'+e(s)+'</option>'; }).join("")+'</select></div>'; }
      else if((x.seats||[]).length>1){ fs.hidden=false; box.innerHTML='<div class="field"><label for="ef-pos">Seat</label><select id="ef-pos" name="seat" required><option value="">Choose one</option>'+x.seats.map(function(s){ return '<option value="'+e(s.seat)+'">'+e(s.position)+'</option>'; }).join("")+'</select></div>'; }
      else { fs.hidden=true; box.innerHTML='<input type="hidden" name="seat" value="'+e(((x.seats||[])[0]||{}).seat||"")+'">'; }
    }
    function who(){ var self=radio(f,"self")==="yes"; f.querySelector("#ef-by").hidden=self; f.querySelector("#ef-nlg").textContent=self?"Your details":"About the nominee"; }
    f.addEventListener("change",function(ev){ if(ev.target.name==="cycle") seatBox(); if(ev.target.name==="self") who();
      [].forEach.call(f.querySelectorAll(".opt"),function(o){ var i=o.querySelector("input"); o.classList.toggle("on",!!(i&&i.checked)); }); });
    seatBox(); who();
    f.addEventListener("submit",function(ev){
      ev.preventDefault(); var er=f.querySelector("#ef-err"); er.textContent="";
      var cy=radio(f,"cycle"), x=open.filter(function(o){ return o.cycle===cy; })[0], self=radio(f,"self")==="yes";
      var need=["first","last","email","company","title"].concat(self?[]:["byFirst","byLast","byEmail","byCompany"]);
      var miss=need.filter(function(n){ return !val(f,n); });
      if(!x) return void(er.textContent="Choose which election this nomination is for.");
      if(x.type!=="board" && !val(f,"seat")) return void(er.textContent="Choose the seat.");
      if(miss.length) return void(er.textContent="Please fill in every field marked as needed.");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val(f,"email")) || (!self && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val(f,"byEmail")))) return void(er.textContent="Check the email address.");
      if(!val(f,"ack")) return void(er.textContent="Please tick the box before sending.");
      var rec={id:id("ns"), kind:"nomination", cycle:cy, type:x.type, group:val(f,"group"), seat:val(f,"seat"), seatCat:val(f,"seatCat"),
        nominee:{first:val(f,"first"), last:val(f,"last"), email:val(f,"email"), company:val(f,"company"), title:val(f,"title")},
        self:self, nominator: self?null:{name:val(f,"byFirst")+" "+val(f,"byLast"), email:val(f,"byEmail"), company:val(f,"byCompany")},
        aware: self?"yes":(radio(f,"aware")||"no"), statement:val(f,"statement"), submittedAt:new Date().toISOString(),
        hp: !!val(f,"website") || (Date.now()-started)<4000};
      var b=f.querySelector("#ef-go"); b.disabled=true; b.textContent="Sending…";
      Promise.resolve(cfg.submit(rec)).then(function(){
        el.innerHTML='<div class="ef">'+hero+'<div class="done"><b>Thank you. Your nomination is in.</b>MISMO staff will review it and confirm with '+(self?"you":e(rec.nominee.first))+' before the ballot goes out. Questions? Write to elections@mismo.org.<div style="margin-top:12px"><button class="btn" type="button" id="ef-again">Nominate Someone Else</button></div></div></div>';
        el.querySelector("#ef-again").onclick=function(){ nominate(el,cfg); };
        if(cfg.onDone) cfg.onDone(rec);
      },function(err){ b.disabled=false; b.textContent="Send the Nomination"; er.textContent="That didn't go through. Please try again, or email elections@mismo.org."+(err&&err.message?" ("+err.message+")":""); });
    });
  }

  function ballot(el, cfg){
    var sl=cfg.slate; var started=Date.now(); var GL=sl&&sl.type==="domain"?"Business Domain":"Area of Focus";
    var hero='<div class="ef-hero"><small>MISMO Elections · '+e(sl?sl.year:"")+'</small><h2>'+e(sl?sl.name:"Ballot")+'</h2><p>One ballot per company'+(sl&&sl.type==="aof"?' in each Area of Focus':sl&&sl.type==="domain"?' in each Business Domain':'')+'. '+(sl&&sl.closes?'Voting closes '+e(fmt(sl.closes))+'.':'')+'</p></div>';
    if(!sl || cfg.closed){ el.innerHTML='<div class="ef">'+hero+'<div class="closed"><b>This ballot isn\'t open right now.</b><br>Questions? Write to elections@mismo.org.</div></div>'; return; }
    var multi=sl.groups.length>1;
    el.innerHTML='<form class="ef" novalidate>'+hero+
      '<fieldset><legend>About you</legend><div class="fgrid">'+fld("first","First Name","text",true,"given-name")+fld("last","Last Name","text",true,"family-name")+fld("email","Work Email","email",true,"email")+fld("company","Company","text",true,"organization")+fld("title","Job Title","text",false,"organization-title")+'</div></fieldset>'+
      (multi?'<fieldset><legend>Which '+GL+' are you voting in?</legend><div class="field"><select name="group" id="ef-g" required><option value="">Choose one</option>'+sl.groups.map(function(g){ return '<option>'+e(g.name)+'</option>'; }).join("")+'</select></div><div class="efn" style="margin-top:6px">Taking part in more than one? Send one ballot for each.</div></fieldset>':'')+
      '<fieldset><legend>Your votes</legend><div id="ef-seats">'+(multi?'<div class="efn">Choose the '+GL+' first.</div>':'')+'</div></fieldset>'+
      '<fieldset><legend>Before you send it</legend><label class="ack"><input type="checkbox" name="ack"> <span>I\'m casting this ballot for my company, and my company is sending only one'+(sl.type==="aof"||sl.type==="domain"?' for this '+GL:'')+'.</span></label></fieldset>'+
      '<div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>'+
      '<button class="btn pri" type="submit" id="ef-go">Cast My Ballot</button><div class="err" id="ef-err" role="alert"></div></form>';
    var f=el.querySelector("form");
    function draw(g){ var box=f.querySelector("#ef-seats"); if(!g){ box.innerHTML='<div class="efn">Choose the '+GL+' first.</div>'; return; }
      var seats=g.seats.filter(function(s){ return s.nominees.length; }); if(!seats.length){ box.innerHTML='<div class="efn">There are no confirmed nominees on this ballot yet.</div>'; return; }
      box.innerHTML=seats.map(function(s){ var many=s.count>1;
        return '<div class="seatq" data-seat="'+e(s.id)+'" data-count="'+s.count+'"><h4>'+e(s.position)+'<small>'+(many?'vote for up to '+s.count:'vote for one')+'</small></h4><div class="opts">'+
          s.nominees.map(function(n){ return '<label class="opt"><input type="'+(many?"checkbox":"radio")+'" name="s_'+e(s.id)+'" value="'+e(n.id)+'"><span><b>'+e(n.name)+'</b><small>'+e([n.title,n.company].filter(Boolean).join(", "))+'</small>'+(n.statement?'<small style="margin-top:6px">'+e(n.statement)+'</small>':'')+'</span></label>'; }).join("")+
          '<label class="opt"><input type="'+(many?"checkbox":"radio")+'" name="s_'+e(s.id)+'" value="abstain"><span><b>Abstain</b></span></label></div></div>'; }).join(""); }
    if(!multi) draw(sl.groups[0]);
    else { var gs=f.querySelector("#ef-g"); gs.onchange=function(){ draw(sl.groups.filter(function(g){ return g.name===gs.value; })[0]); };
      if(cfg.group && sl.groups.some(function(g){ return g.name===cfg.group; })){ gs.value=cfg.group; gs.onchange(); } }
    f.addEventListener("change",function(ev){ var t=ev.target; if(t.type==="checkbox" && t.name.indexOf("s_")===0){ var q=t.closest(".seatq"), max=+q.dataset.count; if(t.value==="abstain" && t.checked) [].forEach.call(q.querySelectorAll("input"),function(i){ if(i!==t) i.checked=false; }); else { var ab=q.querySelector('input[value="abstain"]'); if(ab && t.checked) ab.checked=false; var on=q.querySelectorAll("input:checked"); if(on.length>max){ t.checked=false; f.querySelector("#ef-err").textContent="You can choose up to "+max+" for "+q.querySelector("h4").firstChild.textContent+"."; } } }
      [].forEach.call(f.querySelectorAll(".opt"),function(o){ var i=o.querySelector("input"); o.classList.toggle("on",!!(i&&i.checked)); }); });
    f.addEventListener("submit",function(ev){
      ev.preventDefault(); var er=f.querySelector("#ef-err"); er.textContent="";
      var miss=["first","last","email","company"].filter(function(n){ return !val(f,n); });
      if(miss.length) return void(er.textContent="Please fill in your name, email and company.");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val(f,"email"))) return void(er.textContent="Check the email address.");
      var g=multi? val(f,"group") : sl.groups[0].name; if(!g) return void(er.textContent="Choose the "+GL+".");
      var choices={}, any=false;
      [].forEach.call(f.querySelectorAll(".seatq[data-seat]"),function(q){ var picks=[].map.call(q.querySelectorAll("input:checked"),function(i){ return i.value; }).filter(function(v){ return v!=="abstain"; }); choices[q.dataset.seat]=picks; if(q.querySelector("input:checked")) any=true; });
      if(!any) return void(er.textContent="Make at least one choice, or choose Abstain.");
      if(!val(f,"ack")) return void(er.textContent="Please tick the box before sending.");
      var rec={id:id("v"), kind:"ballot", cycle:sl.cycle, group:g, voter:{first:val(f,"first"), last:val(f,"last"), email:val(f,"email"), company:val(f,"company"), title:val(f,"title")}, code:cfg.code||"", choices:choices, submittedAt:new Date().toISOString(), hp: !!val(f,"website") || (Date.now()-started)<4000};
      var b=f.querySelector("#ef-go"); b.disabled=true; b.textContent="Sending…";
      Promise.resolve(cfg.submit(rec)).then(function(){
        el.innerHTML='<div class="ef">'+hero+'<div class="done"><b>Thank you. Your ballot is in.</b>Results will be announced '+(sl.announce?e(fmt(sl.announce)):"soon")+'.'+(multi?'<div style="margin-top:12px"><button class="btn" type="button" id="ef-again">Vote in Another '+GL+'</button></div>':'')+'</div></div>';
        var a=el.querySelector("#ef-again"); if(a) a.onclick=function(){ ballot(el,cfg); };
        if(cfg.onDone) cfg.onDone(rec);
      },function(err){ b.disabled=false; b.textContent="Cast My Ballot"; er.textContent="That didn't go through. Please try again, or email elections@mismo.org."+(err&&err.message?" ("+err.message+")":""); });
    });
  }
  return {nominate:nominate, ballot:ballot};
})();

(function(){
  "use strict";
  /* Where ballots go: the "Elections Ballots" Power Automate flow, which files each one, exactly as
     cast, in GitMISMO/elections-hq-data (data/votes.json). Elections HQ checks one company, one vote
     and counts them. Empty until the flow is switched on. The ballot itself (confirmed nominees only)
     comes from /elections-hq/slates/<election>.json, which Elections HQ publishes.
     Links: ?e=2027-cop (the election), &c=ABC123 (a voter's personal code), &g=API%20CoP (preselect a CoP). */
  var FLOW_ENDPOINT = "";

  function todayIso(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  function isOpen(mode,from,until){ if(mode==="open") return true; if(mode==="closed") return false; var t=todayIso(); return !!(from && t>=from && (!until || t<=until)); }
  function send(kind, rec){
    if(rec.hp) return Promise.resolve();               /* a robot: thank it and send nothing */
    if(!FLOW_ENDPOINT) return Promise.reject(new Error("this form opens in the next few days; until then email elections@mismo.org"));
    return fetch(FLOW_ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(Object.assign({form:kind, page:document.referrer||""},rec))})
      .then(function(r){ if(!r.ok) throw new Error("status "+r.status); });
  }
  var q=new URLSearchParams(location.search), host=document.getElementById("ef-host");

  var e=(q.get("e")||"").replace(/[^a-z0-9-]/gi,"");
  if(!e){ EF.ballot(host,{slate:null}); return; }
  fetch("/elections-hq/slates/"+e+".json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }).then(function(sl){
    var closed=!sl || !isOpen(sl.mode,sl.opens,sl.closes);
    EF.ballot(host,{slate:sl, closed:closed, code:(q.get("c")||"").replace(/[^A-Z0-9]/gi,"").toUpperCase(), group:q.get("g")||"", submit:function(rec){ return send("elections-ballot",rec); }});
  });
})();
</script>
