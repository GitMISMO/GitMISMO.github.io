<!doctype html>
<html lang="en" data-rs-gate>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IM Review · MISMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root{
  --navy:#0d314c;--sky:#74bfeb;--navy-deep:#06202f;--navy-mid:#14486e;--sky-soft:#a9d8f3;--sky-wash:#e4f2fb;
  --ground:#f1f6fa;--surface:#ffffff;--surface-2:#f6fafd;--surface-3:#e9f1f8;--sunk:#f6fafd;
  --border:#d5e2ed;--border-strong:#adc4d6;--rule:#e5eef5;--line:#e5eef5;
  --ink:#0d314c;--ink-2:#456179;--ink-3:#7794aa;
  --good:#0f7b5c;--bad:#b3372c;--warn:#a2701a;
  --good-bg:#e3f4ed;--bad-bg:#fbe9e7;--warn-bg:#fbf1dc;--info-bg:#e4f2fb;--hold-bg:#efe9f7;--hold:#6b4fa0;
  --accent:#2477b8;--accent-soft:#e4f2fb;
  --c1:#2477b8;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;
  --display:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ui:var(--display);--mono:var(--display);
  --hq-h:64px;--rail-w:240px;--rail-mini:62px;
  --shadow:0 1px 2px rgba(13,49,76,.06),0 4px 14px rgba(13,49,76,.06);
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#0a2130;
  --border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;
  --ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;
  --good:#4fc79b;--bad:#f08579;--warn:#e0a83c;
  --good-bg:#0f3a30;--bad-bg:#432423;--warn-bg:#3d3017;--info-bg:#123a55;--hold-bg:#2c2545;--hold:#b9a3e8;
  --accent:#3987e5;--accent-soft:#173c52;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#0a2130;
  --border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;
  --ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;
  --good:#4fc79b;--bad:#f08579;--warn:#e0a83c;
  --good-bg:#0f3a30;--bad-bg:#432423;--warn-bg:#3d3017;--info-bg:#123a55;--hold-bg:#2c2545;--hold:#b9a3e8;
  --accent:#3987e5;--accent-soft:#173c52;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{letter-spacing:-.012em;margin:0;color:var(--ink)}
a{color:var(--accent)}
button{font-family:inherit}
[hidden]{display:none!important}
:root{--hq-h:64px;--rail-w:240px;--rail-mini:62px}
/* the masthead, across the top, as every MISMO page wears it */
.hqtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:97;height:var(--hq-h);
  background:var(--navy);color:#fff;display:flex;align-items:center;gap:0;
  padding:0 22px;box-shadow:0 1px 0 rgba(80,164,219,.28);
  margin-left:calc(0px - var(--rail-w));width:calc(100% + var(--rail-w));
  transition:margin-left .2s cubic-bezier(.4,0,.2,1), width .2s cubic-bezier(.4,0,.2,1)}
body.railmini .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
@media (prefers-reduced-motion:reduce){ .hqtop{transition:none} }
.hqtop .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;
  margin-inline:20px;border-radius:1px;background:var(--sky)}
.hqtop .hqname{font-family:var(--display);font-size:15.5px;font-weight:700;
  letter-spacing:-.005em;color:var(--sky);white-space:nowrap}
.hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px}
.hqtop .eyebrow-m{font-family:var(--display);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
@media(max-width:700px){.hqtop .eyebrow-m{display:none}}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;
  align-items:center;line-height:0;flex:0 0 auto;position:relative}
.logoplate .wordmark{height:24px;width:auto;display:block}

/* the sections, down the left, beneath it */
.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;
  background:var(--navy);color:#fff;display:flex;flex-direction:column;
  gap:0;padding:0;overflow:hidden auto;overscroll-behavior:contain;
  box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14);
  transition:width .2s cubic-bezier(.4,0,.2,1)}
body{padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){ .hq.rail,body{transition:none} }

/* ── Narrowed: the icons and nothing else ── */
body.railmini{padding-left:var(--rail-mini)}
body.railmini .hq.rail{width:var(--rail-mini)}
body.railmini .rail-top{justify-content:center;padding:10px 0 9px}
body.railmini .rail-lbl{display:none}
body.railmini .railhide{margin:0}
body.railmini .railhide svg{transform:scaleX(-1)}
body.railmini .railfind{padding:9px 0 2px;display:flex;justify-content:center}
body.railmini .railfind .fi,
body.railmini .railfind input,
body.railmini .railq-x,
body.railmini .railhits{display:none}
body.railmini .railfind-b{display:flex}
body.railmini .hq nav{padding:6px 0 4px;align-items:center;gap:4px}
body.railmini .hq nav button{width:42px;padding:10px 0;justify-content:center;
  border-radius:9px;box-shadow:none}
body.railmini .hq nav button span{display:none}
body.railmini .hq nav button svg{width:19px;height:19px}
body.railmini .hq nav button[aria-current]{background:var(--sky);color:var(--navy-deep,#06202f)}
body.railmini .hq nav button[aria-current] svg{stroke:var(--navy-deep,#06202f);opacity:1}
body.railmini .railsum{display:none}
body.railmini .hq .mast-right{gap:3px;padding:8px 0 11px;align-items:center}
body.railmini .hq .mast-right .theme-btn{width:42px;padding:9px 0;font-size:0;
  justify-content:center;border-radius:9px}
body.railmini .hq .mast-right .theme-btn .ti{width:19px;height:19px}
body.railmini .hq .mast-right .theme-btn span{display:none}
body.railmini .hq .mast-right #theme-btn{margin-top:4px;padding-top:10px;border-radius:9px}

/* the magnifier that stands in for the search box when it is narrow */
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);
  border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);
  align-items:center;justify-content:center;padding:0}
.railfind-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.railfind-b:hover{background:rgba(255,255,255,.18);color:#fff}

.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;
  border-bottom:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.rail-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);
  border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;padding:0}
.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}

/* search */
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}
.railfind .fi{position:absolute;left:21px;top:20px;width:14px;height:14px;
  fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 26px 6px 30px}
.railfind input::placeholder{color:rgba(255,255,255,.5)}
.railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
.railfind input::-webkit-search-cancel-button{display:none}
.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;
  background:transparent;color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0}
.railq-x:hover{background:rgba(255,255,255,.16);color:#fff}
.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong,#adc4d6);
  border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;
  max-height:min(52vh,420px)}
.railhits .rh-g{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;
  border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);font-family:var(--ui)}
.railhits .rh:last-child{border-bottom:0}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.railhits .rh i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.03em;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}

.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);
  padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap}
.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid,#14486e);
  box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.hq nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}

/* the foot: theme toggle (and anything else, like Undo/Backup, above it) */
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;
  padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);
  padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .ti-moon{display:none}
  :root:not([data-theme="light"]) .theme-btn .ti-sun{display:block} }
.theme-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:disabled{opacity:.4;cursor:not-allowed}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right #theme-btn{margin-top:5px;padding-top:11px;
  border-top:1px solid rgba(80,164,219,.18);border-radius:0 0 6px 6px}

/* on a narrow screen the rail covers the page rather than squeezing it */
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block}
}

/* sign-in, access and connection notices (resources.mismo.org) */
/* account button: squared corners, same as Team HQ */
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}
/* ── IM Review portal ── */
body{min-height:100vh}
.santa{position:absolute;display:none;pointer-events:none;left:-9px;top:-12px;width:31px;height:31px}
html[data-season="december"] .santa{display:block}
.hq nav button .nb{margin-left:auto;font-size:11px;font-weight:700;background:var(--sky);color:var(--navy-deep);border-radius:9px;padding:0 7px;line-height:18px}
body.railmini .hq nav button .nb{display:none}
.help h3{font-size:15px;margin:0 0 8px}
.help ol,.help ul{margin:0;padding-left:20px;display:grid;gap:7px;font-size:14px;line-height:1.5}
.help p{font-size:14px;line-height:1.55;margin:0 0 8px;max-width:820px}
.help .g2 .card{margin-bottom:0}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
h1{font-size:25px;font-weight:700;margin:0 0 4px}
.sub{color:var(--ink-2);font-size:14px;max-width:760px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
.card h3{font-size:15px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.card h3 small{font-size:12px;font-weight:500;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13.5px;padding:18px 4px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.3;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
:root[data-theme="dark"] .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}

/* hero */
.hero{background:linear-gradient(135deg,#0d314c 0%,#14486e 100%);color:#fff;border-radius:10px;padding:22px 26px;margin-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:center}
.hero-go{align-self:flex-start;margin-top:14px;background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
.hero-go:hover{background:#8fd0f3}
.hero .date{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:700}
.hero h2{color:#fff;font-size:26px;margin:6px 0}
.hero p{margin:0;color:rgba(255,255,255,.85);font-size:14.5px}
.hero p b{color:var(--sky)}
.hero-l{display:flex;flex-direction:column}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:11px 13px}
.hs span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7)}
.hs b{display:block;font-size:26px;line-height:1.15}
.hs em{display:block;font-style:normal;font-size:12px;color:rgba(255,255,255,.6)}
.hq{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:12px}
.hq-h{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.hq a{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:rgba(255,255,255,.06);border-radius:6px;padding:9px 11px;margin-bottom:6px;color:#fff;text-decoration:none}
.hq a:hover{background:rgba(255,255,255,.13)}
.hq a b{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq a i{font-style:normal;font-size:12px;color:var(--sky);font-weight:700;white-space:nowrap}
.hq a em{grid-column:1/-1;font-style:normal;font-size:12px;color:rgba(255,255,255,.62)}
.hq .none{font-size:13px;color:rgba(255,255,255,.75);padding:8px 2px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}

/* submission rows */
.subs{display:grid;gap:10px}
.sc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;padding:13px 16px;color:var(--ink);text-decoration:none}
.sc:hover{border-color:var(--border-strong);background:var(--surface-2)}
.sc.done{border-left-color:var(--good)}
.sc-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sc .wr{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.sc b{font-size:15px;line-height:1.3}
.sc-m{display:flex;flex-direction:column;gap:7px;min-width:0}
.sc .m{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:10px;padding:2px 9px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.look{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.sc .bar{height:6px;border-radius:3px;display:flex;overflow:hidden;gap:2px}
.sc .bar i{display:block;height:100%}
.sc .f{font-size:12px;color:var(--ink-3)}
.sc-go{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
@media(max-width:760px){.sc{grid-template-columns:1fr;gap:8px}.sc-go{justify-self:start}}

/* the desk */
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dhead .t{flex:1;min-width:260px}
.back{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.prog{min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.prog b{font-size:20px}
.prog span{font-size:12.5px;color:var(--ink-3);margin-left:6px}
.prog .pb{height:7px;border-radius:4px;background:var(--surface-3);margin-top:7px;overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--good);border-radius:4px}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.step .sk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.step b{font-size:22px;line-height:1.1}
.step p{margin:0;font-size:12.5px;color:var(--ink-2)}
.step .btn{align-self:flex-start;margin-top:4px}
.step.cur{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky-wash)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg button b{font-weight:700;opacity:.8;margin-left:4px}
.dtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dtools .sp{flex:1}
.rows{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border-strong);border-radius:8px;padding:12px 14px}
.row.look{border-left-color:var(--warn)}
.row.ok{border-left-color:var(--good);opacity:.92}
.row.chg{border-left-color:var(--accent)}
.rh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rh .it{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.rh .ct{font-size:11.5px;color:var(--ink-3)}
.rh b{font-size:14.5px}
.rh .pc{font-size:12px;color:var(--ink-3)}
.lbl{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:2px}
.def{margin-top:8px;font-size:13.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cols.one{grid-template-columns:1fr}
.box{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;font-size:13px}
.box .why{margin-top:5px;color:var(--ink-2)}
.box .sug{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.dec{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;background:var(--good-bg);color:var(--good)}
.dec.d1{background:var(--info-bg);color:var(--accent)}
.dec.d2,.dec.d3{background:var(--warn-bg);color:var(--warn)}
.dec.d4{background:var(--bad-bg);color:var(--bad)}
.conf{font-size:11.5px;color:var(--ink-3);margin-left:6px}
.racts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.edit{margin-top:10px;display:grid;gap:10px}
.edit label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.edit select,.edit textarea{font:inherit;font-size:13.5px;border:1px solid var(--border-strong);border-radius:5px;padding:7px 9px;background:var(--surface);color:var(--ink);width:100%}
.edit textarea{min-height:64px;resize:vertical}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);font-family:inherit}
.foot{position:sticky;bottom:0;z-index:30;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 -4px 14px rgba(13,49,76,.08);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foot .sp{flex:1}
.foot span{font-size:13px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;font-size:13.5px;z-index:99;box-shadow:var(--shadow)}

/* trends */
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 15px;border-top:3px solid var(--kc,var(--c1))}
.k span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.k b{display:block;font-size:27px;line-height:1.15}
.k em{display:block;font-style:normal;font-size:12px;color:var(--ink-2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g2 .card{margin-bottom:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--ink-3)}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .base{stroke:var(--border-strong);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--navy-deep);color:#fff;font-size:12px;border-radius:5px;padding:7px 9px;box-shadow:var(--shadow);white-space:nowrap;z-index:5;line-height:1.45}
.tip b{color:var(--sky)}
.note{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:7px 9px;border-bottom:1px solid var(--navy);background:var(--surface-3);white-space:nowrap}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.meter{display:inline-block;width:70px;height:7px;border-radius:4px;background:var(--surface-3);vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
@media(max-width:900px){.g2{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}.plan{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
@media(max-width:560px){.hqtop{padding:0 12px}.hqtop .mastrule{margin-inline:12px}.wrap{padding:16px 16px 50px}.hero{padding:18px}.hero h2{font-size:22px}.hstats{gap:6px}.hs{padding:9px}.hs b{font-size:21px}.hs span{font-size:9.5px;letter-spacing:.03em}.hs em{font-size:11px}.subs{grid-template-columns:1fr}h1{font-size:21px}}
.sub{overflow-wrap:anywhere}
@media(max-width:560px){.plan{grid-template-columns:1fr 1fr;gap:8px}.plan .step:nth-child(3){display:none}.step p{display:none}.step b{font-size:19px}.step .btn{white-space:normal;text-align:left}.prog{min-width:0;width:100%}.dtools .seg button{padding:7px 9px;font-size:12.5px}.foot{padding:8px 10px}.foot span{font-size:12px}}
details.nums{margin-top:10px;font-size:12.5px}details.nums summary{cursor:pointer;color:var(--accent);font-weight:600}details.nums .tbl{margin-top:8px;font-size:12px}
.finds{margin:0;padding-left:20px;display:grid;gap:7px;font-size:14px;line-height:1.5}

<script>
/* =====================================================================
   IM Review: the portal for MISMO's Information Management reviewers.
   Each IM submission arrives from the MMS with a draft decision for every
   row. Reviewers agree, or correct what the draft got wrong; each correction
   teaches the next draft. Trends and the draft's track record come from the
   IM library (2020 on) and from every review finished here.
   Data (GitMISMO/im-review-data, through the relay):
     queue            {items:{rep:{...}}}   what's waiting and what's decided
     rev-<rep>        one submission: rows, the draft, IM's decisions
     learn-<year>     {rows:{id:{kind,rule,draft,final,agreed,...}}}
     config           {imauto:{kind:true}, reviewers:[emails]}
     backtest         trends and the draft's track record from history
   ===================================================================== */
(function(){
"use strict";
const RELAY="https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws", PROJECT="im-review";
const RS=()=>window.ResourcesSession||null, tok=()=>{ try{ return RS().token(); }catch(e){ return ""; } };
const U=n=>RELAY+"/"+PROJECT+"/data/"+encodeURIComponent(n);
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=s=>{ const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m?MON[+m[2]-1]+" "+(+m[3])+", "+m[1]:""; };
const fmtS=s=>{ const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m?MON[+m[2]-1]+" "+(+m[3]):""; };
const first=n=>String(n||"").trim().split(/\s+/)[0]||"";
const safe=s=>String(s).replace(/[^A-Za-z0-9_-]/g,"_").slice(0,80);
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- the relay ---------- */
async function get(n){ const r=await fetch(U(n),{headers:{Authorization:"Bearer "+tok()},cache:"no-store"}); if(r.status===404) return {data:null,sha:null}; if(!r.ok) throw new Error(n+" "+r.status); const j=await r.json(); return {data:(j&&j.data)||null,sha:(j&&j.sha)||null}; }
async function put(n,content,sha){ return fetch(U(n),{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok()},body:JSON.stringify({content,sha:sha||undefined})}); }
/* read, change, write; on a clash (someone saved first) read again and redo the change */
async function update(n,fn){ for(let i=0;i<5;i++){ const g=await get(n); const next=fn(g.data?clone(g.data):null); const r=await put(n,next,g.sha); if(r.ok) return next; if(r.status!==409&&r.status!==422) throw new Error("save "+r.status); await new Promise(s=>setTimeout(s,300+i*400)); } throw new Error("busy"); }

/* ---------- decisions ---------- */
const DEC=["Approved as Submitted","Approved with Modification","Returned","Denied","Withdrawn","Deferred"];
const RANK={"Approved as Submitted":0,"Approved with Modification":1,"Deferred":2,"Returned":3,"Withdrawn":3,"Denied":4};
const DCOL={"Approved as Submitted":"var(--good)","Approved with Modification":"var(--c1)","Returned":"var(--warn)","Denied":"var(--bad)","Withdrawn":"var(--ink-3)","Deferred":"var(--hold)"};
const chip=d=>'<span class="dec d'+(RANK[d]||0)+'">'+esc(d)+'</span>';
const isLook=r=>(r.draft.look||r.draft.dec!=="Approved as Submitted")&&!r.auto;
const kindOf=r=>[r.draft.dec,r.draft.rule||"clean",String(r.tt||"").toLowerCase()].join("|");
const RULE_NAME={clean:"no issues found",ai:"Claude’s read",template:"definition template","def-acr":"acronym not spelled out","def-impl":"implementation language",abbr:"abbreviation",classword:"class word","normal-english":"name not in normal English","def-period":"definition punctuation","def-repeat":"definition repeats the name","neg-ind":"negative indicator",dup:"added twice","rm-exists":"already in the Reference Model","rm-cn-exists":"container already exists","rm-enum-exists":"enumeration already exists","rm-ac-exists":"acronym already exists","rm-missing":"not in the Reference Model","rm-cn-missing":"container not in the model","rm-parent":"parent container","rm-enum-dp":"enumeration’s data point","rm-enum-missing":"enumeration not in the model","rm-xpath":"XPATH not in the model","rm-rename-taken":"new name already taken",ct:"change type blank","rm-type-enums":"Type without enumerations","other-desc":"Other without Other Description",xpath:"XPATH format",need:"required columns blank","rm-similar":"similar to an existing data point","rm-enum-near":"similar enumeration","rm-deprecated":"deprecated in the model","rm-already-there":"already in the model","rm-old-def":"old definition doesn’t match"};
const QUICK=["Already in the model; reuse the existing data point.","Improve the definition.","Enumerations need definitions.","Correct the XPATH.","Spell out the acronym, then give it in parentheses.","Use the class word definition template.","Remove implementation language from the definition.","Coordinate with the other workgroup first."];

/* ---------- state ---------- */
const S={me:{name:"",email:""},role:"",queue:{},docs:{},learn:{},cfg:{imauto:{}},bt:null,filter:"look",edit:null,loaded:false};
/* everyone with access can read; IM reviewers (People and Roles › IM Reviewer in
   the MMS, copied into config.reviewers) and admins make the decisions */
const canEdit=()=>{ try{ if(RS()&&RS().canEdit) return !!RS().canEdit(PROJECT); }catch(e){} return S.role==="admin"||S.role==="staff"; };
const canReview=()=>{ if(S.role==="admin") return true; if(!canEdit()) return false; const L=(S.cfg.reviewers||[]).map(x=>String(x).toLowerCase()); return !L.length||L.includes(String(S.me.email||"").toLowerCase()); };
const isAdmin=()=>S.role==="admin";
const route=()=>{ const h=location.hash.replace(/^#\/?/,""); const [a,b]=h.split("/"); return {view:a||"waiting",rep:b?decodeURIComponent(b):""}; };

/* how often IM agreed with each kind of draft: live reviews first, history behind them */
function kindStats(){ const st={}; Object.values(S.learn).forEach(x=>{ if(!x||!x.kind) return; const s=st[x.kind]=st[x.kind]||{n:0,agree:0,live:0}; s.n++; s.live++; if(x.agreed) s.agree++; });
  ((S.bt&&S.bt.draft&&S.bt.draft.byKind)||[]).forEach(k=>{ const s=st[k.kind]=st[k.kind]||{n:0,agree:0,live:0}; s.hn=k.n; s.hagree=k.agree; });
  return st; }
function confidence(r){ const s=kindStats()[kindOf(r)]; if(!s) return ""; const n=(s.n||0)+(s.hn||0), a=(s.agree||0)+(s.hagree||0); if(n<5) return ""; return "IM agreed with this kind of draft "+pct(a,n)+"% of "+n+" times"; }

/* ---------- loading ---------- */
async function load(role){
  S.role=role||""; const c=(RS()&&RS().current())||{}; S.me={name:c.name||"",email:c.email||""};
  const yr=new Date().getFullYear();
  const [q,cfg,bt,l1,l0]=await Promise.all(["queue","config","backtest","learn-"+yr,"learn-"+(yr-1)].map(n=>get(n).catch(()=>({data:null}))));
  S.queue=(q.data&&q.data.items)||{}; S.cfg=Object.assign({imauto:{}},cfg.data||{}); S.bt=bt.data||null;
  S.learn=Object.assign({},(l0.data&&l0.data.rows)||{},(l1.data&&l1.data.rows)||{});
  S.loaded=true; render();
}
async function openDoc(rep){ if(S.docs[rep]) return S.docs[rep]; const g=await get("rev-"+safe(rep)); if(g.data) S.docs[rep]=g.data; return S.docs[rep]||null; }
async function refreshQueue(){ try{ const q=await get("queue"); S.queue=(q.data&&q.data.items)||{}; }catch(e){} }

/* save one submission: on a clash keep everyone's newest decision for each row */
async function saveDoc(doc){
  S.docs[doc.rep]=doc;
  const merged=await update("rev-"+safe(doc.rep),srv=>{ if(!srv) return doc; const out=clone(srv);
    (doc.rows||[]).forEach((r,i)=>{ const o=out.rows[i]; if(!o) return; const a=r.final, b=o.final; if(r._undo&&!b) {} if(a&&(!b||String(a.at)>=String(b.at))) o.final=a; else if(!a&&b&&r._undoAt&&String(r._undoAt)>String(b.at)) delete o.final; });

/* 100% stacked columns, one per period */
function stackChart(periods,keys,cols,valOf,{h=210,fmtTip}={}){ const W=560,H=h,pl=34,pb=24,pt=8,cw=(W-pl)/periods.length, bw=Math.min(46,cw*0.62);

  periods.forEach((p,i)=>{ const tot=keys.reduce((s,k)=>s+(valOf(p,k)||0),0); if(!tot) return; let y=H-pb; const x=pl+i*cw+(cw-bw)/2;
    const segs=keys.filter(k=>valOf(p,k));
    segs.forEach((k,j)=>{ const v=valOf(p,k), hh=(H-pb-pt)*v/tot; const top=j===segs.length-1; y-=hh; g+='<rect x="'+x+'" y="'+(y+(j?0:0))+'" width="'+bw+'" height="'+Math.max(0,hh-2)+'" rx="'+(top?3:0)+'" fill="'+cols[k]+'"/>'; });
    const tip='<b>'+esc(p.label)+'</b> · '+tot.toLocaleString()+' rows<br>'+keys.filter(k=>valOf(p,k)).map(k=>esc(k)+': '+valOf(p,k).toLocaleString()+' ('+pct(valOf(p,k),tot)+'%)').join("<br>");
    g+='<rect x="'+(pl+i*cw)+'" y="'+pt+'" width="'+cw+'" height="'+(H-pb-pt)+'" fill="transparent" data-tip="'+esc(tip)+'" tabindex="0"/>';
    g+='<text class="ax" x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.label)+'</text>'; });
  return '<div class="legend">'+keys.map(k=>'<span><i style="background:'+cols[k]+'"></i>'+esc(k)+'</span>').join("")+'</div><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Share of rows by decision, by year">'+g+'</svg></div>'; }
/* one or more lines over periods, a crosshair tip per period */
function lineChart(periods,series,{h=190,unit="",max}={}){ const W=560,H=h,pl=40,pb=24,pt=12, n=periods.length, cw=(W-pl-14)/Math.max(1,n-1);

  let g='<line class="base" x1="'+pl+'" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>'; [0.5,1].forEach(f=>{ const v=top*f/1.12; const y=Y(v); g+='<line class="gl" x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+unit+'</text>'; });
  const used=[]; series.forEach(s=>{ const pts=periods.map((p,i)=>[i,s.v(p)]).filter(x=>x[1]!=null); g+='<polyline fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(([i,v])=>X(i)+","+Y(v)).join(" ")+'"/>'+pts.map(([i,v])=>'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="'+s.c+'" stroke="var(--surface)" stroke-width="2"/>').join("");
    const lp=pts[pts.length-1]; if(lp&&series.length<=4){ let ly=Y(lp[1])-10; while(used.some(u=>Math.abs(u-ly)<14)) ly+=26; used.push(ly); g+='<text x="'+(X(lp[0])-8)+'" y="'+ly+'" text-anchor="end" style="font-size:11.5px;font-weight:700;fill:var(--ink)">'+Math.round(lp[1])+unit+'</text>'; } });
  periods.forEach((p,i)=>{ g+='<text class="ax" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.label)+'</text>';
    const tip='<b>'+esc(p.label)+'</b><br>'+series.map(s=>{ const v=s.v(p); return esc(s.name)+': '+(v==null?'—':Math.round(v)+unit)+(s.extra?s.extra(p):''); }).join("<br>");
    g+='<rect x="'+(X(i)-cw/2)+'" y="'+pt+'" width="'+cw+'" height="'+(H-pb-pt)+'" fill="transparent" data-tip="'+esc(tip)+'" tabindex="0"/>'; });
  return (series.length>1?'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.c+'"></i>'+esc(s.name)+'</span>').join("")+'</div>':'')+'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg></div>'; }
/* horizontal bars for a ranked list */
function hbars(items,{c="var(--c1)",unit=""}={}){ const mx=Math.max(1,...items.map(x=>x.v));
  return '<div class="chart"><div style="display:grid;gap:7px">'+items.map(x=>'<div data-tip="'+esc('<b>'+esc(x.k)+'</b><br>'+(x.tip||x.v+unit))+'" tabindex="0" style="display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px"><span>'+esc(x.k)+'</span><span style="height:10px;background:var(--surface-3);border-radius:0 3px 3px 0"><i style="display:block;height:100%;width:'+Math.max(2,x.v/mx*100)+'%;background:'+(x.c||c)+';border-radius:0 3px 3px 0"></i></span><b style="font-size:12.5px;min-width:34px;text-align:right">'+x.v.toLocaleString()+unit+'</b></div>').join("")+'</div></div>'; }

function trendsView(){ const B=S.bt;
  if(!B||!B.years) return '<div class="head"><div><h1>Trends</h1><div class="sub">The history of IM’s decisions loads here once the analysis of the IM library is published.</div></div></div><div class="card"><div class="empty">No trend data yet.</div></div>';
  const Y=B.years.filter(y=>y.rows>0), per=Y.map(y=>({label:String(y.y),y}));
  const keys=["Approved as Submitted","Approved with Modification","Returned","Denied","Withdrawn"], kmap={"Approved as Submitted":"as","Approved with Modification":"mod","Returned":"ret","Denied":"den","Withdrawn":"wd"};
  const last=Y[Y.length-1]||{}, prev=Y[Y.length-2]||{};
  const asP=y=>pct(y.dec.as,y.rows), chg=(a,b)=>a==null||b==null?'':(a>=b?'up ':'down ')+Math.abs(a-b)+' pts from '+prev.y;
  const k=(t,v,s,c)=>'<div class="k" style="--kc:'+c+'"><span>'+t+'</span><b>'+v+'</b><em>'+s+'</em></div>';
  const tot=Y.reduce((s,y)=>s+y.rows,0), subs=Y.reduce((s,y)=>s+y.subs,0);
  return '<div class="head"><div><h1>Trends</h1><div class="sub">What IM has decided since '+esc(Y[0]&&Y[0].y)+', from '+subs.toLocaleString()+' decided submissions and '+tot.toLocaleString()+' Reference Model rows in the IM library'+(B.asOf?', as of '+esc(fmtD(B.asOf)):'')+'. Hover any chart for the numbers.</div></div></div>'+
    '<div class="kp">'+k("Approved as Submitted, "+last.y,asP(last)+"%",chg(asP(last),prev.rows?asP(prev):null)||"of "+last.rows+" rows","var(--good)")+
      k("Rows Reviewed, "+last.y,(last.rows||0).toLocaleString(),(last.subs||0)+" submissions","var(--c1)")+
      k("Days to IM Approval",last.medDays!=null?last.medDays:"—",last.medDays!=null?"median in "+last.y+(prev.medDays!=null?" ("+prev.medDays+" in "+prev.y+")":""):"not enough dates","var(--c4)")+
      k("Resubmitted",pct(last.resub||0,last.wrs||0)+"%","of "+(last.wrs||0)+" work requests in "+last.y,"var(--c2)")+'</div>'+
    '<div class="g2"><div class="card"><h3>What IM Decides<small>share of rows, by year</small></h3>'+stackChart(per,keys,DCOL,(p,kk)=>p.y.dec[kmap[kk]]||0)+
      '<details class="nums"><summary>Show the numbers</summary><div class="tw"><table class="tbl"><thead><tr><th>Year</th><th>Subs</th><th>Rows</th>'+keys.map(k=>'<th>'+esc(k.replace('Approved ',''))+'</th>').join('')+'</tr></thead><tbody>'+Y.map(y=>'<tr><td>'+y.y+'</td><td class="n">'+y.subs+'</td><td class="n">'+y.rows.toLocaleString()+'</td>'+keys.map(k=>'<td class="n">'+(y.dec[kmap[k]]||0).toLocaleString()+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details></div>'+
      '<div class="card"><h3>Approved as Submitted<small>share of rows, by year</small></h3>'+lineChart(per,[{name:"Approved as submitted",c:"var(--good)",v:p=>asP(p.y),extra:p=>' of '+p.y.rows+' rows'}],{unit:"%",max:112})+'<p class="note">The higher this line, the less there is for IM to change. It is also the share of rows the draft can clear without a reviewer once it has earned trust.</p></div></div>'+
    '<div class="g2" style="margin-top:18px"><div class="card"><h3>Rows Reviewed<small>by year</small></h3>'+lineChart(per,[{name:"Rows",c:"var(--c1)",v:p=>p.y.rows,extra:p=>' in '+p.y.subs+' submissions'}])+'</div>'+
      '<div class="card"><h3>Days From First Submission to IM Approval<small>median, by year approved</small></h3>'+lineChart(per,[{name:"Median days",c:"var(--c4)",v:p=>p.y.medDays,extra:p=>p.y.nDays?' ('+p.y.nDays+' work requests)':''}])+'</div></div>'+
    (B.themes&&B.themes.length?'<div class="g2" style="margin-top:18px"><div class="card"><h3>Why IM Changes a Row<small>from IM’s comments, all years</small></h3>'+hbars(B.themes.slice(0,10).map(t=>({k:t.k,v:t.n,tip:t.n+' rows'+(t.recent!=null?'<br>'+t.recent+' in the last two years':'')})))+'</div>'+
      '<div class="card"><h3>By Community of Practice<small>rows and share approved as submitted</small></h3><div class="tw"><table class="tbl"><thead><tr><th>Community</th><th>Subs</th><th>Rows</th><th>As Submitted</th></tr></thead><tbody>'+(B.cop||[]).filter(c=>c.cop!=='Not given').slice(0,12).map(c=>'<tr><td>'+esc(c.cop)+'</td><td class="n">'+c.subs+'</td><td class="n">'+c.rows.toLocaleString()+'</td><td><span class="meter"><i style="width:'+pct(c.as,c.rows)+'%"></i></span>'+pct(c.as,c.rows)+'%</td></tr>').join("")+'</tbody></table></div><p class="note">Forms from before 2023 have no community on them, so this covers 2023 on.</p></div></div>':'')+
    (B.notes&&B.notes.length?'<div class="card" style="margin-top:18px"><h3>How These Were Counted</h3>'+B.notes.map(n=>'<p class="note">'+esc(n)+'</p>').join("")+'</div>':'');
}
function draftView(){ const B=S.bt, D=B&&B.draft, C=B&&B.claude, E=B&&B.edits, ks=kindStats();
  const lv=Object.values(S.learn), la=lv.filter(x=>x.agreed).length;
  const k=(t,v,s,c)=>'<div class="k" style="--kc:'+c+'"><span>'+t+'</span><b>'+v+'</b><em>'+s+'</em></div>';
  const rows=Object.entries(ks).map(([kind,s])=>({kind,n:(s.n||0)+(s.hn||0),a:(s.agree||0)+(s.hagree||0),live:s.live||0})).filter(x=>x.n>=5).sort((a,b)=>b.n-a.n).slice(0,40);
  const label=kind=>{ const [d,ru,tt]=kind.split("|"); return '<b>'+esc(d)+'</b> · '+esc(RULE_NAME[ru]||ru)+' · '+esc(tt||"any row"); };
  const cb=C&&C.both;
  return '<div class="head"><div><h1>How the Draft Is Doing</h1><div class="sub">The draft is right when IM keeps its decision. When a kind of row has matched IM 95% of the time or more over at least 30 rows, it can arrive already approved, so reviewers only see the exceptions. Reviewers can still change any row.</div></div></div>'+
    '<div class="kp">'+k("Agreed Here",lv.length?pct(la,lv.length)+"%":"—",lv.length?la+" of "+lv.length+" rows reviewed in this portal":"fills in as you review","var(--c1)")+
      (cb?k("IM Changes Spotted",pct(cb.caught,cb.changed)+"%",cb.caught+" of "+cb.changed+" rows IM changed, "+esc(C.period),"var(--c2)")+
        k("When the Draft Says Clean",pct(cb.cleanKept,cb.clean)+"%","IM approved as submitted (any row: "+pct(C.base,cb.rows)+"%)","var(--good)")+
        k("Left for a Reviewer",pct(cb.flagged,cb.rows)+"%","of rows flagged for a look","var(--c4)"):"")+'</div>'+
    (B&&B.findings?'<div class="card"><h3>What the Analysis Found<small>'+esc(fmtD(B.asOf))+'</small></h3><ul class="finds">'+B.findings.map(f=>'<li>'+esc(f)+'</li>').join("")+'</ul></div>':'')+
    (C?'<div class="g2"><div class="card"><h3>Spotting the Rows IM Changes<small>'+esc(C.period)+', '+C.software.changed+' rows changed</small></h3>'+hbars([{k:"Software checks alone",v:pct(C.software.caught,C.software.changed),tip:C.software.caught+" of "+C.software.changed+" rows"},{k:"Claude’s read",v:pct(C.claude.caught,C.claude.changed),tip:C.claude.caught+" of "+C.claude.changed+" rows"},{k:"Both together (the draft)",v:pct(cb.caught,cb.changed),tip:cb.caught+" of "+cb.changed+" rows",c:"var(--c3)"}],{unit:"%"})+'<p class="note">The software checks settle the form and the Reference Model; IM’s judgment calls are where Claude’s read and your corrections come in.</p></div>'+
      (E?'<div class="card"><h3>How IM Edits Definitions<small>'+esc(E.period)+', '+E.total+' definitions</small></h3>'+hbars(E.kinds.slice(0,7).map(x=>({k:x.k.charAt(0).toUpperCase()+x.k.slice(1),v:x.n,c:"var(--c1)"})))+(E.simClaudeLight!=null?'<p class="note">IM edits lightly. Told to edit the way IM does, Claude’s suggested wording shares '+E.simClaudeLight+'% of its words with IM’s final (it was '+E.simClaude+'%; the submitted text shares '+E.simSubmitted+'%).</p>':'<p class="note">IM edits lightly.</p>')+'</div>':'')+'</div>':'')+
    (D&&D.byYear&&D.byYear.length?'<div class="g2" style="margin-top:18px"><div class="card"><h3>Software Checks Against IM, Year by Year<small>learning only from earlier years</small></h3>'+lineChart(D.byYear.map(y=>({label:String(y.y),y})),[{name:"Same decision as IM",c:"var(--c3)",v:p=>pct(p.y.agree,p.y.n),extra:p=>' of '+p.y.n+' rows'},{name:"Clean rows IM kept",c:"var(--good)",v:p=>p.y.cleanRows?pct(p.y.cleanKept,p.y.cleanRows):null}],{unit:"%",max:112})+'<p class="note">Both lines fall after 2022 because IM changes more rows than it used to (see Trends), mostly with light wording edits.</p></div>'+
      '<div class="card"><h3>Where the Software Checks Miss<small>what IM decided instead, all years</small></h3>'+hbars((D.misses||[]).slice(0,6).map(m=>({k:m.k,v:m.n,c:"var(--c2)"})))+'</div></div>':'')+
    '<div class="card" style="margin-top:18px"><h3>Kinds of Rows<small>history and reviews here combined</small></h3>'+(rows.length?'<div class="tw"><table class="tbl"><thead><tr><th>Draft Decision · Reason · Row</th><th>Rows</th><th>IM Agreed</th><th>Arrives Approved</th></tr></thead><tbody>'+rows.map(x=>{ const p=pct(x.a,x.n), ok=p>=95&&x.n>=30, on=!!(S.cfg.imauto||{})[x.kind];
      return '<tr><td>'+label(x.kind)+'</td><td class="n">'+x.n.toLocaleString()+'</td><td><span class="meter"><i style="width:'+p+'%"></i></span>'+p+'%</td><td>'+(isAdmin()&&(ok||on)?'<label class="tog"><input type="checkbox" data-auto="'+esc(x.kind)+'"'+(on?" checked":"")+'> '+(on?"On":"Turn on")+'</label>':on?'On':ok?'<span class="muted">Ready (staff turn it on)</span>':'<span class="muted">Not yet</span>')+'</td></tr>'; }).join("")+'</tbody></table></div>':'<div class="empty">This fills in as IM reviews drafts.</div>')+'</div>';
}

function helpView(){ const step=(n,t,d)=>'<li><b>'+t+'</b> '+d+'</li>';
  return '<div class="head"><div><h1>Help</h1><div class="sub">How IM Review works, and what each part of the page means.</div></div></div><div class="help">'+
    '<div class="card"><h3>What This Is</h3><p>When a facilitator finishes the IM Pre-Review in the MMS and sends the submission to IM, it lands here. Every row of the IM Submission Form arrives with a <b>draft decision</b>: Approved as Submitted, Approved with Modification, Returned or Denied, with the comment and suggested wording IM would likely give. The draft comes from software checks (the form, the MISMO class word templates, the Reference Model) and Claude’s read of each row.</p><p>You stay the decision-maker. Agree with the draft, or change it. Every change you make teaches the next draft, and kinds of rows the draft gets right almost every time can later arrive already approved, so you only see the exceptions.</p></div>'+
    '<div class="g2"><div class="card"><h3>Reviewing a Submission</h3><ol>'+step(1,'Open it','from Waiting for IM. The oldest is first.')+step(2,'Needs a Look','shows the rows where the draft suggests a change or isn’t sure. Read each one, then click Agree or Change or Add Something.')+step(3,'Clean rows','are rows with no issues found. Skim them if you like, then use Agree With All Clean Rows.')+step(4,'Finish IM Review','when every row is decided. The facilitator gets an email, and the decisions go onto the work request in the MMS.')+'</ol></div>'+
    '<div class="card"><h3>Changing a Row</h3><ul><li>Pick the decision, edit the comment or use one of the quick comments, and add suggested wording if you have it.</li><li><b>What the draft missed or got wrong</b> is optional, but it is the most useful thing you can write: it is how the draft learns.</li><li>Undo clears a row’s decision. Nothing is final until you click Finish IM Review.</li><li>Download for Excel gives the decided form in the usual Reference Model Changes layout.</li></ul></div></div>'+
    '<div class="g2" style="margin-top:18px"><div class="card"><h3>Trends and the Draft</h3><ul><li><b>Trends</b> shows what IM has decided each year since 2020, read from the submission forms in the IM library: decisions, rows, days to approval, resubmissions and the reasons IM changes rows.</li><li><b>How the Draft Is Doing</b> shows how often IM agreed with each kind of draft, in history and here. MISMO staff can let a kind of row arrive already approved once IM has agreed with it 95% of the time over 30 or more rows.</li></ul></div>'+
    '<div class="card"><h3>Who Can Do What</h3><ul><li>IM reviewers make the decisions. They are set in the MMS under Settings › People and Roles › IM Reviewer.</li><li>Facilitators and MISMO staff can open every submission and follow along, but not decide.</li><li>Access to this page is granted in People &amp; Access.</li><li>Shortcuts: <b>\\</b> narrows the menu; <b>Ctrl+K</b> (or ⌘K) searches.</li></ul></div></div></div>'; }

/* ---------- wiring ---------- */
let tt; function toast(m){ let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); } t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3200); }
function keep(fn){ const y=window.scrollY; return async(...a)=>{ await fn(...a); window.scrollTo(0,y); }; }
function wire(){ const m=$("#main"); $$(".chart",m).forEach(tipOn);
  $$("[data-auto]",m).forEach(c=>c.onchange=async()=>{ const kd=c.dataset.auto; try{ const o=await update("config",cur=>{ const x=cur||{}; x.imauto=Object.assign({},x.imauto||{},{[kd]:c.checked}); return x; }); S.cfg=o; toast(c.checked?"Those rows will arrive already approved":"Those rows will need a reviewer again"); }catch(e){ toast("Couldn’t save that. Try again."); } render(); });
  const r=route(); if(r.view!=="review") return; const doc=S.docs[r.rep]; if(!doc) return;
  const save=keep(async()=>{ try{ await saveDoc(doc); }catch(e){ toast("Couldn’t save. Check your connection and try again."); } render(); });
  $$("[data-f]",m).forEach(b=>b.onclick=()=>{ S.filter=b.dataset.f; S.edit=null; render(); });
  $$("[data-ok]",m).forEach(b=>b.onclick=()=>{ const x=doc.rows[+b.dataset.ok]; x.final={dec:x.draft.dec,com:x.draft.com,sug:x.draft.sug,agreed:true,by:S.me.name||S.me.email,at:new Date().toISOString()}; render(); save(); });
  $$("[data-undo]",m).forEach(b=>b.onclick=()=>{ const x=doc.rows[+b.dataset.undo]; delete x.final; x._undoAt=new Date().toISOString(); render(); save(); });
  $$("[data-chg]",m).forEach(b=>b.onclick=keep(async()=>{ S.edit=+b.dataset.chg; render(); }));
  $$("[data-cancel]",m).forEach(b=>b.onclick=keep(async()=>{ S.edit=null; render(); }));
  $$("[data-q]",m).forEach(b=>b.onclick=()=>{ const ta=$("textarea[name=com]",b.closest(".edit")); ta.value=(ta.value.trim()?ta.value.trim()+" ":"")+b.dataset.q; ta.focus(); });
  $$("[data-save]",m).forEach(b=>b.onclick=()=>{ const box=b.closest(".edit"), x=doc.rows[+b.dataset.save], v=n=>($("[name="+n+"]",box)||{}).value||"";
    const dec=v("dec"), com=v("com").trim(), sug=v("sug").trim(), missed=v("miss").trim();
    const agreed=dec===x.draft.dec&&com===String(x.draft.com||"").trim()&&sug===String(x.draft.sug||"").trim()&&!missed;
    x.final={dec,com,sug,missed,agreed,by:S.me.name||S.me.email,at:new Date().toISOString()}; S.edit=null; render(); save(); });
  $$("[data-all]",m).forEach(b=>b.onclick=()=>{ const F=b.dataset.all; let n=0; const now=new Date().toISOString();
    doc.rows.forEach(x=>{ if(x.final) return; const lk=isLook(x); if(F==="look"&&!lk) return; if(F==="clean"&&lk) return; x.final={dec:x.draft.dec,com:x.draft.com,sug:x.draft.sug,agreed:true,by:S.me.name||S.me.email,at:now}; n++; });
    toast("Agreed with "+n+" row"+(n===1?"":"s")); render(); save(); });
  $$("[data-finish]",m).forEach(b=>b.onclick=async()=>{ if(!confirm("Finish the IM review of "+doc.wr+"? The facilitator gets the decisions.")) return; b.disabled=true; try{ await finish(doc); }catch(e){ toast("Couldn’t finish: "+e.message); b.disabled=false; return; } render(); });
  $$("[data-xl]",m).forEach(b=>b.onclick=()=>exportXl(doc));
}
document.addEventListener("click",e=>{ const b=e.target.closest(".hq nav button[data-hq]"); if(!b) return; const v=b.dataset.hq; location.hash=v==="waiting"?"#/":"#/"+v; });
window.addEventListener("hashchange",()=>{ S.edit=null; const r=route(); if(r.view==="review") S.filter="look"; window.scrollTo(0,0); render(); });
setInterval(async()=>{ if(document.hidden||route().view==="review") return; await refreshQueue(); render(); },60000);

/* ---------- start: sign in, then the gate decides who gets in ---------- */
function start(){ const rs=RS(); if(!rs){ setTimeout(start,100); return; }
  rs.requireAccess(PROJECT,{toolName:"IM Review",eyebrow:"Governance · Information Management"}).then(load).catch(e=>{ console.error("im-review",e); }); }
window.__imr={S,load,render};
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
})();

</script>
<script>
(function(){
  "use strict";
  const KEY='hq.rail.off';
  const rail=()=>document.getElementById('rail');

  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }

  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{
        if(window.matchMedia('(max-width:900px)').matches) set(true);
      });
    });
    wireFind();
  }

  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q');
        if(q){ q.focus(); q.select(); } }, 230);
    }
  });

  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }

  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name);
      return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go)=>{
      if(out.length<60) out.push({group,name,where,go,s:score(name)});
    };

    try{ (window.__imrSearch?window.__imrSearch():[]).forEach(x=>{ if(norm(x.name+' '+(x.where||'')).indexOf(t)<0) return; push(x.group,x.name,x.where,x.go); }); }catch(e){}

    const best={};
    out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['Waiting for IM','Rows in This Submission','Decided','Pages'];
    out.sort((a,b)=>
      (best[b.group]-best[a.group])
      || (ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      || (b.s-a.s)
      || String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function go(tab){
    const b=document.querySelector('.hq nav button[data-hq="'+tab+'"]');
    if(b && !b.hasAttribute('aria-current')) b.click();
  }

  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=''; rows=[]; picked=-1;
    if(!list.length){
      const n=document.createElement('div'); n.className='rh-none';
      n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return;
    }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group;
        const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); });
      rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }

  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx');
    if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value;
      if(x) x.hidden = !v;
      if(norm(v).length<2){ close(); return; }
      draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{
      if(!e.target.closest('.railfind')) close();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle,
    mini:()=>document.body.classList.contains('railmini') };
})();

(function theme(){
  var btn = document.getElementById("theme-btn");
  if(!btn) return;
  function cur(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint(){
    const dark = cur() === "dark";
    const lab = document.getElementById("theme-lab");
    if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode";
    else btn.textContent = dark ? "Light Mode" : "Dark Mode";
    btn.title = "Switch to " + (dark ? "light" : "dark") + " mode";
  }
  btn.addEventListener("click", function(){
    document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark");
    paint();
    try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  });
  try{
    var saved = localStorage.getItem("mismo.portal.theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  paint();
})();

</script>
