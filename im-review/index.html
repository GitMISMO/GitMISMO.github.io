<!doctype html>
<html lang="en" data-rs-gate>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IM Review · MISMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root{
  --navy:#0d314c;--sky:#74bfeb;--navy-deep:#06202f;--navy-mid:#14486e;--sky-soft:#a9d8f3;--sky-wash:#e4f2fb;
  --ground:#f1f6fa;--surface:#ffffff;--surface-2:#f6fafd;--surface-3:#e9f1f8;--sunk:#f6fafd;
  --border:#d5e2ed;--border-strong:#adc4d6;--rule:#e5eef5;--line:#e5eef5;
  --ink:#0d314c;--ink-2:#456179;--ink-3:#5a7489;
  --good:#0f7b5c;--bad:#b3372c;--warn:#a2701a;
  --good-bg:#e3f4ed;--bad-bg:#fbe9e7;--warn-bg:#fbf1dc;--info-bg:#e4f2fb;--hold-bg:#efe9f7;--hold:#6b4fa0;
  --accent:#2477b8;--accent-soft:#e4f2fb;
  --c1:#2477b8;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;
  --display:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ui:var(--display);--mono:var(--display);
  --hq-h:64px;--rail-w:240px;--rail-mini:62px;
  --shadow:0 1px 2px rgba(13,49,76,.06),0 4px 14px rgba(13,49,76,.06);
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#0a2130;
  --border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;
  --ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;
  --good:#4fc79b;--bad:#f08579;--warn:#e0a83c;
  --good-bg:#0f3a30;--bad-bg:#432423;--warn-bg:#3d3017;--info-bg:#123a55;--hold-bg:#2c2545;--hold:#b9a3e8;
  --accent:#3987e5;--accent-soft:#173c52;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#0a2130;
  --border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;
  --ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;
  --good:#4fc79b;--bad:#f08579;--warn:#e0a83c;
  --good-bg:#0f3a30;--bad-bg:#432423;--warn-bg:#3d3017;--info-bg:#123a55;--hold-bg:#2c2545;--hold:#b9a3e8;
  --accent:#3987e5;--accent-soft:#173c52;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{letter-spacing:-.012em;margin:0;color:var(--ink)}
a{color:var(--accent)}
button{font-family:inherit}
[hidden]{display:none!important}
:root{--hq-h:64px;--rail-w:240px;--rail-mini:62px}
/* the masthead, across the top, as every MISMO page wears it */
.hqtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:97;height:var(--hq-h);
  background:var(--navy);color:#fff;display:flex;align-items:center;gap:0;
  padding:0 22px;box-shadow:0 1px 0 rgba(80,164,219,.28);
  margin-left:calc(0px - var(--rail-w));width:calc(100% + var(--rail-w));
  transition:margin-left .2s cubic-bezier(.4,0,.2,1), width .2s cubic-bezier(.4,0,.2,1)}
body.railmini .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
@media (prefers-reduced-motion:reduce){ .hqtop{transition:none} }
.hqtop .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;
  margin-inline:20px;border-radius:1px;background:var(--sky)}
.hqtop .hqname{font-family:var(--display);font-size:15.5px;font-weight:700;
  letter-spacing:-.005em;color:var(--sky);white-space:nowrap}
.hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px}
.hqtop .eyebrow-m{font-family:var(--display);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
@media(max-width:700px){.hqtop .eyebrow-m{display:none}}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;
  align-items:center;line-height:0;flex:0 0 auto;position:relative}
.logoplate .wordmark{height:24px;width:auto;display:block}

/* the sections, down the left, beneath it */
.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;
  background:var(--navy);color:#fff;display:flex;flex-direction:column;
  gap:0;padding:0;overflow:hidden auto;overscroll-behavior:contain;
  box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14);
  transition:width .2s cubic-bezier(.4,0,.2,1)}
body{padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){ .hq.rail,body{transition:none} }

/* ── Narrowed: the icons and nothing else ── */
body.railmini{padding-left:var(--rail-mini)}
body.railmini .hq.rail{width:var(--rail-mini)}
body.railmini .rail-top{justify-content:center;padding:10px 0 9px}
body.railmini .rail-lbl{display:none}
body.railmini .railhide{margin:0}
body.railmini .railhide svg{transform:scaleX(-1)}
body.railmini .railfind{padding:9px 0 2px;display:flex;justify-content:center}
body.railmini .railfind .fi,
body.railmini .railfind input,
body.railmini .railq-x,
body.railmini .railhits{display:none}
body.railmini .railfind-b{display:flex}
body.railmini .hq nav{padding:6px 0 4px;align-items:center;gap:4px}
body.railmini .hq nav button{width:42px;padding:10px 0;justify-content:center;
  border-radius:9px;box-shadow:none}
body.railmini .hq nav button span{display:none}
body.railmini .hq nav button svg{width:19px;height:19px}
body.railmini .hq nav button[aria-current]{background:var(--sky);color:var(--navy-deep,#06202f)}
body.railmini .hq nav button[aria-current] svg{stroke:var(--navy-deep,#06202f);opacity:1}
body.railmini .railsum{display:none}
body.railmini .hq .mast-right{gap:3px;padding:8px 0 11px;align-items:center}
body.railmini .hq .mast-right .theme-btn{width:42px;padding:9px 0;font-size:0;
  justify-content:center;border-radius:9px}
body.railmini .hq .mast-right .theme-btn .ti{width:19px;height:19px}
body.railmini .hq .mast-right .theme-btn span{display:none}
body.railmini .hq .mast-right #theme-btn{margin-top:4px;padding-top:10px;border-radius:9px}

/* the magnifier that stands in for the search box when it is narrow */
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);
  border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);
  align-items:center;justify-content:center;padding:0}
.railfind-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.railfind-b:hover{background:rgba(255,255,255,.18);color:#fff}

.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;
  border-bottom:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.rail-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);
  border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;padding:0}
.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}

/* search */
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}
.railfind .fi{position:absolute;left:21px;top:20px;width:14px;height:14px;
  fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 26px 6px 30px}
.railfind input::placeholder{color:rgba(255,255,255,.5)}
.railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
.railfind input::-webkit-search-cancel-button{display:none}
.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;
  background:transparent;color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0}
.railq-x:hover{background:rgba(255,255,255,.16);color:#fff}
.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong,#adc4d6);
  border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;
  max-height:min(52vh,420px)}
.railhits .rh-g{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;
  border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);font-family:var(--ui)}
.railhits .rh:last-child{border-bottom:0}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.railhits .rh i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.03em;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}

.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);
  padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap}
.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid,#14486e);
  box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.hq nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}

/* the foot: theme toggle (and anything else, like Undo/Backup, above it) */
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;
  padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);
  padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .ti-moon{display:none}
  :root:not([data-theme="light"]) .theme-btn .ti-sun{display:block} }
.theme-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:disabled{opacity:.4;cursor:not-allowed}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right #theme-btn{margin-top:5px;padding-top:11px;
  border-top:1px solid rgba(80,164,219,.18);border-radius:0 0 6px 6px}

/* on a narrow screen the rail covers the page rather than squeezing it */
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block}
}

/* sign-in, access and connection notices (resources.mismo.org) */
/* account button: squared corners, same as Team HQ */
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}
/* ── IM Review portal ── */
body{min-height:100vh}
.santa{position:absolute;display:none;pointer-events:none;left:-9px;top:-12px;width:31px;height:31px}
html[data-season="december"] .santa{display:block}
body.railmini .hq nav button .nb{display:none}
.help h3{font-size:15px;margin:0 0 8px}
.help ol,.help ul{margin:0;padding-left:20px;display:grid;gap:7px;font-size:14px;line-height:1.5}
.help p{font-size:14px;line-height:1.55;margin:0 0 8px;max-width:820px}
.help .g2 .card{margin-bottom:0}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
h1{font-size:25px;font-weight:700;margin:0 0 4px}
.sub{color:var(--ink-2);font-size:14px;max-width:760px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
.card h3{font-size:15px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.card h3 small{font-size:12px;font-weight:500;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13.5px;padding:18px 4px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.3;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
:root[data-theme="dark"] .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}

/* hero */
.hero{background:linear-gradient(135deg,#0d314c 0%,#14486e 100%);color:#fff;border-radius:10px;padding:22px 26px;margin-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:center}
.hero-go{align-self:flex-start;margin-top:14px;background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
.hero-go:hover{background:#8fd0f3}
.hero .date{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:700}
.hero h2{color:#fff;font-size:26px;margin:6px 0}
.hero p{margin:0;color:rgba(255,255,255,.85);font-size:14.5px}
.hero p b{color:var(--sky)}
.hero-l{display:flex;flex-direction:column}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:11px 13px}
.hs span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7)}
.hs b{display:block;font-size:26px;line-height:1.15}
.hs em{display:block;font-style:normal;font-size:12px;color:rgba(255,255,255,.6)}
@media(max-width:900px){.hero{grid-template-columns:1fr}}

/* submission rows */
.subs{display:grid;gap:10px}
.sc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;padding:13px 16px;color:var(--ink);text-decoration:none}
.sc:hover{border-color:var(--border-strong);background:var(--surface-2)}
.sc.done{border-left-color:var(--good)}
.sc-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sc .wr{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.sc b{font-size:15px;line-height:1.3}
.sc-m{display:flex;flex-direction:column;gap:7px;min-width:0}
.sc .m{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:10px;padding:2px 9px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.look{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.sc .bar{height:6px;border-radius:3px;display:flex;overflow:hidden;gap:2px}
.sc .bar i{display:block;height:100%}
.sc .f{font-size:12px;color:var(--ink-3)}
.sc-go{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
@media(max-width:760px){.sc{grid-template-columns:1fr;gap:8px}.sc-go{justify-self:start}}

/* the desk */
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dhead .t{flex:1;min-width:260px}
.back{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.prog{min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.prog b{font-size:20px}
.prog span{font-size:12.5px;color:var(--ink-3);margin-left:6px}
.prog .pb{height:7px;border-radius:4px;background:var(--surface-3);margin-top:7px;overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--good);border-radius:4px}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.step .sk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.step b{font-size:22px;line-height:1.1}
.step p{margin:0;font-size:12.5px;color:var(--ink-2)}
.step .btn{align-self:flex-start;margin-top:4px}
.step.cur{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky-wash)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button:is([aria-pressed="true"],[aria-selected="true"]){background:var(--navy);color:#fff}
.seg button b{font-weight:700;opacity:.8;margin-left:4px}
.dtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dtools .sp{flex:1}
.rows{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border-strong);border-radius:8px;padding:12px 14px}
.row.look{border-left-color:var(--warn)}

<script>
/* =====================================================================
   IM Review: the portal for MISMO's Information Management reviewers.
   Each IM submission arrives from the MMS with a draft decision for every
   row. Reviewers agree, or correct what the draft got wrong; each correction
   teaches the next draft. Trends and the draft's track record come from the
   IM library (2020 on) and from every review finished here.
   Data (GitMISMO/im-review-data, through the relay):
     queue            {items:{rep:{...}}}   what's waiting and what's decided
     rev-<rep>        one submission: rows, the draft, IM's decisions
     learn-<year>     {rows:{id:{kind,rule,draft,final,agreed,...}}}
     config           {imauto:{kind:true}, reviewers:[emails]}
     backtest         trends and the draft's track record from history
   ===================================================================== */
(function(){
"use strict";
const RELAY="https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws", PROJECT="im-review";
const RS=()=>window.ResourcesSession||null, tok=()=>{ try{ return RS().token(); }catch(e){ return ""; } };
const U=n=>RELAY+"/"+PROJECT+"/data/"+encodeURIComponent(n);
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=s=>{ const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m?MON[+m[2]-1]+" "+(+m[3])+", "+m[1]:""; };
const fmtS=s=>{ const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m?MON[+m[2]-1]+" "+(+m[3]):""; };
const first=n=>String(n||"").trim().split(/\s+/)[0]||"";
/* the relay takes lowercase letters, digits and hyphens in a file name */
const safe=s=>String(s).toLowerCase().replace(/[^a-z0-9-]/g,"-").slice(0,80);
/* join facts so a line only breaks between them, never inside one */
const nwj=L=>L.filter(Boolean).map(x=>'<span class="nw">'+esc(x)+'</span>').join(' · ');
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- the relay ---------- */
async function get(n){ const r=await fetch(U(n),{headers:{Authorization:"Bearer "+tok()},cache:"no-store"}); if(r.status===404) return {data:null,sha:null}; if(!r.ok) throw new Error(n+" "+r.status); const j=await r.json(); return {data:(j&&j.data)||null,sha:(j&&j.sha)||null}; }
async function put(n,content,sha){ return fetch(U(n),{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok()},body:JSON.stringify({content,sha:sha||undefined})}); }
/* read, change, write; on a clash (someone saved first) read again and redo the change */
async function update(n,fn){ for(let i=0;i<5;i++){ const g=await get(n); const next=fn(g.data?clone(g.data):null); const r=await put(n,next,g.sha); if(r.ok) return next; if(r.status!==409&&r.status!==422) throw new Error("save "+r.status); await new Promise(s=>setTimeout(s,300+i*400)); } throw new Error("busy"); }

/* ---------- decisions ---------- */
const DEC=["Approved as Submitted","Approved with Modification","Returned","Denied","Withdrawn","Deferred"];
const RANK={"Approved as Submitted":0,"Approved with Modification":1,"Deferred":2,"Returned":3,"Withdrawn":3,"Denied":4};
const DCOL={"Approved as Submitted":"var(--good)","Approved with Modification":"var(--c1)","Returned":"var(--warn)","Denied":"var(--bad)","Withdrawn":"var(--ink-3)","Deferred":"var(--hold)"};

/* how often IM agreed with each kind of draft: live reviews first, history behind them */
function kindStats(){ const st={}; Object.values(S.learn).forEach(x=>{ if(!x||!x.kind) return; const s=st[x.kind]=st[x.kind]||{n:0,agree:0,live:0}; s.n++; s.live++; if(x.agreed) s.agree++; });
  ((S.bt&&S.bt.draft&&S.bt.draft.byKind)||[]).forEach(k=>{ const s=st[k.kind]=st[k.kind]||{n:0,agree:0,live:0}; s.hn=k.n; s.hagree=k.agree; });
  return st; }
function confidence(r){ const s=kindStats()[kindOf(r)]; if(!s) return ""; const n=(s.n||0)+(s.hn||0), a=(s.agree||0)+(s.hagree||0); if(n<5) return ""; return "IM agreed with this kind of draft "+pct(a,n)+"% of "+n+" times"; }

/* ---------- how long a review should take (an estimate; tuned later from the real times recorded on each decision) ---------- */
const DOC_MIN={doc:15,pdf:12,xls:10,zip:10,file:5,link:5};
function docsToRead(q){ const L=(q.docs||[]).slice(); const pick=L.filter(d=>/redline|draft|final|im submission/i.test(d.tag||"")||/redline|_v[DF]\b|draft|final/i.test(d.n||"")); const use=(pick.length?pick:L.sort((a,b)=>String(b.d||"").localeCompare(String(a.d||""))).slice(0,3)); return use.concat(q.form&&q.form.u?[{n:q.form.n||"form",k:"xls",form:1}]:[]); }
function estIM(q){ const n=q.rows||0, look=Math.min(n,q.look||0);
  if(n){ const m=Math.max(5,Math.round(look*1.2+(n-look)*0.05)); return {min:m,tip:"An estimate: about 1.2 min for each row that needs a look ("+look+") and a few seconds for each clean row ("+(n-look)+")."}; }
  const D=docsToRead(q); const m=Math.max(10,Math.min(120,D.reduce((s,d)=>s+(d.form?5:(DOC_MIN[d.k||docKind(d.n)]||5)),0)));
  return {min:m,docs:D.length,tip:"An estimate from the "+D.length+" document"+(D.length===1?"":"s")+" to read: about 15 min for a Word document, 12 for a PDF, 10 for a spreadsheet, 5 for the form."}; }
const fmtMin=m=>m>=90?"about "+(Math.round(m/30)/2)+" hours":"about "+m+" min";

async function load(role){
  S.role=role||""; const c=(RS()&&RS().current())||{}; S.me={name:c.name||"",email:c.email||""};
  const yr=new Date().getFullYear();
  const [q,cfg,bt,l1,l0,up]=await Promise.all(["queue","config","backtest","learn-"+yr,"learn-"+(yr-1),"upcoming"].map(n=>get(n).catch(()=>({data:null}))));
  S.up=(up&&up.data&&up.data.items)||[]; S.upAt=(up&&up.data&&up.data.asOf)||"";
  S.queue=(q.data&&q.data.items)||{}; S.cfg=Object.assign({imauto:{}},cfg.data||{}); S.bt=bt.data||null;
  S.learn=Object.assign({},(l0.data&&l0.data.rows)||{},(l1.data&&l1.data.rows)||{});

}
async function openDoc(rep){ if(S.docs[rep]) return S.docs[rep]; const g=await get("rev-"+safe(rep)); if(g.data) S.docs[rep]=g.data; return S.docs[rep]||null; }
async function refreshQueue(){ try{ const q=await get("queue"); S.queue=(q.data&&q.data.items)||{}; }catch(e){} }

/* someone else finished this review while this page had an older copy */
function staleErr(srv){ const e=new Error((srv.decidedBy||"Someone")+" finished this review"+(srv.decidedAt?" on "+fmtDE(srv.decidedAt)+" at "+fmtT(srv.decidedAt):"")+". Your change wasn’t saved; the page now shows the finished review."); e.stale=true; e.srv=srv; return e; }
/* one row, two copies: the newest wins, except that an "agree" never replaces a change someone else made,
   and an undo only removes the decision that was undone (not one someone else made since) */
function mergeRows(out,doc){ (doc.rows||[]).forEach((r,i)=>{ const o=(out.rows||[])[i]; if(!o) return; const a=r.final, b=o.final;
    if(a&&(!b||(String(a.at)>=String(b.at)&&!(a.agreed&&String(a.by||"")!==String(b.by||""))))) o.final=a;
    else if(!a&&b&&r._undoAt&&(r._undoOf?String(b.at)<=String(r._undoOf):String(r._undoAt)>String(b.at))) delete o.final; });
  if(doc.final) out.final=doc.final; if(doc.call&&(doc.call.picked||!(out.call&&out.call.picked))) out.call=doc.call; return out; }
/* save one submission: on a clash keep everyone's newest decision for each row */
async function saveDoc(doc){
  if(!doc._finishing) S.docs[doc.rep]=doc; const pend=doc.hist||doc.status==="decided"&&!doc._finishing?0:(tmPend[doc.rep]||0);
  let merged; S.saving=(S.saving||0)+1;
  try{ merged=await update("rev-"+safe(doc.rep),srv=>{ if(!srv){ const x=clone(doc); delete x._finishing; return x; }
    if(srv.status==="decided"&&!srv.hist&&(doc.status!=="decided"||doc._finishing)) throw staleErr(srv);
    const out=mergeRows(clone(srv),doc);
    if(doc.status==="decided"){ out.status="decided"; out.decidedBy=doc.decidedBy; out.decidedAt=doc.decidedAt; }
    out.timing=mergeTiming(out.timing,doc,pend); return out; }); }
  catch(e){ if(e.stale){ S.docs[doc.rep]=e.srv; refreshQueue(); } throw e; }
  finally{ S.saving--; }
  tmPend[doc.rep]=Math.max(0,(tmPend[doc.rep]||0)-pend);
  (merged.rows||[]).forEach(r=>{ delete r._undoAt; delete r._undoOf; }); delete merged._finishing; S.docs[doc.rep]=merged; queueProgress(merged); return merged;
}
/* read the newest copy, keeping this page's own decisions that haven't saved yet */
async function pullDoc(rep){ const g=await get("rev-"+safe(rep)); if(!g.data) return S.docs[rep]||null; const loc=S.docs[rep];
  const out=loc&&!loc.hist&&g.data.status!=="decided"?mergeRows(clone(g.data),loc):g.data; S.docs[rep]=out; return out; }
const rowSig=d=>JSON.stringify([d.status,(d.rows||[]).map(r=>r.final?[r.final.dec,r.final.at,r.final.by]:0),d.final||0]);
/* the real time a review takes, so the estimate can be tuned: when it was first opened, and
   the minutes someone was active on it (counted in 15-second steps while the page is in front
   and someone touched it in the last two minutes) */
const tmPend={}, tmOpen={}; let lastAct=Date.now();
["click","keydown","scroll","mousemove","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
setInterval(()=>{ const r=route(); if(r.view!=="review"||document.hidden||Date.now()-lastAct>120000) return; const d=S.docs[r.rep]; if(!d||d.hist||d.status==="decided"||!canReview()) return; tmPend[r.rep]=(tmPend[r.rep]||0)+15; },15000);
function mergeTiming(t,doc,pend){ t=Object.assign({},t||{}); const me=S.me.name||S.me.email||"someone"; const R=doc.rows||[];
  if(!t.est) t.est=estIM(Object.assign({},S.queue[doc.rep]||{},{rows:R.length,look:R.filter(isLook).length})).min;
  const o=tmOpen[doc.rep]; if(o&&(!t.opened||o<t.opened)) t.opened=o;
  if(pend){ t.activeSec=(t.activeSec||0)+pend; t.by=Object.assign({},t.by||{}); t.by[me]=(t.by[me]||0)+pend; }
  if(doc.status==="decided"&&doc.decidedAt&&!t.finished){ t.finished=doc.decidedAt; if(t.opened) t.wallMin=Math.round((new Date(t.finished)-new Date(t.opened))/6e4); }
  t.activeMin=Math.round((t.activeSec||0)/60); return t; }
/* the queue shows how far each review has got (written at most every few seconds) */
const progT={}; function queueProgress(doc){ if(doc.hist||doc.status==="decided") return; clearTimeout(progT[doc.rep]); progT[doc.rep]=setTimeout(async()=>{ const done=(doc.rows||[]).filter(r=>r.final).length; try{ const o=await update("queue",cur=>{ const x=cur||{items:{}}; x.items=x.items||{}; if(x.items[doc.rep]) Object.assign(x.items[doc.rep],{done,lastAt:new Date().toISOString(),lastBy:S.me.name||""}); return x; }); S.queue=o.items||S.queue; }catch(e){} },4000); }

S.repair={};
function repairHome(d){ if(!notHome(d)||!canEdit()||S.repair[d.rep]) return; S.repair[d.rep]=1;

    '<span class="sc-m"><span class="m">'+(done?Object.entries(cnt).filter(([d,v])=>v>0).sort((a,b)=>(RANK[a[0]]||0)-(RANK[b[0]]||0)).map(([d,v])=>'<span class="pill">'+v+' '+esc(d.replace(/^Approved /,"").toLowerCase())+'</span>').join("")+(q.agree!=null?'<span class="pill ok">'+q.agree+'% agreed with the draft</span>':'')+(q.resub?'<span class="pill">Resubmission</span>':''):'<span class="pill look">'+look+' need'+(look===1?'s':'')+' a look</span><span class="pill ok">'+(n-look)+' clean</span>'+(q.resub?'<span class="pill">Resubmission</span>':''))+'</span>'+bar+'</span>'+
    '<span class="sc-go">'+(done?'Open':'Start Review')+' ›</span></a>'; }
const ago=iso=>{ if(!iso) return ""; const d=Math.floor((Date.now()-new Date(iso))/864e5); return d<=0?"today":d===1?"1 day":d+" days"; };
const YR=String(new Date().getFullYear());
/* a ring split into parts, Summit HQ style */
function ring(parts,center,sub){ const tot=parts.reduce((s,p)=>s+p.v,0), R=56, C=2*Math.PI*R; let off=0;
  const segs=tot?parts.filter(p=>p.v).map(p=>{ const len=p.v/tot*C, gap=parts.filter(x=>x.v).length>1?2.5:0; const el='<circle r="'+R+'" cx="64" cy="64" fill="none" stroke="'+p.c+'" stroke-width="9" stroke-linecap="butt" stroke-dasharray="'+Math.max(0,len-gap)+' '+C+'" stroke-dashoffset="'+(-off)+'" class="dn-seg"><title>'+esc(p.v.toLocaleString()+' '+p.k)+'</title></circle>'; off+=len; return el; }).join(""):'';
  return '<svg class="donut" viewBox="0 0 128 128" role="img" aria-label="'+esc(center+' '+sub)+'"><circle r="'+R+'" cx="64" cy="64" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>'+segs+'</svg><div class="dn-c"><b data-count="'+(+String(center).replace(/\D/g,'')||0)+'">'+esc(center)+'</b><span>'+esc(sub)+'</span></div>'; }
function waitCard(q,i){ const n=q.rows||0, look=q.look||0, done=q.done||0, age=Math.floor((Date.now()-new Date(q.sentAt||q.at||Date.now()))/864e5), heat=age>=14?"hot":age>=7?"warm":"";

    '<span class="wc-prog"><i style="--w:'+pct(done,n)+'%"></i></span><span class="wc-f">'+(done?done+' of '+n+' decided'+(q.lastBy?' · '+esc(first(q.lastBy))+' '+esc(ago(q.lastAt))+' ago':''):'Not started')+(q.fac&&q.fac.name?' · Facilitator '+esc(q.fac.name):'')+'<span class="wc-go">'+(done?'Resume':'Start')+' ›</span></span></a>'; }
const daysTo=d=>Math.round((new Date(d+"T12:00:00")-new Date(todayS()+"T12:00:00"))/864e5);
function upCard(u,i){ const dd=daysTo(u.targetIM); return '<div class="up rise" style="--i:'+i+'"><span class="up-d'+(dd<0?' late':dd<=14?' soon':'')+'"><b>'+Math.abs(dd)+'</b><em>'+(dd<0?'days late':dd===0?'today':dd===1?'day':'days')+'</em></span><span class="up-m"><span class="wr">'+esc(u.wr)+(u.wg?' · '+esc(u.wg):'')+'</span><b title="'+esc(u.name)+'">'+esc(u.name)+'</b><em>'+esc((u.stage||'')+(u.fac?' · '+u.fac:''))+' · target '+esc(fmtS(u.targetIM))+'</em></span></div>'; }
/* the road to IM: what IM decided lately, what is waiting, and what is due, on one line (Summit HQ's road) */
function roadHtml(){ const td=new Date(); const lo=new Date(td.getTime()-150*864e5), hi=new Date(td.getTime()+62*864e5); const span=hi-lo, X=d=>Math.max(0,Math.min(100,(new Date(d+(String(d).length===10?"T12:00:00":""))-lo)/span*100));
  const L=Object.values(S.queue), dec=L.filter(q=>q.status==="decided"&&q.decidedAt&&new Date(q.decidedAt)>=lo), aw=L.filter(q=>q.status==="awaiting"), up=(S.up||[]);
  const lane=(y,lab)=>'<div class="rd-lane" style="top:'+y+'px"><span>'+lab+'</span></div>';
  const stack={}; const dot=(x,lane,cls,tip,href,sz)=>{ const k=lane+':'+Math.round(x*1.5); const n=stack[k]=(stack[k]||0)+1; const ix=n-1, o=[0,-9,9][ix%3], step=[0,-1,1,-2,2,-3,3,-4,4][Math.floor(ix/3)]||0; x=Math.min(99.5,Math.max(0.5,x+step*1.2));

}

function lineChart(periods,series,{h=200,unit="",max}={}){ const W=560,H=h,pl=40,pb=26,pt=16, n=periods.length, cw=(W-pl-18)/Math.max(1,n-1);
  const all=series.flatMap(s=>periods.map(p=>s.v(p)).filter(v=>v!=null)); const top=max||Math.max(1,...all)*1.15; const Y=v=>H-pb-(H-pb-pt)*v/top, X=i=>pl+6+i*cw; const id='lg'+(++gid);
  let defs='<defs>'+series.map((s,k)=>'<linearGradient id="'+id+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+s.c+'" stop-opacity=".28"/><stop offset="1" stop-color="'+s.c+'" stop-opacity="0"/></linearGradient>').join("")+'</defs>';
  let g='<line class="base" x1="'+pl+'" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>'; [0.5,1].forEach(f=>{ const v=top*f/1.15; const y=Y(v); g+='<line class="gl" x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+unit+'</text>'; });
  const used=[];
  series.forEach((s,k)=>{ const pts=periods.map((p,i)=>[i,s.v(p)]).filter(x=>x[1]!=null); if(!pts.length) return; const d=pts.map(([i,v],j)=>(j?'L':'M')+X(i)+' '+Y(v)).join(' ');
    if(series.length<=2) g+='<path d="'+d+' L'+X(pts[pts.length-1][0])+' '+(H-pb)+' L'+X(pts[0][0])+' '+(H-pb)+' Z" fill="url(#'+id+k+')" class="area-in"/>';
    g+='<path d="'+d+'" fill="none" stroke="'+s.c+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="line-in" pathLength="1"/>'+pts.map(([i,v])=>'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4.5" fill="'+s.c+'" stroke="var(--surface)" stroke-width="2" class="pt-in" style="--d:'+(i*80+300)+'ms"/>').join("");
    const lp=pts[pts.length-1]; if(series.length<=4){ let ly=Y(lp[1])-11; while(used.some(u=>Math.abs(u-ly)<16)) ly+=18; used.push(ly); g+='<text x="'+(X(lp[0])-9)+'" y="'+ly+'" text-anchor="end" class="endlab" fill="'+s.c+'">'+Math.round(lp[1])+unit+'</text>'; } });
  periods.forEach((p,i)=>{ g+='<text class="ax" x="'+X(i)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(p.label)+'</text>';
    const tip='<b>'+esc(p.label)+'</b><br>'+series.map(s=>{ const v=s.v(p); return '<i class="tk" style="background:'+s.c+'"></i>'+esc(s.name)+': '+(v==null?'—':Math.round(v)+unit)+(s.extra?s.extra(p):''); }).join("<br>");
    g+='<g class="xh"><line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+pt+'" y2="'+(H-pb)+'"/><rect x="'+(X(i)-cw/2)+'" y="'+pt+'" width="'+cw+'" height="'+(H-pb-pt)+'" fill="transparent" data-tip="'+esc(tip)+'" tabindex="0"/></g>'; });
  return (series.length>1?'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.c+'"></i>'+esc(s.name)+'</span>').join("")+'</div>':'')+'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img">'+defs+g+'</svg></div>'; }
/* ranked bars: rank, gradient fill, grows in */
function hbars(items,{c="var(--c1)",unit=""}={}){ const mx=Math.max(1,...items.map(x=>x.v));
  return '<div class="chart"><div class="hb">'+items.map((x,i)=>'<div class="hb-r" data-tip="'+esc('<b>'+esc(x.k)+'</b><br>'+(x.tip||x.v+unit))+'" tabindex="0"><span class="hb-n">'+(i+1)+'</span><span class="hb-k">'+esc(x.k)+'</span><span class="hb-t"><i style="--w:'+Math.max(2,x.v/mx*100)+'%;--c:'+(x.c||c)+';--d:'+(i*70)+'ms"></i></span><b>'+x.v.toLocaleString()+unit+'</b></div>').join("")+'</div></div>'; }

S.focus=-1;

    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }

  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{
        if(window.matchMedia('(max-width:900px)').matches) set(true);
      });
    });
    wireFind();
  }

  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q');
        if(q){ q.focus(); q.select(); } }, 230);
    }
  });

  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }

  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name);
      return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go)=>{
      if(out.length<60) out.push({group,name,where,go,s:score(name)});
    };

    try{ (window.__imrSearch?window.__imrSearch():[]).forEach(x=>{ if(norm(x.name+' '+(x.where||'')).indexOf(t)<0) return; push(x.group,x.name,x.where,x.go); }); }catch(e){}

    const best={};
    out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['Waiting for IM','Rows in This Submission','Decided','Pages'];
    out.sort((a,b)=>
      (best[b.group]-best[a.group])
      || (ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      || (b.s-a.s)
      || String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function go(tab){
    const b=document.querySelector('.hq nav button[data-hq="'+tab+'"]');
    if(b && !b.hasAttribute('aria-current')) b.click();
  }

  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=''; rows=[]; picked=-1;
    if(!list.length){
      const n=document.createElement('div'); n.className='rh-none';
      n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return;
    }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group;
        const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); });
      rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }

  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx');
    if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value;
      if(x) x.hidden = !v;
      if(norm(v).length<2){ close(); return; }
      draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{
      if(!e.target.closest('.railfind')) close();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle,
    mini:()=>document.body.classList.contains('railmini') };
})();

(function theme(){
  var btn = document.getElementById("theme-btn");
  if(!btn) return;
  function cur(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint(){
    const dark = cur() === "dark";
    const lab = document.getElementById("theme-lab");
    if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode";
    else btn.textContent = dark ? "Light Mode" : "Dark Mode";
    btn.title = "Switch to " + (dark ? "light" : "dark") + " mode";
  }
  btn.addEventListener("click", function(){
    document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark");
    paint();
    try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  });
  try{
    var saved = localStorage.getItem("mismo.portal.theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  paint();
})();

</script>
