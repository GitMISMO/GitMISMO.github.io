<meta name="theme-color" content="#16A34A">
<!-- The MBA Accounting Desk (Jonna, 21 November 2026): Accounting's own view-only desk, like the Membership
     Desk for Member 360. It reads only accounting-desk/ in MISMO Money's store (relay key accounting-desk,
     written every morning by MISMO Money's scheduled check) and the CMS's Certification Completions file
     (relay key cert-completions). Nothing on it saves. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="/assets/session.js"></script>
<style>
:root{--navy:#0d314c;--sky:#74bfeb;--navy-deep:#06202f;--navy-mid:#14486e;--sky-soft:#a9d8f3;--sky-wash:#e4f2fb;
  --ground:#f1f6fa;--surface:#fff;--surface-2:#f6fafd;--surface-3:#e9f1f8;--sunk:#f6fafd;--border:#d5e2ed;--border-strong:#adc4d6;--rule:#e5eef5;--line:#e5eef5;
  --ink:#0d314c;--ink-2:#456179;--ink-3:#7794aa;--good:#0f7b5c;--bad:#b3372c;--warn:#a2701a;--accent-soft:#e4f2fb;--btn:#0d314c;--btn-ink:#fff;
  --display:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--ui:var(--display);--mono:var(--display);
  --hq-h:64px;--rail-w:240px;--rail-mini:62px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#123143;--border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;--ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;--good:#4fc79b;--bad:#f08579;--warn:#e0a83c;--accent-soft:#173c52;--btn:#74bfeb;--btn-ink:#06202f;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#061722;--surface:#0d2837;--surface-2:#123143;--surface-3:#173c52;--sunk:#123143;--border:#1f4a63;--border-strong:#2f6688;--rule:#173547;--line:#173547;--ink:#e9f4fb;--ink-2:#a6c5d9;--ink-3:#7a9db4;--good:#4fc79b;--bad:#f08579;--warn:#e0a83c;--accent-soft:#173c52;--btn:#74bfeb;--btn-ink:#06202f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* ===== the masthead and rail, copied from Summit HQ (mismo-left-nav) ===== */
.hqtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:97;height:var(--hq-h);background:var(--navy);color:#fff;display:flex;align-items:center;gap:0;padding:0 22px;box-shadow:0 1px 0 rgba(80,164,219,.28);margin-left:calc(0px - var(--rail-w));width:calc(100% + var(--rail-w));transition:margin-left .2s cubic-bezier(.4,0,.2,1),width .2s cubic-bezier(.4,0,.2,1)}
body.railmini .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
.hqtop .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;margin-inline:20px;border-radius:1px;background:var(--sky)}
.hqtop .hqname{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.005em;color:var(--sky);white-space:nowrap}
.hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px}
.hqtop .eyebrow-m{font-family:var(--display);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
@media(max-width:700px){.hqtop .eyebrow-m{display:none}}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;align-items:center;line-height:0;flex:0 0 auto;position:relative}
.logoplate .wordmark{height:24px;width:auto;display:block}
.santa{position:absolute;display:none;pointer-events:none;left:-9px;top:-12px;width:31px;height:31px}
html[data-season="december"] .santa{display:block}
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}
/* stand-in for the shared sign-in chip in this preview only (session.js draws the real one) */
.pv-who{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--navy);border-radius:4px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;white-space:nowrap}
.pv-who i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--sky-wash);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.pv-who em{font-style:normal;font-size:10px;opacity:.7}

.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden auto;overscroll-behavior:contain;box-shadow:1px 0 0 rgba(80,164,219,.22),4px 0 18px rgba(6,32,47,.14);transition:width .2s cubic-bezier(.4,0,.2,1)}
body{padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.hq.rail,body,.hqtop{transition:none}}
body.railmini{padding-left:var(--rail-mini)}
body.railmini .hq.rail{width:var(--rail-mini)}
body.railmini .rail-top{justify-content:center;padding:10px 0 9px}
body.railmini .rail-lbl{display:none}
body.railmini .railhide{margin:0}
body.railmini .railhide svg{transform:scaleX(-1)}
body.railmini .railfind{padding:9px 0 2px;display:flex;justify-content:center}
body.railmini .railfind .fi,body.railmini .railfind input,body.railmini .railq-x,body.railmini .railhits{display:none}
body.railmini .railfind-b{display:flex}
body.railmini .hq nav{padding:6px 0 4px;align-items:center;gap:4px}
body.railmini .hq nav button{width:42px;padding:10px 0;justify-content:center;border-radius:9px;box-shadow:none}
body.railmini .hq nav button span{display:none}
body.railmini .hq nav button svg{width:19px;height:19px}
body.railmini .hq nav button[aria-current]{background:var(--sky);color:var(--navy-deep)}
body.railmini .hq nav button[aria-current] svg{stroke:var(--navy-deep);opacity:1}
body.railmini .hq .mast-right{gap:3px;padding:8px 0 11px;align-items:center}
body.railmini .hq .mast-right .theme-btn{width:42px;padding:9px 0;font-size:0;justify-content:center;border-radius:9px}
body.railmini .hq .mast-right .theme-btn .ti{width:19px;height:19px}
body.railmini .hq .mast-right .theme-btn span{display:none}
body.railmini .hq .mast-right #theme-btn{margin-top:4px;padding-top:10px;border-radius:9px}
body.railmini .nb{display:none}
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);align-items:center;justify-content:center;padding:0}
.railfind-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.railfind-b:hover{background:rgba(255,255,255,.18);color:#fff}
.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;border-bottom:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.rail-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}
.railfind .fi{position:absolute;left:21px;top:20px;width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 26px 6px 30px}
.railfind input::placeholder{color:rgba(255,255,255,.5)}
.railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
.railfind input::-webkit-search-cancel-button{display:none}
.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0;cursor:pointer}
.railq-x:hover{background:rgba(255,255,255,.16);color:#fff}
.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;max-height:min(52vh,420px)}
.railhits .rh-g{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);font-family:var(--ui);cursor:pointer}
.railhits .rh:last-child{border-bottom:0}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.railhits .rh i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}
.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;position:relative}
.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid);box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.hq nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
/* the count on a nav item, squared like Elections HQ's */
.nb{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:4px;background:#c94a3b;color:#fff;text-align:center}
.nb.quiet{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .ti-moon{display:none}:root:not([data-theme="light"]) .theme-btn .ti-sun{display:block}}
.theme-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right #theme-btn{margin-top:5px;padding-top:11px;border-top:1px solid rgba(80,164,219,.18);border-radius:0 0 6px 6px}
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){body:not(.railmini){padding-left:var(--rail-mini)}body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}body:not(.railmini) .railscrim{display:block}}


/* sign-in, access and connection notices (resources.mismo.org) */
/* account button: squared corners, same as Team HQ */
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}

/* ===== the pages ===== */
main{max-width:1360px;margin:0 auto;padding:22px 26px 48px}
@media(max-width:700px){main{padding:16px 16px 40px}}
.view[hidden]{display:none}
.hero{position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(135deg,var(--navy-deep),var(--navy) 55%,var(--navy-mid));color:#fff;padding:20px 24px 22px;box-shadow:0 10px 30px rgba(6,32,47,.18)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(116,191,235,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(116,191,235,.08) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero>*{position:relative}
.hero .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:700}
.hero h1{margin:4px 0 6px;font-size:25px;letter-spacing:-.01em}
.hero p{margin:0;color:rgba(255,255,255,.8);font-size:14px;max-width:820px;line-height:1.5}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:4px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}
.navbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:4px;width:36px;height:36px;font-size:16px;cursor:pointer}
.navbtn:disabled{opacity:.35;cursor:default}
.hero select{background:#fff;color:var(--navy);border:0;border-radius:4px;padding:8px 10px;font-size:14px;font-weight:600;min-width:170px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}
.tile{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:12px 14px;min-width:0}
.tile b{display:block;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.tile span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.66);font-weight:600}
.tile i{display:block;font-style:normal;font-size:12px;color:rgba(255,255,255,.72);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:22px 0 10px}
.bar h2{margin:0;font-size:17px;flex:1 1 auto}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.find,.fld select{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:4px;padding:8px 10px;font-size:13.5px;max-width:100%}
.find{width:250px}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:4px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
:root[data-theme="dark"] .btn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card+.card{margin-top:16px}
.cardh{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--rule)}
.cardh h3{margin:0;font-size:15px}
.cardh .hint{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.cardp{padding:12px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.55;border-bottom:1px solid var(--rule)}
.tablewrap{overflow-x:auto}
/* the budget statement: no wrapping, the line names held in place while the months scroll */
.soa td,.soa th{white-space:nowrap}
.soa td:first-child,.soa th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--border)}
.soa th:first-child{background:var(--surface-2)}
.soa tr.sec td{background:var(--surface-3);font-weight:700;font-size:12.5px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.soa tr.tot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border)}
.soa tr.net td{font-weight:700;background:var(--accent-soft);border-top:2px solid var(--border-strong)}
.soa tr.kid td:first-child{color:var(--ink-2)}
.soa td.first,.soa th.first{border-left:2px solid var(--border)}
.soa .tw{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer}
.soa .tw i{display:inline-block;width:14px;font-style:normal;color:var(--ink-3);transition:transform .15s}
.soa .tw[aria-expanded="true"] i{transform:rotate(90deg)}
.soa .sp{display:inline-block;width:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;background:var(--surface-2);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
td.nw{white-space:nowrap}
td:has(>b){min-width:170px}
tbody tr.go{cursor:pointer}
tbody tr.go:hover td{background:var(--surface-2)}
tbody tr.go:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
td .sub{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
td.clip{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--ink-2);white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.monthrow td{background:var(--surface-3);font-weight:700;font-size:12.5px;color:var(--ink-2)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border);border-bottom:0}
.empty{padding:30px 20px;text-align:center;color:var(--ink-3)}
.note{margin:12px 2px 0;color:var(--ink-3);font-size:12.5px;line-height:1.55}
.nowed{margin:18px 0 0;padding:12px 14px;border:1px solid var(--border);border-left:3px solid var(--sky);border-radius:4px;background:var(--surface);font-weight:600;font-size:14px}
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3)}
.pager button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:4px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:4px;padding:3px 6px;font-size:12.5px}
.pager .sp{margin-left:auto}
.steps td.wait{color:var(--warn);font-weight:600}
.steps td.late{color:var(--bad);font-weight:600}
.steps td.done{color:var(--good);font-weight:600}
.steps td .sub{font-weight:400}
/* the right-hand panel */
.pane{position:fixed;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(980px,72vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(6,32,47,.18);z-index:96;transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
@media(max-width:1100px){.pane{width:100vw}}
@media (prefers-reduced-motion:reduce){.pane{transition:none}}
.pane.on{transform:none}
.pane-h{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--rule)}
.pane-h h2{margin:0;font-size:20px}
.pane-h .ps{font-size:13px;color:var(--ink-2);margin-top:3px}
.pane-x{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:4px;width:30px;height:30px;font-size:17px;cursor:pointer;flex:none}
.pane-b{padding:18px 22px 30px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sect{border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.sect h3{margin:0;padding:9px 14px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-bottom:2px solid var(--sky)}
.kv{display:grid;grid-template-columns:190px minmax(0,1fr)}
.kv div{padding:8px 14px;border-bottom:1px solid var(--rule);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.kv div:nth-child(odd){color:var(--ink-3)}
.kv div:nth-child(even){font-weight:600}
.kv div:nth-last-child(-n+2){border-bottom:0}
.txt{padding:10px 14px;font-size:13px;white-space:pre-wrap;line-height:1.5;border-bottom:1px solid var(--rule)}
.txt:last-child{border-bottom:0}
.txt b{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px}
.help h2{font-size:17px;margin:22px 0 6px}
.help p,.help li{font-size:14px;line-height:1.6;color:var(--ink-2);max-width:860px}
.stamp{color:var(--ink-3);font-size:12px;margin-top:10px}
.loading{padding:40px 20px;text-align:center;color:var(--ink-3)}
/* the Overview (Jonna, 21 Nov 2026: "visually awesome, but make sure it's useful") */
.ov-hero h1{font-size:28px}
.ov-hero .when{font-size:13px;color:var(--sky-soft);margin-top:2px}
.ovtile{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:background .15s,border-color .15s}
.ovtile:hover,.ovtile:focus-visible{background:rgba(255,255,255,.13);border-color:rgba(116,191,235,.55);outline:none}
.ovtile b{font-size:26px}
.ovgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
@media(max-width:900px){.ovgrid{grid-template-columns:minmax(0,1fr)}}
.ovcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ovcard.wide{grid-column:1/-1}
.ovh{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--rule)}
.ovh .ic{width:30px;height:30px;border-radius:4px;background:var(--sky-wash);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
:root[data-theme="dark"] .ovh .ic{background:var(--surface-3);color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ovh .ic{background:var(--surface-3);color:var(--sky)}}
.ovh .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ovh h3{margin:0;font-size:15px}
.ovh .go{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:4px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.ovh .go:hover{border-color:var(--sky);color:var(--ink)}
@media(max-width:700px){.ovh .go .gon{display:none}}
.ovb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-size:30px;letter-spacing:-.015em;line-height:1}
.big span{font-size:13px;color:var(--ink-3)}
.say{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:0}
.say.ok{padding:10px 12px;border-radius:4px;border-left:3px solid var(--good);background:color-mix(in srgb,var(--good) 9%,transparent);color:var(--ink);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mini{border:1px solid var(--rule);border-radius:6px;padding:9px 11px;background:var(--surface-2)}
.mini b{display:block;font-size:17px}
.mini span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
/* the close, as six steps across */
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.stepper .st{position:relative;padding:0 6px;text-align:center}
.stepper .st:before{content:"";position:absolute;top:15px;left:0;right:0;height:3px;background:var(--rule)}
.stepper .st:first-child:before{left:50%}.stepper .st:last-child:before{right:50%}
.stepper .st.done:before{background:var(--good)}
.stepper .dot{position:relative;z-index:1;margin:0 auto 8px;width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--border-strong);color:var(--ink-3)}
.stepper .done .dot{background:var(--good);border-color:var(--good);color:#fff}
.stepper .wait .dot{border-color:var(--sky);color:var(--navy);background:var(--sky-wash);box-shadow:0 0 0 4px color-mix(in srgb,var(--sky) 25%,transparent)}
.stepper .late .dot{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.stepper .lbl{font-size:12.5px;font-weight:700;line-height:1.3}
.stepper .who{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.stepper .due{font-size:11.5px;margin-top:3px;font-weight:600;color:var(--ink-2)}
.stepper .late .due{color:var(--bad)}
@media(max-width:700px){.stepper{grid-template-columns:minmax(0,1fr)}.stepper .st{display:grid;grid-template-columns:40px minmax(0,1fr);text-align:left;align-items:center;padding:4px 0}.stepper .st:before{display:none}.stepper .dot{margin:0}}
/* a stage-by-stage strip: one bar, labelled in place */
.flow{display:flex;flex-direction:column;gap:8px}
.flow .fr{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.flow .fr i{font-style:normal;color:var(--ink-2)}
.flow .fr em{font-style:normal;text-align:right;font-weight:700;white-space:nowrap}
.flow .trk{height:10px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.flow .trk u{display:block;height:100%;background:var(--sky);border-radius:2px}
.flow .fr.mine .trk u{background:var(--warn)}
/* column charts, values on top, months below */
.cols{width:100%;height:auto;display:block}
.cols text{font-family:inherit;fill:var(--ink-3);font-size:11px}
.cols text.v{fill:var(--ink-2);font-weight:700}
.cols rect{fill:var(--sky)}
.cols rect.now{fill:var(--navy)}
:root[data-theme="dark"] .cols rect.now{fill:#e9f4fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cols rect.now{fill:#e9f4fb}}
.toplist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.toplist li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;cursor:pointer}
.toplist li:hover b{text-decoration:underline}
.toplist li b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist li span{color:var(--ink-3);white-space:nowrap;font-size:12px}
.toplist li em{font-style:normal;font-weight:700;white-space:nowrap}
.ovnote{font-size:12px;color:var(--ink-3);margin:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:start}
.ovcol{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.hqtop{padding:0 12px}.hqtop .mastrule{margin-inline:10px}.hqtop .hqname{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}.hero{padding:18px 16px}.find{width:100%}.bar .fld{flex:1 1 100%}}
/* an invoice's PDF, inside the panel */
.btn.ghost{background:var(--surface);color:var(--navy);border-color:var(--border-strong,#adc4d6)}
.pdfbar{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px 14px}
.pdfview{display:block;width:100%;height:72vh;border:0;border-top:1px solid var(--line, var(--rule))}
.oldfiles{list-style:none;margin:0;padding:0}
.oldfiles li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 14px;border-top:1px solid var(--line, var(--rule))}
.oldfiles .ofn{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.oldfiles .pdfbar{padding:0;gap:8px}
.oldimg{display:block;max-width:100%;border-top:1px solid var(--line, var(--rule))}
</style>

    var out = [], d = new Date(); d.setDate(1);
    for (var i = 0; i < n; i++) { out.unshift(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); d.setMonth(d.getMonth() - 1); }
    return out;
  }
  function shortMon(k) { return MON[+k.slice(5, 7) - 1].slice(0, 3); }
  function drawOverview() {
    var now = new Date(), thisM = lastMonths(1)[0], six = lastMonths(6);
    var hour = now.getHours(), hello = hour < 12 ? "Good Morning" : hour < 17 ? "Good Afternoon" : "Good Evening";
    var who = ((window.ResourcesSession && ResourcesSession.current && ResourcesSession.current()) || {}).name || "";
    var first = String(who).split(/\s+/)[0];
    var cards = [], tiles = [];

    /* the close */
    var months = (D.close && D.close.months) || [], cm = months.filter(function (m) { return m.ended && !m.complete; }).pop() || months.filter(function (m) { return m.ended; })[0];
    if (cm) {
      var next = cm.steps.filter(function (s) { return s.state === "waiting"; })[0];
      var stepper = '<div class="stepper">' + cm.steps.map(function (s, i) {
        var c = stepCell(s).cls;
        return '<div class="st ' + c + '"><div class="dot">' + (c === "done" ? "&#10003;" : i + 1) + '</div><div><div class="lbl">' + esc(s.label) + '</div><div class="who">' + esc(s.who) + "</div>" +
          (s.due ? '<div class="due">' + esc(s.due) + "</div>" : "") + "</div></div>";
      }).join("") + "</div>";
      var others = months.filter(function (m) { return m.ended && !m.complete && m !== cm; });
      cards.push(ovCard("close", "Monthly Close", '<div class="big"><b>' + esc(cm.label) + "</b><span>" + (cm.complete ? "closed" : next ? "next: " + esc(next.label) + ", waiting on " + esc(next.who) : "") + "</span></div>" + stepper +
        (others.length ? '<p class="ovnote">Also not closed yet: ' + others.map(function (m) { return esc(m.label) + " (" + esc(m.line.replace(/^[^:]*: /, "").replace(/\.$/, "")) + ")"; }).join(", ") + ".</p>" : ""), true));
      tiles.push(['close', "Close in Progress", cm.label, cm.complete ? "closed" : next ? "waiting on " + next.who : ""]);
    }

    /* receivables */
    var a = D.ar;
    if (a) {
      var open = (a.items || []).filter(function (r) { return r.status === "Open"; }).sort(function (x, y) { return (y.amount || 0) - (x.amount || 0); });
      var body = '<div class="big"><b>' + usd(a.owedTotal, 1) + "</b><span>still owed to MISMO" + (open.length ? ", " + open.length + (open.length === 1 ? " order" : " orders") : "") + "</span></div>";
      if (!open.length) body += '<p class="say ok">Nothing is owed to MISMO right now.</p>';
      else body += '<ul class="toplist">' + open.slice(0, 5).map(function (r) { return '<li data-ovar="' + esc(r.key) + '"><b>' + esc(r.company) + "</b><span>" + esc(day(r.invoicedOn)) + "</span><em>" + usd(r.amount) + "</em></li>"; }).join("") + "</ul>";
      if (a.owedOver90 && a.owedOver90.count) body += '<p class="say">' + usd(a.owedOver90.amount, 1) + " of it is over 90 days old.</p>";
      cards.push(ovCard("ar", "Receivables", body));
      tiles.push(['ar', "Still Owed to MISMO", usd(a.owedTotal, 1), open.length ? open.length + " open" : "nothing owed"]);
    }

    /* invoices: the newest service month that is over, and what is waiting for approval */
    var inv = (D.invoices && D.invoices.rows) || [];
    if (inv.length) {
      var ms = Object.keys(inv.reduce(function (o, r) { if (r.serviceMonth && r.serviceMonth < thisM) o[r.serviceMonth] = 1; return o; }, {})).sort();
      var lm = ms[ms.length - 1] || "", inLm = inv.filter(function (r) { return r.serviceMonth === lm; });
      /* Jonna, 21 Nov 2026: "31 of what is not approved?" An invoice is waiting for approval only while it
         has no Approved date and is not paid. "In NetSuite" comes after approval, so it is not waiting. */
      var since = lastMonths(4)[0];
      var waiting = inv.filter(function (r) { return r.serviceMonth >= since && r.serviceMonth <= thisM && r.sentToAp && !r.approved && !r.paid; })
        .sort(function (x, y) { return (y.amount || 0) - (x.amount || 0); });
      var wAmt = sum(waiting, function (r) { return r.amount; });
      var body2 = '<div class="big"><b>' + usd(sum(inLm, function (r) { return r.amount; }), 1) + "</b><span>" + inLm.length + " invoices for " + esc(monthName(lm)) + "</span></div>" +
        (waiting.length ? '<p class="say">' + waiting.length + (waiting.length === 1 ? " invoice is" : " invoices are") + " sent to AP and waiting for approval (work done since " + esc(monthName(since)) + "):</p>" +
          '<ul class="toplist">' + waiting.slice(0, 5).map(function (r) { return '<li data-ovinv="' + esc(r.id) + '"><b>' + esc(r.vendor) + "</b><span>" + esc(monthName(r.serviceMonth)) + "</span><em>" + usd(r.amount) + "</em></li>"; }).join("") + "</ul>"
          : '<p class="say ok">Every invoice sent to AP for work done since ' + esc(monthName(since)) + " is approved.</p>");
      cards.push(ovCard("invoices", "Invoices", body2));
      tiles.push(['invoices', "Invoices to Approve", String(waiting.length), waiting.length ? usd(wAmt, 1) + " sent to AP" : "all approved since " + monthName(since)]);
    }

    /* members */
    var mem = (D.members && D.members.rows) || [];
    if (mem.length) {
      var inThis = mem.filter(function (r) { return r.month === thisM; });
      var nN = inThis.filter(function (r) { return r.kind === "New Member"; }).length, nR = inThis.length - nN;
      var pts = six.map(function (k) { return { k: k, label: shortMon(k), v: mem.filter(function (r) { return r.month === k; }).length }; });
      cards.push(ovCard("members", "New and Renewing Members", '<div class="minis">' + mini("New This Month", String(nN)) + mini("Renewals This Month", String(nR)) +
        mini("Paid This Month", usd(sum(inThis, function (r) { return r.paid; }), 1)) + '</div><p class="ovnote">New members and renewals together, the last six months</p>' + columns(pts, false)));
      tiles.push(['members', "Members This Month", String(inThis.length), nN + " new, " + nR + " renewing"]);
    }

    /* certifications */
    var cr = (D.certs && D.certs.rows) || [];
    if (cr.length) {
      var cThis = cr.filter(function (r) { return r.month === thisM; });
      var unpaid = cr.filter(function (r) { return r.order && !r.paidOn && r.balance !== 0; });
      var cpts = six.map(function (k) { return { k: k, label: shortMon(k), v: cr.filter(function (r) { return r.month === k; }).length }; });
      cards.push(ovCard("certs", "Certification Complete", '<div class="minis">' + mini("Completed This Month", String(cThis.length)) + mini("Fees This Month", usd(sum(cThis, function (r) { return r.fee; }), 1)) +
        mini("Not Shown as Paid", String(unpaid.length)) + '</div><p class="ovnote">Certifications completed, the last six months</p>' + columns(cpts, false)));
    }

    /* IIF */
    var iif = (D.iif && D.iif.rows) || [];
    if (iif.length) {
      var fy = iif.map(function (r) { return r.fy; }).sort().pop();
      var inFy = iif.filter(function (r) { return r.fy === fy; });
      var ipts = six.map(function (k) { return { k: k, label: shortMon(k), v: sum(iif.filter(function (r) { return r.month === k; }), function (r) { return r.amount; }) }; });
      var m3 = D.iif.member360 || {};
      cards.push(ovCard("iif", "IIF Payments", '<div class="split"><div class="ovcol"><div class="big"><b>' + usd(sum(inFy, function (r) { return r.amount; }), 1) + "</b><span>collected in " + esc(fy) + "</span></div>" +
        '<div class="minis">' + mini("Payments", String(inFy.length)) + mini("Companies", String(Object.keys(inFy.reduce(function (o, r) { o[r.company] = 1; return o; }, {})).length)) + "</div>" +
        (m3.iif_lender_members ? '<p class="ovnote">Member 360&rsquo;s IIF cycle ' + esc(m3.iif_year) + ": " + esc(m3.iif_paid_in_full) + " paid in full, " + esc(m3.iif_partly_paid) + " partly paid.</p>" : "") +
        '</div><div class="ovcol"><p class="ovnote">Collected by month, the last six months</p>' + columns(ipts, true) + "</div></div>", true));
      tiles.push(['iif', "IIF Collected", usd(sum(inFy, function (r) { return r.amount; }), 1), fy + " to date"]);
    }

    /* workgroup sponsorships */
    var wgr = (D.wg && D.wg.rows) || [];
    if (wgr.length) {
      var wthru = D.wg.earnedThrough, wopen = wgr.filter(function (r) { return wgState(r, wthru) !== "Finished"; });
      var wleft = sum(wgr, function (r) { return r.toEarn; });
      cards.push(ovCard("wg", "Workgroup Sponsorships", '<div class="big"><b>' + usd(wleft, 1) + "</b><span>still to earn at the end of " + esc(monthName(wthru)) + "</span></div>" +
        (wopen.length ? '<ul class="toplist">' + wopen.map(function (r) { return '<li data-ovwg="' + esc(r.order) + '"><b>' + esc(r.company) + "</b><span>" + esc(day(r.start)) + " to " + esc(day(r.end)) + "</span><em>" + usd(r.amount) + "</em></li>"; }).join("") + "</ul>"
          : '<p class="say ok">Every sponsorship paid so far has been fully earned.</p>')));
    }

    var dateSay = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    $("v-overview").innerHTML =
      '<div class="hero ov-hero"><div class="eyebrow">For Accounting</div><h1>' + esc(hello + (first ? ", " + first : "")) + '</h1><div class="when">' + esc(dateSay) + "</div>" +
      "<p>Where MISMO&rsquo;s books stand today: the close, what is still owed, invoices waiting for approval, members, certifications, the IIF and workgroup sponsorships. Click anything to see the detail.</p>" +
      '<div class="tiles">' + tiles.map(function (t) { return '<button type="button" class="tile ovtile" data-ovgo="' + t[0] + '"><span>' + esc(t[1]) + "</span><b>" + esc(t[2]) + "</b><i>" + esc(t[3]) + "</i></button>"; }).join("") + "</div></div>" +
      '<div class="ovgrid">' + cards.join("") + "</div>" +
      '<p class="stamp">' + esc(stamp(D.ar && D.ar.writtenAt)) + "</p>";
    document.querySelectorAll("#v-overview [data-ovgo]").forEach(function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-ovgo")); }); });
    document.querySelectorAll("#v-overview [data-ovinv]").forEach(function (li) { li.addEventListener("click", function () {
      var k = li.getAttribute("data-ovinv"); show("invoices").then(function () { var r = D.invoices.rows.filter(function (x) { return x.id === k; })[0]; if (r) invOpen(r); }); }); });
    document.querySelectorAll("#v-overview [data-ovar]").forEach(function (li) { li.addEventListener("click", function () {
      var k = li.getAttribute("data-ovar"); show("ar").then(function () { var r = D.ar.items.filter(function (x) { return x.key === k; })[0]; if (r) arOpen(r); }); }); });
    document.querySelectorAll("#v-overview [data-ovwg]").forEach(function (li) { li.addEventListener("click", function () {
      var k = li.getAttribute("data-ovwg"); show("wg").then(function () { var r = D.wg.rows.filter(function (x) { return x.order === k; })[0]; if (r) wgOpen(r); }); }); });
  }

  function drawHelp() {
    $("v-help").innerHTML = '<section class="hero"><div class="eyebrow">For Accounting</div><h1>Help</h1><p>This desk is view only. Nothing here can be changed, and nothing you do here changes MISMO&rsquo;s records.</p></section>' +
      "<h2>Overview</h2><p>The desk opens here. The tiles across the top are today&rsquo;s headline numbers, and each card below shows one part: the month being closed and which of its six steps is next, what is still owed to MISMO, invoices sent to AP that are still waiting for approval, new and renewing members, certifications, IIF payments and workgroup sponsorships. Click a tile, a card&rsquo;s Open button or a receivable to go to its page.</p>" +
      "<h2>Certification Complete</h2><p>Every certification the CMS recorded as complete, with its Aptify order, fee, payment and the assessor&rsquo;s fee. It is the same list as the Certification Completions page.</p>" +
      "<h2>Invoices</h2><p>Every contractor and expense invoice MISMO logs and sends to AP, by the month the work was done, with when it went to AP, its NetSuite number, when it was approved and paid. Where MISMO has the invoice itself, its panel has View the Invoice, which opens the PDF right there, and Save a Copy. Invoices logged on MISMO&rsquo;s Invoice Log since October 2026 carry their PDF. Older invoices show the files that were attached to them on the old Invoice Tracking sheet (the invoice, and often the approval and payment emails): View opens a PDF or picture in the panel, and Save a Copy saves any of them. An email file (.msg) opens in Outlook once saved.</p>" +
      "<h2>Monthly Close</h2><p>Each month&rsquo;s six close steps and who each one waits on. Open a month to see each step&rsquo;s date and note, and the Monthly Summary exactly as MISMO sent it.</p>" +
      "<h2>Receivables</h2><p>Your AR aging as MISMO reads it. Each morning MISMO checks every item against the Aptify payments. An item paid since your report shows as Paid. When something is still owed, the list opens on the open items. Once Aptify's Monday workbook carries each order's status and balance, this becomes what is still owed on Aptify's own orders (every order Shipped with a balance over $0), and the AR aging is no longer needed.</p>" +
      "<h2>New and Renewing Members</h2><p>New members and 2027 renewals from Member 360, by month, with the payments MISMO holds for each and its membership term (when it starts and ends, and whether it is a dues deal). Pick a month or a year, or choose All Time and search.</p>" +
      "<h2>FY 2027 Approved Budget</h2><p>MISMO&rsquo;s budget for the fiscal year, laid out like the Statement of Activities: Revenue, Expenses and Net, with Year to Date (the months that have ended) and the Full Year first, then every month from October to September. Lines start folded to their main lines; click a line with an arrow to see the lines under it, or Expand All. It is view only, exactly as MISMO Money shows it. Download for Excel saves every line.</p>" +
      "<h2>IIF Payments</h2><p>Every Innovation Investment Fee payment, by fiscal year or month, with Member 360&rsquo;s count of lenders paid in full and partly paid.</p>" +
      "<h2>Workgroup Sponsorships</h2><p>Every workgroup and community of practice sponsorship MISMO has been paid for, for accrual: the sponsor, the Aptify order, when it was paid and how much, and when it starts and ends. Each one is earned evenly over the months it runs (the last month takes any leftover cents). The list shows what is earned through the last month that has ended and what is still to earn. Open one to see it month by month and by fiscal year. Sponsorships ordered in Aptify but not paid yet are listed below, apart; they are not counted until they are paid.</p>" +
      "<h2>When It Is Brought Up to Date</h2><p>Every morning, from MISMO Money, Member 360 and the CMS. Each tab says when its copy was made. Download for Excel saves what the list shows, with every page, as a spreadsheet file.</p>";
  }

  /* ---- tabs ---- */
  var DRAW = { overview: drawOverview, certs: drawCerts, invoices: drawInvoices, close: drawClose, ar: drawAr, members: drawMembers, iif: drawIif, wg: drawWg, budget: drawBudget, help: drawHelp };
  var CUR = "overview";
  function show(tab) {
    if (!DRAW[tab]) tab = "overview";
    CUR = tab; closePane();
    document.querySelectorAll(".hq nav button[data-hq]").forEach(function (b) { if (b.dataset.hq === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    document.querySelectorAll("main .view").forEach(function (v) { v.hidden = v.id !== "v-" + tab; });
    try { history.replaceState(null, "", "#" + tab); } catch (e) {}
    keep("tab", tab);
    if (tab === "help") { drawHelp(); return Promise.resolve(); }
    if (tab === "overview") {
      var all = Object.keys(FILES).concat(["certs"]).map(function (t) { return load(t)["catch"](function () { return null; }); });
      return Promise.all(all).then(function () { if (CUR === "overview") drawOverview(); });
    }
    return load(tab).then(function () { if (CUR === tab) DRAW[tab](); }, function (e) { console.error("desk", tab, e); if (CUR === tab) failSay(tab, e); });
  }
  window.__desk = { show: show, data: D, load: load, open: function (tab, test) {
    return show(tab).then(function () { var rows = []; if (tab === "ar") rows = D.ar.items; else if (tab === "invoices") rows = D.invoices.rows; else if (tab === "members") rows = D.members.rows; else if (tab === "certs") rows = D.certs.rows; else if (tab === "wg") rows = D.wg.rows;
      var r = rows.filter(test)[0]; if (r) ({ ar: arOpen, invoices: invOpen, members: memOpen, certs: certOpen, wg: wgOpen })[tab](r); return !!r; }); } };

  function start() {
    var rs = window.ResourcesSession; if (!rs) { setTimeout(start, 100); return; }
    rs.requireAccess(PROJECT, { toolName: "MBA Accounting Desk", eyebrow: "Programs & Operations" }).then(function () {
      document.querySelectorAll(".hq nav button[data-hq]").forEach(function (b) { b.addEventListener("click", function () { show(b.dataset.hq); }); });
      $("pane-x").addEventListener("click", closePane);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("pane").classList.contains("on")) closePane(); });
      var h = String(location.hash || "").replace("#", "");
      show(DRAW[h] ? h : "overview");
      /* load the other tabs quietly so the search can find things on them */
      setTimeout(function () { Object.keys(FILES).concat(["certs"]).forEach(function (t) { load(t)["catch"](function () {}); }); }, 1200);
    })["catch"](function (e) { console.error("desk", e); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
  if (new Date().getMonth() === 11) document.documentElement.setAttribute("data-season", "december");

  /* the rail search's sources (see gather below) */
  window.__deskFind = function (t, push, go) {
    var open = function (tab, test) { return function () { window.__desk.open(tab, test); }; };
    ((D.ar && D.ar.items) || []).forEach(function (r) { if ((r.company + " " + r.order).toLowerCase().indexOf(t) >= 0) push("Receivables", r.company, "Order " + r.order + " · " + r.status + " · " + usd(r.amount), open("ar", function (x) { return x.key === r.key; })); });
    ((D.invoices && D.invoices.rows) || []).forEach(function (r) { if ((r.vendor + " " + r.invoiceNo + " " + r.netsuite).toLowerCase().indexOf(t) >= 0) push("Invoices", r.vendor, (r.invoiceNo || "") + " · " + monthName(r.serviceMonth) + " · " + usd(r.amount), open("invoices", function (x) { return x.id === r.id; })); });
    ((D.members && D.members.rows) || []).forEach(function (r) { if ((r.company + " " + r.companyId).toLowerCase().indexOf(t) >= 0) push("New and Renewing Members", r.company, r.kind + " · " + day(r.date), open("members", function (x) { return x === r; })); });
    ((D.certs && D.certs.rows) || []).forEach(function (r) { if ((r.org + " " + (r.order || "")).toLowerCase().indexOf(t) >= 0) push("Certification Complete", r.org, r.program + " · " + day(r.completedOn), open("certs", function (x) { return x === r; })); });
    ((D.wg && D.wg.rows) || []).forEach(function (r) { if ((r.company + " " + r.group + " " + r.order).toLowerCase().indexOf(t) >= 0) push("Workgroup Sponsorships", r.company, r.group + " · " + day(r.start) + " to " + day(r.end), open("wg", function (x) { return x === r; })); });
    ((D.iif && D.iif.rows) || []).forEach(function (r) { if ((r.company + " " + r.order).toLowerCase().indexOf(t) >= 0) push("IIF Payments", r.company, day(r.on) + " · " + usd(r.amount), function () { FS.period = "all"; FS.q = r.company; go("iif"); setTimeout(function () { drawIif(); }, 50); }); });
  };
})();
</script>
<script>
/* the rail: collapse, remember, search (Summit HQ's, as-is apart from gather) */
(function(){
  "use strict";
  const KEY='hq.rail.off';
  const rail=()=>document.getElementById('rail');

  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }

  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{
        if(window.matchMedia('(max-width:900px)').matches) set(true);
      });
    });
    wireFind();
  }

  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q');
        if(q){ q.focus(); q.select(); } }, 230);
    }
  });

  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }

  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name);
      return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go)=>{
      if(out.length<60) out.push({group,name,where,go,s:score(name)});
    };

    try{ if(window.__deskFind) window.__deskFind(t, push, go); }catch(e){}

    const best={};
    out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['Receivables','Invoices','Certification Complete','New and Renewing Members','IIF Payments','Workgroup Sponsorships'];
    out.sort((a,b)=>
      (best[b.group]-best[a.group])
      || (ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      || (b.s-a.s)
      || String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function go(tab){
    const b=document.querySelector('.hq nav button[data-hq="'+tab+'"]');
    if(b && !b.hasAttribute('aria-current')) b.click();
  }

  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=''; rows=[]; picked=-1;
    if(!list.length){
      const n=document.createElement('div'); n.className='rh-none';
      n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return;
    }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group;
        const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); });
      rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }

  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx');
    if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value;
      if(x) x.hidden = !v;
      if(norm(v).length<2){ close(); return; }
      draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{
      if(!e.target.closest('.railfind')) close();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle,
    mini:()=>document.body.classList.contains('railmini') };
})();

(function theme(){
  var btn = document.getElementById("theme-btn");
  if(!btn) return;
  function cur(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint(){
    const dark = cur() === "dark";
    const lab = document.getElementById("theme-lab");
    if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode";
    else btn.textContent = dark ? "Light Mode" : "Dark Mode";
    btn.title = "Switch to " + (dark ? "light" : "dark") + " mode";
  }
  btn.addEventListener("click", function(){
    document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark");
    paint();
    try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  });
  try{
    var saved = localStorage.getItem("mismo.portal.theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  paint();
})();
</script>
